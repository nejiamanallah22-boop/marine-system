<!-- public/pages/users.html -->
<div id="page-users">
    <style>
        #page-users{width:100%;max-width:100%;padding:20px;margin:0;font-family:'Cairo',sans-serif;background:#0a0e1a;color:#e8edf5;min-height:100vh;position:relative;z-index:1}
        /* ... باقي التصميمات (نفسها كما في السابق) ... */
    </style>

    <!-- HEADER -->
    <div class="users-header">
        <div class="users-header-left">
            <div class="icon"><i class="fas fa-users"></i></div>
            <div>
                <h2>إدارة المستخدمين</h2>
                <p>إدارة حسابات المستخدمين</p>
            </div>
        </div>
        <div class="users-header-actions">
            <button class="btn-action primary" id="refreshBtn"><i class="fas fa-sync-alt"></i> تحديث</button>
            <button class="btn-action success" id="addUserBtn"><i class="fas fa-user-plus"></i> إضافة مستخدم</button>
            <button class="btn-action secondary" onclick="window.print()"><i class="fas fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- STATS -->
    <div class="users-stats">
        <div class="stat-card"><div class="number" id="totalUsers">0</div><div class="label">👥 إجمالي المستخدمين</div></div>
        <div class="stat-card"><div class="number green" id="activeUsers">0</div><div class="label">🟢 نشط</div></div>
        <div class="stat-card"><div class="number red" id="inactiveUsers">0</div><div class="label">🔴 غير نشط</div></div>
        <div class="stat-card"><div class="number gold" id="adminUsers">0</div><div class="label">🛡️ مدراء</div></div>
        <div class="stat-card"><div class="number purple" id="verifiedUsers">0</div><div class="label">✅ موثقو الوجه</div></div>
    </div>

    <!-- FILTERS -->
    <div class="filter-bar">
        <label><i class="fas fa-search"></i> بحث</label>
        <input type="text" id="searchUser" placeholder="اسم المستخدم، البريد...">
        <label><i class="fas fa-filter"></i> الوحدة</label>
        <select id="fUnitUser">
            <option value="الكل">🌍 جميع الوحدات</option>
            <!-- باقي الخيارات -->
        </select>
        <label><i class="fas fa-circle"></i> الحالة</label>
        <select id="fStatusUser">
            <option value="الكل">📊 جميع الحالات</option>
            <option value="نشط">🟢 نشط</option>
            <option value="غير نشط">🔴 غير نشط</option>
        </select>
        <label><i class="fas fa-user-tag"></i> الدور</label>
        <select id="fRoleUser">
            <option value="الكل">👤 جميع الأدوار</option>
            <option value="super_admin">👑 سوبر أدمن</option>
            <option value="admin">🛡️ مدير</option>
            <option value="user">👤 مستخدم</option>
            <option value="operator">🔧 مشغل</option>
            <option value="viewer">📡 مشاهد</option>
        </select>
        <button class="btn-filter primary" id="filterBtn"><i class="fas fa-filter"></i> فلترة</button>
        <button class="btn-filter outline" id="resetBtn"><i class="fas fa-undo-alt"></i> إلغاء</button>
    </div>

    <!-- TABLE -->
    <div class="users-section">
        <div class="section-header">
            <h3><i class="fas fa-list-ul"></i> قائمة المستخدمين</h3>
            <span class="badge blue" id="usersBadge">📊 جاري التحميل...</span>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="text-align:right;"><i class="fas fa-hashtag"></i> #</th>
                        <th style="text-align:right;"><i class="fas fa-user"></i> الاسم</th>
                        <th><i class="fas fa-envelope"></i> البريد</th>
                        <th><i class="fas fa-building"></i> الوحدة</th>
                        <th><i class="fas fa-user-tag"></i> الدور</th>
                        <th><i class="fas fa-circle"></i> الحالة</th>
                        <th><i class="fas fa-camera"></i> الوجه</th>
                        <th><i class="fas fa-cogs"></i> الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                    <tr>
                        <td colspan="8" style="text-align:center;padding:40px;color:rgba(255,255,255,0.15);">
                            <div style="font-size:2rem;margin-bottom:10px;">👥</div>
                            جاري تحميل المستخدمين من الخادم...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODALS... (نفسها كما في السابق) -->

    <!-- ============================================================
    JAVASCRIPT - BACKEND INTEGRATION
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            console.log('👥 Users Page - Backend Integration...');

            // ============================================================
            // 🔧 HELPERS
            // ============================================================

            function getToken() {
                return localStorage.getItem('token') || localStorage.getItem('accessToken');
            }

            function getAuthHeaders() {
                const token = getToken();
                return {
                    'Content-Type': 'application/json',
                    'Authorization': token ? 'Bearer ' + token : ''
                };
            }

            function showToast(msg, type) {
                type = type || 'info';
                var old = document.querySelector('.toast');
                if (old) old.remove();
                var n = document.createElement('div');
                n.className = 'toast toast-' + (type || 'info');
                n.textContent = msg;
                document.body.appendChild(n);
                setTimeout(function() {
                    n.style.opacity = '0';
                    n.style.transform = 'translateY(20px)';
                    n.style.transition = 'all 0.4s';
                    setTimeout(function() { n.remove(); }, 400);
                }, 2500);
            }

            function getRoleLabel(role) {
                var map = { super_admin: '👑 سوبر أدمن', admin: '🛡️ مدير', user: '👤 مستخدم', operator: '🔧 مشغل',
                    viewer: '📡 مشاهد' };
                return map[role] || role;
            }

            function getRoleClass(role) {
                var map = { super_admin: 'super_admin', admin: 'admin', user: 'user', operator: 'operator',
                    viewer: 'viewer' };
                return map[role] || 'user';
            }

            function getStatusClass(status) {
                return status === 'نشط' ? 'active' : 'inactive';
            }

            var usersData = [];
            var filteredData = [];
            var currentEditId = null;

            // ============================================================
            // 📊 STATS
            // ============================================================

            function updateStats() {
                var total = usersData.length;
                var active = usersData.filter(function(u) { return u.status === 'نشط'; }).length;
                var inactive = usersData.filter(function(u) { return u.status === 'غير نشط'; }).length;
                var admins = usersData.filter(function(u) { return u.role === 'admin' || u.role === 'super_admin'; })
                .length;
                var verified = usersData.filter(function(u) { return u.faceVerified === true; }).length;

                document.getElementById('totalUsers').textContent = total;
                document.getElementById('activeUsers').textContent = active;
                document.getElementById('inactiveUsers').textContent = inactive;
                document.getElementById('adminUsers').textContent = admins;
                document.getElementById('verifiedUsers').textContent = verified;

                var badge = document.getElementById('usersBadge');
                if (badge) {
                    badge.textContent = '👥 ' + total + ' مستخدم';
                    badge.className = 'badge blue';
                }
            }

            // ============================================================
            // 📋 LOAD USERS FROM SERVER
            // ============================================================

            async function loadUsers() {
                console.log('📡 جلب المستخدمين من الخادم...');

                var tbody = document.getElementById('usersBody');
                if (tbody) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="8" style="text-align:center;padding:40px;color:rgba(255,255,255,0.15);">
                                <div style="font-size:2rem;margin-bottom:10px;">⏳</div>
                                جاري التحميل من الخادم...
                            </td>
                        </tr>
                    `;
                }

                try {
                    var token = getToken();
                    if (!token) {
                        showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
                        return;
                    }

                    var response = await fetch('/api/users', {
                        headers: getAuthHeaders()
                    });

                    if (!response.ok) {
                        if (response.status === 401) {
                            localStorage.removeItem('token');
                            localStorage.removeItem('accessToken');
                            window.location.href = '/index.html';
                            return;
                        }
                        throw new Error('فشل تحميل البيانات');
                    }

                    var data = await response.json();
                    usersData = data.users || [];
                    filteredData = usersData.slice();

                    updateStats();
                    renderTable();
                    showToast('✅ تم تحميل ' + usersData.length + ' مستخدم من الخادم', 'success');

                } catch (error) {
                    console.error('❌ خطأ:', error);
                    showToast('❌ ' + error.message, 'error');
                }
            }

            // ============================================================
            // 📋 RENDER TABLE
            // ============================================================

            function renderTable() {
                var search = document.getElementById('searchUser');
                var unitFilter = document.getElementById('fUnitUser');
                var statusFilter = document.getElementById('fStatusUser');
                var roleFilter = document.getElementById('fRoleUser');

                var searchVal = search ? search.value.toLowerCase() : '';
                var unitVal = unitFilter ? unitFilter.value : 'الكل';
                var statusVal = statusFilter ? statusFilter.value : 'الكل';
                var roleVal = roleFilter ? roleFilter.value : 'الكل';

                filteredData = usersData.filter(function(u) {
                    if (searchVal && !u.name.includes(searchVal) && !u.email.includes(searchVal)) return false;
                    if (unitVal !== 'الكل' && u.unit !== unitVal) return false;
                    if (statusVal !== 'الكل' && u.status !== statusVal) return false;
                    if (roleVal !== 'الكل' && u.role !== roleVal) return false;
                    return true;
                });

                var tbody = document.getElementById('usersBody');
                if (!tbody) return;

                if (filteredData.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="8" style="text-align:center;padding:40px;color:rgba(255,255,255,0.15);">
                                <div style="font-size:2rem;margin-bottom:10px;">🔍</div>
                                لا توجد نتائج مطابقة
                            </td>
                        </tr>
                    `;
                    return;
                }

                var html = '';
                filteredData.forEach(function(u, index) {
                    var verifiedHtml = u.faceVerified ?
                        '<span class="verified-badge yes"><i class="fas fa-check-circle"></i> موثق</span>' :
                        '<span class="verified-badge no"><i class="fas fa-times-circle"></i> غير موثق</span>';

                    html += `
                        <tr>
                            <td style="font-weight:600;color:#60a5fa;">${index + 1}</td>
                            <td class="user-name" style="text-align:right;">${u.name}</td>
                            <td style="color:rgba(255,255,255,0.4);font-size:0.7rem;">${u.email}</td>
                            <td style="font-size:0.7rem;color:rgba(255,255,255,0.3);">${u.unit}</td>
                            <td><span class="status-badge ${getRoleClass(u.role)}">${getRoleLabel(u.role)}</span></td>
                            <td><span class="status-badge ${getStatusClass(u.status)}">${u.status === 'نشط' ? '🟢 نشط' : '🔴 غير نشط'}</span></td>
                            <td>${verifiedHtml}</td>
                            <td>
                                <button class="action-btn edit" onclick="editUser('${u._id}')"><i class="fas fa-edit"></i></button>
                                <button class="action-btn password" onclick="changePassword('${u._id}')"><i class="fas fa-key"></i></button>
                                <button class="action-btn delete" onclick="deleteUser('${u._id}')"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;
            }

            // ============================================================
            // ➕ ADD USER (إلى الخادم)
            // ============================================================

            function openAddModal() {
                currentEditId = null;
                document.getElementById('modalTitle').textContent = '➕ إضافة مستخدم جديد';
                document.getElementById('userName').value = '';
                document.getElementById('userEmail').value = '';
                document.getElementById('userPassword').value = '';
                document.getElementById('userPassword').placeholder = '********';
                document.getElementById('userUnit').value = '';
                document.getElementById('userRole').value = 'user';
                document.getElementById('userStatus').value = 'نشط';
                document.getElementById('editUserId').value = '';
                document.getElementById('userModal').classList.add('visible');
            }

            window.editUser = function(id) {
                var user = usersData.find(function(u) { return u._id === id || u.id === id; });
                if (!user) return;

                currentEditId = id;
                document.getElementById('modalTitle').textContent = '✏️ تعديل المستخدم: ' + user.name;
                document.getElementById('userName').value = user.name;
                document.getElementById('userEmail').value = user.email;
                document.getElementById('userPassword').value = '';
                document.getElementById('userPassword').placeholder = 'اترك فارغاً للحفاظ على كلمة المرور';
                document.getElementById('userUnit').value = user.unit || '';
                document.getElementById('userRole').value = user.role;
                document.getElementById('userStatus').value = user.status;
                document.getElementById('editUserId').value = id;
                document.getElementById('userModal').classList.add('visible');
            };

            async function saveUser() {
                var name = document.getElementById('userName').value.trim();
                var email = document.getElementById('userEmail').value.trim();
                var password = document.getElementById('userPassword').value;
                var unit = document.getElementById('userUnit').value;
                var role = document.getElementById('userRole').value;
                var status = document.getElementById('userStatus').value;
                var editId = document.getElementById('editUserId').value;

                if (!name) { showToast('⚠️ يرجى إدخال اسم المستخدم', 'error'); return; }
                if (!email) { showToast('⚠️ يرجى إدخال البريد الإلكتروني', 'error'); return; }
                if (!unit) { showToast('⚠️ يرجى اختيار الوحدة', 'error'); return; }

                var token = getToken();
                if (!token) {
                    showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
                    return;
                }

                try {
                    var url = '/api/users';
                    var method = 'POST';
                    var body = { name, email, password, unit, role, status };

                    if (editId) {
                        url = '/api/users/' + editId;
                        method = 'PUT';
                        delete body.password;
                        if (password) body.password = password;
                    }

                    var response = await fetch(url, {
                        method: method,
                        headers: getAuthHeaders(),
                        body: JSON.stringify(body)
                    });

                    var data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'فشل الحفظ');
                    }

                    showToast('✅ تم حفظ المستخدم في الخادم', 'success');
                    document.getElementById('userModal').classList.remove('visible');
                    loadUsers();

                } catch (error) {
                    showToast('❌ ' + error.message, 'error');
                }
            }

            // ============================================================
            // 🗑️ DELETE USER (من الخادم)
            // ============================================================

            window.deleteUser = function(id) {
                var user = usersData.find(function(u) { return u._id === id || u.id === id; });
                if (!user) return;

                if (!confirm('⚠️ هل أنت متأكد من حذف المستخدم ' + user.name + '؟')) return;

                var token = getToken();
                if (!token) {
                    showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
                    return;
                }

                fetch('/api/users/' + id, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                })
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.success) {
                        showToast('🗑️ تم حذف المستخدم ' + user.name + ' من الخادم', 'success');
                        loadUsers();
                    } else {
                        showToast('❌ ' + (data.error || 'فشل الحذف'), 'error');
                    }
                })
                .catch(function(error) {
                    showToast('❌ ' + error.message, 'error');
                });
            };

            // ============================================================
            // 🔑 CHANGE PASSWORD (في الخادم)
            // ============================================================

            window.changePassword = function(id) {
                var user = usersData.find(function(u) { return u._id === id || u.id === id; });
                if (!user) return;

                document.getElementById('passwordUserId').value = id;
                document.getElementById('passwordUserName').value = user.name;
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                document.getElementById('passwordModal').classList.add('visible');
            };

            function savePassword() {
                var id = document.getElementById('passwordUserId').value;
                var newPass = document.getElementById('newPassword').value;
                var confirmPass = document.getElementById('confirmPassword').value;

                if (!newPass || newPass.length < 6) {
                    showToast('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                    return;
                }
                if (newPass !== confirmPass) {
                    showToast('⚠️ كلمة المرور غير متطابقة', 'error');
                    return;
                }

                var token = getToken();
                if (!token) {
                    showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
                    return;
                }

                fetch('/api/users/' + id + '/password', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ password: newPass })
                })
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.success) {
                        showToast('✅ تم تغيير كلمة المرور في الخادم', 'success');
                        document.getElementById('passwordModal').classList.remove('visible');
                    } else {
                        showToast('❌ ' + (data.error || 'فشل التغيير'), 'error');
                    }
                })
                .catch(function(error) {
                    showToast('❌ ' + error.message, 'error');
                });
            }

            // ============================================================
            // 🔍 FILTERS
            // ============================================================

            function applyFilters() {
                renderTable();
                showToast('✅ تم تطبيق الفلاتر', 'success');
            }

            function resetFilters() {
                document.getElementById('searchUser').value = '';
                document.getElementById('fUnitUser').value = 'الكل';
                document.getElementById('fStatusUser').value = 'الكل';
                document.getElementById('fRoleUser').value = 'الكل';
                renderTable();
                showToast('✅ تم إلغاء جميع الفلاتر', 'success');
            }

            // ============================================================
            // 🚀 INIT
            // ============================================================

            function initUsers() {
                console.log('👥 تهيئة صفحة المستخدمين مع الخادم...');

                // تحميل البيانات من الخادم
                loadUsers();

                // ربط الأحداث
                document.getElementById('refreshBtn').addEventListener('click', loadUsers);
                document.getElementById('addUserBtn').addEventListener('click', openAddModal);
                document.getElementById('filterBtn').addEventListener('click', applyFilters);
                document.getElementById('resetBtn').addEventListener('click', resetFilters);

                document.getElementById('modalClose').addEventListener('click', function() {
                    document.getElementById('userModal').classList.remove('visible');
                });
                document.getElementById('modalCancel').addEventListener('click', function() {
                    document.getElementById('userModal').classList.remove('visible');
                });
                document.getElementById('modalSave').addEventListener('click', saveUser);

                document.getElementById('passwordModalClose').addEventListener('click', function() {
                    document.getElementById('passwordModal').classList.remove('visible');
                });
                document.getElementById('passwordModalCancel').addEventListener('click', function() {
                    document.getElementById('passwordModal').classList.remove('visible');
                });
                document.getElementById('passwordModalSave').addEventListener('click', savePassword);

                document.getElementById('searchUser').addEventListener('keyup', renderTable);
                document.getElementById('fUnitUser').addEventListener('change', renderTable);
                document.getElementById('fStatusUser').addEventListener('change', renderTable);
                document.getElementById('fRoleUser').addEventListener('change', renderTable);

                // إغلاق المودال عند الضغط خارجها
                document.querySelectorAll('.modal-overlay').forEach(function(m) {
                    m.addEventListener('click', function(e) {
                        if (e.target === this) {
                            this.classList.remove('visible');
                        }
                    });
                });

                console.log('✅ صفحة المستخدمين متصلة بالخادم');
            }

            // ============================================================
            // START
            // ============================================================

            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                initUsers();
            } else {
                document.addEventListener('DOMContentLoaded', initUsers);
            }

            // ============================================================
            // EXPOSE
            // ============================================================

            window.editUser = editUser;
            window.deleteUser = deleteUser;
            window.changePassword = changePassword;
            window.showToast = showToast;
            window.loadUsers = loadUsers;
            window.applyFilters = applyFilters;
            window.resetFilters = resetFilters;

        })();
    </script>
</div>
