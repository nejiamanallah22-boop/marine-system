<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طباعة — منظومة الوسائل البحرية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    direction: rtl;
    background: #e5e7eb;
    color: #111827;
    min-height: 100vh;
}

/* ───────── شريط التحكم ───────── */
.top-controls {
    position: fixed; top: 16px; right: 16px;
    display: flex; gap: 10px; z-index: 9999;
    background: rgba(255,255,255,.98);
    backdrop-filter: blur(12px);
    padding: 10px; border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.2);
    border: 1px solid #e2e8f0;
}
.top-controls button {
    padding: 10px 22px; border: none; border-radius: 10px;
    font-family: inherit; font-size: 13px; font-weight: 800;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    transition: all .2s;
}
.btn-print {
    background: linear-gradient(135deg,#d4a843 0%,#e8c77a 100%);
    color: #0f172a; box-shadow: 0 4px 12px rgba(212,168,67,.4);
}
.btn-print:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212,168,67,.6); }
.btn-close { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
.btn-close:hover { background: #e2e8f0; }

/* ───────── Loading ───────── */
.loading-overlay {
    position: fixed; inset: 0; background: rgba(241,245,249,.98);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10000; gap: 20px;
}
.spinner {
    width: 52px; height: 52px; border: 4px solid #e2e8f0;
    border-top-color: #d4a843; border-radius: 50%;
    animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: #475569; font-weight: 700; }

/* ───────── المحتوى ───────── */
.page-wrapper { max-width: 297mm; margin: 80px auto 30px; padding: 0 20px; }
.page {
    width: 297mm; min-height: 210mm; margin: 0 auto; background: #fff;
    box-shadow: 0 4px 24px rgba(0,0,0,.15); border-radius: 8px;
    overflow: hidden; position: relative;
}

#copied-content button,
#copied-content .eff-header-actions,
#copied-content .filter-bar,
#copied-content .scroll-nav,
#copied-content .btn-action,
#copied-content .btn-filter,
#copied-content .chart-switch,
#copied-content .no-print,
#copied-content .back-to-top,
#copied-content .pagination { display: none !important; }

/* ───────── الصور (أكبر) ───────── */
#copied-content img, .print-table img {
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    max-width: 100%; height: auto;
}
.print-table tbody td img {
    width: 30mm; height: 30mm; object-fit: cover;
    border-radius: 1.5mm; border: 1px solid #d4a843;
    background: #fffbeb; display: block; margin: 0 auto;
}

/* ───────── الجدول الرئيسي الذي يحمل الترويسة الثابتة ───────── */
.master-table { width: 100%; border-collapse: collapse; }
.master-table > thead { display: table-header-group; }
.master-table > tbody > tr > td.master-body { padding: 0; vertical-align: top; }

.print-table { page-break-inside: auto; break-inside: auto; }
.print-table thead { display: table-header-group; }
.print-table tfoot { display: table-footer-group; }
.print-table tr { page-break-inside: avoid; break-inside: avoid; }

@page { size: A4 landscape; margin: 6mm 8mm 12mm; }

.letterhead { page-break-inside: avoid; break-inside: avoid; }

/* ═════════════════ PRINT ═════════════════ */
@media print {
    html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }

    .top-controls, .loading-overlay { display: none !important; }

    .page-wrapper { margin: 0 !important; padding: 0 !important; max-width: none !important; }
    .page {
        width: 100% !important; min-height: auto !important;
        box-shadow: none !important; border-radius: 0 !important;
        margin: 0 !important; padding: 0 !important; overflow: visible !important;
    }

    #official-print-header, #user-info-badge, #dev-signature, .print-unified-header { display: none !important; }

    #page-efficiency, #page-fleet, #page-vehicles, #page-maintenance, #page-users {
        background: #fff !important; background-image: none !important;
        padding: 0 !important; margin: 0 !important;
    }
    #page-efficiency::before { display: none !important; }

    /* ── ترويسات الصفحات الداخلية (مضغوطة) ── */
    .eff-header, .fleet-header {
        background: #fff !important; border: 1.5px solid #0a1628 !important;
        box-shadow: none !important; padding: 2mm 4mm !important; margin: 0 0 2mm !important;
    }
    .eff-header-left h2, .fleet-header-left h2 {
        color: #0a1628 !important; -webkit-text-fill-color: #0a1628 !important;
        background: none !important; -webkit-background-clip: unset !important;
        background-clip: unset !important; font-size: 11pt !important;
    }
    .eff-header-left p, .fleet-header-left p { color: #475569 !important; font-size: 8pt !important; }

    /* ── الإحصائيات ── */
    .stat-card {
        background: #fff !important; border: 1.5px solid #d4a843 !important;
        box-shadow: none !important; padding: 2mm !important;
    }
    .stat-card .number { text-shadow: none !important; filter: none !important; }
    .stat-card .label { color: #1e293b !important; }

    /* ═══ صفحة الجاهزية: الأقسام متلاصقة كأنها جدول واحد متصل ═══ */
    .eff-section, .chart-section {
        background: #fff !important;
        border: 1.5px solid #0a1628 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        page-break-inside: auto !important; break-inside: auto !important;
    }
    /* القسم التالي يلتصق بما قبله بلا فراغ ولا حدّ مزدوج */
    .eff-section + .eff-section,
    .eff-section + .chart-section,
    .chart-section + .eff-section,
    .chart-section + .chart-section {
        border-top: none !important;
    }
    .eff-section > *, .chart-section > * { margin-top: 0 !important; margin-bottom: 0 !important; }

    .section-header {
        background: #0a1628 !important;
        color: #fff !important; border-bottom: 2px solid #d4a843 !important;
        padding: 1.5mm 4mm !important;
        page-break-after: avoid !important; break-after: avoid !important;
    }
    .section-header h3 { color: #ffffff !important; font-size: 9.5pt !important; margin: 0 !important; }
    .section-header h3 i { color: #ffffff !important; filter: none !important; }

    /* الجداول داخل الأقسام تأخذ كامل العرض بلا هوامش جانبية */
    .eff-section table, .chart-section table {
        width: 100% !important; margin: 0 !important;
        border-collapse: collapse !important; table-layout: auto !important;
    }

    thead { display: table-header-group !important; }
    thead th {
        background: #1a2942 !important; color: #ffffff !important;
        border-bottom: 2px solid #d4a843 !important;
        text-shadow: none !important; -webkit-text-fill-color: #ffffff !important;
        padding: 1.5mm 1mm !important; font-size: 8pt !important;
    }
    thead th i { color: #ffffff !important; filter: none !important; }

    tbody td {
        color: #0a1628 !important;
        border-bottom: 1px solid #e2e8f0 !important;
        border-left: 1px solid #e2e8f0 !important;
        padding: 1.2mm 1mm !important; font-size: 7.5pt !important;
    }
    tbody tr:nth-child(even) { background: #f8fafc !important; }

    /* ── الصور (أكبر في الطباعة) ── */
    .print-table tbody td img,
    #copied-content img {
        width: 28mm !important; height: 28mm !important;
        object-fit: cover !important; border-radius: 1.5mm !important;
        border: 1px solid #d4a843 !important; background: #fffbeb !important;
        image-rendering: -webkit-optimize-contrast !important;
        image-rendering: crisp-edges !important;
        display: block !important; margin: 0 auto !important;
    }

    /* ── الصفوف الملونة ── */
    .row-high { background: #d1fae5 !important; border-right: 4px solid #10b981 !important; }
    .row-high td:first-child { color: #059669 !important; font-weight: 800 !important; }
    .row-mid  { background: #fef3c7 !important; border-right: 4px solid #f59e0b !important; }
    .row-mid td:first-child  { color: #b45309 !important; font-weight: 800 !important; }
    .row-low  { background: #fee2e2 !important; border-right: 4px solid #ef4444 !important; }
    .row-low td:first-child  { color: #b91c1c !important; font-weight: 800 !important; }

    /* ── الشارات ── */
    .status-badge {
        padding: 1mm 3mm !important; border-radius: 3mm !important;
        font-weight: 800 !important; color: #fff !important;
        display: inline-block !important; box-shadow: none !important;
    }
    .status-badge.excellent { background: #059669 !important; }
    .status-badge.good      { background: #047857 !important; }
    .status-badge.medium    { background: #d97706 !important; }
    .status-badge.low       { background: #dc2626 !important; }
    .status-badge.critical  { background: #991b1b !important; }

    .badge { box-shadow: none !important; }
    .badge.success { background: #ecfdf5 !important; color: #059669 !important; border: 1px solid #10b981 !important; }
    .badge.warning { background: #fffbeb !important; color: #b45309 !important; border: 1px solid #f59e0b !important; }
    .badge.danger  { background: #fef2f2 !important; color: #b91c1c !important; border: 1px solid #ef4444 !important; }
    .badge.gold    { background: #fffbeb !important; color: #a88a2e !important; border: 1px solid #d4a843 !important; }

    .progress-bar { background: #e2e8f0 !important; border: .5px solid #cbd5e1 !important; }
    .progress-fill.high { background: linear-gradient(90deg,#047857,#10b981) !important; }
    .progress-fill.mid  { background: linear-gradient(90deg,#b45309,#f59e0b) !important; }
    .progress-fill.low  { background: linear-gradient(90deg,#b91c1c,#ef4444) !important; }

    .chart-box { background: #fff !important; border: none !important; padding: 2mm !important; }
    .chart-box h4 {
        color: #0a1628 !important; -webkit-text-fill-color: #0a1628 !important;
        border-bottom: 1pt solid #12121a !important; padding-bottom: 1.5mm !important;
    }

    * {
        animation: none !important; transition: none !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    table { width: 100% !important; border-collapse: collapse !important; }
    tr { page-break-inside: avoid !important; break-inside: avoid !important; }
    thead { display: table-header-group !important; }
    tfoot { display: table-footer-group !important; }
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">جاري تحضير الطباعة...</div>
</div>

<div class="top-controls">
    <button class="btn-print" onclick="window.print()"><i class="fas fa-print"></i> طباعة / PDF</button>
    <button class="btn-close" onclick="window.close()"><i class="fas fa-times"></i> إغلاق</button>
</div>

<div class="page-wrapper">
    <div class="page" id="copied-content"></div>
</div>

<script>
(function () {
    'use strict';

    const params = new URLSearchParams(location.search);
    const storageKey = params.get('key') || 'print_data';
    const pageType = params.get('type') || 'fleet';

    const TITLES = {
        fleet: 'الأسطول البحري',
        vehicles: 'الوسائل البرية - الحرس البحري',
        efficiency: 'جاهزية الأسطول',
        maintenance: 'سجل الصيانة والتدخلات',
        logs: 'سجلات الصيانة',
        users: 'إدارة المستخدمين',
        notes: 'المذكرات',
        support: 'مركز الدعم الفني',
        'disposals-vessels': 'الوسائل البحرية المطروحة',
        'disposals-vehicles': 'الوسائل البرية المطروحة'
    };

    document.title = (TITLES[pageType] || 'طباعة') + ' — منظومة الوسائل البحرية';

    function esc(v) {
        return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function loadData() {
        try {
            const raw = localStorage.getItem(storageKey);
            if (raw) return JSON.parse(raw);
        } catch (e) { console.error('Load error:', e); }
        return null;
    }

    // الترويسة الرسمية: تظهر مرة واحدة في أعلى الصفحة الأولى فقط
    function buildLetterhead(title) {
        return `
        <header class="letterhead" style="padding:5mm 12mm 3.5mm;margin-bottom:4mm;border-bottom:3px double #0a1628;">
            <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8mm;align-items:start;">
                <div style="text-align:right;font-size:8.5pt;line-height:1.55;color:#0a1628;font-weight:600;">
                    <div style="font-weight:900;font-size:10pt;margin-bottom:1mm;">الجمهورية التونسية</div>
                    وزارة الداخلية<br>
                    كتابة الدولة للأمن<br>
                    الإدارة العامة للحرس الوطني<br>
                    الإدارة العامة لحرس الحدود<br>
                    إدارة إسناد الوحدات البحرية
                    <div style="margin-top:2.5mm;font-size:9pt;font-weight:800;">ع/ ________ /دد</div>
                </div>
                <div style="align-self:center;text-align:center;min-width:80mm;border:1.5px solid #0a1628;padding:3mm 8mm;">
                    <div style="font-size:7.5pt;color:#64748b;font-weight:700;letter-spacing:.3px;margin-bottom:1mm;">منظومة الوسائل البحرية</div>
                    <h1 style="font-size:13pt;font-weight:900;color:#0a1628;margin:0;">${esc(title)}</h1>
                </div>
                <div style="text-align:left;font-size:8.5pt;color:#0a1628;font-weight:600;">
                    العوينة في: __________
                </div>
            </div>
        </header>`;
    }

    function buildFooter() {
        const dateStr = new Date().toLocaleDateString('ar-TN', {
            year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        return `
        <footer style="margin:5mm 0 0;padding-top:2.5mm;border-top:1.5px solid #0a1628;display:grid;grid-template-columns:1fr auto 1fr;gap:4mm;align-items:center;font-size:7.5pt;color:#475569;font-weight:600;page-break-inside:avoid;break-inside:avoid;">
            <div style="text-align:right;">منظومة الوسائل البحرية v11.2.0</div>
            <div style="text-align:center;font-weight:800;color:#0a1628;">إدارة إسناد الوحدات البحرية</div>
            <div style="text-align:left;">${dateStr}</div>
        </footer>`;
    }

    // وضع النسخ (htmlSnapshot): ترويسة مرة واحدة ثم المحتوى
    function wrapWithFixedHeader(innerHTML, title) {
        return buildLetterhead(title) +
            `<div style="padding:0 8mm;">${innerHTML}${buildFooter()}</div>`;
    }

    // وضع البيانات (rows/columns)
    function buildFromData(data) {
        const section = data.sectionTitle || 'السجل التفصيلي';
        const stats = data.stats || [];
        const columns = data.columns || [];
        const rows = data.rows || [];
        const title = data.title || TITLES[pageType] || 'منظومة الوسائل البحرية';
        const IMG = '30mm';

        let html = buildLetterhead(title);

        if (stats.length) {
            html += '<section style="display:grid;grid-template-columns:repeat(' + stats.length + ',1fr);gap:4mm;padding:4mm 12mm 3mm;">';
            const colors = ['#0a1628', '#10b981', '#f59e0b', '#ef4444', '#d4a843'];
            const bgs = ['#f8fafc', '#ecfdf5', '#fffbeb', '#fef2f2', '#fffbeb'];
            stats.forEach((s, i) => {
                const color = colors[i] || '#0a1628';
                const bg = bgs[i] || '#f8fafc';
                html += `
                <div style="padding:3mm 2mm;background:#ffffff;border:1px solid #cbd5e1;border-top:3px solid ${color};border-radius:1.5mm;text-align:center;">
                    <div style="font-size:20pt;font-weight:900;color:${color};line-height:1;margin-bottom:1.5mm;">${esc(s.value || '0')}</div>
                    <div style="font-size:8pt;color:#1e293b;font-weight:700;">${esc(s.label || '')}</div>
                </div>`;
            });
            html += '</section>';
        }

        html += `<div style="padding:2.5mm 5mm;background:#0a1628;color:#ffffff;font-size:10pt;font-weight:800;border-bottom:2px solid #d4a843;margin:0 12mm;">${esc(section)}</div>`;

        html += '<div style="margin:0 12mm 4mm;border:1px solid #e2e8f0;border-top:none;">';
        html += '<table class="print-table" style="width:100%;border-collapse:collapse;table-layout:fixed;font-size:8pt;">';
        html += '<thead>';

        if (columns.length) {
            html += '<tr>';
            columns.forEach((c, i) => {
                const label = typeof c === 'string' ? c : (c.label || '');
                const style = i === 0 ? 'width:34mm;' : '';
                html += `<th style="${style}padding:2mm 1mm;background:#1a2942;color:#ffffff;font-weight:800;font-size:8pt;text-align:center;border-bottom:2px solid #d4a843;border-left:1px solid rgba(247,215,116,.15);white-space:nowrap;">${esc(label)}</th>`;
            });
            html += '</tr>';
        }
        html += '</thead><tbody>';

        const tdBase = 'border-bottom:1px solid #e2e8f0;border-left:1px solid #e2e8f0;';
        rows.forEach(row => {
            const cells = Array.isArray(row) ? row : Object.values(row);
            html += '<tr>';
            cells.forEach(cell => {
                if (typeof cell === 'object' && cell !== null) {
                    if (cell.type === 'image') {
                        const url = cell.url || cell.src || '';
                        if (url) {
                            html += `<td style="width:34mm;padding:1mm;text-align:center;background:#fffbeb;${tdBase}"><img src="${esc(url)}" alt="صورة" style="width:${IMG};height:${IMG};object-fit:cover;border-radius:1.5mm;border:1px solid #d4a843;display:block;margin:0 auto;"></td>`;
                        } else {
                            html += `<td style="width:34mm;padding:1mm;text-align:center;background:#fffbeb;${tdBase}"><div style="width:${IMG};height:${IMG};margin:0 auto;background:#f1f5f9;border:1px dashed #94a3b8;border-radius:1.5mm;display:flex;align-items:center;justify-content:center;font-size:12pt;color:#94a3b8;">📷</div></td>`;
                        }
                        return;
                    }
                    if (cell.type === 'badge') {
                        const variants = {
                            success: 'background:#10b981;color:#fff;border:1px solid #047857;',
                            danger: 'background:#ef4444;color:#fff;border:1px solid #b91c1c;',
                            warning: 'background:#f59e0b;color:#fff;border:1px solid #b45309;',
                            info: 'background:#3b82f6;color:#fff;border:1px solid #1e40af;',
                            neutral: 'background:#64748b;color:#fff;border:1px solid #334155;'
                        };
                        const st = variants[cell.variant] || variants.neutral;
                        html += `<td style="padding:1mm;text-align:center;${tdBase}"><span style="${st}padding:.5mm 2mm;border-radius:3mm;font-size:6.5pt;font-weight:800;display:inline-block;">${esc(cell.text || '')}</span></td>`;
                        return;
                    }
                }
                const value = (cell === null || cell === undefined || cell === '') ? '—' : esc(cell);
                html += `<td style="padding:1.5mm 1mm;text-align:center;font-size:7.5pt;color:#1e293b;font-weight:600;${tdBase}">${value}</td>`;
            });
            html += '</tr>';
        });
        html += '</tbody></table></div>';
        html += buildFooter().replace('margin:5mm 0 0', 'margin:5mm 12mm 0');
        return html;
    }

    function waitForImages(container) {
        const imgs = Array.from(container.querySelectorAll('img'));
        return Promise.all(imgs.map(img => {
            if (img.complete && img.naturalWidth) return Promise.resolve();
            return new Promise(res => {
                img.addEventListener('load', res, { once: true });
                img.addEventListener('error', res, { once: true });
            });
        }));
    }

    function prepareImages(container) {
        container.querySelectorAll('img').forEach(img => {
            img.loading = 'eager';
            img.decoding = 'sync';
            img.style.removeProperty('max-width');
            img.style.removeProperty('max-height');
            img.style.imageRendering = 'crisp-edges';
        });
    }

    function init() {
        const loading = document.getElementById('loadingOverlay');
        const content = document.getElementById('copied-content');
        const data = loadData();

        if (!data) {
            content.innerHTML = '<div style="padding:40mm;text-align:center;color:#999;font-size:14pt;">⚠️ لا توجد بيانات للطباعة</div>';
            if (loading) loading.style.display = 'none';
            return;
        }

        const title = data.title || TITLES[pageType] || 'منظومة الوسائل البحرية';

        if (data.htmlSnapshot) {
            // تنظيف العناصر التفاعلية قبل الإدراج
            const tmp = document.createElement('div');
            tmp.innerHTML = data.htmlSnapshot;
            tmp.querySelectorAll(
                'button, .eff-header-actions, .filter-bar, .scroll-nav, .btn-action, .btn-filter, ' +
                '.chart-switch, .no-print, .back-to-top, .pagination, script'
            ).forEach(el => el.remove());
            content.innerHTML = wrapWithFixedHeader(tmp.innerHTML, title);
        } else if (data.rows && data.rows.length > 0) {
            content.innerHTML = buildFromData(data);
        } else {
            content.innerHTML = '<div style="padding:40mm;text-align:center;color:#999;font-size:14pt;">لا توجد بيانات</div>';
        }

        prepareImages(content);

        // لا نُخفي شاشة التحميل قبل اكتمال الصور
        waitForImages(content).then(() => { if (loading) loading.style.display = 'none'; });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
})();
</script>
