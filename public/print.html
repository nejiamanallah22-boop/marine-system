<!-- PRINT_PAGE_NO_INJECT -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طباعة — منظومة الوسائل البحرية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    direction: rtl;
    background: #e5e7eb;
    color: #111827;
    min-height: 100vh;
}

/* ═══════════════════════════════════════════════════════════ */
/* 🎨 شريط التحكم                                              */
/* ═══════════════════════════════════════════════════════════ */
.top-controls {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 10px;
    z-index: 9999;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(12px);
    padding: 10px;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    border: 1px solid #e2e8f0;
}

.top-controls button {
    padding: 10px 22px;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
}

.btn-print {
    background: linear-gradient(135deg, #d4a843 0%, #e8c77a 100%);
    color: #0f172a;
    box-shadow: 0 4px 12px rgba(212, 168, 67, 0.4);
}

.btn-print:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(212, 168, 67, 0.6);
}

.btn-close {
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #e2e8f0;
}

.btn-close:hover { background: #e2e8f0; }

/* ═══════════════════════════════════════════════════════════ */
/* ⏳ Loading                                                   */
/* ═══════════════════════════════════════════════════════════ */
.loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(241, 245, 249, 0.98);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    gap: 20px;
}

.spinner {
    width: 52px;
    height: 52px;
    border: 4px solid #e2e8f0;
    border-top-color: #d4a843;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
    font-size: 14px;
    color: #475569;
    font-weight: 700;
}

/* ═══════════════════════════════════════════════════════════ */
/* 📄 المحتوى                                                   */
/* ═══════════════════════════════════════════════════════════ */
.page-wrapper {
    max-width: 297mm;
    margin: 80px auto 30px;
    padding: 0 20px;
}

.page {
    width: 297mm;
    min-height: 210mm;
    margin: 0 auto;
    background: #ffffff;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
}

/* إخفاء العناصر التفاعلية داخل المحتوى */
#copied-content button,
#copied-content .eff-header-actions,
#copied-content .filter-bar,
#copied-content .scroll-nav,
#copied-content .btn-action,
#copied-content .btn-filter,
#copied-content .chart-switch,
#copied-content .no-print,
#copied-content .back-to-top,
#copied-content .pagination {
    display: none !important;
}

/* ═══════════════════════════════════════════════════════════ */
/* 🖼️ صور واضحة في الشاشة                                      */
/* ═══════════════════════════════════════════════════════════ */
#copied-content img,
.print-table img {
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    -ms-interpolation-mode: bicubic;
    max-width: 100%;
    height: auto;
}

/* ═══════════════════════════════════════════════════════════ */
/* 🏛️ الترويسة المخفية (تُطبع في كل صفحة عبر @page)              */
/* ═══════════════════════════════════════════════════════════ */
.print-header-running {
    display: none;
}

/* ═══════════════════════════════════════════════════════════ */
/* 📄 إعدادات الطباعة A4 Landscape                             */
/* ═══════════════════════════════════════════════════════════ */
@page {
    size: A4 landscape;
    margin: 45mm 8mm 15mm 8mm; /* مساحة علوية للترويسة، وسفلية للتذييل */
    
    /* ✅ تكرار الترويسة في كل صفحة */
    @top-center {
        content: element(printHeader);
        width: 100%;
    }
    
    /* ✅ تذييل الترقيم في كل صفحة */
    @bottom-center {
        content: "صفحة " counter(page) " من " counter(pages);
        font-family: 'Cairo', sans-serif;
        font-size: 8pt;
        color: #64748b;
    }
}

@media print {
    html, body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .top-controls,
    .loading-overlay { display: none !important; }

    .page-wrapper {
        margin: 0 !important;
        padding: 0 !important;
        max-width: none !important;
    }

    .page {
        width: 100% !important;
        min-height: auto !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    /* ✅ تفعيل الترويسة المتكررة */
    .print-header-running {
        display: block !important;
        position: running(printHeader);
    }

    /* إخفاء الترويسات الافتراضية */
    #official-print-header,
    #user-info-badge,
    #dev-signature { display: none !important; }

    /* إخفاء الخلفيات الداكنة */
    #page-efficiency,
    #page-fleet,
    #page-vehicles,
    #page-maintenance,
    #page-users {
        background: #ffffff !important;
        background-image: none !important;
    }

    /* الترويسات الداخلية */
    .eff-header, .fleet-header {
        background: #ffffff !important;
        border: 2px solid #0a1628 !important;
        box-shadow: none !important;
        page-break-inside: avoid !important;
    }

    .eff-header-left h2,
    .fleet-header-left h2 {
        color: #0a1628 !important;
        -webkit-text-fill-color: #0a1628 !important;
        background: none !important;
    }

    /* الإحصائيات */
    .stat-card {
        background: #ffffff !important;
        border: 1.5px solid #d4a843 !important;
        box-shadow: none !important;
        page-break-inside: avoid !important;
    }

    /* الأقسام والبطاقات */
    .eff-section {
        background: #ffffff !important;
        border: 1.5px solid #0a1628 !important;
        box-shadow: none !important;
        page-break-inside: avoid !important; /* منع تقسيم البطاقة */
        margin-bottom: 4mm !important;
    }

    .section-header {
        background: linear-gradient(90deg, #0a1628 0%, #1a2942 100%) !important;
        color: #ffffff !important;
        border-bottom: 3px solid #d4a843 !important;
    }

    .section-header h3 { color: #f7d774 !important; }

    /* رؤوس الجداول */
    thead { display: table-header-group !important; }
    thead th {
        background: #0a1628 !important;
        color: #f7d774 !important;
        border-bottom: 2px solid #d4a843 !important;
        padding: 2mm 1mm !important;
        font-size: 8pt !important;
    }

    /* الخلايا */
    tbody td {
        color: #0a1628 !important;
        border-bottom: 1px solid #e2e8f0 !important;
        border-left: 1px solid #e2e8f0 !important;
        padding: 1.5mm 1mm !important;
        font-size: 7.5pt !important;
    }

    tbody tr:nth-child(even) { background: #f8fafc !important; }

    /* الصور */
    .print-table tbody td img,
    #copied-content img {
        width: 22mm !important;
        height: 22mm !important;
        object-fit: cover !important;
        border-radius: 1.5mm !important;
        border: 1px solid #d4a843 !important;
        image-rendering: -webkit-optimize-contrast !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    /* عام */
    * {
        animation: none !important;
        transition: none !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
    }

    table { page-break-inside: auto !important; }
    tr { page-break-inside: avoid !important; }
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">جاري تحضير الطباعة...</div>
</div>

<div class="top-controls">
    <button class="btn-print" onclick="window.print()">
        <i class="fas fa-print"></i> طباعة / PDF
    </button>
    <button class="btn-close" onclick="window.close()">
        <i class="fas fa-times"></i> إغلاق
    </button>
</div>

<div class="page-wrapper">

    <!-- ✅ الترويسة الرسمية (تتكرر في كل صفحة عبر CSS) -->
    <div class="print-header-running">
        <div style="padding:4mm 6mm 3mm; border-bottom:2px solid #0a1628; background:#ffffff;">
            <div style="display:grid; grid-template-columns:1fr auto 1fr; gap:8mm; align-items:flex-start;">
                <div style="text-align:right; font-size:8.5pt; line-height:1.5; color:#0a1628; font-weight:600;">
                    <div style="font-weight:900; font-size:9.5pt;">الجمهورية التونسية</div>
                    وزارة الداخلية<br>
                    كتابة الدولة للأمن<br>
                    الإدارة العامة للحرس الوطني<br>
                    الإدارة العامة لحرس الحدود<br>
                    إدارة إسناد الوحدات البحرية
                    <div style="margin-top:2mm; font-size:9pt; font-weight:800;">ع/ ________ /دد</div>
                </div>
                <div style="text-align:center; align-self:center; min-width:70mm;">
                    <div style="font-size:14pt; color:#d4a843; margin-bottom:1mm;">⚓</div>
                    <h1 id="printHeaderTitle" style="font-size:12pt; font-weight:900; color:#0a1628; margin:0;">منظومة الوسائل البحرية</h1>
                </div>
                <div style="text-align:left; font-size:8.5pt; color:#0a1628; font-weight:600;">
                    العوينة في: __________
                </div>
            </div>
        </div>
    </div>

    <!-- المحتوى المُستنسخ -->
    <div class="page" id="copied-content"></div>
</div>

<script>
(function() {
    'use strict';

    const params = new URLSearchParams(location.search);
    const storageKey = params.get('key') || 'print_data';
    const pageType = params.get('type') || 'fleet';

    const TITLES = {
        fleet: 'الأسطول البحري',
        vehicles: 'الوسائل البرية - الحرس البحري',
        efficiency: 'جاهزية الأسطول',
        maintenance: 'سجل الصيانة والتدخلات',
        logs: 'سجلات الصيانة'
    };

    document.title = (TITLES[pageType] || 'طباعة') + ' — منظومة الوسائل البحرية';

    function loadData() {
        try {
            const raw = localStorage.getItem(storageKey);
            if (raw) return JSON.parse(raw);
        } catch (e) {}
        return null;
    }

    function updateHeaderTitle(data) {
        const titleEl = document.getElementById('printHeaderTitle');
        if (titleEl) {
            const title = (data && data.title) || TITLES[pageType] || 'منظومة الوسائل البحرية';
            titleEl.textContent = title;
        }
    }

    function prepareImages(container) {
        const images = container.querySelectorAll('img');
        images.forEach(img => {
            img.loading = 'eager';
            img.decoding = 'sync';
            if (img.src && !img.src.startsWith('data:')) {
                img.crossOrigin = 'anonymous';
            }
            img.style.imageRendering = '-webkit-optimize-contrast';
            img.style.imageRendering = 'crisp-edges';
            img.style.webkitPrintColorAdjust = 'exact';
            img.style.printColorAdjust = 'exact';
            img.classList.add('print-img-optimized');
        });
    }

    function init() {
        const loading = document.getElementById('loadingOverlay');
        const content = document.getElementById('copied-content');
        const data = loadData();

        if (!data) {
            content.innerHTML = '<div style="padding:40mm;text-align:center;color:#999;font-size:14pt;">⚠️ لا توجد بيانات للطباعة</div>';
            if (loading) loading.style.display = 'none';
            return;
        }

        // ✅ تحديث عنوان الترويسة
        updateHeaderTitle(data);

        // عرض المحتوى
        if (data.htmlSnapshot) {
            content.innerHTML = data.htmlSnapshot;
            content.querySelectorAll('button, .eff-header-actions, .filter-bar, .scroll-nav, .btn-action, .btn-filter, .chart-switch, .no-print, .back-to-top, .pagination').forEach(el => el.remove());
            prepareImages(content);
        } else {
            content.innerHTML = '<div style="padding:40mm;text-align:center;color:#999;font-size:14pt;">لا توجد بيانات</div>';
        }

        if (loading) loading.style.display = 'none';
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>

</body>
</html>
