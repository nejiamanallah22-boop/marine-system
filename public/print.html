<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طباعة — منظومة الوسائل البحرية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    direction: rtl;
    background: #e5e7eb;
    color: #0f172a;
    min-height: 100vh;
}

.top-controls {
    position: fixed; top: 16px; right: 16px;
    display: flex; gap: 8px; z-index: 9999;
    background: rgba(255,255,255,.98);
    padding: 10px; border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.2);
    border: 1px solid #e2e8f0;
}
.top-controls button {
    padding: 10px 18px; border: none; border-radius: 10px;
    font-family: inherit; font-size: 13px; font-weight: 800;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.btn-print { background: linear-gradient(135deg,#0f2744 0%,#1e3a5f 100%); color: #fff; }
.btn-close { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

.loading-overlay {
    position: fixed; inset: 0; background: rgba(241,245,249,.98);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10000; gap: 20px;
}
.spinner {
    width: 52px; height: 52px; border: 4px solid #e2e8f0;
    border-top-color: #0f2744; border-radius: 50%;
    animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: #475569; font-weight: 700; max-width: 90%; text-align: center; line-height: 1.8; white-space: pre-line; }

.page-wrapper { max-width: 297mm; margin: 80px auto 30px; padding: 0 20px; }
.page {
    width: 297mm; min-height: 210mm; margin: 0 auto; background: #fff;
    box-shadow: 0 4px 24px rgba(0,0,0,.15); border-radius: 8px;
    overflow: hidden; position: relative;
}

#copied-content button,
#copied-content .eff-header-actions,
#copied-content .filter-bar,
#copied-content .scroll-nav,
#copied-content .btn-action,
#copied-content .btn-filter,
#copied-content .chart-switch,
#copied-content .no-print,
#copied-content .back-to-top,
#copied-content .pagination { display: none !important; }

@page { size: A4 landscape; margin: 5mm 5mm 10mm 5mm; }

*, *::before, *::after {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}

.letterhead { page-break-inside: avoid; break-inside: avoid; }

.print-table,
.snapshot-body table {
    width: 100% !important;
    border-collapse: collapse !important;
    table-layout: auto !important;
    font-size: 7.5pt !important;
}

.print-table thead,
.snapshot-body thead {
    display: table-header-group !important;
    position: static !important;
}

.print-table th,
.snapshot-body thead th {
    background: #e8edf5 !important;
    color: #0f2744 !important;
    -webkit-text-fill-color: #0f2744 !important;
    font-size: 7.5pt !important;
    font-weight: 800 !important;
    padding: 1.2mm 0.6mm !important;
    text-align: center !important;
    border-bottom: 2px solid #0f2744 !important;
    white-space: normal !important;
    position: static !important;
    vertical-align: middle !important;
    word-break: break-word !important;
    min-width: 12mm !important;
}

.print-table td,
.snapshot-body tbody td {
    padding: 1mm 0.6mm !important;
    font-size: 7.5pt !important;
    text-align: center !important;
    vertical-align: middle !important;
    border-bottom: 1px solid #e2e8f0 !important;
    border-left: 1px solid #eef2f7 !important;
    word-break: break-word !important;
    white-space: normal !important;
    min-width: 12mm !important;
}

.print-table tr,
.snapshot-body tr {
    break-inside: avoid;
    page-break-inside: avoid;
}

.print-table tbody tr:nth-child(even) td,
.snapshot-body tbody tr:nth-child(even) td {
    background: #f8fafc !important;
    box-shadow: inset 0 0 0 9999px #f8fafc !important;
}

.snapshot-body table td img,
.print-table tbody td img,
#copied-content table td img {
    width: 40mm !important;
    height: 30mm !important;
    min-width: 40mm !important;
    min-height: 30mm !important;
    max-width: 40mm !important;
    max-height: 30mm !important;
    object-fit: cover !important;
    border-radius: 1.5mm !important;
    border: 1px solid #94a3b8 !important;
    display: block !important;
    margin: 0 auto !important;
    background: #fff !important;
}

.snapshot-body, .snapshot-body * {
    background: transparent !important;
    background-image: none !important;
    box-shadow: none !important;
    text-shadow: none !important;
    filter: none !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    animation: none !important;
    transition: none !important;
    mix-blend-mode: normal !important;
    will-change: auto !important;
    contain: none !important;
    overflow: visible !important;
    max-height: none !important;
    color: #0f172a !important;
    -webkit-text-fill-color: #0f172a !important;
    border-color: #cbd5e1 !important;
    letter-spacing: normal !important;
}
.snapshot-body { font-size: 8pt; line-height: 1.4; }

.snapshot-body .eff-header,
.snapshot-body .fleet-header,
.snapshot-body canvas,
.snapshot-body i[class*="fa-"],
.snapshot-body .fas, .snapshot-body .far, .snapshot-body .fab { display: none !important; }

.snapshot-body :has(> .stat-card) {
    display: grid !important;
    grid-template-columns: repeat(auto-fit, minmax(28mm, 1fr)) !important;
    gap: 3mm !important; margin: 0 0 4mm !important; padding: 0 !important;
}
.snapshot-body .stat-card {
    border: 1px solid #cbd5e1 !important;
    border-top: 3px solid #0f2744 !important;
    border-radius: 1.5mm !important;
    padding: 2.5mm 2mm !important; margin: 0 !important;
    text-align: center !important;
    background: #ffffff !important; box-shadow: inset 0 0 0 9999px #ffffff !important;
    break-inside: avoid; page-break-inside: avoid;
}
.snapshot-body .stat-card .number {
    display: block !important; font-size: 18pt !important; font-weight: 900 !important; line-height: 1.15 !important;
}
.snapshot-body .stat-card .label {
    display: block !important; font-size: 7.5pt !important; font-weight: 700 !important;
    color: #475569 !important; -webkit-text-fill-color: #475569 !important; margin-top: 1mm !important;
}
.snapshot-body .stat-card:nth-child(1) { border-top-color: #0f2744 !important; }
.snapshot-body .stat-card:nth-child(2) { border-top-color: #059669 !important; }
.snapshot-body .stat-card:nth-child(3) { border-top-color: #2563eb !important; }
.snapshot-body .stat-card:nth-child(4) { border-top-color: #dc2626 !important; }
.snapshot-body .stat-card:nth-child(5) { border-top-color: #b8860b !important; }
.snapshot-body .stat-card:nth-child(1) .number { color: #0f2744 !important; -webkit-text-fill-color: #0f2744 !important; }
.snapshot-body .stat-card:nth-child(2) .number { color: #059669 !important; -webkit-text-fill-color: #059669 !important; }
.snapshot-body .stat-card:nth-child(3) .number { color: #2563eb !important; -webkit-text-fill-color: #2563eb !important; }
.snapshot-body .stat-card:nth-child(4) .number { color: #dc2626 !important; -webkit-text-fill-color: #dc2626 !important; }
.snapshot-body .stat-card:nth-child(5) .number { color: #b8860b !important; -webkit-text-fill-color: #b8860b !important; }

.snapshot-body .eff-section,
.snapshot-body .chart-section {
    border: 1px solid #94a3b8 !important; border-radius: 0 !important;
    margin: 0 0 3mm !important; padding: 0 !important;
    break-inside: avoid; page-break-inside: avoid;
}
.snapshot-body .section-header {
    background: #0f2744 !important; box-shadow: inset 0 0 0 9999px #0f2744 !important;
    border: 0 !important; border-bottom: 2px solid #c9a227 !important;
    padding: 2mm 4mm !important; margin: 0 !important;
    break-after: avoid; page-break-after: avoid;
}
.snapshot-body .section-header,
.snapshot-body .section-header * {
    color: #ffffff !important; -webkit-text-fill-color: #ffffff !important;
    font-size: 9pt !important; font-weight: 800 !important;
}

.snapshot-body tbody tr.row-high td { background: #ecfdf5 !important; box-shadow: inset 0 0 0 9999px #ecfdf5 !important; }
.snapshot-body tbody tr.row-mid  td { background: #fffbeb !important; box-shadow: inset 0 0 0 9999px #fffbeb !important; }
.snapshot-body tbody tr.row-low  td { background: #fef2f2 !important; box-shadow: inset 0 0 0 9999px #fef2f2 !important; }
.snapshot-body tbody tr.row-high td:first-child { border-right: 4px solid #10b981 !important; font-weight: 800 !important; }
.snapshot-body tbody tr.row-mid  td:first-child { border-right: 4px solid #f59e0b !important; font-weight: 800 !important; }
.snapshot-body tbody tr.row-low  td:first-child { border-right: 4px solid #ef4444 !important; font-weight: 800 !important; }

.snapshot-body .status-badge {
    display: inline-block !important; padding: .4mm 2mm !important; border-radius: 2mm !important;
    font-size: 6.5pt !important; font-weight: 800 !important; border: 0 !important;
    color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; white-space: nowrap !important;
}
.snapshot-body .status-badge.excellent { background: #059669 !important; box-shadow: inset 0 0 0 9999px #059669 !important; }
.snapshot-body .status-badge.good      { background: #0d9488 !important; box-shadow: inset 0 0 0 9999px #0d9488 !important; }
.snapshot-body .status-badge.medium    { background: #d97706 !important; box-shadow: inset 0 0 0 9999px #d97706 !important; }
.snapshot-body .status-badge.low       { background: #dc2626 !important; box-shadow: inset 0 0 0 9999px #dc2626 !important; }
.snapshot-body .status-badge.critical  { background: #991b1b !important; box-shadow: inset 0 0 0 9999px #991b1b !important; }

.snapshot-body .badge {
    display: inline-block !important; padding: .4mm 2mm !important; border-radius: 2mm !important;
    font-size: 6.5pt !important; font-weight: 800 !important; border: 1px solid #cbd5e1 !important;
}
.snapshot-body .badge.success { background: #ecfdf5 !important; box-shadow: inset 0 0 0 9999px #ecfdf5 !important; color: #047857 !important; -webkit-text-fill-color: #047857 !important; border-color: #10b981 !important; }
.snapshot-body .badge.warning { background: #fffbeb !important; box-shadow: inset 0 0 0 9999px #fffbeb !important; color: #b45309 !important; -webkit-text-fill-color: #b45309 !important; border-color: #f59e0b !important; }
.snapshot-body .badge.danger  { background: #fef2f2 !important; box-shadow: inset 0 0 0 9999px #fef2f2 !important; color: #b91c1c !important; -webkit-text-fill-color: #b91c1c !important; border-color: #ef4444 !important; }
.snapshot-body .badge.gold    { background: #fffbeb !important; box-shadow: inset 0 0 0 9999px #fffbeb !important; color: #8a6d12 !important; -webkit-text-fill-color: #8a6d12 !important; border-color: #c9a227 !important; }

.snapshot-body .progress-bar {
    height: 2.2mm !important; border: .3mm solid #cbd5e1 !important; border-radius: 2mm !important;
    background: #eef2f7 !important; box-shadow: inset 0 0 0 9999px #eef2f7 !important;
    overflow: hidden !important;
}
.snapshot-body .progress-fill { display: block !important; height: 100% !important; border-radius: 2mm !important; }
.snapshot-body .progress-fill.high { background: #10b981 !important; box-shadow: inset 0 0 0 9999px #10b981 !important; }
.snapshot-body .progress-fill.mid  { background: #f59e0b !important; box-shadow: inset 0 0 0 9999px #f59e0b !important; }
.snapshot-body .progress-fill.low  { background: #ef4444 !important; box-shadow: inset 0 0 0 9999px #ef4444 !important; }

body.exporting { background: #fff !important; }
body.exporting * { letter-spacing: normal !important; }
body.exporting .top-controls { display: none !important; }
body.exporting .page-wrapper { margin: 0 !important; padding: 0 !important; max-width: none !important; }
body.exporting .page {
    width: 1600px !important; min-height: 0 !important; margin: 0 !important;
    box-shadow: none !important; border-radius: 0 !important; overflow: visible !important;
}
body.exporting .snapshot-body { width: 1600px !important; }

@media print {
    html, body {
        background: #fff !important; margin: 0 !important; padding: 0 !important;
        height: auto !important; min-height: 0 !important; overflow: visible !important;
    }
    .top-controls, .loading-overlay { display: none !important; }
    .page-wrapper { margin: 0 !important; padding: 0 !important; max-width: none !important; }
    .page {
        width: 100% !important; min-height: 0 !important; height: auto !important;
        box-shadow: none !important; border-radius: 0 !important;
        margin: 0 !important; padding: 0 !important; overflow: visible !important; background: #fff !important;
    }
    [id^="page-"] { min-height: 0 !important; height: auto !important; }

    thead { display: table-header-group !important; }
    tfoot { display: table-footer-group !important; }
    tr { page-break-inside: avoid !important; break-inside: avoid !important; }

    .print-table tbody td img, .snapshot-body table td img {
        width: 40mm !important; height: 30mm !important;
    }
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">جاري تحضير الطباعة...</div>
</div>

<div class="top-controls">
    <button class="btn-print" onclick="window.printNative()"><i class="fas fa-print"></i> طباعة / حفظ PDF</button>
    <button class="btn-close" onclick="window.close()"><i class="fas fa-times"></i> إغلاق</button>
</div>

<div class="page-wrapper">
    <div class="page" id="copied-content"></div>
</div>

<script>
(function () {
    'use strict';

    const params = new URLSearchParams(location.search);
    const storageKey = params.get('key') || 'print_data';
    const pageType = params.get('type') || 'fleet';

    const TITLES = {
        fleet: 'الأسطول البحري',
        vehicles: 'الوسائل البرية - الحرس البحري',
        efficiency: 'جاهزية الأسطول',
        maintenance: 'سجل الصيانة والتدخلات',
        logs: 'سجلات الصيانة',
        users: 'إدارة المستخدمين',
        notes: 'المذكرات',
        support: 'مركز الدعم الفني',
        'disposals-vessels': 'الوسائل البحرية المطروحة',
        'disposals-vehicles': 'الوسائل البرية المطروحة'
    };

    document.title = (TITLES[pageType] || 'طباعة') + ' — منظومة الوسائل البحرية';

    const root = document.getElementById('copied-content');

    function esc(v) {
        return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function loadData() {
        try {
            const raw = localStorage.getItem(storageKey);
            if (raw) return JSON.parse(raw);
        } catch (e) { console.error('Load error:', e); }
        return null;
    }

    const fill = c => 'background:' + c + ';box-shadow:inset 0 0 0 9999px ' + c + ';';

    function buildLetterhead(title) {
        return `
        <header class="letterhead" style="padding:5mm 12mm 3.5mm;margin-bottom:4mm;border-bottom:3px double #0f2744;">
            <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8mm;align-items:start;">
                <div style="text-align:right;font-size:8.5pt;line-height:1.55;color:#0f2744;font-weight:600;">
                    <div style="font-weight:900;font-size:10pt;margin-bottom:1mm;">الجمهورية التونسية</div>
                    وزارة الداخلية<br>
                    كتابة الدولة للأمن<br>
                    الإدارة العامة للحرس الوطني<br>
                    الإدارة العامة لحرس الحدود<br>
                    إدارة إسناد الوحدات البحرية
                    <div style="margin-top:2.5mm;font-size:9pt;font-weight:800;">ع/ ________ /دد</div>
                </div>
                <div style="align-self:center;text-align:center;min-width:80mm;border:1.5px solid #0f2744;padding:3mm 8mm;">
                    <div style="font-size:7.5pt;color:#64748b;font-weight:700;margin-bottom:1mm;">منظومة الوسائل البحرية</div>
                    <h1 style="font-size:13pt;font-weight:900;color:#0f2744;margin:0;">${esc(title)}</h1>
                </div>
                <div style="text-align:left;font-size:8.5pt;color:#0f2744;font-weight:600;">
                    العوينة في: __________
                </div>
            </div>
        </header>`;
    }

    function buildFooter() {
        const dateStr = new Date().toLocaleDateString('ar-TN', {
            year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        return `
        <footer style="margin:5mm 0 0;padding-top:2.5mm;border-top:1.5px solid #0f2744;display:grid;grid-template-columns:1fr auto 1fr;gap:4mm;align-items:center;font-size:7.5pt;color:#475569;font-weight:600;page-break-inside:avoid;break-inside:avoid;">
            <div style="text-align:right;">منظومة الوسائل البحرية v11.2.0</div>
            <div style="text-align:center;font-weight:800;color:#0f2744;">إدارة إسناد الوحدات البحرية</div>
            <div style="text-align:left;">${dateStr}</div>
        </footer>`;
    }

    const EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}️‍]/gu;

    function cleanSnapshot(container) {
        container.querySelectorAll(
            'button, .eff-header-actions, .filter-bar, .scroll-nav, .btn-action, .btn-filter, ' +
            '.chart-switch, .no-print, .back-to-top, .pagination, script'
        ).forEach(el => el.remove());

        container.querySelectorAll('canvas').forEach(c => c.remove());
        container.querySelectorAll('.chart-section').forEach(sec => { if (!sec.querySelector('table')) sec.remove(); });
        container.querySelectorAll('.chart-box').forEach(box => { if (!box.querySelector('table')) box.remove(); });

        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(n => {
            if (EMOJI_RE.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(EMOJI_RE, '').replace(/^\s+|\s+$/g, ' ');
            EMOJI_RE.lastIndex = 0;
        });
    }

    function wrapSnapshot(innerHTML, title) {
        return buildLetterhead(title) +
            `<div class="snapshot-body" style="padding:0 4mm;">${innerHTML}${buildFooter()}</div>`;
    }

    function buildFromData(data) {
        const section = data.sectionTitle || 'السجل التفصيلي';
        const stats = data.stats || [];
        let columns = (data.columns || []).slice();
        const rows = data.rows || [];
        const title = data.title || TITLES[pageType] || 'منظومة الوسائل البحرية';

        const IMG_W = '40mm', IMG_H = '30mm', IMG_COL = '44mm';

        const isImg = c => c && typeof c === 'object' && c.type === 'image';
        const rowCells = r => Array.isArray(r) ? r : Object.values(r);
        const labelOf = c => typeof c === 'string' ? c : ((c && c.label) || '');
        let maxCells = 0, imgIdx = -1;
        rows.forEach(r => {
            const cs = rowCells(r);
            maxCells = Math.max(maxCells, cs.length);
            if (imgIdx < 0) { const k = cs.findIndex(isImg); if (k >= 0) imgIdx = k; }
        });
        const hdrImg = columns.findIndex(c => /صورة/.test(labelOf(c)));
        let lead = 0;
        if (imgIdx >= 0 && hdrImg >= 0 && imgIdx > hdrImg) lead = imgIdx - hdrImg;
        else if (maxCells > columns.length) lead = maxCells - columns.length;
        for (let i = 0; i < lead; i++) columns.unshift('م');
        while (columns.length < maxCells) columns.push('');
        const imgCols = new Set();
        rows.forEach(r => rowCells(r).forEach((c, i) => { if (isImg(c)) imgCols.add(i); }));

        let html = buildLetterhead(title);

        if (stats.length) {
            html += '<section style="display:grid;grid-template-columns:repeat(' + stats.length + ',1fr);gap:4mm;padding:4mm 12mm 3mm;">';
            const colors = ['#0f2744', '#059669', '#2563eb', '#dc2626', '#b8860b'];
            stats.forEach((s, i) => {
                const color = colors[i] || '#0f2744';
                html += `
                <div style="padding:3mm 2mm;border:1px solid #cbd5e1;border-top:3px solid ${color};border-radius:1.5mm;text-align:center;break-inside:avoid;">
                    <div style="font-size:20pt;font-weight:900;color:${color};line-height:1.1;margin-bottom:1.5mm;">${esc(s.value || '0')}</div>
                    <div style="font-size:8pt;color:#475569;font-weight:700;">${esc(s.label || '')}</div>
                </div>`;
            });
            html += '</section>';
        }

        html += `<div style="padding:2.5mm 5mm;${fill('#0f2744')}color:#ffffff;font-size:10pt;font-weight:800;border-bottom:2px solid #c9a227;margin:0 12mm;break-after:avoid;">${esc(section)}</div>`;

        html += '<div style="margin:0 4mm 4mm;border:1px solid #cbd5e1;border-top:none;">';
        html += '<table class="print-table" style="width:100%;border-collapse:collapse;table-layout:auto;font-size:7.5pt;">';
        html += '<colgroup>' + columns.map((c, i) =>
            imgCols.has(i) ? `<col style="width:${IMG_COL}">` : (labelOf(c) === 'م' ? '<col style="width:9mm">' : '<col>')
        ).join('') + '</colgroup>';
        html += '<thead>';
        if (columns.length) {
            html += '<tr>';
            columns.forEach((c, i) => {
                html += `<th style="${imgCols.has(i) ? 'width:' + IMG_COL + ';' : ''}padding:1.2mm 0.6mm;${fill('#e8edf5')}color:#0f2744;font-weight:800;font-size:7.5pt;text-align:center;border-bottom:2px solid #0f2744;border-left:1px solid #cbd5e1;white-space:normal;">${esc(labelOf(c))}</th>`;
            });
            html += '</tr>';
        }
        html += '</thead><tbody>';

        const tdBase = 'border-bottom:1px solid #e2e8f0;border-left:1px solid #e2e8f0;';
        rows.forEach(row => {
            const cells = rowCells(row).slice();
            while (cells.length < columns.length) cells.push('');
            html += '<tr>';
            cells.forEach(cell => {
                if (typeof cell === 'object' && cell !== null) {
                    if (cell.type === 'image') {
                        const url = cell.url || cell.src || '';
                        if (url) {
                            html += `<td style="width:${IMG_COL};padding:1mm;text-align:center;vertical-align:middle;${tdBase}"><img src="${esc(url)}" alt="صورة" style="width:${IMG_W};height:${IMG_H};object-fit:cover;border-radius:1.5mm;border:1px solid #94a3b8;display:block;margin:0 auto;"></td>`;
                        } else {
                            html += `<td style="width:${IMG_COL};padding:1mm;text-align:center;vertical-align:middle;${tdBase}"><div style="width:${IMG_W};height:16mm;margin:0 auto;${fill('#f1f5f9')}border:1px dashed #94a3b8;border-radius:1.5mm;display:flex;align-items:center;justify-content:center;font-size:9pt;color:#94a3b8;">لا توجد صورة</div></td>`;
                        }
                        return;
                    }
                    if (cell.type === 'badge') {
                        const variants = {
                            success: ['#059669', '#047857'], danger: ['#dc2626', '#b91c1c'],
                            warning: ['#d97706', '#b45309'], info: ['#2563eb', '#1e40af'], neutral: ['#64748b', '#334155']
                        };
                        const v = variants[cell.variant] || variants.neutral;
                        html += `<td style="padding:0.5mm;text-align:center;vertical-align:middle;${tdBase}"><span style="${fill(v[0])}color:#fff;border:1px solid ${v[1]};padding:.4mm 2mm;border-radius:2mm;font-size:6.5pt;font-weight:800;display:inline-block;white-space:nowrap;">${esc(cell.text || '')}</span></td>`;
                        return;
                    }
                }
                const value = (cell === null || cell === undefined || cell === '') ? '—' : esc(cell);
                html += `<td style="padding:1mm 0.6mm;text-align:center;vertical-align:middle;word-break:break-word;font-size:7.5pt;color:#1e293b;font-weight:600;${tdBase}">${value}</td>`;
            });
            html += '</tr>';
        });
        html += '</tbody></table></div>';
        html += buildFooter().replace('margin:5mm 0 0', 'margin:5mm 4mm 0');
        return html;
    }

    function waitForImages(container) {
        const imgs = Array.from(container.querySelectorAll('img'));
        return Promise.all(imgs.map(img => {
            if (img.complete && img.naturalWidth) return Promise.resolve();
            return new Promise(res => {
                img.addEventListener('load', res, { once: true });
                img.addEventListener('error', res, { once: true });
            });
        }));
    }

    function unpinElements(container) {
        container.querySelectorAll('*').forEach(el => {
            const p = getComputedStyle(el).position;
            if (p === 'fixed' || p === 'sticky') el.style.setProperty('position', 'static', 'important');
        });
    }

    function purgeInjected() {
        document.querySelectorAll('#official-print-header, #user-info-badge, #dev-signature, .print-unified-header')
            .forEach(el => el.remove());
        Array.from(document.body.children).forEach(el => {
            if (!el.matches('.loading-overlay, .top-controls, .page-wrapper, script, style, link, noscript')) el.remove();
        });
        const wrap = document.querySelector('.page-wrapper');
        if (wrap) Array.from(wrap.children).forEach(el => { if (!el.classList.contains('page')) el.remove(); });
    }
    purgeInjected();
    new MutationObserver(purgeInjected).observe(document.body, { childList: true });

    window.printNative = function () { window.print(); };

    function init() {
        const loading = document.getElementById('loadingOverlay');
        const data = loadData();

        if (!data) {
            root.innerHTML = '<div style="padding:40mm;text-align:center;color:#999;font-size:14pt;">⚠️ لا توجد بيانات للطباعة</div>';
            loading.style.display = 'none';
            return;
        }

        const title = data.title || TITLES[pageType] || 'منظومة الوسائل البحرية';

        if (data.htmlSnapshot) {
            const tmp = document.createElement('div');
            tmp.innerHTML = data.htmlSnapshot;
            cleanSnapshot(tmp);
            root.innerHTML = wrapSnapshot(tmp.innerHTML, title);
            unpinElements(root);
        } else if (data.rows && data.rows.length > 0) {
            root.innerHTML = buildFromData(data);
        } else {
            root.innerHTML = '<div style="padding:40mm;text-align:center;color:#999;font-size:14pt;">لا توجد بيانات</div>';
        }

        waitForImages(root).then(() => { loading.style.display = 'none'; });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
})();
</script>

</body>
</html>
