<!-- PRINT_PAGE_NO_INJECT -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طباعة — منظومة الوسائل البحرية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ═══════════════════════════════════════════════════════════ */
/* 🎨 إعدادات عامة                                             */
/* ═══════════════════════════════════════════════════════════ */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    direction: rtl;
    background: #525659; /* خلفية رمادية للمعاينة */
    color: #111827;
    min-height: 100vh;
}

/* شريط التحكم */
.top-controls {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; z-index: 9999;
    background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
    padding: 10px 20px; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}
.top-controls button {
    padding: 10px 24px; border: none; border-radius: 10px;
    font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s;
}
.btn-print { background: linear-gradient(135deg, #d4a843, #e8c77a); color: #0f172a; box-shadow: 0 4px 12px rgba(212,168,67,0.4); }
.btn-print:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212,168,67,0.6); }
.btn-close { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

/* ═══════════════════════════════════════════════════════════ */
/* ⏳ Loading                                                   */
/* ═══════════════════════════════════════════════════════════ */
.loading-overlay {
    position: fixed; inset: 0; background: #525659;
    display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; gap: 20px;
}
.spinner { width: 52px; height: 52px; border: 4px solid #e2e8f0; border-top-color: #d4a843; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 16px; color: #fff; font-weight: 700; }

/* ═══════════════════════════════════════════════════════════ */
/* 📄 هيكل الصفحة A4 Landscape                                 */
/* ═══════════════════════════════════════════════════════════ */
.page-wrapper {
    max-width: 297mm; margin: 80px auto 30px; padding: 0 20px;
}
.page {
    width: 297mm; min-height: 210mm; margin: 0 auto; background: #ffffff;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); border-radius: 8px;
    overflow: hidden; position: relative;
}

/* إخفاء العناصر التفاعلية داخل المحتوى */
#copied-content button,
#copied-content .eff-header-actions,
#copied-content .filter-bar,
#copied-content .scroll-nav,
#copied-content .btn-action,
#copied-content .btn-filter,
#copied-content .chart-switch,
#copied-content .no-print,
#copied-content .back-to-top,
#copied-content .pagination {
    display: none !important;
}

/* ═══════════════════════════════════════════════════════════ */
/* 🏛️ الترويسة المخفية (تُطبع عبر @page)                         */
/* ═══════════════════════════════════════════════════════════ */
.print-header-running { display: none; }

/* ═══════════════════════════════════════════════════════════ */
/* 🖨️ إعدادات الطباعة (السر كله هنا)                            */
/* ═══════════════════════════════════════════════════════════ */
@page {
    size: A4 landscape;
    margin: 35mm 8mm 15mm 8mm; /* مساحة علوية للترويسة وسفلية للتذييل */
    
    /* ✅ تكرار الترويسة في كل صفحة تلقائياً */
    @top-center {
        content: element(printHeader);
        width: 100%;
    }
    
    /* ✅ ترقيم الصفحات في الأسفل */
    @bottom-center {
        content: "صفحة " counter(page) " من " counter(pages);
        font-family: 'Cairo', sans-serif;
        font-size: 8pt;
        color: #64748b;
    }
}

@media print {
    html, body { background: #ffffff !important; margin: 0 !important; padding: 0 !important; }
    
    .top-controls, .loading-overlay { display: none !important; }
    
    .page-wrapper { margin: 0 !important; padding: 0 !important; max-width: none !important; }
    
    .page {
        width: 100% !important; min-height: auto !important;
        box-shadow: none !important; border-radius: 0 !important;
        margin: 0 !important; padding: 0 !important;
    }

    /* ✅ تفعيل الترويسة المتكررة */
    .print-header-running {
        display: block !important;
        position: running(printHeader);
    }

    /* إخفاء الترويسات الافتراضية من السيرفر */
    #official-print-header, #user-info-badge, #dev-signature { display: none !important; }

    /* ✅ إجبار المتصفح على طباعة الألوان (حل مشكلة المربع الأسود) */
    #copied-content * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
    }

    /* ✅ السماح للجداول الطويلة بالامتداد للصفحة التالية */
    #copied-content table, 
    #copied-content .eff-section, 
    #copied-content .stat-card {
        page-break-inside: auto !important;
        break-inside: auto !important;
    }

    /* ✅ منع قطع الصف الواحد في منتصفه (مهم جداً) */
    #copied-content tr, 
    #copied-content table tr {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
    }

    /* ✅ تكرار رؤوس أعمدة الجدول في كل صفحة */
    #copied-content thead { 
        display: table-header-group !important; 
    }

    /* تحسين وضوح الصور */
    #copied-content img {
        image-rendering: -webkit-optimize-contrast !important;
        image-rendering: crisp-edges !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">جاري تحضير الطباعة...</div>
</div>

<div class="top-controls">
    <button class="btn-print" onclick="window.print()">
        <i class="fas fa-print"></i> طباعة / PDF
    </button>
    <button class="btn-close" onclick="window.close()">
        <i class="fas fa-times"></i> إغلاق
    </button>
</div>

<div class="page-wrapper">
    <!-- ✅ الترويسة الرسمية (تتكرر في كل صفحة بفضل CSS) -->
    <div class="print-header-running">
        <div style="padding:4mm 6mm 3mm; border-bottom:2px solid #0a1628; background:#ffffff;">
            <div style="display:grid; grid-template-columns:1fr auto 1fr; gap:8mm; align-items:flex-start;">
                <div style="text-align:right; font-size:8.5pt; line-height:1.5; color:#0a1628; font-weight:600;">
                    <div style="font-weight:900; font-size:9.5pt;">الجمهورية التونسية</div>
                    وزارة الداخلية<br>
                    كتابة الدولة للأمن<br>
                    الإدارة العامة للحرس الوطني<br>
                    الإدارة العامة لحرس الحدود<br>
                    إدارة إسناد الوحدات البحرية
                    <div style="margin-top:2mm; font-size:9pt; font-weight:800;">ع/ ________ /دد</div>
                </div>
                <div style="text-align:center; align-self:center; min-width:70mm;">
                    <div style="font-size:14pt; color:#d4a843; margin-bottom:1mm;">⚓</div>
                    <h1 id="printHeaderTitle" style="font-size:12pt; font-weight:900; color:#0a1628; margin:0;">منظومة الوسائل البحرية</h1>
                </div>
                <div style="text-align:left; font-size:8.5pt; color:#0a1628; font-weight:600;">
                    العوينة في: __________
                </div>
            </div>
        </div>
    </div>

    <!-- المحتوى المُستنسخ من الشاشة -->
    <div class="page" id="copied-content"></div>
</div>

<script>
(function() {
    'use strict';

    const params = new URLSearchParams(location.search);
    const storageKey = params.get('key') || 'print_data';
    const pageType = params.get('type') || 'fleet';

    const TITLES = {
        fleet: 'الأسطول البحري',
        vehicles: 'الوسائل البرية - الحرس البحري',
        efficiency: 'جاهزية الأسطول',
        maintenance: 'سجل الصيانة والتدخلات',
        logs: 'سجلات الصيانة'
    };

    document.title = (TITLES[pageType] || 'طباعة') + ' — منظومة الوسائل البحرية';

    function loadData() {
        try {
            const raw = localStorage.getItem(storageKey);
            if (raw) return JSON.parse(raw);
        } catch (e) {}
        return null;
    }

    function init() {
        const loading = document.getElementById('loadingOverlay');
        const content = document.getElementById('copied-content');
        const data = loadData();

        if (!data || !data.htmlSnapshot) {
            content.innerHTML = '<div style="padding:40mm;text-align:center;color:#999;font-size:14pt;">⚠️ لا توجد بيانات للطباعة</div>';
            if (loading) loading.style.display = 'none';
            return;
        }

        // تحديث عنوان الترويسة
        const headerTitle = document.getElementById('printHeaderTitle');
        if (headerTitle) {
            headerTitle.textContent = data.title || TITLES[pageType] || 'منظومة الوسائل البحرية';
        }

        // عرض التصميم الأصلي كما هو
        content.innerHTML = data.htmlSnapshot;
        
        // إزالة الأزرار من داخل المحتوى المستنسخ
        content.querySelectorAll('button, .eff-header-actions, .filter-bar, .scroll-nav, .btn-action, .btn-filter, .chart-switch, .no-print, .back-to-top, .pagination').forEach(el => el.remove());

        if (loading) loading.style.display = 'none';
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>

</body>
</html>
