<!-- PRINT_PAGE_NO_INJECT -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طباعة — منظومة الوسائل البحرية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    direction: rtl;
    background: #e5e7eb;
    color: #111827;
    min-height: 100vh;
}

/* ═══════════════════════════════════════════════════════════ */
/* 🎨 شريط التحكم                                              */
/* ═══════════════════════════════════════════════════════════ */
.top-controls {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 10px;
    z-index: 9999;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(12px);
    padding: 10px;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    border: 1px solid #e2e8f0;
}

.top-controls button {
    padding: 10px 22px;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
}

.btn-print {
    background: linear-gradient(135deg, #d4a843 0%, #e8c77a 100%);
    color: #0f172a;
    box-shadow: 0 4px 12px rgba(212, 168, 67, 0.4);
}

.btn-print:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(212, 168, 67, 0.6);
}

.btn-close {
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #e2e8f0;
}

.btn-close:hover { background: #e2e8f0; }

/* ═══════════════════════════════════════════════════════════ */
/* ⏳ Loading                                                   */
/* ═══════════════════════════════════════════════════════════ */
.loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(241, 245, 249, 0.98);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    gap: 20px;
}

.spinner {
    width: 52px;
    height: 52px;
    border: 4px solid #e2e8f0;
    border-top-color: #d4a843;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
    font-size: 14px;
    color: #475569;
    font-weight: 700;
}

/* ═══════════════════════════════════════════════════════════ */
/* 📄 المحتوى                                                   */
/* ═══════════════════════════════════════════════════════════ */
.page-wrapper {
    max-width: 297mm;
    margin: 80px auto 30px;
    padding: 0 20px;
}

.page {
    width: 297mm;
    min-height: 210mm;
    margin: 0 auto;
    background: #ffffff;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
}

/* إخفاء العناصر التفاعلية داخل المحتوى */
#copied-content button,
#copied-content .eff-header-actions,
#copied-content .filter-bar,
#copied-content .scroll-nav,
#copied-content .btn-action,
#copied-content .btn-filter,
#copied-content .chart-switch,
#copied-content .no-print,
#copied-content .back-to-top,
#copied-content .pagination {
    display: none !important;
}

/* ═══════════════════════════════════════════════════════════ */
/* 🖼️ الترويسة الموحدة                                         */
/* ═══════════════════════════════════════════════════════════ */
.print-unified-header {
    display: none;
    padding: 8mm 12mm 5mm;
    border-bottom: 2px solid #0a1628;
    background: #ffffff;
    margin-bottom: 4mm;
    page-break-after: avoid;
    break-after: avoid;
}

.print-unified-header .header-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8mm;
    align-items: flex-start;
}

.print-unified-header .header-right {
    text-align: right;
    font-size: 9pt;
    line-height: 1.55;
    color: #0a1628;
    font-weight: 600;
}

.print-unified-header .header-right .country {
    font-weight: 900;
    font-size: 10pt;
    margin-bottom: 1mm;
}

.print-unified-header .header-right .ref {
    margin-top: 2.5mm;
    padding-top: 1.5mm;
    border-top: 1px solid #d4a843;
    font-size: 10pt;
    font-weight: 800;
}

.print-unified-header .header-center {
    text-align: center;
    align-self: center;
    min-width: 80mm;
}

.print-unified-header .header-center .anchor {
    width: 13mm;
    height: 13mm;
    border: 2px solid #d4a843;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18pt;
    color: #d4a843;
    margin-bottom: 2mm;
    background: #fffbeb;
}

.print-unified-header .header-center h1 {
    font-size: 14pt;
    font-weight: 900;
    color: #0a1628;
    margin: 0;
    line-height: 1.3;
}

.print-unified-header .header-center .subtitle {
    font-size: 8pt;
    color: #64748b;
    margin-top: 1mm;
}

.print-unified-header .header-left {
    text-align: left;
    font-size: 9pt;
    color: #0a1628;
    font-weight: 600;
    align-self: flex-start;
    padding-top: 2mm;
}

/* ═══════════════════════════════════════════════════════════ */
/* 🖼️ صور واضحة في الطباعة                                      */
/* ═══════════════════════════════════════════════════════════ */
#printedContent img,
.print-table img {
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    -ms-interpolation-mode: bicubic;
    max-width: 100%;
    height: auto;
}

/* صور الجدول - في الشاشة */
.print-table tbody td img {
    width: 24mm;
    height: 24mm;
    object-fit: cover;
    border-radius: 1.5mm;
    border: 1px solid #d4a843;
    background: #fffbeb;
    display: block;
    margin: 0 auto;
}

/* ═══════════════════════════════════════════════════════════ */
/* 📄 A4 Landscape                                             */
/* ═══════════════════════════════════════════════════════════ */
@page {
    size: A4 landscape;
    margin: 6mm 8mm;
}

/* ═══════════════════════════════════════════════════════════ */
/* 🖨️ PRINT MODE                                               */
/* ═══════════════════════════════════════════════════════════ */
@media print {
    html, body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .top-controls,
    .loading-overlay { display: none !important; }

    .page-wrapper {
        margin: 0 !important;
        padding: 0 !important;
        max-width: none !important;
    }

    .page {
        width: 100% !important;
        min-height: auto !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    /* ✅ اعرض الترويسة الموحدة */
    .print-unified-header {
        display: block !important;
        page-break-after: avoid !important;
        break-after: avoid !important;
    }

    /* ✅ إخفاء الترويسات الافتراضية من الحقن */
    #official-print-header,
    #user-info-badge,
    #dev-signature { display: none !important; }

    /* إخفاء الخلفيات الداكنة */
    #page-efficiency,
    #page-fleet,
    #page-vehicles,
    #page-maintenance,
    #page-users {
        background: #ffffff !important;
        background-image: none !important;
    }

    #page-efficiency::before { display: none !important; }

    /* الترويسات الداخلية */
    .eff-header, .fleet-header {
        background: #ffffff !important;
        border: 2px solid #0a1628 !important;
        box-shadow: none !important;
    }

    .eff-header-left h2,
    .fleet-header-left h2 {
        color: #0a1628 !important;
        -webkit-text-fill-color: #0a1628 !important;
        background: none !important;
        -webkit-background-clip: unset !important;
        background-clip: unset !important;
    }

    .eff-header-left p,
    .fleet-header-left p { color: #475569 !important; }

    /* الإحصائيات */
    .stat-card {
        background: #ffffff !important;
        border: 1.5px solid #d4a843 !important;
        box-shadow: none !important;
    }

    .stat-card .number { text-shadow: none !important; filter: none !important; }
    .stat-card .label { color: #1e293b !important; }

    /* الأقسام */
    .eff-section {
        background: #ffffff !important;
        border: 1.5px solid #0a1628 !important;
        box-shadow: none !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        margin-bottom: 4mm !important;
    }

    .section-header {
        background: linear-gradient(90deg, #0a1628 0%, #1a2942 100%) !important;
        color: #ffffff !important;
        border-bottom: 3px solid #d4a843 !important;
    }

    .section-header h3 { color: #f7d774 !important; }
    .section-header h3 i { color: #f7d774 !important; filter: none !important; }

    /* رؤوس الجداول */
    thead {
        display: table-header-group !important;
    }

    thead th {
        background: #0a1628 !important;
        color: #f7d774 !important;
        border-bottom: 2px solid #d4a843 !important;
        text-shadow: none !important;
        -webkit-text-fill-color: #f7d774 !important;
        padding: 2mm 1mm !important;
        font-size: 8pt !important;
    }

    thead th i { color: #f7d774 !important; filter: none !important; }

    /* الخلايا */
    tbody td {
        color: #0a1628 !important;
        border-bottom: 1px solid #e2e8f0 !important;
        border-left: 1px solid #e2e8f0 !important;
        padding: 1.5mm 1mm !important;
        font-size: 7.5pt !important;
    }

    tbody tr:nth-child(even) { background: #f8fafc !important; }

    /* ✅ صور واضحة في الطباعة */
    .print-table tbody td img,
    #printedContent img {
        width: 22mm !important;
        height: 22mm !important;
        object-fit: cover !important;
        border-radius: 1.5mm !important;
        border: 1px solid #d4a843 !important;
        background: #fffbeb !important;
        image-rendering: -webkit-optimize-contrast !important;
        image-rendering: crisp-edges !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        display: block !important;
        margin: 0 auto !important;
    }

    /* الصفوف الملونة */
    .row-high {
        background: #d1fae5 !important;
        border-right: 4px solid #10b981 !important;
    }
    .row-high td:first-child { color: #059669 !important; font-weight: 800 !important; }

    .row-mid {
        background: #fef3c7 !important;
        border-right: 4px solid #f59e0b !important;
    }
    .row-mid td:first-child { color: #b45309 !important; font-weight: 800 !important; }

    .row-low {
        background: #fee2e2 !important;
        border-right: 4px solid #ef4444 !important;
    }
    .row-low td:first-child { color: #b91c1c !important; font-weight: 800 !important; }

    /* الشارات */
    .status-badge {
        padding: 1mm 3mm !important;
        border-radius: 3mm !important;
        font-weight: 800 !important;
        color: #ffffff !important;
        display: inline-block !important;
        box-shadow: none !important;
        animation: none !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    .status-badge.excellent { background: #059669 !important; }
    .status-badge.good { background: #047857 !important; }
    .status-badge.medium { background: #d97706 !important; }
    .status-badge.low { background: #dc2626 !important; }
    .status-badge.critical { background: #991b1b !important; }

    .badge { box-shadow: none !important; animation: none !important; }
    .badge.success { background: #ecfdf5 !important; color: #059669 !important; border: 1px solid #10b981 !important; }
    .badge.warning { background: #fffbeb !important; color: #b45309 !important; border: 1px solid #f59e0b !important; }
    .badge.danger { background: #fef2f2 !important; color: #b91c1c !important; border: 1px solid #ef4444 !important; }
    .badge.gold { background: #fffbeb !important; color: #a88a2e !important; border: 1px solid #d4a843 !important; }

    /* أشرطة التقدم */
    .progress-bar {
        background: #e2e8f0 !important;
        border: 0.5px solid #cbd5e1 !important;
    }
    .progress-fill.high { background: linear-gradient(90deg, #047857, #10b981) !important; }
    .progress-fill.mid { background: linear-gradient(90deg, #b45309, #f59e0b) !important; }
    .progress-fill.low { background: linear-gradient(90deg, #b91c1c, #ef4444) !important; }

    /* الرسم البياني */
    .chart-section {
        background: #ffffff !important;
        border: 1.5px solid #0a1628 !important;
        page-break-inside: avoid !important;
    }

    .chart-section .chart-switch { display: none !important; }

    .chart-box {
        background: #ffffff !important;
        border: none !important;
        padding: 3mm !important;
    }

    .chart-box h4 {
        color: #0a1628 !important;
        -webkit-text-fill-color: #0a1628 !important;
        border-bottom: 1pt solid #12121a !important;
        padding-bottom: 2mm !important;
    }

    /* ═══ عام ═══ */
    * {
        animation: none !important;
        transition: none !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
    }

    table { 
        page-break-inside: auto !important;
        width: 100% !important;
        border-collapse: collapse !important;
    }
    tr { 
        page-break-inside: avoid !important;
        break-inside: avoid !important;
    }
    thead { display: table-header-group !important; }
    tfoot { display: table-footer-group !important; }
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">جاري تحضير الطباعة...</div>
</div>

<div class="top-controls">
    <button class="btn-print" onclick="window.print()">
        <i class="fas fa-print"></i> طباعة / PDF
    </button>
    <button class="btn-close" onclick="window.close()">
        <i class="fas fa-times"></i> إغلاق
    </button>
</div>

<div class="page-wrapper">

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- 🏛️ الترويسة الرسمية الموحدة (تظهر فقط في الطباعة)       -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <div class="print-unified-header" id="unifiedPrintHeader">
        <div class="header-grid">
            <div class="header-right">
                <div class="country">الجمهورية التونسية</div>
                وزارة الداخلية<br>
                كتابة الدولة للأمن<br>
                الإدارة العامة للحرس الوطني<br>
                الإدارة العامة لحرس الحدود<br>
                إدارة إسناد الوحدات البحرية
                <div class="ref">ع/ ________ /دد</div>
            </div>
            <div class="header-center">
                <div class="anchor">⚓</div>
                <h1 id="printHeaderTitle">منظومة الوسائل البحرية</h1>
                <div class="subtitle" id="printHeaderSubtitle"></div>
            </div>
            <div class="header-left">
                العوينة في: __________
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- 📄 المحتوى المُستنسخ                                     -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <div class="page" id="copied-content"></div>
</div>

<script>
(function() {
    'use strict';

    const params = new URLSearchParams(location.search);
    const storageKey = params.get('key') || 'print_data';
    const pageType = params.get('type') || 'fleet';

    // ═══════════════════════════════════════════════════════════
    // 📋 العناوين الافتراضية لكل نوع صفحة
    // ═══════════════════════════════════════════════════════════
    const TITLES = {
        fleet: 'الأسطول البحري',
        vehicles: 'الوسائل البرية - الحرس البحري',
        efficiency: 'جاهزية الأسطول',
        maintenance: 'سجل الصيانة والتدخلات',
        logs: 'سجلات الصيانة',
        users: 'إدارة المستخدمين',
        notes: 'المذكرات',
        support: 'مركز الدعم الفني',
        'disposals-vessels': 'الوسائل البحرية المطروحة',
        'disposals-vehicles': 'الوسائل البرية المطروحة'
    };

    const SUBTITLES = {
        fleet: 'السجل التفصيلي للوحدات البحرية',
        vehicles: 'سجل الوسائل البرية',
        efficiency: 'مؤشرات الجاهزية التشغيلية',
        maintenance: 'سجل التدخلات والصيانة',
        logs: 'سجل النشاطات',
        users: 'قائمة مستخدمي النظام'
    };

    document.title = (TITLES[pageType] || 'طباعة') + ' — منظومة الوسائل البحرية';

    // ═══════════════════════════════════════════════════════════
    // 📥 تحميل البيانات
    // ═══════════════════════════════════════════════════════════
    function loadData() {
        try {
            const raw = localStorage.getItem(storageKey);
            if (raw) return JSON.parse(raw);
        } catch (e) {
            console.error('❌ Load error:', e);
        }
        return null;
    }

    // ═══════════════════════════════════════════════════════════
    // 🎯 تحديث الترويسة الموحدة
    // ═══════════════════════════════════════════════════════════
    function updateHeader(data) {
        const titleEl = document.getElementById('printHeaderTitle');
        const subtitleEl = document.getElementById('printHeaderSubtitle');

        const title = (data && data.title) || TITLES[pageType] || 'منظومة الوسائل البحرية';
        const subtitle = (data && data.subtitle) || SUBTITLES[pageType] || '';

        if (titleEl) titleEl.textContent = title;
        if (subtitleEl) {
            subtitleEl.textContent = subtitle;
            subtitleEl.style.display = subtitle ? 'block' : 'none';
        }

        console.log('🏛️ Header:', title, subtitle ? '/ ' + subtitle : '');
    }

    // ═══════════════════════════════════════════════════════════
    // 🏗️ بناء المحتوى من البيانات (data-driven)
    // ═══════════════════════════════════════════════════════════
    function buildFromData(data) {
        const section = data.sectionTitle || 'السجل التفصيلي';
        const stats = data.stats || [];
        const columns = data.columns || [];
        const rows = data.rows || [];

        let html = '';

        // الإحصائيات
        if (stats.length) {
            html += '<section style="display:grid;grid-template-columns:repeat(' + stats.length + ',1fr);gap:4mm;padding:5mm 12mm 4mm;">';
            stats.forEach((s, i) => {
                const colors = ['#0a1628', '#10b981', '#f59e0b', '#ef4444', '#d4a843'];
                const bgs = ['#f8fafc', '#ecfdf5', '#fffbeb', '#fef2f2', '#fffbeb'];
                const color = colors[i] || '#0a1628';
                const bg = bgs[i] || '#f8fafc';
                html += `
                <div style="padding:3mm 2mm;background:${bg};border:1.5px solid ${color};border-radius:3mm;text-align:center;">
                    <div style="font-size:20pt;font-weight:900;color:${color};line-height:1;margin-bottom:1.5mm;">${s.value || '0'}</div>
                    <div style="font-size:8pt;color:#1e293b;font-weight:700;">${s.label || ''}</div>
                </div>`;
            });
            html += '</section>';
        }

        // عنوان القسم
        html += `<div style="padding:2.5mm 5mm;background:linear-gradient(90deg,#0a1628 0%,#1a2942 100%);color:#ffffff;font-size:10pt;font-weight:800;border-bottom:3px solid #d4a843;margin:0 12mm;">📋 ${section}</div>`;

        // الجدول
        html += '<div style="margin:0 12mm 4mm;border:1px solid #e2e8f0;border-top:none;overflow:hidden;">';
        html += '<table class="print-table" style="width:100%;border-collapse:collapse;table-layout:fixed;font-size:8pt;">';

        if (columns.length) {
            html += '<thead><tr>';
            columns.forEach((c, i) => {
                const label = typeof c === 'string' ? c : (c.label || '');
                const style = i === 0 ? 'width:24mm;' : '';
                html += `<th style="${style}padding:2mm 1mm;background:linear-gradient(135deg,#0a1628 0%,#1a2942 100%);color:#f7d774;font-weight:800;font-size:8pt;text-align:center;border-bottom:2px solid #d4a843;border-left:1px solid rgba(247,215,116,0.15);white-space:nowrap;">${label}</th>`;
            });
            html += '</tr></thead>';
        }

        html += '<tbody>';
        rows.forEach(row => {
            const cells = Array.isArray(row) ? row : Object.values(row);
            html += '<tr>';
            cells.forEach((cell, i) => {
                if (typeof cell === 'object' && cell !== null) {
                    if (cell.type === 'image') {
                        const url = cell.url || cell.src || '';
                        if (url) {
                            html += `<td style="width:24mm;padding:1mm;text-align:center;background:#fffbeb;border-bottom:1px solid #e2e8f0;border-left:1px solid #e2e8f0;"><img src="${url}" alt="صورة" crossorigin="anonymous" style="width:22mm;height:22mm;object-fit:cover;border-radius:1.5mm;border:1px solid #d4a843;display:block;margin:0 auto;"></td>`;
                        } else {
                            html += `<td style="width:24mm;padding:1mm;text-align:center;background:#fffbeb;border-bottom:1px solid #e2e8f0;border-left:1px solid #e2e8f0;"><div style="width:22mm;height:22mm;margin:0 auto;background:#f1f5f9;border:1px dashed #94a3b8;border-radius:1.5mm;display:flex;align-items:center;justify-content:center;font-size:9pt;color:#94a3b8;">📷</div></td>`;
                        }
                        return;
                    }
                    if (cell.type === 'badge') {
                        const variants = {
                            success: 'background:#10b981;color:#fff;border:1px solid #047857;',
                            danger: 'background:#ef4444;color:#fff;border:1px solid #b91c1c;',
                            warning: 'background:#f59e0b;color:#fff;border:1px solid #b45309;',
                            info: 'background:#3b82f6;color:#fff;border:1px solid #1e40af;',
                            neutral: 'background:#64748b;color:#fff;border:1px solid #334155;'
                        };
                        const style = variants[cell.variant] || variants.neutral;
                        html += `<td style="padding:1mm;text-align:center;border-bottom:1px solid #e2e8f0;border-left:1px solid #e2e8f0;"><span style="${style}padding:0.5mm 2mm;border-radius:3mm;font-size:6.5pt;font-weight:800;display:inline-block;">${cell.text || ''}</span></td>`;
                        return;
                    }
                }
                const value = (cell === null || cell === undefined || cell === '') ? '—' : cell;
                html += `<td style="padding:1.5mm 1mm;text-align:center;font-size:7.5pt;color:#1e293b;border-bottom:1px solid #e2e8f0;border-left:1px solid #e2e8f0;font-weight:600;">${value}</td>`;
            });
            html += '</tr>';
        });
        html += '</tbody></table></div>';

        // التذييل
        const now = new Date();
        const dateStr = now.toLocaleDateString('ar-TN', {
            year: 'numeric', month: 'long', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
        html += `
        <footer style="margin:4mm 12mm;padding:2.5mm;background:linear-gradient(135deg,#0a1628 0%,#1a2942 100%);border-radius:2mm;display:grid;grid-template-columns:1fr auto 1fr;gap:4mm;align-items:center;font-size:7.5pt;color:#f7d774;border-top:3px solid #d4a843;">
            <div style="text-align:right;">منظومة الوسائل البحرية v11.2.0</div>
            <div style="text-align:center;font-weight:800;color:#ffffff;">إدارة إسناد الوحدات البحرية</div>
            <div style="text-align:left;">${dateStr}</div>
        </footer>`;

        return html;
    }

    // ═══════════════════════════════════════════════════════════
    // 🖼️ معالجة الصور داخل المحتوى (ضمان الوضوح)
    // ═══════════════════════════════════════════════════════════
    function prepareImages(container) {
        const images = container.querySelectorAll('img');

        images.forEach(img => {
            // ✅ تحميل فوري
            img.loading = 'eager';
            img.decoding = 'sync';

            // ✅ crossorigin للصور الخارجية
            if (img.src && !img.src.startsWith('data:')) {
                img.crossOrigin = 'anonymous';
            }

            // ✅ إزالة أي قيود على الحجم
            img.style.removeProperty('max-width');
            img.style.removeProperty('max-height');

            // ✅ تحسين العرض
            img.style.imageRendering = '-webkit-optimize-contrast';
            img.style.imageRendering = 'crisp-edges';
            img.style.webkitPrintColorAdjust = 'exact';
            img.style.printColorAdjust = 'exact';

            // ✅ إضافة class للتمييز
            img.classList.add('print-img-optimized');
        });

        console.log('🖼️ Images prepared:', images.length);
    }

    // ═══════════════════════════════════════════════════════════
    // 🚀 التهيئة
    // ═══════════════════════════════════════════════════════════
    function init() {
        const loading = document.getElementById('loadingOverlay');
        const content = document.getElementById('copied-content');

        const data = loadData();

        if (!data) {
            content.innerHTML = '<div style="padding:40mm;text-align:center;color:#999;font-size:14pt;">⚠️ لا توجد بيانات للطباعة</div>';
            updateHeader(null);
            if (loading) loading.style.display = 'none';
            return;
        }

        // ✅ تحديث الترويسة الموحدة أولاً
        updateHeader(data);

        // ✅ عرض المحتوى
        if (data.htmlSnapshot) {
            // استنساخ لقطة HTML
            content.innerHTML = data.htmlSnapshot;

            // حذف العناصر التفاعلية
            content.querySelectorAll(
                'button, .eff-header-actions, .filter-bar, .scroll-nav, ' +
                '.btn-action, .btn-filter, .chart-switch, .no-print, ' +
                '.back-to-top, .pagination'
            ).forEach(el => el.remove());

            // ✅ تحسين الصور
            prepareImages(content);

        } else if (data.rows && data.rows.length > 0) {
            // بناء من البيانات
            content.innerHTML = buildFromData(data);

            // ✅ تحسين الصور (بعد البناء)
            prepareImages(content);

        } else {
            content.innerHTML = '<div style="padding:40mm;text-align:center;color:#999;font-size:14pt;">لا توجد بيانات</div>';
        }

        if (loading) loading.style.display = 'none';

        console.log('%c✅ Print page ready', 'background:#10b981;color:white;padding:4px 8px;border-radius:4px;font-weight:bold;');
        console.log('   Type:', pageType);
        console.log('   Title:', data.title || TITLES[pageType]);
        console.log('   Mode:', data.htmlSnapshot ? 'HTML Clone' : 'Data Build');
        console.log('   Rows:', data.rows ? data.rows.length : 'N/A');
    }

    // ═══════════════════════════════════════════════════════════
    // ▶️ بدء التنفيذ
    // ═══════════════════════════════════════════════════════════
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>

</body>
</html>
