<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 لوحة التحكم</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: #0a0a1a;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 24px;
            color: #60a5fa;
        }
        .header .subtitle {
            color: rgba(255,255,255,0.3);
            font-size: 13px;
        }
        .refresh-btn {
            padding: 6px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s;
        }
        .refresh-btn:hover {
            background: rgba(255,255,255,0.08);
            color: white;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 16px 18px;
            transition: all 0.3s;
        }
        .stat-card:hover {
            background: rgba(255,255,255,0.04);
            transform: translateY(-2px);
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 800;
        }
        .stat-card .label {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 4px;
        }
        .stat-total .number { color: #60a5fa; }
        .stat-ready .number { color: #4ade80; }
        .stat-maintenance .number { color: #fbbf24; }
        .stat-broken .number { color: #f87171; }
        .stat-cost .number { color: #f5d76e; }
        .stat-percent .number { color: #34d399; }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .chart-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 18px;
        }
        .chart-card h4 {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 12px;
        }
        .chart-card canvas {
            width: 100% !important;
            height: 200px !important;
        }
        .activity-container {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 18px;
            margin: 20px 0;
        }
        .activity-container h4 {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 12px;
        }
        .activity-item {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
        }
        .activity-item:hover {
            background: rgba(255,255,255,0.02);
        }
        .activity-item .time {
            margin-right: auto;
            font-size: 11px;
            color: rgba(255,255,255,0.2);
        }
        .activity-empty {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.2);
        }
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 20px;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📊 لوحة التحكم</h1>
                <div class="subtitle">نظرة عامة على أداء الأسطول البحري</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-size:12px; color:rgba(255,255,255,0.3);">🕐 <span id="lastUpdate">الآن</span></span>
                <button class="refresh-btn" onclick="refreshDashboard()">🔄 تحديث</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card stat-total">
                <div class="number" id="dashTotal">0</div>
                <div class="label">🚢 إجمالي المراكب</div>
            </div>
            <div class="stat-card stat-ready">
                <div class="number" id="dashReady">0</div>
                <div class="label">✅ صالح</div>
            </div>
            <div class="stat-card stat-maintenance">
                <div class="number" id="dashMaintenance">0</div>
                <div class="label">🔧 صيانة</div>
            </div>
            <div class="stat-card stat-broken">
                <div class="number" id="dashBroken">0</div>
                <div class="label">❌ معطب</div>
            </div>
            <div class="stat-card stat-percent">
                <div class="number" id="dashReadyPercent">0%</div>
                <div class="label">📊 نسبة الجاهزية</div>
            </div>
            <div class="stat-card stat-cost">
                <div class="number" id="dashTotalCost">0 د.ت</div>
                <div class="label">💰 تكاليف الصيانة</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h4>📊 توزيع الحالات</h4>
                <canvas id="dashChart"></canvas>
            </div>
            <div class="chart-card">
                <h4>📈 تطور الجاهزية</h4>
                <canvas id="dashLineChart"></canvas>
            </div>
        </div>

        <div class="activity-container">
            <h4>🔄 آخر النشاطات</h4>
            <div id="dashActivity">
                <div class="activity-empty">⏳ جاري التحميل...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let dashChart = null;
        let dashLineChart = null;

        function refreshDashboard() {
            console.log('📊 Refreshing dashboard...');
            
            const token = localStorage.getItem('token');
            if (!token) {
                console.warn('⚠️ No token found');
                return;
            }

            // جلب المراكب
            fetch('/api/vessels', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(res => {
                if (!res.ok) throw new Error('Failed to fetch vessels');
                return res.json();
            })
            .then(vessels => {
                // جلب الصيانة
                fetch('/api/maintenance', {
                    headers: { 'Authorization': 'Bearer ' + token }
                })
                .then(res => {
                    if (!res.ok) throw new Error('Failed to fetch maintenance');
                    return res.json();
                })
                .then(maintenance => {
                    updateUI(vessels, maintenance);
                })
                .catch(() => updateUI(vessels, []));
            })
            .catch(err => {
                console.error('❌ Error:', err);
                // استخدام بيانات تجريبية
                const demo = getDemoData();
                updateUI(demo.vessels, demo.maintenance);
            });
        }

        function updateUI(vessels, maintenance) {
            const total = vessels.length;
            const ready = vessels.filter(v => v.stat === 'صالح').length;
            const broken = vessels.filter(v => v.stat === 'معطب').length;
            const maintenanceCount = vessels.filter(v => v.stat === 'صيانة').length;
            const readyPercent = total > 0 ? Math.round((ready / total) * 100) : 0;
            const totalCost = maintenance.reduce((sum, r) => sum + (r.cost || 0), 0);

            document.getElementById('dashTotal').textContent = total;
            document.getElementById('dashReady').textContent = ready;
            document.getElementById('dashBroken').textContent = broken;
            document.getElementById('dashMaintenance').textContent = maintenanceCount;
            document.getElementById('dashReadyPercent').textContent = readyPercent + '%';
            document.getElementById('dashTotalCost').textContent = totalCost.toLocaleString() + ' د.ت';
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('ar-TN');

            // الرسوم البيانية
            renderCharts(vessels);
            renderActivity(vessels, maintenance);
        }

        function renderCharts(vessels) {
            const ready = vessels.filter(v => v.stat === 'صالح').length;
            const broken = vessels.filter(v => v.stat === 'معطب').length;
            const maintenance = vessels.filter(v => v.stat === 'صيانة').length;

            try {
                const canvas = document.getElementById('dashChart');
                if (canvas) {
                    if (dashChart) dashChart.destroy();
                    dashChart = new Chart(canvas, {
                        type: 'doughnut',
                        data: {
                            labels: ['✅ صالح', '❌ معطب', '🔧 صيانة'],
                            datasets: [{
                                data: [ready, broken, maintenance],
                                backgroundColor: ['rgba(74,222,128,0.8)', 'rgba(248,113,113,0.8)', 'rgba(251,191,36,0.8)'],
                                borderColor: ['#4ade80', '#f87171', '#fbbf24'],
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '60%',
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: 'rgba(255,255,255,0.6)', font: { size: 11 } }
                                }
                            }
                        }
                    });
                }
            } catch(e) {
                console.log('Chart error:', e);
            }

            try {
                const lineCanvas = document.getElementById('dashLineChart');
                if (lineCanvas) {
                    if (dashLineChart) dashLineChart.destroy();
                    dashLineChart = new Chart(lineCanvas, {
                        type: 'line',
                        data: {
                            labels: ['جانفي', 'فيفري', 'مارس', 'أفريل', 'ماي', 'جوان'],
                            datasets: [
                                {
                                    label: 'صالح',
                                    data: [12, 14, 13, 16, 18, 20],
                                    borderColor: '#4ade80',
                                    backgroundColor: 'rgba(74,222,128,0.1)',
                                    fill: true,
                                    tension: 0.4
                                },
                                {
                                    label: 'معطب',
                                    data: [5, 4, 6, 3, 4, 2],
                                    borderColor: '#f87171',
                                    backgroundColor: 'rgba(248,113,113,0.1)',
                                    fill: true,
                                    tension: 0.4
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: 'rgba(255,255,255,0.6)', font: { size: 11 } }
                                }
                            },
                            scales: {
                                x: { ticks: { color: 'rgba(255,255,255,0.3)' } },
                                y: { ticks: { color: 'rgba(255,255,255,0.3)' }, beginAtZero: true }
                            }
                        }
                    });
                }
            } catch(e) {
                console.log('Line chart error:', e);
            }
        }

        function renderActivity(vessels, maintenance) {
            const container = document.getElementById('dashActivity');
            if (!container) return;

            const activities = [];
            maintenance.slice(0, 5).forEach(r => {
                activities.push({
                    icon: '🔧',
                    text: `صيانة ${r.vesselName || 'مركب'}`,
                    time: new Date(r.createdAt).toLocaleDateString('ar-TN') || 'اليوم'
                });
            });
            vessels.filter(v => v.stat === 'معطب').slice(0, 3).forEach(v => {
                activities.push({
                    icon: '⚠️',
                    text: `المركب ${v.name} معطب`,
                    time: new Date(v.createdAt).toLocaleDateString('ar-TN') || 'اليوم'
                });
            });

            if (activities.length === 0) {
                container.innerHTML = '<div class="activity-empty">📭 لا توجد نشاطات</div>';
                return;
            }

            container.innerHTML = activities.map(a => `
                <div class="activity-item">
                    <span>${a.icon}</span>
                    <span>${a.text}</span>
                    <span class="time">${a.time}</span>
                </div>
            `).join('');
        }

        function getDemoData() {
            return {
                vessels: [
                    { name: 'البروق 1', stat: 'صالح', zone: 'بنزرت', createdAt: new Date() },
                    { name: 'البروق 2', stat: 'صالح', zone: 'سوسة', createdAt: new Date() },
                    { name: 'البروق 3', stat: 'معطب', zone: 'صفاقس', createdAt: new Date() },
                    { name: 'البروق 4', stat: 'صيانة', zone: 'المنستير', createdAt: new Date() },
                ],
                maintenance: [
                    { vesselName: 'البروق 3', cost: 1200, status: 'مكتملة', createdAt: new Date() },
                    { vesselName: 'البروق 4', cost: 500, status: 'قيد الإنجاز', createdAt: new Date() },
                ]
            };
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('📊 Dashboard loaded');
            setTimeout(refreshDashboard, 500);
            setInterval(refreshDashboard, 30000);
        });

        window.refreshDashboard = refreshDashboard;
    </script>
</body>
</html>
