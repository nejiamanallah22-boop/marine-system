<!-- public/pages/efficiency.html -->
<div id="page-efficiency">
    <style>
        /* ============================================================
           📊 EFFICIENCY PAGE - v8.0 (FIXED CHARTS)
           ============================================================ */

        /* ===== CSS VARIABLES ===== */
        :root {
            --primary-dark: #0a1628;
            --primary: #0f3460;
            --gold: #e6b31e;
            --gold-light: #f5d76e;
            --gold-dark: #c99a0e;
            --success: #00b894;
            --success-light: #55efc4;
            --danger: #e17055;
            --warning: #fdcb6e;
            --info: #0984e3;
            --glass-bg: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.06);
            --shadow-gold: 0 0 40px rgba(230,179,30,0.08);
            --shadow-card: 0 8px 32px rgba(0,0,0,0.15);
            --shadow-hover: 0 12px 48px rgba(0,0,0,0.25);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.4s cubic-bezier(0.4,0,0.2,1);
            --font: 'Cairo', 'Segoe UI', system-ui, sans-serif;
        }

        /* ===== FULL SCREEN RESET ===== */
        #page-efficiency {
            width: 100%;
            max-width: 100%;
            padding: 0;
            margin: 0;
            font-family: var(--font);
            background: #0a0e1a;
            color: #e8edf5;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ===== BACKGROUND EFFECT ===== */
        #page-efficiency::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(230,179,30,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(0,184,148,0.03) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
            animation: bgPulse 15s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(2deg); }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-light); }

        /* ============================================================
           HEADER
           ============================================================ */
        .eff-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 64px;
            z-index: 10;
            margin: 0;
            width: 100%;
        }

        .eff-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .eff-header-left .header-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--success));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #0a1628;
            box-shadow: var(--shadow-gold);
            animation: pulseGold 2s ease-in-out infinite;
        }

        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 20px rgba(230,179,30,0.1); }
            50% { box-shadow: 0 0 40px rgba(230,179,30,0.2); }
        }

        .eff-header-left h2 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold-light), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .eff-header-left p {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin: 0;
        }

        .eff-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .eff-header-actions .btn-action {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
        }

        .eff-header-actions .btn-action.primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0a1628;
            box-shadow: var(--shadow-gold);
        }

        .eff-header-actions .btn-action.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,179,30,0.3);
        }

        .eff-header-actions .btn-action.secondary {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: rgba(255,255,255,0.5);
        }

        .eff-header-actions .btn-action.secondary:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
            transform: translateY(-2px);
        }

        /* ============================================================
           STATS CARDS
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            padding: 16px 24px;
            margin: 0;
            width: 100%;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 16px 18px;
            text-align: center;
            transition: all var(--transition);
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--success));
            opacity: 0.6;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(230,179,30,0.15);
            box-shadow: var(--shadow-hover);
        }

        .stat-card .number {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        .stat-card .number.gold { color: var(--gold-light); }
        .stat-card .number.green { color: var(--success-light); }
        .stat-card .number.yellow { color: var(--warning); }
        .stat-card .number.red { color: var(--danger); }

        .stat-card .label {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .stat-card .icon-bg {
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 50px;
            opacity: 0.04;
            pointer-events: none;
        }

        /* ============================================================
           FILTER BAR
           ============================================================ */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            padding: 10px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
            margin: 0;
            width: 100%;
        }

        .filter-bar label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-bar select {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.75rem;
            min-width: 120px;
            cursor: pointer;
            font-family: var(--font);
        }

        .filter-bar select:focus {
            outline: none;
            border-color: var(--gold);
        }

        .filter-bar select option {
            background: #0a1628;
            color: #e2e8f0;
        }

        .filter-bar .btn-filter {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-bar .btn-filter.primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0a1628;
        }

        .filter-bar .btn-filter.primary:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 20px rgba(230,179,30,0.2);
        }

        .filter-bar .btn-filter.outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: rgba(255,255,255,0.3);
        }

        .filter-bar .btn-filter.outline:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        /* ============================================================
           TABLE
           ============================================================ */
        .table-wrapper {
            overflow-x: auto;
            padding: 0 24px 24px;
            width: 100%;
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            min-width: 600px;
            border-radius: var(--radius);
            overflow: hidden;
        }

        thead {
            background: rgba(15,52,96,0.4);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(230,179,30,0.15);
        }

        thead th {
            padding: 12px 10px;
            text-align: right;
            font-weight: 700;
            font-size: 0.6rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.8px;
            white-space: nowrap;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        thead th i {
            margin-left: 6px;
            color: var(--gold);
            font-size: 0.7rem;
        }

        tbody td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            vertical-align: middle;
            color: rgba(255,255,255,0.6);
            font-size: 0.78rem;
        }

        tbody tr {
            transition: all var(--transition);
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }

        .vessel-name {
            font-weight: 700;
            color: #fff;
        }

        /* ===== STATUS BADGES ===== */
        .status-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }

        .status-badge.good {
            background: rgba(74,222,128,0.12);
            color: #4ade80;
        }

        .status-badge.warning {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
        }

        .status-badge.danger {
            background: rgba(248,113,113,0.12);
            color: #f87171;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            color: rgba(255,255,255,0.04);
            display: block;
            margin-bottom: 12px;
        }

        .empty-state .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.04);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: rgba(255,255,255,0.2);
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.1);
        }

        .empty-state .retry-btn {
            margin-top: 12px;
            padding: 8px 24px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0a1628;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }

        .empty-state .retry-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 24px rgba(230,179,30,0.2);
        }

        /* ============================================================
           CHARTS
           ============================================================ */
        .chart-switch {
            display: flex;
            gap: 10px;
            padding: 12px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-wrap: wrap;
            background: rgba(255,255,255,0.02);
        }

        .chart-btn {
            padding: 6px 18px;
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            background: transparent;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .chart-btn:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.1);
            color: #fff;
        }

        .chart-btn.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            border-color: var(--gold);
            color: #0a1628;
        }

        .chart-btn i {
            margin-left: 6px;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px 24px;
        }

        .chart-box {
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius-sm);
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .chart-box.full {
            grid-column: 1 / -1;
        }

        .chart-box h4 {
            font-size: 14px;
            font-weight: 700;
            color: rgba(255,255,255,0.5);
            margin-bottom: 12px;
            text-align: center;
        }

        .chart-box canvas {
            width: 100% !important;
            max-height: 280px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 992px) {
            .eff-header { padding: 12px 16px; top: 60px; }
            .eff-header-left h2 { font-size: 18px; }
            .stats-grid { padding: 12px 16px; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
            .filter-bar { padding: 8px 16px; gap: 6px 10px; }
            .charts-container { grid-template-columns: 1fr; padding: 12px 16px; }
            .chart-box.full { grid-column: 1; }
            .table-wrapper { padding: 0 16px 16px; }
        }

        @media (max-width: 768px) {
            .eff-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 12px 16px;
                top: 56px;
            }
            .eff-header-left { width: 100%; }
            .eff-header-left h2 { font-size: 16px; }
            .eff-header-actions { width: 100%; justify-content: flex-start; }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 10px 16px;
            }
            .stat-card { padding: 12px 14px; }
            .stat-card .number { font-size: 20px; }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 10px 16px;
                gap: 6px;
            }
            .filter-bar label { font-size: 0.65rem; }
            .filter-bar select { min-width: 100%; }
            .table-wrapper { padding: 0 12px 12px; }
            .table-wrapper table { font-size: 0.7rem; min-width: 500px; }
            thead th, tbody td { padding: 6px 4px; }
            .charts-container { padding: 10px 12px; gap: 12px; }
            .chart-box { padding: 12px; }
            .chart-box canvas { max-height: 200px; }
            .eff-header-actions .btn-action { padding: 6px 12px; font-size: 0.7rem; }
            .chart-switch { padding: 10px 16px; justify-content: center; }
            .chart-btn { font-size: 11px; padding: 4px 12px; }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .stat-card { padding: 10px 12px; }
            .stat-card .number { font-size: 18px; }
            .stat-card .label { font-size: 9px; }
            .eff-header-left .header-icon { width: 36px; height: 36px; font-size: 16px; }
            .eff-header-left h2 { font-size: 14px; }
            .eff-header-left p { font-size: 10px; }
        }
    </style>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <div class="eff-header">
        <div class="eff-header-left">
            <div class="header-icon">
                <i class="fas fa-chart-line"></i>
            </div>
            <div>
                <h2>جاهزية الأسطول</h2>
                <p>تحليل متقدم لنسب الجاهزية والأداء</p>
            </div>
        </div>
        <div class="eff-header-actions">
            <button class="btn-action primary" onclick="refreshEfficiency()">
                <i class="fas fa-sync-alt"></i> تحديث
            </button>
            <button class="btn-action secondary" onclick="window.print()">
                <i class="fas fa-print"></i> طباعة
            </button>
        </div>
    </div>

    <!-- ============================================================
    STATS CARDS
    ============================================================ -->
    <div class="stats-grid" id="statsCards">
        <div class="stat-card">
            <div class="number gold" id="totalVessels">0</div>
            <div class="label">🚢 إجمالي المراكب</div>
            <span class="icon-bg"><i class="fas fa-ship"></i></span>
        </div>
        <div class="stat-card">
            <div class="number green" id="activeVessels">0</div>
            <div class="label">✅ صالح للخدمة</div>
            <span class="icon-bg"><i class="fas fa-check-circle"></i></span>
        </div>
        <div class="stat-card">
            <div class="number yellow" id="maintenanceVessels">0</div>
            <div class="label">🔧 تحت الصيانة</div>
            <span class="icon-bg"><i class="fas fa-tools"></i></span>
        </div>
        <div class="stat-card">
            <div class="number red" id="damagedVessels">0</div>
            <div class="label">🟥 معطوبة</div>
            <span class="icon-bg"><i class="fas fa-exclamation-triangle"></i></span>
        </div>
        <div class="stat-card">
            <div class="number" id="efficiencyPercent">0%</div>
            <div class="label">📈 نسبة النجاعة</div>
            <span class="icon-bg"><i class="fas fa-chart-pie"></i></span>
        </div>
    </div>

    <!-- ============================================================
    FILTER BAR
    ============================================================ -->
    <div class="filter-bar">
        <label><i class="fas fa-map-marker-alt"></i> الإقليم</label>
        <select id="fRegEff" onchange="renderEfficiency()">
            <option value="الكل">🌍 جميع الأقاليم</option>
            <option value="الشمال">🗺️ الحرس البحري بالشمال</option>
            <option value="الساحل">🗺️ الحرس البحري بالساحل</option>
            <option value="الوسط">🗺️ الحرس البحري بالوسط</option>
            <option value="الجنوب">🗺️ الحرس البحري بالجنوب</option>

        <label><i class="fas fa-filter"></i> الفئة</label>
        <select id="fCatEff" onchange="renderEfficiency()">
            <option value="الكل">📦 جميع الفئات</option>
            <option value="البروق">البروق</option>
            <option value="صقور">صقور</option>
            <option value="خوافر">خوافر</option>
            <option value="زوارق مزدوجة">زوارق مزدوجة</option>
            <option value="طوافات">طوافات</option>
        </select>

        <label><i class="fas fa-chart-bar"></i> الحالة</label>
        <select id="fStatusEff" onchange="renderEfficiency()">
            <option value="الكل">📊 جميع الحالات</option>
            <option value="صالح">✅ صالح</option>
            <option value="صيانة">🔧 تحت الصيانة</option>
            <option value="معطب">⚠️ معطب</option>
        </select>

        <button class="btn-filter primary" onclick="renderEfficiency()">
            <i class="fas fa-filter"></i> فلترة
        </button>
        <button class="btn-filter outline" onclick="resetEfficiencyFilters()">
            <i class="fas fa-undo-alt"></i> إلغاء
        </button>
    </div>

    <!-- ============================================================
    TABLE
    ============================================================ -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th><i class="fas fa-tag"></i> الفئة</th>
                    <th><i class="fas fa-check-circle"></i> صالح</th>
                    <th><i class="fas fa-times-circle"></i> معطب</th>
                    <th><i class="fas fa-chart-line"></i> النجاعة</th>
                    <th><i class="fas fa-circle"></i> الحالة</th>
                </tr>
            </thead>
            <tbody id="efficiencyBody">
                <tr>
                    <td colspan="5" class="empty-state">
                        <div class="spinner"></div>
                        <h3>جاري تحميل البيانات...</h3>
                        <p>يرجى الانتظار</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- ============================================================
    CHARTS
    ============================================================ -->
    <div style="margin: 0 24px 20px; border: 1px solid var(--glass-border); border-radius: var(--radius); overflow: hidden; background: var(--glass-bg);">
        <div class="chart-switch">
            <button class="chart-btn active" onclick="switchChartType('doughnut', this)">
                <i class="fas fa-circle"></i> دائري
            </button>
            <button class="chart-btn" onclick="switchChartType('bar', this)">
                <i class="fas fa-chart-bar"></i> شريطي
            </button>
            <button class="chart-btn" onclick="switchChartType('line', this)">
                <i class="fas fa-chart-line"></i> خطي
            </button>
        </div>
        <div id="chartsArea">
            <div class="charts-container" id="chartsContainer">
                <div class="chart-box">
                    <h4>📊 حالة الأسطول</h4>
                    <canvas id="fleetChartCanvas"></canvas>
                </div>
                <div class="chart-box">
                    <h4>📦 توزيع المراكب حسب الفئة</h4>
                    <canvas id="categoriesChartCanvas"></canvas>
                </div>
                <div class="chart-box full">
                    <h4>🏆 مقارنة النجاعة بين الأقاليم</h4>
                    <canvas id="comparisonChartCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================
📦 JAVASCRIPT - EFFICIENCY PAGE (FIXED CHARTS)
============================================================ -->
<script>
// ============================================================
// 📊 EFFICIENCY PAGE - v8.0 (FIXED CHARTS)
// ============================================================

// ✅ تجنب إعادة تعريف المتغيرات
if (typeof window._effLoaded === 'undefined') {
    window._effLoaded = false;
}

// ============================================================
// 1. TOKEN FUNCTIONS (موحدة)
// ============================================================

function getToken() {
    return localStorage.getItem('marine_token') ||
           localStorage.getItem('token') ||
           localStorage.getItem('authToken') ||
           localStorage.getItem('accessToken') ||
           null;
}

function getAuthHeaders() {
    const token = getToken();
    return {
        'Content-Type': 'application/json',
        'Authorization': token ? 'Bearer ' + token : ''
    };
}

function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer') || document.body;
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    
    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${message}`;
    container.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(30px)';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function getEfficiencyLevel(percent) {
    if (percent >= 80) return { class: 'good', label: 'ممتاز', emoji: '🌟' };
    if (percent >= 60) return { class: 'good', label: 'جيد', emoji: '👍' };
    if (percent >= 40) return { class: 'warning', label: 'متوسط', emoji: '📊' };
    if (percent >= 20) return { class: 'warning', label: 'ضعيف', emoji: '⚠️' };
    return { class: 'danger', label: 'حرج', emoji: '🚨' };
}

function getRowClass(percent) {
    if (percent >= 80) return 'row-high';
    if (percent >= 50) return 'row-mid';
    return 'row-low';
}

// ============================================================
// 2. تحميل البيانات
// ============================================================

async function loadVessels() {
    console.log('🔄 تحميل بيانات الأسطول...');
    
    if (window.allVessels && window.allVessels.length > 0) {
        console.log('✅ تم تحميل المراكب من window.allVessels:', window.allVessels.length);
        return window.allVessels;
    }
    
    const token = getToken();
    if (!token) {
        console.warn('⚠️ لا يوجد توكن');
        return [];
    }
    
    try {
        const response = await fetch('/api/vessels', { headers: getAuthHeaders() });
        if (!response.ok) throw new Error('فشل تحميل البيانات');
        const data = await response.json();
        const vessels = data.vessels || data || [];
        window.allVessels = vessels;
        console.log('✅ تم تحميل المراكب من API:', vessels.length);
        return vessels;
    } catch (error) {
        console.error('❌ خطأ في تحميل البيانات:', error);
        showToast('❌ خطأ في تحميل البيانات: ' + error.message, 'error');
        return [];
    }
}

// ============================================================
// 3. عرض الإحصائيات
// ============================================================

function renderStats(vessels) {
    const total = vessels.length;
    const active = vessels.filter(v => v.stat === 'صالح').length;
    const maintenance = vessels.filter(v => v.stat === 'صيانة').length;
    const damaged = vessels.filter(v => v.stat === 'معطب').length;
    const efficiency = total ? ((active / total) * 100).toFixed(1) : 0;
    
    document.getElementById('totalVessels').textContent = total;
    document.getElementById('activeVessels').textContent = active;
    document.getElementById('maintenanceVessels').textContent = maintenance;
    document.getElementById('damagedVessels').textContent = damaged;
    document.getElementById('efficiencyPercent').textContent = efficiency + '%';
}

// ============================================================
// 4. عرض الجدول
// ============================================================

function renderTable(vessels) {
    const tbody = document.getElementById('efficiencyBody');
    
    const categories = ['البروق', 'صقور', 'خوافر', 'زوارق مزدوجة', 'طوافات'];
    const data = vessels || [];
    
    if (data.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="5" class="empty-state">
                    <span class="empty-icon"><i class="fas fa-inbox"></i></span>
                    <h3>لا توجد بيانات</h3>
                    <p>لم يتم العثور على مراكب مطابقة</p>
                </td>
            </tr>
        `;
        return;
    }
    
    let html = '';
    categories.forEach(cat => {
        const catData = data.filter(v => v.cat === cat);
        const ok = catData.filter(v => v.stat === 'صالح').length;
        const broken = catData.filter(v => v.stat !== 'صالح').length;
        const percent = catData.length ? ((ok / catData.length) * 100).toFixed(1) : 0;
        const level = getEfficiencyLevel(percent);
        const rowClass = getRowClass(percent);
        
        html += `
            <tr class="${rowClass}">
                <td><strong style="color:#fff;">${cat}</strong></td>
                <td style="color:#4ade80; font-weight:700;">${ok}</td>
                <td style="color:#f87171; font-weight:700;">${broken}</td>
                <td><strong>${percent}%</strong></td>
                <td>
                    <span class="status-badge ${level.class}">
                        ${level.emoji} ${level.label}
                    </span>
                </td>
            </tr>
        `;
    });
    
    tbody.innerHTML = html;
}

// ============================================================
// 5. عرض الرسوم البيانية (المُصلحة)
// ============================================================

var fleetChart = null;
var categoriesChart = null;
var comparisonChart = null;
var currentChartType = 'doughnut';

function renderCharts(vessels) {
    const data = vessels || [];
    const ok = data.filter(v => v.stat === 'صالح').length;
    const maintenance = data.filter(v => v.stat === 'صيانة').length;
    const broken = data.filter(v => v.stat === 'معطب').length;
    
    // توزيع الفئات
    const categories = ['البروق', 'صقور', 'خوافر', 'زوارق مزدوجة', 'طوافات'];
    const categoryCounts = categories.map(c => data.filter(v => v.cat === c).length);
    
    // الأقاليم
    const regions = ['الشمال', 'الساحل', 'الوسط', 'الجنوب'];
    const regionNames = {
        'الشمال': 'الشمال',
        'الساحل': 'الساحل',
        'الوسط': 'الوسط',
        'الجنوب': 'الجنوب'
    };
    const regionEfficiencies = regions.map(reg => {
        const regData = data.filter(v => v.reg === reg);
        const okReg = regData.filter(v => v.stat === 'صالح').length;
        return regData.length ? ((okReg / regData.length) * 100) : 0;
    });
    
    // ✅ التحقق من وجود Chart.js
    if (typeof Chart === 'undefined') {
        console.warn('⚠️ Chart.js غير محمّل، جاري التحميل...');
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
        script.onload = function() {
            console.log('✅ تم تحميل Chart.js');
            setTimeout(() => renderCharts(vessels), 100);
        };
        document.head.appendChild(script);
        return;
    }
    
    // ✅ حذف المخططات القديمة
    if (fleetChart) { fleetChart.destroy(); fleetChart = null; }
    if (categoriesChart) { categoriesChart.destroy(); categoriesChart = null; }
    if (comparisonChart) { comparisonChart.destroy(); comparisonChart = null; }
    
    const chartType = currentChartType === 'doughnut' ? 'doughnut' : 
                      (currentChartType === 'bar' ? 'bar' : 'line');
    
    // ✅ مخطط حالة الأسطول
    const fleetCtx = document.getElementById('fleetChartCanvas');
    if (fleetCtx) {
        fleetChart = new Chart(fleetCtx.getContext('2d'), {
            type: chartType,
            data: {
                labels: ['صالح', 'تحت الصيانة', 'معطب'],
                datasets: [{
                    data: [ok, maintenance, broken],
                    backgroundColor: [
                        'rgba(34, 197, 94, 0.8)',
                        'rgba(234, 179, 8, 0.8)',
                        'rgba(239, 68, 68, 0.8)'
                    ],
                    borderColor: ['#22c55e', '#eab308', '#ef4444'],
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: { family: 'Cairo', size: 12 },
                            padding: 15,
                            usePointStyle: true
                        }
                    }
                }
            }
        });
    }
    
    // ✅ مخطط توزيع المراكب حسب الفئة
    const categoriesCtx = document.getElementById('categoriesChartCanvas');
    if (categoriesCtx) {
        categoriesChart = new Chart(categoriesCtx.getContext('2d'), {
            type: 'bar',
            data: {
                labels: categories,
                datasets: [{
                    label: 'عدد المراكب',
                    data: categoryCounts,
                    backgroundColor: 'rgba(230, 179, 30, 0.8)',
                    borderColor: '#e6b31e',
                    borderWidth: 2,
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { 
                        beginAtZero: true, 
                        ticks: { stepSize: 1, font: { family: 'Cairo' } },
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    },
                    x: {
                        ticks: { font: { family: 'Cairo' } }
                    }
                }
            }
        });
    }
    
    // ✅ مخطط مقارنة الأقاليم
    const comparisonCtx = document.getElementById('comparisonChartCanvas');
    if (comparisonCtx) {
        const colors = [
            'rgba(34, 197, 94, 0.8)',
            'rgba(59, 130, 246, 0.8)',
            'rgba(234, 179, 8, 0.8)',
            'rgba(239, 68, 68, 0.8)'
        ];
        
        comparisonChart = new Chart(comparisonCtx.getContext('2d'), {
            type: 'bar',
            data: {
                labels: regionNames,
                datasets: [{
                    label: 'نسبة النجاعة (%)',
                    data: regionEfficiencies,
                    backgroundColor: colors,
                    borderColor: ['#22c55e', '#3b82f6', '#eab308', '#ef4444'],
                    borderWidth: 2,
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.parsed.y.toFixed(1) + '%';
                            }
                        }
                    }
                },
                scales: {
                    y: { 
                        beginAtZero: true, 
                        max: 100,
                        ticks: { 
                            callback: function(value) { return value + '%'; },
                            font: { family: 'Cairo' }
                        },
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    },
                    x: {
                        ticks: { font: { family: 'Cairo' } }
                    }
                }
            }
        });
    }
    
    console.log('✅ تم تحديث الرسوم البيانية');
}

// ============================================================
// 6. تحديث الصفحة
// ============================================================

async function renderEfficiency() {
    console.log('📊 تحديث صفحة الجاهزية...');
    
    try {
        const vessels = await loadVessels();
        
        // ✅ تطبيق الفلاتر
        const region = document.getElementById('fRegEff').value;
        const category = document.getElementById('fCatEff').value;
        const status = document.getElementById('fStatusEff').value;
        
        let filtered = vessels;
        if (region !== 'الكل') filtered = filtered.filter(v => v.reg === region);
        if (category !== 'الكل') filtered = filtered.filter(v => v.cat === category);
        if (status !== 'الكل') filtered = filtered.filter(v => v.stat === status);
        
        renderStats(filtered);
        renderTable(filtered);
        renderCharts(filtered);
        
        console.log('✅ تم تحديث صفحة الجاهزية');
    } catch (error) {
        console.error('❌ خطأ في تحديث الصفحة:', error);
        showToast('❌ خطأ في تحديث البيانات', 'error');
    }
}

// ============================================================
// 7. تغيير نوع المخطط
// ============================================================

function switchChartType(type, btn) {
    currentChartType = type;
    document.querySelectorAll('.chart-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    
    // ✅ إعادة رسم المخططات
    const vessels = window.allVessels || [];
    const region = document.getElementById('fRegEff').value;
    const category = document.getElementById('fCatEff').value;
    const status = document.getElementById('fStatusEff').value;
    
    let filtered = vessels;
    if (region !== 'الكل') filtered = filtered.filter(v => v.reg === region);
    if (category !== 'الكل') filtered = filtered.filter(v => v.cat === category);
    if (status !== 'الكل') filtered = filtered.filter(v => v.stat === status);
    
    renderCharts(filtered);
    showToast(`📊 تم التبديل إلى ${type === 'doughnut' ? 'دائري' : type === 'bar' ? 'شريطي' : 'خطي'}`, 'info');
}

// ============================================================
// 8. إعادة ضبط الفلاتر
// ============================================================

function resetEfficiencyFilters() {
    document.getElementById('fRegEff').value = 'الكل';
    document.getElementById('fCatEff').value = 'الكل';
    document.getElementById('fStatusEff').value = 'الكل';
    renderEfficiency();
    showToast('🔄 تم إعادة ضبط الفلاتر', 'info');
}

// ============================================================
// 9. تحديث الصفحة
// ============================================================

function refreshEfficiency() {
    renderEfficiency();
    showToast('🔄 تم تحديث البيانات', 'success');
}

// ============================================================
// 10. التهيئة
// ============================================================

function initEfficiencyPage() {
    console.log('📊 تهيئة صفحة الجاهزية...');
    if (window._effLoaded) {
        console.log('⚠️ تم تهيئة الصفحة مسبقاً');
        return;
    }
    window._effLoaded = true;
    setTimeout(renderEfficiency, 300);
}

// ============================================================
// 11. ربط الدوال
// ============================================================

if (document.getElementById('page-efficiency')) {
    console.log('📄 تم اكتشاف صفحة الجاهزية');
    setTimeout(initEfficiencyPage, 300);
}

window.renderEfficiency = renderEfficiency;
window.refreshEfficiency = refreshEfficiency;
window.switchChartType = switchChartType;
window.resetEfficiencyFilters = resetEfficiencyFilters;
window.loadVessels = loadVessels;

console.log('✅ صفحة الجاهزية v8.0 جاهزة');
</script>
</div>
