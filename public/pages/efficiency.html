<div id="page-efficiency">
    <style>
        /* ============================================================
           📊 EFFICIENCY PAGE - FIXED VERSION
           ============================================================ */

        /* ===== CSS VARIABLES ===== */
        :root {
            --primary-dark: #0a1628;
            --primary: #0f3460;
            --gold: #e6b31e;
            --gold-light: #f5d76e;
            --gold-dark: #c99a0e;
            --success: #00b894;
            --success-light: #55efc4;
            --danger: #e17055;
            --warning: #fdcb6e;
            --info: #0984e3;
            --glass-bg: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.06);
            --shadow-gold: 0 0 40px rgba(230,179,30,0.08);
            --shadow-card: 0 8px 32px rgba(0,0,0,0.15);
            --shadow-hover: 0 12px 48px rgba(0,0,0,0.25);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.4s cubic-bezier(0.4,0,0.2,1);
            --font: 'Cairo', 'Segoe UI', system-ui, sans-serif;
        }

        /* ===== FULL SCREEN RESET ===== */
        #page-efficiency {
            width: 100%;
            max-width: 100%;
            padding: 0;
            margin: 0;
            font-family: var(--font);
            background: #0a0e1a;
            color: #e8edf5;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ===== BACKGROUND EFFECT ===== */
        #page-efficiency::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(230,179,30,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(0,184,148,0.03) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
            animation: bgPulse 15s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(2deg); }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-light); }

        /* ============================================================
           HEADER
           ============================================================ */
        .eff-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 64px;
            z-index: 10;
            margin: 0;
            width: 100%;
        }

        .eff-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .eff-header-left .header-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--success));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #0a1628;
            box-shadow: var(--shadow-gold);
            animation: pulseGold 2s ease-in-out infinite;
        }

        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 20px rgba(230,179,30,0.1); }
            50% { box-shadow: 0 0 40px rgba(230,179,30,0.2); }
        }

        .eff-header-left h2 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold-light), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .eff-header-left p {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin: 0;
        }

        .eff-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .eff-header-actions .btn-action {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
        }

        .eff-header-actions .btn-action.primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0a1628;
            box-shadow: var(--shadow-gold);
        }

        .eff-header-actions .btn-action.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,179,30,0.3);
        }

        .eff-header-actions .btn-action.secondary {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: rgba(255,255,255,0.5);
        }

        .eff-header-actions .btn-action.secondary:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
            transform: translateY(-2px);
        }

        /* ============================================================
           STATS CARDS
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            padding: 16px 24px;
            margin: 0;
            width: 100%;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 16px 18px;
            text-align: center;
            transition: all var(--transition);
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--success));
            opacity: 0.6;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(230,179,30,0.15);
            box-shadow: var(--shadow-hover);
        }

        .stat-card .number {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        .stat-card .number.gold { color: var(--gold-light); }
        .stat-card .number.green { color: var(--success-light); }
        .stat-card .number.yellow { color: var(--warning); }
        .stat-card .number.red { color: var(--danger); }

        .stat-card .label {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .stat-card .icon-bg {
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 50px;
            opacity: 0.04;
            pointer-events: none;
        }

        /* ============================================================
           FILTER BAR
           ============================================================ */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            padding: 10px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
            margin: 0;
            width: 100%;
        }

        .filter-bar label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-bar select {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.75rem;
            min-width: 120px;
            cursor: pointer;
            font-family: var(--font);
        }

        .filter-bar select:focus {
            outline: none;
            border-color: var(--gold);
        }

        .filter-bar select option {
            background: #0a1628;
            color: #e2e8f0;
        }

        .filter-bar .btn-filter {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-bar .btn-filter.primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0a1628;
        }

        .filter-bar .btn-filter.primary:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 20px rgba(230,179,30,0.2);
        }

        .filter-bar .btn-filter.outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: rgba(255,255,255,0.3);
        }

        .filter-bar .btn-filter.outline:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        /* ============================================================
           GENERAL EFFICIENCY TABLE
           ============================================================ */
        .eff-section {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            margin: 0 24px 16px;
            overflow: hidden;
        }

        .eff-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.02);
            flex-wrap: wrap;
            gap: 8px;
        }

        .eff-section .section-header h3 {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .eff-section .section-header h3 i {
            color: var(--gold);
        }

        .eff-section .section-header .badge {
            font-size: 11px;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge.success {
            background: rgba(34,197,94,0.12);
            color: #4ade80;
        }

        .badge.warning {
            background: rgba(234,179,8,0.12);
            color: #fbbf24;
        }

        .badge.danger {
            background: rgba(239,68,68,0.12);
            color: #f87171;
        }

        .badge.gold {
            background: rgba(230,179,30,0.12);
            color: var(--gold-light);
        }

        .section-content {
            padding: 16px 20px;
        }

        /* ===== TABLES ===== */
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius-sm);
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            min-width: 600px;
        }

        thead {
            background: rgba(15,52,96,0.3);
            border-bottom: 2px solid rgba(230,179,30,0.08);
        }

        thead th {
            padding: 10px 12px;
            text-align: center;
            font-weight: 700;
            font-size: 0.6rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        thead th i {
            margin-left: 4px;
            color: var(--gold);
            font-size: 0.7rem;
        }

        tbody td {
            padding: 9px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            vertical-align: middle;
            color: rgba(255,255,255,0.6);
            font-size: 0.78rem;
            text-align: center;
        }

        tbody tr {
            transition: all var(--transition);
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }

        /* ===== ROW CLASSES ===== */
        .row-high {
            background: rgba(34, 197, 94, 0.05) !important;
            border-right: 3px solid #4ade80;
        }

        .row-high .eff-cell {
            color: #4ade80 !important;
            font-weight: 700;
        }

        .row-mid {
            background: rgba(234, 179, 8, 0.05) !important;
            border-right: 3px solid #fbbf24;
        }

        .row-mid .eff-cell {
            color: #fbbf24 !important;
            font-weight: 700;
        }

        .row-low {
            background: rgba(239, 68, 68, 0.05) !important;
            border-right: 3px solid #f87171;
        }

        .row-low .eff-cell {
            color: #f87171 !important;
            font-weight: 700;
        }

        /* ===== STATUS BADGES ===== */
        .status-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }

        .status-badge.excellent {
            background: rgba(34,197,94,0.12);
            color: #4ade80;
        }

        .status-badge.good {
            background: rgba(74,222,128,0.08);
            color: #4ade80;
        }

        .status-badge.medium {
            background: rgba(234,179,8,0.12);
            color: #fbbf24;
        }

        .status-badge.low {
            background: rgba(239,68,68,0.12);
            color: #f87171;
        }

        .status-badge.critical {
            background: rgba(239,68,68,0.2);
            color: #f87171;
            animation: pulseDanger 1.5s ease-in-out infinite;
        }

        @keyframes pulseDanger {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
            min-width: 80px;
        }

        .progress-bar .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .progress-bar .progress-fill.high {
            background: linear-gradient(90deg, #22c55e, #4ade80);
        }

        .progress-bar .progress-fill.mid {
            background: linear-gradient(90deg, #eab308, #fbbf24);
        }

        .progress-bar .progress-fill.low {
            background: linear-gradient(90deg, #ef4444, #f87171);
        }

        /* ============================================================
           REGION TABLES
           ============================================================ */
        .region-card {
            padding: 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .region-card:last-child {
            border-bottom: none;
        }

        .region-card .region-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(255,255,255,0.02);
            flex-wrap: wrap;
            gap: 8px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .region-card .region-header:hover {
            background: rgba(255,255,255,0.04);
        }

        .region-card .region-header .region-name {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .region-card .region-header .region-name i {
            color: var(--gold);
        }

        .region-card .region-header .region-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 20px;
        }

        .region-badge.excellent {
            background: rgba(34,197,94,0.15);
            color: #4ade80;
            border: 1px solid rgba(34,197,94,0.1);
        }

        .region-badge.good {
            background: rgba(74,222,128,0.1);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.05);
        }

        .region-badge.medium {
            background: rgba(234,179,8,0.15);
            color: #fbbf24;
            border: 1px solid rgba(234,179,8,0.1);
        }

        .region-badge.low {
            background: rgba(239,68,68,0.15);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.1);
        }

        .region-badge.critical {
            background: rgba(239,68,68,0.25);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.2);
            animation: pulseDanger 1.5s ease-in-out infinite;
        }

        .region-card .region-body {
            padding: 0 20px 16px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 992px) {
            .eff-header { padding: 12px 16px; top: 60px; }
            .eff-header-left h2 { font-size: 18px; }
            .stats-grid { padding: 12px 16px; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
            .filter-bar { padding: 8px 16px; gap: 6px 10px; }
            .eff-section { margin: 0 16px 12px; }
            .region-card .region-body { padding: 0 12px 12px; }
        }

        @media (max-width: 768px) {
            .eff-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 12px 16px;
                top: 56px;
            }
            .eff-header-left { width: 100%; }
            .eff-header-left h2 { font-size: 16px; }
            .eff-header-actions { width: 100%; justify-content: flex-start; }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 10px 16px;
            }
            .stat-card { padding: 12px 14px; }
            .stat-card .number { font-size: 20px; }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 10px 16px;
                gap: 6px;
            }
            .filter-bar label { font-size: 0.65rem; }
            .filter-bar select { min-width: 100%; }
            .eff-section { margin: 0 12px 10px; }
            .section-header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .section-content { padding: 12px 14px; }
            .table-wrapper table { font-size: 0.7rem; min-width: 500px; }
            thead th, tbody td { padding: 6px 8px; }
            .eff-header-actions .btn-action { padding: 6px 12px; font-size: 0.7rem; }
            .region-card .region-header { padding: 10px 14px; flex-direction: column; align-items: flex-start; }
            .region-card .region-body { padding: 0 10px 10px; }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .stat-card { padding: 10px 12px; }
            .stat-card .number { font-size: 18px; }
            .stat-card .label { font-size: 9px; }
            .eff-header-left .header-icon { width: 36px; height: 36px; font-size: 16px; }
            .eff-header-left h2 { font-size: 14px; }
            .eff-header-left p { font-size: 10px; }
            .section-header h3 { font-size: 13px; }
            .section-content { padding: 10px 12px; }
            thead th, tbody td { padding: 4px 6px; font-size: 0.65rem; }
        }
    </style>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <div class="eff-header">
        <div class="eff-header-left">
            <div class="header-icon">
                <i class="fas fa-chart-line"></i>
            </div>

    <!-- ============================================================

    <!-- ============================================================
    FILTER BAR
    ============================================================ -->

        <label><i class="fas fa-map-marker-alt"></i> الإقليم</label>
        <select id="fRegEff">

        </select>

        <label><i class="fas fa-filter"></i> الفئة</label>
        <select id="fCatEff">
            <option value="الكل">📦 جميع الفئات</option>
            <option value="البروق">البروق</option>
            <option value="صقور">صقور</option>
            <option value="خوافر">خوافر</option>
            <option value="زوارق مزدوجة">زوارق مزدوجة</option>
            <option value="طوافات">طوافات</option>
        </select>

        <label><i class="fas fa-chart-bar"></i> الحالة</label>
        <select id="fStatusEff">
            <option value="الكل">📊 جميع الحالات</option>
            <option value="صالح">✅ صالح</option>
            <option value="صيانة">🔧 تحت الصيانة</option>
            <option value="معطب">⚠️ معطب</option>
        </select>

        <button class="btn-filter primary" id="filterBtn">
            <i class="fas fa-filter"></i> فلترة
        </button>
        <button class="btn-filter outline" id="resetBtn">
            <i class="fas fa-undo-alt"></i> إلغاء
        </button>
    </div>

    <!-- ============================================================
    GENERAL EFFICIENCY TABLE
    ============================================================ -->
    <div class="eff-section">
        <div class="section-header">
            <h3><i class="fas fa-chart-line"></i> النجاعة العامة للأسطول</h3>
            <span class="badge gold" id="generalBadge">📊 جاري التحميل...</span>
        </div>
        <div class="section-content">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="text-align:right;"><i class="fas fa-tag"></i> الفئة</th>
                            <th><i class="fas fa-check-circle"></i> صالح</th>
                            <th><i class="fas fa-times-circle"></i> معطب</th>
                            <th><i class="fas fa-percent"></i> النجاعة</th>
                            <th><i class="fas fa-chart-bar"></i> التقدم</th>
                            <th><i class="fas fa-circle"></i> الحالة</th>
                        </tr>
                    </thead>
                    <tbody id="generalBody">
                        <tr>
                            <td colspan="6" class="empty-state" style="text-align:center;padding:40px 20px;color:rgba(255,255,255,0.15);">
                                <div class="spinner" style="width:32px;height:32px;border:3px solid rgba(255,255,255,0.04);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;"></div>
                                <h3 style="font-size:0.9rem;font-weight:600;color:rgba(255,255,255,0.2);margin-bottom:4px;">جاري تحميل البيانات...</h3>
                                <p style="font-size:0.75rem;color:rgba(255,255,255,0.1);">يرجى الانتظار</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ============================================================
    REGIONS TABLES
    ============================================================ -->
    <div class="eff-section">
        <div class="section-header">
            <h3><i class="fas fa-map-marked-alt"></i> تفاصيل الأقاليم ووحدات الصيانة</h3>
            <span class="badge gold">📊 تحليل متقدم</span>
        </div>
        <div id="regionTables">
            <!-- سيتم إنشاء الجداول عبر JavaScript -->
        </div>
    </div>

    <!-- ============================================================
    JAVASCRIPT - FIXED VERSION
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // DATA
            // ============================================================
            var efficiencyData = {
                general: [
                    { category: 'البروق', active: 18, damaged: 4, efficiency: 81.8 },
                    { category: 'صقور', active: 12, damaged: 3, efficiency: 80.0 },
                    { category: 'خوافر', active: 8, damaged: 5, efficiency: 61.5 },
                    { category: 'زوارق مزدوجة', active: 6, damaged: 1, efficiency: 85.7 },
                    { category: 'طوافات', active: 4, damaged: 2, efficiency: 66.7 }
                ],
                regions: {
                    'الشمال': { vessels: 12, active: 8, maintenance: 3, damaged: 1 },
                    'الساحل': { vessels: 15, active: 10, maintenance: 4, damaged: 1 },
                    'الوسط': { vessels: 10, active: 5, maintenance: 3, damaged: 2 },
                    'الجنوب': { vessels: 8, active: 3, maintenance: 2, damaged: 3 },
                    'وحدة الصيانة والإسناد البحري تونس': { vessels: 6, active: 5, maintenance: 1, damaged: 0 },
                    'وحدة الصيانة والإسناد البحري المنستير': { vessels: 8, active: 7, maintenance: 1, damaged: 0 },
                    'وحدة الصيانة والإسناد البحري صفاقس': { vessels: 5, active: 3, maintenance: 1, damaged: 1 },
                    'وحدة الصيانة والإسناد البحري جرجيس': { vessels: 7, active: 6, maintenance: 1, damaged: 0 },
                    'المجمع الأمني بقبيبة': { vessels: 4, active: 4, maintenance: 0, damaged: 0 }
                }
            };

            // ============================================================
            // DOM REFS
            // ============================================================
            var $ = function(id) { return document.getElementById(id); };

            var totalVessels = $('totalVessels');
            var activeVessels = $('activeVessels');
            var maintenanceVessels = $('maintenanceVessels');
            var damagedVessels = $('damagedVessels');
            var efficiencyPercent = $('efficiencyPercent');
            var generalBody = $('generalBody');
            var generalBadge = $('generalBadge');
            var regionTables = $('regionTables');
            var fRegEff = $('fRegEff');
            var fCatEff = $('fCatEff');
            var fStatusEff = $('fStatusEff');

            // ============================================================
            // HELPER FUNCTIONS
            // ============================================================
            function getStatusClass(efficiency) {
                if (efficiency >= 80) return 'excellent';
                if (efficiency >= 70) return 'good';
                if (efficiency >= 50) return 'medium';
                if (efficiency >= 30) return 'low';
                return 'critical';
            }

            function getStatusText(efficiency) {
                if (efficiency >= 80) return 'ممتازة';
                if (efficiency >= 70) return 'جيدة';
                if (efficiency >= 50) return 'متوسطة';
                if (efficiency >= 30) return 'منخفضة';
                return 'حرجة';
            }

            function getRowClass(efficiency) {
                if (efficiency >= 70) return 'row-high';
                if (efficiency >= 50) return 'row-mid';
                return 'row-low';
            }

            function getProgressClass(efficiency) {
                if (efficiency >= 70) return 'high';
                if (efficiency >= 50) return 'mid';
                return 'low';
            }

            function getRegionBadgeClass(efficiency) {
                if (efficiency >= 80) return 'excellent';
                if (efficiency >= 70) return 'good';
                if (efficiency >= 50) return 'medium';
                if (efficiency >= 30) return 'low';
                return 'critical';
            }

            function formatDate(dateStr) {
                if (!dateStr) return '-';
                var parts = dateStr.split('-');
                return parts[2] + '/' + parts[1] + '/' + parts[0];
            }

            // ============================================================
            // RENDER FUNCTIONS
            // ============================================================
            function renderStats() {
                var regionFilter = fRegEff.value;
                var total = 0, active = 0, maintenance = 0, damaged = 0;

                Object.keys(efficiencyData.regions).forEach(function(name) {
                    var data = efficiencyData.regions[name];
                    if (regionFilter === 'الكل' || name === regionFilter) {
                        total += data.vessels;
                        active += data.active;
                        maintenance += data.maintenance;
                        damaged += data.damaged;
                    }
                });

                var efficiency = total > 0 ? ((active / total) * 100).toFixed(1) : 0;

                totalVessels.textContent = total;
                activeVessels.textContent = active;
                maintenanceVessels.textContent = maintenance;
                damagedVessels.textContent = damaged;
                efficiencyPercent.textContent = efficiency + '%';
            }

            function renderGeneralTable() {
                var categoryFilter = fCatEff.value;
                var statusFilter = fStatusEff.value;

                var filtered = efficiencyData.general;

                if (categoryFilter !== 'الكل') {
                    filtered = filtered.filter(function(item) {
                        return item.category === categoryFilter;
                    });
                }

                if (statusFilter !== 'الكل') {
                    filtered = filtered.filter(function(item) {
                        if (statusFilter === 'صالح') return item.efficiency >= 70;
                        if (statusFilter === 'صيانة') return item.efficiency >= 50 && item.efficiency < 70;
                        if (statusFilter === 'معطب') return item.efficiency < 50;
                        return true;
                    });
                }

                if (filtered.length === 0) {
                    generalBody.innerHTML = `
                        <tr>
                            <td colspan="6" style="text-align:center;padding:40px 20px;color:rgba(255,255,255,0.15);">
                                <span style="font-size:3rem;color:rgba(255,255,255,0.04);display:block;margin-bottom:12px;">
                                    <i class="fas fa-search"></i>
                                </span>
                                <h3 style="font-size:0.9rem;font-weight:600;color:rgba(255,255,255,0.2);margin-bottom:4px;">لا توجد بيانات</h3>
                                <p style="font-size:0.75rem;color:rgba(255,255,255,0.1);">حاول تغيير معايير الفلترة</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                var html = '';
                filtered.forEach(function(item) {
                    var eff = item.efficiency;
                    var rowClass = getRowClass(eff);
                    var statusClass = getStatusClass(eff);
                    var statusText = getStatusText(eff);
                    var progressClass = getProgressClass(eff);

                    html += `
                        <tr class="${rowClass}">
                            <td style="text-align:right;font-weight:600;color:#fff;">${item.category}</td>
                            <td>${item.active}</td>
                            <td>${item.damaged}</td>
                            <td class="eff-cell">${eff.toFixed(1)}%</td>
                            <td>
                                <div class="progress-bar">
                                    <div class="progress-fill ${progressClass}" style="width:${Math.min(eff, 100)}%;"></div>
                                </div>
                            </td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        </tr>
                    `;
                });

                generalBody.innerHTML = html;

                // Update badge
                var avgEfficiency = filtered.reduce(function(sum, item) { return sum + item.efficiency; }, 0) / filtered.length;

                if (avgEfficiency >= 80) {
                    generalBadge.textContent = '✅ أداء ممتاز';
                    generalBadge.className = 'badge success';
                } else if (avgEfficiency >= 70) {
                    generalBadge.textContent = '📈 أداء جيد';
                    generalBadge.className = 'badge gold';
                } else if (avgEfficiency >= 50) {
                    generalBadge.textContent = '⚠️ أداء متوسط';
                    generalBadge.className = 'badge warning';
                } else {
                    generalBadge.textContent = '🚨 أداء منخفض';
                    generalBadge.className = 'badge danger';
                }
            }

            function renderRegionTables() {
                var regionFilter = fRegEff.value;
                var html = '';

                var filteredRegions = Object.keys(efficiencyData.regions);

                if (regionFilter !== 'الكل') {
                    filteredRegions = filteredRegions.filter(function(name) {
                        return name === regionFilter;
                    });
                }

                if (filteredRegions.length === 0) {
                    regionTables.innerHTML = `
                        <div class="section-content">
                            <div style="text-align:center;padding:40px 20px;color:rgba(255,255,255,0.15);">
                                <span style="font-size:3rem;color:rgba(255,255,255,0.04);display:block;margin-bottom:12px;">
                                    <i class="fas fa-map-marked-alt"></i>
                                </span>
                                <h3 style="font-size:0.9rem;font-weight:600;color:rgba(255,255,255,0.2);margin-bottom:4px;">لا توجد أقاليم</h3>
                                <p style="font-size:0.75rem;color:rgba(255,255,255,0.1);">حاول تغيير فلترة الإقليم</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                filteredRegions.forEach(function(name) {
                    var data = efficiencyData.regions[name];
                    var efficiency = data.vessels > 0 ? ((data.active / data.vessels) * 100).toFixed(1) : 0;
                    var badgeClass = getRegionBadgeClass(efficiency);

                    // Generate vessel rows (mock data for each region)
                    var vesselRows = '';
                    var vessels = [
                        { name: 'البروق 01', category: 'البروق', status: 'صالح', date: '2026-05-12' },
                        { name: 'البروق 02', category: 'البروق', status: data.maintenance > 0 ? 'صيانة' : 'صالح', date: '2026-06-20' },
                        { name: 'صقر 03', category: 'صقور', status: 'صالح', date: '2026-04-05' },
                        { name: 'خافرة 07', category: 'خوافر', status: data.damaged > 0 ? 'معطب' : 'صالح', date: '2026-03-25' }
                    ];

                    // Add extra vessels based on data
                    if (data.vessels > 4) {
                        vessels.push({ name: 'البروق 05', category: 'البروق', status: 'صالح', date: '2026-06-03' });
                    }
                    if (data.vessels > 6) {
                        vessels.push({ name: 'صقر 08', category: 'صقور', status: data.maintenance > 1 ? 'صيانة' : 'صالح', date: '2026-05-28' });
                    }
                    if (data.vessels > 8) {
                        vessels.push({ name: 'زورق مزدوج 12', category: 'زوارق مزدوجة', status: 'صالح', date: '2026-06-02' });
                    }

                    var statusMap = {
                        'صالح': 'excellent',
                        'صيانة': 'medium',
                        'معطب': 'low'
                    };

                    var statusLabel = {
                        'صالح': '✅ صالح',
                        'صيانة': '🔧 صيانة',
                        'معطب': '⚠️ معطب'
                    };

                    vesselRows = vessels.slice(0, data.vessels).map(function(v) {
                        var cls = statusMap[v.status] || 'excellent';
                        var label = statusLabel[v.status] || v.status;
                        return `
                            <tr>
                                <td style="text-align:right;font-weight:600;color:#fff;">${v.name}</td>
                                <td>${v.category}</td>
                                <td><span class="status-badge ${cls}">${label}</span></td>
                                <td>${formatDate(v.date)}</td>
                            </tr>
                        `;
                    }).join('');

                    html += `
                        <div class="region-card">
                            <div class="region-header">
                                <div class="region-name">
                                    <i class="fas fa-map-pin"></i> ${name}
                                </div>
                                <span class="region-badge ${badgeClass}">${efficiency}% جاهزية</span>
                            </div>
                            <div class="region-body">
                                <div class="table-wrapper">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th style="text-align:right;">المركب</th>
                                                <th>الفئة</th>
                                                <th>الحالة</th>
                                                <th>آخر صيانة</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${vesselRows || `
                                                <tr>
                                                    <td colspan="4" style="text-align:center;padding:20px;color:rgba(255,255,255,0.1);">
                                                        لا توجد مراكب مسجلة
                                                    </td>
                                                </tr>
                                            `}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                });

                regionTables.innerHTML = html;
            }

            function renderEfficiency() {
                renderStats();
                renderGeneralTable();
                renderRegionTables();
            }

            // ============================================================
            // ACTION FUNCTIONS
            // ============================================================
            function refreshEfficiency() {
                var btn = document.querySelector('.eff-header-actions .btn-action.primary');
                var originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';
                btn.disabled = true;

                setTimeout(function() {
                    renderEfficiency();
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                    showNotification('تم تحديث البيانات بنجاح ✅', 'success');
                }, 800);
            }

            function resetEfficiencyFilters() {
                fRegEff.value = 'الكل';
                fCatEff.value = 'الكل';
                fStatusEff.value = 'الكل';
                renderEfficiency();
                showNotification('تم إلغاء جميع الفلاتر ✅', 'success');
            }

            // ============================================================
            // NOTIFICATION SYSTEM
            // ============================================================
            function showNotification(message, type) {
                var old = document.querySelector('.eff-notification');
                if (old) old.remove();

                var colors = {
                    success: 'rgba(34,197,94,0.15)',
                    info: 'rgba(9,132,227,0.15)',
                    error: 'rgba(239,68,68,0.15)'
                };

                var borders = {
                    success: 'rgba(34,197,94,0.2)',
                    info: 'rgba(9,132,227,0.2)',
                    error: 'rgba(239,68,68,0.2)'
                };

                var notif = document.createElement('div');
                notif.className = 'eff-notification';
                notif.style.cssText = `
                    position: fixed;
                    bottom: 24px;
                    right: 24px;
                    background: ${colors[type] || colors.info};
                    backdrop-filter: blur(12px);
                    border: 1px solid ${borders[type] || borders.info};
                    padding: 14px 24px;
                    border-radius: 12px;
                    color: #fff;
                    font-family: Cairo, sans-serif;
                    font-size: 14px;
                    z-index: 9999;
                    animation: slideUp 0.4s ease-out;
                    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
                    max-width: 400px;
                `;
                notif.textContent = message;

                document.body.appendChild(notif);

                setTimeout(function() {
                    notif.style.opacity = '0';
                    notif.style.transform = 'translateY(20px)';
                    notif.style.transition = 'all 0.4s ease-out';
                    setTimeout(function() { notif.remove(); }, 400);
                }, 3500);
            }

            // ============================================================
            // ADDITIONAL STYLES
            // ============================================================
            var styleNotif = document.createElement('style');
            styleNotif.textContent = `
                @keyframes slideUp {
                    from { opacity: 0; transform: translateY(20px); }
                    to { opacity: 1; transform: translateY(0); }
                }
                @keyframes spin {
                    to { transform: rotate(360deg); }
                }
                .empty-state .spinner {
                    width: 32px;
                    height: 32px;
                    border: 3px solid rgba(255,255,255,0.04);
                    border-top-color: var(--gold);
                    border-radius: 50%;
                    animation: spin 0.8s linear infinite;
                    margin: 0 auto 12px;
                }
            `;
            document.head.appendChild(styleNotif);

            // ============================================================
            // EVENT BINDING
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                // Bind buttons
                document.getElementById('refreshBtn').addEventListener('click', refreshEfficiency);
                document.getElementById('filterBtn').addEventListener('click', renderEfficiency);
                document.getElementById('resetBtn').addEventListener('click', resetEfficiencyFilters);

                // Bind selects
                fRegEff.addEventListener('change', renderEfficiency);
                fCatEff.addEventListener('change', renderEfficiency);
                fStatusEff.addEventListener('change', renderEfficiency);

                // Initial render
                renderEfficiency();

                console.log('📊 Efficiency Page loaded successfully!');
            });

            // Expose functions globally for debugging
            window.renderEfficiency = renderEfficiency;
            window.refreshEfficiency = refreshEfficiency;
            window.resetEfficiencyFilters = resetEfficiencyFilters;

        })();
    </script>
</div>
