<div id="page-efficiency">
    <!-- Header -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; flex-wrap:wrap; gap:8px; border-bottom:1px solid #f0f0f0;">
        <div>
            <h2 style="margin:0; color:#1a1a2e; font-size:20px;">📊 الجاهزية</h2>
            <p style="margin:0; color:#6c757d; font-size:12px;">تحليل الأسطول البحري</p>
        </div>
        <span style="background:linear-gradient(135deg, #667eea, #764ba2); color:white; padding:5px 16px; border-radius:20px; font-weight:bold; font-size:13px;">
            📊 <span id="effCount">0</span>
        </span>
    </div>
    
    <!-- إحصائيات سريعة -->
    <div id="efficiencyStats"></div>
    
    <!-- رسوم بيانية مصغرة -->
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:15px; margin:15px 0;">
        <div style="background:white; border-radius:12px; padding:12px; box-shadow:0 2px 12px rgba(0,0,0,0.06);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span style="font-size:12px; font-weight:600; color:#1a1a2e;">📊 الفئات</span>
                <span style="font-size:10px; color:#6c757d;">حسب الحالة</span>
            </div>
            <canvas id="chartCategory" style="height:160px; width:100%;"></canvas>
        </div>
        
        <div style="background:white; border-radius:12px; padding:12px; box-shadow:0 2px 12px rgba(0,0,0,0.06);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span style="font-size:12px; font-weight:600; color:#1a1a2e;">🎯 التوزيع</span>
                <span style="font-size:10px; color:#6c757d;">نسبة مئوية</span>
            </div>
            <canvas id="chartDoughnut" style="height:160px; width:100%;"></canvas>
        </div>
    </div>
    
    <!-- الجداول -->
    <div id="efficiencyTablesContainer"></div>
    
    <!-- أزرار -->
    <div style="display:flex; gap:8px; margin:12px 0; flex-wrap:wrap;">
        <button onclick="exportEfficiencyData()" style="padding:6px 16px; background:linear-gradient(135deg, #667eea, #764ba2); color:white; border:none; border-radius:8px; cursor:pointer; font-size:12px;">📥 CSV</button>
        <button onclick="window.print()" style="padding:6px 16px; background:linear-gradient(135deg, #11998e, #38ef7d); color:white; border:none; border-radius:8px; cursor:pointer; font-size:12px;">🖨️ طباعة</button>
        <button onclick="refreshAllPages()" style="padding:6px 16px; background:#6c757d; color:white; border:none; border-radius:8px; cursor:pointer; font-size:12px;">🔄 تحديث</button>
    </div>
</div>

        width: 100%;
