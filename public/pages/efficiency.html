<div id="page-efficiency">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; flex-wrap:wrap; gap:10px;">
        <div>
            <h2 style="margin:0; color:#0d6efd; font-size:24px;">📊 الجاهزية</h2>
            <p style="margin:0; color:#6c757d; font-size:13px;">تحليل الأسطول البحري</p>
        </div>
        <span id="effCount" style="background:#0d6efd; color:white; padding:6px 18px; border-radius:20px; font-weight:bold; font-size:14px;">
            📊 0 مركب
        </span>
    </div>
    
    <!-- الإحصائيات -->
    <div id="efficiencyStats"></div>
    
    <!-- ===== الرسوم البيانية ===== -->
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(350px, 1fr)); gap:20px; margin:20px 0;">
        
        <!-- رسم بياني 1: الفئات -->
        <div style="background:white; border-radius:12px; padding:15px; box-shadow:0 2px 12px rgba(0,0,0,0.08);">
            <h4 style="text-align:center; color:#0d6efd; margin:0 0 10px 0; font-size:15px;">📊 الجاهزية حسب الفئة</h4>
            <canvas id="chartCategory" style="height:250px; width:100%;"></canvas>
        </div>
        
        <!-- رسم بياني 2: التوزيع -->
        <div style="background:white; border-radius:12px; padding:15px; box-shadow:0 2px 12px rgba(0,0,0,0.08);">
            <h4 style="text-align:center; color:#0d6efd; margin:0 0 10px 0; font-size:15px;">🎯 توزيع الحالات</h4>
            <canvas id="chartDoughnut" style="height:250px; width:100%;"></canvas>
        </div>
    </div>
    
    <!-- الجداول -->
    <div id="efficiencyTablesContainer"></div>
    
    <!-- أزرار -->
    <div style="display:flex; gap:10px; margin:15px 0; flex-wrap:wrap;">
        <button onclick="exportEfficiencyData()" style="padding:8px 20px; background:#0d6efd; color:white; border:none; border-radius:6px; cursor:pointer; font-size:13px;">
            📥 تصدير CSV
        </button>
        <button onclick="window.print()" style="padding:8px 20px; background:#198754; color:white; border:none; border-radius:6px; cursor:pointer; font-size:13px;">
            🖨️ طباعة
        </button>
        <button onclick="refreshAllPages()" style="padding:8px 20px; background:#6c757d; color:white; border:none; border-radius:6px; cursor:pointer; font-size:13px;">
            🔄 تحديث
        </button>
    </div>
</div>

<style>
    #efficiencyTablesContainer table {
        width: 100%;
        border-collapse: collapse;
        font-family: 'Cairo', sans-serif;
        font-size: 13px;
    }
    #efficiencyTablesContainer table th {
        background: #f8f9fa;
        padding: 10px;
        border-bottom: 2px solid #dee2e6;
        font-weight: 700;
        text-align: center;
    }
    #efficiencyTablesContainer table td {
        padding: 8px;
        border-bottom: 1px solid #dee2e6;
        text-align: center;
    }
    #efficiencyTablesContainer table tr:hover {
        background: #f8f9fa;
    }
    .scrollable-table {
        overflow-x: auto;
    }
    .stat-box {
        transition: transform 0.2s;
    }
    .stat-box:hover {
        transform: translateY(-3px);
    }
</style>
