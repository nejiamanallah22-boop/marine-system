<!-- public/pages/efficiency.html -->
<div id="page-efficiency">
    <style>
        /* ===== RESET & BASE ===== */
        #page-efficiency {
            width: 100%;
            max-width: 100%;
            padding: 20px;
            margin: 0;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            background: #0a0e1a;
            color: #e8edf5;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        .eff-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .eff-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .eff-header-left .icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e6b31e, #00b894);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #0a1628;
        }

        .eff-header-left h2 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #f5d76e, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .eff-header-left p {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin: 0;
        }

        .eff-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cairo', sans-serif;
        }

        .btn-action.primary {
            background: linear-gradient(135deg, #e6b31e, #f5d76e);
            color: #0a1628;
        }

        .btn-action.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,179,30,0.3);
        }

        .btn-action.secondary {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
        }

        .btn-action.secondary:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
        }

        /* ===== STATS ===== */
        .eff-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #e6b31e, #00b894);
            opacity: 0.6;
        }

        .stat-card .number {
            font-size: 26px;
            font-weight: 800;
            color: #f5d76e;
            line-height: 1.2;
        }

        .stat-card .number.green { color: #4ade80; }
        .stat-card .number.yellow { color: #fbbf24; }
        .stat-card .number.red { color: #f87171; }
        .stat-card .number.blue { color: #60a5fa; }

        .stat-card .label {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .filter-bar label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-bar select {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.75rem;
            min-width: 120px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
        }

        .filter-bar select:focus {
            outline: none;
            border-color: #e6b31e;
        }

        .filter-bar select option {
            background: #0a1628;
            color: #e2e8f0;
        }

        .btn-filter {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-filter.primary {
            background: linear-gradient(135deg, #e6b31e, #f5d76e);
            color: #0a1628;
        }

        .btn-filter.primary:hover {
            transform: scale(1.04);
        }

        .btn-filter.outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.3);
        }

        .btn-filter.outline:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        /* ===== SECTION ===== */
        .eff-section {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.02);
            flex-wrap: wrap;
            gap: 8px;
        }

        .section-header h3 {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-header h3 i {
            color: #e6b31e;
        }

        .badge {
            font-size: 11px;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge.gold {
            background: rgba(230,179,30,0.12);
            color: #f5d76e;
        }

        .badge.success {
            background: rgba(34,197,94,0.12);
            color: #4ade80;
        }

        .badge.warning {
            background: rgba(234,179,8,0.12);
            color: #fbbf24;
        }

        .badge.danger {
            background: rgba(239,68,68,0.12);
            color: #f87171;
        }

        /* ===== TABLE ===== */
        .table-wrapper {
            overflow-x: auto;
            padding: 16px 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            min-width: 600px;
        }

        thead {
            background: rgba(230,179,30,0.08);
            border-bottom: 2px solid rgba(230,179,30,0.08);
        }

        thead th {
            padding: 10px 12px;
            text-align: center;
            font-weight: 700;
            font-size: 0.6rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        thead th i {
            margin-left: 4px;
            color: #e6b31e;
        }

        tbody td {
            padding: 9px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            vertical-align: middle;
            color: rgba(255,255,255,0.6);
            font-size: 0.78rem;
            text-align: center;
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }

        .row-high {
            background: rgba(34,197,94,0.05) !important;
            border-right: 3px solid #4ade80;
        }

        .row-high .eff-cell {
            color: #4ade80 !important;
            font-weight: 700;
        }

        .row-mid {
            background: rgba(234,179,8,0.05) !important;
            border-right: 3px solid #fbbf24;
        }

        .row-mid .eff-cell {
            color: #fbbf24 !important;
            font-weight: 700;
        }

        .row-low {
            background: rgba(239,68,68,0.05) !important;
            border-right: 3px solid #f87171;
        }

        .row-low .eff-cell {
            color: #f87171 !important;
            font-weight: 700;
        }

        /* ===== STATUS BADGES ===== */
        .status-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }

        .status-badge.excellent {
            background: rgba(34,197,94,0.12);
            color: #4ade80;
        }

        .status-badge.good {
            background: rgba(74,222,128,0.08);
            color: #4ade80;
        }

        .status-badge.medium {
            background: rgba(234,179,8,0.12);
            color: #fbbf24;
        }

        .status-badge.low {
            background: rgba(239,68,68,0.12);
            color: #f87171;
        }

        .status-badge.critical {
            background: rgba(239,68,68,0.2);
            color: #f87171;
            animation: pulseDanger 1.5s infinite;
        }

        @keyframes pulseDanger {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
            min-width: 80px;
        }

        .progress-bar .fill {
            height: 100%;
            border-radius: 10px;
            width: 0%;
            transition: width 0.8s ease;
        }

        .progress-bar .fill.high {
            background: linear-gradient(90deg, #22c55e, #4ade80);
        }

        .progress-bar .fill.mid {
            background: linear-gradient(90deg, #eab308, #fbbf24);
        }

        .progress-bar .fill.low {
            background: linear-gradient(90deg, #ef4444, #f87171);
        }

        /* ===== REGIONS ===== */
        .region-card {
            padding: 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .region-card:last-child {
            border-bottom: none;
        }

        .region-card .region-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(255,255,255,0.02);
            flex-wrap: wrap;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .region-card .region-header:hover {
            background: rgba(255,255,255,0.04);
        }

        .region-card .region-header .region-name {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .region-card .region-header .region-name i {
            color: #e6b31e;
        }

        .region-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 20px;
        }

        .region-badge.excellent {
            background: rgba(34,197,94,0.15);
            color: #4ade80;
            border: 1px solid rgba(34,197,94,0.1);
        }

        .region-badge.good {
            background: rgba(74,222,128,0.1);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.05);
        }

        .region-badge.medium {
            background: rgba(234,179,8,0.15);
            color: #fbbf24;
            border: 1px solid rgba(234,179,8,0.1);
        }

        .region-badge.low {
            background: rgba(239,68,68,0.15);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.1);
        }

        .region-badge.critical {
            background: rgba(239,68,68,0.25);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.2);
            animation: pulseDanger 1.5s infinite;
        }

        .region-card .region-body {
            padding: 0 20px 16px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            #page-efficiency { padding: 12px; }
            .eff-header { flex-direction: column; align-items: flex-start; }
            .eff-header-left { width: 100%; }
            .eff-header-left h2 { font-size: 16px; }
            .eff-header-actions { width: 100%; }
            .eff-stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .stat-card .number { font-size: 20px; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-bar select { min-width: 100%; }
            .table-wrapper { padding: 12px; }
            table { font-size: 0.7rem; min-width: 500px; }
            thead th, tbody td { padding: 6px 8px; }
            .region-card .region-header { flex-direction: column; align-items: flex-start; }
            .region-card .region-body { padding: 0 12px 12px; }
        }

        @media (max-width: 480px) {
            .eff-stats { grid-template-columns: 1fr 1fr; gap: 6px; }
            .stat-card { padding: 10px 12px; }
            .stat-card .number { font-size: 18px; }
            .stat-card .label { font-size: 9px; }
            .eff-header-left .icon { width: 36px; height: 36px; font-size: 16px; }
            .eff-header-left h2 { font-size: 14px; }
            .section-header h3 { font-size: 13px; }
            thead th, tbody td { padding: 4px 6px; font-size: 0.6rem; }
        }
    </style>

                    'وحدة الصيانة والإسناد البحري المنستير': { vessels: 8, active: 7, maintenance: 1, damaged: 0 },
                    'وحدة الصيانة والإسناد البحري صفاقس': { vessels: 5, active: 3, maintenance: 1, damaged: 1 },

                }
            };

            // ===== DOM REFS =====
            var $ = function(id) { return document.getElementById(id); };

            // ===== HELPERS =====
            function getStatusClass(eff) {
                if (eff >= 80) return 'excellent';
                if (eff >= 70) return 'good';
                if (eff >= 50) return 'medium';
                if (eff >= 30) return 'low';
                return 'critical';
            }

            function getStatusText(eff) {
                if (eff >= 80) return 'ممتازة';
                if (eff >= 70) return 'جيدة';
                if (eff >= 50) return 'متوسطة';
                if (eff >= 30) return 'منخفضة';
                return 'حرجة';
            }

            function getProgressClass(eff) {
                if (eff >= 70) return 'high';
                if (eff >= 50) return 'mid';
                return 'low';
            }

            function getRowClass(eff) {
                if (eff >= 70) return 'row-high';
                if (eff >= 50) return 'row-mid';
                return 'row-low';
            }

            function getRegionBadge(eff) {
                if (eff >= 80) return 'excellent';
                if (eff >= 70) return 'good';
                if (eff >= 50) return 'medium';
                if (eff >= 30) return 'low';
                return 'critical';
            }

            function formatDate(dateStr) {
                if (!dateStr) return '-';
                var parts = dateStr.split('-');
                return parts[2] + '/' + parts[1] + '/' + parts[0];
            }

            // ===== RENDER =====
            function renderEfficiency() {
                renderStats();
                renderGeneralTable();
                renderRegions();
            }

            function renderStats() {
                var regionFilter = $('fRegEff').value;
                var total = 0, active = 0, maintenance = 0, damaged = 0;

                for (var name in efficiencyData.regions) {
                    var data = efficiencyData.regions[name];
                    if (regionFilter === 'الكل' || name === regionFilter) {
                        total += data.vessels;
                        active += data.active;
                        maintenance += data.maintenance;
                        damaged += data.damaged;
                    }
                }

                var efficiency = total > 0 ? ((active / total) * 100).toFixed(1) : 0;

                $('totalVessels').textContent = total;
                $('activeVessels').textContent = active;
                $('maintenanceVessels').textContent = maintenance;
                $('damagedVessels').textContent = damaged;
                $('efficiencyPercent').textContent = efficiency + '%';
            }

            function renderGeneralTable() {
                var categoryFilter = $('fCatEff').value;
                var statusFilter = $('fStatusEff').value;

                var filtered = efficiencyData.general;

                if (categoryFilter !== 'الكل') {
                    filtered = filtered.filter(function(item) {
                        return item.category === categoryFilter;
                    });
                }

                if (statusFilter !== 'الكل') {
                    filtered = filtered.filter(function(item) {
                        if (statusFilter === 'صالح') return item.efficiency >= 70;
                        if (statusFilter === 'صيانة') return item.efficiency >= 50 && item.efficiency < 70;
                        if (statusFilter === 'معطب') return item.efficiency < 50;
                        return true;
                    });
                }

                if (filtered.length === 0) {
                    $('generalBody').innerHTML = `
                        <tr>
                            <td colspan="6" style="text-align:center;padding:40px;color:rgba(255,255,255,0.15);">
                                <div style="font-size:2rem;margin-bottom:10px;">🔍</div>
                                لا توجد بيانات مطابقة
                            </td>
                        </tr>
                    `;
                    return;
                }

                var html = '';
                for (var i = 0; i < filtered.length; i++) {
                    var item = filtered[i];
                    var eff = item.efficiency;
                    var rowClass = getRowClass(eff);
                    var statusClass = getStatusClass(eff);
                    var statusText = getStatusText(eff);
                    var progressClass = getProgressClass(eff);
                    var effColor = eff >= 70 ? '#4ade80' : (eff >= 50 ? '#fbbf24' : '#f87171');

                    html += `
                        <tr class="${rowClass}">
                            <td style="text-align:right;font-weight:600;color:#fff;">${item.category}</td>
                            <td>${item.active}</td>
                            <td>${item.damaged}</td>
                            <td class="eff-cell" style="color:${effColor};">${eff.toFixed(1)}%</td>
                            <td>
                                <div class="progress-bar">
                                    <div class="fill ${progressClass}" style="width:${Math.min(eff, 100)}%;"></div>
                                </div>
                            </td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        </tr>
                    `;
                }

                $('generalBody').innerHTML = html;

                // Update badge
                var avgEff = filtered.reduce(function(sum, item) { return sum + item.efficiency; }, 0) / filtered.length;

                var badge = $('generalBadge');
                if (avgEff >= 80) {
                    badge.textContent = '✅ أداء ممتاز';
                    badge.className = 'badge success';
                } else if (avgEff >= 70) {
                    badge.textContent = '📈 أداء جيد';
                    badge.className = 'badge gold';
                } else if (avgEff >= 50) {
                    badge.textContent = '⚠️ أداء متوسط';
                    badge.className = 'badge warning';
                } else {
                    badge.textContent = '🚨 أداء منخفض';
                    badge.className = 'badge danger';
                }
            }

            function renderRegions() {
                var regionFilter = $('fRegEff').value;
                var container = $('regionTables');
                var html = '';

                var filteredNames = Object.keys(efficiencyData.regions);

                if (regionFilter !== 'الكل') {
                    filteredNames = filteredNames.filter(function(name) {
                        return name === regionFilter;
                    });
                }

                if (filteredNames.length === 0) {
                    container.innerHTML = `
                        <div style="padding:30px;text-align:center;color:rgba(255,255,255,0.15);">
                            <div style="font-size:2rem;margin-bottom:10px;">🗺️</div>
                            لا توجد أقاليم مطابقة
                        </div>
                    `;
                    return;
                }

                for (var i = 0; i < filteredNames.length; i++) {
                    var name = filteredNames[i];
                    var data = efficiencyData.regions[name];
                    var eff = data.vessels > 0 ? ((data.active / data.vessels) * 100).toFixed(1) : 0;
                    var badge = getRegionBadge(eff);

                    // Sample vessels for each region
                    var vessels = [
                        { name: 'البروق 01', category: 'البروق', status: 'صالح', date: '2026-05-12' },
                        { name: 'البروق 02', category: 'البروق', status: data.maintenance > 0 ? 'صيانة' : 'صالح', date: '2026-06-20' },
                        { name: 'صقر 03', category: 'صقور', status: 'صالح', date: '2026-04-05' },
                        { name: 'خافرة 07', category: 'خوافر', status: data.damaged > 0 ? 'معطب' : 'صالح', date: '2026-03-25' }
                    ];

                    var statusMap = {
                        'صالح': 'excellent',
                        'صيانة': 'medium',
                        'معطب': 'low'
                    };

                    var statusLabel = {
                        'صالح': '✅ صالح',
                        'صيانة': '🔧 صيانة',
                        'معطب': '⚠️ معطب'
                    };

                    var rows = '';
                    for (var j = 0; j < Math.min(vessels.length, data.vessels); j++) {
                        var v = vessels[j];
                        var cls = statusMap[v.status] || 'excellent';
                        var label = statusLabel[v.status] || v.status;
                        rows += `
                            <tr>
                                <td style="text-align:right;font-weight:600;color:#fff;">${v.name}</td>
                                <td>${v.category}</td>
                                <td><span class="status-badge ${cls}">${label}</span></td>
                                <td>${formatDate(v.date)}</td>
                            </tr>
                        `;
                    }

                    html += `
                        <div class="region-card">
                            <div class="region-header">
                                <div class="region-name">
                                    <i class="fas fa-map-pin"></i> ${name}
                                </div>
                                <span class="region-badge ${badge}">${eff}% جاهزية</span>
                            </div>
                            <div class="region-body">
                                <div class="table-wrapper">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th style="text-align:right;">المركب</th>
                                                <th>الفئة</th>
                                                <th>الحالة</th>
                                                <th>آخر صيانة</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${rows || '<tr><td colspan="4" style="text-align:center;padding:20px;color:rgba(255,255,255,0.1);">لا توجد مراكب مسجلة</td></tr>'}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = html;
            }

            // ===== ACTIONS =====
            function refreshEfficiency() {
                var btn = $('refreshBtn');
                var original = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';
                btn.disabled = true;

                setTimeout(function() {
                    renderEfficiency();
                    btn.innerHTML = original;
                    btn.disabled = false;
                    showNotification('✅ تم تحديث البيانات بنجاح', 'success');
                }, 600);
            }

            function resetFilters() {
                $('fRegEff').value = 'الكل';
                $('fCatEff').value = 'الكل';
                $('fStatusEff').value = 'الكل';
                renderEfficiency();
                showNotification('✅ تم إلغاء جميع الفلاتر', 'success');
            }

            // ===== NOTIFICATION =====
            function showNotification(message, type) {
                var old = document.querySelector('.eff-notification');
                if (old) old.remove();

                var colors = {
                    success: 'rgba(34,197,94,0.15)',
                    info: 'rgba(9,132,227,0.15)',
                    error: 'rgba(239,68,68,0.15)'
                };

                var notif = document.createElement('div');
                notif.className = 'eff-notification';
                notif.style.cssText = `
                    position: fixed;
                    bottom: 24px;
                    right: 24px;
                    background: ${colors[type] || colors.info};
                    backdrop-filter: blur(12px);
                    border: 1px solid rgba(255,255,255,0.1);
                    padding: 14px 24px;
                    border-radius: 12px;
                    color: #fff;
                    font-family: Cairo, sans-serif;
                    font-size: 14px;
                    z-index: 9999;
                    animation: slideUp 0.4s ease-out;
                    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
                    max-width: 400px;
                `;
                notif.textContent = message;

                document.body.appendChild(notif);

                setTimeout(function() {
                    notif.style.opacity = '0';
                    notif.style.transform = 'translateY(20px)';
                    notif.style.transition = 'all 0.4s ease-out';
                    setTimeout(function() { notif.remove(); }, 400);
                }, 3000);
            }

            // ===== ADD STYLES =====
            var styleNotif = document.createElement('style');
            styleNotif.textContent = `
                @keyframes slideUp {
                    from { opacity: 0; transform: translateY(20px); }
                    to { opacity: 1; transform: translateY(0); }
                }
                .eff-notification {
                    direction: rtl;
                }
            `;
            document.head.appendChild(styleNotif);

            // ===== EVENT BINDING =====
            document.addEventListener('DOMContentLoaded', function() {
                $('refreshBtn').addEventListener('click', refreshEfficiency);
                $('filterBtn').addEventListener('click', renderEfficiency);
                $('resetBtn').addEventListener('click', resetFilters);

                $('fRegEff').addEventListener('change', renderEfficiency);
                $('fCatEff').addEventListener('change', renderEfficiency);
                $('fStatusEff').addEventListener('change', renderEfficiency);

                renderEfficiency();
                console.log('✅ Efficiency Page loaded successfully!');
            });

            window.refreshEfficiency = refreshEfficiency;
            window.resetFilters = resetFilters;

        })();
    </script>
</div>
