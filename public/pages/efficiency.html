<div id="page-efficiency">
    <!-- Header -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; flex-wrap:wrap; gap:5px; border-bottom:1px solid #f0f0f0;">
        <div>
            <h2 style="margin:0; color:#1a1a2e; font-size:18px;">📊 الجاهزية</h2>
            <p style="margin:0; color:#6c757d; font-size:11px;">تحليل الأسطول البحري</p>
        </div>
        <span style="background:linear-gradient(135deg, #667eea, #764ba2); color:white; padding:4px 14px; border-radius:20px; font-weight:bold; font-size:12px;">
            📊 <span id="effCount">0</span>
        </span>
    </div>
    
    <!-- إحصائيات سريعة -->
    <div id="efficiencyStats"></div>
    
    <!-- رسوم بيانية مصغرة جداً -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0;">
        <div style="background:white; border-radius:8px; padding:8px; box-shadow:0 1px 6px rgba(0,0,0,0.05);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <span style="font-size:10px; font-weight:600; color:#1a1a2e;">📊 الفئات</span>
                <span style="font-size:8px; color:#6c757d;">حسب الحالة</span>
            </div>
            <canvas id="chartCategory" style="height:120px; width:100%;"></canvas>
        </div>
        
        <div style="background:white; border-radius:8px; padding:8px; box-shadow:0 1px 6px rgba(0,0,0,0.05);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <span style="font-size:10px; font-weight:600; color:#1a1a2e;">🎯 التوزيع</span>
                <span style="font-size:8px; color:#6c757d;">نسبة</span>
            </div>
            <canvas id="chartDoughnut" style="height:120px; width:100%;"></canvas>
        </div>
    </div>
    
    <!-- الجداول -->
    <div id="efficiencyTablesContainer"></div>
    
    <!-- أزرار -->
    <div style="display:flex; gap:6px; margin:8px 0; flex-wrap:wrap;">
        <button onclick="exportEfficiencyData()" style="padding:4px 12px; background:linear-gradient(135deg, #667eea, #764ba2); color:white; border:none; border-radius:6px; cursor:pointer; font-size:11px;">📥 CSV</button>
        <button onclick="window.print()" style="padding:4px 12px; background:linear-gradient(135deg, #11998e, #38ef7d); color:white; border:none; border-radius:6px; cursor:pointer; font-size:11px;">🖨️ طباعة</button>
        <button onclick="refreshAllPages()" style="padding:4px 12px; background:#6c757d; color:white; border:none; border-radius:6px; cursor:pointer; font-size:11px;">🔄 تحديث</button>
    </div>
</div>
