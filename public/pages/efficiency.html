<div id="page-efficiency">
    <style>
        /* ============================================================
           📊 EFFICIENCY PAGE - FULL VERSION
           ============================================================ */

        /* ===== CSS VARIABLES ===== */
        :root {
            --primary-dark: #0a1628;
            --primary: #0f3460;
            --gold: #e6b31e;
            --gold-light: #f5d76e;
            --gold-dark: #c99a0e;
            --success: #00b894;
            --success-light: #55efc4;
            --danger: #e17055;
            --warning: #fdcb6e;
            --info: #0984e3;
            --glass-bg: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.06);
            --shadow-gold: 0 0 40px rgba(230,179,30,0.08);
            --shadow-card: 0 8px 32px rgba(0,0,0,0.15);
            --shadow-hover: 0 12px 48px rgba(0,0,0,0.25);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.4s cubic-bezier(0.4,0,0.2,1);
            --font: 'Cairo', 'Segoe UI', system-ui, sans-serif;
        }

        /* ===== FULL SCREEN RESET ===== */
        #page-efficiency {
            width: 100%;
            max-width: 100%;
            padding: 0;
            margin: 0;
            font-family: var(--font);
            background: #0a0e1a;
            color: #e8edf5;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ===== BACKGROUND EFFECT ===== */
        #page-efficiency::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(230,179,30,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(0,184,148,0.03) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
            animation: bgPulse 15s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(2deg); }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-light); }

        /* ============================================================
           HEADER
           ============================================================ */
        .eff-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 64px;
            z-index: 10;
            margin: 0;
            width: 100%;
        }

        .eff-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .eff-header-left .header-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--success));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #0a1628;
            box-shadow: var(--shadow-gold);
            animation: pulseGold 2s ease-in-out infinite;
        }

        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 20px rgba(230,179,30,0.1); }
            50% { box-shadow: 0 0 40px rgba(230,179,30,0.2); }
        }

        .eff-header-left h2 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold-light), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .eff-header-left p {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin: 0;
        }

        .eff-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .eff-header-actions .btn-action {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
        }

        .eff-header-actions .btn-action.primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0a1628;
            box-shadow: var(--shadow-gold);
        }

        .eff-header-actions .btn-action.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,179,30,0.3);
        }

        .eff-header-actions .btn-action.secondary {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: rgba(255,255,255,0.5);
        }

        .eff-header-actions .btn-action.secondary:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
            transform: translateY(-2px);
        }

        /* ============================================================
           STATS CARDS
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            padding: 16px 24px;
            margin: 0;
            width: 100%;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 16px 18px;
            text-align: center;
            transition: all var(--transition);
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--success));
            opacity: 0.6;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(230,179,30,0.15);
            box-shadow: var(--shadow-hover);
        }

        .stat-card .number {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        .stat-card .number.gold { color: var(--gold-light); }
        .stat-card .number.green { color: var(--success-light); }
        .stat-card .number.yellow { color: var(--warning); }
        .stat-card .number.red { color: var(--danger); }

        .stat-card .label {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .stat-card .icon-bg {
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 50px;
            opacity: 0.04;
            pointer-events: none;
        }

        /* ============================================================
           FILTER BAR
           ============================================================ */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            padding: 10px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
            margin: 0;
            width: 100%;
        }

        .filter-bar label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-bar select {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.75rem;
            min-width: 120px;
            cursor: pointer;
            font-family: var(--font);
        }

        .filter-bar select:focus {
            outline: none;
            border-color: var(--gold);
        }

        .filter-bar select option {
            background: #0a1628;
            color: #e2e8f0;
        }

        .filter-bar .btn-filter {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-bar .btn-filter.primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0a1628;
        }

        .filter-bar .btn-filter.primary:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 20px rgba(230,179,30,0.2);
        }

        .filter-bar .btn-filter.outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: rgba(255,255,255,0.3);
        }

        .filter-bar .btn-filter.outline:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        /* ============================================================
           GENERAL EFFICIENCY TABLE
           ============================================================ */
        .eff-section {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            margin: 0 24px 16px;
            overflow: hidden;
        }

        .eff-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.02);
        }

        .eff-section .section-header h3 {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .eff-section .section-header h3 i {
            color: var(--gold);
        }

        .eff-section .section-header .badge {
            font-size: 11px;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge.success {
            background: rgba(34,197,94,0.12);
            color: #4ade80;
        }

        .badge.warning {
            background: rgba(234,179,8,0.12);
            color: #fbbf24;
        }

        .badge.danger {
            background: rgba(239,68,68,0.12);
            color: #f87171;
        }

        .badge.gold {
            background: rgba(230,179,30,0.12);
            color: var(--gold-light);
        }

        .section-content {
            padding: 16px 20px;
        }

        /* ===== TABLES ===== */
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius-sm);
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            min-width: 600px;
        }

        thead {
            background: rgba(15,52,96,0.3);
            border-bottom: 2px solid rgba(230,179,30,0.08);
        }

        thead th {
            padding: 10px 12px;
            text-align: center;
            font-weight: 700;
            font-size: 0.6rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        thead th i {
            margin-left: 4px;
            color: var(--gold);
            font-size: 0.7rem;
        }

        tbody td {
            padding: 9px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            vertical-align: middle;
            color: rgba(255,255,255,0.6);
            font-size: 0.78rem;
            text-align: center;
        }

        tbody tr {
            transition: all var(--transition);
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }

        /* ===== ROW CLASSES ===== */
        .row-high {
            background: rgba(34, 197, 94, 0.05) !important;
            border-right: 3px solid #4ade80;
        }

        .row-high .eff-cell {
            color: #4ade80 !important;
            font-weight: 700;
        }

        .row-mid {
            background: rgba(234, 179, 8, 0.05) !important;
            border-right: 3px solid #fbbf24;
        }

        .row-mid .eff-cell {
            color: #fbbf24 !important;
            font-weight: 700;
        }

        .row-low {
            background: rgba(239, 68, 68, 0.05) !important;
            border-right: 3px solid #f87171;
        }

        .row-low .eff-cell {
            color: #f87171 !important;
            font-weight: 700;
        }

        /* ===== STATUS BADGES ===== */
        .status-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }

        .status-badge.excellent {
            background: rgba(34,197,94,0.12);
            color: #4ade80;
        }

        .status-badge.good {
            background: rgba(74,222,128,0.08);
            color: #4ade80;
        }

        .status-badge.medium {
            background: rgba(234,179,8,0.12);
            color: #fbbf24;
        }

        .status-badge.low {
            background: rgba(239,68,68,0.12);
            color: #f87171;
        }

        .status-badge.critical {
            background: rgba(239,68,68,0.2);
            color: #f87171;
            animation: pulseDanger 1.5s ease-in-out infinite;
        }

        @keyframes pulseDanger {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
            min-width: 80px;
        }

        .progress-bar .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .progress-bar .progress-fill.high {
            background: linear-gradient(90deg, #22c55e, #4ade80);
        }

        .progress-bar .progress-fill.mid {
            background: linear-gradient(90deg, #eab308, #fbbf24);
        }

        .progress-bar .progress-fill.low {
            background: linear-gradient(90deg, #ef4444, #f87171);
        }

        /* ============================================================
           REGION TABLES
           ============================================================ */
        .region-card {
            padding: 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .region-card:last-child {
            border-bottom: none;
        }

        .region-card .region-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(255,255,255,0.02);
            flex-wrap: wrap;
            gap: 8px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .region-card .region-header:hover {
            background: rgba(255,255,255,0.04);
        }

        .region-card .region-header .region-name {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .region-card .region-header .region-name i {
            color: var(--gold);
        }

        .region-card .region-header .region-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 20px;
        }

        .region-badge.excellent {
            background: rgba(34,197,94,0.15);
            color: #4ade80;
            border: 1px solid rgba(34,197,94,0.1);
        }

        .region-badge.good {
            background: rgba(74,222,128,0.1);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.05);
        }

        .region-badge.medium {
            background: rgba(234,179,8,0.15);
            color: #fbbf24;
            border: 1px solid rgba(234,179,8,0.1);
        }

        .region-badge.low {
            background: rgba(239,68,68,0.15);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.1);
        }

        .region-badge.critical {
            background: rgba(239,68,68,0.25);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.2);
            animation: pulseDanger 1.5s ease-in-out infinite;
        }

        .region-card .region-body {
            padding: 0 20px 16px;
        }

        /* ============================================================
           CHARTS
           ============================================================ */
        .chart-section {
            margin: 0 24px 20px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--glass-bg);
        }

        .chart-switch {
            display: flex;
            gap: 10px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--glass-border);
            flex-wrap: wrap;
            background: rgba(255,255,255,0.02);
        }

        .chart-btn {
            padding: 6px 18px;
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            background: transparent;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .chart-btn:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.1);
            color: #fff;
        }

        .chart-btn.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            border-color: var(--gold);
            color: #0a1628;
        }

        .chart-btn i {
            margin-left: 6px;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .chart-box {
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius-sm);
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .chart-box.full {
            grid-column: 1 / -1;
        }

        .chart-box h4 {
            font-size: 14px;
            font-weight: 700;
            color: rgba(255,255,255,0.5);
            margin-bottom: 12px;
            text-align: center;
        }

        .chart-box canvas {
            width: 100% !important;
            max-height: 280px;
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.15);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            color: rgba(255,255,255,0.04);
            display: block;
            margin-bottom: 12px;
        }

        .empty-state .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.04);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255,255,255,0.2);
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.1);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 992px) {
            .eff-header { padding: 12px 16px; top: 60px; }
            .eff-header-left h2 { font-size: 18px; }
            .stats-grid { padding: 12px 16px; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
            .filter-bar { padding: 8px 16px; gap: 6px 10px; }
            .eff-section { margin: 0 16px 12px; }
            .chart-section { margin: 0 16px 16px; }
            .charts-container { grid-template-columns: 1fr; padding: 12px; }
            .chart-box.full { grid-column: 1; }
            .region-card .region-body { padding: 0 12px 12px; }
        }

        @media (max-width: 768px) {
            .eff-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 12px 16px;
                top: 56px;
            }
            .eff-header-left { width: 100%; }
            .eff-header-left h2 { font-size: 16px; }
            .eff-header-actions { width: 100%; justify-content: flex-start; }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 10px 16px;
            }
            .stat-card { padding: 12px 14px; }
            .stat-card .number { font-size: 20px; }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 10px 16px;
                gap: 6px;
            }
            .filter-bar label { font-size: 0.65rem; }
            .filter-bar select { min-width: 100%; }
            .eff-section { margin: 0 12px 10px; }
            .section-header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .section-content { padding: 12px 14px; }
            .table-wrapper table { font-size: 0.7rem; min-width: 500px; }
            thead th, tbody td { padding: 6px 8px; }
            .chart-section { margin: 0 12px 12px; }
            .charts-container { padding: 10px; gap: 12px; }
            .chart-box { padding: 12px; }
            .chart-box canvas { max-height: 200px; }
            .eff-header-actions .btn-action { padding: 6px 12px; font-size: 0.7rem; }
            .chart-switch { padding: 10px 12px; justify-content: center; }
            .chart-btn { font-size: 11px; padding: 4px 12px; }
            .region-card .region-header { padding: 10px 14px; flex-direction: column; align-items: flex-start; }
            .region-card .region-body { padding: 0 10px 10px; }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .stat-card { padding: 10px 12px; }
            .stat-card .number { font-size: 18px; }
            .stat-card .label { font-size: 9px; }
            .eff-header-left .header-icon { width: 36px; height: 36px; font-size: 16px; }
            .eff-header-left h2 { font-size: 14px; }
            .eff-header-left p { font-size: 10px; }
            .section-header h3 { font-size: 13px; }
            .section-content { padding: 10px 12px; }
            thead th, tbody td { padding: 4px 6px; font-size: 0.65rem; }
        }
    </style>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <div class="eff-header">
        <div class="eff-header-left">
            <div class="header-icon">
                <i class="fas fa-chart-line"></i>
            </div>
            <div>
                <h2>جاهزية الأسطول</h2>
                <p>تحليل متقدم لنسب الجاهزية والأداء</p>
            </div>
        </div>
        <div class="eff-header-actions">
            <button class="btn-action primary" onclick="refreshEfficiency()">
                <i class="fas fa-sync-alt"></i> تحديث
            </button>
            <button class="btn-action secondary" onclick="window.print()">
                <i class="fas fa-print"></i> طباعة
            </button>
        </div>
    </div>

    <!-- ============================================================
    STATS CARDS
