<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طاقم الوسيلة — الأسطول البحري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ═══════════════════════════════════════════════════════════ */
/* 🎨 BASE & VARIABLES */
/* ═══════════════════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --gold-1: #f7d774;
    --gold-2: #e6b31e;
    --gold-3: #b8860b;
    --gold-glow: rgba(230, 179, 30, 0.35);
    --navy-1: #0a1e38;
    --navy-2: #14304f;
    --navy-3: #1e3a5f;
    --emerald: #10b981;
    --emerald-light: #6ee7b7;
    --red: #ef4444;
    --red-light: #fca5a5;
    --blue: #3b82f6;
    --blue-light: #93c5fd;
    --purple: #8b5cf6;
    --slate-50: #f8fafc;
    --slate-100: #f1f5f9;
    --slate-200: #e2e8f0;
    --slate-300: #cbd5e1;
    --slate-400: #94a3b8;
    --slate-500: #64748b;
    --slate-600: #475569;
    --slate-700: #334155;
    --slate-800: #1e293b;
    --slate-900: #0f172a;
    --radius: 16px;
    --radius-sm: 11px;
    --radius-lg: 22px;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --bounce: 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    --font: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    --shadow-sm: 0 2px 8px rgba(10, 30, 56, 0.06);
    --shadow-md: 0 6px 24px rgba(10, 30, 56, 0.10);
    --shadow-lg: 0 20px 50px rgba(10, 30, 56, 0.18);
    --shadow-gold: 0 8px 32px var(--gold-glow);
}

html { scroll-behavior: smooth; }

body {
    font-family: var(--font);
    background:
        radial-gradient(circle at 15% 10%, rgba(230, 179, 30, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(59, 130, 246, 0.06) 0%, transparent 45%),
        linear-gradient(135deg, #eef2f7 0%, #f8fafc 50%, #eef2f7 100%);
    background-attachment: fixed;
    color: var(--slate-900);
    min-height: 100vh;
    direction: rtl;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.container { max-width: 1600px; margin: 0 auto; }

/* ═══════════════════════════════════════════════════════════ */
/* 🏛️ HEADER */
/* ═══════════════════════════════════════════════════════════ */
.header {
    background: linear-gradient(135deg, var(--navy-1) 0%, var(--navy-2) 50%, var(--navy-1) 100%);
    border-radius: var(--radius-lg);
    padding: 26px 34px;
    margin-bottom: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    box-shadow:
        0 24px 70px rgba(10, 30, 56, 0.35),
        0 0 0 1px rgba(230, 179, 30, 0.25) inset,
        0 2px 0 rgba(255, 255, 255, 0.05) inset;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    z-index: 20;
}
.header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--gold-2), var(--gold-1), var(--gold-2), transparent);
    background-size: 200% 100%;
    animation: shimmer 4s linear infinite;
}
@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}
.header::after {
    content: '';
    position: absolute;
    top: -50%; right: -15%;
    width: 480px; height: 480px;
    background: radial-gradient(circle, rgba(230, 179, 30, 0.18) 0%, transparent 65%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
    z-index: 2;
}

.header-icon {
    width: 70px; height: 70px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2), var(--gold-3));
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    color: var(--navy-1);
    box-shadow:
        0 10px 36px var(--gold-glow),
        0 0 0 5px rgba(230, 179, 30, 0.12),
        0 0 0 1px rgba(255, 255, 255, 0.15) inset;
    flex-shrink: 0;
    position: relative;
    animation: floatIcon 4s ease-in-out infinite;
}
@keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}

.header-text h1 {
    font-size: 28px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold-1) 0%, var(--gold-2) 60%, var(--gold-1) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 5px;
    letter-spacing: 0.4px;
    line-height: 1.2;
}
.header-text p {
    font-size: 13px;
    color: var(--slate-400);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
}

.header-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    position: relative;
    z-index: 50;
    isolation: isolate;
}

/* ═══════════════════════════════════════════════════════════ */
/* 🎯 BUTTONS */
/* ═══════════════════════════════════════════════════════════ */
.btn {
    padding: 13px 24px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: var(--font);
    font-size: 13.5px;
    font-weight: 800;
    cursor: pointer;
    transition: all var(--transition);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    white-space: nowrap;
    position: relative;
    overflow: hidden;
    isolation: isolate;
}
.btn i { font-size: 14px; }

.btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent);
    opacity: 0;
    transition: opacity var(--transition);
    z-index: -1;
}
.btn:hover::before { opacity: 1; }

.btn-print {
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2), var(--gold-3));
    color: var(--navy-1);
    box-shadow: 0 10px 28px var(--gold-glow);
    position: relative;
    z-index: 60;
}
.btn-print:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 16px 44px var(--gold-glow);
}
.btn-print:active { transform: translateY(-1px) scale(0.99); }

.btn-primary {
    background: linear-gradient(135deg, var(--emerald), #059669);
    color: white;
    box-shadow: 0 10px 28px rgba(16, 185, 129, 0.35);
}
.btn-primary:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 16px 44px rgba(16, 185, 129, 0.5);
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.08);
    color: var(--slate-200);
    border: 1px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(12px);
}
.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.18);
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.35);
}

.btn-outline {
    background: var(--slate-100);
    color: var(--slate-700);
    border: 1.5px solid var(--slate-300);
}
.btn-outline:hover {
    background: var(--slate-200);
    transform: translateY(-2px);
    border-color: var(--slate-400);
}

/* ═══════════════════════════════════════════════════════════ */
/* 📊 STATS */
/* ═══════════════════════════════════════════════════════════ */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 22px;
    position: relative;
    z-index: 1;
}

.stat-card {
    background: white;
    border-radius: var(--radius);
    padding: 22px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: var(--shadow-md);
    transition: all var(--transition);
    border: 1px solid var(--slate-200);
    position: relative;
    overflow: hidden;
    cursor: default;
}
.stat-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 4px;
    height: 100%;
    transition: width var(--transition);
    border-radius: 0 0 0 4px;
}
.stat-card::after {
    content: '';
    position: absolute;
    top: -40%; left: -20%;
    width: 200px; height: 200px;
    background: radial-gradient(circle, currentColor, transparent 70%);
    opacity: 0.06;
    border-radius: 50%;
    pointer-events: none;
    transition: opacity var(--transition);
}
.stat-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-lg);
}
.stat-card:hover::before { width: 7px; }
.stat-card:hover::after { opacity: 0.12; }

.stat-card.vessel { color: var(--gold-2); }
.stat-card.vessel::before { background: linear-gradient(180deg, var(--gold-1), var(--gold-2)); }
.stat-card.rank { color: var(--blue); }
.stat-card.rank::before { background: linear-gradient(180deg, var(--blue-light), var(--blue)); }
.stat-card.phone { color: var(--emerald); }
.stat-card.phone::before { background: linear-gradient(180deg, var(--emerald-light), var(--emerald)); }
.stat-card.recent { color: var(--purple); }
.stat-card.recent::before { background: linear-gradient(180deg, #c4b5fd, var(--purple)); }
.stat-card.user { color: var(--gold-3); }
.stat-card.user::before { background: linear-gradient(180deg, var(--gold-2), var(--gold-3)); }

.stat-icon {
    width: 56px; height: 56px;
    border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    font-size: 23px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
}
.stat-card.vessel .stat-icon {
    background: linear-gradient(135deg, rgba(230, 179, 30, 0.18), rgba(230, 179, 30, 0.06));
    color: var(--gold-2);
}
.stat-card.rank .stat-icon {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.18), rgba(59, 130, 246, 0.06));
    color: var(--blue);
}
.stat-card.phone .stat-icon {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(16, 185, 129, 0.06));
    color: var(--emerald);
}
.stat-card.recent .stat-icon {
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(139, 92, 246, 0.06));
    color: var(--purple);
}
.stat-card.user .stat-icon {
    background: linear-gradient(135deg, rgba(184, 134, 11, 0.18), rgba(184, 134, 11, 0.06));
    color: var(--gold-3);
}

.stat-content { flex: 1; min-width: 0; position: relative; z-index: 1; }
.stat-value {
    font-size: 28px;
    font-weight: 900;
    color: var(--navy-1);
    line-height: 1.15;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.5px;
}
.stat-value.name { font-size: 17px; line-height: 1.3; letter-spacing: 0; }
.stat-value.small { font-size: 16px; line-height: 1.3; letter-spacing: 0; }
.stat-label {
    font-size: 11px;
    font-weight: 800;
    color: var(--slate-500);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* ═══════════════════════════════════════════════════════════ */
/* 📝 CARD & FORM */
/* ═══════════════════════════════════════════════════════════ */
.card {
    background: white;
    border-radius: var(--radius);
    padding: 26px 30px;
    margin-bottom: 22px;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--slate-200);
    position: relative;
    overflow: hidden;
}
.card::before {
    content: '';
    position: absolute;
    top: 0; right: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--slate-100);
    flex-wrap: wrap;
    gap: 12px;
}
.card-title {
    font-size: 17px;
    font-weight: 900;
    color: var(--navy-1);
    display: flex;
    align-items: center;
    gap: 12px;
}
.card-title i {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    color: var(--navy-1);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    box-shadow: 0 4px 14px var(--gold-glow);
}
.card-toggle {
    background: transparent;
    border: 1.5px solid var(--slate-300);
    color: var(--slate-600);
    padding: 8px 16px;
    border-radius: 9px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 7px;
}
.card-toggle:hover {
    background: var(--slate-100);
    border-color: var(--slate-400);
    color: var(--navy-1);
}
.card-toggle i { transition: transform var(--transition); font-size: 11px; }

.form-body {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 16px;
    max-height: 3000px;
    overflow: hidden;
    transition: max-height 0.45s ease, opacity 0.3s ease;
    opacity: 1;
}
.form-body.collapsed {
    max-height: 0;
    opacity: 0;
    margin-bottom: 0;
}
.form-group { display: flex; flex-direction: column; }
.form-group.full { grid-column: 1 / -1; }
.form-group label {
    font-size: 11.5px;
    font-weight: 900;
    color: var(--slate-600);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    gap: 5px;
}
.form-group label .req { color: var(--red); font-size: 14px; }

.form-control {
    padding: 12px 16px;
    background: var(--slate-50);
    border: 2px solid var(--slate-200);
    border-radius: var(--radius-sm);
    color: var(--slate-900);
    font-family: var(--font);
    font-size: 13.5px;
    font-weight: 600;
    transition: all var(--transition);
    width: 100%;
}
.form-control:hover { border-color: var(--slate-300); }
.form-control:focus {
    outline: none;
    border-color: var(--gold-2);
    background: white;
    box-shadow: 0 0 0 4px var(--gold-glow);
}
.form-control::placeholder { color: var(--slate-400); font-weight: 500; }
textarea.form-control { resize: vertical; min-height: 78px; line-height: 1.6; }

.form-actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 12px;
    margin-top: 10px;
    flex-wrap: wrap;
}

/* ═══════════════════════════════════════════════════════════ */
/* 🔍 SEARCH BAR */
/* ═══════════════════════════════════════════════════════════ */
.search-bar {
    display: flex;
    gap: 14px;
    align-items: center;
    background: white;
    border-radius: var(--radius);
    padding: 16px 22px;
    margin-bottom: 22px;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--slate-200);
    flex-wrap: wrap;
    position: relative;
}
.search-bar::before {
    content: '';
    position: absolute;
    top: 0; right: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
    border-radius: var(--radius) var(--radius) 0 0;
}
.search-input-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
}
.search-input-wrap i {
    position: absolute;
    right: 18px; top: 50%;
    transform: translateY(-50%);
    color: var(--slate-400);
    font-size: 15px;
    pointer-events: none;
    transition: color var(--transition);
}
.search-input-wrap input {
    width: 100%;
    padding: 14px 48px 14px 18px;
    background: var(--slate-50);
    border: 2px solid var(--slate-200);
    border-radius: var(--radius-sm);
    font-family: var(--font);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--slate-900);
    transition: all var(--transition);
}
.search-input-wrap input:focus {
    outline: none;
    border-color: var(--blue);
    background: white;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
}
.search-input-wrap input:focus + i,
.search-input-wrap:focus-within i { color: var(--blue); }

/* ═══════════════════════════════════════════════════════════ */
/* 📋 TABLE */
/* ═══════════════════════════════════════════════════════════ */
.table-card {
    background: white;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--slate-200);
    margin-bottom: 22px;
}
.table-card-header {
    padding: 22px 28px;
    background: linear-gradient(135deg, var(--navy-1), var(--navy-2));
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    position: relative;
    overflow: hidden;
}
.table-card-header::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
}
.table-card-title {
    font-size: 16px;
    font-weight: 900;
    color: var(--gold-1);
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 1;
}
.table-card-title i { font-size: 17px; }
.table-card-count {
    font-size: 12.5px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    color: var(--navy-1);
    padding: 5px 14px;
    border-radius: 20px;
    box-shadow: 0 4px 14px var(--gold-glow);
    min-width: 32px;
    text-align: center;
}

.table-wrapper {
    overflow-x: auto;
    width: 100%;
    scrollbar-width: thin;
    scrollbar-color: var(--gold-2) var(--slate-100);
}
.table-wrapper::-webkit-scrollbar { height: 10px; }
.table-wrapper::-webkit-scrollbar-track { background: var(--slate-100); }
.table-wrapper::-webkit-scrollbar-thumb {
    background: linear-gradient(90deg, var(--gold-2), var(--gold-3));
    border-radius: 10px;
    border: 2px solid var(--slate-100);
}

.crew-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
    min-width: 1250px;
}
.crew-table thead {
    background: linear-gradient(135deg, var(--navy-1), var(--navy-2));
    position: sticky;
    top: 0;
    z-index: 2;
}
.crew-table thead th {
    padding: 16px 12px;
    font-size: 11px;
    font-weight: 900;
    color: var(--gold-1);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    text-align: center;
    border-bottom: 3px solid var(--gold-2);
    white-space: nowrap;
}
.crew-table thead th i {
    margin-left: 7px;
    font-size: 12px;
    color: var(--gold-2);
}
.crew-table tbody tr {
    transition: all var(--transition);
    background: white;
    border-bottom: 1px solid var(--slate-100);
    animation: fadeInRow 0.4s ease both;
}
@keyframes fadeInRow {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}
.crew-table tbody tr:hover {
    background: linear-gradient(90deg, rgba(230, 179, 30, 0.09), rgba(230, 179, 30, 0.02));
    box-shadow: 0 3px 16px rgba(230, 179, 30, 0.16);
    position: relative;
    z-index: 1;
}
.crew-table tbody tr:nth-child(even) { background: var(--slate-50); }
.crew-table tbody tr:nth-child(even):hover {
    background: linear-gradient(90deg, rgba(230, 179, 30, 0.09), rgba(230, 179, 30, 0.02));
}
.crew-table tbody td {
    padding: 14px 10px;
    text-align: center;
    vertical-align: middle;
    color: var(--slate-700);
    font-weight: 600;
    font-size: 13px;
}
.crew-table tbody td:first-child {
    border-right: 4px solid var(--gold-2);
    text-align: right;
    padding-right: 14px;
    padding-left: 10px;
}

.crew-name-cell {
    display: flex;
    align-items: center;
    gap: 12px;
}
.crew-avatar {
    width: 46px; height: 46px;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--gold-2), var(--gold-3));
    color: var(--navy-1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 900;
    flex-shrink: 0;
    box-shadow: 0 5px 16px var(--gold-glow), 0 0 0 2px rgba(255,255,255,0.4) inset;
    letter-spacing: -0.5px;
}
.crew-name-info { min-width: 0; }
.crew-name-full {
    font-size: 14px;
    font-weight: 900;
    color: var(--navy-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.crew-name-rank {
    font-size: 11px;
    color: var(--slate-500);
    font-weight: 700;
    margin-top: 3px;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
    transition: transform var(--transition);
}
.badge:hover { transform: scale(1.05); }
.badge-gold {
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    color: var(--navy-1);
    box-shadow: 0 3px 10px rgba(230, 179, 30, 0.25);
}
.badge-blue {
    background: rgba(59, 130, 246, 0.13);
    color: #2563eb;
    border: 1px solid rgba(59, 130, 246, 0.28);
}
.badge-emerald {
    background: rgba(16, 185, 129, 0.13);
    color: #059669;
    border: 1px solid rgba(16, 185, 129, 0.28);
}
.badge-slate {
    background: var(--slate-100);
    color: var(--slate-600);
    border: 1px solid var(--slate-200);
}
.badge-empty {
    background: var(--slate-50);
    color: var(--slate-400);
    border: 1px dashed var(--slate-300);
}

.action-btns {
    display: flex;
    gap: 7px;
    justify-content: center;
    align-items: center;
}
.btn-sm-edit, .btn-sm-delete {
    width: 36px; height: 36px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
    border: none;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
}
.btn-sm-edit {
    background: rgba(59, 130, 246, 0.13);
    color: var(--blue);
    border: 1.5px solid rgba(59, 130, 246, 0.3);
}
.btn-sm-edit:hover {
    background: linear-gradient(135deg, var(--blue), #1d4ed8);
    color: white;
    transform: translateY(-2px) scale(1.08);
    box-shadow: 0 6px 18px rgba(59, 130, 246, 0.4);
}
.btn-sm-delete {
    background: rgba(239, 68, 68, 0.13);
    color: var(--red);
    border: 1.5px solid rgba(239, 68, 68, 0.3);
}
.btn-sm-delete:hover {
    background: linear-gradient(135deg, var(--red), #b91c1c);
    color: white;
    transform: translateY(-2px) scale(1.08);
    box-shadow: 0 6px 18px rgba(239, 68, 68, 0.4);
}
.btn-sm-edit:active, .btn-sm-delete:active { transform: scale(0.96); }

/* ═══════════════════════════════════════════════════════════ */
/* 📭 STATES */
/* ═══════════════════════════════════════════════════════════ */
.empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--slate-500);
}
.empty-state i {
    font-size: 76px;
    color: var(--gold-2);
    opacity: 0.25;
    margin-bottom: 22px;
    display: block;
    animation: floatIcon 3s ease-in-out infinite;
}
.empty-state h3 {
    font-size: 19px;
    font-weight: 900;
    color: var(--slate-700);
    margin-bottom: 9px;
}
.empty-state p {
    font-size: 13.5px;
    color: var(--slate-500);
    font-weight: 600;
}

.loading-state {
    text-align: center;
    padding: 70px 24px;
    color: var(--slate-500);
}
.spinner {
    width: 52px; height: 52px;
    border: 4px solid var(--slate-200);
    border-top-color: var(--gold-2);
    border-right-color: var(--gold-2);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 18px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════════════════════════ */
/* 🔔 TOAST */
/* ═══════════════════════════════════════════════════════════ */
.toast {
    position: fixed;
    bottom: 28px;
    left: 28px;
    padding: 16px 24px;
    border-radius: var(--radius);
    font-size: 13.5px;
    font-weight: 800;
    color: white;
    z-index: 999999;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: slideIn 0.45s var(--bounce);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(20px);
    max-width: 380px;
}
.toast.success { background: linear-gradient(135deg, var(--emerald), #059669); }
.toast.error { background: linear-gradient(135deg, var(--red), #b91c1c); }
.toast.info { background: linear-gradient(135deg, var(--blue), #1d4ed8); }
@keyframes slideIn {
    from { opacity: 0; transform: translateY(30px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ═══════════════════════════════════════════════════════════ */
/* 📱 RESPONSIVE */
/* ═══════════════════════════════════════════════════════════ */
@media (max-width: 900px) {
    .header { padding: 22px; }
    .header-text h1 { font-size: 22px; }
    .header-icon { width: 58px; height: 58px; font-size: 24px; }
    .stats-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .stat-value { font-size: 24px; }
    .stat-value.name { font-size: 15px; }
    .stat-card { padding: 18px; gap: 14px; }
    .stat-icon { width: 48px; height: 48px; font-size: 19px; }
    .card { padding: 20px 22px; }
    .crew-table { font-size: 12px; }
    .crew-table thead th { padding: 13px 8px; font-size: 10px; }
    .crew-table tbody td { padding: 12px 8px; }
    .header-actions .btn span { display: none; }
    .header-actions .btn { padding: 13px 16px; }
}

@media (max-width: 600px) {
    body { padding: 12px; }
    .header { padding: 18px; border-radius: var(--radius); }
    .header-text h1 { font-size: 19px; }
    .header-icon { width: 52px; height: 52px; font-size: 21px; border-radius: 15px; }
    .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-value { font-size: 20px; }
    .stat-value.name { font-size: 13px; }
    .stat-value.small { font-size: 13px; }
    .stat-label { font-size: 10px; }
    .stat-card { padding: 14px; gap: 10px; }
    .stat-icon { width: 40px; height: 40px; font-size: 16px; border-radius: 11px; }
    .card { padding: 18px; }
    .form-body { grid-template-columns: 1fr; }
    .table-card-header { padding: 18px 20px; }
    .search-bar { padding: 13px 16px; }
}

/* ═══════════════════════════════════════════════════════════ */
/* 🖨️ PRINT STYLES */
/* ═══════════════════════════════════════════════════════════ */
@media print {
    body { background: white !important; padding: 0 !important; }
    .header-actions, .card, .search-bar, .action-btns, .toast { display: none !important; }
    .header { box-shadow: none; page-break-after: avoid; }
    .stats-grid { page-break-after: avoid; }
    .table-card { box-shadow: none; border: 1px solid #ccc; }
    .table-wrapper { overflow: visible !important; }
    .crew-table { min-width: auto; font-size: 10px; }
    .crew-table thead { background: #0a1e38 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .crew-table tbody tr:hover { box-shadow: none; background: white; }
}
</style>
</head>
<body>
<div class="container">
    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="header-icon">
                <i class="fas fa-users"></i>
            </div>
            <div class="header-text">
                <h1>طاقم الوسيلة</h1>
                <p id="vesselName">
                    <i class="fas fa-circle-notch fa-spin" style="font-size:10px;"></i>
                    جاري التحميل...
                </p>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn btn-print" onclick="printCrew()" title="طباعة (Ctrl+P)">
                <i class="fas fa-print"></i>
                <span>طباعة</span>
            </button>
            <button class="btn btn-secondary" onclick="window.close()" title="رجوع">
                <i class="fas fa-arrow-right"></i>
                <span>رجوع</span>
            </button>
        </div>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
        <div class="stat-card vessel">
            <div class="stat-icon"><i class="fas fa-ship"></i></div>
            <div class="stat-content">
                <div class="stat-value name" id="statVesselName">—</div>
                <div class="stat-label">اسم الوسيلة</div>
            </div>
        </div>
        <div class="stat-card rank">
            <div class="stat-icon"><i class="fas fa-medal"></i></div>
            <div class="stat-content">
                <div class="stat-value" id="statRanks">0</div>
                <div class="stat-label">عدد الرتب</div>
            </div>
        </div>
        <div class="stat-card phone">
            <div class="stat-icon"><i class="fas fa-phone"></i></div>
            <div class="stat-content">
                <div class="stat-value" id="statPhones">0</div>
                <div class="stat-label">أرقام هواتف</div>
            </div>
        </div>
        <div class="stat-card recent">
            <div class="stat-icon"><i class="fas fa-clock"></i></div>
            <div class="stat-content">
                <div class="stat-value" id="statRecent">0</div>
                <div class="stat-label">أضيفوا مؤخراً</div>
            </div>
        </div>
        <div class="stat-card user">
            <div class="stat-icon"><i class="fas fa-user-tie"></i></div>
            <div class="stat-content">
                <div class="stat-value small" id="statCurrentUser">—</div>
                <div class="stat-label">المسؤول</div>
            </div>
        </div>
    </div>

    <!-- ADD FORM -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <i class="fas fa-user-plus"></i>
                <span id="formTitle">إضافة فرد جديد</span>
            </div>
            <button class="card-toggle" id="formToggle" onclick="toggleForm()">
                <i class="fas fa-chevron-down"></i>
                <span>إخفاء</span>
            </button>
        </div>
        <div class="form-body" id="formBody">
            <div class="form-group">
                <label>الاسم <span class="req">*</span></label>
                <input type="text" id="fFirstName" class="form-control" placeholder="الاسم">
            </div>
            <div class="form-group">
                <label>اللقب <span class="req">*</span></label>
                <input type="text" id="fLastName" class="form-control" placeholder="اللقب">
            </div>
            <div class="form-group">
                <label>الرتبة</label>
                <input type="text" id="fRank" class="form-control" placeholder="الرتبة">
            </div>
            <div class="form-group">
                <label>الخطة</label>
                <input type="text" id="fJobTitle" class="form-control" placeholder="الخطة">
            </div>
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="fPhone" class="form-control" placeholder="الهاتف">
            </div>
            <div class="form-group">
                <label>البطاقة الوطنية</label>
                <input type="text" id="fCin" class="form-control" placeholder="رقم البطاقة">
            </div>
            <div class="form-group">
                <label>مكان الولادة</label>
                <input type="text" id="fBirthPlace" class="form-control" placeholder="مكان الولادة">
            </div>
            <div class="form-group">
                <label>تاريخ الانتداب</label>
                <input type="date" id="fHireDate" class="form-control">
            </div>
            <div class="form-group">
                <label>المؤهلات</label>
                <input type="text" id="fQualifications" class="form-control" placeholder="المؤهلات">
            </div>
            <div class="form-group">
                <label>الحالة العائلية</label>
                <input type="text" id="fFamilyStatus" class="form-control" placeholder="الحالة العائلية">
            </div>
            <div class="form-group full">
                <label>ملاحظات</label>
                <textarea id="fNotes" class="form-control" placeholder="ملاحظات إضافية..."></textarea>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="addBtn" onclick="addCrewMember()">
                    <i class="fas fa-plus"></i>
                    <span>إضافة الفرد</span>
                </button>
                <button class="btn btn-outline" id="cancelBtn" style="display:none;" onclick="cancelEdit()">
                    <i class="fas fa-times"></i>
                    <span>إلغاء التعديل</span>
                </button>
                <button class="btn btn-outline" onclick="clearForm()">
                    <i class="fas fa-eraser"></i>
                    <span>مسح</span>
                </button>
            </div>
        </div>
    </div>

    <!-- SEARCH -->
    <div class="search-bar">
        <div class="search-input-wrap">
            <input type="text" id="searchInput" placeholder="بحث في الطاقم... (الاسم، الرتبة، الهاتف...)" oninput="renderCrewList()">
            <i class="fas fa-search"></i>
        </div>
    </div>

    <!-- TABLE -->
    <div class="table-card">
        <div class="table-card-header">
            <div class="table-card-title">
                <i class="fas fa-list"></i>
                قائمة الأفراد
                <span class="table-card-count" id="tableCount">0</span>
            </div>
        </div>
        <div class="table-wrapper">
            <table class="crew-table">
                <thead>
                    <tr>
                        <th><i class="fas fa-user"></i> الاسم واللقب</th>
                        <th><i class="fas fa-medal"></i> الرتبة</th>
                        <th><i class="fas fa-briefcase"></i> الخطة</th>
                        <th><i class="fas fa-phone"></i> الهاتف</th>
                        <th><i class="fas fa-id-card"></i> البطاقة</th>
                        <th><i class="fas fa-map-marker-alt"></i> مكان الولادة</th>
                        <th><i class="fas fa-calendar"></i> تاريخ الانتداب</th>
                        <th><i class="fas fa-graduation-cap"></i> المؤهلات</th>
                        <th><i class="fas fa-heart"></i> الحالة العائلية</th>
                        <th><i class="fas fa-user-tie"></i> المسؤول</th>
                        <th><i class="fas fa-cog"></i> إجراء</th>
                    </tr>
                </thead>
                <tbody id="crewTableBody">
                    <tr>
                        <td colspan="11">
                            <div class="loading-state">
                                <div class="spinner"></div>
                                <p>جاري التحميل...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ═══════════════════════════════════════════════════════════
    // 🔧 State
    // ═══════════════════════════════════════════════════════════
    var vesselId = null;
    var vesselName = '';
    var allCrew = [];
    var editingId = null;

    // ═══════════════════════════════════════════════════════════
    // 🛠️ Helpers
    // ═══════════════════════════════════════════════════════════
    function $(s) { return document.querySelector(s); }
    function getToken() {
        return localStorage.getItem('marine_token') ||
               localStorage.getItem('token') ||
               localStorage.getItem('authToken') ||
               localStorage.getItem('accessToken') || '';
    }
    function getCsrf() {
        try {
            var m = document.cookie.match(/marine_csrf=([^;]+)/);
            return m ? decodeURIComponent(m[1]) : '';
        } catch(e) { return ''; }
    }
    function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, function(m) {
            return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m];
        });
    }
    function toast(msg, type) {
        type = type || 'info';
        var t = document.createElement('div');
        t.className = 'toast ' + type;
        var icons = { success: '✅', error: '❌', info: 'ℹ️' };
        t.innerHTML = '<span style="font-size:18px;">' + (icons[type] || 'ℹ️') + '</span><span>' + escapeHtml(msg) + '</span>';
        document.body.appendChild(t);
        setTimeout(function() { if (t.parentNode) t.remove(); }, 3500);
    }
    function formatDate(d) {
        if (!d) return '—';
        try {
            var date = new Date(d);
            if (isNaN(date.getTime())) return '—';
            return String(date.getDate()).padStart(2, '0') + '/' +
                   String(date.getMonth() + 1).padStart(2, '0') + '/' +
                   date.getFullYear();
        } catch (e) { return '—'; }
    }
    function getInitials(m) {
        var f = (m.firstName || '')[0] || '';
        var l = (m.lastName || '')[0] || '';
        return (f + l).toUpperCase() || '👤';
    }
    function getCurrentUser() {
        if (window.currentUser) return window.currentUser;
        try {
            return JSON.parse(localStorage.getItem('marine_user') || 'null');
        } catch(e) { return null; }
    }

    // ═══════════════════════════════════════════════════════════
    // 🚀 Init
    // ═══════════════════════════════════════════════════════════
    function init() {
        var token = getToken();
        if (!token) {
            document.body.innerHTML = '<div style="text-align:center;padding:80px;color:#ef4444;font-size:20px;font-family:Cairo,sans-serif;">⚠️ يجب تسجيل الدخول أولاً</div>';
            return;
        }

        var params = new URLSearchParams(window.location.search);
        vesselId = params.get('id');
        if (!vesselId) {
            document.body.innerHTML = '<div style="text-align:center;padding:80px;color:#ef4444;font-size:20px;font-family:Cairo,sans-serif;">⚠️ لم يتم تحديد المركب</div>';
            return;
        }

        loadVesselInfo();
        loadCrew();
    }

    async function loadVesselInfo() {
        try {
            var res = await fetch('/api/vessels', {
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            var vessels = await res.json();
            var v = vessels.find(function(x) {
                return String(x._id || x.id) === String(vesselId);
            });
            if (v) {
                vesselName = v.name || v.num || 'مركب';
                var label = vesselName;
                if (v.num) label += ' • رقم: ' + v.num;
                if (v.region) label += ' • ' + v.region;
                $('#vesselName').innerHTML = '<i class="fas fa-anchor" style="font-size:10px;color:#e6b31e;"></i> ' + escapeHtml(label);
                $('#statVesselName').textContent = vesselName;
                document.title = 'طاقم: ' + vesselName;
            } else {
                $('#vesselName').textContent = 'المركب غير موجود';
                $('#statVesselName').textContent = '—';
            }
        } catch (e) {
            $('#vesselName').textContent = 'خطأ في تحميل بيانات المركب';
            $('#statVesselName').textContent = '—';
        }
    }

    // ═══════════════════════════════════════════════════════════
    // 📥 Load Crew
    // ═══════════════════════════════════════════════════════════
    async function loadCrew() {
        var tbody = $('#crewTableBody');
        tbody.innerHTML = '<tr><td colspan="11"><div class="loading-state"><div class="spinner"></div><p>جاري التحميل...</p></div></td></tr>';
        try {
            var res = await fetch('/api/vessels/' + encodeURIComponent(vesselId) + '/crew', {
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            var data = await res.json();
            allCrew = (data && data.crew) || [];
            updateStats();
            renderCrewList();
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="11"><div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i><h3>فشل التحميل</h3><p>' + escapeHtml(e.message) + '</p></div></td></tr>';
        }
    }

    function updateStats() {
        var ranks = new Set();
        var phones = 0;
        var recent = 0;
        var now = Date.now();
        allCrew.forEach(function(m) {
            if (m.rank) ranks.add(m.rank);
            if (m.phone) phones++;
            if (m.createdAt) {
                var age = now - new Date(m.createdAt).getTime();
                if (age < 7 * 24 * 60 * 60 * 1000) recent++;
            }
        });
        $('#statRanks').textContent = ranks.size;
        $('#statPhones').textContent = phones;
        $('#statRecent').textContent = recent;

        var cu = getCurrentUser();
        $('#statCurrentUser').textContent = cu ? (cu.name || cu.username || '—') : '—';
    }

    // ═══════════════════════════════════════════════════════════
    // 🎨 Render
    // ═══════════════════════════════════════════════════════════
    window.renderCrewList = function() {
        var tbody = $('#crewTableBody');
        var search = ($('#searchInput').value || '').toLowerCase().trim();

        var filtered = allCrew;
        if (search) {
            filtered = allCrew.filter(function(m) {
                var text = [m.firstName, m.lastName, m.rank, m.jobTitle,
                            m.phone, m.cin, m.birthPlace, m.qualifications,
                            m.familyStatus, m.notes, m.createdByName]
                            .filter(Boolean).join(' ').toLowerCase();
                return text.indexOf(search) !== -1;
            });
        }

        $('#tableCount').textContent = filtered.length;

        if (!filtered.length) {
            tbody.innerHTML = '<tr><td colspan="11"><div class="empty-state"><i class="fas fa-users"></i><h3>' +
                (search ? 'لا نتائج' : 'لا يوجد أفراد في الطاقم بعد') + '</h3><p>' +
                (search ? 'جرب كلمة بحث أخرى' : 'استخدم النموذج أعلاه لإضافة أول فرد') +
                '</p></div></td></tr>';
            return;
        }

        tbody.innerHTML = filtered.map(function(m, idx) {
            var fullName = ((m.firstName || '') + ' ' + (m.lastName || '')).trim();
            var initials = getInitials(m);
            return '<tr data-crew-id="' + escapeHtml(m.id) + '" style="animation-delay:' + (idx * 0.03) + 's;">' +
                '<td>' +
                    '<div class="crew-name-cell">' +
                        '<div class="crew-avatar">' + escapeHtml(initials) + '</div>' +
                        '<div class="crew-name-info">' +
                            '<div class="crew-name-full">' + escapeHtml(fullName || '—') + '</div>' +
                            (m.rank ? '<div class="crew-name-rank">' + escapeHtml(m.rank) + '</div>' : '') +
                        '</div>' +
                    '</div>' +
                '</td>' +
                '<td>' + (m.rank ? '<span class="badge badge-gold">' + escapeHtml(m.rank) + '</span>' : '<span class="badge badge-empty">—</span>') + '</td>' +
                '<td>' + (m.jobTitle ? '<span class="badge badge-blue">' + escapeHtml(m.jobTitle) + '</span>' : '<span class="badge badge-empty">—</span>') + '</td>' +
                '<td>' + (m.phone ? '<span class="badge badge-emerald"><i class="fas fa-phone" style="font-size:9px;"></i> ' + escapeHtml(m.phone) + '</span>' : '<span class="badge badge-empty">—</span>') + '</td>' +
                '<td>' + (m.cin ? escapeHtml(m.cin) : '<span class="badge badge-empty">—</span>') + '</td>' +
                '<td>' + (m.birthPlace ? escapeHtml(m.birthPlace) : '<span class="badge badge-empty">—</span>') + '</td>' +
                '<td>' + (m.hireDate ? escapeHtml(formatDate(m.hireDate)) : '<span class="badge badge-empty">—</span>') + '</td>' +
                '<td>' + (m.qualifications ? escapeHtml(m.qualifications) : '<span class="badge badge-empty">—</span>') + '</td>' +
                '<td>' + (m.familyStatus ? escapeHtml(m.familyStatus) : '<span class="badge badge-empty">—</span>') + '</td>' +
                '<td>' +
                    '<span class="badge badge-slate">' +
                        '<i class="fas fa-user-tie" style="font-size:9px;"></i> ' +
                        escapeHtml(m.createdByName || '—') +
                    '</span>' +
                '</td>' +
                '<td>' +
                    '<div class="action-btns">' +
                        '<button class="btn-sm-edit" data-edit-id="' + escapeHtml(m.id) + '" title="تعديل">' +
                            '<i class="fas fa-edit"></i>' +
                        '</button>' +
                        '<button class="btn-sm-delete" data-delete-id="' + escapeHtml(m.id) + '" title="حذف">' +
                            '<i class="fas fa-trash"></i>' +
                        '</button>' +
                    '</div>' +
                '</td>' +
            '</tr>';
        }).join('');

        tbody.querySelectorAll('[data-edit-id]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                editCrewMember(this.getAttribute('data-edit-id'));
            });
        });
        tbody.querySelectorAll('[data-delete-id]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                deleteCrewMember(this.getAttribute('data-delete-id'));
            });
        });
    };

    // ═══════════════════════════════════════════════════════════
    // ➕ Add
    // ═══════════════════════════════════════════════════════════
    window.addCrewMember = async function() {
        var firstName = ($('#fFirstName').value || '').trim();
        var lastName  = ($('#fLastName').value || '').trim();
        if (!firstName) { toast('الاسم مطلوب', 'error'); $('#fFirstName').focus(); return; }
        if (!lastName)  { toast('اللقب مطلوب', 'error'); $('#fLastName').focus(); return; }

        var data = {
            firstName: firstName,
            lastName: lastName,
            rank: ($('#fRank').value || '').trim(),
            jobTitle: ($('#fJobTitle').value || '').trim(),
            phone: ($('#fPhone').value || '').trim(),
            cin: ($('#fCin').value || '').trim(),
            birthPlace: ($('#fBirthPlace').value || '').trim(),
            hireDate: $('#fHireDate').value || null,
            qualifications: ($('#fQualifications').value || '').trim(),
            familyStatus: ($('#fFamilyStatus').value || '').trim(),
            notes: ($('#fNotes').value || '').trim()
        };

        var btn = $('#addBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>جاري الحفظ...</span>';

        try {
            var res = await fetch('/api/vessels/' + encodeURIComponent(vesselId) + '/crew', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + getToken(),
                    'X-CSRF-Token': getCsrf()
                },
                body: JSON.stringify(data)
            });
            var result = await res.json();
            if (!res.ok) throw new Error(result.error || 'فشل الحفظ');
            toast('تمت إضافة ' + firstName + ' ' + lastName, 'success');
            clearForm();
            loadCrew();
        } catch (e) {
            toast(e.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-plus"></i> <span>إضافة الفرد</span>';
        }
    };

    // ═══════════════════════════════════════════════════════════
    // ✏️ Edit
    // ═══════════════════════════════════════════════════════════
    window.editCrewMember = function(id) {
        var m = allCrew.find(function(x) { return x.id === id; });
        if (!m) { toast('الفرد غير موجود', 'error'); return; }

        editingId = id;

        $('#fFirstName').value = m.firstName || '';
        $('#fLastName').value = m.lastName || '';
        $('#fRank').value = m.rank || '';
        $('#fJobTitle').value = m.jobTitle || '';
        $('#fPhone').value = m.phone || '';
        $('#fCin').value = m.cin || '';
        $('#fBirthPlace').value = m.birthPlace || '';
        $('#fHireDate').value = m.hireDate ? String(m.hireDate).split('T')[0] : '';
        $('#fQualifications').value = m.qualifications || '';
        $('#fFamilyStatus').value = m.familyStatus || '';
        $('#fNotes').value = m.notes || '';

        $('#formTitle').textContent = 'تعديل: ' + ((m.firstName || '') + ' ' + (m.lastName || '')).trim();
        $('#formBody').classList.remove('collapsed');

        var toggleIcon = $('#formToggle i');
        var toggleLabel = $('#formToggle span');
        if (toggleIcon) toggleIcon.style.transform = 'rotate(0deg)';
        if (toggleLabel) toggleLabel.textContent = 'إخفاء';

        var btn = $('#addBtn');
        btn.innerHTML = '<i class="fas fa-sync-alt"></i> <span>تحديث الفرد</span>';
        btn.style.background = 'linear-gradient(135deg, var(--blue), #1d4ed8)';
        btn.onclick = updateCrewMember;

        $('#cancelBtn').style.display = 'inline-flex';

        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(function() { $('#fFirstName').focus(); }, 400);

        toast('وضع التعديل — حدّث البيانات ثم اضغط "تحديث الفرد"', 'info');
    };

    async function updateCrewMember() {
        if (!editingId) return;
        var firstName = ($('#fFirstName').value || '').trim();
        var lastName  = ($('#fLastName').value || '').trim();
        if (!firstName) { toast('الاسم مطلوب', 'error'); return; }
        if (!lastName)  { toast('اللقب مطلوب', 'error'); return; }

        var data = {
            firstName: firstName,
            lastName: lastName,
            rank: ($('#fRank').value || '').trim(),
            jobTitle: ($('#fJobTitle').value || '').trim(),
            phone: ($('#fPhone').value || '').trim(),
            cin: ($('#fCin').value || '').trim(),
            birthPlace: ($('#fBirthPlace').value || '').trim(),
            hireDate: $('#fHireDate').value || null,
            qualifications: ($('#fQualifications').value || '').trim(),
            familyStatus: ($('#fFamilyStatus').value || '').trim(),
            notes: ($('#fNotes').value || '').trim()
        };

        var btn = $('#addBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>جاري التحديث...</span>';

        try {
            var res = await fetch('/api/vessels/' + encodeURIComponent(vesselId) + '/crew/' + encodeURIComponent(editingId), {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + getToken(),
                    'X-CSRF-Token': getCsrf()
                },
                body: JSON.stringify(data)
            });
            var result = await res.json();
            if (!res.ok) throw new Error(result.error || 'فشل التحديث');
            toast('تم تحديث ' + firstName + ' ' + lastName, 'success');
            cancelEdit();
            loadCrew();
        } catch (e) {
            toast(e.message, 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sync-alt"></i> <span>تحديث الفرد</span>';
        }
    }

    window.cancelEdit = function() {
        editingId = null;
        clearForm();
        $('#formTitle').textContent = 'إضافة فرد جديد';
        var btn = $('#addBtn');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-plus"></i> <span>إضافة الفرد</span>';
        btn.style.background = '';
        btn.onclick = addCrewMember;
        $('#cancelBtn').style.display = 'none';
    };

    // ═══════════════════════════════════════════════════════════
    // 🗑️ Delete
    // ═══════════════════════════════════════════════════════════
    window.deleteCrewMember = async function(id) {
        var m = allCrew.find(function(x) { return x.id === id; });
        var name = m ? ((m.firstName || '') + ' ' + (m.lastName || '')).trim() : 'هذا الفرد';
        if (!confirm('هل تريد حذف "' + name + '" نهائياً؟')) return;
        try {
            var res = await fetch('/api/crew/' + encodeURIComponent(id), {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + getToken(),
                    'X-CSRF-Token': getCsrf()
                }
            });
            if (!res.ok) {
                var err = await res.json().catch(function(){return{};});
                throw new Error(err.error || 'فشل الحذف');
            }
            toast('تم الحذف', 'success');
            loadCrew();
        } catch (e) {
            toast(e.message, 'error');
        }
    };

    // ═══════════════════════════════════════════════════════════
    // 🧹 Form helpers
    // ═══════════════════════════════════════════════════════════
    window.clearForm = function() {
        ['fFirstName','fLastName','fRank','fJobTitle','fPhone',
         'fCin','fBirthPlace','fHireDate','fQualifications','fFamilyStatus','fNotes']
            .forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.value = '';
            });
        var fn = $('#fFirstName');
        if (fn) fn.focus();
    };

    window.toggleForm = function() {
        var form = $('#formBody');
        var btn = $('#formToggle');
        form.classList.toggle('collapsed');
        var icon = btn.querySelector('i');
        var label = btn.querySelector('span');
        if (form.classList.contains('collapsed')) {
            icon.style.transform = 'rotate(-90deg)';
            label.textContent = 'إظهار';
        } else {
            icon.style.transform = 'rotate(0deg)';
            label.textContent = 'إخفاء';
        }
    };

    // ═══════════════════════════════════════════════════════════
    // 🖨️ Print
    // ═══════════════════════════════════════════════════════════
    window.printCrew = function() {
        if (!allCrew.length) {
            toast('لا يوجد أفراد للطباعة', 'error');
            return;
        }

        var stats = [
            { value: allCrew.length, label: '👥 إجمالي أفراد الطاقم', type: 'gold' },
            {
                value: new Set(allCrew.filter(function(m){return m.rank;}).map(function(m){return m.rank;})).size,
                label: '🎖️ عدد الرتب',
                type: 'info'
            },
            {
                value: allCrew.filter(function(m){return m.phone;}).length,
                label: '📞 أرقام هواتف',
                type: 'success'
            },
            {
                value: allCrew.filter(function(m){
                    if (!m.createdAt) return false;
                    return (Date.now() - new Date(m.createdAt).getTime()) < 7*24*60*60*1000;
                }).length,
                label: '🆕 أضيفوا مؤخراً',
                type: 'warning'
            }
        ];

        var columns = [
            'الاسم واللقب', 'الرتبة', 'الخطة', 'الهاتف', 'البطاقة الوطنية',
            'مكان الولادة', 'تاريخ الانتداب', 'المؤهلات', 'الحالة العائلية', 'المسؤول'
        ];

        var rows = allCrew.map(function(m) {
            return [
                ((m.firstName || '') + ' ' + (m.lastName || '')).trim() || '—',
                m.rank || '—',
                m.jobTitle || '—',
                m.phone || '—',
                m.cin || '—',
                m.birthPlace || '—',
                m.hireDate ? formatDate(m.hireDate) : '—',
                m.qualifications || '—',
                m.familyStatus || '—',
                m.createdByName || '—'
            ];
        });

        var printData = {
            type: 'crew',
            title: 'طاقم الوسيلة — ' + vesselName,
            subtitle: 'Crew Registry',
            sectionTitle: 'قائمة أفراد الطاقم',
            stats: stats,
            columns: columns,
            rows: rows
        };

        try {
            localStorage.setItem('print_data', JSON.stringify(printData));
            window.open('/print.html?type=crew&key=print_data', '_blank');
            toast('جاري تحضير الطباعة...', 'info');
        } catch (e) {
            toast('❌ فشل تجهيز الطباعة: ' + e.message, 'error');
        }
    };

    // ═══════════════════════════════════════════════════════════
    // 🚀 Boot
    // ═══════════════════════════════════════════════════════════
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
            e.preventDefault();
            printCrew();
        }
        if (e.key === 'Escape' && editingId) {
            cancelEdit();
        }
    });
})();
</script>
</body>
</html>
