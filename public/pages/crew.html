<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طاقم الوسيلة — الأسطول البحري</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(180deg, #060911 0%, #0a1020 50%, #060911 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, rgba(18,26,44,0.95), rgba(24,34,56,0.9));
            border: 1px solid rgba(148,163,184,0.15);
            border-radius: 16px;
            padding: 20px 26px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .header-icon {
            width: 52px; height: 52px; border-radius: 14px;
            background: linear-gradient(135deg, #e6b31e, #b8860b);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #060911;
            box-shadow: 0 8px 24px rgba(230,179,30,0.35);
        }
        .header-text h1 {
            font-size: 20px; font-weight: 800;
            color: #f7d774; margin: 0 0 2px 0;
        }
        .header-text p {
            font-size: 12px; color: #94a3b8; margin: 0;
        }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 10px 20px; border: none; border-radius: 12px;
            font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
            display: inline-flex; align-items: center; gap: 8px;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f7d774, #e6b31e);
            color: #060911;
            box-shadow: 0 8px 24px rgba(230,179,30,0.35);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(230,179,30,0.5); }
        .btn-secondary {
            background: rgba(148,163,184,0.1);
            border: 1px solid rgba(148,163,184,0.2);
            color: #cbd5e1;
        }
        .btn-secondary:hover { background: rgba(148,163,184,0.2); }
        .btn-danger {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
            padding: 6px 12px; font-size: 12px;
        }
        .btn-danger:hover { background: rgba(239,68,68,0.3); }
        .btn-sm {
            width: 34px; height: 34px; padding: 0;
            justify-content: center;
        }

        .card {
            background: rgba(18,26,44,0.6);
            border: 1px solid rgba(148,163,184,0.1);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 14px; font-weight: 800;
            color: #cbd5e1; margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .card-title i { color: #e6b31e; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }
        .form-group { display: flex; flex-direction: column; }
        .form-group label {
            font-size: 11px; font-weight: 700;
            color: #94a3b8; margin-bottom: 6px;
        }
        .form-control {
            padding: 10px 14px;
            background: rgba(10,16,32,0.8);
            border: 1px solid rgba(148,163,184,0.15);
            border-radius: 10px;
            color: #f1f5f9;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #e6b31e;
            box-shadow: 0 0 0 3px rgba(230,179,30,0.35);
        }
        .form-control::placeholder { color: #64748b; }
        textarea.form-control { resize: vertical; min-height: 70px; }
        .form-actions {
            display: flex; gap: 10px; margin-top: 14px;
        }

        .crew-list { display: flex; flex-direction: column; gap: 10px; }
        .crew-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(148,163,184,0.08);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 12px;
            transition: all 0.3s;
        }
        .crew-item:hover {
            background: rgba(230,179,30,0.05);
            border-color: rgba(230,179,30,0.2);
        }
        .crew-info { flex: 1; min-width: 0; }
        .crew-name {
            font-size: 15px; font-weight: 800;
            color: #f1f5f9; margin-bottom: 6px;
        }
        .crew-meta {
            font-size: 12px; color: #94a3b8;
            line-height: 1.8;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
        }
        .crew-meta span { white-space: nowrap; }
        .crew-notes {
            font-size: 11px; color: #64748b;
            margin-top: 6px; padding-top: 6px;
            border-top: 1px dashed rgba(148,163,184,0.1);
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }
        .empty-state i {
            font-size: 60px; color: #e6b31e; opacity: 0.3;
            margin-bottom: 14px; display: block;
        }
        .empty-state p { font-size: 14px; font-weight: 600; }

        .loading-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(230,179,30,0.2);
            border-top-color: #e6b31e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed; bottom: 24px; left: 24px;
            padding: 14px 22px;
            border-radius: 12px;
            font-size: 13px; font-weight: 700;
            color: #fff;
            z-index: 9999;
            display: flex; align-items: center; gap: 10px;
            animation: slideIn 0.3s ease;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .toast.success { background: linear-gradient(135deg, #10b981, #059669); }
        .toast.error { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .toast.info { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .header { padding: 16px 18px; }
            .header-text h1 { font-size: 16px; }
            .card { padding: 16px 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="header-icon"><i class="fas fa-users"></i></div>
                <div class="header-text">
                    <h1>طاقم الوسيلة</h1>
                    <p id="vesselName">جاري التحميل...</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="window.close()">
                    <i class="fas fa-times"></i> إغلاق
                </button>
            </div>
        </div>

        <!-- Add form -->
        <div class="card">
            <div class="card-title">
                <i class="fas fa-user-plus"></i>
                إضافة فرد جديد
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>الاسم *</label>
                    <input type="text" id="fFirstName" class="form-control" placeholder="الاسم">
                </div>
                <div class="form-group">
                    <label>اللقب *</label>
                    <input type="text" id="fLastName" class="form-control" placeholder="اللقب">
                </div>
                <div class="form-group">
                    <label>الرتبة</label>
                    <input type="text" id="fRank" class="form-control" placeholder="الرتبة">
                </div>
                <div class="form-group">
                    <label>الخطة</label>
                    <input type="text" id="fJobTitle" class="form-control" placeholder="الخطة">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="fPhone" class="form-control" placeholder="الهاتف">
                </div>
                <div class="form-group">
                    <label>البطاقة الوطنية</label>
                    <input type="text" id="fCin" class="form-control" placeholder="رقم البطاقة">
                </div>
                <div class="form-group">
                    <label>مكان الولادة</label>
                    <input type="text" id="fBirthPlace" class="form-control" placeholder="مكان الولادة">
                </div>
                <div class="form-group">
                    <label>تاريخ الانتداب</label>
                    <input type="date" id="fHireDate" class="form-control">
                </div>
                <div class="form-group">
                    <label>المؤهلات</label>
                    <input type="text" id="fQualifications" class="form-control" placeholder="المؤهلات">
                </div>
                <div class="form-group">
                    <label>الحالة العائلية</label>
                    <input type="text" id="fFamilyStatus" class="form-control" placeholder="الحالة العائلية">
                </div>
            </div>
            <div class="form-group" style="margin-top: 10px;">
                <label>ملاحظات</label>
                <textarea id="fNotes" class="form-control" placeholder="ملاحظات إضافية..."></textarea>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="addBtn" onclick="addCrewMember()">
                    <i class="fas fa-plus"></i> إضافة الفرد
                </button>
                <button class="btn btn-secondary" onclick="clearForm()">
                    <i class="fas fa-eraser"></i> مسح
                </button>
            </div>
        </div>

        <!-- Crew list -->
        <div class="card">
            <div class="card-title">
                <i class="fas fa-list"></i>
                أفراد الطاقم <span id="crewCount" style="color:#e6b31e;">(0)</span>
            </div>
            <div id="crewList" class="crew-list">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>جاري التحميل...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // ============ Helpers ============
        function $(s) { return document.querySelector(s); }
        function getToken() {
            return localStorage.getItem('marine_token') ||
                   localStorage.getItem('token') ||
                   localStorage.getItem('authToken') ||
                   localStorage.getItem('accessToken') || '';
        }
        function getCsrf() {
            try {
                var m = document.cookie.match(/marine_csrf=([^;]+)/);
                return m ? decodeURIComponent(m[1]) : '';
            } catch(e) { return ''; }
        }
        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, function(m) {
                return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m];
            });
        }
        function toast(msg, type) {
            type = type || 'info';
            var t = document.createElement('div');
            t.className = 'toast ' + type;
            var icons = { success: '✅', error: '❌', info: 'ℹ️' };
            t.innerHTML = '<span>' + (icons[type] || 'ℹ️') + '</span><span>' + escapeHtml(msg) + '</span>';
            document.body.appendChild(t);
            setTimeout(function() { if (t.parentNode) t.remove(); }, 3000);
        }

        // ============ State ============
        var vesselId = null;
        var vesselName = '';

        // ============ Init ============
        function init() {
            var token = getToken();
            if (!token) {
                document.body.innerHTML = '<div style="text-align:center;padding:60px;color:#f87171;font-size:18px;">⚠️ يجب تسجيل الدخول أولاً</div>';
                return;
            }

            var params = new URLSearchParams(window.location.search);
            vesselId = params.get('id');
            if (!vesselId) {
                document.body.innerHTML = '<div style="text-align:center;padding:60px;color:#f87171;font-size:18px;">⚠️ لم يتم تحديد المركب</div>';
                return;
            }

            loadVesselInfo();
            loadCrew();
        }

        async function loadVesselInfo() {
            try {
                var res = await fetch('/api/vessels', {
                    headers: { 'Authorization': 'Bearer ' + getToken() }
                });
                var vessels = await res.json();
                var v = vessels.find(function(x) {
                    return String(x._id || x.id) === String(vesselId);
                });
                if (v) {
                    vesselName = v.name || v.num || 'مركب';
                    $('#vesselName').textContent = vesselName + (v.num ? ' • رقم: ' + v.num : '');
                    document.title = 'طاقم: ' + vesselName;
                } else {
                    $('#vesselName').textContent = 'المركب غير موجود';
                }
            } catch (e) {
                $('#vesselName').textContent = 'خطأ في تحميل بيانات المركب';
            }
        }

        async function loadCrew() {
            var listEl = $('#crewList');
            listEl.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>جاري التحميل...</p></div>';
            try {
                var res = await fetch('/api/vessels/' + encodeURIComponent(vesselId) + '/crew', {
                    headers: { 'Authorization': 'Bearer ' + getToken() }
                });
                var data = await res.json();
                var crew = (data && data.crew) || [];
                $('#crewCount').textContent = '(' + crew.length + ')';
                if (!crew.length) {
                    listEl.innerHTML =
                        '<div class="empty-state">' +
                            '<i class="fas fa-users"></i>' +
                            '<p>لا يوجد أفراد في الطاقم بعد</p>' +
                        '</div>';
                    return;
                }
                listEl.innerHTML = crew.map(renderCrewItem).join('');
            } catch (e) {
                listEl.innerHTML = '<div class="empty-state"><p style="color:#f87171;">❌ فشل تحميل الطاقم</p></div>';
            }
        }

        function renderCrewItem(m) {
            var fullName = ((m.firstName || m.name || '') + ' ' + (m.lastName || '')).trim();
            var hireDateStr = m.hireDate ? new Date(m.hireDate).toLocaleDateString('ar-TN') : '';
            var metaParts = [];
            if (m.rank) metaParts.push('🎖️ ' + escapeHtml(m.rank));
            if (m.jobTitle) metaParts.push('💼 ' + escapeHtml(m.jobTitle));
            if (m.phone) metaParts.push('📞 ' + escapeHtml(m.phone));
            if (m.birthPlace) metaParts.push('📍 ' + escapeHtml(m.birthPlace));
            if (m.familyStatus) metaParts.push('👨‍👩‍👧 ' + escapeHtml(m.familyStatus));
            if (m.qualifications) metaParts.push('🎓 ' + escapeHtml(m.qualifications));
            if (hireDateStr) metaParts.push('📅 ' + escapeHtml(hireDateStr));

            return '<div class="crew-item">' +
                '<div class="crew-info">' +
                    '<div class="crew-name">' + escapeHtml(fullName) + '</div>' +
                    '<div class="crew-meta">' +
                        metaParts.map(function(p) { return '<span>' + p + '</span>'; }).join('') +
                    '</div>' +
                    (m.notes ? '<div class="crew-notes">📝 ' + escapeHtml(m.notes) + '</div>' : '') +
                '</div>' +
                '<button class="btn btn-danger" onclick="deleteCrewMember(\'' + escapeHtml(m.id) + '\')" title="حذف">' +
                    '<i class="fas fa-trash"></i>' +
                '</button>' +
            '</div>';
        }

        // ============ Add ============
        window.addCrewMember = async function() {
            var firstName = ($('#fFirstName').value || '').trim();
            var lastName  = ($('#fLastName').value || '').trim();
            if (!firstName) { toast('الاسم مطلوب', 'error'); $('#fFirstName').focus(); return; }
            if (!lastName)  { toast('اللقب مطلوب', 'error'); $('#fLastName').focus(); return; }

            var data = {
                firstName: firstName,
                lastName: lastName,
                rank: ($('#fRank').value || '').trim(),
                jobTitle: ($('#fJobTitle').value || '').trim(),
                phone: ($('#fPhone').value || '').trim(),
                cin: ($('#fCin').value || '').trim(),
                birthPlace: ($('#fBirthPlace').value || '').trim(),
                hireDate: $('#fHireDate').value || null,
                qualifications: ($('#fQualifications').value || '').trim(),
                familyStatus: ($('#fFamilyStatus').value || '').trim(),
                notes: ($('#fNotes').value || '').trim()
            };

            var btn = $('#addBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

            try {
                var res = await fetch('/api/vessels/' + encodeURIComponent(vesselId) + '/crew', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + getToken(),
                        'X-CSRF-Token': getCsrf()
                    },
                    body: JSON.stringify(data)
                });
                var result = await res.json();
                if (!res.ok || !result.success) {
                    throw new Error(result.error || 'فشل الحفظ');
                }
                toast('تمت إضافة الفرد بنجاح', 'success');
                clearForm();
                loadCrew();
            } catch (e) {
                toast(e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-plus"></i> إضافة الفرد';
            }
        };

        window.clearForm = function() {
            ['fFirstName','fLastName','fRank','fJobTitle','fPhone',
             'fCin','fBirthPlace','fHireDate','fQualifications','fFamilyStatus','fNotes']
                .forEach(function(id) {
                    var el = document.getElementById(id);
                    if (el) el.value = '';
                });
        };

        // ============ Delete ============
        window.deleteCrewMember = async function(id) {
            if (!confirm('هل تريد حذف هذا الفرد نهائياً؟')) return;
            try {
                var res = await fetch('/api/crew/' + encodeURIComponent(id), {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + getToken(),
                        'X-CSRF-Token': getCsrf()
                    }
                });
                if (!res.ok) throw new Error('فشل الحذف');
                toast('تم حذف الفرد', 'success');
                loadCrew();
            } catch (e) {
                toast(e.message, 'error');
            }
        };

        // ============ Boot ============
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
