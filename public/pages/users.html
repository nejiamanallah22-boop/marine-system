<div id="page-users">
    <style>
        /* ============================================================
           👥 USERS PAGE STYLES

    <!-- ============================================================
    📦 JAVASCRIPT - USERS PAGE
    ============================================================ -->
    <script>
    // ============================================================
    // 👥 USERS PAGE - v1.0
    // ============================================================

    // ✅ استخدام المتغيرات العامة
    var usersData = window.allUsers || [];
    var currentUser = window.currentUser || null;

    console.log('👥 Users page loaded');
    console.log('👤 Current user:', currentUser?.name || 'Unknown');
    console.log('👥 Users data:', usersData.length);

    // ============================================================
    // 1. HELPERS
    // ============================================================

    function getToken() {
        var token = localStorage.getItem('token');
        if (!token) {
            console.warn('⚠️ No token found');
            return null;
        }
        return token;
    }

    function showToast(message, type) {
        type = type || 'info';
        var container = document.getElementById('toastContainer');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'toast-container';
            document.body.appendChild(container);
        }

        var toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.innerHTML = '<span class="toast-icon">' + (type === 'success' ? '✅' : type === 'warning' ? '⚠️' : type === 'danger' ? '❌' : 'ℹ️') + '</span> <span>' + message + '</span> <button class="toast-close" onclick="this.parentElement.remove()">✕</button>';
        container.appendChild(toast);

        setTimeout(function() {
            if (toast.parentElement) toast.remove();
        }, 5000);
    }

    // ============================================================
    // 2. LOAD DATA
    // ============================================================

    async function loadUsersData() {
        console.log('🔄 [USERS] Loading users data...');
        
        try {
            var token = getToken();
            if (!token) {
                document.getElementById('usersTableContainer').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>يرجى تسجيل الدخول أولاً</p></div>';
                return;
            }

            var response = await fetch('/api/users', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                var data = await response.json();
                usersData = data.users || data || [];
                window.allUsers = usersData;
                console.log('✅ [USERS] Users loaded:', usersData.length);
                renderUsers(usersData);
                updateStats(usersData);
                updateBadge('usersBadge', usersData.length);
            } else {
                console.error('❌ [USERS] API error:', response.status);
                document.getElementById('usersTableContainer').innerHTML = '<div class="empty-state"><div class="icon">❌</div><p>فشل تحميل البيانات</p></div>';
            }
        } catch (error) {
            console.error('❌ [USERS] Load error:', error);
            showToast('❌ فشل تحميل المستخدمين', 'danger');
        }
    }

    // ============================================================
    // 3. RENDER FUNCTIONS
    // ============================================================

    function updateStats(users) {
        var total = users.length;
        var active = users.filter(function(u) { return u.isActive !== false; }).length;
        var inactive = users.filter(function(u) { return u.isActive === false; }).length;
        var admins = users.filter(function(u) { return u.role === 'admin'; }).length;

        document.getElementById('totalUsers').textContent = total;
        document.getElementById('activeUsers').textContent = active;
        document.getElementById('inactiveUsers').textContent = inactive;
        document.getElementById('adminUsers').textContent = admins;
    }

    function renderUsers(users) {
        var container = document.getElementById('usersTableContainer');
        
        if (!users || users.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>لا توجد مستخدمين</p></div>';
            return;
        }

        var html = '<div class="table-container"><table class="users-table"><thead><tr>';
        html += '<th>👤 المستخدم</th>';
        html += '<th>📧 البريد الإلكتروني</th>';
        html += '<th>👔 الدور</th>';
        html += '<th>📊 الحالة</th>';
        html += '<th>📅 آخر تسجيل دخول</th>';
        html += '<th>⚙️ الإجراءات</th>';
        html += '</tr></thead><tbody>';

        users.forEach(function(u) {
            var roleMap = {
                'admin': '<span class="role-badge admin">مسؤول</span>',
                'manager': '<span class="role-badge manager">مدير</span>',
                'operator': '<span class="role-badge operator">مشغل</span>',
                'viewer': '<span class="role-badge viewer">مشاهد</span>'
            };

            var statusMap = {
                true: '<span class="status-badge active">✅ نشط</span>',
                false: '<span class="status-badge inactive">❌ غير نشط</span>'
            };

            var isActive = u.isActive !== false;
            var lastLogin = u.lastLogin ? new Date(u.lastLogin).toLocaleDateString('ar-TN') : '-';

            html += '<tr>';
            html += '<td><strong>' + (u.name || u.username || '-') + '</strong></td>';
            html += '<td>' + (u.email || '-') + '</td>';
            html += '<td>' + (roleMap[u.role] || u.role || '-') + '</td>';
            html += '<td>' + (statusMap[isActive] || '-') + '</td>';
            html += '<td>' + lastLogin + '</td>';
            html += '<td>';
            html += '<button class="btn-sm btn-edit edit-btn" data-id="' + (u._id || u.id) + '">✏️</button> ';
            html += '<button class="btn-sm btn-toggle toggle-btn" data-id="' + (u._id || u.id) + '" data-status="' + isActive + '">' + (isActive ? '🔒' : '🔓') + '</button> ';
            html += '<button class="btn-sm btn-delete delete-btn" data-id="' + (u._id || u.id) + '">🗑️</button>';
            html += '</td>';
            html += '</tr>';
        });

        html += '</tbody></table></div>';
        container.innerHTML = html;

        // ربط الأحداث
        container.querySelectorAll('.edit-btn').forEach(function(btn) {
            btn.onclick = function() { editUser(this.dataset.id); };
        });
        container.querySelectorAll('.toggle-btn').forEach(function(btn) {
            btn.onclick = function() { toggleUserStatus(this.dataset.id, this.dataset.status === 'true'); };
        });
        container.querySelectorAll('.delete-btn').forEach(function(btn) {
            btn.onclick = function() { deleteUser(this.dataset.id); };
        });
    }

    // ============================================================
    // 4. CRUD OPERATIONS
    // ============================================================

    function toggleUserForm() {
        var form = document.getElementById('userForm');
        var isActive = form.classList.contains('active');
        
        if (isActive) {
            form.classList.remove('active');
            document.getElementById('formTitle').textContent = '➕ إضافة مستخدم جديد';
            document.getElementById('userId').value = '';
            document.getElementById('userUsername').value = '';
            document.getElementById('userEmail').value = '';
            document.getElementById('userPassword').value = '';
            document.getElementById('userRole').value = 'viewer';
            document.getElementById('userStatus').value = 'active';
            document.getElementById('passwordRequired').textContent = '*';
        } else {
            form.classList.add('active');
        }
    }

    function editUser(id) {
        var user = usersData.find(function(u) { return (u._id || u.id) == id; });
        if (!user) {
            showToast('⚠️ المستخدم غير موجود', 'warning');
            return;
        }

        document.getElementById('formTitle').textContent = '✏️ تعديل مستخدم';
        document.getElementById('userId').value = user._id || user.id;
        document.getElementById('userUsername').value = user.username || '';
        document.getElementById('userEmail').value = user.email || '';
        document.getElementById('userPassword').value = '';
        document.getElementById('userRole').value = user.role || 'viewer';
        document.getElementById('userStatus').value = user.isActive !== false ? 'active' : 'inactive';
        document.getElementById('passwordRequired').textContent = '(اتركها فارغة لتعديل)';

        var form = document.getElementById('userForm');
        form.classList.add('active');
    }

    async function saveUser() {
        var id = document.getElementById('userId').value;
        var username = document.getElementById('userUsername').value.trim();
        var email = document.getElementById('userEmail').value.trim();
        var password = document.getElementById('userPassword').value;
        var role = document.getElementById('userRole').value;
        var status = document.getElementById('userStatus').value;

        if (!username) { showToast('⚠️ الرجاء إدخال اسم المستخدم', 'warning'); return; }
        if (!email) { showToast('⚠️ الرجاء إدخال البريد الإلكتروني', 'warning'); return; }
        if (!id && !password) { showToast('⚠️ الرجاء إدخال كلمة المرور', 'warning'); return; }

        var token = getToken();
        if (!token) return;

        var data = {
            username: username,
            email: email,
            role: role,
            isActive: status === 'active'
        };

        if (password) {
            data.password = password;
        }

        try {
            var url = id ? '/api/users/' + id : '/api/users';
            var method = id ? 'PUT' : 'POST';

            var response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                var error = await response.json();
                throw new Error(error.error || 'فشل الحفظ');
            }

            showToast('✅ ' + (id ? 'تم تحديث' : 'تم إضافة') + ' المستخدم بنجاح', 'success');
            toggleUserForm();
            await loadUsersData();
        } catch (error) {
            console.error('❌ Save user error:', error);
            showToast('❌ ' + error.message, 'danger');
        }
    }

    async function toggleUserStatus(id, currentStatus) {
        var action = currentStatus ? 'تعطيل' : 'تفعيل';
        if (!confirm('⚠️ هل أنت متأكد من ' + action + ' هذا المستخدم؟')) return;

        var token = getToken();
        if (!token) return;

        try {
            var response = await fetch('/api/users/' + id, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ isActive: !currentStatus })
            });

            if (!response.ok) {
                var error = await response.json();
                throw new Error(error.error || 'فشل التغيير');
            }

            showToast('✅ تم ' + action + ' المستخدم بنجاح', 'success');
            await loadUsersData();
        } catch (error) {
            console.error('❌ Toggle user error:', error);
            showToast('❌ ' + error.message, 'danger');
        }
    }

    async function deleteUser(id) {
        if (!confirm('⚠️ هل أنت متأكد من حذف هذا المستخدم؟')) return;

        var token = getToken();
        if (!token) return;

        try {
            var response = await fetch('/api/users/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (!response.ok) {
                var error = await response.json();
                throw new Error(error.error || 'فشل الحذف');
            }

            showToast('✅ تم حذف المستخدم', 'success');
            await loadUsersData();
        } catch (error) {
            console.error('❌ Delete user error:', error);
            showToast('❌ ' + error.message, 'danger');
        }
    }

    // ============================================================
    // 5. INIT
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
        console.log('👥 Users page loading...');

        // ربط الأزرار
        document.getElementById('addUserBtn').onclick = toggleUserForm;
        document.getElementById('refreshUsersBtn').onclick = loadUsersData;
        document.getElementById('formCloseBtn').onclick = toggleUserForm;
        document.getElementById('cancelUserBtn').onclick = toggleUserForm;
        document.getElementById('saveUserBtn').onclick = saveUser;

        // تحميل البيانات
        setTimeout(loadUsersData, 200);
        setTimeout(loadUsersData, 800);
    });

    // ============================================================
    // 6. EXPOSE GLOBALS
    // ============================================================

    window.loadUsersData = loadUsersData;
    window.renderUsers = renderUsers;
    window.updateStats = updateStats;
    window.toggleUserForm = toggleUserForm;
    window.saveUser = saveUser;
    window.editUser = editUser;
    window.toggleUserStatus = toggleUserStatus;
    window.deleteUser = deleteUser;

    console.log('✅ Users page script loaded');
    </script>
</div>
