<div id="page-users">
    <style>
        /* ===== STYLES ===== */
        .users-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .users-header h2 { margin: 0; color: white; font-size: 22px; }
        .users-header p { margin: 0; color: rgba(255,255,255,0.4); font-size: 13px; }
        
        .users-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px 16px;
            text-align: center;
        }
        .stat-card .number { font-size: 22px; font-weight: 700; color: #60a5fa; }
        .stat-card .label { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 4px; }
        .stat-card .number.green { color: #4ade80; }
        .stat-card .number.red { color: #f87171; }
        .stat-card .number.gold { color: #f5d76e; }
        
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        .input-grid input, .input-grid select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.04);
            color: #e2e8f0;
            font-size: 0.85rem;
            font-family: inherit;
            width: 100%;
        }
        .input-grid input:focus, .input-grid select:focus {
            border-color: #e6b31e;
            outline: none;
            box-shadow: 0 0 0 3px rgba(230,179,30,0.06);
        }
        .input-grid input::placeholder {
            color: rgba(255,255,255,0.15);
        }
        .input-grid select option {
            background: #0a1628;
            color: #e2e8f0;
        }
        
        .btn-save {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            background: linear-gradient(135deg, #e6b31e, #f5d76e);
            color: #0a1628;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,179,30,0.3);
        }
        
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            margin-top: 10px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
        thead {
            background: rgba(15,52,96,0.3);
            border-bottom: 2px solid rgba(230,179,30,0.08);
        }
        thead th {
            padding: 10px 8px;
            text-align: right;
            font-weight: 600;
            font-size: 0.6rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        thead th i { margin-left: 4px; color: #e6b31e; }
        tbody td {
            padding: 8px 6px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.6);
        }
        tbody tr:hover { background: rgba(255,255,255,0.02); }
        
        .status-badge {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.active { background: rgba(74,222,128,0.15); color: #4ade80; }
        .status-badge.inactive { background: rgba(248,113,113,0.15); color: #f87171; }
        
        .btn-sm {
            padding: 3px 10px;
            border: none;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn-sm.edit { background: rgba(245,200,66,0.12); color: #f5c842; }
        .btn-sm.edit:hover { background: #f5c842; color: #0a1628; }
        .btn-sm.delete { background: rgba(225,112,85,0.12); color: #e17055; }
        .btn-sm.delete:hover { background: #e17055; color: #fff; }
        .btn-sm.toggle { background: rgba(59,130,246,0.12); color: #60a5fa; }
        .btn-sm.toggle:hover { background: #60a5fa; color: #0a1628; }
        .btn-sm + .btn-sm { margin-right: 4px; }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.15);
        }
        .empty-state i { font-size: 2.5rem; display: block; margin-bottom: 10px; color: rgba(255,255,255,0.05); }
        .empty-state h3 { font-size: 0.9rem; font-weight: 600; color: rgba(255,255,255,0.2); }
        .empty-state p { font-size: 0.75rem; }
        
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-overlay .modal-content {
            background: #111e3a;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            padding: 24px;
            animation: modalFade 0.3s ease;
        }
        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-overlay .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .modal-overlay .modal-header h3 { color: #fff; font-size: 18px; font-weight: 700; margin: 0; }
        .modal-overlay .modal-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.2);
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .modal-overlay .modal-close:hover { background: rgba(255,255,255,0.04); color: #fff; }
        .modal-overlay .form-group { margin-bottom: 12px; }
        .modal-overlay .form-group label {
            display: block;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .modal-overlay .form-group input, .modal-overlay .form-group select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.04);
            color: #e2e8f0;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .modal-overlay .form-group input:focus, .modal-overlay .form-group select:focus {
            border-color: #e6b31e;
            outline: none;
            box-shadow: 0 0 0 3px rgba(230,179,30,0.06);
        }
        .modal-overlay .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .modal-overlay .modal-footer .btn-submit {
            flex: 1;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .modal-overlay .modal-footer .btn-submit.primary {
            background: linear-gradient(135deg, #e6b31e, #f5d76e);
            color: #0a1628;
        }
        .modal-overlay .modal-footer .btn-submit.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,179,30,0.3);
        }
        .modal-overlay .modal-footer .btn-submit.secondary {
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .modal-overlay .modal-footer .btn-submit.secondary:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        
        @media (max-width: 768px) {
            .users-header { flex-direction: column; align-items: flex-start; }
            .users-stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .input-grid { grid-template-columns: 1fr 1fr; padding: 12px 14px; gap: 8px; }
            .input-grid .btn-save { grid-column: span 2; }
            .table-wrapper table { font-size: 0.7rem; min-width: 600px; }
            thead th, tbody td { padding: 6px 4px; }
        }
        @media (max-width: 480px) {
            .users-stats { grid-template-columns: 1fr 1fr; gap: 6px; }
            .stat-card { padding: 10px 12px; }
            .stat-card .number { font-size: 18px; }
            .input-grid { grid-template-columns: 1fr; }
            .input-grid .btn-save { grid-column: span 1; }
            .modal-overlay .modal-content { padding: 16px; margin: 10px; }
        }
    </style>

<script>
// ============================================================
// 👥 USERS PAGE - FIXED (No duplicate variables)
// ============================================================

// ============================================================
// 1. TOKEN FUNCTIONS (موحدة)
// ============================================================

function getToken() {
    return localStorage.getItem('marine_token') ||
           localStorage.getItem('token') ||
           localStorage.getItem('authToken') ||
           localStorage.getItem('accessToken') ||
           null;
}

function getAuthHeaders() {
    const token = getToken();
    return {
        'Content-Type': 'application/json',
        'Authorization': token ? 'Bearer ' + token : ''
    };
}

function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer') || document.body;
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    
    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${message}`;
    container.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(30px)';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// ============================================================
// 2. متغيرات - استخدم var لتجنب التكرار
// ============================================================

if (typeof window._usersLoaded === 'undefined') {
    window._usersLoaded = false;
}

var usersData = [];
var currentEditId = null;

// ============================================================
// 3. تحميل المستخدمين
// ============================================================

async function loadUsers() {
    console.log('👥 تحميل المستخدمين...');
    
    const token = getToken();
    if (!token) {
        console.warn('⚠️ لا يوجد توكن');
        return [];
    }
    
    try {
        const response = await fetch('/api/users', {
            headers: getAuthHeaders()
        });
        
        if (!response.ok) {
            if (response.status === 401) {
                localStorage.removeItem('marine_token');
                localStorage.removeItem('token');
                window.location.href = '/index.html';
            }
            throw new Error('فشل تحميل المستخدمين');
        }
        
        const data = await response.json();
        usersData = data.users || data || [];
        console.log('✅ تم تحميل المستخدمين:', usersData.length);
        return usersData;
    } catch (error) {
        console.error('❌ خطأ في تحميل المستخدمين:', error);
        return [];
    }
}

// ============================================================
// 4. عرض المستخدمين
// ============================================================

async function renderUsers() {
    const tbody = document.getElementById('usersBody');
    tbody.innerHTML = `
        <tr>
            <td colspan="6" class="empty-state">
                <i class="fas fa-spinner fa-pulse"></i>
                <h3>جاري تحميل المستخدمين...</h3>
                <p>يرجى الانتظار</p>
            </td>
        </tr>
    `;
    
    try {
        const users = await loadUsers();
        
        // ✅ تحديث الإحصائيات
        const total = users.length;
        const active = users.filter(u => u.isActive !== false).length;
        const inactive = users.filter(u => u.isActive === false).length;
        const admins = users.filter(u => u.role === 'admin').length;
        
        document.getElementById('totalUsers').textContent = total;
        document.getElementById('activeUsers').textContent = active;
        document.getElementById('inactiveUsers').textContent = inactive;
        document.getElementById('adminUsers').textContent = admins;
        
        if (users.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="empty-state">
                        <i class="fas fa-users"></i>
                        <h3>لا يوجد مستخدمين</h3>
                        <p>قم بإضافة مستخدم جديد</p>
                    </td>
                </tr>
            `;
            return;
        }
        
        let html = '';
        users.forEach(u => {
            const isActive = u.isActive !== false;
            const statusClass = isActive ? 'active' : 'inactive';
            const statusText = isActive ? '🟢 نشط' : '🔴 غير نشط';
            const roleLabels = {
                'admin': '👑 مسؤول',
                'manager': '📋 مدير',
                'operator': '🔧 مشغل',
                'viewer': '👀 مشاهد'
            };
            
            html += `
                <tr>
                    <td><strong style="color:#fff;">${u.name || u.username || 'مجهول'}</strong></td>
                    <td>${u.username || '-'}</td>
                    <td>${u.email || '-'}</td>
                    <td>${roleLabels[u.role] || u.role || 'مشاهد'}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>
                        <button class="btn-sm edit" onclick="openEditModal('${u.id || u._id}')">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-sm toggle" onclick="toggleUser('${u.id || u._id}', ${!isActive})">
                            <i class="fas ${isActive ? 'fa-pause' : 'fa-play'}"></i>
                        </button>
                        <button class="btn-sm delete" onclick="deleteUser('${u.id || u._id}')">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
        
    } catch (error) {
        console.error('❌ خطأ في renderUsers:', error);
        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="empty-state" style="color:#f87171;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3 style="color:#f87171;">خطأ في تحميل البيانات</h3>
                    <p>${error.message}</p>
                    <button onclick="renderUsers()" style="margin-top:8px;padding:4px 16px;background:rgba(248,113,113,0.15);border:1px solid rgba(248,113,113,0.1);border-radius:4px;color:#f87171;cursor:pointer;">
                        <i class="fas fa-sync-alt"></i> إعادة المحاولة
                    </button>
                </td>
            </tr>
        `;
    }
}

// ============================================================
// 5. إضافة مستخدم
// ============================================================

async function addUser() {
    const name = document.getElementById('iName').value.trim();
    const username = document.getElementById('iUsername').value.trim();
    const email = document.getElementById('iEmail').value.trim();
    const password = document.getElementById('iPassword').value.trim();
    const role = document.getElementById('iRole').value;
    
    if (!name || !username || !email || !password) {
        showToast('⚠️ يرجى ملء جميع الحقول', 'warning');
        return;
    }
    
    const token = getToken();
    if (!token) {
        showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
        return;
    }
    
    try {
        const response = await fetch('/api/users', {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ name, username, email, password, role })
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'فشل إضافة المستخدم');
        }
        
        document.getElementById('iName').value = '';
        document.getElementById('iUsername').value = '';
        document.getElementById('iEmail').value = '';
        document.getElementById('iPassword').value = '';
        
        await renderUsers();
        showToast('✅ تم إضافة المستخدم بنجاح', 'success');
    } catch (error) {
        showToast('❌ ' + error.message, 'error');
    }
}

// ============================================================
// 6. فتح مودال التعديل
// ============================================================

function openEditModal(id) {
    const user = usersData.find(u => (u.id || u._id) === id);
    if (!user) {
        showToast('❌ المستخدم غير موجود', 'error');
        return;
    }
    
    currentEditId = id;
    document.getElementById('modalTitle').textContent = '✏️ تعديل المستخدم';
    document.getElementById('mName').value = user.name || '';
    document.getElementById('mUsername').value = user.username || '';
    document.getElementById('mEmail').value = user.email || '';
    document.getElementById('mRole').value = user.role || 'viewer';
    document.getElementById('mPassword').value = '';
    
    document.getElementById('userModal').classList.add('active');
}

function closeUserModal() {
    document.getElementById('userModal').classList.remove('active');
    currentEditId = null;
}

// ============================================================
// 7. تحديث مستخدم
// ============================================================

async function updateUser() {
    const name = document.getElementById('mName').value.trim();
    const username = document.getElementById('mUsername').value.trim();
    const email = document.getElementById('mEmail').value.trim();
    const role = document.getElementById('mRole').value;
    const password = document.getElementById('mPassword').value.trim();
    
    if (!name || !username || !email) {
        showToast('⚠️ يرجى ملء جميع الحقول', 'warning');
        return;
    }
    
    const token = getToken();
    if (!token) {
        showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
        return;
    }
    
    const data = { name, username, email, role };
    if (password) data.password = password;
    
    try {
        const response = await fetch(`/api/users/${currentEditId}`, {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify(data)
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'فشل تحديث المستخدم');
        }
        
        closeUserModal();
        await renderUsers();
        showToast('✅ تم تحديث المستخدم بنجاح', 'success');
    } catch (error) {
        showToast('❌ ' + error.message, 'error');
    }
}

// ============================================================
// 8. تبديل حالة المستخدم
// ============================================================

async function toggleUser(id, enable) {
    const user = usersData.find(u => (u.id || u._id) === id);
    if (!user) {
        showToast('❌ المستخدم غير موجود', 'error');
        return;
    }
    
    const action = enable ? 'تفعيل' : 'تعطيل';
    if (!confirm(`⚠️ هل أنت متأكد من ${action} المستخدم "${user.name || user.username}"؟`)) return;
    
    const token = getToken();
    if (!token) {
        showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
        return;
    }
    
    try {
        const response = await fetch(`/api/users/${id}`, {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify({ ...user, isActive: enable })
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || `فشل ${action} المستخدم`);
        }
        
        await renderUsers();
        showToast(`✅ تم ${action} المستخدم بنجاح`, 'success');
    } catch (error) {
        showToast('❌ ' + error.message, 'error');
    }
}

// ============================================================
// 9. حذف مستخدم
// ============================================================

async function deleteUser(id) {
    const user = usersData.find(u => (u.id || u._id) === id);
    if (!user) {
        showToast('❌ المستخدم غير موجود', 'error');
        return;
    }
    
    if (user.role === 'admin' && user.username === 'admin') {
        showToast('⚠️ لا يمكن حذف المستخدم admin الرئيسي', 'warning');
        return;
    }
    
    if (!confirm(`⚠️ هل أنت متأكد من حذف المستخدم "${user.name || user.username}"؟ هذا الإجراء لا يمكن التراجع عنه.`)) return;
    
    const token = getToken();
    if (!token) {
        showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
        return;
    }
    
    try {
        const response = await fetch(`/api/users/${id}`, {
            method: 'DELETE',
            headers: getAuthHeaders()
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'فشل حذف المستخدم');
        }
        
        await renderUsers();
        showToast('✅ تم حذف المستخدم بنجاح', 'success');
    } catch (error) {
        showToast('❌ ' + error.message, 'error');
    }
}

// ============================================================
// 10. تحديث الصفحة
// ============================================================

function refreshUsers() {
    renderUsers();
    showToast('🔄 تم تحديث قائمة المستخدمين', 'info');
}

// ============================================================
// 11. إغلاق المودال بالنقر خارجها
// ============================================================

document.getElementById('userModal').addEventListener('click', function(e) {
    if (e.target === this) closeUserModal();
});

// ============================================================
// 12. التهيئة
// ============================================================

document.addEventListener('DOMContentLoaded', async function() {
    console.log('👥 تحميل صفحة المستخدمين...');
    await renderUsers();
    console.log('✅ صفحة المستخدمين جاهزة');
});

// ============================================================
// 13. ربط الدوال العالمية
// ============================================================

window.renderUsers = renderUsers;
window.refreshUsers = refreshUsers;
window.addUser = addUser;
window.openEditModal = openEditModal;
window.closeUserModal = closeUserModal;
window.updateUser = updateUser;
window.toggleUser = toggleUser;
window.deleteUser = deleteUser;
window.getToken = getToken;
window.getAuthHeaders = getAuthHeaders;

console.log('✅ صفحة المستخدمين v2.0 جاهزة');
</script>
