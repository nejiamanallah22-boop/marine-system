    <script>
    (function() {
        'use strict';

        // ============================================================
        // ✅ v9.5: CLEANUP STATE
        // ============================================================

        var _isDestroyed = false;
        var _pageIntervals = [];
        var _pageTimeouts = [];
        var _eventListeners = [];

        function _usersCleanup() {
            if (_isDestroyed) return;
            _isDestroyed = true;

            _pageIntervals.forEach(function(id) {
                try { clearInterval(id); } catch (e) {}
            });
            _pageIntervals = [];

            _pageTimeouts.forEach(function(id) {
                try { clearTimeout(id); } catch (e) {}
            });
            _pageTimeouts = [];

            _eventListeners.forEach(function(item) {
                try {
                    if (item.el && item.fn) {
                        item.el.removeEventListener(item.type, item.fn);
                    }
                } catch (e) {}
            });
            _eventListeners = [];

            try {
                delete window.usersData;
                delete window.loadUsersData;
                delete window.renderUsers;
                delete window.updateStats;
                delete window.toggleUserForm;
                delete window.saveUser;
                delete window.editUser;
                delete window.toggleUserStatus;
                delete window.deleteUser;
                delete window.cleanupUsersPage;
            } catch (e) {}

            console.log('🧹 Users cleanup done');
        }

        window._pageCleanup = window._pageCleanup || [];
        window._pageCleanup.push(_usersCleanup);

        window.addEventListener('beforeunload', _usersCleanup);
        window.addEventListener('pagehide', _usersCleanup);

        // ============================================================
        // 📦 CONFIG
        // ============================================================

        var PAGE_ID = 'page-users';
        var API_BASE = '/api/users';
        var REQUEST_TIMEOUT = 15000;

        var usersData = [];
        var isLoading = false;
        var isSaving = false;
        var currentAbortController = null;

        // ============================================================
        // 🔧 DOM HELPERS
        // ============================================================

        function $(id) {
            return document.getElementById(id);
        }

        function pageExists() {
            return !!$(PAGE_ID) && !_isDestroyed;
        }

        function addSafeListener(el, type, fn, options) {
            if (!el) return;
            el.addEventListener(type, fn, options);
            _eventListeners.push({ el: el, type: type, fn: fn });
        }

        // ============================================================
        // 🔐 SECURITY HELPERS
        // ============================================================

        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            var div = document.createElement('div');
            div.textContent = String(value);
            return div.innerHTML;
        }

        // ✅ v9.5: يقبل كل صيغ المعرّفات
        function normalizeId(id) {
            if (id === null || id === undefined) return '';

            var value = String(id).trim();

            if (!value) return '';

            // ✅ اسمح بـ:
            // - hex (16 أو 24 حرف)
            // - UUID
            // - أرقام
            // - نص مع _ و -
            if (!/^[a-zA-Z0-9_\-]{1,64}$/.test(value)) {
                console.warn('⚠️ normalizeId: invalid format:', value);
                return '';
            }

            return value;
        }

        function getToken() {
            return (
                localStorage.getItem('marine_token') ||
                localStorage.getItem('authToken') ||
                localStorage.getItem('token') ||
                null
            );
        }

        function getAuthHeaders() {
            var token = getToken();
            return {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': token ? 'Bearer ' + token : ''
            };
        }

        function getCsrfToken() {
            try {
                var meta = document.querySelector('meta[name="csrf-token"]');
                if (meta && meta.content) return meta.content;

                if (window.csrfToken && typeof window.csrfToken === 'string') {
                    return window.csrfToken;
                }

                var cookies = document.cookie.split('; ');
                for (var i = 0; i < cookies.length; i++) {
                    var c = cookies[i];
                    if (c.startsWith('marine_csrf=')) {
                        return decodeURIComponent(c.substring('marine_csrf='.length));
                    }
                }
            } catch (e) {
                console.warn('[USERS] CSRF token unavailable');
            }
            return null;
        }

        // ============================================================
        // ✅ VALIDATION
        // ============================================================

        function isValidEmail(email) {
            if (!email || email.length > 254) return false;
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function isStrongEnoughPassword(password) {
            if (!password) return false;
            return password.length >= 12 && password.length <= 128;
        }

        function isValidUsername(username) {
            if (!username) return false;
            if (username.length < 3 || username.length > 64) return false;
            return /^[\p{L}\p{N}_\-]+$/u.test(username);
        }

        // ============================================================
        // 🍞 TOAST
        // ============================================================

        function showToast(message, type) {
            type = type || 'info';
            if (_isDestroyed) return;

            var container = $('toastContainer');

            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }

            var toast = document.createElement('div');
            toast.className = 'toast ' + type;

            var icons = {
                success: '✅',
                warning: '⚠️',
                danger: '❌',
                info: 'ℹ️'
            };

            var icon = document.createElement('span');
            icon.textContent = icons[type] || icons.info;

            var text = document.createElement('span');
            text.textContent = String(message || '');

            var close = document.createElement('button');
            close.type = 'button';
            close.className = 'toast-close';
            close.textContent = '✕';

            close.addEventListener('click', function() {
                toast.remove();
            });

            toast.appendChild(icon);
            toast.appendChild(text);
            toast.appendChild(close);

            container.appendChild(toast);

            var tid = window.setTimeout(function() {
                if (toast.isConnected) {
                    toast.remove();
                }
            }, 4000);
            _pageTimeouts.push(tid);
        }

        // ============================================================
        // 🌐 API REQUEST
        // ============================================================

        async function safeJson(response) {
            var contentType = response.headers.get('content-type') || '';

            if (!contentType.includes('application/json')) {
                return null;
            }

            try {
                return await response.json();
            } catch (e) {
                return null;
            }
        }

        async function apiRequest(url, options) {
            options = options || {};

            if (_isDestroyed) {
                throw new Error('Page destroyed');
            }

            if (!navigator.onLine) {
                throw new Error('لا يوجد اتصال بالإنترنت');
            }

            var controller = new AbortController();

            var timeout = window.setTimeout(function() {
                controller.abort();
            }, REQUEST_TIMEOUT);

            currentAbortController = controller;

            var headers = new Headers(options.headers || {});

            if (!headers.has('Accept')) {
                headers.set('Accept', 'application/json');
            }

            if (
                options.body &&
                typeof options.body === 'string' &&
                !headers.has('Content-Type')
            ) {
                headers.set('Content-Type', 'application/json');
            }

            var token = getToken();
            if (token && !headers.has('Authorization')) {
                headers.set('Authorization', 'Bearer ' + token);
            }

            var method = String(options.method || 'GET').toUpperCase();

            if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
                var csrf = getCsrfToken();
                if (csrf) {
                    headers.set('X-CSRF-Token', csrf);
                }
            }

            try {
                var response = await fetch(url, {
                    method: options.method || 'GET',
                    headers: headers,
                    body: options.body,
                    credentials: 'include',
                    signal: controller.signal,
                    cache: 'no-store'
                });

                if (response.status === 401) {
                    localStorage.removeItem('marine_token');
                    throw new Error('انتهت صلاحية الجلسة. يرجى تسجيل الدخول مرة أخرى.');
                }

                if (response.status === 403) {
                    throw new Error('ليس لديك صلاحية لتنفيذ هذه العملية.');
                }

                if (response.status === 404) {
                    throw new Error('المستخدم أو المورد غير موجود.');
                }

                if (response.status === 409) {
                    var errData = await safeJson(response);
                    throw new Error(
                        (errData && (errData.error || errData.message)) ||
                        'تعارض في البيانات.'
                    );
                }

                if (response.status === 429) {
                    throw new Error('تم تجاوز عدد الطلبات المسموح بها. حاول بعد قليل.');
                }

                return response;

            } catch (error) {
                if (error.name === 'AbortError') {
                    throw new Error('انتهت مهلة الاتصال بالخادم.');
                }
                throw error;

            } finally {
                window.clearTimeout(timeout);

                if (currentAbortController === controller) {
                    currentAbortController = null;
                }
            }
        }

        // ============================================================
        // 📊 LOAD USERS
        // ============================================================

        async function loadUsersData() {
            if (isLoading || !pageExists()) return;

            isLoading = true;

            var container = $('usersTableContainer');

            if (container) {
                container.innerHTML =
                    '<div class="empty-state">' +
                    '<div class="spinner"></div>' +
                    '<p>جاري تحميل البيانات...</p>' +
                    '</div>';
            }

            try {
                var response = await apiRequest(API_BASE, { method: 'GET' });

                if (_isDestroyed) return;

                var data = await safeJson(response);

                console.log('📦 Users response:', data);

                // ✅ استخراج المصفوفة من أي شكل
                if (Array.isArray(data)) {
                    usersData = data;
                } else if (data && Array.isArray(data.users)) {
                    usersData = data.users;
                } else if (data && Array.isArray(data.data)) {
                    usersData = data.data;
                } else {
                    console.warn('⚠️ Unexpected users response shape:', data);
                    usersData = [];
                }

                // ✅ تصفية العناصر الصالحة
                usersData = usersData.filter(function(user) {
                    return user && typeof user === 'object';
                });

                window.usersData = usersData;

                console.log('✅ Loaded', usersData.length, 'users');

                renderUsers(usersData);
                updateStats(usersData);

            } catch (error) {
                if (_isDestroyed) return;

                console.error('❌ [USERS] Load error:', error);

                if (container) {
                    var message = error.message || 'حدث خطأ في تحميل البيانات';
                    container.innerHTML =
                        '<div class="empty-state">' +
                        '<div class="icon">❌</div>' +
                        '<p>' + escapeHtml(message) + '</p>' +
                        '</div>';
                }

                if (
                    error.message &&
                    (error.message.includes('انتهت صلاحية') ||
                     error.message.includes('صلاحية'))
                ) {
                    showToast(error.message, 'warning');
                }

            } finally {
                isLoading = false;
            }
        }

        // ============================================================
        // 📊 STATS
        // ============================================================

        function updateStats(users) {
            if (_isDestroyed) return;

            var total = users.length;

            var active = users.filter(function(u) {
                return u.active !== false;
            }).length;

            var inactive = users.filter(function(u) {
                return u.active === false;
            }).length;

            var admins = users.filter(function(u) {
                return u.role === 'admin';
            }).length;

            var el;

            el = $('totalUsers');
            if (el) el.textContent = total;

            el = $('activeUsers');
            if (el) el.textContent = active;

            el = $('inactiveUsers');
            if (el) el.textContent = inactive;

            el = $('adminUsers');
            if (el) el.textContent = admins;
        }

        // ============================================================
        // 🎨 RENDER USERS
        // ============================================================

        function renderUsers(users) {
            if (_isDestroyed) return;

            var container = $('usersTableContainer');
            if (!container) return;

            // ✅ حالة فارغة
            if (!Array.isArray(users) || users.length === 0) {
                container.innerHTML =
                    '<div class="empty-state">' +
                    '<div class="icon">📭</div>' +
                    '<p>لا توجد مستخدمين</p>' +
                    '</div>';
                return;
            }

            var roleMap = {
                admin: '<span class="role-badge admin">مسؤول</span>',
                manager: '<span class="role-badge manager">مدير</span>',
                operator: '<span class="role-badge operator">مشغل</span>',
                viewer: '<span class="role-badge viewer">مشاهد</span>'
            };

            var html =
                '<div class="table-container">' +
                '<table class="users-table">' +
                '<thead><tr>' +
                '<th>👤 المستخدم</th>' +
                '<th>📧 البريد الإلكتروني</th>' +
                '<th>👔 الدور</th>' +
                '<th>📊 الحالة</th>' +
                '<th>📅 آخر تسجيل دخول</th>' +
                '<th>⚙️ الإجراءات</th>' +
                '</tr></thead><tbody>';

            var validCount = 0;

            users.forEach(function(user) {
                // ✅ v9.5: استخراج الـ id من أي مكان
                var rawId = user.id || user._id || user.userId;

                if (!rawId) {
                    console.warn('⚠️ User without id:', user);
                    return;
                }

                var id = normalizeId(rawId);

                if (!id) {
                    console.warn('⚠️ User with invalid id:', rawId, user);
                    return;
                }

                validCount++;

                var active = user.active !== false;

                var lastLogin = '-';
                if (user.lastLogin) {
                    var date = new Date(user.lastLogin);
                    if (!isNaN(date.getTime())) {
                        lastLogin = date.toLocaleDateString('ar-TN');
                    }
                }

                var username = user.name || user.username || '-';
                var email = user.email || '-';

                var role = roleMap[user.role] || escapeHtml(user.role || '-');

                html +=
                    '<tr>' +
                    '<td><strong>' + escapeHtml(username) + '</strong></td>' +
                    '<td>' + escapeHtml(email) + '</td>' +
                    '<td>' + role + '</td>' +
                    '<td>' + (
                        active
                            ? '<span class="status-badge active">✅ نشط</span>'
                            : '<span class="status-badge inactive">❌ غير نشط</span>'
                    ) + '</td>' +
                    '<td>' + escapeHtml(lastLogin) + '</td>' +
                    '<td>' +
                        '<button ' +
                            'type="button" ' +
                            'class="btn-sm btn-edit edit-btn" ' +
                            'data-id="' + escapeHtml(id) + '" ' +
                            'title="تعديل">' +
                            '✏️' +
                        '</button>' +
                        '<button ' +
                            'type="button" ' +
                            'class="btn-sm btn-toggle toggle-btn" ' +
                            'data-id="' + escapeHtml(id) + '" ' +
                            'data-status="' + String(active) + '" ' +
                            'title="' + (active ? 'تعطيل' : 'تفعيل') + '">' +
                            (active ? '🔒' : '🔓') +
                        '</button>' +
                        '<button ' +
                            'type="button" ' +
                            'class="btn-sm btn-delete delete-btn" ' +
                            'data-id="' + escapeHtml(id) + '" ' +
                            'title="حذف">' +
                            '🗑️' +
                        '</button>' +
                    '</td>' +
                    '</tr>';
            });

            html += '</tbody></table></div>';

            if (validCount === 0) {
                container.innerHTML =
                    '<div class="empty-state">' +
                    '<div class="icon">⚠️</div>' +
                    '<p>لا توجد مستخدمين بمعرّفات صالحة</p>' +
                    '<p style="font-size:12px;color:rgba(255,255,255,.15);margin-top:8px;">' +
                    'افحص الـ Console لتفاصيل أكثر' +
                    '</p>' +
                    '</div>';
                return;
            }

            container.innerHTML = html;

            // ✅ ربط الأزرار
            container.querySelectorAll('.edit-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    editUser(this.dataset.id);
                });
            });

            container.querySelectorAll('.toggle-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    toggleUserStatus(
                        this.dataset.id,
                        this.dataset.status === 'true'
                    );
                });
            });

            container.querySelectorAll('.delete-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    deleteUser(this.dataset.id);
                });
            });

            console.log('✅ Rendered', validCount, 'of', users.length, 'users');
        }

        // ============================================================
        // 📝 FORM
        // ============================================================

        function resetForm() {
            if (!$('userForm')) return;

            var el;

            el = $('userId');
            if (el) el.value = '';

            el = $('userUsername');
            if (el) el.value = '';

            el = $('userEmail');
            if (el) el.value = '';

            el = $('userPassword');
            if (el) el.value = '';

            el = $('userRole');
            if (el) el.value = 'viewer';

            el = $('userStatus');
            if (el) el.value = 'active';

            el = $('formTitle');
            if (el) el.textContent = '➕ إضافة مستخدم جديد';

            el = $('passwordRequired');
            if (el) el.textContent = '*';

            ['userUsername', 'userEmail', 'userPassword'].forEach(function(id) {
                var field = $(id);
                if (field) field.classList.remove('invalid');
            });
        }

        function openUserForm() {
            var form = $('userForm');
            if (form) form.classList.add('active');
        }

        function closeUserForm() {
            var form = $('userForm');
            if (form) form.classList.remove('active');
            resetForm();
        }

        function toggleUserForm() {
            var form = $('userForm');
            if (!form) return;

            if (form.classList.contains('active')) {
                closeUserForm();
            } else {
                resetForm();
                openUserForm();
            }
        }

        // ============================================================
        // ✏️ EDIT USER
        // ============================================================

        function editUser(id) {
            var normalizedId = normalizeId(id);

            if (!normalizedId) {
                showToast('معرّف المستخدم غير صالح.', 'danger');
                return;
            }

            var user = usersData.find(function(u) {
                var uid = u.id || u._id || u.userId;
                return normalizeId(uid) === normalizedId;
            });

            if (!user) {
                showToast('المستخدم غير موجود.', 'warning');
                return;
            }

            var el;

            el = $('formTitle');
            if (el) el.textContent = '✏️ تعديل مستخدم';

            el = $('userId');
            if (el) el.value = normalizedId;

            el = $('userUsername');
            if (el) el.value = user.username || '';

            el = $('userEmail');
            if (el) el.value = user.email || '';

            el = $('userPassword');
            if (el) el.value = '';

            el = $('userRole');
            if (el) el.value = user.role || 'viewer';

            el = $('userStatus');
            if (el) el.value = user.active !== false ? 'active' : 'inactive';

            el = $('passwordRequired');
            if (el) el.textContent = '(اتركها فارغة إذا لم ترد تغييرها)';

            openUserForm();

            var usernameField = $('userUsername');
            if (usernameField) usernameField.focus();
        }

        // ============================================================
        // ✅ VALIDATE FORM
        // ============================================================

        function validateForm(data) {
            ['userUsername', 'userEmail', 'userPassword'].forEach(function(field) {
                var el = $(field);
                if (el) el.classList.remove('invalid');
            });

            if (!isValidUsername(data.username)) {
                var uEl = $('userUsername');
                if (uEl) uEl.classList.add('invalid');
                showToast('اسم المستخدم غير صالح.', 'warning');
                return false;
            }

            if (!isValidEmail(data.email)) {
                var eEl = $('userEmail');
                if (eEl) eEl.classList.add('invalid');
                showToast('البريد الإلكتروني غير صالح.', 'warning');
                return false;
            }

            // كلمة المرور مطلوبة عند الإنشاء
            if (!data.id && !isStrongEnoughPassword(data.password)) {
                var pEl = $('userPassword');
                if (pEl) pEl.classList.add('invalid');
                showToast('كلمة المرور يجب أن تكون 12 حرفاً على الأقل.', 'warning');
                return false;
            }

            // عند التعديل، إذا أُدخلت كلمة مرور يجب أن تكون قوية
            if (data.id && data.password && !isStrongEnoughPassword(data.password)) {
                var pEl2 = $('userPassword');
                if (pEl2) pEl2.classList.add('invalid');
                showToast('كلمة المرور الجديدة يجب أن تكون 12 حرفاً على الأقل.', 'warning');
                return false;
            }

            return true;
        }

        // ============================================================
        // 💾 SAVE USER
        // ============================================================

        async function saveUser() {
            if (isSaving || _isDestroyed) return;

            var idEl = $('userId');
            var usernameEl = $('userUsername');
            var emailEl = $('userEmail');
            var passwordEl = $('userPassword');
            var roleEl = $('userRole');
            var statusEl = $('userStatus');

            if (!usernameEl || !emailEl || !passwordEl || !roleEl || !statusEl) {
                return;
            }

            var id = normalizeId(idEl ? idEl.value : '');
            var username = usernameEl.value.trim();
            var email = emailEl.value.trim();
            var password = passwordEl.value;
            var role = roleEl.value;
            var status = statusEl.value;

            if (!validateForm({ id: id, username: username, email: email, password: password })) {
                return;
            }

            var allowedRoles = ['admin', 'manager', 'operator', 'viewer'];

            if (allowedRoles.indexOf(role) === -1) {
                showToast('الدور المحدد غير صالح.', 'danger');
                return;
            }

            if (['active', 'inactive'].indexOf(status) === -1) {
                showToast('حالة المستخدم غير صالحة.', 'danger');
                return;
            }

            var payload = {
                username: username,
                email: email,
                role: role,
                active: status === 'active'
            };

            if (password) {
                payload.password = password;
            }

            isSaving = true;

            var saveButton = $('saveUserBtn');

            if (saveButton) {
                saveButton.disabled = true;
                saveButton.textContent = '⏳ جاري الحفظ...';
            }

            try {
                var url = id
                    ? API_BASE + '/' + encodeURIComponent(id)
                    : API_BASE;

                var response = await apiRequest(url, {
                    method: id ? 'PUT' : 'POST',
                    body: JSON.stringify(payload)
                });

                if (_isDestroyed) return;

                var data = await safeJson(response);

                if (!response.ok) {
                    throw new Error(
                        (data && (data.error || data.message)) ||
                        'فشل حفظ المستخدم.'
                    );
                }

                showToast(
                    id ? 'تم تحديث المستخدم بنجاح.' : 'تم إضافة المستخدم بنجاح.',
                    'success'
                );

                closeUserForm();

                await loadUsersData();

            } catch (error) {
                if (_isDestroyed) return;

                console.error('❌ [USERS] Save error:', error);

                showToast(error.message || 'فشل حفظ المستخدم.', 'danger');

            } finally {
                isSaving = false;

                if (saveButton) {
                    saveButton.disabled = false;
                    saveButton.textContent = '💾 حفظ';
                }
            }
        }

        // ============================================================
        // 🔄 TOGGLE STATUS
        // ============================================================

        async function toggleUserStatus(id, currentStatus) {
            if (_isDestroyed) return;

            var normalizedId = normalizeId(id);

            if (!normalizedId) {
                showToast('معرّف المستخدم غير صالح.', 'danger');
                return;
            }

            var user = usersData.find(function(u) {
                var uid = u.id || u._id || u.userId;
                return normalizeId(uid) === normalizedId;
            });

            if (!user) {
                showToast('المستخدم غير موجود.', 'warning');
                return;
            }

            // منع تعطيل آخر admin
            if (currentStatus && user.role === 'admin') {
                var activeAdmins = usersData.filter(function(u) {
                    return u.role === 'admin' && u.active !== false;
                });

                if (activeAdmins.length <= 1) {
                    showToast('لا يمكن تعطيل آخر مسؤول نشط.', 'warning');
                    return;
                }
            }

            var action = currentStatus ? 'تعطيل' : 'تفعيل';

            if (!window.confirm('⚠️ هل أنت متأكد من ' + action + ' هذا المستخدم؟')) {
                return;
            }

            try {
                var response = await apiRequest(
                    API_BASE + '/' + encodeURIComponent(normalizedId),
                    {
                        method: 'PUT',
                        body: JSON.stringify({ active: !currentStatus })
                    }
                );

                if (_isDestroyed) return;

                var data = await safeJson(response);

                if (!response.ok) {
                    throw new Error(
                        (data && (data.error || data.message)) ||
                        'فشل تغيير الحالة.'
                    );
                }

                showToast('تم ' + action + ' المستخدم بنجاح.', 'success');

                await loadUsersData();

            } catch (error) {
                if (_isDestroyed) return;

                console.error('❌ [USERS] Toggle error:', error);

                showToast(error.message || 'فشل تغيير حالة المستخدم.', 'danger');
            }
        }

        // ============================================================
        // 🗑️ DELETE USER
        // ============================================================

        async function deleteUser(id) {
            if (_isDestroyed) return;

            var normalizedId = normalizeId(id);

            if (!normalizedId) {
                showToast('معرّف المستخدم غير صالح.', 'danger');
                return;
            }

            var user = usersData.find(function(u) {
                var uid = u.id || u._id || u.userId;
                return normalizeId(uid) === normalizedId;
            });

            if (!user) {
                showToast('المستخدم غير موجود.', 'warning');
                return;
            }

            if (user.role === 'admin') {
                var adminCount = usersData.filter(function(u) {
                    return u.role === 'admin';
                }).length;

                if (adminCount <= 1) {
                    showToast('لا يمكن حذف آخر مسؤول في النظام.', 'warning');
                    return;
                }
            }

            var username = user.username || user.name || 'هذا المستخدم';

            if (!window.confirm('⚠️ سيتم حذف "' + username + '" نهائيًا.\n\nهل أنت متأكد؟')) {
                return;
            }

            try {
                var response = await apiRequest(
                    API_BASE + '/' + encodeURIComponent(normalizedId),
                    { method: 'DELETE' }
                );

                if (_isDestroyed) return;

                var data = await safeJson(response);

                if (!response.ok) {
                    throw new Error(
                        (data && (data.error || data.message)) ||
                        'فشل حذف المستخدم.'
                    );
                }

                showToast('تم حذف المستخدم بنجاح.', 'success');

                await loadUsersData();

            } catch (error) {
                if (_isDestroyed) return;

                console.error('❌ [USERS] Delete error:', error);

                showToast(error.message || 'فشل حذف المستخدم.', 'danger');
            }
        }

        // ============================================================
        // 🚀 INIT
        // ============================================================

        function init() {
            if (!pageExists()) return;

            console.log('👥 Users v9.5 initializing...');

            addSafeListener($('addUserBtn'), 'click', toggleUserForm);

            addSafeListener($('refreshUsersBtn'), 'click', async function() {
                if (isLoading || _isDestroyed) return;
                showToast('🔄 جاري تحديث البيانات...', 'info');
                await loadUsersData();
            });

            addSafeListener($('formCloseBtn'), 'click', closeUserForm);
            addSafeListener($('cancelUserBtn'), 'click', closeUserForm);
            addSafeListener($('saveUserBtn'), 'click', saveUser);

            // منع Enter من الإرسال التلقائي
            addSafeListener($('userForm'), 'keydown', function(event) {
                if (event.key === 'Enter' && event.target.tagName !== 'TEXTAREA') {
                    event.preventDefault();
                }
            });

            // تحميل أولي
            loadUsersData();

            console.log('✅ Users v9.5 initialized');
        }

        // ============================================================
        // 🌐 GLOBAL EXPORTS
        // ============================================================

        window.usersData = usersData;
        window.loadUsersData = loadUsersData;
        window.renderUsers = renderUsers;
        window.updateStats = updateStats;
        window.toggleUserForm = toggleUserForm;
        window.saveUser = saveUser;
        window.editUser = editUser;
        window.toggleUserStatus = toggleUserStatus;
        window.deleteUser = deleteUser;
        window.showToast = showToast;
        window.getToken = getToken;
        window.cleanupUsersPage = _usersCleanup;

        // ============================================================
        // 🏁 BOOT
        // ============================================================

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init, { once: true });
        } else {
            init();
        }

    })();
    </script>
