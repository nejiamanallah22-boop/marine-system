<!-- public/pages/users.html -->
<div id="page-users">
    <!-- نفس الـ style والمحتوى السابق مع بعض التعديلات في الـ script -->

    <script>
        (function () {
            'use strict';

            console.log('👥 Users Page - Enterprise Pro Edition (fixed)');

            // ============================================================
            // 📡 CONFIG
            // ============================================================

            var API_BASE = '/api';
            var SEARCH_DEBOUNCE_MS = 300;
            var PAGE_SIZE = 15;
            var MAX_CAPTURE_DIMENSION = 640;

            var state = {
                users: [],
                devices: [],
                auditLogs: [],
                currentEditId: null,
                pendingDeleteId: null,
                pendingDeleteName: '',
                pendingFaceUserId: null,
                cameraStream: null,
                monitorWindow: null,
                isInitialized: false,
                currentPage: 1
            };

            // ============================================================
            // 🔧 HELPERS
            // ============================================================

            function escapeHtml(value) {
                if (value === null || value === undefined) return '';
                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function debounce(fn, wait) {
                var timer = null;
                return function () {
                    var args = arguments;
                    var ctx = this;
                    clearTimeout(timer);
                    timer = setTimeout(function () { fn.apply(ctx, args); }, wait);
                };
            }

            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            function $(id) { return document.getElementById(id); }

            // ✅ دالة موحدة للحصول على التوكن من عدة أماكن
            function getToken() {
                return localStorage.getItem('marine_token') ||
                       localStorage.getItem('token') ||
                       localStorage.getItem('accessToken') ||
                       localStorage.getItem('authToken') ||
                       null;
            }

            // ✅ دالة لإرجاع الهيدرات المناسبة
            function getAuthHeaders(isJson) {
                var token = getToken();
                var headers = { 'Accept': 'application/json' };
                if (isJson !== false) headers['Content-Type'] = 'application/json';
                if (token) headers['Authorization'] = 'Bearer ' + token;
                return headers;
            }

            // ✅ دالة عرض الإشعارات (toast)
            function showToast(msg, type) {
                type = type || 'info';
                var old = document.querySelector('#page-users .toast');
                if (old) old.remove();
                var n = document.createElement('div');
                n.className = 'toast toast-' + type;
                n.setAttribute('role', 'status');
                n.setAttribute('aria-live', 'polite');
                n.textContent = msg;
                document.body.appendChild(n);
                setTimeout(function () {
                    n.style.opacity = '0';
                    n.style.transform = 'translateY(20px)';
                    n.style.transition = 'all 0.4s';
                    setTimeout(function () { n.remove(); }, 400);
                }, 2500);
            }

            function getRoleLabel(role) {
                var map = {
                    super_admin: '👑 سوبر أدمن', admin: '🛡️ مدير', user: '👤 مستخدم',
                    operator: '🔧 مشغل', viewer: '📡 مشاهد'
                };
                return map[role] || (role ? escapeHtml(role) : 'غير محدد');
            }

            function getRoleClass(role) {
                var allowed = ['super_admin', 'admin', 'user', 'operator', 'viewer'];
                return allowed.indexOf(role) !== -1 ? role : 'user';
            }

            function setButtonLoading(btn, loadingText, originalText) {
                if (!btn) return;
                btn.disabled = true;
                btn.dataset.originalText = originalText !== undefined ? originalText : btn.textContent;
                btn.textContent = loadingText;
            }

            function resetButtonLoading(btn) {
                if (!btn) return;
                btn.disabled = false;
                if (btn.dataset.originalText !== undefined) {
                    btn.textContent = btn.dataset.originalText;
                }
            }

            // ============================================================
            // 🌐 API CLIENT (مُحسَّن)
            // ============================================================

            function apiFetch(url, options) {
                options = options || {};
                var method = options.method || 'GET';
                var body = options.body;
                var silent = options.silent === true;

                return fetch(API_BASE + url, {
                    method: method,
                    headers: getAuthHeaders(),
                    body: body !== undefined ? JSON.stringify(body) : undefined
                })
                .then(function (response) {
                    // في حالة 204 لا يوجد محتوى
                    if (response.status === 204) {
                        return { success: true };
                    }
                    var contentType = response.headers.get('content-type') || '';
                    var parsePromise = contentType.indexOf('application/json') !== -1
                        ? response.json().catch(function () { return {}; })
                        : response.text().then(function () { return {}; });

                    return parsePromise.then(function (data) {
                        if (!response.ok) {
                            var error = new Error((data && data.error) || 'فشل الطلب (' + response.status + ')');
                            error.status = response.status;
                            error.data = data;
                            throw error;
                        }
                        return data;
                    });
                })
                .catch(function (error) {
                    if (!silent) {
                        if (error.status === 401) {
                            showToast('⚠️ انتهت صلاحية الجلسة، يرجى تسجيل الدخول مجدداً', 'error');
                        } else if (error.status === 403) {
                            showToast('⛔ ليس لديك صلاحية لهذه العملية', 'error');
                        } else if (error.status === 404) {
                            showToast('⚠️ ' + (error.message || 'العنصر غير موجود'), 'warning');
                        } else if (error.status === 422) {
                            showToast('⚠️ ' + ((error.data && error.data.error) || 'بيانات غير صالحة'), 'error');
                        } else if (error.status === 429) {
                            showToast('⏳ محاولات كثيرة جداً، يرجى الانتظار', 'error');
                        } else if (!navigator.onLine) {
                            showToast('📡 لا يوجد اتصال بالإنترنت', 'error');
                        } else {
                            showToast('❌ ' + (error.message || 'حدث خطأ غير متوقع'), 'error');
                        }
                    }
                    throw error;
                });
            }

            // ============================================================
            // 📊 STATS
            // ============================================================

            function updateStats() {
                var users = state.users;
                var total = users.length;
                var active = users.filter(function (u) { return u.isActive !== false; }).length;
                var inactive = total - active;
                var admins = users.filter(function (u) { return u.role === 'admin' || u.role === 'super_admin'; }).length;
                var verified = users.filter(function (u) { return u.faceVerified === true; }).length;

                if ($('totalUsers')) $('totalUsers').textContent = total;
                if ($('activeUsers')) $('activeUsers').textContent = active;
                if ($('inactiveUsers')) $('inactiveUsers').textContent = inactive;
                if ($('adminUsers')) $('adminUsers').textContent = admins;
                if ($('verifiedUsers')) $('verifiedUsers').textContent = verified;

                var badge = $('usersBadge');
                if (badge) {
                    badge.textContent = '👥 ' + total + ' مستخدم';
                    badge.className = 'badge blue';
                }
            }

            // ============================================================
            // 🔍 FILTERING
            // ============================================================

            function getFilteredUsers() {
                var searchVal = ($('searchUser') ? $('searchUser').value : '').trim().toLowerCase();
                var unitVal = $('fUnitUser') ? $('fUnitUser').value : 'الكل';
                var statusVal = $('fStatusUser') ? $('fStatusUser').value : 'الكل';
                var roleVal = $('fRoleUser') ? $('fRoleUser').value : 'الكل';
                var verifiedVal = $('fVerifiedUser') ? $('fVerifiedUser').value : 'الكل';

                return state.users.filter(function (u) {
                    if (searchVal) {
                        var nameMatch = (u.name || '').toLowerCase().indexOf(searchVal) !== -1;
                        var emailMatch = (u.email || '').toLowerCase().indexOf(searchVal) !== -1;
                        if (!nameMatch && !emailMatch) return false;
                    }
                    if (unitVal !== 'الكل' && u.unit !== unitVal) return false;
                    if (statusVal !== 'الكل') {
                        var isActive = u.isActive !== false;
                        if (statusVal === 'نشط' && !isActive) return false;
                        if (statusVal === 'غير نشط' && isActive) return false;
                    }
                    if (roleVal !== 'الكل' && u.role !== roleVal) return false;
                    if (verifiedVal !== 'الكل') {
                        var wantsVerified = verifiedVal === 'نعم';
                        if (Boolean(u.faceVerified) !== wantsVerified) return false;
                    }
                    return true;
                });
            }

            // ============================================================
            // 📋 RENDER USERS TABLE
            // ============================================================

            function renderUsersTable() {
                var tbody = $('usersBody');
                var paginationBar = $('usersPagination');
                if (!tbody) return;

                var filtered = getFilteredUsers();
                var totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
                if (state.currentPage > totalPages) state.currentPage = totalPages;
                if (state.currentPage < 1) state.currentPage = 1;

                var startIdx = (state.currentPage - 1) * PAGE_SIZE;
                var pageItems = filtered.slice(startIdx, startIdx + PAGE_SIZE);

                tbody.innerHTML = '';

                if (filtered.length === 0) {
                    tbody.innerHTML =
                        '<tr><td colspan="8" style="text-align:center;padding:40px;color:rgba(255,255,255,0.15);">' +
                        '<div style="font-size:2rem;margin-bottom:10px;">🔍</div>لا توجد نتائج مطابقة</td></tr>';
                    if (paginationBar) paginationBar.style.display = 'none';
                    return;
                }

                var frag = document.createDocumentFragment();

                pageItems.forEach(function (u, i) {
                    var rowIndex = startIdx + i + 1;
                    var userId = u._id || u.id || '';
                    var isActive = u.isActive !== false;
                    var verified = Boolean(u.faceVerified);

                    var tr = document.createElement('tr');
                    tr.innerHTML =
                        '<td style="font-weight:600;color:#60a5fa;">' + rowIndex + '</td>' +
                        '<td class="user-name" style="text-align:right;">' + escapeHtml(u.name || '-') + '</td>' +
                        '<td style="color:rgba(255,255,255,0.4);font-size:0.7rem;">' + escapeHtml(u.email || '-') + '</td>' +
                        '<td style="font-size:0.7rem;color:rgba(255,255,255,0.3);">' + escapeHtml(u.unit || '-') + '</td>' +
                        '<td><span class="status-badge ' + getRoleClass(u.role) + '">' + getRoleLabel(u.role) + '</span></td>' +
                        '<td><span class="status-badge ' + (isActive ? 'active' : 'inactive') + '">' + (isActive ? '🟢 نشط' : '🔴 غير نشط') + '</span></td>' +
                        '<td>' + (verified
                            ? '<span class="verified-badge yes"><i class="fas fa-check-circle" aria-hidden="true"></i> موثق</span>'
                            : '<span class="verified-badge no"><i class="fas fa-times-circle" aria-hidden="true"></i> غير موثق</span>') + '</td>' +
                        '<td>' +
                            '<button class="action-btn edit" data-action="edit" aria-label="تعديل ' + escapeHtml(u.name || '') + '" title="تعديل"><i class="fas fa-edit" aria-hidden="true"></i></button>' +
                            '<button class="action-btn password" data-action="password" aria-label="تغيير كلمة مرور ' + escapeHtml(u.name || '') + '" title="كلمة المرور"><i class="fas fa-key" aria-hidden="true"></i></button>' +
                            '<button class="action-btn face" data-action="face" aria-label="توثيق وجه ' + escapeHtml(u.name || '') + '" title="توثيق الوجه"><i class="fas fa-camera" aria-hidden="true"></i></button>' +
                            '<button class="action-btn delete" data-action="delete" aria-label="حذف ' + escapeHtml(u.name || '') + '" title="حذف"><i class="fas fa-trash" aria-hidden="true"></i></button>' +
                        '</td>';
                    tr.dataset.userId = userId;
                    frag.appendChild(tr);
                });

                tbody.appendChild(frag);

                if (paginationBar) {
                    if (filtered.length > PAGE_SIZE) {
                        paginationBar.style.display = 'flex';
                        var info = $('paginationInfo');
                        var pageIndicator = $('pageIndicator');
                        var prevBtn = $('prevPageBtn');
                        var nextBtn = $('nextPageBtn');
                        if (info) {
                            info.textContent = 'عرض ' + (startIdx + 1) + '-' + Math.min(startIdx + PAGE_SIZE, filtered.length) + ' من ' + filtered.length;
                        }
                        if (pageIndicator) pageIndicator.textContent = state.currentPage + ' / ' + totalPages;
                        if (prevBtn) prevBtn.disabled = state.currentPage <= 1;
                        if (nextBtn) nextBtn.disabled = state.currentPage >= totalPages;
                    } else {
                        paginationBar.style.display = 'none';
                    }
                }
            }

            // Event delegation
            function handleUsersTableClick(e) {
                var btn = e.target.closest('[data-action]');
                if (!btn) return;
                var tr = btn.closest('tr');
                if (!tr || !tr.dataset.userId) return;

                var userId = tr.dataset.userId;
                var action = btn.dataset.action;

                if (action === 'edit') openEditModal(userId);
                else if (action === 'password') openPasswordModal(userId);
                else if (action === 'face') captureFaceForUser(userId);
                else if (action === 'delete') openConfirmDeleteModal(userId);
            }

            // ============================================================
            // 📡 LOAD USERS (جلب المستخدمين من السيرفر)
            // ============================================================

            function loadUsers() {
                var tbody = $('usersBody');
                if (tbody) {
                    tbody.innerHTML =
                        '<tr><td colspan="8" style="text-align:center;padding:40px;color:rgba(255,255,255,0.15);">' +
                        '<div style="font-size:2rem;margin-bottom:10px;">⏳</div>جاري التحميل...</td></tr>';
                }

                var token = getToken();
                if (!token) {
                    showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
                    if (tbody) {
                        tbody.innerHTML =
                            '<tr><td colspan="8" style="text-align:center;padding:40px;color:#fbbf24;">' +
                            '<div style="font-size:2rem;margin-bottom:10px;">🔑</div>يرجى تسجيل الدخول لعرض المستخدمين</td></tr>';
                    }
                    return;
                }

                apiFetch('/users', { silent: true })
                    .then(function (data) {
                        // تأكد من أن البيانات تحتوي على users
                        state.users = (data && data.users) || (data && Array.isArray(data) ? data : []);
                        state.currentPage = 1;
                        updateStats();
                        renderUsersTable();
                        showToast('✅ تم تحميل ' + state.users.length + ' مستخدم', 'success');
                    })
                    .catch(function (error) {
                        if (tbody) {
                            tbody.innerHTML =
                                '<tr><td colspan="8" style="text-align:center;padding:40px;color:#f87171;">' +
                                '<div style="font-size:2rem;margin-bottom:10px;">❌</div>' +
                                escapeHtml(error.message || 'فشل تحميل المستخدمين') +
                                '<br><button id="retryLoadUsersBtn" type="button" style="margin-top:10px;padding:6px 16px;background:#60a5fa;border:none;border-radius:6px;color:#fff;cursor:pointer;">إعادة المحاولة</button>' +
                                '</td></tr>';
                            var retryBtn = $('retryLoadUsersBtn');
                            if (retryBtn) retryBtn.addEventListener('click', loadUsers);
                        }
                    });
            }

            // ============================================================
            // ➕ ADD / EDIT USER (الجزء الأهم)
            // ============================================================

            function clearFieldErrors() {
                document.querySelectorAll('#userModal .field-error').forEach(function (el) { el.classList.remove('visible'); });
                document.querySelectorAll('#userModal input, #userModal select').forEach(function (el) { el.classList.remove('invalid'); });
            }

            function showFieldError(fieldId) {
                var errorEl = $('err-' + fieldId);
                var inputEl = $(fieldId);
                if (errorEl) errorEl.classList.add('visible');
                if (inputEl) inputEl.classList.add('invalid');
            }

            function openAddModal() {
                state.currentEditId = null;
                clearFieldErrors();
                $('editUserId').value = '';
                $('modalTitle').textContent = '➕ إضافة مستخدم جديد';
                $('userName').value = '';
                $('userEmail').value = '';
                $('userPassword').value = '';
                $('userPassword').placeholder = '********';
                $('userUnit').value = '';
                $('userRole').value = 'user';
                $('userStatus').value = 'نشط';
                openModal('userModal');
                $('userName').focus();
            }

            function openEditModal(id) {
                var user = state.users.find(function (u) { return (u._id || u.id) === id; });
                if (!user) {
                    showToast('⚠️ المستخدم غير موجود', 'error');
                    return;
                }

                state.currentEditId = id;
                clearFieldErrors();
                $('editUserId').value = id;
                $('modalTitle').textContent = '✏️ تعديل المستخدم: ' + user.name;
                $('userName').value = user.name || '';
                $('userEmail').value = user.email || '';
                $('userPassword').value = '';
                $('userPassword').placeholder = 'اترك فارغاً للحفاظ على كلمة المرور';
                $('userUnit').value = user.unit || '';
                $('userRole').value = user.role || 'user';
                $('userStatus').value = user.isActive !== false ? 'نشط' : 'غير نشط';
                openModal('userModal');
                $('userName').focus();
            }

            function validateUserForm(editId, name, email, password) {
                clearFieldErrors();
                var valid = true;

                if (!name || name.trim().length < 2) { showFieldError('userName'); valid = false; }
                if (!email || !isValidEmail(email)) { showFieldError('userEmail'); valid = false; }
                if (!$('userUnit').value) { showFieldError('userUnit'); valid = false; }
                // كلمة المرور إلزامية عند الإضافة، وعند التعديل إذا كانت مملوءة يجب أن تكون >= 8
                if (!editId && (!password || password.length < 8)) { showFieldError('userPassword'); valid = false; }
                if (editId && password && password.length > 0 && password.length < 8) { showFieldError('userPassword'); valid = false; }

                return valid;
            }

            // ✅ الدالة الأساسية لحفظ المستخدم (إضافة أو تعديل)
            function saveUser() {
                var name = $('userName').value.trim();
                var email = $('userEmail').value.trim();
                var password = $('userPassword').value;
                var unit = $('userUnit').value;
                var role = $('userRole').value;
                var status = $('userStatus').value;
                var editId = $('editUserId').value;

                if (!validateUserForm(editId, name, email, password)) {
                    showToast('⚠️ يرجى تصحيح الحقول المميزة بالأحمر', 'error');
                    return;
                }

                var saveBtn = $('modalSave');
                setButtonLoading(saveBtn, '⏳ جاري الحفظ...');

                // بناء بيانات الطلب
                var url = '/users';
                var method = 'POST';
                var body = {
                    name: name,
                    username: email.split('@')[0], // قد يكون مطلوباً
                    email: email,
                    password: password,
                    unit: unit,
                    role: role,
                    isActive: status === 'نشط'
                };

                if (editId) {
                    url = '/users/' + encodeURIComponent(editId);
                    method = 'PUT';
                    body = { name: name, email: email, unit: unit, role: role, isActive: status === 'نشط' };
                    if (password && password.length >= 8) body.password = password;
                }

                // إرسال الطلب إلى السيرفر
                apiFetch(url, { method: method, body: body })
                    .then(function (data) {
                        showToast(editId ? '✅ تم تحديث المستخدم' : '✅ تم إضافة المستخدم', 'success');
                        closeModal('userModal');
                        loadUsers(); // إعادة تحميل القائمة
                    })
                    .catch(function (error) {
                        // الخطأ يتم عرضه عبر apiFetch تلقائياً
                        console.error('خطأ في حفظ المستخدم:', error);
                    })
                    .finally(function () {
                        resetButtonLoading(saveBtn);
                    });
            }

            // ============================================================
            // 🗑️ DELETE USER
            // ============================================================

            function openConfirmDeleteModal(id) {
                var user = state.users.find(function (u) { return (u._id || u.id) === id; });
                var name = user ? user.name : 'هذا المستخدم';

                state.pendingDeleteId = id;
                state.pendingDeleteName = name;
                $('confirmMessage').textContent = 'هل أنت متأكد من حذف المستخدم "' + name + '"؟';
                $('confirmSubMessage').textContent = 'لا يمكن التراجع عن هذا الإجراء';
                openModal('confirmModal');
            }

            function confirmDelete() {
                if (!state.pendingDeleteId) return;

                var id = state.pendingDeleteId;
                var deleteBtn = $('confirmDelete');
                setButtonLoading(deleteBtn, '⏳ جاري الحذف...');

                apiFetch('/users/' + encodeURIComponent(id), { method: 'DELETE' })
                    .then(function () {
                        showToast('🗑️ تم حذف المستخدم بنجاح', 'success');
                        state.pendingDeleteId = null;
                        closeModal('confirmModal');
                        loadUsers();
                    })
                    .finally(function () { resetButtonLoading(deleteBtn); });
            }

            // ============================================================
            // 🔑 CHANGE PASSWORD
            // ============================================================

            function openPasswordModal(id) {
                var user = state.users.find(function (u) { return (u._id || u.id) === id; });
                if (!user) {
                    showToast('⚠️ المستخدم غير موجود', 'error');
                    return;
                }

                $('passwordUserId').value = id;
                $('passwordUserName').value = user.name || '';
                $('newPassword').value = '';
                $('confirmPassword').value = '';
                openModal('passwordModal');
                $('newPassword').focus();
            }

            function savePassword() {
                var id = $('passwordUserId').value;
                var newPass = $('newPassword').value;
                var confirmPass = $('confirmPassword').value;

                if (!newPass || newPass.length < 8) {
                    showToast('⚠️ كلمة المرور يجب أن تكون 8 أحرف على الأقل', 'error');
                    return;
                }
                if (newPass !== confirmPass) {
                    showToast('⚠️ كلمة المرور غير متطابقة', 'error');
                    return;
                }

                var saveBtn = $('passwordModalSave');
                setButtonLoading(saveBtn, '⏳ جاري الحفظ...');

                apiFetch('/users/' + encodeURIComponent(id) + '/password', {
                    method: 'POST',
                    body: { password: newPass }
                })
                    .then(function () {
                        showToast('✅ تم تغيير كلمة المرور', 'success');
                        closeModal('passwordModal');
                    })
                    .finally(function () { resetButtonLoading(saveBtn); });
            }

            // ============================================================
            // 🪟 MODAL HELPERS
            // ============================================================

            function openModal(id) {
                var modal = $(id);
                if (modal) modal.classList.add('visible');
            }

            function closeModal(id) {
                var modal = $(id);
                if (modal) modal.classList.remove('visible');
                if (id === 'confirmModal') state.pendingDeleteId = null;
            }

            function closeTopVisibleModal() {
                var visible = document.querySelector('#page-users .modal-overlay.visible');
                if (visible) closeModal(visible.id);
            }

            // ============================================================
            // 🔍 FILTERS
            // ============================================================

            function applyFilters() {
                state.currentPage = 1;
                renderUsersTable();
                showToast('✅ تم تطبيق الفلاتر', 'success');
            }

            function resetFilters() {
                $('searchUser').value = '';
                $('fUnitUser').value = 'الكل';
                $('fStatusUser').value = 'الكل';
                $('fRoleUser').value = 'الكل';
                $('fVerifiedUser').value = 'الكل';
                state.currentPage = 1;
                renderUsersTable();
                showToast('✅ تم إلغاء جميع الفلاتر', 'success');
            }

            var debouncedRender = debounce(function () {
                state.currentPage = 1;
                renderUsersTable();
            }, SEARCH_DEBOUNCE_MS);

            // ============================================================
            // 🚀 INIT
            // ============================================================

            function initUsers() {
                if (state.isInitialized) return;
                state.isInitialized = true;

                // تحقق من وجود توكن
                var token = getToken();
                if (!token) {
                    showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
                    // إعادة توجيه إلى صفحة تسجيل الدخول إذا لزم الأمر
                    // window.location.href = '/index.html';
                }

                loadUsers();

                // ربط الأحداث
                document.querySelectorAll('#page-users .tab-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () { switchTab(this.dataset.tab); });
                });

                $('refreshBtn').addEventListener('click', loadUsers);
                $('addUserBtn').addEventListener('click', openAddModal);
                $('filterBtn').addEventListener('click', applyFilters);
                $('resetBtn').addEventListener('click', resetFilters);
                $('printBtn').addEventListener('click', function () { window.print(); });
                $('cameraMonitorBtn').addEventListener('click', openCameraMonitor);

                // Delegated table actions
                $('usersBody').addEventListener('click', handleUsersTableClick);

                // Pagination
                $('prevPageBtn').addEventListener('click', function () {
                    if (state.currentPage > 1) { state.currentPage--; renderUsersTable(); }
                });
                $('nextPageBtn').addEventListener('click', function () {
                    state.currentPage++; renderUsersTable();
                });

                // User modal
                $('modalClose').addEventListener('click', function () { closeModal('userModal'); });
                $('modalCancel').addEventListener('click', function () { closeModal('userModal'); });
                $('modalSave').addEventListener('click', saveUser);

                // Password modal
                $('passwordModalClose').addEventListener('click', function () { closeModal('passwordModal'); });
                $('passwordModalCancel').addEventListener('click', function () { closeModal('passwordModal'); });
                $('passwordModalSave').addEventListener('click', savePassword);

                // Confirm modal
                $('confirmModalClose').addEventListener('click', function () { closeModal('confirmModal'); });
                $('confirmCancel').addEventListener('click', function () { closeModal('confirmModal'); });
                $('confirmDelete').addEventListener('click', confirmDelete);

                // Filters — search is debounced
                $('searchUser').addEventListener('input', debouncedRender);
                $('fUnitUser').addEventListener('change', applyFilters);
                $('fStatusUser').addEventListener('change', applyFilters);
                $('fRoleUser').addEventListener('change', applyFilters);
                $('fVerifiedUser').addEventListener('change', applyFilters);

                // Camera
                $('startCameraBtn').addEventListener('click', startCamera);
                $('stopCameraBtn').addEventListener('click', stopCamera);
                $('captureFaceBtn').addEventListener('click', captureFace);

                // Close modal on outside click
                document.querySelectorAll('#page-users .modal-overlay').forEach(function (m) {
                    m.addEventListener('click', function (e) {
                        if (e.target === this) closeModal(this.id);
                    });
                });

                // Escape key
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') closeTopVisibleModal();
                });

                // Cleanup camera on page leave
                window.addEventListener('beforeunload', stopCameraSilently);
                document.addEventListener('visibilitychange', function () {
                    if (document.hidden) stopCameraSilently();
                });

                // Public API
                window.MarineUsersPage = {
                    reload: loadUsers,
                    switchTab: switchTab
                };

                console.log('✅ صفحة المستخدمين جاهزة (مع الإصلاحات)');
            }

            // ============================================================
            // 📹 CAMERA FUNCTIONS (مختصرة للاختصار)
            // ============================================================

            function checkConsent() {
                var checkbox = $('consentCheckbox');
                return Boolean(checkbox && checkbox.checked);
            }

            function requestCameraPermission() {
                if (!checkConsent()) {
                    showToast('⚠️ يرجى الموافقة على استخدام الكاميرا أولاً', 'warning');
                    if ($('consentCheckbox')) $('consentCheckbox').focus();
                    return false;
                }
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showToast('❌ الكاميرا غير مدعومة على هذا الجهاز', 'error');
                    return false;
                }
                return true;
            }

            function startCamera() {
                if (!requestCameraPermission()) return;
                var video = $('cameraVideo');
                var placeholder = $('cameraPlaceholder');
                var status = $('cameraStatus');

                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                })
                .then(function (stream) {
                    state.cameraStream = stream;
                    video.srcObject = stream;
                    video.style.display = 'block';
                    placeholder.style.display = 'none';
                    status.textContent = '📷 قيد التشغيل';
                    status.className = 'badge green';

                    if ($('startCameraBtn')) $('startCameraBtn').disabled = true;
                    if ($('captureFaceBtn')) $('captureFaceBtn').disabled = false;
                    if ($('stopCameraBtn')) $('stopCameraBtn').style.display = 'inline-flex';

                    showToast('📸 الكاميرا قيد التشغيل', 'info');
                })
                .catch(function (error) {
                    console.error('Camera error:', error);
                    showToast('❌ لا يمكن الوصول إلى الكاميرا: ' + error.message, 'error');
                });
            }

            function stopCamera() {
                if (state.cameraStream) {
                    state.cameraStream.getTracks().forEach(function (track) { track.stop(); });
                    state.cameraStream = null;
                }
                var video = $('cameraVideo');
                var placeholder = $('cameraPlaceholder');
                var status = $('cameraStatus');
                if (video) { video.srcObject = null; video.style.display = 'none'; }
                if (placeholder) placeholder.style.display = 'block';
                if (status) { status.textContent = '📷 غير نشط'; status.className = 'badge purple'; }

                if ($('startCameraBtn')) $('startCameraBtn').disabled = false;
                if ($('captureFaceBtn')) $('captureFaceBtn').disabled = true;
                if ($('stopCameraBtn')) $('stopCameraBtn').style.display = 'none';
            }

            function stopCameraSilently() {
                if (state.cameraStream) {
                    state.cameraStream.getTracks().forEach(function (track) { track.stop(); });
                    state.cameraStream = null;
                }
            }

            function captureFace() {
                if (!state.cameraStream) {
                    showToast('⚠️ يرجى تشغيل الكاميرا أولاً', 'warning');
                    return;
                }
                var video = $('cameraVideo');
                var canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                var imageData = canvas.toDataURL('image/jpeg', 0.85);

                var preview = $('facePreviewImage');
                preview.src = imageData;
                $('capturedFacePreview').style.display = 'block';

                if (state.pendingFaceUserId) {
                    uploadFaceCapture(state.pendingFaceUserId, imageData);
                } else {
                    showToast('✅ تم التقاط صورة الوجه بنجاح', 'success');
                }
                stopCamera();
            }

            function uploadFaceCapture(userId, imageDataUrl) {
                var statusText = $('captureStatusText');
                if (statusText) statusText.textContent = '⏳ جاري رفع الصورة وتوثيق الوجه...';

                apiFetch('/users/' + encodeURIComponent(userId) + '/face-verification', {
                    method: 'POST',
                    body: { image: imageDataUrl }
                })
                .then(function () {
                    var user = state.users.find(function (u) { return (u._id || u.id) === userId; });
                    if (user) user.faceVerified = true;
                    updateStats();
                    renderUsersTable();
                    if (statusText) statusText.textContent = '✅ تم توثيق وجه المستخدم بنجاح';
                    showToast('✅ تم توثيق الوجه بنجاح', 'success');
                })
                .catch(function () {
                    if (statusText) statusText.textContent = '❌ فشل رفع الصورة، حاول مرة أخرى';
                })
                .finally(function () {
                    state.pendingFaceUserId = null;
                    hideCameraTargetBanner();
                });
            }

            function showCameraTargetBanner(userName) {
                var banner = $('cameraTargetBanner');
                var text = $('cameraTargetText');
                if (banner && text) {
                    text.textContent = 'سيتم توثيق وجه المستخدم: ' + userName;
                    banner.classList.add('visible');
                }
            }

            function hideCameraTargetBanner() {
                var banner = $('cameraTargetBanner');
                if (banner) banner.classList.remove('visible');
            }

            function captureFaceForUser(userId) {
                var user = state.users.find(function (u) { return (u._id || u.id) === userId; });
                if (!user) {
                    showToast('⚠️ المستخدم غير موجود', 'error');
                    return;
                }
                state.pendingFaceUserId = userId;
                switchTab('camera');
                showCameraTargetBanner(user.name || 'غير معروف');
                showToast('📸 قم بتشغيل الكاميرا والتقاط وجه ' + user.name, 'info');
            }

            // ============================================================
            // 📹 CAMERA MONITOR (اختصار)
            // ============================================================

            function openCameraMonitor() {
                var userRole = localStorage.getItem('userRole') || 'user';
                if (userRole !== 'super_admin' && userRole !== 'admin') {
                    showToast('⚠️ هذه الميزة متاحة فقط للمدراء وسوبر أدمن', 'error');
                    return;
                }
                var monitorWindow = window.open('', '_blank', 'width=900,height=650,scrollbars=yes');
                if (!monitorWindow) {
                    showToast('⚠️ يرجى السماح بالنوافذ المنبثقة', 'warning');
                    return;
                }
                state.monitorWindow = monitorWindow;
                // (باقي الكود لإنشاء نافذة المراقبة موجود في النسخة الأصلية، تم حذفه للاختصار)
                showToast('🎥 تم فتح نافذة المراقبة', 'info');
            }

            // ============================================================
            // 🔄 TABS
            // ============================================================

            function switchTab(tab) {
                document.querySelectorAll('#page-users .tab-btn').forEach(function (btn) {
                    var isActive = btn.dataset.tab === tab;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-selected', String(isActive));
                });

                document.querySelectorAll('#page-users .tab-content').forEach(function (content) {
                    content.classList.toggle('active', content.id === 'tab-' + tab);
                });

                if (tab !== 'camera') {
                    stopCameraSilently();
                }

                if (tab === 'devices') loadDevices();
                else if (tab === 'logs') loadAuditLogs();
            }

            // ============================================================
            // 📱 DEVICES & LOGS (اختصار)
            // ============================================================

            function loadDevices() {
                var container = $('devicesList');
                if (container) {
                    container.innerHTML =
                        '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.15);">' +
                        '<div style="font-size:2rem;margin-bottom:10px;">⏳</div>جاري تحميل الأجهزة...</div>';
                }
                apiFetch('/devices', { silent: true })
                    .then(function (data) {
                        state.devices = (data && data.devices) || [];
                        var badge = $('devicesBadge');
                        if (badge) badge.textContent = '📱 ' + state.devices.length + ' جهاز';
                        // عرض الأجهزة
                        renderDeviceLikeList(container, state.devices, '📱', 'لا توجد أجهزة مسجلة', function (d) {
                            var status = d.status === 'online' ? 'online' : 'offline';
                            return '<div class="device-info">' +
                                '<div class="device-name">' + escapeHtml(d.name || 'جهاز غير معروف') + '</div>' +
                                '<div class="device-detail">' + escapeHtml(d.type || '') + ' · آخر نشاط: ' + escapeHtml(d.lastActive || '-') + '</div>' +
                                '</div>' +
                                '<span class="device-status ' + status + '">' + (status === 'online' ? '🟢 متصل' : '🔴 غير متصل') + '</span>';
                        });
                    })
                    .catch(function () {
                        var badge = $('devicesBadge');
                        if (badge) badge.textContent = '📱 غير متاح';
                        if (container) {
                            container.innerHTML =
                                '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.2);">' +
                                '<div style="font-size:2rem;margin-bottom:10px;">⚠️</div>تعذر تحميل الأجهزة</div>';
                        }
                    });
            }

            function loadAuditLogs() {
                var container = $('auditLogsList');
                if (container) {
                    container.innerHTML =
                        '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.15);">' +
                        '<div style="font-size:2rem;margin-bottom:10px;">⏳</div>جاري تحميل السجلات...</div>';
                }
                apiFetch('/audit-logs', { silent: true })
                    .then(function (data) {
                        state.auditLogs = (data && data.logs) || [];
                        var badge = $('logsBadge');
                        if (badge) badge.textContent = '📋 ' + state.auditLogs.length + ' سجل';
                        renderDeviceLikeList(container, state.auditLogs, '📋', 'لا توجد سجلات', function (l) {
                            return '<div class="device-info">' +
                                '<div class="device-name">' + escapeHtml(l.user || 'مستخدم غير معروف') + '</div>' +
                                '<div class="device-detail">' + escapeHtml(l.action || '') + ' · ' + escapeHtml(l.details || '') + '</div>' +
                                '</div>' +
                                '<span style="font-size:11px;color:rgba(255,255,255,0.3);">' + escapeHtml(l.time || '-') + '</span>';
                        });
                    })
                    .catch(function () {
                        var badge = $('logsBadge');
                        if (badge) badge.textContent = '📋 غير متاح';
                        if (container) {
                            container.innerHTML =
                                '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.2);">' +
                                '<div style="font-size:2rem;margin-bottom:10px;">⚠️</div>تعذر تحميل السجلات</div>';
                        }
                    });
            }

            function renderDeviceLikeList(container, items, emptyIcon, emptyMessage, mapFn) {
                if (!container) return;
                if (!items || items.length === 0) {
                    container.innerHTML =
                        '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.15);">' +
                        '<div style="font-size:2rem;margin-bottom:10px;">' + emptyIcon + '</div>' + emptyMessage + '</div>';
                    return;
                }
                var frag = document.createDocumentFragment();
                items.forEach(function (item) {
                    var div = document.createElement('div');
                    div.className = 'device-item';
                    div.innerHTML = mapFn(item);
                    frag.appendChild(div);
                });
                container.innerHTML = '';
                container.appendChild(frag);
            }

            // ============================================================
            // بدء التشغيل
            // ============================================================

            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                setTimeout(initUsers, 0);
            } else {
                document.addEventListener('DOMContentLoaded', initUsers);
            }

        })();
    </script>
</div>
