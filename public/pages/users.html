<script>
(() => {
    'use strict';

    /*
     * ============================================================
     * MARINE SYSTEM
     * USERS PAGE v4.0
     * ENTERPRISE HARDENED CLIENT
     *
     * ملاحظة أمنية:
     * الواجهة لا تمنح صلاحيات.
     * يجب أن يفرض server.js جميع صلاحيات RBAC وعمليات CRUD.
     * ============================================================
     */

    const PAGE_ID = 'page-users';
    const API_BASE = '/api/users';

    const REQUEST_TIMEOUT = 15000;
    const AUTO_REFRESH_MS = 60000;

    let usersData = [];
    let isLoading = false;
    let isSaving = false;
    let refreshTimer = null;
    let currentAbortController = null;

    /* ============================================================
     * DOM
     * ============================================================ */

    const $ = id => document.getElementById(id);

    function pageExists() {
        return !!$(PAGE_ID);
    }

    /* ============================================================
     * SECURITY HELPERS
     * ============================================================ */

    function escapeHtml(value) {
        if (value === null || value === undefined) return '';

        const div = document.createElement('div');
        div.textContent = String(value);

        return div.innerHTML;
    }

    function normalizeId(id) {
        if (id === null || id === undefined) return '';

        const value = String(id).trim();

        /*
         * حماية إضافية من إدخال path غير متوقع.
         * Mongo ObjectId المعتاد = 24 hex.
         */
        if (!/^[a-fA-F0-9]{24}$/.test(value)) {
            return '';
        }

        return value;
    }

    function getToken() {
        /*
         * دعم التوافق مع النسخ السابقة.
         *
         * الأفضل أمنيًا:
         * HttpOnly Secure SameSite Cookie
         *
         * وليس localStorage.
         */
        return (
            localStorage.getItem('authToken') ||
            localStorage.getItem('marine_token') ||
            localStorage.getItem('token') ||
            null
        );
    }

    function clearClientTokens() {
        try {
            localStorage.removeItem('authToken');
            localStorage.removeItem('marine_token');
            localStorage.removeItem('token');
        } catch (error) {
            console.warn('[USERS] Unable to clear local tokens');
        }
    }

    /*
     * محاولة الحصول على CSRF token من:
     *
     * 1. meta tag
     * 2. cookie
     * 3. window.csrfToken
     *
     * إذا كان server.js يستخدم /api/csrf-token
     * يمكن ربطه هنا مباشرة.
     */
    function getCsrfToken() {
        try {
            const meta = document.querySelector(
                'meta[name="csrf-token"]'
            );

            if (meta && meta.content) {
                return meta.content;
            }

            if (
                window.csrfToken &&
                typeof window.csrfToken === 'string'
            ) {
                return window.csrfToken;
            }

            const cookie = document.cookie
                .split('; ')
                .find(row =>
                    row.startsWith('csrfToken=')
                );

            if (cookie) {
                return decodeURIComponent(
                    cookie.split('=').slice(1).join('=')
                );
            }
        } catch (error) {
            console.warn('[USERS] CSRF token unavailable');
        }

        return null;
    }

    function isValidEmail(email) {
        if (!email || email.length > 254) return false;

        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function isStrongEnoughPassword(password) {
        if (!password) return false;

        return (
            password.length >= 12 &&
            password.length <= 128
        );
    }

    function isValidUsername(username) {
        if (!username) return false;

        if (username.length < 3 || username.length > 64) {
            return false;
        }

        /*
         * اسم مستخدم آمن نسبيًا:
         * حروف عربية/لاتينية + أرقام + _ + -
         */
        return /^[\p{L}\p{N}_-]+$/u.test(username);
    }

    /* ============================================================
     * TOAST
     * ============================================================ */

    function showToast(message, type = 'info') {
        let container = $('toastContainer');

        if (!container) {
            container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'toast-container';
            document.body.appendChild(container);
        }

        const toast = document.createElement('div');

        toast.className = `toast ${type}`;

        const icons = {
            success: '✅',
            warning: '⚠️',
            danger: '❌',
            info: 'ℹ️'
        };

        const icon = document.createElement('span');
        icon.textContent = icons[type] || icons.info;

        const text = document.createElement('span');
        text.textContent = String(message);

        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'toast-close';
        close.textContent = '✕';

        close.addEventListener('click', () => {
            toast.remove();
        });

        toast.appendChild(icon);
        toast.appendChild(text);
        toast.appendChild(close);

        container.appendChild(toast);

        window.setTimeout(() => {
            if (toast.isConnected) {
                toast.remove();
            }
        }, 4000);
    }

    /* ============================================================
     * REQUEST SYSTEM
     * ============================================================ */

    async function safeJson(response) {
        const contentType =
            response.headers.get('content-type') || '';

        if (!contentType.includes('application/json')) {
            return null;
        }

        try {
            return await response.json();
        } catch {
            return null;
        }
    }

    async function apiRequest(
        url,
        options = {},
        { retryOn401 = false } = {}
    ) {
        if (!navigator.onLine) {
            throw new Error('لا يوجد اتصال بالإنترنت');
        }

        const controller = new AbortController();

        const timeout = window.setTimeout(() => {
            controller.abort();
        }, REQUEST_TIMEOUT);

        currentAbortController = controller;

        const headers = new Headers(
            options.headers || {}
        );

        if (!headers.has('Accept')) {
            headers.set('Accept', 'application/json');
        }

        if (
            options.body &&
            typeof options.body === 'string' &&
            !headers.has('Content-Type')
        ) {
            headers.set(
                'Content-Type',
                'application/json'
            );
        }

        /*
         * Bearer token compatibility.
         *
         * إذا كان النظام يستخدم HttpOnly cookie،
         * فلن يوجد token هنا وسيتم الاعتماد على cookie.
         */
        const token = getToken();

        if (
            token &&
            !headers.has('Authorization')
        ) {
            headers.set(
                'Authorization',
                `Bearer ${token}`
            );
        }

        /*
         * CSRF للطلبات التي تغير البيانات.
         */
        const method =
            String(options.method || 'GET').toUpperCase();

        if (
            ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)
        ) {
            const csrf = getCsrfToken();

            if (csrf) {
                headers.set('X-CSRF-Token', csrf);
            }
        }

        try {
            const response = await fetch(url, {
                ...options,
                headers,
                credentials: 'include',
                signal: controller.signal,
                cache: 'no-store'
            });

            if (
                response.status === 401 &&
                !retryOn401
            ) {
                clearClientTokens();

                throw new Error(
                    'انتهت صلاحية الجلسة. يرجى تسجيل الدخول مرة أخرى.'
                );
            }

            if (response.status === 403) {
                throw new Error(
                    'ليس لديك صلاحية لتنفيذ هذه العملية.'
                );
            }

            if (response.status === 404) {
                throw new Error(
                    'المستخدم أو المورد غير موجود.'
                );
            }

            if (response.status === 409) {
                const data = await safeJson(response);

                throw new Error(
                    data?.error ||
                    data?.message ||
                    'تعارض في البيانات.'
                );
            }

            if (response.status === 429) {
                throw new Error(
                    'تم تجاوز عدد الطلبات المسموح بها. حاول بعد قليل.'
                );
            }

            return response;

        } catch (error) {

            if (error.name === 'AbortError') {
                throw new Error(
                    'انتهت مهلة الاتصال بالخادم.'
                );
            }

            throw error;

        } finally {
            window.clearTimeout(timeout);

            if (
                currentAbortController === controller
            ) {
                currentAbortController = null;
            }
        }
    }

    /* ============================================================
     * LOAD USERS
     * ============================================================ */

    async function loadUsersData() {
        if (isLoading || !pageExists()) return;

        isLoading = true;

        const container =
            $('usersTableContainer');

        if (container) {
            container.innerHTML =
                '<div class="empty-state">' +
                '<div class="icon">⏳</div>' +
                '<p>جاري تحميل البيانات...</p>' +
                '</div>';
        }

        try {

            const response = await apiRequest(
                API_BASE,
                {
                    method: 'GET'
                }
            );

            const data =
                await safeJson(response);

            if (!data) {
                throw new Error(
                    'استجابة غير صالحة من الخادم.'
                );
            }

            if (Array.isArray(data)) {
                usersData = data;
            } else if (
                Array.isArray(data.users)
            ) {
                usersData = data.users;
            } else if (
                Array.isArray(data.data)
            ) {
                usersData = data.data;
            } else {
                usersData = [];
            }

            /*
             * إزالة أي عناصر غير صالحة.
             */
            usersData = usersData.filter(
                user =>
                    user &&
                    typeof user === 'object'
            );

            window.usersData = usersData;

            renderUsers(usersData);
            updateStats(usersData);

        } catch (error) {

            console.error(
                '❌ [USERS] Load error:',
                error
            );

            if (container) {

                const message =
                    error.message ||
                    'حدث خطأ في تحميل البيانات';

                container.innerHTML =
                    '<div class="empty-state">' +
                    '<div class="icon">❌</div>' +
                    '<p>' +
                    escapeHtml(message) +
                    '</p>' +
                    '</div>';
            }

            if (
                error.message &&
                (
                    error.message.includes(
                        'انتهت صلاحية'
                    ) ||
                    error.message.includes(
                        'صلاحية'
                    )
                )
            ) {
                showToast(
                    error.message,
                    'warning'
                );
            }

        } finally {
            isLoading = false;
        }
    }

    /* ============================================================
     * STATS
     * ============================================================ */

    function updateStats(users) {

        const total = users.length;

        const active = users.filter(
            u => u.active !== false
        ).length;

        const inactive = users.filter(
            u => u.active === false
        ).length;

        const admins = users.filter(
            u => u.role === 'admin'
        ).length;

        if ($('totalUsers'))
            $('totalUsers').textContent = total;

        if ($('activeUsers'))
            $('activeUsers').textContent = active;

        if ($('inactiveUsers'))
            $('inactiveUsers').textContent = inactive;

        if ($('adminUsers'))
            $('adminUsers').textContent = admins;
    }

    /* ============================================================
     * RENDER
     * ============================================================ */

    function renderUsers(users) {

        const container =
            $('usersTableContainer');

        if (!container) return;

        if (
            !Array.isArray(users) ||
            users.length === 0
        ) {
            container.innerHTML =
                '<div class="empty-state">' +
                '<div class="icon">📭</div>' +
                '<p>لا توجد مستخدمين</p>' +
                '</div>';

            return;
        }

        const roleMap = {
            admin:
                '<span class="role-badge admin">مسؤول</span>',

            manager:
                '<span class="role-badge manager">مدير</span>',

            operator:
                '<span class="role-badge operator">مشغل</span>',

            viewer:
                '<span class="role-badge viewer">مشاهد</span>'
        };

        let html =
            '<div class="table-container">' +
            '<table class="users-table">' +
            '<thead><tr>' +
            '<th>👤 المستخدم</th>' +
            '<th>📧 البريد الإلكتروني</th>' +
            '<th>👔 الدور</th>' +
            '<th>📊 الحالة</th>' +
            '<th>📅 آخر تسجيل دخول</th>' +
            '<th>⚙️ الإجراءات</th>' +
            '</tr></thead><tbody>';

        users.forEach(user => {

            const id =
                normalizeId(
                    user.id || user._id
                );

            if (!id) return;

            const active =
                user.active !== false;

            let lastLogin = '-';

            if (user.lastLogin) {
                const date =
                    new Date(user.lastLogin);

                if (!Number.isNaN(date.getTime())) {
                    lastLogin =
                        date.toLocaleDateString(
                            'ar-TN'
                        );
                }
            }

            const username =
                user.name ||
                user.username ||
                '-';

            const email =
                user.email ||
                '-';

            const role =
                roleMap[user.role] ||
                escapeHtml(
                    user.role || '-'
                );

            html +=
                '<tr>' +

                '<td><strong>' +
                escapeHtml(username) +
                '</strong></td>' +

                '<td>' +
                escapeHtml(email) +
                '</td>' +

                '<td>' +
                role +
                '</td>' +

                '<td>' +
                (
                    active
                        ? '<span class="status-badge active">✅ نشط</span>'
                        : '<span class="status-badge inactive">❌ غير نشط</span>'
                ) +
                '</td>' +

                '<td>' +
                escapeHtml(lastLogin) +
                '</td>' +

                '<td>' +

                '<button ' +
                'type="button" ' +
                'class="btn-sm btn-edit edit-btn" ' +
                'data-id="' +
                escapeHtml(id) +
                '">' +
                '✏️' +
                '</button> ' +

                '<button ' +
                'type="button" ' +
                'class="btn-sm btn-toggle toggle-btn" ' +
                'data-id="' +
                escapeHtml(id) +
                '" ' +
                'data-status="' +
                String(active) +
                '">' +
                (
                    active
                        ? '🔒'
                        : '🔓'
                ) +
                '</button> ' +

                '<button ' +
                'type="button" ' +
                'class="btn-sm btn-delete delete-btn" ' +
                'data-id="' +
                escapeHtml(id) +
                '">' +
                '🗑️' +
                '</button>' +

                '</td>' +

                '</tr>';
        });

        html +=
            '</tbody></table></div>';

        container.innerHTML = html;

        container
            .querySelectorAll('.edit-btn')
            .forEach(button => {

                button.addEventListener(
                    'click',
                    () =>
                        editUser(
                            button.dataset.id
                        )
                );
            });

        container
            .querySelectorAll('.toggle-btn')
            .forEach(button => {

                button.addEventListener(
                    'click',
                    () =>
                        toggleUserStatus(
                            button.dataset.id,
                            button.dataset.status === 'true'
                        )
                );
            });

        container
            .querySelectorAll('.delete-btn')
            .forEach(button => {

                button.addEventListener(
                    'click',
                    () =>
                        deleteUser(
                            button.dataset.id
                        )
                );
            });
    }

    /* ============================================================
     * FORM
     * ============================================================ */

    function resetForm() {

        if (!$('userForm')) return;

        $('userId').value = '';
        $('userUsername').value = '';
        $('userEmail').value = '';
        $('userPassword').value = '';
        $('userRole').value = 'viewer';
        $('userStatus').value = 'active';

        $('formTitle').textContent =
            '➕ إضافة مستخدم جديد';

        $('passwordRequired').textContent =
            '*';

        [
            'userUsername',
            'userEmail',
            'userPassword'
        ].forEach(id => {
            $(id)?.classList.remove('invalid');
        });
    }

    function openUserForm() {
        $('userForm')?.classList.add('active');
    }

    function closeUserForm() {
        $('userForm')?.classList.remove('active');
        resetForm();
    }

    function toggleUserForm() {

        const form = $('userForm');

        if (!form) return;

        if (form.classList.contains('active')) {
            closeUserForm();
        } else {
            resetForm();
            openUserForm();
        }
    }

    /* ============================================================
     * EDIT
     * ============================================================ */

    function editUser(id) {

        const normalizedId =
            normalizeId(id);

        if (!normalizedId) {
            showToast(
                'معرّف المستخدم غير صالح.',
                'danger'
            );
            return;
        }

        const user =
            usersData.find(
                u =>
                    normalizeId(
                        u.id || u._id
                    ) === normalizedId
            );

        if (!user) {
            showToast(
                'المستخدم غير موجود.',
                'warning'
            );
            return;
        }

        $('formTitle').textContent =
            '✏️ تعديل مستخدم';

        $('userId').value =
            normalizedId;

        $('userUsername').value =
            user.username || '';

        $('userEmail').value =
            user.email || '';

        $('userPassword').value = '';

        $('userRole').value =
            user.role || 'viewer';

        $('userStatus').value =
            user.active !== false
                ? 'active'
                : 'inactive';

        $('passwordRequired').textContent =
            '(اتركها فارغة إذا لم ترد تغييرها)';

        openUserForm();

        $('userUsername')?.focus();
    }

    /* ============================================================
     * FORM VALIDATION
     * ============================================================ */

    function validateForm({
        id,
        username,
        email,
        password
    }) {

        [
            'userUsername',
            'userEmail',
            'userPassword'
        ].forEach(field => {
            $(field)?.classList.remove('invalid');
        });

        if (!isValidUsername(username)) {

            $('userUsername')
                ?.classList.add('invalid');

            showToast(
                'اسم المستخدم غير صالح.',
                'warning'
            );

            return false;
        }

        if (!isValidEmail(email)) {

            $('userEmail')
                ?.classList.add('invalid');

            showToast(
                'البريد الإلكتروني غير صالح.',
                'warning'
            );

            return false;
        }

        /*
         * كلمة المرور مطلوبة عند الإنشاء فقط.
         */
        if (!id && !isStrongEnoughPassword(password)) {

            $('userPassword')
                ?.classList.add('invalid');

            showToast(
                'كلمة المرور يجب أن تكون 12 حرفًا على الأقل.',
                'warning'
            );

            return false;
        }

        /*
         * إذا تم إدخال password أثناء التعديل،
         * يجب أن تستوفي نفس السياسة.
         */
        if (
            id &&
            password &&
            !isStrongEnoughPassword(password)
        ) {

            $('userPassword')
                ?.classList.add('invalid');

            showToast(
                'كلمة المرور الجديدة يجب أن تكون 12 حرفًا على الأقل.',
                'warning'
            );

            return false;
        }

        return true;
    }

    /* ============================================================
     * SAVE
     * ============================================================ */

    async function saveUser() {

        if (isSaving) return;

        const id =
            normalizeId(
                $('userId').value
            );

        const username =
            $('userUsername')
                .value
                .trim();

        const email =
            $('userEmail')
                .value
                .trim();

        const password =
            $('userPassword')
                .value;

        const role =
            $('userRole').value;

        const status =
            $('userStatus').value;

        if (
            !validateForm({
                id,
                username,
                email,
                password
            })
        ) {
            return;
        }

        /*
         * حماية إضافية من تغيير قيم غير متوقعة.
         */
        const allowedRoles = [
            'admin',
            'manager',
            'operator',
            'viewer'
        ];

        if (!allowedRoles.includes(role)) {
            showToast(
                'الدور المحدد غير صالح.',
                'danger'
            );
            return;
        }

        if (
            !['active','inactive']
                .includes(status)
        ) {
            showToast(
                'حالة المستخدم غير صالحة.',
                'danger'
            );
            return;
        }

        /*
         * منع تعديل صلاحيات admin من الواجهة
         * لا يعني منعها أمنيًا؛ server.js يجب أن يفرض ذلك.
         */
        const payload = {
            username,
            email,
            role,
            active: status === 'active'
        };

        if (password) {
            payload.password = password;
        }

        isSaving = true;

        const saveButton =
            $('saveUserBtn');

        if (saveButton) {
            saveButton.disabled = true;
            saveButton.textContent =
                '⏳ جاري الحفظ...';
        }

        try {

            const url =
                id
                    ? `${API_BASE}/${encodeURIComponent(id)}`
                    : API_BASE;

            const response =
                await apiRequest(
                    url,
                    {
                        method: id
                            ? 'PUT'
                            : 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body:
                            JSON.stringify(payload)
                    }
                );

            const data =
                await safeJson(response);

            if (!response.ok) {

                throw new Error(
                    data?.error ||
                    data?.message ||
                    'فشل حفظ المستخدم.'
                );
            }

            showToast(
                id
                    ? 'تم تحديث المستخدم بنجاح.'
                    : 'تم إضافة المستخدم بنجاح.',
                'success'
            );

            closeUserForm();

            await loadUsersData();

        } catch (error) {

            console.error(
                '❌ [USERS] Save error:',
                error
            );

            showToast(
                error.message ||
                'فشل حفظ المستخدم.',
                'danger'
            );

        } finally {

            isSaving = false;

            if (saveButton) {
                saveButton.disabled = false;
                saveButton.textContent =
                    '💾 حفظ';
            }
        }
    }

    /* ============================================================
     * TOGGLE STATUS
     * ============================================================ */

    async function toggleUserStatus(
        id,
        currentStatus
    ) {

        const normalizedId =
            normalizeId(id);

        if (!normalizedId) {
            showToast(
                'معرّف المستخدم غير صالح.',
                'danger'
            );
            return;
        }

        const user =
            usersData.find(
                u =>
                    normalizeId(
                        u.id || u._id
                    ) === normalizedId
            );

        if (!user) {
            showToast(
                'المستخدم غير موجود.',
                'warning'
            );
            return;
        }

        /*
         * حماية واجهة إضافية:
         * لا تسمح بتعطيل آخر admin.
         *
         * لكن server.js يجب أن يفرض ذلك أيضًا.
         */
        if (
            currentStatus &&
            user.role === 'admin'
        ) {

            const activeAdmins =
                usersData.filter(
                    u =>
                        u.role === 'admin' &&
                        u.active !== false
                );

            if (activeAdmins.length <= 1) {
                showToast(
                    'لا يمكن تعطيل آخر مسؤول نشط.',
                    'warning'
                );
                return;
            }
        }

        const action =
            currentStatus
                ? 'تعطيل'
                : 'تفعيل';

        if (
            !window.confirm(
                `⚠️ هل أنت متأكد من ${action} هذا المستخدم؟`
            )
        ) {
            return;
        }

        try {

            const response =
                await apiRequest(
                    `${API_BASE}/${encodeURIComponent(normalizedId)}`,
                    {
                        method: 'PUT',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body:
                            JSON.stringify({
                                active:
                                    !currentStatus
                            })
                    }
                );

            const data =
                await safeJson(response);

            if (!response.ok) {
                throw new Error(
                    data?.error ||
                    data?.message ||
                    'فشل تغيير الحالة.'
                );
            }

            showToast(
                `تم ${action} المستخدم بنجاح.`,
                'success'
            );

            await loadUsersData();

        } catch (error) {

            console.error(
                '❌ [USERS] Toggle error:',
                error
            );

            showToast(
                error.message ||
                'فشل تغيير حالة المستخدم.',
                'danger'
            );
        }
    }

    /* ============================================================
     * DELETE
     * ============================================================ */

    async function deleteUser(id) {

        const normalizedId =
            normalizeId(id);

        if (!normalizedId) {
            showToast(
                'معرّف المستخدم غير صالح.',
                'danger'
            );
            return;
        }

        const user =
            usersData.find(
                u =>
                    normalizeId(
                        u.id || u._id
                    ) === normalizedId
            );

        if (!user) {
            showToast(
                'المستخدم غير موجود.',
                'warning'
            );
            return;
        }

        /*
         * منع حذف آخر admin من الواجهة.
         * يجب أيضًا فرض ذلك في server.js.
         */
        if (user.role === 'admin') {

            const adminCount =
                usersData.filter(
                    u =>
                        u.role === 'admin'
                ).length;

            if (adminCount <= 1) {
                showToast(
                    'لا يمكن حذف آخر مسؤول في النظام.',
                    'warning'
                );
                return;
            }
        }

        const username =
            user.username ||
            user.name ||
            'هذا المستخدم';

        if (
            !window.confirm(
                `⚠️ سيتم حذف "${username}" نهائيًا.\n\nهل أنت متأكد؟`
            )
        ) {
            return;
        }

        try {

            const response =
                await apiRequest(
                    `${API_BASE}/${encodeURIComponent(normalizedId)}`,
                    {
                        method: 'DELETE'
                    }
                );

            const data =
                await safeJson(response);

            if (!response.ok) {
                throw new Error(
                    data?.error ||
                    data?.message ||
                    'فشل حذف المستخدم.'
                );
            }

            showToast(
                'تم حذف المستخدم بنجاح.',
                'success'
            );

            await loadUsersData();

        } catch (error) {

            console.error(
                '❌ [USERS] Delete error:',
                error
            );

            showToast(
                error.message ||
                'فشل حذف المستخدم.',
                'danger'
            );
        }
    }

    /* ============================================================
     * AUTO REFRESH
     * ============================================================ */

    function startAutoRefresh() {

        stopAutoRefresh();

        refreshTimer =
            window.setInterval(
                () => {

                    if (
                        document.hidden ||
                        isLoading ||
                        isSaving ||
                        !pageExists()
                    ) {
                        return;
                    }

                    loadUsersData();

                },
                AUTO_REFRESH_MS
            );
    }

    function stopAutoRefresh() {

        if (refreshTimer !== null) {

            window.clearInterval(
                refreshTimer
            );

            refreshTimer = null;
        }
    }

    /* ============================================================
     * INITIALIZATION
     * ============================================================ */

    function init() {

        if (!pageExists()) return;

        console.log(
            '👥 Users v4.0 initializing...'
        );

        $('addUserBtn')
            ?.addEventListener(
                'click',
                toggleUserForm
            );

        $('refreshUsersBtn')
            ?.addEventListener(
                'click',
                async () => {

                    if (isLoading) return;

                    showToast(
                        '🔄 جاري تحديث البيانات...',
                        'info'
                    );

                    await loadUsersData();
                }
            );

        $('formCloseBtn')
            ?.addEventListener(
                'click',
                closeUserForm
            );

        $('cancelUserBtn')
            ?.addEventListener(
                'click',
                closeUserForm
            );

        $('saveUserBtn')
            ?.addEventListener(
                'click',
                saveUser
            );

        /*
         * منع إرسال form عند الضغط Enter
         * إذا كان هناك form خارجي.
         */
        $('userForm')
            ?.addEventListener(
                'keydown',
                event => {

                    if (
                        event.key === 'Enter' &&
                        event.target.tagName !== 'TEXTAREA'
                    ) {
                        event.preventDefault();
                    }
                }
            );

        /*
         * تحميل أولي.
         */
        loadUsersData();

        startAutoRefresh();

        /*
         * إذا رجع المستخدم للصفحة.
         */
        document.addEventListener(
            'visibilitychange',
            () => {

                if (
                    !document.hidden &&
                    pageExists() &&
                    !isLoading
                ) {
                    loadUsersData();
                }
            }
        );

        console.log(
            '✅ Users v4.0 initialized'
        );
    }

    /* ============================================================
     * CLEANUP
     * ============================================================ */

    function cleanup() {

        stopAutoRefresh();

        if (
            currentAbortController
        ) {
            currentAbortController.abort();
            currentAbortController = null;
        }
    }

    /*
     * SPA compatibility.
     *
     * إذا كان التطبيق يستخدم navigation داخلي،
     * يمكن استدعاء:
     *
     * window.cleanupUsersPage()
     */
    window.cleanupUsersPage = cleanup;

    /* ============================================================
     * GLOBAL COMPATIBILITY
     * ============================================================ */

    window.usersData = usersData;
    window.loadUsersData = loadUsersData;
    window.renderUsers = renderUsers;
    window.updateStats = updateStats;
    window.toggleUserForm = toggleUserForm;
    window.saveUser = saveUser;
    window.editUser = editUser;
    window.toggleUserStatus = toggleUserStatus;
    window.deleteUser = deleteUser;
    window.showToast = showToast;
    window.getToken = getToken;

    /*
     * SPA قد يحمّل الصفحة بعد DOMContentLoaded.
     */
    if (document.readyState === 'loading') {
        document.addEventListener(
            'DOMContentLoaded',
            init,
            { once: true }
        );
    } else {
        init();
    }

})();
</script>

</div>
