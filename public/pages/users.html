    <!-- ============================================================

    <script>
    // ============================================================
    // 🛠️ FIX: دالة updateDateTime بدون أخطاء - النسخة النهائية
    // ============================================================
    
    // ✅ حفظ الدالة الأصلية إذا كانت موجودة
    var originalUpdateDateTime = window.updateDateTime;
    
    // ✅ تعريف دالة آمنة جديدة
    function safeUpdateDateTime() {
        try {
            var now = new Date();
            var dateEl = document.getElementById('currentDate');
            var timeEl = document.getElementById('currentTime');
            
            if (dateEl) {
                dateEl.textContent = now.toLocaleDateString('ar-TN', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }
            if (timeEl) {
                timeEl.textContent = now.toLocaleTimeString('ar-TN', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }
        } catch (e) {
            // ✅ تجاهل جميع الأخطاء - لا تؤثر على التطبيق
            console.debug('⏰ updateDateTime (safe):', e.message);
        }
    }
    
    // ✅ استبدال الدالة العالمية بالنسخة الآمنة
    window.updateDateTime = safeUpdateDateTime;
    
    // ✅ تشغيل التحديث فوراً
    safeUpdateDateTime();
    
    // ✅ إيقاف التحديثات القديمة إن وجدت
    if (window._dateTimeInterval) {
        clearInterval(window._dateTimeInterval);
        window._dateTimeInterval = null;
    }
    
    // ✅ بدء تحديث جديد كل دقيقة (بدلاً من كل ثانية لتقليل الحمل)
    window._dateTimeInterval = setInterval(safeUpdateDateTime, 60000);
    
    console.log('⏰ Users page: updateDateTime fixed');

    // ============================================================
    // 👥 USERS PAGE - v1.0 (FIXED - LOADS DATA DIRECTLY)
    // ============================================================

    // ✅ المتغيرات
    var usersData = [];
    var currentUser = window.currentUser || null;
    var isLoading = false;

    console.log('👥 Users page loaded');
    console.log('👤 Current user:', currentUser?.name || 'Unknown');

    // ============================================================
    // 1. HELPERS
    // ============================================================

    function getToken() {
        var token = localStorage.getItem('authToken') || 
                     localStorage.getItem('marine_token') || 
                     localStorage.getItem('token');
        if (!token) {
            console.warn('⚠️ No token found');
            return null;
        }
        return token;
    }

    function showToast(message, type) {
        type = type || 'info';
        var container = document.getElementById('toastContainer');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'toast-container';
            document.body.appendChild(container);
        }

        var toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.innerHTML = '<span class="toast-icon">' + (type === 'success' ? '✅' : type === 'warning' ? '⚠️' : type === 'danger' ? '❌' : 'ℹ️') + '</span> <span>' + message + '</span> <button class="toast-close" onclick="this.parentElement.remove()">✕</button>';
        container.appendChild(toast);

        setTimeout(function() {
            if (toast.parentElement) toast.remove();
        }, 5000);
    }

    // ============================================================
    // 2. LOAD DATA - MAIN FUNCTION (FIXED)
    // ============================================================

    async function loadUsersData() {
        // ✅ منع التحميل المتكرر
        if (isLoading) {
            console.log('⏳ [USERS] Already loading...');
            return;
        }
        
        console.log('🔄 [USERS] Loading users data...');
        isLoading = true;
        
        try {
            var token = getToken();
            if (!token) {
                var container = document.getElementById('usersTableContainer');
                if (container) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>يرجى تسجيل الدخول أولاً</p></div>';
                }
                isLoading = false;
                return;
            }

            // ✅ الحصول على CSRF token
            var csrfRes = await fetch('/api/csrf-token', {
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            });
            var csrfData = await csrfRes.json();
            var csrfToken = csrfData.token || '';

            // ✅ جلب البيانات مباشرة من API
            var response = await fetch('/api/users', {
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'X-CSRF-Token': csrfToken,
                    'Accept': 'application/json'
                },
                credentials: 'include'
            });

            // ✅ تحديث CSRF token
            var newCsrfToken = response.headers.get('X-CSRF-Token');
            if (newCsrfToken) {
                localStorage.setItem('csrf_token', newCsrfToken);
            }

            if (response.ok) {
                var data = await response.json();
                
                // ✅ معالجة البيانات بشكل صحيح
                if (data.users && Array.isArray(data.users)) {
                    usersData = data.users;
                } else if (Array.isArray(data)) {
                    usersData = data;
                } else if (data.data && Array.isArray(data.data)) {
                    usersData = data.data;
                } else {
                    usersData = [];
                }
                
                // ✅ تحديث المتغير العام
                window.allUsers = usersData;
                
                console.log('✅ [USERS] Users loaded successfully:', usersData.length);
                
                // ✅ عرض البيانات
                renderUsers(usersData);
                updateStats(usersData);
                updateBadge('usersBadge', usersData.length);
                
            } else if (response.status === 401) {
                console.warn('⚠️ [USERS] Unauthorized - token expired');
                localStorage.removeItem('authToken');
                localStorage.removeItem('marine_token');
                localStorage.removeItem('token');
                var container = document.getElementById('usersTableContainer');
                if (container) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">🔒</div><p>انتهت صلاحية الجلسة، يرجى تسجيل الدخول مرة أخرى</p></div>';
                }
            } else {
                console.error('❌ [USERS] API error:', response.status);
                var container = document.getElementById('usersTableContainer');
                if (container) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">❌</div><p>فشل تحميل البيانات (Error: ' + response.status + ')</p></div>';

        } catch (error) {
            console.error('❌ [USERS] Load error:', error);

            if (container) {
                container.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>خطأ في الاتصال بالخادم</p></div>';

    }

    function updateBadge(id, count) {

    // ============================================================
    // 3. RENDER FUNCTIONS

    function updateStats(users) {
        var total = users.length;
        var active = users.filter(function(u) { return u.active !== false; }).length;
        var inactive = users.filter(function(u) { return u.active === false; }).length;
        var admins = users.filter(function(u) { return u.role === 'admin'; }).length;

        var totalEl = document.getElementById('totalUsers');
        var activeEl = document.getElementById('activeUsers');
        var inactiveEl = document.getElementById('inactiveUsers');
        var adminEl = document.getElementById('adminUsers');
        
        if (totalEl) totalEl.textContent = total;
        if (activeEl) activeEl.textContent = active;
        if (inactiveEl) inactiveEl.textContent = inactive;
        if (adminEl) adminEl.textContent = admins;
    }

    function renderUsers(users) {
        var container = document.getElementById('usersTableContainer');
        if (!container) return;
        
        if (!users || users.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>لا توجد مستخدمين</p></div>';
            return;
        }

        var html = '<div class="table-container"><table class="users-table"><thead><tr>';
        html += '<th>👤 المستخدم</th>';
        html += '<th>📧 البريد الإلكتروني</th>';
        html += '<th>👔 الدور</th>';
        html += '<th>📊 الحالة</th>';
        html += '<th>📅 آخر تسجيل دخول</th>';
        html += '<th>⚙️ الإجراءات</th>';
        html += '</tr></thead><tbody>';

        users.forEach(function(u) {
            var roleMap = {
                'admin': '<span class="role-badge admin">مسؤول</span>',
                'manager': '<span class="role-badge manager">مدير</span>',
                'operator': '<span class="role-badge operator">مشغل</span>',
                'viewer': '<span class="role-badge viewer">مشاهد</span>'
            };

            var statusMap = {
                true: '<span class="status-badge active">✅ نشط</span>',
                false: '<span class="status-badge inactive">❌ غير نشط</span>'
            };

            var isActive = u.active !== false;
            var lastLogin = u.lastLogin ? new Date(u.lastLogin).toLocaleDateString('ar-TN') : '-';

            html += '<tr>';
            html += '<td><strong>' + (u.name || u.username || '-') + '</strong></td>';
            html += '<td>' + (u.email || '-') + '</td>';
            html += '<td>' + (roleMap[u.role] || u.role || '-') + '</td>';
            html += '<td>' + (statusMap[isActive] || '-') + '</td>';
            html += '<td>' + lastLogin + '</td>';
            html += '<td>';
            html += '<button class="btn-sm btn-edit edit-btn" data-id="' + (u.id) + '">✏️</button> ';
            html += '<button class="btn-sm btn-toggle toggle-btn" data-id="' + (u.id) + '" data-status="' + isActive + '">' + (isActive ? '🔒' : '🔓') + '</button> ';
            html += '<button class="btn-sm btn-delete delete-btn" data-id="' + (u.id) + '">🗑️</button>';
            html += '</td>';
            html += '</tr>';
        });

        html += '</tbody></table></div>';
        container.innerHTML = html;

        // ربط الأحداث بأمان
        container.querySelectorAll('.edit-btn').forEach(function(btn) {
            btn.onclick = function() { 
                var id = this.dataset.id;
                if (id) editUser(id); 
            };
        });
        container.querySelectorAll('.toggle-btn').forEach(function(btn) {
            btn.onclick = function() { 
                var id = this.dataset.id;
                var status = this.dataset.status === 'true';
                if (id) toggleUserStatus(id, status); 
            };
        });
        container.querySelectorAll('.delete-btn').forEach(function(btn) {
            btn.onclick = function() { 
                var id = this.dataset.id;
                if (id) deleteUser(id); 
            };
        });
    }

    // ============================================================
    // 4. CRUD OPERATIONS
    // ============================================================

    function toggleUserForm() {
        var form = document.getElementById('userForm');
        if (!form) return;
        
        var isActive = form.classList.contains('active');
        
        if (isActive) {
            form.classList.remove('active');
            var titleEl = document.getElementById('formTitle');
            if (titleEl) titleEl.textContent = '➕ إضافة مستخدم جديد';
            document.getElementById('userId').value = '';
            document.getElementById('userUsername').value = '';
            document.getElementById('userEmail').value = '';
            document.getElementById('userPassword').value = '';
            document.getElementById('userRole').value = 'viewer';
            document.getElementById('userStatus').value = 'active';
            var passReq = document.getElementById('passwordRequired');
            if (passReq) passReq.textContent = '*';
        } else {
            form.classList.add('active');
        }
    }

    function editUser(id) {
        if (!id) return;
        var user = usersData.find(function(u) { return u.id == id; });
        if (!user) {
            showToast('⚠️ المستخدم غير موجود', 'warning');
            return;
        }

        var titleEl = document.getElementById('formTitle');
        if (titleEl) titleEl.textContent = '✏️ تعديل مستخدم';
        document.getElementById('userId').value = user.id;
        document.getElementById('userUsername').value = user.username || '';
        document.getElementById('userEmail').value = user.email || '';
        document.getElementById('userPassword').value = '';
        document.getElementById('userRole').value = user.role || 'viewer';
        document.getElementById('userStatus').value = user.active !== false ? 'active' : 'inactive';
        var passReq = document.getElementById('passwordRequired');
        if (passReq) passReq.textContent = '(اتركها فارغة لتعديل)';

        var form = document.getElementById('userForm');
        if (form) form.classList.add('active');
    }

    async function saveUser() {
        var id = document.getElementById('userId').value;
        var username = document.getElementById('userUsername').value.trim();
        var email = document.getElementById('userEmail').value.trim();
        var password = document.getElementById('userPassword').value;
        var role = document.getElementById('userRole').value;
        var status = document.getElementById('userStatus').value;

        if (!username) { showToast('⚠️ الرجاء إدخال اسم المستخدم', 'warning'); return; }
        if (!email) { showToast('⚠️ الرجاء إدخال البريد الإلكتروني', 'warning'); return; }
        if (!id && !password) { showToast('⚠️ الرجاء إدخال كلمة المرور', 'warning'); return; }

        var token = getToken();
        if (!token) {
            showToast('⚠️ الرجاء تسجيل الدخول مرة أخرى', 'warning');
            return;
        }

        var data = {
            username: username,
            email: email,
            role: role,
            active: status === 'active'
        };

        if (password) {
            data.password = password;
        }

        try {
            // ✅ الحصول على CSRF token
            var csrfRes = await fetch('/api/csrf-token', {
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            });
            var csrfData = await csrfRes.json();
            var csrfToken = csrfData.token || '';

            var url = id ? '/api/users/' + id : '/api/users';
            var method = id ? 'PUT' : 'POST';

            var response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token,
                    'X-CSRF-Token': csrfToken,
                    'Accept': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                var error = await response.json();
                throw new Error(error.error || error.message || 'فشل الحفظ');
            }

            showToast('✅ ' + (id ? 'تم تحديث' : 'تم إضافة') + ' المستخدم بنجاح', 'success');
            toggleUserForm();
            await loadUsersData();
        } catch (error) {
            console.error('❌ Save user error:', error);
            showToast('❌ ' + error.message, 'danger');
        }
    }

    async function toggleUserStatus(id, currentStatus) {
        if (!id) return;
        var action = currentStatus ? 'تعطيل' : 'تفعيل';
        if (!confirm('⚠️ هل أنت متأكد من ' + action + ' هذا المستخدم؟')) return;

        var token = getToken();
        if (!token) {
            showToast('⚠️ الرجاء تسجيل الدخول مرة أخرى', 'warning');
            return;
        }

        try {
            // ✅ الحصول على CSRF token
            var csrfRes = await fetch('/api/csrf-token', {
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            });
            var csrfData = await csrfRes.json();
            var csrfToken = csrfData.token || '';

            var response = await fetch('/api/users/' + id, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token,
                    'X-CSRF-Token': csrfToken,
                    'Accept': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({ active: !currentStatus })
            });

            if (!response.ok) {
                var error = await response.json();
                throw new Error(error.error || error.message || 'فشل التغيير');
            }

            showToast('✅ تم ' + action + ' المستخدم بنجاح', 'success');
            await loadUsersData();
        } catch (error) {
            console.error('❌ Toggle user error:', error);
            showToast('❌ ' + error.message, 'danger');
        }
    }

    async function deleteUser(id) {
        if (!id) return;
        if (!confirm('⚠️ هل أنت متأكد من حذف هذا المستخدم؟')) return;

        var token = getToken();
        if (!token) {
            showToast('⚠️ الرجاء تسجيل الدخول مرة أخرى', 'warning');
            return;
        }

        try {
            // ✅ الحصول على CSRF token
            var csrfRes = await fetch('/api/csrf-token', {
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            });
            var csrfData = await csrfRes.json();
            var csrfToken = csrfData.token || '';

            var response = await fetch('/api/users/' + id, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'X-CSRF-Token': csrfToken,
                    'Accept': 'application/json'
                },
                credentials: 'include'
            });

            if (!response.ok) {
                var error = await response.json();
                throw new Error(error.error || error.message || 'فشل الحذف');
            }

            showToast('✅ تم حذف المستخدم', 'success');
            await loadUsersData();
        } catch (error) {
            console.error('❌ Delete user error:', error);
            showToast('❌ ' + error.message, 'danger');
        }
    }
