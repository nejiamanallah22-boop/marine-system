<div id="page-users">
    <style>
        /* ===== الأنماط ===== (نفس ما سبق، تم حذف التكرار للاختصار) */
        /* ... يرجى إعادة استخدام الأنماط من النسخة السابقة ... */
        /* (لن أكررها هنا لتوفير المساحة، لكن يمكنك نسخها من الرد السابق) */
    </style>

    <!-- ===== HEADER ===== (نفس السابق) -->
    ...

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. 🔧 التكوين – غيّر هذه القيم حسب خادمك
            // ============================================================

            var API_BASE = '/api';               // الأساسي للـ API
            var USERS_PATH = '/users';           // ⚠️ غيّر هذا إلى المسار الصحيح للمستخدمين
            // جرب: '/auth/register' أو '/admin/users' أو '/v1/users'

            // ============================================================
            // 2. دوال مساعدة
            // ============================================================

            function getToken() {
                return localStorage.getItem('marine_token') ||
                       localStorage.getItem('token') ||
                       localStorage.getItem('accessToken') ||
                       localStorage.getItem('authToken') ||
                       null;
            }

            function getAuthHeaders() {
                var token = getToken();
                return {
                    'Content-Type': 'application/json',
                    'Authorization': token ? 'Bearer ' + token : ''
                };
            }

            function $(id) { return document.getElementById(id); }

            function showToast(msg, type) {
                type = type || 'info';
                var old = document.querySelector('#page-users .toast');
                if (old) old.remove();
                var el = document.createElement('div');
                el.className = 'toast toast-' + type;
                el.textContent = msg;
                document.body.appendChild(el);
                setTimeout(function() {
                    el.style.opacity = '0';
                    el.style.transform = 'translateY(20px)';
                    el.style.transition = 'all 0.4s';
                    setTimeout(function() { el.remove(); }, 2800);
                }, 2800);
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            // ============================================================
            // 3. API Client – مع عرض تفاصيل الخطأ والمسار المستخدم
            // ============================================================

            function apiFetch(url, options) {
                options = options || {};
                var method = options.method || 'GET';
                var body = options.body;
                var silent = options.silent === true;

                // بناء المسار الكامل (باستخدام USERS_PATH)
                var fullUrl = API_BASE + url;
                console.log('📡 طلب API:', fullUrl, method);

                return fetch(fullUrl, {
                    method: method,
                    headers: getAuthHeaders(),
                    body: body !== undefined ? JSON.stringify(body) : undefined
                })
                .then(function(response) {
                    return response.text().then(function(text) {
                        var data;
                        try {
                            data = JSON.parse(text);
                        } catch(e) {
                            data = { message: text || 'استجابة غير صالحة' };
                        }

                        if (!response.ok) {
                            var errorMsg = data.error || data.message || 'فشل الطلب';
                            var error = new Error(errorMsg + ' (كود ' + response.status + ')');
                            error.status = response.status;
                            error.data = data;
                            throw error;
                        }
                        return data;
                    });
                })
                .catch(function(error) {
                    if (!silent) {
                        var msg = '❌ ' + error.message;
                        if (error.status === 401) msg = '⚠️ انتهت صلاحية الجلسة، يرجى تسجيل الدخول مجدداً';
                        else if (error.status === 403) msg = '⛔ ليس لديك صلاحية لهذه العملية';
                        else if (error.status === 404) msg = '⚠️ المسار غير موجود: ' + fullUrl + '\nتأكد من قيمة USERS_PATH في الكود';
                        else if (error.status === 422) msg = '⚠️ بيانات غير صالحة: ' + (error.data && error.data.error || '');
                        else if (error.status === 500) msg = '⚠️ خطأ في الخادم الداخلي (500)';
                        showToast(msg, 'error');
                        console.error('خطأ API:', error);
                    }
                    throw error;
                });
            }

            // ============================================================
            // 4. State
            // ============================================================

            var state = {
                users: [],
                currentEditId: null,
                currentPage: 1,
                pageSize: 15
            };

            // ============================================================
            // 5. جلب المستخدمين وعرضهم
            // ============================================================

            function loadUsers() {
                var tbody = $('usersBody');
                if (tbody) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:rgba(255,255,255,0.15);">⏳ جاري التحميل...</td></tr>';
                }

                var token = getToken();
                if (!token) {
                    showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
                    if (tbody) {
                        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#fbbf24;">🔑 يرجى تسجيل الدخول لعرض المستخدمين</td></tr>';
                    }
                    return;
                }

                // استخدام USERS_PATH في الطلب
                apiFetch(USERS_PATH, { silent: true })
                    .then(function(data) {
                        var users = Array.isArray(data) ? data : (data.users || []);
                        state.users = users;
                        updateStats();
                        renderTable();
                        showToast('✅ تم تحميل ' + users.length + ' مستخدم', 'success');
                    })
                    .catch(function(error) {
                        if (tbody) {
                            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#f87171;">❌ ' + escapeHtml(error.message) + '</td></tr>';
                        }
                    });
            }

            function updateStats() {
                var total = state.users.length;
                var active = state.users.filter(function(u) { return u.isActive !== false; }).length;
                var inactive = total - active;
                var admins = state.users.filter(function(u) { return u.role === 'admin' || u.role === 'super_admin'; }).length;
                var verified = state.users.filter(function(u) { return u.faceVerified === true; }).length;

                if ($('totalUsers')) $('totalUsers').textContent = total;
                if ($('activeUsers')) $('activeUsers').textContent = active;
                if ($('inactiveUsers')) $('inactiveUsers').textContent = inactive;
                if ($('adminUsers')) $('adminUsers').textContent = admins;
                if ($('verifiedUsers')) $('verifiedUsers').textContent = verified;
                if ($('usersBadge')) $('usersBadge').textContent = '👥 ' + total;
            }

            function getFilteredUsers() {
                var search = ($('searchUser') ? $('searchUser').value : '').trim().toLowerCase();
                var statusFilter = $('fStatusUser') ? $('fStatusUser').value : 'الكل';
                var roleFilter = $('fRoleUser') ? $('fRoleUser').value : 'الكل';

                return state.users.filter(function(u) {
                    if (search) {
                        var nameMatch = (u.name || '').toLowerCase().indexOf(search) !== -1;
                        var emailMatch = (u.email || '').toLowerCase().indexOf(search) !== -1;
                        if (!nameMatch && !emailMatch) return false;
                    }
                    if (statusFilter !== 'الكل') {
                        var isActive = u.isActive !== false;
                        if (statusFilter === 'نشط' && !isActive) return false;
                        if (statusFilter === 'غير نشط' && isActive) return false;
                    }
                    if (roleFilter !== 'الكل' && u.role !== roleFilter) return false;
                    return true;
                });
            }

            function renderTable() {
                var tbody = $('usersBody');
                if (!tbody) return;

                var filtered = getFilteredUsers();
                var totalPages = Math.ceil(filtered.length / state.pageSize) || 1;
                if (state.currentPage > totalPages) state.currentPage = totalPages;
                if (state.currentPage < 1) state.currentPage = 1;

                var start = (state.currentPage - 1) * state.pageSize;
                var pageItems = filtered.slice(start, start + state.pageSize);

                if (pageItems.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:rgba(255,255,255,0.15);">🔍 لا توجد نتائج</td></tr>';
                    return;
                }

                var html = '';
                pageItems.forEach(function(u, i) {
                    var idx = start + i + 1;
                    var isActive = u.isActive !== false;
                    var roleLabel = {
                        super_admin: 'سوبر أدمن',
                        admin: 'مدير',
                        user: 'مستخدم',
                        operator: 'مشغل',
                        viewer: 'مشاهد'
                    }[u.role] || u.role;

                    var roleClass = u.role || 'user';
                    var verified = u.faceVerified === true;
                    var verifiedHtml = verified
                        ? '<span style="color:#4ade80;"><i class="fas fa-check-circle"></i> موثق</span>'
                        : '<span style="color:#f87171;"><i class="fas fa-times-circle"></i> غير موثق</span>';

                    html += '<tr>' +
                        '<td style="color:#60a5fa;">' + idx + '</td>' +
                        '<td class="user-name">' + escapeHtml(u.name || '-') + '</td>' +
                        '<td style="font-size:0.7rem;color:rgba(255,255,255,0.4);">' + escapeHtml(u.email || '-') + '</td>' +
                        '<td style="font-size:0.7rem;">' + escapeHtml(u.unit || '-') + '</td>' +
                        '<td><span class="status-badge ' + roleClass + '">' + roleLabel + '</span></td>' +
                        '<td><span class="status-badge ' + (isActive ? 'active' : 'inactive') + '">' + (isActive ? '🟢 نشط' : '🔴 غير نشط') + '</span></td>' +
                        '<td>' + verifiedHtml + '</td>' +
                        '<td>' +
                            '<button class="action-btn edit" data-action="edit" data-id="' + (u._id || u.id) + '"><i class="fas fa-edit"></i></button>' +
                            '<button class="action-btn password" data-action="password" data-id="' + (u._id || u.id) + '"><i class="fas fa-key"></i></button>' +
                            '<button class="action-btn face" data-action="face" data-id="' + (u._id || u.id) + '"><i class="fas fa-camera"></i></button>' +
                            '<button class="action-btn delete" data-action="delete" data-id="' + (u._id || u.id) + '"><i class="fas fa-trash"></i></button>' +
                        '</td>' +
                    '</tr>';
                });

                tbody.innerHTML = html;
            }

            // ============================================================
            // 6. إضافة / تعديل / حذف / تغيير كلمة المرور / توثيق الوجه
            // ============================================================

            function clearFieldErrors() {
                document.querySelectorAll('#userModal .field-error').forEach(function(el) { el.classList.remove('visible'); });
                document.querySelectorAll('#userModal input, #userModal select').forEach(function(el) { el.classList.remove('invalid'); });
            }

            function showFieldError(fieldId) {
                var errEl = $('err-' + fieldId);
                var inputEl = $(fieldId);
                if (errEl) errEl.classList.add('visible');
                if (inputEl) inputEl.classList.add('invalid');
            }

            function openAddModal() {
                state.currentEditId = null;
                clearFieldErrors();
                $('editUserId').value = '';
                $('modalTitle').textContent = '➕ إضافة مستخدم جديد';
                $('userName').value = '';
                $('userEmail').value = '';
                $('userPassword').value = '';
                $('userPassword').placeholder = '********';
                $('userUnit').value = '';
                $('userRole').value = 'user';
                $('userStatus').value = 'نشط';
                $('passwordRequired').textContent = '*';
                openModal('userModal');
                $('userName').focus();
            }

            function openEditModal(id) {
                var user = state.users.find(function(u) { return (u._id || u.id) === id; });
                if (!user) {
                    showToast('⚠️ المستخدم غير موجود', 'error');
                    return;
                }
                state.currentEditId = id;
                clearFieldErrors();
                $('editUserId').value = id;
                $('modalTitle').textContent = '✏️ تعديل المستخدم: ' + user.name;
                $('userName').value = user.name || '';
                $('userEmail').value = user.email || '';
                $('userPassword').value = '';
                $('userPassword').placeholder = 'اترك فارغاً للحفاظ على كلمة المرور';
                $('userUnit').value = user.unit || '';
                $('userRole').value = user.role || 'user';
                $('userStatus').value = user.isActive !== false ? 'نشط' : 'غير نشط';
                $('passwordRequired').textContent = '';
                openModal('userModal');
                $('userName').focus();
            }

            function validateUserForm(editId, name, email, password) {
                clearFieldErrors();
                var valid = true;
                if (!name || name.trim().length < 2) { showFieldError('userName'); valid = false; }
                if (!email || !isValidEmail(email)) { showFieldError('userEmail'); valid = false; }
                if (!$('userUnit').value) { showFieldError('userUnit'); valid = false; }
                if (!editId && (!password || password.length < 8)) { showFieldError('userPassword'); valid = false; }
                if (editId && password && password.length > 0 && password.length < 8) { showFieldError('userPassword'); valid = false; }
                return valid;
            }

            function saveUser() {
                var name = $('userName').value.trim();
                var email = $('userEmail').value.trim();
                var password = $('userPassword').value;
                var unit = $('userUnit').value;
                var role = $('userRole').value;
                var status = $('userStatus').value;
                var editId = $('editUserId').value;

                if (!validateUserForm(editId, name, email, password)) {
                    showToast('⚠️ يرجى تصحيح الحقول المميزة بالأحمر', 'error');
                    return;
                }

                var btn = $('modalSave');
                var originalText = btn.textContent;
                btn.disabled = true;
                btn.textContent = '⏳ جاري الحفظ...';

                var url = USERS_PATH;  // استخدام المسار المخصص
                var method = 'POST';
                var body = {
                    name: name,
                    email: email,
                    password: password,
                    unit: unit,
                    role: role,
                    isActive: status === 'نشط'
                };

                if (editId) {
                    url = USERS_PATH + '/' + editId;
                    method = 'PUT';
                    body = { name: name, email: email, unit: unit, role: role, isActive: status === 'نشط' };
                    if (password && password.length >= 8) body.password = password;
                }

                apiFetch(url, { method: method, body: body })
                    .then(function() {
                        showToast(editId ? '✅ تم تحديث المستخدم' : '✅ تم إضافة المستخدم', 'success');
                        closeModal('userModal');
                        loadUsers();
                    })
                    .catch(function(error) {
                        console.error('فشل حفظ المستخدم:', error);
                    })
                    .finally(function() {
                        btn.disabled = false;
                        btn.textContent = originalText;
                    });
            }

            function deleteUser(id) {
                var user = state.users.find(function(u) { return (u._id || u.id) === id; });
                if (!user) return;
                if (!confirm('⚠️ هل أنت متأكد من حذف المستخدم "' + user.name + '"؟')) return;

                apiFetch(USERS_PATH + '/' + id, { method: 'DELETE' })
                    .then(function() {
                        showToast('🗑️ تم حذف المستخدم', 'success');
                        loadUsers();
                    })
                    .catch(function() {});
            }

            function changePassword(id) {
                var user = state.users.find(function(u) { return (u._id || u.id) === id; });
                if (!user) { showToast('⚠️ المستخدم غير موجود', 'error'); return; }

                var newPass = prompt('🔑 أدخل كلمة المرور الجديدة لـ ' + user.name + ' (8 أحرف على الأقل)');
                if (!newPass) return;
                if (newPass.length < 8) { showToast('⚠️ كلمة المرور قصيرة جداً', 'error'); return; }

                apiFetch(USERS_PATH + '/' + id + '/password', {
                    method: 'POST',
                    body: { password: newPass }
                })
                .then(function() {
                    showToast('✅ تم تغيير كلمة المرور', 'success');
                })
                .catch(function() {});
            }

            function verifyFace(id) {
                var user = state.users.find(function(u) { return (u._id || u.id) === id; });
                if (!user) { showToast('⚠️ المستخدم غير موجود', 'error'); return; }

                if (confirm('📸 هل تريد توثيق وجه المستخدم "' + user.name + '"؟ سيتم تعيينه موثقاً.')) {
                    apiFetch(USERS_PATH + '/' + id + '/face-verification', {
                        method: 'POST',
                        body: { image: 'data:image/jpeg;base64,fake_face_data' }
                    })
                    .then(function() {
                        user.faceVerified = true;
                        updateStats();
                        renderTable();
                        showToast('✅ تم توثيق وجه المستخدم', 'success');
                    })
                    .catch(function() {});
                }
            }

            // ============================================================
            // 7. Modal helpers
            // ============================================================

            function openModal(id) {
                var modal = $(id);
                if (modal) modal.classList.add('visible');
            }

            function closeModal(id) {
                var modal = $(id);
                if (modal) modal.classList.remove('visible');
            }

            // ============================================================
            // 8. الفلترة والبحث
            // ============================================================

            function applyFilters() {
                state.currentPage = 1;
                renderTable();
            }

            function resetFilters() {
                if ($('searchUser')) $('searchUser').value = '';
                if ($('fStatusUser')) $('fStatusUser').value = 'الكل';
                if ($('fRoleUser')) $('fRoleUser').value = 'الكل';
                state.currentPage = 1;
                renderTable();
                showToast('✅ تم إلغاء الفلاتر', 'success');
            }

            // ============================================================
            // 9. ربط الأحداث
            // ============================================================

            function initEvents() {
                if ($('refreshBtn')) $('refreshBtn').addEventListener('click', loadUsers);
                if ($('addUserBtn')) $('addUserBtn').addEventListener('click', openAddModal);
                if ($('filterBtn')) $('filterBtn').addEventListener('click', applyFilters);
                if ($('resetBtn')) $('resetBtn').addEventListener('click', resetFilters);

                if ($('searchUser')) {
                    $('searchUser').addEventListener('input', function() {
                        clearTimeout(this._timer);
                        this._timer = setTimeout(function() { applyFilters(); }, 300);
                    });
                }

                if ($('fStatusUser')) $('fStatusUser').addEventListener('change', applyFilters);
                if ($('fRoleUser')) $('fRoleUser').addEventListener('change', applyFilters);

                if ($('modalClose')) $('modalClose').addEventListener('click', function() { closeModal('userModal'); });
                if ($('modalCancel')) $('modalCancel').addEventListener('click', function() { closeModal('userModal'); });
                if ($('modalSave')) $('modalSave').addEventListener('click', saveUser);

                var modal = $('userModal');
                if (modal) {
                    modal.addEventListener('click', function(e) {
                        if (e.target === this) closeModal('userModal');
                    });
                }

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        var visibleModal = document.querySelector('#page-users .modal-overlay.visible');
                        if (visibleModal) closeModal(visibleModal.id);
                    }
                });

                var tbody = $('usersBody');
                if (tbody) {
                    tbody.addEventListener('click', function(e) {
                        var btn = e.target.closest('[data-action]');
                        if (!btn) return;
                        var id = btn.dataset.id;
                        if (!id) return;
                        var action = btn.dataset.action;
                        if (action === 'edit') openEditModal(id);
                        else if (action === 'password') changePassword(id);
                        else if (action === 'face') verifyFace(id);
                        else if (action === 'delete') deleteUser(id);
                    });
                }
            }

            // ============================================================
            // 10. التهيئة
            // ============================================================

            function init() {
                if (!getToken()) {
                    showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
                }
                loadUsers();
                initEvents();
                console.log('✅ صفحة المستخدمين جاهزة مع المسار:', USERS_PATH);
                console.log('🔧 لتغيير المسار، عدّل المتغير USERS_PATH في أعلى الكود.');
            }

            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                init();
            } else {
                document.addEventListener('DOMContentLoaded', init);
            }
        })();
    </script>
</div>
