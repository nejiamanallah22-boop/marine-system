<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محروقات الوسيلة — الأسطول البحري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════ */
/* 🎨 BASE & VARIABLES (نفس متغيرات صفحة الطاقم) */
/* ═══════════════════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --gold-1: #f7d774; --gold-2: #e6b31e; --gold-3: #b8860b;
    --navy-1: #0a1e38; --navy-2: #14304f;
    --emerald: #10b981; --red: #ef4444; --blue: #3b82f6;
    --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0;
    --slate-500: #64748b; --slate-600: #475569; --slate-700: #334155; --slate-900: #0f172a;
    --radius: 16px; --radius-sm: 11px; --radius-lg: 22px;
    --font: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    --shadow-md: 0 6px 24px rgba(10, 30, 56, 0.10);
}
body {
    font-family: var(--font);
    background: linear-gradient(135deg, #eef2f7 0%, #f8fafc 50%, #eef2f7 100%);
    color: var(--slate-900); min-height: 100vh; direction: rtl; padding: 20px;
}
.container { max-width: 1600px; margin: 0 auto; }

/* Header & Stats (كما في صفحة الطاقم) */
.header { background: linear-gradient(135deg, var(--navy-1), var(--navy-2)); border-radius: var(--radius-lg); padding: 26px 34px; margin-bottom: 22px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-md); }
.header-left { display: flex; align-items: center; gap: 20px; }
.header-icon { width: 70px; height: 70px; border-radius: 20px; background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); display: flex; align-items: center; justify-content: center; font-size: 30px; color: var(--navy-1); }
.header-text h1 { font-size: 28px; font-weight: 900; color: var(--gold-1); }
.header-text p { font-size: 13px; color: var(--slate-200); }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 22px; }
.stat-card { background: white; border-radius: var(--radius); padding: 22px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-md); border-right: 4px solid var(--blue); }
.stat-card.actual { border-right-color: var(--emerald); }
.stat-card.fraud { border-right-color: var(--red); }
.stat-icon { width: 56px; height: 56px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 23px; background: var(--slate-100); }
.stat-value { font-size: 28px; font-weight: 900; color: var(--navy-1); }
.stat-label { font-size: 11px; font-weight: 800; color: var(--slate-500); }

.card { background: white; border-radius: var(--radius); padding: 26px; margin-bottom: 22px; box-shadow: var(--shadow-md); border: 1px solid var(--slate-200); }
.card-title { font-size: 17px; font-weight: 900; color: var(--navy-1); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.card-title i { color: var(--gold-2); }

.form-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.form-group label { font-size: 11.5px; font-weight: 900; color: var(--slate-600); margin-bottom: 8px; display: block; }
.form-control { padding: 12px; border: 2px solid var(--slate-200); border-radius: var(--radius-sm); width: 100%; font-family: var(--font); font-weight: 600; }
.form-control:focus { border-color: var(--gold-2); outline: none; }

.audit-box { grid-column: 1 / -1; padding: 15px; border-radius: 8px; margin-top: 10px; display: none; }
.audit-box.success { display: block; background: rgba(16, 185, 129, 0.1); border-right: 4px solid var(--emerald); color: #065f46; }
.audit-box.danger { display: block; background: rgba(239, 68, 68, 0.1); border-right: 4px solid var(--red); color: #991b1b; }

.btn { padding: 12px 24px; border: none; border-radius: var(--radius-sm); font-family: var(--font); font-size: 13.5px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 9px; }
.btn-primary { background: linear-gradient(135deg, var(--emerald), #059669); color: white; }
.btn-outline { background: var(--slate-100); color: var(--slate-700); border: 1.5px solid var(--slate-300); }

.table-wrapper { overflow-x: auto; }
.fuel-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.fuel-table thead { background: linear-gradient(135deg, var(--navy-1), var(--navy-2)); }
.fuel-table th { padding: 16px 12px; color: var(--gold-1); font-size: 11px; font-weight: 900; border-bottom: 3px solid var(--gold-2); }
.fuel-table td { padding: 14px 10px; text-align: center; border-bottom: 1px solid var(--slate-100); font-weight: 600; }
.badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; }
.badge-success { background: rgba(16, 185, 129, 0.15); color: var(--emerald); }
.badge-danger { background: rgba(239, 68, 68, 0.15); color: var(--red); }

.filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; background: var(--slate-50); padding: 15px; border-radius: var(--radius-sm); }
</style>
</head>
<body>
<div class="container">
    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="header-icon"><i class="fas fa-gas-pump"></i></div>
            <div class="header-text">
                <h1>إدارة المحروقات</h1>
                <p id="vesselName"><i class="fas fa-circle-notch fa-spin"></i> جاري التحميل...</p>
            </div>
        </div>
        <button class="btn btn-outline" onclick="window.location.href='/pages/fleet.html'"><i class="fas fa-arrow-right"></i> رجوع</button>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
        <div class="stat-card fuel">
            <div class="stat-icon" style="color: var(--blue); background: rgba(59, 130, 246, 0.1);"><i class="fas fa-tachometer-alt"></i></div>
            <div>
                <div class="stat-value" id="statTotalLiters">0</div>
                <div class="stat-label">إجمالي المطلوب (لتر)</div>
            </div>
        </div>
        <div class="stat-card actual">
            <div class="stat-icon" style="color: var(--emerald); background: rgba(16, 185, 129, 0.1);"><i class="fas fa-check-circle"></i></div>
            <div>
                <div class="stat-value" id="statActualLiters">0</div>
                <div class="stat-label">الاستهلاك الفعلي (لتر)</div>
            </div>
        </div>
        <div class="stat-card fraud">
            <div class="stat-icon" style="color: var(--red); background: rgba(239, 68, 68, 0.1);"><i class="fas fa-exclamation-triangle"></i></div>
            <div>
                <div class="stat-value" id="statFraudDocs">0</div>
                <div class="stat-label">وثائق مشبوهة</div>
            </div>
        </div>
    </div>

    <!-- ADD FORM -->
    <div class="card">
        <div class="card-title"><i class="fas fa-plus-circle"></i> تسجيل وثيقة تموين جديدة</div>
        <div class="form-body" id="formBody">
            <div class="form-group"><label>عداد الساعات الكلي *</label><input type="number" id="fTotalHours" class="form-control" placeholder="مثال: 169" oninput="liveAudit()"></div>
            <div class="form-group"><label>الساعات المقطوعة *</label><input type="number" id="fUsedHours" class="form-control" placeholder="مثال: 75" oninput="liveAudit()"></div>
            <div class="form-group"><label>الكمية المطلوبة (لتر) *</label><input type="number" id="fRequestedLiters" class="form-control" placeholder="مثال: 1000" oninput="liveAudit()"></div>
            <div class="form-group"><label>التاريخ</label><input type="date" id="fDate" class="form-control"></div>
            
            <div class="audit-box" id="auditBox"></div>

            <div style="grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn btn-primary" id="addBtn" onclick="saveFuelDoc()"><i class="fas fa-save"></i> حفظ الوثيقة</button>
                <button class="btn btn-outline" onclick="clearForm()"><i class="fas fa-eraser"></i> مسح</button>
            </div>
        </div>
    </div>

    <!-- CHART & FILTER -->
    <div class="card">
        <div class="card-title"><i class="fas fa-chart-bar"></i> التحليل البياني للاستهلاك</div>
        <div class="filter-bar">
            <input type="date" id="filterStart" class="form-control" style="width:auto;">
            <input type="date" id="filterEnd" class="form-control" style="width:auto;">
            <button class="btn btn-primary" onclick="applyCustomFilter()">تطبيق الفلتر</button>
            <button class="btn btn-outline" onclick="quickFilter('week')">هذا الأسبوع</button>
            <button class="btn btn-outline" onclick="quickFilter('month')">هذا الشهر</button>
        </div>
        <div style="position: relative; height: 350px; width: 100%;"><canvas id="fuelChart"></canvas></div>
    </div>

    <!-- TABLE -->
    <div class="card">
        <div class="card-title"><i class="fas fa-list"></i> سجل وثائق التموين</div>
        <div class="table-wrapper">
            <table class="fuel-table">
                <thead>
                    <tr><th>التاريخ</th><th>عداد الساعات</th><th>الساعات المقطوعة</th><th>الكمية المطلوبة</th><th>معدل الاستهلاك</th><th>الحالة</th></tr>
                </thead>
                <tbody id="fuelTableBody">
                    <tr><td colspan="6" style="text-align:center;padding:20px;"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';
    var boatId = new URLSearchParams(window.location.search).get('id');
    var boatName = '';
    var boatStandards = { standardRate: 13.33, tankCapacity: 1000, lastOdometer: 0 };
    var myChart = null;

    function getToken() { return localStorage.getItem('marine_token') || localStorage.getItem('token') || ''; }
    function getCsrf() { try { var m = document.cookie.match(/marine_csrf=([^;]+)/); return m ? decodeURIComponent(m[1]) : ''; } catch(e) { return ''; } }

    async function init() {
        if (!boatId) { document.body.innerHTML = '<h1 style="text-align:center;margin-top:50px;">⚠️ لم يتم تحديد المركب</h1>'; return; }
        document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
        
        // جلب اسم القارب
        try {
            const res = await fetch('/api/vessels', { headers: { 'Authorization': 'Bearer ' + getToken() } });
            const vessels = await res.json();
            const v = vessels.find(x => String(x.id || x._id) === String(boatId));
            if (v) {
                boatName = v.name;
                document.getElementById('vesselName').innerHTML = '<i class="fas fa-anchor"></i> ' + v.name;
            }
        } catch(e) {}

        await loadStandards();
        loadDocs();
    }

    async function loadStandards() {
        try {
            const res = await fetch('/api/fuel/standards/' + boatId, { headers: { 'Authorization': 'Bearer ' + getToken() } });
            if (res.ok) boatStandards = await res.json();
        } catch(e) {}
    }

    window.liveAudit = function() {
        var totalHours = parseFloat(document.getElementById('fTotalHours').value) || 0;
        var usedHours = parseFloat(document.getElementById('fUsedHours').value) || 0;
        var requestedLiters = parseFloat(document.getElementById('fRequestedLiters').value) || 0;
        var box = document.getElementById('auditBox');

        if (usedHours === 0 || requestedLiters === 0) { box.className = 'audit-box'; box.innerHTML = ''; return; }

        var msgs = [];
        var isFraud = false;
        var actualRate = requestedLiters / usedHours;
        var deviation = ((actualRate - boatStandards.standardRate) / boatStandards.standardRate) * 100;

        if (totalHours > 0 && totalHours < boatStandards.lastOdometer) { isFraud = true; msgs.push('🚨 <b>عداد غير منطقي:</b> العداد (' + totalHours + ') أقل من العداد السابق (' + boatStandards.lastOdometer + ').'); }
        if (requestedLiters > boatStandards.tankCapacity) { isFraud = true; msgs.push('🚨 <b>تلاعب في الكمية:</b> المطلوب (' + requestedLiters + ') أكبر من سعة الخزان (' + boatStandards.tankCapacity + ').'); }
        if (deviation > 15) { isFraud = true; var expected = usedHours * boatStandards.standardRate; msgs.push('⚠️ <b>استهلاك مرتفع جداً:</b> المعدل (' + actualRate.toFixed(2) + ') يتجاوز المعيار (' + boatStandards.standardRate + '). الفرق: ' + (requestedLiters - expected).toFixed(1) + ' لتر.'); }

        if (isFraud) { box.className = 'audit-box danger'; box.innerHTML = '<h4 style="margin-bottom:5px;">🚨 شبهة تلاعب مالي!</h4>' + msgs.map(m => '<p style="font-size:13px;">' + m + '</p>').join(''); }
        else { box.className = 'audit-box success'; box.innerHTML = '<h4 style="margin-bottom:5px;">✅ البيانات سليمة</h4><p style="font-size:13px;">الاستهلاك مطابق للمعايير (' + actualRate.toFixed(2) + ' لتر/ساعة).</p>'; }
    };

    window.clearForm = function() {
        document.getElementById('fTotalHours').value = '';
        document.getElementById('fUsedHours').value = '';
        document.getElementById('fRequestedLiters').value = '';
        document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('auditBox').className = 'audit-box';
    };

    window.saveFuelDoc = async function() {
        var totalHours = parseFloat(document.getElementById('fTotalHours').value) || 0;
        var usedHours = parseFloat(document.getElementById('fUsedHours').value) || 0;
        var requestedLiters = parseFloat(document.getElementById('fRequestedLiters').value) || 0;
        var dateVal = document.getElementById('fDate').value;

        if (usedHours === 0 || requestedLiters === 0) { alert('الرجاء إدخال الساعات والكمية المطلوبة'); return; }

        var actualRate = requestedLiters / usedHours;
        var deviation = ((actualRate - boatStandards.standardRate) / boatStandards.standardRate) * 100;
        var isFraud = deviation > 15 || (totalHours > 0 && totalHours < boatStandards.lastOdometer) || (requestedLiters > boatStandards.tankCapacity);

        var btn = document.getElementById('addBtn');
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

        try {
            var res = await fetch('/api/fuel/documents', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken(), 'X-CSRF-Token': getCsrf() },
                body: JSON.stringify({ boatId, date: dateVal, totalHours, usedHours, requestedLiters, actualRate, deviation, isFraud })
            });
            if (!res.ok) throw new Error('فشل الحفظ');
            alert('تم حفظ الوثيقة بنجاح');
            clearForm();
            loadStandards(); // تحديث آخر عداد
            loadDocs();
        } catch (e) { alert(e.message); }
        finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> حفظ الوثيقة'; }
    };

    async function loadDocs(start, end) {
        var tbody = document.getElementById('fuelTableBody');
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</td></tr>';
        try {
            var url = '/api/fuel/documents/' + boatId;
            if (start && end) url += '?start=' + start + '&end=' + end;
            var res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + getToken() } });
            var docs = await res.json();
            renderTable(docs); updateStats(docs); renderChart(docs);
        } catch (e) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:red;">خطأ في التحميل</td></tr>'; }
    }

    function updateStats(docs) {
        var total = 0, actual = 0, fraud = 0;
        docs.forEach(d => { total += d.requestedLiters || 0; actual += (d.usedHours || 0) * boatStandards.standardRate; if (d.isFraud) fraud++; });
        document.getElementById('statTotalLiters').textContent = total.toFixed(0);
        document.getElementById('statActualLiters').textContent = actual.toFixed(0);
        document.getElementById('statFraudDocs').textContent = fraud;
    }

    function renderTable(docs) {
        var tbody = document.getElementById('fuelTableBody');
        if (!docs.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#64748b;">لا توجد وثائق مسجلة.</td></tr>'; return; }
        tbody.innerHTML = docs.map(d => {
            var badge = d.isFraud ? '<span class="badge badge-danger"><i class="fas fa-exclamation-triangle"></i> مشبوه</span>' : '<span class="badge badge-success"><i class="fas fa-check"></i> سليم</span>';
            var dateStr = new Date(d.date).toLocaleDateString('ar-EG');
            return '<tr><td>' + dateStr + '</td><td>' + (d.totalHours || '-') + '</td><td>' + d.usedHours + '</td><td>' + d.requestedLiters + ' لتر</td><td>' + d.actualRate.toFixed(2) + ' لتر/س</td><td>' + badge + '</td></tr>';
        }).join('');
    }

    function renderChart(docs) {
        var ctx = document.getElementById('fuelChart').getContext('2d');
        if (myChart) myChart.destroy();
        if (!docs.length) return;
        var sorted = docs.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: sorted.map(d => new Date(d.date).toLocaleDateString('ar-EG')),
                datasets: [
                    { label: 'الاستهلاك الفعلي (لتر/ساعة)', data: sorted.map(d => d.actualRate), backgroundColor: sorted.map(d => d.actualRate > boatStandards.standardRate * 1.15 ? '#ef4444' : '#3b82f6'), borderRadius: 5, order: 2 },
                    { label: 'الحد المعياري', data: sorted.map(() => boatStandards.standardRate), type: 'line', borderColor: '#f59e0b', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, fill: false, order: 1 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#1e293b', font: { family: 'Cairo' } } } },
                scales: {
                    x: { ticks: { color: '#64748b', font: { family: 'Cairo' } }, grid: { color: '#e2e8f0' } },
                    y: { beginAtZero: true, ticks: { color: '#64748b', font: { family: 'Cairo' } }, grid: { color: '#e2e8f0' } }
                }
            }
        });
    }

    window.quickFilter = function(type) {
        var start = new Date(), end = new Date();
        if (type === 'week') start.setDate(end.getDate() - 7);
        else if (type === 'month') start.setMonth(end.getMonth() - 1);
        document.getElementById('filterStart').value = start.toISOString().split('T')[0];
        document.getElementById('filterEnd').value = end.toISOString().split('T')[0];
        loadDocs(start.toISOString().split('T')[0], end.toISOString().split('T')[0]);
    };

    window.applyCustomFilter = function() {
        var start = document.getElementById('filterStart').value;
        var end = document.getElementById('filterEnd').value;
        if (!start || !end) { alert('الرجاء تحديد تاريخ البداية والنهاية'); return; }
        loadDocs(start, end);
    };

    init();
})();
</script>
</body>
</html>
