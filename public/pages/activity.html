<!-- public/pages/activity.html -->
<div id="page-activity">
    <style>
        #page-activity {
            --gold-1: #f7d774;
            --gold-2: #e6b31e;
            --gold-glow: rgba(230, 179, 30, 0.35);
            --text-1: #f1f5f9;
            --text-2: #cbd5e1;
            --text-3: #94a3b8;
            --text-4: #64748b;
            --border-mid: rgba(148, 163, 184, 0.15);
            --radius: 16px;
            --font: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            font-family: var(--font);
            color: var(--text-1);
            padding: 0;
            margin: 0;
        }
        #page-activity * { box-sizing: border-box; }

        .act-container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 16px 24px 40px;
        }

        /* HEADER */
        .act-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            flex-wrap: wrap;
            gap: 16px;
            background: linear-gradient(135deg, rgba(18, 26, 44, 0.9) 0%, rgba(24, 34, 56, 0.8) 100%);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-mid);
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .act-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .act-header-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--gold-2), #b8860b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #060911;
            box-shadow: 0 8px 24px var(--gold-glow);
        }
        .act-header-text h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 0 2px 0;
        }
        .act-header-text p {
            font-size: 12px;
            color: var(--text-3);
            margin: 0;
        }
        .act-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .act-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
        }
        .act-btn.primary {
            background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
            color: #060911;
            box-shadow: 0 8px 24px var(--gold-glow);
        }
        .act-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px var(--gold-glow);
        }
        .act-btn.secondary {
            background: rgba(148, 163, 184, 0.08);
            border: 1px solid var(--border-mid);
            color: var(--text-2);
        }
        .act-btn.secondary:hover {
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-1);
        }

        /* STATS */
        .act-stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .act-stat {
            background: linear-gradient(135deg, rgba(24, 34, 56, 0.85), rgba(18, 26, 44, 0.95));
            border: 1px solid rgba(148, 163, 184, 0.08);
            border-radius: var(--radius);
            padding: 20px 16px;
            text-align: center;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }
        .act-stat::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, currentColor, transparent);
        }
        .act-stat:hover {
            transform: translateY(-5px);
            border-color: rgba(148, 163, 184, 0.25);
        }
        .act-stat .number {
            font-size: 28px;
            font-weight: 900;
            color: currentColor;
            text-shadow: 0 0 24px currentColor;
            margin-bottom: 6px;
        }
        .act-stat .label {
            font-size: 11px;
            color: rgba(203, 213, 225, 0.75);
            font-weight: 700;
        }
        .act-stat.gold { color: var(--gold-1); }
        .act-stat.cyan { color: #67e8f9; }
        .act-stat.amber { color: #fcd34d; }
        .act-stat.purple { color: #c4b5fd; }

        /* FILTERS */
        .act-filters {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: rgba(18, 26, 44, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.08);
            border-radius: var(--radius);
            margin-bottom: 20px;
        }
        .act-search {
            flex: 1 1 240px;
            min-width: 200px;
            position: relative;
        }
        .act-search input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: 10px;
            border: 1px solid var(--border-mid);
            background: rgba(10, 16, 32, 0.7);
            color: var(--text-1);
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font);
        }
        .act-search input:focus {
            outline: none;
            border-color: var(--gold-2);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }
        .act-search i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-2);
            font-size: 12px;
            pointer-events: none;
        }
        .act-select {
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-mid);
            background: rgba(10, 16, 32, 0.7);
            color: var(--text-1);
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font);
            min-width: 150px;
            cursor: pointer;
        }
        .act-select:focus {
            outline: none;
            border-color: var(--gold-2);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }
        .act-select option {
            background: #0a1020;
            color: var(--text-1);
        }

        /* TABLE */
        .act-table-wrap {
            background: rgba(24, 34, 56, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.08);
            border-radius: var(--radius);
            overflow: hidden;
            overflow-x: auto;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }
        .act-table-head,
        .act-table-row {
            display: grid;
            grid-template-columns: 60px 130px 180px 150px 140px 1fr 150px;
            gap: 12px;
            padding: 14px 20px;
            align-items: center;
            font-size: 13px;
            min-width: 1000px;
        }
        .act-table-head {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(30, 41, 59, 0.9));
            font-size: 10.5px;
            font-weight: 800;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            position: sticky;
            top: 0;
            z-index: 2;
            border-bottom: 2px solid var(--gold-2);
        }
        .act-table-head > div {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .act-table-row {
            border-bottom: 1px solid rgba(148, 163, 184, 0.06);
            transition: background 0.25s;
        }
        .act-table-row:nth-child(even) {
            background: rgba(148, 163, 184, 0.02);
        }
        .act-table-row:hover {
            background: rgba(247, 215, 116, 0.05);
        }
        .act-cell {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-2);
            font-weight: 600;
        }
        .act-cell.center { text-align: center; }

        .act-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10.5px;
            font-weight: 800;
            white-space: nowrap;
        }
        .act-badge.action {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }
        .act-badge.resource {
            background: rgba(230, 179, 30, 0.15);
            color: var(--gold-1);
            border: 1px solid rgba(230, 179, 30, 0.25);
        }
        .act-badge.status-success {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #fff;
        }
        .act-badge.status-error {
            background: linear-gradient(135deg, #b91c1c, #ef4444);
            color: #fff;
        }
        .act-badge.status-warning {
            background: linear-gradient(135deg, #b45309, #f59e0b);
            color: #fff;
        }

        /* EMPTY */
        .act-empty {
            padding: 80px 24px;
            text-align: center;
            color: var(--text-4);
        }
        .act-empty i {
            font-size: 56px;
            margin-bottom: 20px;
            opacity: 0.5;
            color: var(--gold-2);
            display: block;
        }
        .act-empty h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-3);
            margin-bottom: 6px;
        }
        .act-empty p {
            font-size: 13px;
            color: var(--text-4);
        }

        /* LOADING */
        .act-loading {
            padding: 60px 24px;
            text-align: center;
            color: var(--text-3);
        }
        .act-loading .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.04);
            border-top-color: var(--gold-2);
            border-radius: 50%;
            animation: actSpin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes actSpin {
            to { transform: rotate(360deg); }
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .act-stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        @media (max-width: 768px) {
            .act-container {
                padding: 12px 14px 60px;
            }
            .act-header {
                padding: 14px 16px;
            }
            .act-header-text h1 {
                font-size: 16px;
            }
            .act-header-icon {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }
            .act-stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }
            .act-stat {
                padding: 16px 12px;
            }
            .act-stat .number {
                font-size: 22px;
            }
            .act-table-head,
            .act-table-row {
                font-size: 12px;
                padding: 12px 14px;
            }
        }
    </style>

    <div class="act-container">
        <!-- HEADER -->
        <div class="act-header">
            <div class="act-header-left">
                <div class="act-header-icon">
                    <i class="fas fa-clipboard-list"></i>
                </div>
                <div class="act-header-text">
                    <h1>سجل النشاطات</h1>
                    <p>جميع العمليات والأنشطة في النظام</p>
                </div>
            </div>
            <div class="act-header-actions">
                <button class="act-btn primary" id="actRefreshBtn">
                    <i class="fas fa-sync-alt"></i> تحديث
                </button>
                <button class="act-btn secondary" id="actPrintBtn">
                    <i class="fas fa-print"></i> طباعة
                </button>
            </div>
        </div>

        <!-- STATS -->
        <div class="act-stats">
            <div class="act-stat gold">
                <div class="number" id="actStatTotal">0</div>
                <div class="label">📊 إجمالي النشاطات</div>
            </div>
            <div class="act-stat cyan">
                <div class="number" id="actStatToday">0</div>
                <div class="label">📅 نشاطات اليوم</div>
            </div>
            <div class="act-stat amber">
                <div class="number" id="actStatUsers">0</div>
                <div class="label">👥 مستخدمون نشطون</div>
            </div>
            <div class="act-stat purple">
                <div class="number" id="actStatResources">0</div>
                <div class="label">🗂️ أنواع الموارد</div>
            </div>
        </div>

        <!-- FILTERS -->
        <div class="act-filters">
            <div class="act-search">
                <input type="text" id="actSearch" placeholder="🔍 ابحث في السجلات...">
                <i class="fas fa-search"></i>
            </div>
            <select class="act-select" id="actFilterAction">
                <option value="all">كل الإجراءات</option>
                <option value="login">🔐 تسجيل دخول</option>
                <option value="logout">🚪 تسجيل خروج</option>
                <option value="create">➕ إنشاء</option>
                <option value="update">✏️ تعديل</option>
                <option value="delete">🗑️ حذف</option>
                <option value="dispose">⚫ طرح</option>
                <option value="restore">🔄 استعادة</option>
            </select>
            <select class="act-select" id="actFilterResource">
                <option value="all">كل الموارد</option>
                <option value="user">👤 مستخدم</option>
                <option value="vessel">🚢 مركب</option>
                <option value="vehicle">🚗 وسيلة</option>
                <option value="maintenance">🔧 صيانة</option>
                <option value="note">📝 ملاحظة</option>
                <option value="ticket">🎫 تذكرة</option>
            </select>
        </div>

        <!-- TABLE -->
        <div class="act-table-wrap">
            <div class="act-table-head">
                <div class="center">#</div>
                <div class="center">الإجراء</div>
                <div class="center">المورد</div>
                <div class="center">المستخدم</div>
                <div class="center">الحالة</div>
                <div class="center">التفاصيل</div>
                <div class="center">التاريخ</div>
            </div>
            <div id="actTableBody">
                <div class="act-loading">
                    <div class="spinner"></div>
                    <p>جاري تحميل النشاطات...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    console.log('📋 Activity Page — Loading...');

    var _isDestroyed = false;
    var _timeouts = [];
    var activities = [];

    function _cleanup() {
        if (_isDestroyed) return;
        _isDestroyed = true;
        _timeouts.forEach(function(id) {
            try { clearTimeout(id); } catch(e) {}
        });
        _timeouts = [];
        console.log('🧹 Activity page cleanup');
    }
    window._pageCleanup = window._pageCleanup || [];
    window._pageCleanup.push(_cleanup);

    function $(s, c) { return (c || document).querySelector(s); }
    function $$(s, c) { return Array.from((c || document).querySelectorAll(s)); }

    function escapeHtml(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/[&<>"']/g, function(m) {
            return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m];
        });
    }

    function formatDate(value) {
        if (!value) return '—';
        try {
            var d = new Date(value);
            if (isNaN(d.getTime())) return String(value);
            var dd = String(d.getDate()).padStart(2, '0');
            var mm = String(d.getMonth() + 1).padStart(2, '0');
            var yyyy = d.getFullYear();
            var hh = String(d.getHours()).padStart(2, '0');
            var mi = String(d.getMinutes()).padStart(2, '0');
            return dd + '/' + mm + '/' + yyyy + ' ' + hh + ':' + mi;
        } catch (e) { return String(value); }
    }

    function showToast(msg, type) {
        if (typeof window.showToast === 'function') {
            window.showToast(msg, type || 'info');
        } else {
            console.log('[' + (type || 'info') + ']', msg);
        }
    }

    // ⚠️ مهم: استخدم apiFetch من النافذة الرئيسية لضمان إرسال Authorization
    function getApiFetch() {
        if (typeof window.apiFetch === 'function') return window.apiFetch;
        // fallback
        return function(url, opts) {
            opts = opts || {};
            var token = localStorage.getItem('marine_token') || localStorage.getItem('token');
            var headers = Object.assign({}, opts.headers || {});
            if (token) headers['Authorization'] = 'Bearer ' + token;
            if (!headers['Accept']) headers['Accept'] = 'application/json';
            opts.headers = headers;
            opts.credentials = 'include';
            return fetch(url, opts);
        };
    }

    function loadActivity() {
        if (_isDestroyed) return;

        var tbody = $('#actTableBody');
        if (tbody) {
            tbody.innerHTML =
                '<div class="act-loading">' +
                    '<div class="spinner"></div>' +
                    '<p>جاري تحميل النشاطات...</p>' +
                '</div>';
        }

        var apiFetch = getApiFetch();

        apiFetch('/api/logs', {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
        })
        .then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        })
        .then(function(data) {
            if (_isDestroyed) return;
            activities = Array.isArray(data) ? data : [];
            renderTable();
            updateStats();
        })
        .catch(function(err) {
            console.error('❌ Activity load error:', err);
            if (tbody) {
                tbody.innerHTML =
                    '<div class="act-empty">' +
                        '<i class="fas fa-exclamation-triangle" style="color:#f87171;"></i>' +
                        '<h3>فشل تحميل النشاطات</h3>' +
                        '<p>' + escapeHtml(err.message) + '</p>' +
                    '</div>';
            }
        });
    }

    function updateStats() {
        var total = activities.length;
        var today = 0;
        var usersSet = {};
        var resourcesSet = {};

        var todayStr = new Date().toDateString();

        activities.forEach(function(a) {
            try {
                var d = new Date(a.timestamp || a.createdAt);
                if (d.toDateString() === todayStr) today++;
            } catch (e) {}

            if (a.userName) usersSet[a.userName] = true;
            if (a.resource) resourcesSet[a.resource] = true;
        });

        var el;
        el = $('#actStatTotal'); if (el) el.textContent = total;
        el = $('#actStatToday'); if (el) el.textContent = today;
        el = $('#actStatUsers'); if (el) el.textContent = Object.keys(usersSet).length;
        el = $('#actStatResources'); if (el) el.textContent = Object.keys(resourcesSet).length;
    }

    function getFiltered() {
        var search = ($('#actSearch') && $('#actSearch').value || '').trim().toLowerCase();
        var actionFilter = ($('#actFilterAction') && $('#actFilterAction').value) || 'all';
        var resourceFilter = ($('#actFilterResource') && $('#actFilterResource').value) || 'all';

        return activities.filter(function(a) {
            if (actionFilter !== 'all' && a.action !== actionFilter) return false;
            if (resourceFilter !== 'all' && a.resource !== resourceFilter) return false;

            if (search) {
                var text = [
                    a.userName, a.action, a.resource, a.resourceName,
                    a.status, JSON.stringify(a.details || {})
                ].filter(Boolean).join(' ').toLowerCase();
                if (text.indexOf(search) === -1) return false;
            }
            return true;
        });
    }

    function renderTable() {
        var tbody = $('#actTableBody');
        if (!tbody) return;

        var filtered = getFiltered();

        if (filtered.length === 0) {
            tbody.innerHTML =
                '<div class="act-empty">' +
                    '<i class="fas fa-inbox"></i>' +
                    '<h3>لا توجد نشاطات</h3>' +
                    '<p>' + (activities.length === 0 ? 'لم يتم تسجيل أي نشاط بعد' : 'لا توجد نتائج مطابقة') + '</p>' +
                '</div>';
            return;
        }

        var html = '';
        filtered.forEach(function(a, idx) {
            var statusClass = 'status-success';
            if (a.status === 'error') statusClass = 'status-error';
            else if (a.status === 'warning') statusClass = 'status-warning';

            var details = '—';
            if (a.details && typeof a.details === 'object') {
                var keys = Object.keys(a.details).filter(function(k) { return k !== 'requestId'; });
                if (keys.length > 0) {
                    details = keys.map(function(k) {
                        return k + ': ' + a.details[k];
                    }).join(' • ');
                }
            }

            html +=
                '<div class="act-table-row">' +
                    '<div class="act-cell center">' + (idx + 1) + '</div>' +
                    '<div class="act-cell center"><span class="act-badge action">' + escapeHtml(a.action || '—') + '</span></div>' +
                    '<div class="act-cell center"><span class="act-badge resource">' + escapeHtml(a.resource || '—') + '</span></div>' +
                    '<div class="act-cell center">' + escapeHtml(a.userName || '—') + '</div>' +
                    '<div class="act-cell center"><span class="act-badge ' + statusClass + '">' + escapeHtml(a.status || 'success') + '</span></div>' +
                    '<div class="act-cell">' + escapeHtml(details) + '</div>' +
                    '<div class="act-cell center">' + formatDate(a.timestamp || a.createdAt) + '</div>' +
                '</div>';
        });
        tbody.innerHTML = html;
    }

    function printPage() {
        showToast('🖨️ جاري تحضير الطباعة...', 'info');
        _timeouts.push(setTimeout(function() {
            window.print();
        }, 300));
    }

    function init() {
        if (_isDestroyed) return;
        console.log('🚀 Activity page initializing...');

        // Event listeners
        var refreshBtn = $('#actRefreshBtn');
        if (refreshBtn) {
            refreshBtn.addEventListener('click', function() {
                showToast('🔄 جاري التحديث...', 'info');
                loadActivity();
            });
        }

        var printBtn = $('#actPrintBtn');
        if (printBtn) {
            printBtn.addEventListener('click', printPage);
        }

        var searchInput = $('#actSearch');
        if (searchInput) {
            searchInput.addEventListener('input', renderTable);
        }

        var actionFilter = $('#actFilterAction');
        if (actionFilter) {
            actionFilter.addEventListener('change', renderTable);
        }

        var resourceFilter = $('#actFilterResource');
        if (resourceFilter) {
            resourceFilter.addEventListener('change', renderTable);
        }

        // Load data
        loadActivity();

        console.log('✅ Activity page ready');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            var id = setTimeout(function() {
                if (!_isDestroyed) init();
            }, 50);
            _timeouts.push(id);
        });
    } else {
        var id = setTimeout(function() {
            if (!_isDestroyed) init();
        }, 50);
        _timeouts.push(id);
    }

    console.log('✅ Activity page loaded');
})();
</script>
