<div id="page-tracking">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; flex-wrap:wrap; gap:8px; border-bottom:1px solid rgba(255,255,255,0.05);">
        <div>
            <h2 style="margin:0; color:white; font-size:22px;">📍 تتبع المواقع</h2>
            <p style="margin:0; color:rgba(255,255,255,0.4); font-size:13px;">تتبع موقع المستخدمين في الوقت الفعلي</p>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <span style="background:rgba(74,222,128,0.15); color:#4ade80; padding:6px 16px; border-radius:20px; font-size:12px; border:1px solid rgba(74,222,128,0.1);">
                🟢 <span id="trackingOnline">0</span> متصل
            </span>
            <button onclick="refreshLocations()" style="padding:6px 14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:10px; color:rgba(255,255,255,0.5); cursor:pointer;">🔄 تحديث</button>
            <button onclick="centerMap()" style="padding:6px 14px; background:rgba(96,165,250,0.15); border:1px solid rgba(96,165,250,0.1); border-radius:10px; color:#60a5fa; cursor:pointer;">🎯 مركز الخريطة</button>
        </div>
    </div>

    <!-- حالة GPS -->
    <div style="background:rgba(255,255,255,0.03); border-radius:10px; padding:12px 16px; margin:15px 0; border:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
        <div>
            <span style="color:rgba(255,255,255,0.4);">📍 موقعي:</span>
            <span id="myLocation" style="color:rgba(255,255,255,0.6);">--</span>
        </div>
        <div>
            <span style="color:rgba(255,255,255,0.4);">🎯 الدقة:</span>
            <span id="myAccuracy" style="color:rgba(255,255,255,0.6);">--</span>
        </div>
        <div>
            <span style="color:rgba(255,255,255,0.4);">📡 الحالة:</span>
            <span id="gpsStatus" style="color:#fbbf24;">⏳ جاري التحديث...</span>
        </div>
        <button onclick="shareMyLocation()" style="padding:6px 16px; background:rgba(74,222,128,0.15); border:1px solid rgba(74,222,128,0.1); border-radius:8px; color:#4ade80; cursor:pointer;">
            📤 مشاركة موقعي
        </button>
    </div>

    <!-- الخريطة -->
    <div style="background:rgba(255,255,255,0.02); border-radius:12px; padding:10px; border:1px solid rgba(255,255,255,0.04);">
        <div id="trackingMap" style="height:500px; width:100%; border-radius:8px;"></div>
    </div>

    <!-- قائمة المستخدمين -->
    <div class="stat-card" style="padding:15px; margin-top:15px;">
        <h4 style="color:rgba(255,255,255,0.7); margin:0 0 10px 0; font-size:14px;">👥 المستخدمين المتصلين</h4>
        <div id="usersList" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:8px;">
            <div style="text-align:center; padding:20px; color:rgba(255,255,255,0.2);">🚫 لا يوجد مستخدمين متصلين</div>
        </div>
    </div>
</div>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Socket.IO Client -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
    #trackingMap {
        height: 500px;
        width: 100%;
        border-radius: 8px;
        background: #0a0a1a;
    }
    .user-marker {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 12px;
        color: white;
        font-weight: bold;
    }
    .user-marker .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #0d6efd;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        border: 2px solid white;
        box-shadow: 0 0 20px rgba(13,110,253,0.3);
    }
    .user-marker .avatar.online {
        background: #4ade80;
        border-color: #4ade80;
    }
    .user-marker .avatar.offline {
        background: #6c757d;
        border-color: #6c757d;
    }
    .user-card {
        background: rgba(255,255,255,0.03);
        border-radius: 8px;
        padding: 10px 12px;
        border: 1px solid rgba(255,255,255,0.04);
        display: flex;
        align-items: center;
        gap: 10px;
        transition: all 0.3s;
    }
    .user-card:hover {
        background: rgba(255,255,255,0.06);
    }
    .user-card .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        animation: pulse 2s infinite;
    }
    .user-card .dot.online { background: #4ade80; }
    .user-card .dot.offline { background: #6c757d; animation: none; }
    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.8); }
    }
    .user-card .user-name { font-weight: 600; color: white; }
    .user-card .user-role { font-size: 11px; color: rgba(255,255,255,0.3); }
    .user-card .user-time { font-size: 10px; color: rgba(255,255,255,0.2); margin-right: auto; }
</style>

<script>
// ============================================================
// 📍 تتبع GPS - كود كامل
// ============================================================

let map = null;
let markers = {};
let userMarkers = {};
let socket = null;
let myLocation = null;
let watchId = null;
let isTracking = false;

// ============================================================
// 1. تهيئة الخريطة
// ============================================================

function initTrackingMap() {
    if (map) {
        map.invalidateSize();
        return;
    }
    
    console.log('🗺️ Initializing tracking map...');
    
    map = L.map('trackingMap', {
        center: [36.8, 10.18], // تونس
        zoom: 13,
        zoomControl: true
    });
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
    }).addTo(map);
    
    // إضافة زر تحديد الموقع
    L.control.locate({
        position: 'topleft',
        strings: {
            title: 'عرض موقعي'
        },
        locateOptions: {
            enableHighAccuracy: true,
            maxZoom: 16
        }
    }).addTo(map);
    
    // إضافة مقياس
    L.control.scale({
        position: 'bottomleft',
        metric: true,
        imperial: false
    }).addTo(map);
    
    // عند تحميل الصفحة، حاول جلب المواقع
    setTimeout(refreshLocations, 500);
}

// ============================================================
// 2. الاتصال بـ Socket.IO
// ============================================================

function initTrackingSocket() {
    if (socket) return;
    
    console.log('🔌 Connecting to Socket.IO...');
    
    socket = io('/', {
        transports: ['websocket'],
        reconnection: true,
        reconnectionAttempts: 10
    });
    
    socket.on('connect', () => {
        console.log('✅ Socket connected');
        document.getElementById('gpsStatus').textContent = '🟢 متصل';
        document.getElementById('gpsStatus').style.color = '#4ade80';
        
        // طلب المواقع الحالية
        socket.emit('get-locations');
    });
    
    socket.on('disconnect', () => {
        console.log('❌ Socket disconnected');
        document.getElementById('gpsStatus').textContent = '🔴 غير متصل';
        document.getElementById('gpsStatus').style.color = '#f87171';
    });
    
    // استقبال تحديثات المواقع
    socket.on('location-update', (data) => {
        console.log('📍 Location update:', data.username, data.lat, data.lng);
        updateMarker(data);
        updateUsersList();
    });
    
    // استقبال جميع المواقع
    socket.on('all-locations', (locations) => {
        console.log('📍 All locations:', locations.length);
        locations.forEach(loc => updateMarker(loc));
        updateUsersList();
    });
    
    // مستخدم غير متصل
    socket.on('user-offline', (data) => {
        console.log('👤 User offline:', data.userId);
        if (userMarkers[data.userId]) {
            map.removeLayer(userMarkers[data.userId]);
            delete userMarkers[data.userId];
            delete markers[data.userId];
        }
        updateUsersList();
    });
}

// ============================================================
// 3. تحديث الماركرز على الخريطة
// ============================================================

function updateMarker(data) {
    if (!map) return;
    
    const { userId, username, role, lat, lng, accuracy, status, updatedAt } = data;
    
    if (!userId || !lat || !lng) return;
    
    const isOnline = status === 'online' || status === 'online';
    const iconColor = isOnline ? '#4ade80' : '#6c757d';
    const iconText = isOnline ? '🟢' : '🔴';
    
    // حذف الماركر القديم
    if (userMarkers[userId]) {
        map.removeLayer(userMarkers[userId]);
        delete userMarkers[userId];
    }
    
    // إنشاء أيقونة مخصصة
    const icon = L.divIcon({
        className: 'custom-div-icon',
        html: `
            <div class="user-marker">
                <div class="avatar ${isOnline ? 'online' : 'offline'}">
                    ${role === 'مسؤول' ? '👑' : role === 'مشرف' ? '⭐' : '👤'}
                </div>
                <div style="font-size:10px; margin-top:2px; background:rgba(0,0,0,0.7); padding:2px 8px; border-radius:10px;">
                    ${username}
                </div>
            </div>
        `,
        iconSize: [60, 60],
        iconAnchor: [30, 30],
        popupAnchor: [0, -30]
    });
    
    // إنشاء الماركر
    const marker = L.marker([lat, lng], { icon: icon }).addTo(map);
    
    // إضافة نافذة منبثقة
    const popupContent = `
        <div style="text-align:right; font-family:Cairo, sans-serif; min-width:150px;">
            <div style="font-weight:bold; font-size:16px;">${username}</div>
            <div style="color:#6c757d; font-size:13px;">${role}</div>
            <div style="color:#6c757d; font-size:12px;">
                <span style="color:${isOnline ? '#4ade80' : '#6c757d'};">${isOnline ? '🟢 متصل' : '🔴 غير متصل'}</span>
            </div>
            <div style="color:#6c757d; font-size:11px;">
                📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}
                ${accuracy ? `<br>🎯 الدقة: ±${accuracy.toFixed(0)}م` : ''}
            </div>
            <div style="color:#6c757d; font-size:10px;">
                ${updatedAt ? '🕐 ' + new Date(updatedAt).toLocaleString('ar-TN') : ''}
            </div>
        </div>
    `;
    marker.bindPopup(popupContent);
    
    userMarkers[userId] = marker;
    markers[userId] = { ...data, marker: marker };
}

// ============================================================
// 4. تحديث قائمة المستخدمين
// ============================================================

function updateUsersList() {
    const container = document.getElementById('usersList');
    if (!container) return;
    
    const users = Object.values(markers);
    const onlineCount = users.filter(u => u.status === 'online' || u.status === 'online').length;
    
    document.getElementById('trackingOnline').textContent = onlineCount;
    
    if (users.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:rgba(255,255,255,0.2); grid-column:1/-1;">🚫 لا يوجد مستخدمين متصلين</div>';
        return;
    }
    
    container.innerHTML = users.map(u => {
        const isOnline = u.status === 'online' || u.status === 'online';
        const timeAgo = u.updatedAt ? getTimeAgo(new Date(u.updatedAt)) : '--';
        const roleEmojis = { 'مسؤول': '👑', 'مشرف': '⭐', 'محرر': '✏️', 'مشاهد': '👀' };
        
        return `
            <div class="user-card">
                <span class="dot ${isOnline ? 'online' : 'offline'}"></span>
                <span class="user-name">${u.username || 'مجهول'}</span>
                <span class="user-role">${roleEmojis[u.role] || '👤'} ${u.role || 'مشاهد'}</span>
                <span class="user-time">${timeAgo}</span>
            </div>
        `;
    }).join('');
}

function getTimeAgo(date) {
    const diff = Date.now() - date.getTime();
    if (diff < 60000) return 'الآن';
    if (diff < 3600000) return `${Math.floor(diff / 60000)} دقائق`;
    if (diff < 86400000) return `${Math.floor(diff / 3600000)} ساعات`;
    return `${Math.floor(diff / 86400000)} أيام`;
}

// ============================================================
// 5. مشاركة الموقع
// ============================================================

function shareMyLocation() {
    if (!navigator.geolocation) {
        showAlert('⚠️ جهازك لا يدعم تحديد الموقع', 'warning');
        return;
    }
    
    showAlert('⏳ جاري تحديد موقعك...', 'info');
    
    navigator.geolocation.getCurrentPosition(
        (position) => {
            const { latitude, longitude, accuracy } = position.coords;
            myLocation = { lat: latitude, lng: longitude, accuracy };
            
            document.getElementById('myLocation').textContent = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
            document.getElementById('myAccuracy').textContent = accuracy ? `±${accuracy.toFixed(0)}م` : '--';
            document.getElementById('gpsStatus').textContent = '✅ تم تحديد الموقع';
            document.getElementById('gpsStatus').style.color = '#4ade80';
            
            // إرسال الموقع إلى الخادم
            const token = localStorage.getItem('token');
            if (!token) {
                showAlert('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
                return;
            }
            
            // عبر Socket.IO
            if (socket && socket.connected) {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                socket.emit('update-location', {
                    userId: user.id || 'unknown',
                    username: user.name || 'مجهول',
                    role: user.role || 'مشاهد',
                    lat: latitude,
                    lng: longitude,
                    accuracy: accuracy,
                    token: token
                });
            }
            
            // عبر API
            fetch('/api/location', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    lat: latitude,
                    lng: longitude,
                    accuracy: accuracy
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showAlert('✅ تم مشاركة موقعك', 'success');
                }
            })
            .catch(err => console.error('Share location error:', err));
            
            // تحديد موقع الخريطة
            if (map) {
                map.setView([latitude, longitude], 15);
            }
        },
        (error) => {
            console.error('Geolocation error:', error);
            let msg = '❌ تعذر تحديد الموقع';
            if (error.code === 1) msg = '❌ تم رفض الوصول إلى الموقع';
            else if (error.code === 2) msg = '❌ الموقع غير متاح حالياً';
            else if (error.code === 3) msg = '❌ انتهى وقت تحديد الموقع';
            showAlert(msg, 'danger');
            document.getElementById('gpsStatus').textContent = msg;
            document.getElementById('gpsStatus').style.color = '#f87171';
        },
        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}

// ============================================================
// 6. بدء التتبع المستمر
// ============================================================

function startContinuousTracking() {
    if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }
    
    if (!navigator.geolocation) {
        showAlert('⚠️ جهازك لا يدعم تحديد الموقع', 'warning');
        return;
    }
    
    showAlert('⏳ بدء التتبع المستمر...', 'info');
    
    watchId = navigator.geolocation.watchPosition(
        (position) => {
            const { latitude, longitude, accuracy } = position.coords;
            myLocation = { lat: latitude, lng: longitude, accuracy };
            
            document.getElementById('myLocation').textContent = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
            document.getElementById('myAccuracy').textContent = accuracy ? `±${accuracy.toFixed(0)}م` : '--';
            document.getElementById('gpsStatus').textContent = '🟢 تتبع مستمر';
            document.getElementById('gpsStatus').style.color = '#4ade80';
            
            // إرسال الموقع
            const token = localStorage.getItem('token');
            if (!token) return;
            
            if (socket && socket.connected) {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                socket.emit('update-location', {
                    userId: user.id || 'unknown',
                    username: user.name || 'مجهول',
                    role: user.role || 'مشاهد',
                    lat: latitude,
                    lng: longitude,
                    accuracy: accuracy,
                    token: token
                });
            }
        },
        (error) => {
            console.error('Watch error:', error);
            document.getElementById('gpsStatus').textContent = '❌ خطأ في التتبع';
            document.getElementById('gpsStatus').style.color = '#f87171';
        },
        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 5000
        }
    );
}

// ============================================================
// 7. تحديث المواقع
// ============================================================

function refreshLocations() {
    const token = localStorage.getItem('token');
    if (!token) {
        showAlert('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
        return;
    }
    
    fetch('/api/locations', {
        headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(res => res.json())
    .then(data => {
        console.log('📍 Locations loaded:', data.length);
        data.forEach(loc => updateMarker(loc));
        updateUsersList();
        showAlert('✅ تم تحديث المواقع', 'success');
    })
    .catch(err => {
        console.error('Error loading locations:', err);
        showAlert('❌ خطأ في تحميل المواقع', 'danger');
    });
}

// ============================================================
// 8. مركز الخريطة
// ============================================================

function centerMap() {
    if (!map) return;
    
    if (myLocation) {
        map.setView([myLocation.lat, myLocation.lng], 15);
    } else {
        map.setView([36.8, 10.18], 13);
    }
}

// ============================================================
// 9. التهيئة
// ============================================================

if (document.getElementById('page-tracking')) {
    console.log('📍 Tracking page loaded');
    
    setTimeout(() => {
        initTrackingMap();
        initTrackingSocket();
        
        // بدء التتبع المستمر
        setTimeout(startContinuousTracking, 1000);
    }, 300);
}

// ============================================================
// 10. دوال مساعدة للخريطة
// ============================================================

// إضافة أيقونات مخصصة
L.Icon.Default.mergeOptions({
    iconRetinaUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon-2x.png',
    iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png',
    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png'
});

console.log('✅ Tracking page ready');
</script>
