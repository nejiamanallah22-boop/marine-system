<!-- public/pages/tracking.html -->
<div id="page-tracking">
    <style>
        /* ============================================================
           📊 TRACKING PAGE - PROFESSIONAL v3.0
           ============================================================ */

        /* ===== CSS VARIABLES ===== */
        :root {
            --primary-dark: #0a1628;
            --primary: #0f3460;
            --gold: #e6b31e;
            --gold-light: #f5d76e;
            --gold-dark: #c99a0e;
            --success: #00b894;
            --success-light: #55efc4;
            --danger: #e17055;
            --warning: #fdcb6e;
            --info: #0984e3;
            --glass-bg: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.06);
            --shadow-gold: 0 0 40px rgba(230,179,30,0.08);
            --shadow-card: 0 8px 32px rgba(0,0,0,0.15);
            --shadow-hover: 0 12px 48px rgba(0,0,0,0.25);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.4s cubic-bezier(0.4,0,0.2,1);
            --font: 'Cairo', 'Segoe UI', system-ui, sans-serif;
        }

        /* ===== FULL SCREEN RESET ===== */
        #page-tracking {
            width: 100%;
            max-width: 100%;
            padding: 0;
            margin: 0;
            font-family: var(--font);
            background: #0a0e1a;
            color: #e8edf5;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ===== BACKGROUND EFFECT ===== */
        #page-tracking::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(230,179,30,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(9,132,227,0.03) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
            animation: bgPulse 15s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(2deg); }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-light); }

        /* ============================================================
           HEADER
           ============================================================ */
        .tracking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 64px;
            z-index: 10;
            margin: 0;
            width: 100%;
        }

        .tracking-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .tracking-header-left .header-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--info));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #0a1628;
            box-shadow: var(--shadow-gold);
            animation: pulseGold 2s ease-in-out infinite;
        }

        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 20px rgba(230,179,30,0.1); }
            50% { box-shadow: 0 0 40px rgba(230,179,30,0.25); }
        }

        .tracking-header-left h2 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold-light), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .tracking-header-left p {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin: 0;
        }

        .tracking-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tracking-header-actions .btn-action {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
        }

        .tracking-header-actions .btn-action.primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0a1628;
            box-shadow: var(--shadow-gold);
        }

        .tracking-header-actions .btn-action.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,179,30,0.3);
        }

        .tracking-header-actions .btn-action.secondary {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: rgba(255,255,255,0.5);
        }

        .tracking-header-actions .btn-action.secondary:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
            transform: translateY(-2px);
        }

        .tracking-header-actions .btn-action.export {
            background: linear-gradient(135deg, var(--success), var(--success-light));
            color: #0a1628;
        }

        .tracking-header-actions .btn-action.export:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,184,148,0.3);
        }

        /* ============================================================
           STATS CARDS
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            padding: 16px 24px;
            margin: 0;
            width: 100%;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 16px 18px;
            text-align: center;
            transition: all var(--transition);
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--info));
            opacity: 0.6;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(230,179,30,0.15);
            box-shadow: var(--shadow-hover);
        }

        .stat-card .number {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        .stat-card .number.gold { color: var(--gold-light); }
        .stat-card .number.green { color: var(--success-light); }
        .stat-card .number.yellow { color: var(--warning); }
        .stat-card .number.red { color: var(--danger); }
        .stat-card .number.blue { color: #60a5fa; }
        .stat-card .number.pink { color: #f472b6; }

        .stat-card .label {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .stat-card .icon-bg {
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 50px;
            opacity: 0.04;
            pointer-events: none;
        }

        /* ============================================================
           FILTER BAR
           ============================================================ */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            padding: 10px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
            margin: 0;
            width: 100%;
        }

        .filter-bar label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-bar select,
        .filter-bar input {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.75rem;
            min-width: 120px;
            cursor: pointer;
            font-family: var(--font);
        }

        .filter-bar select:focus,
        .filter-bar input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .filter-bar select option {
            background: #0a1628;
            color: #e2e8f0;
        }

        .filter-bar input[type="date"] {
            min-width: 140px;
            color-scheme: dark;
        }

        .filter-bar input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.6);
            cursor: pointer;
        }

        .filter-bar .btn-filter {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-bar .btn-filter.primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0a1628;
        }

        .filter-bar .btn-filter.primary:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 20px rgba(230,179,30,0.2);
        }

        .filter-bar .btn-filter.outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: rgba(255,255,255,0.3);
        }

        .filter-bar .btn-filter.outline:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        /* ============================================================
           TABLE
           ============================================================ */
        .table-wrapper {
            overflow-x: auto;
            padding: 16px 24px 24px;
            width: 100%;
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            min-width: 800px;
            border-radius: var(--radius);
            overflow: hidden;
        }

        thead {
            background: rgba(15,52,96,0.4);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(230,179,30,0.15);
        }

        thead th {
            padding: 12px 10px;
            text-align: center;
            font-weight: 700;
            font-size: 0.6rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.8px;
            white-space: nowrap;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        thead th i {
            margin-left: 6px;
            color: var(--gold);
            font-size: 0.7rem;
        }

        tbody td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            vertical-align: middle;
            color: rgba(255,255,255,0.6);
            font-size: 0.78rem;
            text-align: center;
        }

        tbody tr {
            transition: all var(--transition);
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }

        tbody tr .vessel-name {
            font-weight: 700;
            color: #fff;
        }

        /* ===== STATUS BADGES ===== */
        .status-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }

        .status-badge.active {
            background: rgba(34,197,94,0.12);
            color: #4ade80;
        }

        .status-badge.inactive {
            background: rgba(239,68,68,0.12);
            color: #f87171;
        }

        .status-badge.pending {
            background: rgba(234,179,8,0.12);
            color: #fbbf24;
        }

        .status-badge.admin {
            background: rgba(167,139,250,0.12);
            color: #a78bfa;
        }

        .status-badge.user {
            background: rgba(96,165,250,0.12);
            color: #60a5fa;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            color: rgba(255,255,255,0.04);
            display: block;
            margin-bottom: 12px;
        }

        .empty-state .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.04);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: rgba(255,255,255,0.2);
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.1);
        }

        .empty-state .retry-btn {
            margin-top: 12px;
            padding: 8px 24px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0a1628;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }

        .empty-state .retry-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 24px rgba(230,179,30,0.2);
        }

        /* ============================================================
           PAGINATION
           ============================================================ */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px 24px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pagination .info {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.25);
        }

        .pagination .pages {
            display: flex;
            gap: 4px;
        }

        .page-btn {
            padding: 4px 12px;
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            background: transparent;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            font-family: var(--font);
            font-size: 0.75rem;
            transition: all var(--transition);
        }

        .page-btn:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        .page-btn.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            border-color: var(--gold);
            color: #0a1628;
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ============================================================
           NOTIFICATION
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 24px;
            border-radius: 12px;
            color: #fff;
            font-family: var(--font);
            font-size: 14px;
            z-index: 9999;
            animation: slideUp 0.4s ease-out;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 400px;
            direction: rtl;
        }

        .toast-success {
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.2);
        }

        .toast-error {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.2);
        }

        .toast-warning {
            background: rgba(234,179,8,0.15);
            border: 1px solid rgba(234,179,8,0.2);
        }

        .toast-info {
            background: rgba(9,132,227,0.15);
            border: 1px solid rgba(9,132,227,0.2);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 992px) {
            .tracking-header { padding: 12px 16px; top: 60px; }
            .tracking-header-left h2 { font-size: 18px; }
            .stats-grid { padding: 12px 16px; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
            .filter-bar { padding: 8px 16px; gap: 6px 10px; }
            .table-wrapper { padding: 12px 16px 16px; }
            .pagination { padding: 12px 16px 16px; }
        }

        @media (max-width: 768px) {
            .tracking-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 12px 16px;
                top: 56px;
            }
            .tracking-header-left { width: 100%; }
            .tracking-header-left h2 { font-size: 16px; }
            .tracking-header-actions { width: 100%; justify-content: flex-start; }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 10px 16px;
            }
            .stat-card { padding: 12px 14px; }
            .stat-card .number { font-size: 20px; }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 10px 16px;
                gap: 6px;
            }
            .filter-bar label { font-size: 0.65rem; }
            .filter-bar select, .filter-bar input { min-width: 100%; }
            .table-wrapper { padding: 10px 12px 12px; }
            .table-wrapper table { font-size: 0.7rem; min-width: 600px; }
            thead th, tbody td { padding: 6px 4px; }
            .pagination { flex-direction: column; align-items: center; }
            .tracking-header-actions .btn-action { padding: 6px 12px; font-size: 0.7rem; }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .stat-card { padding: 10px 12px; }
            .stat-card .number { font-size: 18px; }
            .stat-card .label { font-size: 9px; }
            .tracking-header-left .header-icon { width: 36px; height: 36px; font-size: 16px; }
            .tracking-header-left h2 { font-size: 14px; }
            .tracking-header-left p { font-size: 10px; }
        }
    </style>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <div class="tracking-header">
        <div class="tracking-header-left">
            <div class="header-icon">
                <i class="fas fa-map-marked-alt"></i>
            </div>
            <div>
                <h2>تتبع المستخدمين والجاهزية</h2>
                <p>مراقبة مواقع المستخدمين وحالة الجاهزية في الوقت الفعلي</p>
            </div>
        </div>
        <div class="tracking-header-actions">
            <button class="btn-action primary" id="refreshBtn">
                <i class="fas fa-sync-alt"></i> تحديث
            </button>
            <button class="btn-action export" id="exportBtn">
                <i class="fas fa-file-excel"></i> تصدير
            </button>
            <button class="btn-action secondary" onclick="window.print()">
                <i class="fas fa-print"></i> طباعة
            </button>
        </div>
    </div>

    <!-- ============================================================
    STATS CARDS
    ============================================================ -->
    <div class="stats-grid" id="trackingStats">
        <div class="stat-card">
            <div class="number gold" id="totalUsers">0</div>
            <div class="label">👥 إجمالي المستخدمين</div>
            <span class="icon-bg"><i class="fas fa-users"></i></span>
        </div>
        <div class="stat-card">
            <div class="number green" id="activeNow">0</div>
            <div class="label">🟢 نشط الآن</div>
            <span class="icon-bg"><i class="fas fa-circle"></i></span>
        </div>
        <div class="stat-card">
            <div class="number yellow" id="readyUsers">0</div>
            <div class="label">✅ جاهز</div>
            <span class="icon-bg"><i class="fas fa-check-circle"></i></span>
        </div>
        <div class="stat-card">
            <div class="number red" id="busyUsers">0</div>
            <div class="label">🔴 مشغول</div>
            <span class="icon-bg"><i class="fas fa-clock"></i></span>
        </div>
        <div class="stat-card">
            <div class="number blue" id="offlineUsers">0</div>
            <div class="label">⚫ غير متصل</div>
            <span class="icon-bg"><i class="fas fa-power-off"></i></span>
        </div>
    </div>

    <!-- ============================================================
    FILTER BAR
    ============================================================ -->
    <div class="filter-bar">
        <label><i class="fas fa-search"></i> بحث</label>
        <input type="text" id="searchTracking" placeholder="اسم المستخدم، الموقع..." />

        <label><i class="fas fa-filter"></i> الحالة</label>
        <select id="fStatusTracking">
            <option value="الكل">📊 جميع الحالات</option>
            <option value="نشط">🟢 نشط</option>
            <option value="جاهز">✅ جاهز</option>
            <option value="مشغول">🔴 مشغول</option>
            <option value="غير متصل">⚫ غير متصل</option>
        </select>

        <label><i class="fas fa-user-tag"></i> الدور</label>
        <select id="fRoleTracking">
            <option value="الكل">👤 جميع الأدوار</option>
            <option value="إداري">🛡️ إداري</option>
            <option value="مشرف">🔧 مشرف</option>
            <option value="مستخدم">👤 مستخدم</option>
            <option value="مراقب">📡 مراقب</option>
        </select>

        <label><i class="fas fa-calendar-alt"></i> من</label>
        <input type="date" id="fDateFrom" />
        <label><i class="fas fa-calendar-alt"></i> إلى</label>
        <input type="date" id="fDateTo" />

        <button class="btn-filter primary" id="filterBtn">
            <i class="fas fa-filter"></i> فلترة
        </button>
        <button class="btn-filter outline" id="resetBtn">
            <i class="fas fa-undo-alt"></i> إلغاء
        </button>
    </div>

    <!-- ============================================================
    TABLE
    ============================================================ -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="text-align:right;"><i class="fas fa-hashtag"></i> #</th>
                    <th style="text-align:right;"><i class="fas fa-user"></i> المستخدم</th>
                    <th><i class="fas fa-user-tag"></i> الدور</th>
                    <th><i class="fas fa-map-marker-alt"></i> الموقع</th>
                    <th><i class="fas fa-clock"></i> آخر نشاط</th>
                    <th><i class="fas fa-circle"></i> الحالة</th>
                    <th><i class="fas fa-bolt"></i> الجاهزية</th>
                </tr>
            </thead>
            <tbody id="trackingBody">
                <tr>
                    <td colspan="7" class="empty-state">
                        <div class="spinner"></div>
                        <h3>جاري تحميل بيانات التتبع...</h3>
                        <p>يرجى الانتظار</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- ============================================================
    PAGINATION
    ============================================================ -->
    <div class="pagination">
        <span class="info" id="paginationInfo">عرض 1-10 من 0 مستخدم</span>
        <div class="pages">
            <button class="page-btn" id="prevPage">‹</button>
            <button class="page-btn active" id="page1">1</button>
            <button class="page-btn" id="page2">2</button>
            <button class="page-btn" id="page3">3</button>
            <button class="page-btn" id="nextPage">›</button>
        </div>
    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // DATA
            // ============================================================
            var trackingData = [
                { id: 1, name: 'أحمد محمد', role: 'إداري', location: 'تونس - المركز', lastActive: '2026-08-26 10:30', status: 'نشط', readiness: 'جاهز' },
                { id: 2, name: 'سارة علي', role: 'مشرف', location: 'صفاقس - الميناء', lastActive: '2026-08-26 09:45', status: 'نشط', readiness: 'جاهز' },
                { id: 3, name: 'محمد خالد', role: 'مستخدم', location: 'بنزرت - قاعدة بحرية', lastActive: '2026-08-26 08:15', status: 'نشط', readiness: 'مشغول' },
                { id: 4, name: 'فاطمة نور', role: 'مراقب', location: 'المنستير - وحدة صيانة', lastActive: '2026-08-26 07:30', status: 'نشط', readiness: 'جاهز' },
                { id: 5, name: 'علي حسن', role: 'مستخدم', location: 'قابس - ميناء', lastActive: '2026-08-25 17:20', status: 'غير متصل', readiness: 'غير جاهز' },
                { id: 6, name: 'نورا سليم', role: 'مشرف', location: 'سوسة - الميناء', lastActive: '2026-08-26 10:00', status: 'نشط', readiness: 'جاهز' },
                { id: 7, name: 'ياسين عمر', role: 'مستخدم', location: 'جرجيس - وحدة صيانة', lastActive: '2026-08-25 14:30', status: 'غير متصل', readiness: 'مشغول' },
                { id: 8, name: 'ليلى منير', role: 'مراقب', location: 'تونس - المجمع الأمني', lastActive: '2026-08-26 09:00', status: 'نشط', readiness: 'جاهز' },
                { id: 9, name: 'كريم سامي', role: 'مستخدم', location: 'الحرس البحري بالشمال', lastActive: '2026-08-26 08:45', status: 'نشط', readiness: 'مشغول' },
                { id: 10, name: 'منى طارق', role: 'مشرف', location: 'صفاقس - وحدة صيانة', lastActive: '2026-08-25 16:00', status: 'غير متصل', readiness: 'جاهز' },
                { id: 11, name: 'سامي رضا', role: 'مستخدم', location: 'الساحل - الحرس البحري', lastActive: '2026-08-26 07:00', status: 'نشط', readiness: 'جاهز' },
                { id: 12, name: 'هالة نادر', role: 'مراقب', location: 'الجنوب - قاعدة بحرية', lastActive: '2026-08-26 06:30', status: 'نشط', readiness: 'جاهز' }
            ];

            // ============================================================
            // STATE
            // ============================================================
            var filteredData = trackingData.slice();
            var currentPage = 1;
            var itemsPerPage = 10;

            // ============================================================
            // DOM REFS
            // ============================================================
            var $ = function(id) { return document.getElementById(id); };

            // ============================================================
            // HELPERS
            // ============================================================
            function getStatusBadge(status) {
                var map = {
                    'نشط': 'active',
                    'غير متصل': 'inactive',
                    'جاهز': 'active',
                    'مشغول': 'pending'
                };
                return map[status] || '';
            }

            function getReadinessBadge(readiness) {
                var map = {
                    'جاهز': 'active',
                    'مشغول': 'pending',
                    'غير جاهز': 'inactive'
                };
                return map[readiness] || '';
            }

            function getReadinessIcon(readiness) {
                var map = {
                    'جاهز': '✅',
                    'مشغول': '🔴',
                    'غير جاهز': '⚫'
                };
                return map[readiness] || '❓';
            }

            function getRoleBadge(role) {
                var map = {
                    'إداري': 'admin',
                    'مشرف': 'user',
                    'مستخدم': 'user',
                    'مراقب': 'user'
                };
                return map[role] || 'user';
            }

            function getStatusIcon(status) {
                var map = {
                    'نشط': '🟢',
                    'غير متصل': '⚫'
                };
                return map[status] || '🟡';
            }

            function formatDate(dateStr) {
                if (!dateStr) return '-';
                var parts = dateStr.split(' ');
                var dateParts = parts[0].split('-');
                return dateParts[2] + '/' + dateParts[1] + '/' + dateParts[0] + ' ' + (parts[1] || '');
            }

            // ============================================================
            // RENDER
            // ============================================================
            function renderTracking() {
                renderStats();
                renderTable();
                renderPagination();
            }

            function renderStats() {
                var total = trackingData.length;
                var active = trackingData.filter(function(u) { return u.status === 'نشط'; }).length;
                var ready = trackingData.filter(function(u) { return u.readiness === 'جاهز'; }).length;
                var busy = trackingData.filter(function(u) { return u.readiness === 'مشغول'; }).length;
                var offline = trackingData.filter(function(u) { return u.status === 'غير متصل'; }).length;

                $('totalUsers').textContent = total;
                $('activeNow').textContent = active;
                $('readyUsers').textContent = ready;
                $('busyUsers').textContent = busy;
                $('offlineUsers').textContent = offline;
            }

            function renderTable() {
                var search = $('searchTracking').value.toLowerCase();
                var statusFilter = $('fStatusTracking').value;
                var roleFilter = $('fRoleTracking').value;
                var dateFrom = $('fDateFrom').value;
                var dateTo = $('fDateTo').value;

                filteredData = trackingData.filter(function(u) {
                    if (search && !u.name.includes(search) && !u.location.includes(search)) return false;
                    if (statusFilter !== 'الكل' && u.status !== statusFilter && u.readiness !== statusFilter) return false;
                    if (roleFilter !== 'الكل' && u.role !== roleFilter) return false;
                    if (dateFrom && u.lastActive < dateFrom) return false;
                    if (dateTo && u.lastActive > dateTo) return false;
                    return true;
                });

                var tbody = $('trackingBody');

                if (filteredData.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="empty-state">
                                <span class="empty-icon"><i class="fas fa-search"></i></span>
                                <h3>لا توجد نتائج مطابقة</h3>
                                <p>حاول تغيير معايير البحث أو الفلترة</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                var start = (currentPage - 1) * itemsPerPage;
                var end = start + itemsPerPage;
                var pageData = filteredData.slice(start, end);

                var html = '';
                for (var i = 0; i < pageData.length; i++) {
                    var u = pageData[i];
                    var statusBadge = getStatusBadge(u.status);
                    var readinessBadge = getReadinessBadge(u.readiness);
                    var readinessIcon = getReadinessIcon(u.readiness);
                    var statusIcon = getStatusIcon(u.status);
                    var roleBadge = getRoleBadge(u.role);

                    html += `
                        <tr>
                            <td style="text-align:right;font-weight:600;color:var(--gold-light);">${u.id}</td>
                            <td style="text-align:right;font-weight:700;color:#fff;">${u.name}</td>
                            <td><span class="status-badge ${roleBadge}">${u.role}</span></td>
                            <td><i class="fas fa-map-pin" style="color:var(--gold-light);"></i> ${u.location}</td>
                            <td>${formatDate(u.lastActive)}</td>
                            <td><span class="status-badge ${statusBadge}">${statusIcon} ${u.status}</span></td>
                            <td><span class="status-badge ${readinessBadge}">${readinessIcon} ${u.readiness}</span></td>
                        </tr>
                    `;
                }

                tbody.innerHTML = html;
                $('paginationInfo').textContent = 'عرض ' + (start + 1) + '-' + Math.min(end, filteredData.length) + ' من ' + filteredData.length + ' مستخدم';
            }

            function renderPagination() {
                var totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
                $('prevPage').disabled = currentPage <= 1;
                $('nextPage').disabled = currentPage >= totalPages;

                for (var i = 1; i <= 3; i++) {
                    var btn = $('page' + i);
                    if (i <= totalPages) {
                        btn.style.display = 'inline-block';
                        btn.textContent = i;
                        btn.className = 'page-btn ' + (i === currentPage ? 'active' : '');
                        btn.onclick = function(page) { return function() { goToPage(page); }; }(i);
                    } else {
                        btn.style.display = 'none';
                    }
                }
            }

            // ============================================================
            // ACTIONS
            // ============================================================
            function changePage(delta) {
                var totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
                var newPage = currentPage + delta;
                if (newPage >= 1 && newPage <= totalPages) {
                    currentPage = newPage;
                    renderTracking();
                }
            }

            function goToPage(page) {
                var totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
                if (page >= 1 && page <= totalPages) {
                    currentPage = page;
                    renderTracking();
                }
            }

            function refreshTracking() {
                var btn = $('refreshBtn');
                var original = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';
                btn.disabled = true;

                setTimeout(function() {
                    renderTracking();
                    btn.innerHTML = original;
                    btn.disabled = false;
                    showNotification('✅ تم تحديث بيانات التتبع بنجاح', 'success');
                }, 600);
            }

            function resetFilters() {
                $('searchTracking').value = '';
                $('fStatusTracking').value = 'الكل';
                $('fRoleTracking').value = 'الكل';
                $('fDateFrom').value = '';
                $('fDateTo').value = '';
                currentPage = 1;
                renderTracking();
                showNotification('✅ تم إلغاء جميع الفلاتر', 'success');
            }

            function exportTrackingData() {
                showNotification('📊 جاري تصدير البيانات إلى Excel...', 'info');
                setTimeout(function() {
                    showNotification('✅ تم تصدير البيانات بنجاح', 'success');
                }, 1500);
            }

            // ============================================================
            // NOTIFICATION
            // ============================================================
            function showNotification(message, type) {
                var old = document.querySelector('.toast');
                if (old) old.remove();

                var colors = {
                    success: 'rgba(34,197,94,0.15)',
                    info: 'rgba(9,132,227,0.15)',
                    error: 'rgba(239,68,68,0.15)'
                };

                var notif = document.createElement('div');
                notif.className = 'toast toast-' + type;
                notif.style.cssText = `
                    position: fixed;
                    bottom: 24px;
                    right: 24px;
                    background: ${colors[type] || colors.info};
                    backdrop-filter: blur(12px);
                    border: 1px solid rgba(255,255,255,0.1);
                    padding: 14px 24px;
                    border-radius: 12px;
                    color: #fff;
                    font-family: Cairo, sans-serif;
                    font-size: 14px;
                    z-index: 9999;
                    animation: slideUp 0.4s ease-out;
                    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
                    max-width: 400px;
                    direction: rtl;
                `;
                notif.textContent = message;

                document.body.appendChild(notif);

                setTimeout(function() {
                    notif.style.opacity = '0';
                    notif.style.transform = 'translateY(20px)';
                    notif.style.transition = 'all 0.4s ease-out';
                    setTimeout(function() { notif.remove(); }, 400);
                }, 3000);
            }

            // ============================================================
            // EVENT BINDING
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                $('refreshBtn').addEventListener('click', refreshTracking);
                $('exportBtn').addEventListener('click', exportTrackingData);
                $('filterBtn').addEventListener('click', function() { currentPage = 1; renderTracking(); });
                $('resetBtn').addEventListener('click', resetFilters);

                $('searchTracking').addEventListener('keyup', function() { currentPage = 1; renderTracking(); });
                $('fStatusTracking').addEventListener('change', function() { currentPage = 1; renderTracking(); });
                $('fRoleTracking').addEventListener('change', function() { currentPage = 1; renderTracking(); });
                $('fDateFrom').addEventListener('change', function() { currentPage = 1; renderTracking(); });
                $('fDateTo').addEventListener('change', function() { currentPage = 1; renderTracking(); });

                $('prevPage').addEventListener('click', function() { changePage(-1); });
                $('nextPage').addEventListener('click', function() { changePage(1); });

                renderTracking();
                console.log('✅ Tracking Page loaded successfully!');
                console.log('📍 ' + trackingData.length + ' users tracked.');
            });

        })();
    </script>
</div>
