<div id="page-tracking">
    <style>
        /* ===== RESET & BASE ===== */
        #page-tracking {
            width: 100%;
            max-width: 100%;
            padding: 0;
            margin: 0;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            background: #0a0e1a;
            color: #e8edf5;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ===== BACKGROUND ===== */
        #page-tracking::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(230,179,30,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(9,132,227,0.03) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
            animation: bgPulse 15s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(2deg); }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: #e6b31e; border-radius: 10px; }

        /* ============================================================
           HEADER
           ============================================================ */
        .tracking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: sticky;
            top: 64px;
            z-index: 10;
            margin: 0;
            width: 100%;
        }

        .tracking-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .tracking-header-left .header-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e6b31e, #0984e3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #0a1628;
            animation: pulseGold 2s ease-in-out infinite;
        }

        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 20px rgba(230,179,30,0.1); }
            50% { box-shadow: 0 0 40px rgba(230,179,30,0.25); }
        }

        .tracking-header-left h2 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #f5d76e, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .tracking-header-left p {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin: 0;
        }

        .tracking-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cairo', sans-serif;
        }

        .btn-action.primary {
            background: linear-gradient(135deg, #e6b31e, #f5d76e);
            color: #0a1628;
        }

        .btn-action.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,179,30,0.3);
        }

        .btn-action.secondary {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
        }

        .btn-action.secondary:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
        }

        /* ============================================================
           MAP TYPE SELECTOR - 3 TYPES
           ============================================================ */
        .map-type-selector {
            display: flex;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-wrap: wrap;
            align-items: center;
        }

        .map-type-selector .label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
            margin-left: 10px;
        }

        .map-type-btn {
            padding: 8px 20px;
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 25px;
            background: transparent;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .map-type-btn:hover {
            border-color: rgba(255,255,255,0.15);
            color: #fff;
        }

        .map-type-btn.active {
            background: linear-gradient(135deg, #e6b31e, #f5d76e);
            border-color: #e6b31e;
            color: #0a1628;
        }

        .map-type-btn i {
            font-size: 1rem;
        }

        /* ============================================================
           MAP CONTAINER
           ============================================================ */
        .map-container {
            padding: 16px 24px;
            width: 100%;
        }

        .map-wrapper {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            overflow: hidden;
            min-height: 500px;
            position: relative;
        }

        .map-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
            min-height: 500px;
            display: block;
        }

        .map-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            padding: 40px;
            text-align: center;
            color: rgba(255,255,255,0.2);
        }

        .map-placeholder .map-icon {
            font-size: 4rem;
            color: rgba(255,255,255,0.05);
            margin-bottom: 16px;
        }

        .map-placeholder h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: rgba(255,255,255,0.15);
            margin-bottom: 8px;
        }

        .map-placeholder p {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.08);
        }

        /* ============================================================
           STATS CARDS
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            padding: 0 24px 16px;
            margin: 0;
            width: 100%;
        }

        .stat-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 16px 18px;
            text-align: center;
            transition: all 0.3s;
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #e6b31e, #0984e3);
            opacity: 0.6;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(230,179,30,0.15);
        }

        .stat-card .number {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        .stat-card .number.gold { color: #f5d76e; }
        .stat-card .number.green { color: #55efc4; }
        .stat-card .number.blue { color: #60a5fa; }
        .stat-card .number.red { color: #f87171; }
        .stat-card .number.pink { color: #f472b6; }

        .stat-card .label {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
            font-weight: 500;
        }

        /* ============================================================
           USER DETAILS PANEL
           ============================================================ */
        .user-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0a1628;
            border: 1px solid rgba(230,179,30,0.2);
            border-radius: 16px;
            padding: 30px;
            max-width: 450px;
            width: 90%;
            z-index: 1000;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            animation: slideUp 0.3s ease-out;
        }

        .user-panel.visible {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        .user-panel .close-btn {
            position: absolute;
            top: 12px;
            left: 16px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .user-panel .close-btn:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        .user-panel .user-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e6b31e, #0984e3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #0a1628;
            margin: 0 auto 16px;
            font-weight: 700;
        }

        .user-panel .user-name {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            color: #fff;
            margin-bottom: 4px;
        }

        .user-panel .user-role {
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .user-panel .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.85rem;
        }

        .user-panel .detail-row .label {
            color: rgba(255,255,255,0.3);
        }

        .user-panel .detail-row .value {
            color: #fff;
            font-weight: 600;
        }

        .user-panel .detail-row .value.gold { color: #f5d76e; }
        .user-panel .detail-row .value.green { color: #55efc4; }
        .user-panel .detail-row .value.red { color: #f87171; }
        .user-panel .detail-row .value.blue { color: #60a5fa; }

        /* ===== OVERLAY ===== */
        .panel-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 999;
        }

        .panel-overlay.visible {
            display: block;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .tracking-header { padding: 12px 16px; top: 56px; flex-direction: column; align-items: flex-start; }
            .tracking-header-left { width: 100%; }
            .tracking-header-left h2 { font-size: 16px; }
            .tracking-header-actions { width: 100%; justify-content: flex-start; }
            .map-type-selector { padding: 10px 16px; justify-content: center; }
            .map-type-btn { font-size: 0.7rem; padding: 6px 14px; }
            .map-container { padding: 12px 16px; }
            .map-wrapper { min-height: 350px; }
            .map-wrapper canvas { min-height: 350px; }
            .stats-grid { padding: 0 16px 12px; grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .stat-card .number { font-size: 20px; }
            .user-panel { padding: 20px; max-width: 95%; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
            .stat-card { padding: 10px 12px; }
            .stat-card .number { font-size: 18px; }
            .stat-card .label { font-size: 9px; }
            .map-type-selector { gap: 6px; }
            .map-type-btn { font-size: 0.6rem; padding: 4px 10px; }
            .map-wrapper { min-height: 280px; }
            .map-wrapper canvas { min-height: 280px; }
            .user-panel { padding: 16px; }
            .user-panel .user-name { font-size: 18px; }
        }

                return '#fbbf24';
            }

            // ============================================================
            // STATS
            // ============================================================
            function updateStats() {
                var total = usersData.length;
                var active = usersData.filter(function(u) { return u.status === 'نشط'; }).length;
                var ready = usersData.filter(function(u) { return u.readiness === 'جاهز'; }).length;
                var busy = usersData.filter(function(u) { return u.readiness === 'مشغول'; }).length;
                var offline = usersData.filter(function(u) { return u.status === 'غير متصل'; }).length;

                document.getElementById('totalUsers').textContent = total;
                document.getElementById('activeNow').textContent = active;
                document.getElementById('readyUsers').textContent = ready;
                document.getElementById('busyUsers').textContent = busy;
                document.getElementById('offlineUsers').textContent = offline;
            }

            // ============================================================
            // DRAW MAP - WITH 3 TYPES
            // ============================================================
            function drawMap() {
                var ctx = canvas.getContext('2d');
                var rect = canvas.parentElement.getBoundingClientRect();
                var width = rect.width - 2;
                var height = Math.max(500, window.innerHeight * 0.6);

                canvas.width = width * 2;
                canvas.height = height * 2;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.scale(2, 2);

                // ===== BACKGROUND =====
                var gradient = ctx.createLinearGradient(0, 0, 0, height);
                if (currentMapType === 'satellite') {
                    gradient.addColorStop(0, '#1a2a4a');
                    gradient.addColorStop(0.5, '#2d4a6a');
                    gradient.addColorStop(1, '#1a3a4a');
                } else if (currentMapType === 'terrain') {
                    gradient.addColorStop(0, '#2d2a1a');
                    gradient.addColorStop(0.3, '#4a3a2a');
                    gradient.addColorStop(0.6, '#3a5a3a');
                    gradient.addColorStop(1, '#2a4a3a');
                } else {
                    gradient.addColorStop(0, '#1a2a3a');
                    gradient.addColorStop(0.3, '#2a3a4a');
                    gradient.addColorStop(0.6, '#1a3a5a');
                    gradient.addColorStop(1, '#1a2a4a');
                }

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);

                // ===== GRID LINES =====
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.lineWidth = 1;
                for (var gx = 0; gx < width; gx += 60) {
                    ctx.beginPath();
                    ctx.moveTo(gx, 0);
                    ctx.lineTo(gx, height);
                    ctx.stroke();
                }
                for (var gy = 0; gy < height; gy += 60) {
                    ctx.beginPath();
                    ctx.moveTo(0, gy);
                    ctx.lineTo(width, gy);
                    ctx.stroke();
                }

                // ===== FIND BOUNDS =====
                var minLat = 33, maxLat = 38, minLng = 8, maxLng = 12;
                var latRange = maxLat - minLat;
                var lngRange = maxLng - minLng;

                // ===== DRAW USERS =====
                var radius = 18;

                usersData.forEach(function(user) {
                    var x = ((user.lng - minLng) / lngRange) * width;
                    var y = ((maxLat - user.lat) / latRange) * height;

                    if (x < -50 || x > width + 50 || y < -50 || y > height + 50) return;

                    var color = getColorByStatus(user.status, user.readiness);

                    // ===== GLOW =====
                    var glow = ctx.createRadialGradient(x, y, 0, x, y, radius * 3);
                    glow.addColorStop(0, color + '44');
                    glow.addColorStop(1, color + '00');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(x, y, radius * 3, 0, Math.PI * 2);
                    ctx.fill();

                    // ===== PULSE ANIMATION =====
                    var pulseSize = radius * 1.5 + Math.sin(Date.now() / 1000 + user.id) * 4;
                    ctx.strokeStyle = color + '88';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, pulseSize, 0, Math.PI * 2);
                    ctx.stroke();

                    // ===== CIRCLE =====
                    var grad = ctx.createRadialGradient(x - 4, y - 4, 0, x, y, radius);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.3, color);
                    grad.addColorStop(1, color + 'aa');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fill();

                    // ===== BORDER =====
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.stroke();

                    // ===== USER INITIALS =====
                    ctx.fillStyle = '#0a1628';
                    ctx.font = 'bold 12px Cairo, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(getInitials(user.name), x, y + 1);

                    // ===== USER NAME LABEL =====
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.font = '11px Cairo, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(user.name, x, y - radius - 6);

                    // ===== STATUS DOT =====
                    var dotColor = user.status === 'نشط' ? '#22c55e' : '#6b7280';
                    ctx.fillStyle = dotColor;
                    ctx.shadowColor = dotColor + '88';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(x + radius + 6, y - radius + 6, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // ===== READINESS ICON =====
                    ctx.font = '10px Cairo, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    var icon = user.readiness === 'جاهز' ? '✅' : (user.readiness === 'مشغول' ? '🔴' : '⚫');
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.fillText(icon, x + radius + 14, y - radius + 8);

                    // ===== CLICK AREA (invisible for interaction) =====
                    // We handle clicks via canvas click event
                    user._x = x;
                    user._y = y;
                    user._radius = radius;
                });

                // ===== LEGEND =====
                var legendX = 16, legendY = 16;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath();
                ctx.roundRect(legendX, legendY, 180, 130, 10);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.font = '11px Cairo, sans-serif';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';

                var legendItems = [
                    { color: '#22c55e', label: '🟢 نشط - جاهز' },
                    { color: '#ef4444', label: '🔴 نشط - مشغول' },
                    { color: '#6b7280', label: '⚫ غير متصل' }
                ];

                legendItems.forEach(function(item, idx) {
                    var yPos = legendY + 20 + idx * 30;
                    ctx.fillStyle = item.color;
                    ctx.beginPath();
                    ctx.arc(legendX + 155, yPos, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.textAlign = 'right';
                    ctx.fillText(item.label, legendX + 148, yPos);
                });

                // ===== MAP TYPE LABEL =====
                var typeLabels = {
                    'satellite': '🛰️ قمر صناعي',
                    'terrain': '⛰️ تضاريس',
                    'hybrid': '🔀 هجين'
                };
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.font = '11px Cairo, sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText(typeLabels[currentMapType] || '', 16, height - 16);

                // ===== USERS COUNT =====
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.font = '10px Cairo, sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText('👥 ' + usersData.length + ' مستخدم', width - 16, height - 16);
            }

            // ============================================================
            // CANVAS CLICK - SHOW USER DETAILS
            // ============================================================
            canvas.addEventListener('click', function(e) {
                var rect = canvas.getBoundingClientRect();
                var scaleX = canvas.width / (rect.width * 2);
                var scaleY = canvas.height / (rect.height * 2);
                var mouseX = (e.clientX - rect.left) * scaleX;
                var mouseY = (e.clientY - rect.top) * scaleY;

                // Find closest user
                var found = null;
                var minDist = 50;
                usersData.forEach(function(user) {
                    if (user._x === undefined) return;
                    var dist = Math.sqrt(Math.pow(mouseX - user._x, 2) + Math.pow(mouseY - user._y, 2));
                    if (dist < minDist) {
                        minDist = dist;
                        found = user;
                    }
                });

                if (found) {
                    showUserPanel(found);
                }
            });

            // ============================================================
            // USER PANEL
            // ============================================================
            function showUserPanel(user) {
                selectedUser = user;
                document.getElementById('panelOverlay').classList.add('visible');
                document.getElementById('userPanel').classList.add('visible');

                document.getElementById('panelAvatar').textContent = getInitials(user.name);
                document.getElementById('panelName').textContent = user.name;
                document.getElementById('panelRole').textContent = '🔹 ' + user.role;
                document.getElementById('panelId').textContent = '#' + user.id;
                document.getElementById('panelLocation').textContent = user.location;
                document.getElementById('panelCoords').textContent = user.lat + ', ' + user.lng;

                var statusEl = document.getElementById('panelStatus');
                statusEl.textContent = getStatusBadge(user.status);
                statusEl.className = 'value ' + getStatusClass(user.status);

                var readinessEl = document.getElementById('panelReadiness');
                readinessEl.textContent = getReadinessBadge(user.readiness);
                readinessEl.className = 'value ' + getReadinessClass(user.readiness);

                document.getElementById('panelLastActive').textContent = user.lastActive || 'غير معروف';
                document.getElementById('panelEmail').textContent = user.email;
            }

            window.closeUserPanel = function() {
                document.getElementById('panelOverlay').classList.remove('visible');
                document.getElementById('userPanel').classList.remove('visible');
                selectedUser = null;
            };

            // ============================================================
            // MAP TYPE SWITCHER
            // ============================================================
            window.switchMap = function(type) {
                currentMapType = type;
                document.querySelectorAll('.map-type-btn').forEach(function(btn) {
                    btn.classList.toggle('active', btn.getAttribute('onclick').includes(type));
                });
                drawMap();
            };

            // ============================================================
            // REFRESH
            // ============================================================
            window.refreshTracking = function() {
                var btn = document.querySelector('.btn-action.primary');
                var original = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';
                btn.disabled = true;

                setTimeout(function() {
                    updateStats();
                    drawMap();
                    btn.innerHTML = original;
                    btn.disabled = false;
                }, 600);
            };

            // ============================================================
            // INIT
            // ============================================================
            function init() {
                // Add roundRect polyfill for older browsers
                if (!CanvasRenderingContext2D.prototype.roundRect) {
                    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                        if (r > w/2) r = w/2;
                        if (r > h/2) r = h/2;
                        this.moveTo(x + r, y);
                        this.lineTo(x + w - r, y);
                        this.quadraticCurveTo(x + w, y, x + w, y + r);
                        this.lineTo(x + w, y + h - r);
                        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                        this.lineTo(x + r, y + h);
                        this.quadraticCurveTo(x, y + h, x, y + h - r);
                        this.lineTo(x, y + r);
                        this.quadraticCurveTo(x, y, x + r, y);
                        return this;
                    };
                }

                updateStats();
                drawMap();

                // Redraw on resize
                window.addEventListener('resize', function() {
                    drawMap();
                });

                console.log('✅ Tracking Map loaded successfully!');
                console.log('📍 ' + usersData.length + ' users on map');
                console.log('🗺️ 3 map types: satellite, terrain, hybrid');
            }

            // Run on load
            document.addEventListener('DOMContentLoaded', init);

        })();
    </script>
</div>
