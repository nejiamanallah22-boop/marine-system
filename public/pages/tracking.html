<div id="page-tracking">
    <style>
        /* ============================================================
           📊 TRACKING PAGE - PROFESSIONAL v2.0

        /* ===== CSS VARIABLES ===== */
        :root {
            --primary-dark: #0a1628;
            --primary: #0f3460;

<script>
// ============================================================
// 📊 TRACKING PAGE - v2.0 (FIXED)
// ============================================================

// ✅ تجنب إعادة تعريف المتغيرات
if (typeof window._trackingLoaded === 'undefined') {
    window._trackingLoaded = false;
}

// ============================================================
// 1. TOKEN FUNCTIONS (موحدة)
// ============================================================

function getToken() {
    return localStorage.getItem('marine_token') ||
           localStorage.getItem('token') ||
           localStorage.getItem('authToken') ||
           localStorage.getItem('accessToken') ||
           null;
}

function getAuthHeaders() {
    const token = getToken();
    return {
        'Content-Type': 'application/json',
        'Authorization': token ? 'Bearer ' + token : ''
    };
}

function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer') || document.body;
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    
    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${message}`;
    container.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(30px)';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function formatDate(dateStr) {
    if (!dateStr) return '-';
    try {
        const date = new Date(dateStr);
        if (isNaN(date.getTime())) return dateStr;
        return date.toLocaleDateString('ar-TN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
        });
    } catch { return dateStr; }
}

function formatTime(dateStr) {
    if (!dateStr) return '-';
    try {
        const date = new Date(dateStr);
        if (isNaN(date.getTime())) return dateStr;
        return date.toLocaleTimeString('ar-TN', {
            hour: '2-digit',
            minute: '2-digit'
        });
    } catch { return dateStr; }
}

// ============================================================
// 2. تحميل البيانات
// ============================================================

async function loadTrackingLogs() {
    console.log('📊 تحميل سجل التتبع...');
    
    const token = getToken();
    if (!token) {
        console.warn('⚠️ لا يوجد توكن');
        return [];
    }
    
    try {
        const response = await fetch('/api/logs', {
            headers: getAuthHeaders()
        });
        
        if (!response.ok) {
            if (response.status === 401) {
                localStorage.removeItem('marine_token');
                localStorage.removeItem('token');
                window.location.href = '/index.html';
            }
            throw new Error('فشل تحميل السجل');
        }
        
        const data = await response.json();
        const logs = data.logs || data || [];
        console.log('✅ تم تحميل السجل:', logs.length);
        return logs;
    } catch (error) {
        console.error('❌ خطأ في تحميل السجل:', error);
        return [];
    }
}

// ============================================================
// 3. عرض البيانات
// ============================================================

async function renderTracking() {
    const tbody = document.getElementById('trackingBody');
    tbody.innerHTML = `
        <tr>
            <td colspan="7" class="empty-state">
                <div class="spinner"></div>
                <h3>جاري تحميل البيانات...</h3>
                <p>يرجى الانتظار</p>
            </td>
        </tr>
    `;
    
    try {
        let logs = await loadTrackingLogs();
        
        // ✅ تطبيق الفلاتر
        const startDate = document.getElementById('trackDateStart').value;
        const endDate = document.getElementById('trackDateEnd').value;
        
        if (startDate) {
            const start = new Date(startDate);
            start.setHours(0, 0, 0, 0);
            logs = logs.filter(l => {
                const d = l.createdAt || l.date || l.timestamp;
                if (!d) return false;
                const logDate = new Date(d);
                logDate.setHours(0, 0, 0, 0);
                return logDate >= start;
            });
        }
        
        if (endDate) {
            const end = new Date(endDate);
            end.setHours(23, 59, 59, 999);
            logs = logs.filter(l => {
                const d = l.createdAt || l.date || l.timestamp;
                if (!d) return false;
                const logDate = new Date(d);
                return logDate <= end;
            });
        }
        
        // ✅ تحديث الإحصائيات
        const total = logs.length;
        const uniqueUsers = new Set(logs.map(l => l.userName || l.username || l.user)).size;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const todayActivities = logs.filter(l => {
            const d = l.createdAt || l.date || l.timestamp;
            if (!d) return false;
            const logDate = new Date(d);
            logDate.setHours(0, 0, 0, 0);
            return logDate.getTime() === today.getTime();
        }).length;
        
        document.getElementById('totalActivities').textContent = total;
        document.getElementById('uniqueUsers').textContent = uniqueUsers;
        document.getElementById('todayActivities').textContent = todayActivities;
        document.getElementById('avgActivity').textContent = total > 0 ? Math.round(total / 7) : 0;
        
        if (logs.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="empty-state">
                        <span class="empty-icon"><i class="fas fa-inbox"></i></span>
                        <h3>لا توجد نشاطات مسجلة</h3>
                        <p>لم يتم العثور على أي سجلات نشاط</p>
                    </td>
                </tr>
            `;
            return;
        }
        
        // ✅ عرض البيانات
        let html = '';
        logs.slice(0, 200).forEach((l, index) => {
            const action = l.action || 'نشاط';
            const userName = l.userName || l.username || l.user || 'مجهول';
            const userRole = l.userRole || l.role || 'مشاهد';
            const details = l.details || l.message || '-';
            const date = l.createdAt || l.date || l.timestamp;
            
            // ✅ أيقونة الإجراء
            let icon = '📝';
            if (action.includes('إضافة')) icon = '➕';
            else if (action.includes('تعديل')) icon = '✏️';
            else if (action.includes('حذف')) icon = '🗑️';
            else if (action.includes('دخول')) icon = '🔐';
            else if (action.includes('خروج')) icon = '🚪';
            else if (action.includes('صيانة')) icon = '🔧';
            else if (action.includes('تذكرة')) icon = '🎫';
            
            html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${formatDate(date)}</td>
                    <td>${formatTime(date)}</td>
                    <td><span class="vessel-name">${escapeHtml(userName)}</span></td>
                    <td><span style="font-size:0.65rem;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.3);">${escapeHtml(userRole)}</span></td>
                    <td><span style="color:var(--gold-light);font-weight:600;">${icon} ${escapeHtml(action)}</span></td>
                    <td style="text-align:right;max-width:300px;word-break:break-word;">${escapeHtml(details)}</td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
        
    } catch (error) {
        console.error('❌ خطأ في renderTracking:', error);
        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="empty-state">
                    <span class="empty-icon"><i class="fas fa-exclamation-triangle" style="color:#f87171;"></i></span>
                    <h3 style="color:#f87171;">خطأ في تحميل البيانات</h3>
                    <p style="color:rgba(255,255,255,0.3);">${escapeHtml(error.message)}</p>
                    <button class="retry-btn" onclick="renderTracking()">
                        <i class="fas fa-sync-alt"></i> إعادة المحاولة
                    </button>
                </td>
            </tr>
        `;
    }
}

// ============================================================
// 4. دوال مساعدة
// ============================================================

function resetTrackingFilters() {
    document.getElementById('trackDateStart').value = '';
    document.getElementById('trackDateEnd').value = '';
    renderTracking();
    showToast('✅ تم إعادة ضبط الفلاتر', 'success');
}

function refreshTracking() {
    renderTracking();
    showToast('🔄 تم تحديث سجل التتبع', 'info');
}

// ============================================================
// 5. تصدير البيانات
// ============================================================

async function exportTrackingData() {
    const token = getToken();
    if (!token) {
        showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
        return;
    }
    
    try {
        const response = await fetch('/api/logs', {
            headers: getAuthHeaders()
        });
        
        if (!response.ok) throw new Error('فشل تحميل البيانات');
        
        const data = await response.json();
        const logs = data.logs || data || [];
        
        if (logs.length === 0) {
            showToast('⚠️ لا توجد بيانات للتصدير', 'warning');
            return;
        }
        
        // ✅ إنشاء CSV
        const headers = ['التاريخ', 'الوقت', 'المستخدم', 'الصلاحية', 'الإجراء', 'التفاصيل'];
        const rows = logs.map(l => [
            formatDate(l.createdAt || l.date || l.timestamp),
            formatTime(l.createdAt || l.date || l.timestamp),
            l.userName || l.username || l.user || 'مجهول',
            l.userRole || l.role || 'مشاهد',
            l.action || 'نشاط',
            (l.details || l.message || '-').replace(/,/g, ' ')
        ]);
        
        const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `tracking_log_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
        
        showToast('📥 تم تصدير التقرير بنجاح', 'success');
    } catch (error) {
        showToast('❌ خطأ في التصدير: ' + error.message, 'error');
    }
}

// 6. التهيئة
// ============================================================

function initTrackingPage() {
    console.log('📊 تهيئة صفحة التتبع...');
    if (window._trackingLoaded) {
        console.log('⚠️ تم تهيئة الصفحة مسبقاً');
        return;
    }
    window._trackingLoaded = true;
    setTimeout(renderTracking, 300);
}

// 7. ربط الدوال
// ============================================================

if (document.getElementById('page-tracking')) {
    console.log('📄 تم اكتشاف صفحة التتبع');
    setTimeout(initTrackingPage, 300);
}

window.renderTracking = renderTracking;
window.refreshTracking = refreshTracking;
window.resetTrackingFilters = resetTrackingFilters;
window.exportTrackingData = exportTrackingData;
window.getToken = getToken;
window.getAuthHeaders = getAuthHeaders;

console.log('✅ صفحة التتبع v2.0 جاهزة');
</script>
