<script>
// ============================================================
// 📍 TRACKING PAGE - الكود الاحترافي الكامل v2.0
// ============================================================

// ============================================================
// 1. المتغيرات العامة
// ============================================================

let map = null;
let markers = {};
let userMarkers = {};
let socket = null;
let myLocation = null;
let watchId = null;
let isTracking = false;
let currentUser = null;

// ============================================================
// 2. تهيئة المستخدم الحالي
// ============================================================

try {
    const userData = localStorage.getItem('user');
    if (userData) {
        currentUser = JSON.parse(userData);
        console.log('👤 Current user:', currentUser);
        document.getElementById('trackingUserName').textContent = currentUser.name || 'مجهول';
    }
} catch(e) {
    console.warn('⚠️ Could not load user:', e);
}

// ============================================================
// 3. تهيئة الخريطة
// ============================================================

function initTrackingMap() {
    if (map) {
        map.invalidateSize();
        return;
    }
    
    console.log('🗺️ Initializing tracking map...');
    
    try {
        map = L.map('trackingMap', {
            center: [36.8, 10.18],
            zoom: 13,
            zoomControl: true,
            attributionControl: true
        });
        
        // طبقة الخريطة
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        }).addTo(map);
        
        // إضافة زر تحديد الموقع
        if (typeof L.Control.locate === 'function') {
            L.control.locate({
                position: 'topleft',
                strings: { title: 'عرض موقعي' },
                locateOptions: {
                    enableHighAccuracy: true,
                    maxZoom: 16
                }
            }).addTo(map);
        }
        
        // إضافة مقياس
        L.control.scale({
            position: 'bottomleft',
            metric: true,
            imperial: false
        }).addTo(map);
        
        console.log('✅ Map initialized');
        
        // تحميل المواقع بعد ثانية
        setTimeout(refreshLocations, 1000);
        
    } catch(error) {
        console.error('❌ Map initialization error:', error);
        document.getElementById('trackingMap').innerHTML = `
            <div style="display:flex; align-items:center; justify-content:center; height:100%; color:#f87171; flex-direction:column;">
                <div style="font-size:48px;">🗺️</div>
                <div style="margin-top:10px;">❌ خطأ في تحميل الخريطة</div>
                <div style="font-size:12px; color:rgba(255,255,255,0.3);">${error.message}</div>
                <button onclick="initTrackingMap()" style="margin-top:10px; padding:8px 20px; background:rgba(96,165,250,0.15); border:1px solid rgba(96,165,250,0.1); border-radius:8px; color:#60a5fa; cursor:pointer;">🔄 إعادة المحاولة</button>
            </div>
        `;
    }
}

// ============================================================
// 4. Socket.IO
// ============================================================

function initTrackingSocket() {
    if (socket) return;
    
    console.log('🔌 Connecting to Socket.IO...');
    
    try {
        socket = io('/', {
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: 10,
            reconnectionDelay: 1000,
            timeout: 10000
        });
        
        socket.on('connect', () => {
            console.log('✅ Socket connected');
            document.getElementById('gpsStatus').textContent = '🟢 متصل';
            document.getElementById('gpsStatus').style.color = '#4ade80';
            socket.emit('get-locations');
        });
        
        socket.on('connect_error', (error) => {
            console.warn('⚠️ Socket connection error:', error);
            document.getElementById('gpsStatus').textContent = '⚠️ محاولة الاتصال...';
            document.getElementById('gpsStatus').style.color = '#fbbf24';
        });
        
        socket.on('disconnect', () => {
            console.log('❌ Socket disconnected');
            document.getElementById('gpsStatus').textContent = '🔴 غير متصل';
            document.getElementById('gpsStatus').style.color = '#f87171';
        });
        
        socket.on('location-update', (data) => {
            console.log('📍 Location update:', data.username, data.lat, data.lng);
            updateMarker(data);
            updateUsersList();
        });
        
        socket.on('all-locations', (locations) => {
            console.log('📍 All locations:', locations.length);
            if (locations && Array.isArray(locations)) {
                locations.forEach(loc => updateMarker(loc));
                updateUsersList();
            }
        });
        
        socket.on('user-online', (data) => {
            console.log('👤 User online:', data.username);
            updateUsersList();
        });
        
        socket.on('user-offline', (data) => {
            console.log('👤 User offline:', data.userId);
            if (userMarkers[data.userId]) {
                map.removeLayer(userMarkers[data.userId]);
                delete userMarkers[data.userId];
                delete markers[data.userId];
            }
            updateUsersList();
        });
        
    } catch(error) {
        console.error('❌ Socket error:', error);
    }
}

// ============================================================
// 5. تحديث الماركر
// ============================================================

function updateMarker(data) {
    if (!map) return;
    
    const { userId, username, role, lat, lng, accuracy, status, updatedAt } = data;
    
    if (!userId || !lat || !lng) return;
    
    const isOnline = status === 'online' || status === 'online';
    const roleClass = role === 'مسؤول' ? 'admin' : role === 'مشرف' ? 'manager' : '';
    
    // حذف الماركر القديم
    if (userMarkers[userId]) {
        map.removeLayer(userMarkers[userId]);
        delete userMarkers[userId];
    }
    
    // أيقونة المستخدم
    const icon = L.divIcon({
        className: 'custom-div-icon',
        html: `
            <div class="user-marker">
                <div class="avatar ${isOnline ? 'online' : 'offline'} ${roleClass}">
                    ${role === 'مسؤول' ? '👑' : role === 'مشرف' ? '⭐' : '👤'}
                </div>
                <div style="font-size:10px; margin-top:2px; background:rgba(0,0,0,0.8); padding:2px 10px; border-radius:10px; backdrop-filter:blur(4px);">
                    ${username || 'مجهول'}
                </div>
            </div>
        `,
        iconSize: [50, 50],
        iconAnchor: [25, 25],
        popupAnchor: [0, -25]
    });
    
    // إنشاء الماركر
    const marker = L.marker([lat, lng], { icon: icon }).addTo(map);
    
    // نافذة منبثقة
    const popupContent = `
        <div style="text-align:right; font-family:Cairo, sans-serif; min-width:180px;">
            <div style="font-weight:bold; font-size:16px; color:white;">${username || 'مجهول'}</div>
            <div style="color:rgba(255,255,255,0.6); font-size:13px;">${role || 'مشاهد'}</div>
            <div style="margin:5px 0;">
                <span style="color:${isOnline ? '#4ade80' : '#6c757d'}; font-size:12px;">${isOnline ? '🟢 متصل' : '🔴 غير متصل'}</span>
            </div>
            <div style="color:rgba(255,255,255,0.4); font-size:11px;">
                📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}
                ${accuracy ? `<br>🎯 الدقة: ±${accuracy.toFixed(0)}م` : ''}
            </div>
            <div style="color:rgba(255,255,255,0.2); font-size:10px; margin-top:4px;">
                ${updatedAt ? '🕐 ' + new Date(updatedAt).toLocaleString('ar-TN') : ''}
            </div>
        </div>
    `;
    marker.bindPopup(popupContent);
    
    userMarkers[userId] = marker;
    markers[userId] = { ...data, marker: marker };
}

// ============================================================
// 6. قائمة المستخدمين
// ============================================================

function updateUsersList() {
    const container = document.getElementById('usersList');
    if (!container) return;
    
    const users = Object.values(markers);
    const onlineCount = users.filter(u => u.status === 'online' || u.status === 'online').length;
    
    document.getElementById('trackingOnline').textContent = onlineCount;
    
    if (users.length === 0) {
        container.innerHTML = `
            <div style="text-align:center; padding:20px; color:rgba(255,255,255,0.2); grid-column:1/-1;">
                🚫 لا يوجد مستخدمين متصلين
                <br><span style="font-size:12px;">اضغط "مشاركة موقعي" لظهورك على الخريطة</span>
            </div>
        `;
        return;
    }
    
    container.innerHTML = users.map(u => {
        const isOnline = u.status === 'online' || u.status === 'online';
        const timeAgo = u.updatedAt ? getTimeAgo(new Date(u.updatedAt)) : '--';
        const roleEmojis = { 'مسؤول': '👑', 'مشرف': '⭐', 'محرر': '✏️', 'مشاهد': '👀' };
        
        return `
            <div class="user-card">
                <span class="dot ${isOnline ? 'online' : 'offline'}"></span>
                <span class="user-name">${u.username || 'مجهول'}</span>
                <span class="user-role">${roleEmojis[u.role] || '👤'} ${u.role || 'مشاهد'}</span>
                <span class="user-time">${timeAgo}</span>
                <span class="user-status ${isOnline ? 'online' : 'offline'}">${isOnline ? '🟢' : '🔴'}</span>
            </div>
        `;
    }).join('');
}

function getTimeAgo(date) {
    const diff = Date.now() - date.getTime();
    if (diff < 60000) return 'الآن';
    if (diff < 3600000) return `${Math.floor(diff / 60000)} دقائق`;
    if (diff < 86400000) return `${Math.floor(diff / 3600000)} ساعات`;
    return `${Math.floor(diff / 86400000)} أيام`;
}

// ============================================================
// 7. مشاركة الموقع
// ============================================================

function shareMyLocation() {
    if (!navigator.geolocation) {
        showAlert('⚠️ جهازك لا يدعم تحديد الموقع', 'warning');
        return;
    }
    
    showAlert('⏳ جاري تحديد موقعك...', 'info');
    document.getElementById('gpsStatus').textContent = '⏳ جاري التحديد...';
    document.getElementById('gpsStatus').style.color = '#fbbf24';
    
    navigator.geolocation.getCurrentPosition(
        (position) => {
            const { latitude, longitude, accuracy } = position.coords;
            myLocation = { lat: latitude, lng: longitude, accuracy };
            
            document.getElementById('myLocation').textContent = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
            document.getElementById('myAccuracy').textContent = accuracy ? `±${accuracy.toFixed(0)}م` : '--';
            document.getElementById('gpsStatus').textContent = '✅ تم تحديد الموقع';
            document.getElementById('gpsStatus').style.color = '#4ade80';
            
            // تحديث الخريطة
            if (map) {
                map.setView([latitude, longitude], 15);
            }
            
            // إضافة ماركر
            const token = localStorage.getItem('token');
            const user = currentUser || JSON.parse(localStorage.getItem('user') || '{}');
            
            // عبر Socket.IO
            if (socket && socket.connected) {
                socket.emit('update-location', {
                    userId: user.id || 'unknown',
                    username: user.name || 'مجهول',
                    role: user.role || 'مشاهد',
                    lat: latitude,
                    lng: longitude,
                    accuracy: accuracy,
                    status: 'online',
                    token: token
                });
            }
            
            // عبر API
            if (token) {
                fetch('/api/location', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        lat: latitude,
                        lng: longitude,
                        accuracy: accuracy
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        showAlert('✅ تم مشاركة موقعك بنجاح', 'success');
                        // تحديث قائمة المستخدمين
                        setTimeout(refreshLocations, 500);
                    }
                })
                .catch(err => console.error('Share error:', err));
            }
        },
        (error) => {
            console.error('Geolocation error:', error);
            let msg = '❌ تعذر تحديد الموقع';
            if (error.code === 1) msg = '❌ تم رفض الوصول إلى الموقع';
            else if (error.code === 2) msg = '❌ الموقع غير متاح حالياً';
            else if (error.code === 3) msg = '❌ انتهى وقت تحديد الموقع';
            showAlert(msg, 'danger');
            document.getElementById('gpsStatus').textContent = msg;
            document.getElementById('gpsStatus').style.color = '#f87171';
        },
        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}

// ============================================================
// 8. التتبع المستمر
// ============================================================

function startContinuousTracking() {
    if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }
    
    if (!navigator.geolocation) {
        console.warn('⚠️ Geolocation not supported');
        return;
    }
    
    console.log('🔄 Starting continuous tracking...');
    
    watchId = navigator.geolocation.watchPosition(
        (position) => {
            const { latitude, longitude, accuracy } = position.coords;
            myLocation = { lat: latitude, lng: longitude, accuracy };
            
            document.getElementById('myLocation').textContent = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
            document.getElementById('myAccuracy').textContent = accuracy ? `±${accuracy.toFixed(0)}م` : '--';
            document.getElementById('gpsStatus').textContent = '🟢 تتبع مستمر';
            document.getElementById('gpsStatus').style.color = '#4ade80';
            
            // إرسال الموقع
            const token = localStorage.getItem('token');
            if (!token) return;
            
            const user = currentUser || JSON.parse(localStorage.getItem('user') || '{}');
            
            if (socket && socket.connected) {
                socket.emit('update-location', {
                    userId: user.id || 'unknown',
                    username: user.name || 'مجهول',
                    role: user.role || 'مشاهد',
                    lat: latitude,
                    lng: longitude,
                    accuracy: accuracy,
                    status: 'online',
                    token: token
                });
            }
        },
        (error) => {
            console.error('Watch error:', error);
            document.getElementById('gpsStatus').textContent = '❌ خطأ في التتبع';
            document.getElementById('gpsStatus').style.color = '#f87171';
        },
        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 5000
        }
    );
}

// ============================================================
// 9. تحديث المواقع
// ============================================================

function refreshLocations() {
    const token = localStorage.getItem('token');
    if (!token) {
        console.warn('⚠️ No token');
        return;
    }
    
    fetch('/api/locations', {
        headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(res => {
        if (!res.ok) throw new Error('Failed to fetch locations');
        return res.json();
    })
    .then(data => {
        console.log('📍 Locations loaded:', data.length);
        if (data && Array.isArray(data)) {
            data.forEach(loc => updateMarker(loc));
            updateUsersList();
        }
    })
    .catch(err => {
        console.error('Error loading locations:', err);
    });
}

// ============================================================
// 10. مركز الخريطة
// ============================================================

function centerMap() {
    if (!map) return;
    
    if (myLocation) {
        map.setView([myLocation.lat, myLocation.lng], 15);
        showAlert('🎯 تم توجيه الخريطة إلى موقعك', 'info');
    } else {
        map.setView([36.8, 10.18], 13);
        showAlert('🎯 تم توجيه الخريطة إلى تونس', 'info');
    }
}

// 11. التهيئة

if (document.getElementById('page-tracking')) {
    console.log('📍 Tracking page loaded');
    
    setTimeout(() => {
        initTrackingMap();
        initTrackingSocket();
        setTimeout(startContinuousTracking, 1000);
    }, 300);
}
