<script>
    (function() {
        'use strict';

        console.log('🔄 monitoring.html - loading with REAL MAP...');

        // ============================================================
        // ✅ FIX: Update DateTime with null check
        // ============================================================
        function updateDateTime() {
            var dateEl = document.getElementById('currentDate');
            var timeEl = document.getElementById('currentTime');
            
            if (!dateEl || !timeEl) {
                console.warn('⚠️ Date/Time elements not found');
                return;
            }
            
            var now = new Date();
            var date = now.toLocaleDateString('ar-TN', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            var time = now.toLocaleTimeString('ar-TN', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            
            dateEl.textContent = date;
            timeEl.textContent = time;
        }

        // Run once and then every second
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // ============================================================
        // ✅ FIX: Check if L (Leaflet) is defined
        // ============================================================
        function waitForLeaflet(callback, attempts) {
            attempts = attempts || 0;
            if (typeof L !== 'undefined') {
                callback();
                return;
            }
            if (attempts > 20) {
                console.error('❌ Leaflet failed to load after 20 attempts');
                showToast('❌ فشل تحميل الخريطة، يرجى تحديث الصفحة', 'error');
                return;
            }
            console.log('⏳ Waiting for Leaflet to load... attempt ' + (attempts + 1));
            setTimeout(function() {
                waitForLeaflet(callback, attempts + 1);
            }, 300);
        }

        // ============================================================

        // ============================================================
        var usersData = [
            // الحرس البحري بالشمال

        // ============================================================
        // SESSIONS DATA
        // ============================================================
        var sessionsData = [
            { id: 'S-2026-001', user: 'أحمد محمد', email: 'ahmed@example.com', region: 'الشمال',

            { id: 'S-2026-002', user: 'كريم سامي', email: 'karim@example.com', region: 'الشمال',
                duration: '2 ساعات 30 دقيقة', status: 'نشطة' },
            { id: 'S-2026-003', user: 'سامي رضا', email: 'sami@example.com', region: 'الساحل', duration: '5 ساعات',
                status: 'منتهية' },
            { id: 'S-2026-004', user: 'نورا سليم', email: 'nora@example.com', region: 'الساحل',
                duration: '1 ساعة 50 دقيقة', status: 'نشطة' },
            { id: 'S-2026-005', user: 'فاطمة نور', email: 'fatma@example.com', region: 'الساحل',
                duration: '4 ساعات 20 دقيقة', status: 'ملغاة' },
            { id: 'S-2026-006', user: 'سارة علي', email: 'sara@example.com', region: 'الوسط', duration: '2 ساعات 45 دقيقة',
                status: 'منتهية' },
            { id: 'S-2026-007', user: 'منى طارق', email: 'mona@example.com', region: 'الوسط', duration: '3 ساعات 10 دقيقة',
                status: 'ملغاة' },
            { id: 'S-2026-008', user: 'علي حسن', email: 'ali@example.com', region: 'الجنوب', duration: '6 ساعات 30 دقيقة',
                status: 'نشطة' },
            { id: 'S-2026-009', user: 'هالة نادر', email: 'hala@example.com', region: 'الجنوب', duration: '2 ساعات 15 دقيقة',
                status: 'نشطة' },
            { id: 'S-2026-010', user: 'ليلى منير', email: 'layla@example.com', region: 'وحدة الصيانة تونس',
                duration: '3 ساعات 50 دقيقة', status: 'نشطة' },
            { id: 'S-2026-011', user: 'ياسين عمر', email: 'yassin@example.com', region: 'وحدة الصيانة جرجيس',
                duration: '4 ساعات', status: 'منتهية' },
            { id: 'S-2026-012', user: 'محمد خالد', email: 'mohamed@example.com', region: 'وحدة الصيانة تونس',
                duration: '2 ساعات 20 دقيقة', status: 'نشطة' }
        ];

        // ============================================================
        // STATE
        // ============================================================
        var map = null;
        var markers = [];
        var currentMapType = 'satellite';
        var mapInitialized = false;

        // ============================================================
        // HELPERS
        // ============================================================
        function getInitials(name) {
            if (!name) return '👤';
            var parts = name.split(' ');
            if (parts.length >= 2) return parts[0][0] + parts[1][0];
            return name.slice(0, 2);
        }

        function getColor(user) {
            if (user.status === 'غير متصل') return '#6b7280';
            if (user.readiness === 'جاهز') return '#22c55e';
            if (user.readiness === 'مشغول') return '#ef4444';
            return '#fbbf24';
        }

        function getStatusBadge(s) { return s === 'نشط' ? '🟢 نشط' : '⚫ غير متصل'; }
        function getStatusClass(s) { return s === 'نشط' ? 'green' : 'red'; }

        function getReadinessBadge(r) {
            var map = { 'جاهز': '✅ جاهز', 'مشغول': '🔴 مشغول', 'غير جاهز': '⚫ غير جاهز' };
            return map[r] || r;
        }
        function getReadinessClass(r) {
            var map = { 'جاهز': 'green', 'مشغول': 'red', 'غير جاهز': 'pink' };
            return map[r] || '';
        }

        function getSessionClass(s) {
            var map = { 'نشطة': 'active', 'منتهية': 'expired', 'ملغاة': 'terminated' };
            return map[s] || '';
        }
        function getSessionLabel(s) {
            var map = { 'نشطة': '🟢 نشطة', 'منتهية': '🟡 منتهية', 'ملغاة': '🔴 ملغاة' };
            return map[s] || s;
        }

        function getRegionColor(region) {
            var colors = {
                'الشمال': '#60a5fa',
                'الساحل': '#34d399',
                'الوسط': '#fbbf24',
                'الجنوب': '#f87171',
                'وحدة الصيانة تونس': '#a78bfa',
                'وحدة الصيانة جرجيس': '#f472b6'
            };
            return colors[region] || '#6b7280';
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, type) {
            var old = document.querySelector('.toast');
            if (old) old.remove();
            var n = document.createElement('div');
            n.className = 'toast toast-' + (type || 'info');
            n.textContent = msg;
            document.body.appendChild(n);
            setTimeout(function() {
                n.style.opacity = '0';
                n.style.transform = 'translateY(20px)';
                n.style.transition = 'all 0.4s';
                setTimeout(function() { n.remove(); }, 400);
            }, 2500);
        }

        // ============================================================
        // STATS
        // ============================================================
        function updateStats() {
            var total = usersData.length;
            var active = usersData.filter(function(u) { return u.status === 'نشط'; }).length;
            var ready = usersData.filter(function(u) { return u.readiness === 'جاهز'; }).length;
            var busy = usersData.filter(function(u) { return u.readiness === 'مشغول'; }).length;
            var offline = usersData.filter(function(u) { return u.status === 'غير متصل'; }).length;
            var activeSessions = sessionsData.filter(function(s) { return s.status === 'نشطة'; }).length;

            var el = function(id) { return document.getElementById(id); };
            
            if (el('totalUsers')) el('totalUsers').textContent = total;
            if (el('activeNow')) el('activeNow').textContent = active;
            if (el('readyUsers')) el('readyUsers').textContent = ready;
            if (el('busyUsers')) el('busyUsers').textContent = busy;
            if (el('offlineUsers')) el('offlineUsers').textContent = offline;
            if (el('totalSessions')) el('totalSessions').textContent = activeSessions;

            var badge = document.getElementById('sessionBadge');
            if (badge) {
                if (activeSessions > 0) {
                    badge.textContent = '🟢 ' + activeSessions + ' جلسات نشطة';
                    badge.className = 'badge success';
                } else {
                    badge.textContent = '📊 لا توجد جلسات نشطة';
                    badge.className = 'badge purple';
                }
            }
        }

        // ============================================================
        // INIT MAP - REAL MAP WITH LEAFLET
        // ============================================================
        function initMap() {
            console.log('🗺️ Initializing map...');

            var container = document.getElementById('realMap');
            if (!container) {
                console.warn('⚠️ Map container not found, retrying...');
                setTimeout(initMap, 500);
                return;
            }

            // ✅ Check if L is defined
            if (typeof L === 'undefined') {
                console.warn('⚠️ Leaflet not loaded, waiting...');
                setTimeout(initMap, 500);
                return;
            }

            // Create map centered on Tunisia
            map = L.map('realMap').setView([34.5, 9.5], 7);

            // ===== TILE LAYERS =====
            var tileLayers = {
                satellite: L.tileLayer(
                    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                        attribution: '&copy; Esri',
                        maxZoom: 19
                    }),
                standard: L.tileLayer(
                    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap',
                        maxZoom: 19
                    }),
                terrain: L.tileLayer(
                    'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenTopoMap',
                        maxZoom: 17
                    })
            };

            // Add default layer
            tileLayers.satellite.addTo(map);

            // Store layers for switching
            map._tileLayers = tileLayers;
            map._currentLayer = 'satellite';

            // ===== FIT BOUNDS =====
            var bounds = L.latLngBounds(
                L.latLng(32.5, 8.0),
                L.latLng(37.5, 12.0)
            );
            map.fitBounds(bounds, { padding: [20, 20] });

            mapInitialized = true;

            // Add markers
            addMarkers();

            console.log('✅ Real Map initialized with Satellite imagery');
            console.log('📍 ' + usersData.length + ' users on map');
        }

        // ============================================================
        // ADD MARKERS
        // ============================================================
        function addMarkers() {
            if (!map) return;

            // Clear existing markers
            markers.forEach(function(m) { map.removeLayer(m); });
            markers = [];

            usersData.forEach(function(user) {
                var color = getColor(user);
                var iconHtml = getInitials(user.name);

                // Custom icon with initials
                var icon = L.divIcon({
                    className: 'custom-marker',
                    html: '<div style="background:' + color +
                        ';width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#0a1628;border:3px solid rgba(255,255,255,0.3);box-shadow:0 0 20px ' +
                        color + '44;">' + iconHtml + '</div>',
                    iconSize: [38, 38],
                    iconAnchor: [19, 19],
                    popupAnchor: [0, -25]
                });

                // Status dot
                var statusDot = user.status === 'نشط' ?
                    '<span class="popup-status online">🟢 نشط</span>' :
                    '<span class="popup-status offline">⚫ غير متصل</span>';

                var readinessDot = user.readiness === 'جاهز' ?
                    '<span class="popup-readiness ready">✅ جاهز</span>' :
                    (user.readiness === 'مشغول' ?
                        '<span class="popup-readiness busy">🔴 مشغول</span>' :
                        '<span class="popup-readiness offline">⚫ غير جاهز</span>');

                // Popup content
                var popupContent =
                    '<div style="text-align:right;font-family:Cairo,sans-serif;">' +
                    '<div class="popup-user-name">' + user.name + '</div>' +
                    '<div class="popup-user-detail"><i class="fas fa-user-tag"></i> ' + user.role + ' | ' + user
                    .region + '</div>' +
                    '<div class="popup-user-detail"><i class="fas fa-map-pin"></i> ' + user.location + '</div>' +
                    '<div class="popup-user-detail"><i class="fas fa-id-card"></i> #' + user.id + '</div>' +
                    '<div style="margin-top:6px;">' + statusDot + ' ' + readinessDot + '</div>' +
                    '<div class="popup-user-detail" style="margin-top:4px;font-size:10px;color:rgba(255,255,255,0.2);">🕐 ' +
                    user.lastActive + '</div>' +
                    '<div class="popup-user-detail" style="font-size:10px;color:rgba(255,255,255,0.15);">📧 ' + user
                    .email + '</div>' +
                    '</div>';

                var marker = L.marker([user.lat, user.lng], { icon: icon })
                    .bindPopup(popupContent, { maxWidth: 280, className: 'custom-popup' });

                // Click on marker shows panel
                marker.on('click', function() {
                    showPanel(user);
                });

                marker.addTo(map);
                markers.push(marker);
            });
        }

        // ============================================================
        // UPDATE MARKERS
        // ============================================================
        function updateMarkers() {
            addMarkers();
        }

        // ============================================================
        // SWITCH MAP TYPE
        // ============================================================
        function switchMapType(type) {
            if (!map || !map._tileLayers) return;

            currentMapType = type;

            // Remove current layer
            if (map._currentLayer) {
                map.removeLayer(map._tileLayers[map._currentLayer]);
            }

            // Add new layer
            map._tileLayers[type].addTo(map);
            map._currentLayer = type;

            // Update button states
            document.querySelectorAll('.map-type-btn').forEach(function(b) {
                b.classList.toggle('active', b.dataset.type === type);
            });

            var labels = { 'satellite': '🛰️ قمر صناعي', 'standard': '🗺️ عادية', 'terrain': '⛰️ تضاريس' };
            showToast('🗺️ تم التبديل إلى ' + labels[type], 'info');
        }

        // ============================================================
        // SESSIONS TABLE
        // ============================================================
        function renderSessions() {
            var tbody = document.getElementById('sessionsBody');
            if (!tbody) return;
            
            var active = sessionsData.filter(function(s) { return s.status === 'نشطة'; });

            if (active.length === 0) {
                tbody.innerHTML =
                    '<tr><td colspan="5" style="text-align:center;padding:30px;color:rgba(255,255,255,0.1);">🟢 لا توجد جلسات نشطة</td></tr>';
                return;
            }

            var html = '';
            active.forEach(function(s) {
                var regionColor = getRegionColor(s.region);
                html += `
                    <tr>
                        <td class="user-name">${s.user}</td>
                        <td><span class="region-tag" style="color:${regionColor};border:1px solid ${regionColor}44;">${s.region}</span></td>
                        <td style="color:rgba(255,255,255,0.4);font-size:0.65rem;">${s.email}</td>
                        <td style="color:rgba(255,255,255,0.4);font-size:0.65rem;">${s.duration}</td>
                        <td><span class="status-badge ${getSessionClass(s.status)}">${getSessionLabel(s.status)}</span></td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // ============================================================
        // USER PANEL
        // ============================================================
        function showPanel(user) {
            var overlay = document.getElementById('panelOverlay');
            var panel = document.getElementById('userPanel');
            
            if (!overlay || !panel) return;
            
            overlay.classList.add('visible');
            panel.classList.add('visible');

            var el = function(id) { return document.getElementById(id); };
            
            if (el('panelAvatar')) el('panelAvatar').textContent = getInitials(user.name);
            if (el('panelName')) el('panelName').textContent = user.name;
            if (el('panelRole')) el('panelRole').textContent = '🔹 ' + user.role + ' | ' + user.region;
            if (el('panelId')) el('panelId').textContent = '#' + user.id;
            if (el('panelLocation')) el('panelLocation').textContent = user.location;
            if (el('panelCoords')) el('panelCoords').textContent = user.lat + '°, ' + user.lng + '°';

            var se = document.getElementById('panelStatus');
            if (se) {
                se.textContent = getStatusBadge(user.status);
                se.className = 'value ' + getStatusClass(user.status);
            }

            var re = document.getElementById('panelReadiness');
            if (re) {
                re.textContent = getReadinessBadge(user.readiness);
                re.className = 'value ' + getReadinessClass(user.readiness);
            }

            if (el('panelLastActive')) el('panelLastActive').textContent = user.lastActive || '-';
            if (el('panelEmail')) el('panelEmail').textContent = user.email;
        }

        function closePanel() {
            var overlay = document.getElementById('panelOverlay');
            var panel = document.getElementById('userPanel');
            if (overlay) overlay.classList.remove('visible');
            if (panel) panel.classList.remove('visible');
        }

        // ============================================================
        // REFRESH
        // ============================================================
        function refreshAll() {
            var btn = document.getElementById('refreshBtn');
            if (!btn) return;
            
            var orig = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';
            btn.disabled = true;

            setTimeout(function() {
                updateStats();
                renderSessions();
                updateMarkers();
                btn.innerHTML = orig;
                btn.disabled = false;
                showToast('✅ تم تحديث البيانات', 'success');
            }, 500);
        }

        // ============================================================
        // TERMINATE ALL
        // ============================================================
        function terminateAll() {
            if (!confirm('⚠️ إنهاء جميع الجلسات النشطة؟')) return;
            var active = sessionsData.filter(function(s) { return s.status === 'نشطة'; });
            if (active.length === 0) { showToast('ℹ️ لا توجد جلسات', 'info'); return; }
            active.forEach(function(s) { s.status = 'ملغاة'; });
            updateStats();
            renderSessions();
            showToast('✅ تم إنهاء ' + active.length + ' جلسات', 'success');
        }

        // ============================================================
        // RESIZE
        // ============================================================
        var resizeTimer;

        function handleResize() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                if (map) {
                    map.invalidateSize();
                }
            }, 300);
        }

        // ============================================================
        // ✅ FIX: INIT - Check elements exist
        // ============================================================
        function init() {
            console.log('🚀 Initializing monitoring page...');
            
            // ✅ Only update stats if elements exist
            updateStats();
            renderSessions();

            // ✅ Wait for Leaflet to load
            waitForLeaflet(function() {
                initMap();
            });

            // ✅ Event listeners with null checks
            var refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', refreshAll);
            }
            
            var terminateBtn = document.getElementById('terminateAllBtn');
            if (terminateBtn) {
                terminateBtn.addEventListener('click', terminateAll);
            }
            
            var closeBtn = document.getElementById('closePanelBtn');
            if (closeBtn) {
                closeBtn.addEventListener('click', closePanel);
            }
            
            var overlay = document.getElementById('panelOverlay');
            if (overlay) {
                overlay.addEventListener('click', closePanel);
            }

            document.querySelectorAll('.map-type-btn').forEach(function(b) {
                b.addEventListener('click', function() {
                    switchMapType(this.dataset.type);
                });
            });

            window.addEventListener('resize', handleResize);

            console.log('✅ Monitoring Page with REAL MAP loaded');
            console.log('📍 ' + usersData.length + ' users');
            console.log('🟣 ' + sessionsData.filter(function(s) { return s.status === 'نشطة'; }).length +
                ' active sessions');
            console.log('🗺️ Map types: Satellite (real), Standard, Terrain');
        }

        // ============================================================
        // START
        // ============================================================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // ============================================================
        // EXPOSE GLOBALS
        // ============================================================
        window.refreshAll = refreshAll;
        window.terminateAll = terminateAll;
        window.switchMapType = switchMapType;
        window.showToast = showToast;
        window.initMap = initMap;

    })();
