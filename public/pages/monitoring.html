<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛰️ المراقبة الحية — منظومة الوسائل البحرية</title>

<link rel="stylesheet" href="/public/vendor/leaflet/leaflet.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';" />
<script src="/public/vendor/leaflet/leaflet.js"></script>
<script>
(function() {
    window._geoWatchId = null;
    window._leafletSource = null;
    window._leafletFailed = false;

    if (typeof L !== 'undefined') {
        window._leafletSource = 'local';
        console.log('✅ Leaflet from LOCAL');
        return;
    }
    var cdns = [
        'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
        'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
        'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'
    ];
    var i = 0;
    function tryNext() {
        if (i >= cdns.length) { window._leafletFailed = true; return; }
        var s = document.createElement('script');
        s.src = cdns[i++];
        s.onload = function() { window._leafletSource = s.src; };
        s.onerror = tryNext;
        document.head.appendChild(s);
    }
    tryNext();
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ✅ مهم جداً: هذا الملف يُحمّل كصفحة فرعية داخل النظام الرئيسي */
    /* لذلك يجب ألا يأخذ 100vh من الشاشة كاملة */
    html, body {
        font-family: 'Cairo', 'Segoe UI', sans-serif;
        background: #050811;
        color: #e8edf5;
        height: 100%;
        width: 100%;
        overflow: hidden;
    }

    /* ✅ حاوية نسبية لاحتواء الخريطة */
    .monitoring-wrapper {
        position: relative;
        width: 100%;
        height: calc(100vh - 64px); /* اطرح ارتفاع الهيدر */
        overflow: hidden;
    }

    #map {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        background: #050811;
    }

    .leaflet-container { background: #050811 !important; font-family: 'Cairo', sans-serif !important; }

    .leaflet-control-zoom a {
        background: rgba(15, 20, 32, 0.95) !important;
        color: #f7d774 !important;
        border: 1px solid rgba(247, 215, 116, 0.3) !important;
        width: 36px !important; height: 36px !important;
        line-height: 36px !important; font-size: 18px !important;
    }
    .leaflet-control-attribution {
        background: rgba(5, 8, 17, 0.85) !important;
        color: rgba(255, 255, 255, 0.4) !important;
        font-size: 10px !important;
    }
    .leaflet-popup-content-wrapper {
        background: linear-gradient(135deg, rgba(15, 20, 32, 0.98), rgba(10, 14, 26, 0.98)) !important;
        color: #e8edf5 !important;
        border: 1px solid rgba(247, 215, 116, 0.3) !important;
        border-radius: 14px !important;
    }
    .leaflet-popup-content {
        margin: 0 !important; padding: 14px 16px !important;
        font-family: 'Cairo', sans-serif !important;
        direction: rtl !important; min-width: 200px;
    }
    .leaflet-popup-tip { background: rgba(15, 20, 32, 0.98) !important; }
    .leaflet-popup-close-button { color: #f7d774 !important; }

    /* ===== TOP BAR ===== */
    .top-bar {
        position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
        z-index: 1000; display: flex; align-items: center; gap: 16px;
        padding: 12px 24px;
        background: linear-gradient(135deg, rgba(15, 20, 32, 0.85), rgba(10, 14, 26, 0.85));
        backdrop-filter: blur(20px);
        border: 1px solid rgba(247, 215, 116, 0.2);
        border-radius: 100px;
        max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center;
    }
    .top-bar .brand {
        display: flex; align-items: center; gap: 10px;
        padding-left: 16px; border-left: 1px solid rgba(255,255,255,0.1);
    }
    .top-bar .brand i {
        font-size: 22px; color: #f7d774;
        filter: drop-shadow(0 0 8px rgba(247,215,116,0.6));
    }
    .top-bar .brand .text { display: flex; flex-direction: column; line-height: 1.1; }
    .top-bar .brand .text .title { font-size: 14px; font-weight: 900; color: #f7d774; }
    .top-bar .brand .text .subtitle { font-size: 9.5px; color: rgba(255,255,255,0.4); }
    .top-bar .stats { display: flex; gap: 14px; }
    .top-bar .stat { display: flex; flex-direction: column; align-items: center; min-width: 50px; }
    .top-bar .stat .value { font-size: 18px; font-weight: 900; color: #f7d774; line-height: 1; }
    .top-bar .stat .label { font-size: 9px; color: rgba(255,255,255,0.4); margin-top: 2px; font-weight: 600; }
    .top-bar .live-badge {
        display: flex; align-items: center; gap: 6px;
        padding: 4px 12px;
        background: rgba(74, 222, 128, 0.12);
        border: 1px solid rgba(74, 222, 128, 0.3);
        border-radius: 20px; font-size: 10px; font-weight: 700; color: #4ade80;
    }
    .top-bar .live-badge .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #4ade80; box-shadow: 0 0 10px #4ade80;
        animation: pulse 1.5s infinite;
    }
    .top-bar .live-badge.offline {
        background: rgba(239, 68, 68, 0.12);
        border-color: rgba(239, 68, 68, 0.3); color: #fca5a5;
    }
    .top-bar .live-badge.offline .dot { background: #fca5a5; animation: none; }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* ===== SIDE PANEL ===== */
    .side-panel {
        position: absolute; top: 0; right: 0; bottom: 0;
        width: 360px; max-width: 92vw; z-index: 1100;
        background: linear-gradient(180deg, rgba(10,14,26,0.96), rgba(5,8,17,0.98));
        backdrop-filter: blur(24px);
        border-left: 1px solid rgba(247,215,116,0.15);
        box-shadow: -10px 0 60px rgba(0,0,0,0.7);
        transform: translateX(100%);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex; flex-direction: column;
    }
    .side-panel.open { transform: translateX(0); }
    .side-panel .panel-header {
        padding: 20px 22px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .side-panel .panel-header h2 {
        font-size: 16px; font-weight: 900; color: #f7d774;
        display: flex; align-items: center; gap: 10px;
    }
    .side-panel .panel-header h2 i { font-size: 18px; color: #60a5fa; }
    .side-panel .close-btn {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        color: rgba(255,255,255,0.6);
        width: 34px; height: 34px; border-radius: 10px;
        cursor: pointer; font-size: 16px;
        display: flex; align-items: center; justify-content: center;
    }
    .side-panel .close-btn:hover {
        background: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
        border-color: rgba(239, 68, 68, 0.3);
    }
    .side-panel .panel-body { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }
    .side-panel .panel-body::-webkit-scrollbar { width: 6px; }
    .side-panel .panel-body::-webkit-scrollbar-thumb {
        background: rgba(247,215,116,0.3); border-radius: 10px;
    }
    .panel-section { margin-bottom: 24px; }
    .panel-section .section-title {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 12px; padding-bottom: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .panel-section .section-title h3 {
        font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.65);
        display: flex; align-items: center; gap: 8px;
    }
    .panel-section .section-title h3 i { color: #60a5fa; font-size: 13px; }
    .panel-section .section-title .count {
        background: rgba(96, 165, 250, 0.15); color: #60a5fa;
        padding: 2px 10px; border-radius: 12px; font-size: 10px; font-weight: 800;
    }

    .user-card {
        background: rgba(255,255,255,0.025);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
        cursor: pointer; transition: all 0.25s;
        position: relative; overflow: hidden;
    }
    .user-card::before {
        content: ''; position: absolute; top: 0; right: 0; bottom: 0;
        width: 3px; background: #60a5fa; opacity: 0.5;
    }
    .user-card:hover {
        background: rgba(255,255,255,0.05);
        border-color: rgba(96,165,250,0.3);
        transform: translateX(-4px);
    }
    .user-card.me {
        background: rgba(247,215,116,0.05);
        border-color: rgba(247,215,116,0.25);
    }
    .user-card.me::before { background: #f7d774; opacity: 1; }
    .user-card.offline { opacity: 0.55; }
    .user-card .card-top {
        display: flex; justify-content: space-between; align-items: flex-start;
        gap: 8px; margin-bottom: 6px;
    }
    .user-card .user-name {
        font-size: 13.5px; font-weight: 800; color: rgba(255,255,255,0.95);
        display: flex; align-items: center; gap: 6px; flex: 1; line-height: 1.3;
    }
    .user-card.me .user-name { color: #f7d774; }
    .user-card .status-dot {
        width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px;
    }
    .user-card .status-dot.online {
        background: #4ade80; box-shadow: 0 0 10px #4ade80;
        animation: pulse 2s infinite;
    }
    .user-card .status-dot.offline { background: #64748b; }
    .user-card .user-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .user-card .tag {
        font-size: 9.5px; padding: 2px 8px; border-radius: 8px;
        font-weight: 700; white-space: nowrap;
    }
    .user-card .tag.role { background: rgba(96,165,250,0.12); color: #60a5fa; }
    .user-card .tag.region { background: rgba(247,215,116,0.12); color: #f7d774; }
    .user-card .tag.time { background: rgba(148,163,184,0.12); color: #94a3b8; }
    .user-card .coords {
        font-family: 'Courier New', monospace; font-size: 10px;
        color: rgba(255,255,255,0.35); margin-top: 8px;
        display: flex; align-items: center; gap: 6px;
    }
    .user-card .coords i { color: #60a5fa; font-size: 9px; }

    .empty-state {
        text-align: center; padding: 30px 16px;
        color: rgba(255,255,255,0.25);
    }
    .empty-state i {
        font-size: 32px; margin-bottom: 10px; opacity: 0.4; color: #60a5fa;
    }
    .empty-state p { font-size: 12px; font-weight: 600; }

    /* ===== DEVICE CARD (NEW) ===== */
    .device-card {
        background: rgba(96, 165, 250, 0.04);
        border: 1px solid rgba(96, 165, 250, 0.15);
        border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
        font-size: 11px; transition: all 0.2s;
    }
    .device-card:hover {
        background: rgba(96, 165, 250, 0.08);
        border-color: rgba(96, 165, 250, 0.35);
    }
    .device-card .device-header {
        display: flex; justify-content: space-between; align-items: center;
        gap: 8px; margin-bottom: 8px; padding-bottom: 6px;
        border-bottom: 1px dashed rgba(255,255,255,0.06);
    }
    .device-card .device-name {
        font-weight: 800; font-size: 12px; color: #e8edf5;
        display: flex; align-items: center; gap: 6px;
    }
    .device-card .device-name i { color: #60a5fa; font-size: 13px; }
    .device-card .device-name i.mobile { color: #4ade80; }
    .device-card .device-name i.desktop { color: #f7d774; }
    .device-card .device-name i.tablet { color: #a78bfa; }
    .device-card .device-badge {
        font-size: 9px; padding: 2px 8px; border-radius: 8px;
        font-weight: 800;
        background: rgba(74, 222, 128, 0.12);
        color: #4ade80;
        border: 1px solid rgba(74, 222, 128, 0.25);
    }
    .device-card .device-badge.offline {
        background: rgba(148, 163, 184, 0.12);
        color: #94a3b8;
        border-color: rgba(148, 163, 184, 0.25);
    }
    .device-card .device-row {
        display: flex; justify-content: space-between; gap: 8px;
        padding: 3px 0; color: rgba(255,255,255,0.55);
    }
    .device-card .device-row .label {
        color: rgba(255,255,255,0.35); font-weight: 600; flex-shrink: 0;
    }
    .device-card .device-row .value {
        font-family: 'Courier New', monospace; font-size: 10px;
        color: #60a5fa; text-align: left; direction: ltr;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        max-width: 180px;
    }
    .device-card .device-ip {
        color: #f7d774 !important; font-weight: 700;
    }

    /* ===== FLOAT BUTTONS ===== */
    .float-btn {
        position: absolute; z-index: 1050;
        width: 52px; height: 52px; border-radius: 16px;
        background: linear-gradient(135deg, rgba(15,20,32,0.95), rgba(10,14,26,0.95));
        backdrop-filter: blur(20px);
        border: 1px solid rgba(247,215,116,0.25);
        color: #f7d774; font-size: 20px;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        transition: all 0.3s;
    }
    .float-btn:hover {
        transform: translateY(-3px) scale(1.05);
        border-color: rgba(247,215,116,0.5);
    }
    .float-btn.toggle-panel { top: 90px; right: 20px; }
    .float-btn.locate-me { bottom: 100px; right: 20px; }
    .float-btn.refresh { bottom: 20px; right: 20px; }
    .float-btn.refresh.spinning i { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== LEGEND ===== */
    .legend {
        position: absolute; bottom: 20px; left: 20px; z-index: 1050;
        padding: 12px 16px;
        background: linear-gradient(135deg, rgba(15,20,32,0.9), rgba(10,14,26,0.9));
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        font-size: 11px; display: flex; flex-direction: column; gap: 6px;
    }
    .legend .item {
        display: flex; align-items: center; gap: 8px;
        color: rgba(255,255,255,0.7);
    }
    .legend .dot {
        width: 12px; height: 12px; border-radius: 50%;
        border: 2px solid #fff; flex-shrink: 0;
    }
    .legend .dot.gold { background: #f7d774; box-shadow: 0 0 10px rgba(247,215,116,0.6); }
    .legend .dot.blue { background: #60a5fa; box-shadow: 0 0 10px rgba(96,165,250,0.6); }

    /* ===== LOADING ===== */
    .loading {
        position: absolute; inset: 0; z-index: 9999;
        background: linear-gradient(135deg, #050811, #0a0e1a);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px;
        transition: opacity 0.5s;
    }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .loading .satellite i {
        font-size: 56px; color: #f7d774;
        filter: drop-shadow(0 0 20px rgba(247,215,116,0.6));
        animation: satellite-orbit 3s ease-in-out infinite;
    }
    @keyframes satellite-orbit {
        0%, 100% { transform: translateX(-10px) rotate(-5deg); }
        50% { transform: translateX(10px) rotate(5deg); }
    }
    .loading .text { color: #f7d774; font-size: 14px; font-weight: 800; }
    .loading .subtext { color: rgba(255,255,255,0.3); font-size: 11px; }

    /* ===== ERROR ===== */
    .error-screen {
        text-align: center; padding: 40px 20px; color: #f87171;
    }
    .error-screen h2 { font-size: 20px; margin-bottom: 10px; }
    .error-screen p { font-size: 13px; color: #cbd5e1; margin: 6px 0; }
    .error-screen button {
        margin-top: 20px; padding: 10px 24px; border: none;
        border-radius: 8px; background: #f7d774; color: #000;
        font-weight: bold; cursor: pointer; font-family: inherit;
    }

    /* ===== IDLE ===== */
    .idle-indicator {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1200; padding: 12px 20px;
        background: rgba(15,20,32,0.95);
        border: 1px solid rgba(247,215,116,0.3);
        border-radius: 12px; color: #f7d774;
        font-size: 12px; font-weight: 700; display: none;
    }
    .idle-indicator.show { display: block; }

    @media (max-width: 768px) {
        .monitoring-wrapper { height: calc(100vh - 56px); }
        .top-bar { top: 12px; padding: 10px 16px; gap: 10px; }
        .side-panel { width: 100%; }
        .float-btn { width: 46px; height: 46px; font-size: 17px; }
    }
</style>
</head>
<body>

<!-- ✅ الحاوية الرئيسية للمراقبة -->
<div class="monitoring-wrapper" id="monitoringWrapper">
    <div id="map"></div>

    <div class="top-bar">
        <div class="brand">
            <i class="fas fa-satellite-dish"></i>
            <div class="text">
                <span class="title">المراقبة الحية</span>
                <span class="subtitle">Live Tracking v13.5</span>
            </div>
        </div>
        <div class="stats">
            <div class="stat"><span class="value" id="statUsers">0</span><span class="label">مستخدمون</span></div>
            <div class="stat"><span class="value" id="statLocations">0</span><span class="label">مواقع</span></div>
            <div class="stat"><span class="value" id="statSessions">0</span><span class="label">أجهزة</span></div>
        </div>
        <div class="live-badge" id="liveBadge">
            <span class="dot"></span>
            <span id="lastUpdate">مباشر</span>
        </div>
    </div>

    <button class="float-btn toggle-panel" id="togglePanelBtn" title="عرض القائمة">
        <i class="fas fa-users"></i>
    </button>
    <button class="float-btn locate-me" id="locateMeBtn" title="موقعي">
        <i class="fas fa-location-crosshairs"></i>
    </button>
    <button class="float-btn refresh" id="refreshBtn" title="تحديث">
        <i class="fas fa-rotate"></i>
    </button>

    <aside class="side-panel" id="sidePanel">
        <div class="panel-header">
            <h2><i class="fas fa-users-line"></i> المستخدمون النشطون</h2>
            <button class="close-btn" id="closePanelBtn"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="panel-body">

            <!-- ===== سجل الأجهزة (NEW) ===== -->
            <div class="panel-section">
                <div class="section-title">
                    <h3><i class="fas fa-microchip"></i> سجل الأجهزة</h3>
                    <span class="count" id="devicesCount">0</span>
                </div>
                <div id="devicesList">
                    <div class="empty-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>جاري التحميل...</p>
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <div class="section-title">
                    <h3><i class="fas fa-users"></i> المستخدمون</h3>
                    <span class="count" id="usersCount">0</span>
                </div>
                <div id="usersList">
                    <div class="empty-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>جاري التحميل...</p>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <div class="legend">
        <div class="item"><span class="dot gold"></span><span>موقعك</span></div>
        <div class="item"><span class="dot blue"></span><span>المستخدمون الآخرون</span></div>
    </div>

    <div class="idle-indicator" id="idleIndicator">
        <i class="fas fa-pause-circle"></i> التحديث متوقف (التبويب غير نشط)
    </div>

    <div class="loading" id="loadingScreen">
        <div class="satellite"><i class="fas fa-satellite"></i></div>
        <div class="text">جاري تهيئة الأقمار الصناعية...</div>
        <div class="subtext">Initializing Satellite View</div>
    </div>
</div>

<script>
(function() {
    'use strict';

    var DEBUG = /[?&]debug=1/.test(location.search) ||
                location.hostname === 'localhost' ||
                location.hostname === '127.0.0.1';
    function log() { if (DEBUG) try { console.log.apply(console, arguments); } catch(e){} }
    function warn() { try { console.warn.apply(console, arguments); } catch(e){} }

    console.log('🛰️ monitoring.html v13.5 - Loading...');

    // ============================================================
    // CONSTANTS
    // ============================================================
    var REFRESH_INTERVAL_MS = 15000;
    var IDLE_REFRESH_PAUSE = true;
    var FETCH_TIMEOUT_MS = 20000;
    var MAX_FETCH_TIMEOUT_MS = 30000;

    // ============================================================
    // STATE
    // ============================================================
    var map = null;
    var myMarker = null;
    var myAccuracyCircle = null;
    var userMarkers = new Map();
    var myLocation = null;
    var myId = null;
    var users = [];
    var locations = [];
    var devices = [];
    var mapInitialized = false;
    var firstFitDone = false;
    var initDone = false;
    var _isIdle = false;
    var _refreshIntervalId = null;
    var _isDestroyed = false;

    var _intervals = [];
    var _timeouts = [];
    var _listeners = [];
    var _abortControllers = [];
    var _resizeObserver = null;

    // ============================================================
    // ✅ BRIDGE: قراءة البيانات من النظام الرئيسي
    // ============================================================
    function getToken() {
        try {
            // جرّب كل المصادر الممكنة
            return localStorage.getItem('marine_auth_token')
                || localStorage.getItem('marine_token')
                || localStorage.getItem('token')
                || sessionStorage.getItem('token')
                || '';
        } catch(e) { return ''; }
    }

    function getCsrf() {
        try {
            var m = document.cookie.match(/marine_csrf=([^;]+)/);
            return m ? decodeURIComponent(m[1]) : '';
        } catch(e) { return ''; }
    }

    function authHeaders() {
        var h = { 'Accept': 'application/json', 'Content-Type': 'application/json' };
        var t = getToken();
        if (t) h['Authorization'] = 'Bearer ' + t;
        var c = getCsrf();
        if (c) h['X-CSRF-Token'] = c;
        return h;
    }

    // ✅ يقرأ المستخدم من كل المصادر الممكنة
    function readMyUser() {
        // 1) من window.parent (النظام الرئيسي)
        try {
            if (window.parent && window.parent !== window) {
                var parentUser = window.parent.currentUser;
                if (parentUser && (parentUser.id || parentUser._id)) {
                    log('👤 Got user from parent window');
                    return parentUser;
                }
            }
        } catch(e) {
            // Cross-origin — تجاهل
        }

        // 2) من JWT (sub = المعرّف الحقيقي)
        try {
            var token = getToken();
            if (token) {
                var parts = token.split('.');
                if (parts.length === 3) {
                    var payload = JSON.parse(atob(parts[1]));
                    if (payload && (payload.sub || payload.id)) {
                        var realId = payload.sub || payload.id;
                        log('👤 Got user from JWT payload');
                        return {
                            id: realId,
                            _id: realId,
                            username: payload.username || '',
                            name: payload.name || payload.username || '',
                            role: payload.role || 'viewer',
                            _source: 'jwt'
                        };
                    }
                }
            }
        } catch(e) {
            warn('⚠️ JWT parse error:', e.message);
        }

        // 3) من localStorage
        try {
            var keys = ['marine_user', 'currentUser', 'user', 'marine_current_user'];
            var stores = [localStorage, sessionStorage];
            for (var s = 0; s < stores.length; s++) {
                for (var i = 0; i < keys.length; i++) {
                    var raw = stores[s].getItem(keys[i]);
                    if (raw) {
                        var p = JSON.parse(raw);
                        if (p && (p.id || p._id || p.username)) {
                            p._source = 'storage';
                            log('👤 Got user from storage');
                            return p;
                        }
                    }
                }
            }
        } catch(e) {}

        warn('⚠️ Could not read user info from any source');
        return null;
    }

    function sanitizeId(id) {
        if (id == null) return null;
        var s = String(id).trim();
        if (!s || s === 'null' || s === 'undefined' || s === 'NaN') return null;
        return s;
    }

    // ============================================================
    // CLEANUP
    // ============================================================
    function _cleanup() {
        if (_isDestroyed) return;
        _isDestroyed = true;

        try {
            _abortControllers.forEach(function(c) {
                try { c.abort(); } catch(e){}
            });
        } catch(e) {}
        _abortControllers = [];

        _intervals.forEach(function(id) { try { clearInterval(id); } catch(e){} });
        _timeouts.forEach(function(id) { try { clearTimeout(id); } catch(e){} });
        _intervals = []; _timeouts = [];
        _refreshIntervalId = null;

        _listeners.forEach(function(l) {
            try { if (l.el && l.fn) l.el.removeEventListener(l.type, l.fn); } catch(e){}
        });
        _listeners = [];

        try {
            if (window._geoWatchId != null && navigator.geolocation) {
                navigator.geolocation.clearWatch(window._geoWatchId);
                window._geoWatchId = null;
            }
        } catch(e){}

        try {
            if (_resizeObserver) { _resizeObserver.disconnect(); _resizeObserver = null; }
        } catch(e){}

        try {
            userMarkers.forEach(function(m) {
                try {
                    if (map && m && typeof map.removeLayer === 'function') map.removeLayer(m);
                } catch(e){}
            });
            userMarkers.clear();
        } catch(e){}
        myMarker = null; myAccuracyCircle = null;

        try {
            if (map && typeof map.remove === 'function') {
                map.remove(); map = null; mapInitialized = false;
            }
        } catch(e){}

        log('🧹 Monitoring v13.5 cleanup done');
    }

    window._pageCleanup = window._pageCleanup || [];
    window._pageCleanup.push(_cleanup);
    window.addEventListener('beforeunload', _cleanup);
    window.addEventListener('pagehide', _cleanup);

    // ============================================================
    // HELPERS
    // ============================================================
    function fetchJSON(url, opts) {
        opts = opts || {};
        opts.headers = Object.assign({}, authHeaders(), opts.headers || {});
        opts.credentials = 'include';

        var controller = new AbortController();
        opts.signal = controller.signal;
        var entry = { controller: controller, aborted: false };
        _abortControllers.push(entry);

        var timeoutId = setTimeout(function() {
            if (!entry.aborted) {
                entry.aborted = true;
                try { controller.abort(); } catch(e){}
            }
        }, FETCH_TIMEOUT_MS);

        var maxCleanupId = setTimeout(function() {
            var idx = _abortControllers.indexOf(entry);
            if (idx > -1) _abortControllers.splice(idx, 1);
        }, MAX_FETCH_TIMEOUT_MS);
        _timeouts.push(timeoutId);
        _timeouts.push(maxCleanupId);

        function finish() {
            clearTimeout(timeoutId);
            clearTimeout(maxCleanupId);
            var idx = _abortControllers.indexOf(entry);
            if (idx > -1) _abortControllers.splice(idx, 1);
        }

        return fetch(url, opts).then(function(res) {
            finish();
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }).catch(function(err) {
            finish();
            if (err && err.name === 'AbortError') throw new Error('Request timeout');
            throw err;
        });
    }

    function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, function(m) {
            return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m];
        });
    }

    function formatTimeAgo(iso) {
        try {
            if (!iso) return '—';
            var d = new Date(iso);
            if (isNaN(d.getTime())) return '—';
            var diff = Date.now() - d.getTime();
            if (diff < 0) return 'الآن';
            var s = Math.floor(diff / 1000);
            if (s < 30) return 'الآن';
            if (s < 60) return s + ' ث';
            if (s < 3600) return Math.floor(s / 60) + ' د';
            if (s < 86400) return Math.floor(s / 3600) + ' س';
            return Math.floor(s / 86400) + ' ي';
        } catch(e) { return '—'; }
    }

    // ============================================================
    // DEVICE FINGERPRINT
    // ============================================================
    function getDeviceFingerprint() {
        try {
            var nav = navigator;
            var ua = nav.userAgent || '';
            var platform = nav.platform || 'unknown';

            var type = 'desktop';
            if (/iPad|Tablet|PlayBook|Silk/i.test(ua) ||
                (/Android/i.test(ua) && !/Mobile/i.test(ua))) {
                type = 'tablet';
            } else if (/Mobile|Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
                type = 'mobile';
            }

            var os = 'unknown';
            if (/Windows NT 10/i.test(ua)) os = 'Windows 10/11';
            else if (/Windows NT/i.test(ua)) os = 'Windows';
            else if (/Mac OS X/i.test(ua)) os = 'macOS';
            else if (/Android/i.test(ua)) {
                var m = ua.match(/Android\s([\d.]+)/);
                os = 'Android ' + (m ? m[1] : '');
            }
            else if (/iPhone|iPad|iPod/i.test(ua)) {
                var mi = ua.match(/OS\s([\d_]+)/);
                os = 'iOS ' + (mi ? mi[1].replace(/_/g, '.') : '');
            }
            else if (/Linux/i.test(ua)) os = 'Linux';

            var browser = 'unknown';
            if (/Edg\//i.test(ua)) browser = 'Edge ' + (ua.match(/Edg\/([\d.]+)/) || ['',''])[1];
            else if (/OPR\//i.test(ua) || /Opera/i.test(ua)) browser = 'Opera';
            else if (/Chrome\//i.test(ua) && !/Edg/i.test(ua)) {
                browser = 'Chrome ' + (ua.match(/Chrome\/([\d.]+)/) || ['',''])[1].split('.')[0];
            }
            else if (/Firefox\//i.test(ua)) {
                browser = 'Firefox ' + (ua.match(/Firefox\/([\d.]+)/) || ['',''])[1].split('.')[0];
            }
            else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) {
                browser = 'Safari ' + (ua.match(/Version\/([\d.]+)/) || ['',''])[1].split('.')[0];
            }

            var model = 'unknown';
            var mm = ua.match(/\(([^)]+)\)/);
            if (mm) {
                var parts = mm[1].split(';');
                if (parts.length >= 2) {
                    var candidate = parts[parts.length - 1].trim();
                    if (candidate && !/like|khtml|gecko|wow/i.test(candidate)) {
                        model = candidate;
                    }
                }
            }

            var deviceId = localStorage.getItem('_device_id');
            if (!deviceId) {
                deviceId = 'dev-' + Math.random().toString(36).substring(2, 10) +
                           Date.now().toString(36);
                localStorage.setItem('_device_id', deviceId);
            }

            return {
                deviceId: deviceId,
                type: type,
                os: os,
                browser: browser,
                model: model,
                platform: platform,
                screen: nav.screen ? (nav.screen.width + '×' + nav.screen.height) : 'unknown',
                language: nav.language || 'unknown',
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown',
                userAgent: ua.substring(0, 200),
                touch: ('ontouchstart' in window) || (nav.maxTouchPoints > 0)
            };
        } catch(e) {
            warn('deviceFingerprint error:', e.message);
            return null;
        }
    }

    // ============================================================
    // SEND LOCATION
    // ============================================================
    function sendLocationToServer(coords, retryCount) {
        if (_isDestroyed) return;
        retryCount = retryCount || 0;

        var deviceInfo = getDeviceFingerprint();
        var payload = {
            latitude: coords.latitude,
            longitude: coords.longitude,
            accuracy: coords.accuracy || null,
            device: deviceInfo
        };

        log('📤 Sending location + device:', payload);

        fetchJSON('/api/locations', {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(function() {
            log('📍 Location sent OK');
        })
        .catch(function(err) {
            warn('[GEO] send error:', err.message);
            if (retryCount < 1 && !_isDestroyed) {
                var tid = setTimeout(function() {
                    if (!_isDestroyed) sendLocationToServer(coords, retryCount + 1);
                }, 5000);
                _timeouts.push(tid);
            }
        });
    }

    function startGeolocation() {
        if (!navigator.geolocation || _isDestroyed) return;
        if (window._geoWatchId != null) return;

        try {
            window._geoWatchId = navigator.geolocation.watchPosition(
                function(pos) {
                    if (_isDestroyed) return;
                    myLocation = pos.coords;
                    sendLocationToServer(pos.coords);
                    updateMyMarker(pos.coords);
                },
                function(err) {
                    warn('[GEO] watch error:', err.code, err.message);
                },
                { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 }
            );
            log('📍 Geolocation started');
        } catch(e) {
            warn('[GEO] watch exception:', e.message);
        }
    }

    // ============================================================
    // MY MARKER
    // ============================================================
    function updateMyMarker(coords) {
        if (!map || !mapInitialized || _isDestroyed) return;

        try {
            var ll = [coords.latitude, coords.longitude];
            var popupHtml =
                '<div style="text-align:center;padding:4px 0">' +
                '<div style="font-size:22px;line-height:1">🟡</div>' +
                '<div style="font-weight:900;color:#f7d774;font-size:14px;margin-top:4px">موقعك الحالي</div>' +
                '<div style="color:rgba(255,255,255,0.5);font-size:11px;font-family:monospace;margin-top:4px">' +
                    coords.latitude.toFixed(5) + ', ' + coords.longitude.toFixed(5) +
                '</div>' +
                '<div style="color:rgba(255,255,255,0.4);font-size:10px;margin-top:2px">' +
                    'الدقة: ±' + Math.round(coords.accuracy || 0) + ' م' +
                '</div></div>';

            if (!myMarker) {
                myMarker = L.circleMarker(ll, {
                    radius: 12, fillColor: '#f7d774',
                    color: '#ffffff', weight: 3,
                    opacity: 1, fillOpacity: 0.95
                }).addTo(map);
                myMarker.bindPopup(popupHtml);
            } else {
                myMarker.setLatLng(ll);
                myMarker.setPopupContent(popupHtml);
            }

            if (!myAccuracyCircle) {
                myAccuracyCircle = L.circle(ll, {
                    radius: coords.accuracy || 50,
                    color: '#f7d774', weight: 1, opacity: 0.4,
                    fillColor: '#f7d774', fillOpacity: 0.08,
                    interactive: false
                }).addTo(map);
            } else {
                myAccuracyCircle.setLatLng(ll);
                myAccuracyCircle.setRadius(coords.accuracy || 50);
            }
        } catch(e) {
            warn('[MAP] my marker error:', e.message);
        }
    }

    // ============================================================
    // OTHER USERS
    // ============================================================
    function addMarkers(locs) {
        if (!map || !mapInitialized || _isDestroyed) return;
        if (typeof L === 'undefined') return;

        log('🗺️ addMarkers called with', locs.length, 'locs, myId =', myId);

        userMarkers.forEach(function(m) {
            try { if (map && m) map.removeLayer(m); } catch(e){}
        });
        userMarkers.clear();

        var rendered = 0;
        var skipped = 0;
        var points = [];

        locs.forEach(function(loc) {
            var myIdStr = String(myId || '').trim();
            var locIdStr = String(loc.userId || loc.id || '').trim();
            var isMe = myIdStr && locIdStr && (myIdStr === locIdStr);

            log('   → loc userId:', locIdStr, '| isMe:', isMe, '| lat:', loc.latitude, '| lng:', loc.longitude);

            if (isMe) { skipped++; return; }

            var lat = Number(loc.latitude);
            var lng = Number(loc.longitude);
            if (!isFinite(lat) || !isFinite(lng)) {
                warn('   ⚠️ invalid coords');
                return;
            }

            try {
                var marker = L.circleMarker([lat, lng], {
                    radius: 10, fillColor: '#60a5fa',
                    color: '#ffffff', weight: 3,
                    opacity: 1, fillOpacity: 0.9
                });

                var device = loc.device || {};
                var devType = device.type === 'mobile' ? '📱 هاتف'
                            : device.type === 'tablet' ? '📲 لوحي'
                            : device.type === 'desktop' ? '💻 حاسوب'
                            : '❓ غير معروف';

                marker.bindPopup(
                    '<div style="text-align:center;padding:4px 0">' +
                    '<div style="font-size:22px;line-height:1">🔵</div>' +
                    '<div style="font-weight:900;color:#60a5fa;font-size:14px;margin-top:4px">' +
                        escapeHtml(loc.name || loc.username || 'مستخدم') +
                    '</div>' +
                    (loc.roleLabel ? '<div style="color:#f7d774;font-size:11px;font-weight:700;margin-top:2px">' + escapeHtml(loc.roleLabel) + '</div>' : '') +
                    (loc.region ? '<div style="color:rgba(255,255,255,0.5);font-size:11px;margin-top:2px">📍 ' + escapeHtml(loc.region) + '</div>' : '') +
                    (device.deviceId ?
                    '<div style="margin-top:8px;padding-top:6px;border-top:1px dashed rgba(255,255,255,0.1);text-align:right;font-size:10px;color:rgba(255,255,255,0.5);direction:rtl">' +
                        '<div>🆔 <b style="color:#60a5fa;font-family:monospace">' + escapeHtml(device.deviceId) + '</b></div>' +
                        '<div style="margin-top:3px">' + devType + ' — ' + escapeHtml(device.model || '?') + '</div>' +
                        '<div style="margin-top:2px">💿 ' + escapeHtml(device.os || '?') + ' | 🌐 ' + escapeHtml(device.browser || '?') + '</div>' +
                    '</div>' : '') +
                    '<div style="color:rgba(255,255,255,0.4);font-size:10px;font-family:monospace;margin-top:6px">' +
                        lat.toFixed(5) + ', ' + lng.toFixed(5) +
                    '</div>' +
                    '<div style="color:rgba(255,255,255,0.3);font-size:10px;margin-top:2px">' +
                        formatTimeAgo(loc.timestamp) +
                    '</div></div>'
                );

                marker.addTo(map);
                userMarkers.set(String(loc.userId || loc.id), marker);
                points.push([lat, lng]);
                rendered++;
            } catch(e) {
                warn('⚠️ marker error:', e.message);
            }
        });

        log('✅ Rendered', rendered, 'markers | skipped', skipped, '(me)');

        if (!firstFitDone && (rendered > 0 || myLocation)) {
            try {
                var allPoints = [];
                if (myLocation) allPoints.push([myLocation.latitude, myLocation.longitude]);
                points.forEach(function(p) { allPoints.push(p); });

                if (allPoints.length > 1) {
                    var maxDist = 0;
                    for (var i = 0; i < allPoints.length; i++) {
                        for (var j = i + 1; j < allPoints.length; j++) {
                            var dx = allPoints[i][0] - allPoints[j][0];
                            var dy = allPoints[i][1] - allPoints[j][1];
                            var d = Math.sqrt(dx*dx + dy*dy);
                            if (d > maxDist) maxDist = d;
                        }
                    }
                    if (maxDist < 0.01) map.setView(allPoints[0], 14);
                    else map.fitBounds(allPoints, { padding: [80, 80], maxZoom: 15 });
                } else if (allPoints.length === 1) {
                    map.setView(allPoints[0], 14);
                }
                firstFitDone = true;
            } catch(e) {}
        }
    }

    function handleUserCardClick(uid) {
        if (String(uid) === String(myId) && myLocation && map) {
            map.flyTo([myLocation.latitude, myLocation.longitude], 15, { duration: 1.2 });
            if (myMarker) {
                var tid = setTimeout(function() {
                    if (!_isDestroyed && myMarker) myMarker.openPopup();
                }, 400);
                _timeouts.push(tid);
            }
        } else if (userMarkers.has(uid) && map) {
            var m = userMarkers.get(uid);
            var ll = m.getLatLng();
            map.flyTo(ll, 15, { duration: 1.2 });
            var tid2 = setTimeout(function() {
                if (!_isDestroyed && m) m.openPopup();
            }, 400);
            _timeouts.push(tid2);
        }
        if (window.innerWidth < 768) {
            var panel = document.getElementById('sidePanel');
            if (panel) panel.classList.remove('open');
        }
    }

    function renderUsersList() {
        var el = document.getElementById('usersList');
        if (!el) return;

        if (!users.length) {
            el.innerHTML = '<div class="empty-state"><i class="fas fa-users-slash"></i><p>لا يوجد مستخدمون</p></div>';
            return;
        }

        var locByUser = {};
        locations.forEach(function(l) {
            var key = String(l.userId);
            if (!locByUser[key] || new Date(l.timestamp) > new Date(locByUser[key].timestamp)) {
                locByUser[key] = l;
            }
        });

        var sorted = users.slice().sort(function(a, b) {
            var aId = String(a.id || a._id);
            var bId = String(b.id || b._id);
            var aMe = aId === String(myId);
            var bMe = bId === String(myId);
            if (aMe && !bMe) return -1;
            if (!aMe && bMe) return 1;
            var aLoc = !!locByUser[aId];
            var bLoc = !!locByUser[bId];
            if (aLoc && !bLoc) return -1;
            if (!aLoc && bLoc) return 1;
            return 0;
        });

        var html = '';
        sorted.forEach(function(u) {
            var uid = String(u.id || u._id || '');
            var loc = locByUser[uid];
            var isMe = String(myId) === uid;
            var hasLoc = !!loc;

            var cls = 'user-card';
            if (isMe) cls += ' me';
            if (!hasLoc && !isMe) cls += ' offline';

            var icon = isMe ? '🟡' : (hasLoc ? '🟢' : '⚪');
            var dotCls = hasLoc ? 'online' : 'offline';

            html +=
                '<div class="' + cls + '" data-user-id="' + escapeHtml(uid) + '">' +
                    '<div class="card-top">' +
                        '<div class="user-name">' +
                            '<span class="icon">' + icon + '</span>' +
                            '<span>' + escapeHtml(u.name || u.username || 'مستخدم') + '</span>' +
                            (isMe ? ' <span style="color:#f7d774;font-size:10px;font-weight:700">(أنت)</span>' : '') +
                        '</div>' +
                        '<span class="status-dot ' + dotCls + '"></span>' +
                    '</div>' +
                    '<div class="user-meta">' +
                        (u.roleLabel ? '<span class="tag role">' + escapeHtml(u.roleLabel) + '</span>' : '') +
                        (u.region ? '<span class="tag region">📍 ' + escapeHtml(u.region) + '</span>' : '') +
                        (hasLoc ? '<span class="tag time">🕐 ' + formatTimeAgo(loc.timestamp) + '</span>' : '<span class="tag time">لا يوجد موقع</span>') +
                    '</div>' +
                    (hasLoc ? '<div class="coords">' +
                        '<i class="fas fa-map-pin"></i>' +
                        Number(loc.latitude).toFixed(4) + ', ' + Number(loc.longitude).toFixed(4) +
                    '</div>' : '') +
                '</div>';
        });

        el.innerHTML = html;

        if (!el._delegationAttached) {
            el._delegationAttached = true;
            var delegHandler = function(e) {
                var card = e.target.closest ? e.target.closest('.user-card') : null;
                if (card) {
                    var uid = card.getAttribute('data-user-id');
                    if (uid) handleUserCardClick(uid);
                }
            };
            el.addEventListener('click', delegHandler);
            _listeners.push({ el: el, type: 'click', fn: delegHandler });
        }
    }

    // ============================================================
    // RENDER DEVICES
    // ============================================================
    function renderDevicesList() {
        var el = document.getElementById('devicesList');
        if (!el) return;

        var devicesMap = {};
        locations.forEach(function(loc) {
            var d = loc.device;
            if (!d || !d.deviceId) return;
            var key = String(d.deviceId);
            if (!devicesMap[key] || new Date(loc.timestamp) > new Date(devicesMap[key].timestamp)) {
                devicesMap[key] = {
                    deviceId: key,
                    type: d.type || 'unknown',
                    os: d.os || 'unknown',
                    browser: d.browser || 'unknown',
                    model: d.model || 'unknown',
                    screen: d.screen || 'unknown',
                    ip: loc.ip || d.ip || '—',
                    username: loc.name || loc.username || 'مستخدم',
                    timestamp: loc.timestamp,
                    isMe: String(loc.userId) === String(myId)
                };
            }
        });

        devices = Object.values(devicesMap);

        var cnt = document.getElementById('devicesCount');
        if (cnt) cnt.textContent = devices.length;
        var statEl = document.getElementById('statSessions');
        if (statEl) statEl.textContent = devices.length;

        if (!devices.length) {
            el.innerHTML = '<div class="empty-state"><i class="fas fa-microchip"></i><p>لا توجد أجهزة مسجّلة</p></div>';
            return;
        }

        devices.sort(function(a, b) {
            if (a.isMe && !b.isMe) return -1;
            if (!a.isMe && b.isMe) return 1;
            return new Date(b.timestamp) - new Date(a.timestamp);
        });

        var html = '';
        devices.forEach(function(d) {
            var icon = 'fa-desktop', iconCls = 'desktop', typeLabel = '💻 حاسوب';
            if (d.type === 'mobile') {
                icon = 'fa-mobile-screen-button'; iconCls = 'mobile'; typeLabel = '📱 هاتف';
            } else if (d.type === 'tablet') {
                icon = 'fa-tablet-screen-button'; iconCls = 'tablet'; typeLabel = '📲 لوحي';
            }

            var age = Date.now() - new Date(d.timestamp).getTime();
            var isOnline = age < 60000;

            html +=
                '<div class="device-card">' +
                    '<div class="device-header">' +
                        '<div class="device-name">' +
                            '<i class="fas ' + icon + ' ' + iconCls + '"></i>' +
                            '<span>' + escapeHtml(d.username) + '</span>' +
                            (d.isMe ? ' <span style="color:#f7d774;font-size:9px">(أنت)</span>' : '') +
                        '</div>' +
                        '<span class="device-badge' + (isOnline ? '' : ' offline') + '">' +
                            (isOnline ? '🟢 متصل' : '⚪ ' + formatTimeAgo(d.timestamp)) +
                        '</span>' +
                    '</div>' +
                    '<div class="device-row">' +
                        '<span class="label">🆔 المعرّف:</span>' +
                        '<span class="value">' + escapeHtml(d.deviceId) + '</span>' +
                    '</div>' +
                    '<div class="device-row">' +
                        '<span class="label">📟 النوع:</span>' +
                        '<span class="value">' + typeLabel + ' — ' + escapeHtml(d.model) + '</span>' +
                    '</div>' +
                    '<div class="device-row">' +
                        '<span class="label">💿 النظام:</span>' +
                        '<span class="value">' + escapeHtml(d.os) + '</span>' +
                    '</div>' +
                    '<div class="device-row">' +
                        '<span class="label">🌐 المتصفح:</span>' +
                        '<span class="value">' + escapeHtml(d.browser) + '</span>' +
                    '</div>' +
                    '<div class="device-row">' +
                        '<span class="label">🖥️ الشاشة:</span>' +
                        '<span class="value">' + escapeHtml(d.screen) + '</span>' +
                    '</div>' +
                    (d.ip && d.ip !== '—' ?
                    '<div class="device-row">' +
                        '<span class="label">📍 IP:</span>' +
                        '<span class="value device-ip">' + escapeHtml(d.ip) + '</span>' +
                    '</div>' : '') +
                '</div>';
        });

        el.innerHTML = html;
    }

    // ============================================================
    // ONLINE STATUS
    // ============================================================
    function updateOnlineStatus() {
        var badge = document.getElementById('liveBadge');
        var el = document.getElementById('lastUpdate');
        if (navigator.onLine) {
            if (badge) badge.classList.remove('offline');
        } else {
            if (badge) badge.classList.add('offline');
            if (el) el.textContent = '⚠️ غير متصل';
        }
    }

    // ============================================================
    // VISIBILITY
    // ============================================================
    function setupVisibilityHandling() {
        if (!IDLE_REFRESH_PAUSE) return;

        var visHandler = function() {
            _isIdle = document.hidden;
            var indicator = document.getElementById('idleIndicator');

            if (_isIdle) {
                if (_refreshIntervalId) {
                    clearInterval(_refreshIntervalId);
                    _refreshIntervalId = null;
                }
                if (indicator) indicator.classList.add('show');
            } else {
                if (!_refreshIntervalId && !_isDestroyed) {
                    refreshAll();
                    _refreshIntervalId = setInterval(refreshAll, REFRESH_INTERVAL_MS);
                }
                if (indicator) indicator.classList.remove('show');
            }
        };

        document.addEventListener('visibilitychange', visHandler);
        _listeners.push({ el: document, type: 'visibilitychange', fn: visHandler });
        _isIdle = document.hidden;
    }

    // ============================================================
    // REFRESH
    // ============================================================
    function refreshAll() {
        if (_isDestroyed) return;
        if (_isIdle) return;
        if (!navigator.onLine) { updateOnlineStatus(); return; }

        loadUsers();

        var el = document.getElementById('lastUpdate');
        if (el) el.textContent = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    }

    // ============================================================
    // LOCATE ME
    // ============================================================
    function locateMe() {
        if (!navigator.geolocation) {
            alert('المتصفح لا يدعم تحديد الموقع');
            return;
        }
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                if (_isDestroyed) return;
                myLocation = pos.coords;
                sendLocationToServer(pos.coords);
                updateMyMarker(pos.coords);
                if (map) map.flyTo([pos.coords.latitude, pos.coords.longitude], 16, { duration: 1.5 });
                if (myMarker) {
                    var tid = setTimeout(function() {
                        if (!_isDestroyed && myMarker) myMarker.openPopup();
                    }, 500);
                    _timeouts.push(tid);
                }
                startGeolocation();
            },
            function(err) {
                var msg = 'تعذّر تحديد الموقع';
                if (err.code === 1) msg = '⚠️ يجب السماح بالوصول إلى الموقع';
                else if (err.code === 2) msg = '⚠️ تعذّر تحديد موقعك';
                else if (err.code === 3) msg = '⚠️ انتهت المهلة';
                alert(msg);
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }

    // ============================================================
    // RESIZE
    // ============================================================
    function setupResizeHandlers() {
        var resizeHandler = function() {
            if (!map || _isDestroyed) return;
            var tid = setTimeout(function() {
                if (map && !_isDestroyed) {
                    try { map.invalidateSize(); } catch(e) {}
                }
            }, 200);
            _timeouts.push(tid);
        };
        window.addEventListener('resize', resizeHandler);
        _listeners.push({ el: window, type: 'resize', fn: resizeHandler });

        if (window.ResizeObserver) {
            var panel = document.getElementById('sidePanel');
            if (panel) {
                try {
                    _resizeObserver = new ResizeObserver(function() {
                        if (!map || _isDestroyed) return;
                        var tid = setTimeout(function() {
                            if (map && !_isDestroyed) map.invalidateSize();
                        }, 250);
                        _timeouts.push(tid);
                    });
                    _resizeObserver.observe(panel);
                } catch(e) {}
            }
        }
    }

    // ============================================================
    // INIT
    // ============================================================
    function init() {
        if (_isDestroyed) return;
        if (initDone) return;
        initDone = true;

        log('🚀 Initializing v13.5...');

        if (typeof L === 'undefined') {
            if (!window._leafletFailed) {
                var waitId = setTimeout(function() {
                    initDone = false;
                    init();
                }, 500);
                _timeouts.push(waitId);
                return;
            }
            showMapError('فشل تحميل الخريطة', 'Leaflet لم تُحمّل',
                'onLine: ' + navigator.onLine);
            return;
        }

        var me = readMyUser();
        myId = sanitizeId(me ? (me.id || me._id) : null);
        console.log('👤 MY ID =', myId, '| Source:', me ? me._source : 'NONE');
        console.log('👤 MY USER =', me);

        initMap();

        // UI Events
        var toggleBtn = document.getElementById('togglePanelBtn');
        if (toggleBtn) {
            var tHandler = function() {
                var p = document.getElementById('sidePanel');
                if (p) {
                    p.classList.toggle('open');
                    if (map) {
                        var tid = setTimeout(function() {
                            if (map && !_isDestroyed) map.invalidateSize();
                        }, 400);
                        _timeouts.push(tid);
                    }
                }
            };
            toggleBtn.addEventListener('click', tHandler);
            _listeners.push({ el: toggleBtn, type: 'click', fn: tHandler });
        }

        var closeBtn = document.getElementById('closePanelBtn');
        if (closeBtn) {
            var cHandler = function() {
                var p = document.getElementById('sidePanel');
                if (p) p.classList.remove('open');
            };
            closeBtn.addEventListener('click', cHandler);
            _listeners.push({ el: closeBtn, type: 'click', fn: cHandler });
        }

        var locateBtn = document.getElementById('locateMeBtn');
        if (locateBtn) {
            locateBtn.addEventListener('click', locateMe);
            _listeners.push({ el: locateBtn, type: 'click', fn: locateMe });
        }

        var refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) {
            var rHandler = function() {
                refreshBtn.classList.add('spinning');
                refreshAll();
                var tid = setTimeout(function() {
                    refreshBtn.classList.remove('spinning');
                }, 800);
                _timeouts.push(tid);
            };
            refreshBtn.addEventListener('click', rHandler);
            _listeners.push({ el: refreshBtn, type: 'click', fn: rHandler });
        }

        var onlineH = function() { updateOnlineStatus(); refreshAll(); };
        var offlineH = function() { updateOnlineStatus(); };
        window.addEventListener('online', onlineH);
        window.addEventListener('offline', offlineH);
        _listeners.push({ el: window, type: 'online', fn: onlineH });
        _listeners.push({ el: window, type: 'offline', fn: offlineH });
        updateOnlineStatus();

        setupVisibilityHandling();
        setupResizeHandlers();

        var hideId = setTimeout(hideLoading, 600);
        _timeouts.push(hideId);

        // ✅ ابدأ التتبع أولاً
        startGeolocation();

        // ✅ ثم حمّل البيانات
        refreshAll();
        _refreshIntervalId = setInterval(refreshAll, REFRESH_INTERVAL_MS);
        _intervals.push(_refreshIntervalId);

        verifyMyIdFromServer();

        log('✅ Monitoring v13.5 ready');
    }

    // ============================================================
    // BOOT
    // ============================================================
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            var tid = setTimeout(init, 300);
            _timeouts.push(tid);
        });
    } else {
        var tid0 = setTimeout(init, 300);
        _timeouts.push(tid0);
    }

    window.monitoringDebug = {
        refresh: refreshAll,
        getUsers: function() { return users; },
        getLocations: function() { return locations; },
        getDevices: function() { return devices; },
        getMyId: function() { return myId; },
        getMyUser: readMyUser,
        getToken: getToken,
        getDeviceFingerprint: getDeviceFingerprint,
        locateMe: locateMe,
        isDestroyed: function() { return _isDestroyed; },
        getMap: function() { return map; },
        cleanup: _cleanup
    };

    console.log('✅ monitoring.html v13.5 ready — استخدم monitoringDebug في console');

})();
</script>
