<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🛰️ المراقبة الحية — منظومة الوسائل البحرية</title>

<!-- ✅ Leaflet — نسخة واحدة فقط -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- ✅ Leaflet Fullscreen (اختياري) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@2.4.0/Control.FullScreen.css" />
<script src="https://unpkg.com/leaflet.fullscreen@2.4.0/Control.FullScreen.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        font-family: 'Cairo', 'Segoe UI', sans-serif;
        background: #050811;
        color: #e8edf5;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
    }

    /* ============================================================
       MAP — FULL SCREEN
       ============================================================ */
    #map {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        background: #050811;
    }

    .leaflet-container {
        background: #050811 !important;
        font-family: 'Cairo', sans-serif !important;
    }

    /* ✅ إصلاح ألوان Leaflet */
    .leaflet-control-zoom a {
        background: rgba(15, 20, 32, 0.95) !important;
        color: #f7d774 !important;
        border: 1px solid rgba(247, 215, 116, 0.3) !important;
        backdrop-filter: blur(10px);
        width: 36px !important;
        height: 36px !important;
        line-height: 36px !important;
        font-size: 18px !important;
        font-weight: bold;
        transition: all 0.2s;
    }

    .leaflet-control-zoom a:hover {
        background: rgba(247, 215, 116, 0.2) !important;
        color: #fff !important;
    }

    .leaflet-control-attribution {
        background: rgba(5, 8, 17, 0.85) !important;
        color: rgba(255, 255, 255, 0.4) !important;
        font-size: 10px !important;
        padding: 2px 8px !important;
        border-radius: 6px 0 0 0 !important;
    }

    .leaflet-control-attribution a {
        color: #60a5fa !important;
    }

    .leaflet-popup-content-wrapper {
        background: linear-gradient(135deg, rgba(15, 20, 32, 0.98), rgba(10, 14, 26, 0.98)) !important;
        color: #e8edf5 !important;
        border: 1px solid rgba(247, 215, 116, 0.3) !important;
        border-radius: 14px !important;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(247, 215, 116, 0.1) !important;
        backdrop-filter: blur(20px);
        padding: 0 !important;
    }

    .leaflet-popup-content {
        margin: 0 !important;
        padding: 14px 16px !important;
        font-family: 'Cairo', sans-serif !important;
        direction: rtl !important;
        min-width: 200px;
    }

    .leaflet-popup-tip {
        background: rgba(15, 20, 32, 0.98) !important;
        border: 1px solid rgba(247, 215, 116, 0.3) !important;
    }

    .leaflet-popup-close-button {
        color: #f7d774 !important;
        font-size: 20px !important;
        padding: 6px 10px !important;
    }

    /* ============================================================
       TOP BAR — Glassmorphism
       ============================================================ */
    .top-bar {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 24px;
        background: linear-gradient(135deg, rgba(15, 20, 32, 0.85), rgba(10, 14, 26, 0.85));
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(247, 215, 116, 0.2);
        border-radius: 100px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 60px rgba(247, 215, 116, 0.05);
        max-width: calc(100vw - 32px);
        flex-wrap: wrap;
        justify-content: center;
    }

    .top-bar .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-left: 16px;
        border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    .top-bar .brand i {
        font-size: 22px;
        color: #f7d774;
        filter: drop-shadow(0 0 8px rgba(247, 215, 116, 0.6));
    }

    .top-bar .brand .text {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
    }

    .top-bar .brand .text .title {
        font-size: 14px;
        font-weight: 900;
        color: #f7d774;
        letter-spacing: 0.3px;
    }

    .top-bar .brand .text .subtitle {
        font-size: 9.5px;
        color: rgba(255, 255, 255, 0.4);
    }

    .top-bar .stats {
        display: flex;
        gap: 14px;
    }

    .top-bar .stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 50px;
    }

    .top-bar .stat .value {
        font-size: 18px;
        font-weight: 900;
        color: #f7d774;
        line-height: 1;
        text-shadow: 0 0 20px rgba(247, 215, 116, 0.5);
    }

    .top-bar .stat .label {
        font-size: 9px;
        color: rgba(255, 255, 255, 0.4);
        margin-top: 2px;
        font-weight: 600;
    }

    .top-bar .live-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        background: rgba(74, 222, 128, 0.12);
        border: 1px solid rgba(74, 222, 128, 0.3);
        border-radius: 20px;
        font-size: 10px;
        font-weight: 700;
        color: #4ade80;
    }

    .top-bar .live-badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4ade80;
        box-shadow: 0 0 10px #4ade80;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* ============================================================
       SIDE PANEL — Slide from right
       ============================================================ */
    .side-panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 360px;
        max-width: 92vw;
        z-index: 1100;
        background: linear-gradient(180deg, rgba(10, 14, 26, 0.96), rgba(5, 8, 17, 0.98));
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-left: 1px solid rgba(247, 215, 116, 0.15);
        box-shadow: -10px 0 60px rgba(0, 0, 0, 0.7);
        transform: translateX(100%);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
    }

    .side-panel.open {
        transform: translateX(0);
    }

    .side-panel .panel-header {
        padding: 20px 22px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }

    .side-panel .panel-header h2 {
        font-size: 16px;
        font-weight: 900;
        color: #f7d774;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .side-panel .panel-header h2 i {
        font-size: 18px;
        color: #60a5fa;
    }

    .side-panel .close-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.6);
        width: 34px;
        height: 34px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }

    .side-panel .close-btn:hover {
        background: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
        border-color: rgba(239, 68, 68, 0.3);
    }

    .side-panel .panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px 24px;
    }

    .side-panel .panel-body::-webkit-scrollbar {
        width: 6px;
    }

    .side-panel .panel-body::-webkit-scrollbar-thumb {
        background: rgba(247, 215, 116, 0.3);
        border-radius: 10px;
    }

    .side-panel .panel-body::-webkit-scrollbar-thumb:hover {
        background: rgba(247, 215, 116, 0.5);
    }

    /* Section */
    .panel-section {
        margin-bottom: 24px;
    }

    .panel-section .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .panel-section .section-title h3 {
        font-size: 12px;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.65);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .panel-section .section-title h3 i {
        color: #60a5fa;
        font-size: 13px;
    }

    .panel-section .section-title .count {
        background: rgba(96, 165, 250, 0.15);
        color: #60a5fa;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 10px;
        font-weight: 800;
    }

    /* User item */
    .user-card {
        background: rgba(255, 255, 255, 0.025);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.25s ease;
        position: relative;
        overflow: hidden;
    }

    .user-card::before {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 3px;
        background: #60a5fa;
        opacity: 0.5;
        transition: opacity 0.2s;
    }

    .user-card:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(96, 165, 250, 0.3);
        transform: translateX(-4px);
    }

    .user-card:hover::before {
        opacity: 1;
    }

    .user-card.me {
        background: rgba(247, 215, 116, 0.05);
        border-color: rgba(247, 215, 116, 0.25);
    }

    .user-card.me::before {
        background: #f7d774;
        opacity: 1;
    }

    .user-card.offline {
        opacity: 0.55;
    }

    .user-card.offline::before {
        background: rgba(148, 163, 184, 0.5);
    }

    .user-card .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 6px;
    }

    .user-card .user-name {
        font-size: 13.5px;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.95);
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
        line-height: 1.3;
    }

    .user-card .user-name .icon {
        font-size: 14px;
        flex-shrink: 0;
    }

    .user-card.me .user-name {
        color: #f7d774;
    }

    .user-card .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        margin-top: 4px;
    }

    .user-card .status-dot.online {
        background: #4ade80;
        box-shadow: 0 0 10px #4ade80;
        animation: pulse 2s infinite;
    }

    .user-card .status-dot.offline {
        background: #64748b;
    }

    .user-card .user-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
    }

    .user-card .tag {
        font-size: 9.5px;
        padding: 2px 8px;
        border-radius: 8px;
        font-weight: 700;
        white-space: nowrap;
    }

    .user-card .tag.role {
        background: rgba(96, 165, 250, 0.12);
        color: #60a5fa;
    }

    .user-card .tag.region {
        background: rgba(247, 215, 116, 0.12);
        color: #f7d774;
    }

    .user-card .tag.time {
        background: rgba(148, 163, 184, 0.12);
        color: #94a3b8;
    }

    .user-card .coords {
        font-family: 'Courier New', monospace;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.35);
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .user-card .coords i {
        color: #60a5fa;
        font-size: 9px;
    }

    /* Empty state */
    .empty-state {
        text-align: center;
        padding: 30px 16px;
        color: rgba(255, 255, 255, 0.25);
    }

    .empty-state i {
        font-size: 32px;
        margin-bottom: 10px;
        opacity: 0.4;
        color: #60a5fa;
    }

    .empty-state p {
        font-size: 12px;
        font-weight: 600;
    }

    /* ============================================================
       FLOATING BUTTONS
       ============================================================ */
    .float-btn {
        position: absolute;
        z-index: 1050;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(15, 20, 32, 0.95), rgba(10, 14, 26, 0.95));
        backdrop-filter: blur(20px);
        border: 1px solid rgba(247, 215, 116, 0.25);
        color: #f7d774;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
    }

    .float-btn:hover {
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 12px 40px rgba(247, 215, 116, 0.25);
        border-color: rgba(247, 215, 116, 0.5);
    }

    .float-btn:active {
        transform: translateY(-1px) scale(1.02);
    }

    .float-btn.toggle-panel {
        top: 90px;
        right: 20px;
    }

    .float-btn.locate-me {
        bottom: 100px;
        right: 20px;
    }

    .float-btn.refresh {
        bottom: 20px;
        right: 20px;
    }

    .float-btn.refresh.spinning i {
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* ============================================================
       LEGEND
       ============================================================ */
    .legend {
        position: absolute;
        bottom: 20px;
        left: 20px;
        z-index: 1050;
        padding: 12px 16px;
        background: linear-gradient(135deg, rgba(15, 20, 32, 0.9), rgba(10, 14, 26, 0.9));
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        font-size: 11px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .legend .item {
        display: flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.7);
    }

    .legend .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid #fff;
        flex-shrink: 0;
    }

    .legend .dot.gold {
        background: #f7d774;
        box-shadow: 0 0 10px rgba(247, 215, 116, 0.6);
    }

    .legend .dot.blue {
        background: #60a5fa;
        box-shadow: 0 0 10px rgba(96, 165, 250, 0.6);
    }

    /* ============================================================
       LOADING
       ============================================================ */
    .loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: linear-gradient(135deg, #050811, #0a0e1a);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        transition: opacity 0.5s;
    }

    .loading.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .loading .satellite {
        width: 80px;
        height: 80px;
        position: relative;
    }

    .loading .satellite i {
        font-size: 56px;
        color: #f7d774;
        filter: drop-shadow(0 0 20px rgba(247, 215, 116, 0.6));
        animation: satellite-orbit 3s ease-in-out infinite;
    }

    @keyframes satellite-orbit {
        0%, 100% { transform: translateX(-10px) rotate(-5deg); }
        50% { transform: translateX(10px) rotate(5deg); }
    }

    .loading .text {
        color: #f7d774;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.5px;
    }

    .loading .subtext {
        color: rgba(255, 255, 255, 0.3);
        font-size: 11px;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 768px) {
        .top-bar {
            top: 12px;
            padding: 10px 16px;
            gap: 10px;
        }
        .top-bar .brand .text .title { font-size: 12px; }
        .top-bar .stat .value { font-size: 15px; }
        .top-bar .stat .label { font-size: 8px; }
        .top-bar .live-badge { font-size: 9px; padding: 3px 8px; }

        .side-panel { width: 100%; }

        .float-btn {
            width: 46px;
            height: 46px;
            font-size: 17px;
        }
        .float-btn.toggle-panel { top: 80px; right: 12px; }
        .float-btn.locate-me { bottom: 90px; right: 12px; }
        .float-btn.refresh { bottom: 12px; right: 12px; }

        .legend { font-size: 10px; padding: 8px 12px; }
        .legend .dot { width: 10px; height: 10px; }
    }

    @media (max-width: 480px) {
        .top-bar .brand .text { display: none; }
        .top-bar .brand { padding-left: 8px; }
    }
</style>
</head>
<body>

<!-- ===== MAP ===== -->
<div id="map"></div>

<!-- ===== TOP BAR ===== -->
<div class="top-bar">
    <div class="brand">
        <i class="fas fa-satellite-dish"></i>
        <div class="text">
            <span class="title">المراقبة الحية</span>
            <span class="subtitle">Live Tracking v13.0</span>
        </div>
    </div>

    <div class="stats">
        <div class="stat">
            <span class="value" id="statUsers">0</span>
            <span class="label">مستخدمون</span>
        </div>
        <div class="stat">
            <span class="value" id="statLocations">0</span>
            <span class="label">مواقع</span>
        </div>
        <div class="stat">
            <span class="value" id="statSessions">0</span>
            <span class="label">جلسات</span>
        </div>
    </div>

    <div class="live-badge">
        <span class="dot"></span>
        <span id="lastUpdate">مباشر</span>
    </div>
</div>

<!-- ===== FLOATING BUTTONS ===== -->
<button class="float-btn toggle-panel" id="togglePanelBtn" title="عرض القائمة">
    <i class="fas fa-users"></i>
</button>

<button class="float-btn locate-me" id="locateMeBtn" title="موقعي">
    <i class="fas fa-location-crosshairs"></i>
</button>

<button class="float-btn refresh" id="refreshBtn" title="تحديث">
    <i class="fas fa-rotate"></i>
</button>

<!-- ===== SIDE PANEL ===== -->
<aside class="side-panel" id="sidePanel">
    <div class="panel-header">
        <h2><i class="fas fa-users-line"></i> المستخدمون النشطون</h2>
        <button class="close-btn" id="closePanelBtn" title="إغلاق">
            <i class="fas fa-xmark"></i>
        </button>
    </div>
    <div class="panel-body">
        <!-- Users Section -->
        <div class="panel-section">
            <div class="section-title">
                <h3><i class="fas fa-users"></i> المستخدمون</h3>
                <span class="count" id="usersCount">0</span>
            </div>
            <div id="usersList">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>جاري التحميل...</p>
                </div>
            </div>
        </div>

        <!-- Sessions Section -->
        <div class="panel-section">
            <div class="section-title">
                <h3><i class="fas fa-key"></i> الجلسات النشطة</h3>
                <span class="count" id="sessionsCount">0</span>
            </div>
            <div id="sessionsList">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>جاري التحميل...</p>
                </div>
            </div>
        </div>
    </div>
</aside>

<!-- ===== LEGEND ===== -->
<div class="legend">
    <div class="item">
        <span class="dot gold"></span>
        <span>موقعك</span>
    </div>
    <div class="item">
        <span class="dot blue"></span>
        <span>المستخدمون الآخرون</span>
    </div>
</div>

<!-- ===== LOADING ===== -->
<div class="loading" id="loadingScreen">
    <div class="satellite">
        <i class="fas fa-satellite"></i>
    </div>
    <div class="text">جاري تهيئة الأقمار الصناعية...</div>
    <div class="subtext">Initializing Satellite View</div>
</div>

<script>
(function() {
    'use strict';

    console.log('🛰️ monitoring.html v13.0 - Loading...');

    // ============================================================
    // CLEANUP
    // ============================================================
    var _isDestroyed = false;
    var _intervals = [];
    var _timeouts = [];
    var _listeners = [];

    function _cleanup() {
        if (_isDestroyed) return;
        _isDestroyed = true;

        _intervals.forEach(function(id) { try { clearInterval(id); } catch(e){} });
        _timeouts.forEach(function(id) { try { clearTimeout(id); } catch(e){} });
        _listeners.forEach(function(l) {
            try { if (l.el && l.fn) l.el.removeEventListener(l.type, l.fn); } catch(e){}
        });
        _intervals = []; _timeouts = []; _listeners = [];

        try {
            if (window._geoWatchId != null && navigator.geolocation) {
                navigator.geolocation.clearWatch(window._geoWatchId);
                console.log('📍 Geolocation stopped');
            }
        } catch(e){}

        try {
            if (window.map && typeof window.map.remove === 'function') {
                window.map.remove();
                window.map = null;
            }
        } catch(e){}

        console.log('🧹 Monitoring v13.0 cleanup done');
    }

    window._pageCleanup = window._pageCleanup || [];
    window._pageCleanup.push(_cleanup);
    window.addEventListener('beforeunload', _cleanup);
    window.addEventListener('pagehide', _cleanup);

    // ============================================================
    // STATE
    // ============================================================
    var map = null;
    var myMarker = null;
    var myAccuracyCircle = null;
    var userMarkers = new Map();
    var myLocation = null;
    var myId = null;
    var users = [];
    var sessions = [];
    var locations = [];
    var mapInitialized = false;
    var firstFitDone = false;

    // ============================================================
    // HELPERS
    // ============================================================
    function getToken() {
        try {
            return localStorage.getItem('marine_auth_token')
                || localStorage.getItem('marine_token')
                || localStorage.getItem('token')
                || sessionStorage.getItem('token')
                || '';
        } catch(e) { return ''; }
    }

    function getCsrf() {
        try {
            var m = document.cookie.match(/marine_csrf=([^;]+)/);
            return m ? decodeURIComponent(m[1]) : '';
        } catch(e) { return ''; }
    }

    function authHeaders() {
        var h = { 'Accept': 'application/json', 'Content-Type': 'application/json' };
        var t = getToken();
        if (t) h['Authorization'] = 'Bearer ' + t;
        var c = getCsrf();
        if (c) h['X-CSRF-Token'] = c;
        return h;
    }

    function fetchJSON(url, opts) {
        opts = opts || {};
        opts.headers = Object.assign({}, authHeaders(), opts.headers || {});
        opts.credentials = 'include';
        return fetch(url, opts).then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        });
    }

    function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, function(m) {
            return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m];
        });
    }

    function formatTimeAgo(iso) {
        try {
            var d = new Date(iso);
            var diff = Date.now() - d.getTime();
            var s = Math.floor(diff / 1000);
            if (s < 30) return 'الآن';
            if (s < 60) return s + ' ث';
            if (s < 3600) return Math.floor(s / 60) + ' د';
            if (s < 86400) return Math.floor(s / 3600) + ' س';
            return Math.floor(s / 86400) + ' ي';
        } catch(e) { return '—'; }
    }

    function readMyUser() {
        try {
            var keys = ['marine_user', 'currentUser', 'user'];
            for (var i = 0; i < keys.length; i++) {
                var raw = localStorage.getItem(keys[i]) || sessionStorage.getItem(keys[i]);
                if (raw) {
                    var p = JSON.parse(raw);
                    if (p && (p.id || p._id)) return p;
                }
            }
        } catch(e) {}
        return null;
    }

    // ============================================================
    // 🛰️ INIT MAP — SATELLITE VIEW
    // ============================================================
    function initMap() {
        if (mapInitialized || _isDestroyed) return;
        var el = document.getElementById('map');
        if (!el) return;

        try {
            map = L.map('map', {
                center: [36.8, 10.18],
                zoom: 9,
                zoomControl: false,
                attributionControl: true,
                preferCanvas: false
            });

            // ✅ SATELLITE — Esri World Imagery (مجاني، دقة عالية)
            var satellite = L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                {
                    maxZoom: 19,
                    maxNativeZoom: 18,
                    attribution: '© Esri, Maxar, Earthstar Geographics',
                    crossOrigin: true
                }
            );

            // ✅ LABELS overlay — Esri Reference (أسماء المدن)
            var labels = L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
                {
                    maxZoom: 19,
                    maxNativeZoom: 18,
                    attribution: '© Esri',
                    pane: 'shadowPane',
                    opacity: 0.9
                }
            );

            satellite.addTo(map);
            labels.addTo(map);

            // Zoom control on left
            L.control.zoom({ position: 'topleft' }).addTo(map);

            // Fullscreen control
            try {
                if (typeof L.Control.FullScreen === 'function') {
                    L.control.fullscreen({
                        position: 'topleft',
                        title: 'ملء الشاشة',
                        titleCancel: 'خروج'
                    }).addTo(map);
                }
            } catch(e) {}

            mapInitialized = true;
            console.log('🛰️ Satellite map initialized');
        } catch(e) {
            console.warn('❌ Map init error:', e.message);
        }
    }

    // ============================================================
    // SEND LOCATION
    // ============================================================
    function sendLocationToServer(coords) {
        if (_isDestroyed) return;
        fetchJSON('/api/locations', {
            method: 'POST',
            body: JSON.stringify({
                latitude: coords.latitude,
                longitude: coords.longitude,
                accuracy: coords.accuracy || null
            })
        })
        .then(function() {
            console.log('📍 Location sent:', coords.latitude.toFixed(5), coords.longitude.toFixed(5), '±' + Math.round(coords.accuracy || 0) + 'm');
        })
        .catch(function(err) {
            console.warn('[GEO] send error:', err.message);
        });
    }

    function startGeolocation() {
        if (!navigator.geolocation || _isDestroyed) return;

        window._geoWatchId = navigator.geolocation.watchPosition(
            function(pos) {
                myLocation = pos.coords;
                sendLocationToServer(pos.coords);
                updateMyMarker(pos.coords);
            },
            function(err) {
                console.warn('[GEO] watch error:', err.code, err.message);
            },
            { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 }
        );

        console.log('📍 Geolocation started, watchId:', window._geoWatchId);
    }

    // ============================================================
    // MY MARKER — GOLDEN GLOWING
    // ============================================================
    function updateMyMarker(coords) {
        if (!map || !mapInitialized || _isDestroyed) return;
        try {
            var ll = [coords.latitude, coords.longitude];

            // Golden outer glow marker
            if (!myMarker) {
                myMarker = L.circleMarker(ll, {
                    radius: 12,
                    fillColor: '#f7d774',
                    color: '#ffffff',
                    weight: 3,
                    opacity: 1,
                    fillOpacity: 0.95
                }).addTo(map);

                myMarker.bindPopup(
                    '<div style="text-align:center;padding:4px 0">' +
                    '<div style="font-size:22px;line-height:1">🟡</div>' +
                    '<div style="font-weight:900;color:#f7d774;font-size:14px;margin-top:4px">موقعك الحالي</div>' +
                    '<div style="color:rgba(255,255,255,0.5);font-size:11px;font-family:monospace;margin-top:4px">' +
                        coords.latitude.toFixed(5) + ', ' + coords.longitude.toFixed(5) +
                    '</div>' +
                    '<div style="color:rgba(255,255,255,0.4);font-size:10px;margin-top:2px">' +
                        'الدقة: ±' + Math.round(coords.accuracy || 0) + ' م' +
                    '</div>' +
                    '</div>'
                );
            } else {
                myMarker.setLatLng(ll);
                myMarker.setPopupContent(
                    '<div style="text-align:center;padding:4px 0">' +
                    '<div style="font-size:22px;line-height:1">🟡</div>' +
                    '<div style="font-weight:900;color:#f7d774;font-size:14px;margin-top:4px">موقعك الحالي</div>' +
                    '<div style="color:rgba(255,255,255,0.5);font-size:11px;font-family:monospace;margin-top:4px">' +
                        coords.latitude.toFixed(5) + ', ' + coords.longitude.toFixed(5) +
                    '</div>' +
                    '<div style="color:rgba(255,255,255,0.4);font-size:10px;margin-top:2px">' +
                        'الدقة: ±' + Math.round(coords.accuracy || 0) + ' م' +
                    '</div>' +
                    '</div>'
                );
            }

            // Accuracy circle
            if (!myAccuracyCircle) {
                myAccuracyCircle = L.circle(ll, {
                    radius: coords.accuracy || 50,
                    color: '#f7d774',
                    weight: 1,
                    opacity: 0.4,
                    fillColor: '#f7d774',
                    fillOpacity: 0.08,
                    interactive: false
                }).addTo(map);
            } else {
                myAccuracyCircle.setLatLng(ll);
                myAccuracyCircle.setRadius(coords.accuracy || 50);
            }

        } catch(e) {
            console.warn('[MAP] my marker error:', e.message);
        }
    }

    // ============================================================
    // ✅ ADD OTHER USERS' MARKERS
    // ============================================================
    function addMarkers(locs, allUsers) {
        if (!map || !mapInitialized || _isDestroyed) return;

        console.log('🗺️ addMarkers: rendering', locs.length, 'locations');

        userMarkers.forEach(function(m) {
            try { map.removeLayer(m); } catch(e){}
        });
        userMarkers.clear();

        var rendered = 0;
        var points = [];

        locs.forEach(function(loc) {
            var isMe = false;
            try {
                var myIdStr = String(myId || '').trim();
                var locIdStr = String(loc.userId || loc.id || '').trim();
                isMe = myIdStr && locIdStr && (myIdStr === locIdStr);
            } catch(e) { isMe = false; }

            if (isMe) return; // myMarker already exists

            var lat = Number(loc.latitude);
            var lng = Number(loc.longitude);
            if (!isFinite(lat) || !isFinite(lng)) return;

            try {
                var marker = L.circleMarker([lat, lng], {
                    radius: 10,
                    fillColor: '#60a5fa',
                    color: '#ffffff',
                    weight: 3,
                    opacity: 1,
                    fillOpacity: 0.9
                });

                marker.bindPopup(
                    '<div style="text-align:center;padding:4px 0">' +
                    '<div style="font-size:22px;line-height:1">🔵</div>' +
                    '<div style="font-weight:900;color:#60a5fa;font-size:14px;margin-top:4px">' +
                        escapeHtml(loc.name || loc.username || 'مستخدم') +
                    '</div>' +
                    (loc.roleLabel ? '<div style="color:#f7d774;font-size:11px;font-weight:700;margin-top:2px">' + escapeHtml(loc.roleLabel) + '</div>' : '') +
                    (loc.region ? '<div style="color:rgba(255,255,255,0.5);font-size:11px;margin-top:2px">📍 ' + escapeHtml(loc.region) + '</div>' : '') +
                    '<div style="color:rgba(255,255,255,0.4);font-size:10px;font-family:monospace;margin-top:6px">' +
                        lat.toFixed(5) + ', ' + lng.toFixed(5) +
                    '</div>' +
                    '<div style="color:rgba(255,255,255,0.3);font-size:10px;margin-top:2px">' +
                        formatTimeAgo(loc.timestamp) +
                    '</div>' +
                    '</div>'
                );

                marker.addTo(map);
                userMarkers.set(String(loc.userId || loc.id), marker);
                points.push([lat, lng]);
                rendered++;
            } catch(e) {
                console.warn('⚠️ marker error:', e.message);
            }
        });

        console.log('✅ Rendered', rendered, 'other markers');

        // Fit bounds on first load
        if (!firstFitDone && (rendered > 0 || myLocation)) {
            try {
                var allPoints = [];
                if (myLocation) allPoints.push([myLocation.latitude, myLocation.longitude]);
                points.forEach(function(p) { allPoints.push(p); });
                if (allPoints.length > 1) {
                    map.fitBounds(allPoints, { padding: [80, 80], maxZoom: 13 });
                } else if (allPoints.length === 1) {
                    map.setView(allPoints[0], 13);
                }
                firstFitDone = true;
            } catch(e) {}
        }
    }

    // ============================================================
    // LOAD DATA
    // ============================================================
    function loadUsers() {
        if (_isDestroyed) return;
        Promise.all([
            fetchJSON('/api/monitoring/users').catch(function() { return { users: [] }; }),
            fetchJSON('/api/locations').catch(function() { return { locations: [] }; })
        ])
        .then(function(results) {
            if (_isDestroyed) return;
            var usersData = results[0] || {};
            var locsData = results[1] || {};

            users = Array.isArray(usersData) ? usersData : (usersData.users || []);
            locations = locsData.locations || [];

            var el1 = document.getElementById('statUsers');
            if (el1) el1.textContent = users.length;
            var el2 = document.getElementById('statLocations');
            if (el2) el2.textContent = locations.length;
            var el3 = document.getElementById('usersCount');
            if (el3) el3.textContent = users.length;

            renderUsersList();
            addMarkers(locations, users);
        })
        .catch(function(err) {
            console.warn('[MONITORING] error:', err.message);
        });
    }

    function loadSessions() {
        if (_isDestroyed) return;
        fetchJSON('/api/monitoring/sessions')
            .then(function(data) {
                if (_isDestroyed) return;
                sessions = (data && data.sessions) || [];
                var el1 = document.getElementById('statSessions');
                if (el1) el1.textContent = sessions.length;
                var el2 = document.getElementById('sessionsCount');
                if (el2) el2.textContent = sessions.length;
                renderSessionsList();
            })
            .catch(function(err) {
                console.warn('[MONITORING] sessions error:', err.message);
            });
    }

    // ============================================================
    // RENDER USERS LIST
    // ============================================================
    function renderUsersList() {
        var el = document.getElementById('usersList');
        if (!el) return;

        if (!users.length) {
            el.innerHTML = '<div class="empty-state"><i class="fas fa-users-slash"></i><p>لا يوجد مستخدمون</p></div>';
            return;
        }

        var locByUser = {};
        locations.forEach(function(l) {
            var key = String(l.userId);
            if (!locByUser[key] || new Date(l.timestamp) > new Date(locByUser[key].timestamp)) {
                locByUser[key] = l;
            }
        });

        // Sort: me first, then with location, then others
        var sorted = users.slice().sort(function(a, b) {
            var aId = String(a.id || a._id);
            var bId = String(b.id || b._id);
            var aMe = aId === String(myId);
            var bMe = bId === String(myId);
            if (aMe && !bMe) return -1;
            if (!aMe && bMe) return 1;
            var aLoc = !!locByUser[aId];
            var bLoc = !!locByUser[bId];
            if (aLoc && !bLoc) return -1;
            if (!aLoc && bLoc) return 1;
            return 0;
        });

        var html = '';
        sorted.forEach(function(u) {
            var uid = String(u.id || u._id || '');
            var loc = locByUser[uid];
            var isMe = String(myId) === uid;
            var hasLoc = !!loc;

            var cls = 'user-card';
            if (isMe) cls += ' me';
            if (!hasLoc && !isMe) cls += ' offline';

            var icon = isMe ? '🟡' : (hasLoc ? '🟢' : '⚪');
            var dotCls = hasLoc ? 'online' : 'offline';

            html +=
                '<div class="' + cls + '" data-user-id="' + escapeHtml(uid) + '">' +
                    '<div class="card-top">' +
                        '<div class="user-name">' +
                            '<span class="icon">' + icon + '</span>' +
                            '<span>' + escapeHtml(u.name || u.username || 'مستخدم') + '</span>' +
                            (isMe ? ' <span style="color:#f7d774;font-size:10px;font-weight:700">(أنت)</span>' : '') +
                        '</div>' +
                        '<span class="status-dot ' + dotCls + '"></span>' +
                    '</div>' +
                    '<div class="user-meta">' +
                        (u.roleLabel ? '<span class="tag role">' + escapeHtml(u.roleLabel) + '</span>' : '') +
                        (u.region ? '<span class="tag region">📍 ' + escapeHtml(u.region) + '</span>' : '') +
                        (hasLoc ? '<span class="tag time">🕐 ' + formatTimeAgo(loc.timestamp) + '</span>' : '<span class="tag time">لا يوجد موقع</span>') +
                    '</div>' +
                    (hasLoc ? '<div class="coords">' +
                        '<i class="fas fa-map-pin"></i>' +
                        Number(loc.latitude).toFixed(4) + ', ' + Number(loc.longitude).toFixed(4) +
                    '</div>' : '') +
                '</div>';
        });

        el.innerHTML = html;

        el.querySelectorAll('.user-card').forEach(function(item) {
            var handler = function() {
                var uid = this.getAttribute('data-user-id');
                if (String(uid) === String(myId) && myLocation && map) {
                    map.flyTo([myLocation.latitude, myLocation.longitude], 15, { duration: 1.2 });
                    if (myMarker) {
                        setTimeout(function() { myMarker.openPopup(); }, 400);
                    }
                } else if (userMarkers.has(uid) && map) {
                    var m = userMarkers.get(uid);
                    var ll = m.getLatLng();
                    map.flyTo(ll, 15, { duration: 1.2 });
                    setTimeout(function() { m.openPopup(); }, 400);
                }
                // Close panel on mobile
                if (window.innerWidth < 768) {
                    document.getElementById('sidePanel').classList.remove('open');
                }
            };
            item.addEventListener('click', handler);
            _listeners.push({ el: item, type: 'click', fn: handler });
        });
    }

    // ============================================================
    // RENDER SESSIONS LIST
    // ============================================================
    function renderSessionsList() {
        var el = document.getElementById('sessionsList');
        if (!el) return;

        if (!sessions.length) {
            el.innerHTML = '<div class="empty-state"><i class="fas fa-key"></i><p>لا توجد جلسات</p></div>';
            return;
        }

        var html = '';
        sessions.slice(0, 20).forEach(function(s) {
            var active = s.expiresAt && s.expiresAt > Date.now();
            html +=
                '<div class="user-card ' + (active ? '' : 'offline') + '">' +
                    '<div class="card-top">' +
                        '<div class="user-name">🔑 ' + escapeHtml(s.name || s.username || 'مستخدم') + '</div>' +
                        '<span class="status-dot ' + (active ? 'online' : 'offline') + '"></span>' +
                    '</div>' +
                    '<div class="user-meta">' +
                        (s.role ? '<span class="tag role">' + escapeHtml(s.role) + '</span>' : '') +
                        '<span class="tag time">' + (active ? '🟢 نشطة' : '⚪ منتهية') + '</span>' +
                        '<span class="tag time">بدأت ' + formatTimeAgo(s.createdAt) + '</span>' +
                    '</div>' +
                '</div>';
        });
        el.innerHTML = html;
    }

    // ============================================================
    // REFRESH ALL
    // ============================================================
    function refreshAll() {
        if (_isDestroyed) return;
        loadUsers();
        loadSessions();
        var el = document.getElementById('lastUpdate');
        if (el) el.textContent = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    }

    // ============================================================
    // LOCATE ME
    // ============================================================
    function locateMe() {
        if (myLocation && map) {
            map.flyTo([myLocation.latitude, myLocation.longitude], 16, { duration: 1.5 });
            if (myMarker) setTimeout(function() { myMarker.openPopup(); }, 500);
        } else {
            if (!navigator.geolocation) {
                alert('المتصفح لا يدعم تحديد الموقع');
                return;
            }
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    myLocation = pos.coords;
                    updateMyMarker(pos.coords);
                    sendLocationToServer(pos.coords);
                    if (map) map.flyTo([pos.coords.latitude, pos.coords.longitude], 16, { duration: 1.5 });
                },
                function(err) { alert('تعذّر تحديد الموقع: ' + err.message); },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }
    }

    // ============================================================
    // INIT
    // ============================================================
    function init() {
        if (_isDestroyed) return;
        console.log('🚀 Initializing v13.0...');

        var me = readMyUser();
        myId = me ? String(me.id || me._id || '') : null;
        console.log('👤 My ID:', myId);

        initMap();
        startGeolocation();

        // UI Events
        var toggleBtn = document.getElementById('togglePanelBtn');
        if (toggleBtn) {
            var tHandler = function() {
                document.getElementById('sidePanel').classList.toggle('open');
            };
            toggleBtn.addEventListener('click', tHandler);
            _listeners.push({ el: toggleBtn, type: 'click', fn: tHandler });
        }

        var closeBtn = document.getElementById('closePanelBtn');
        if (closeBtn) {
            var cHandler = function() {
                document.getElementById('sidePanel').classList.remove('open');
            };
            closeBtn.addEventListener('click', cHandler);
            _listeners.push({ el: closeBtn, type: 'click', fn: cHandler });
        }

        var locateBtn = document.getElementById('locateMeBtn');
        if (locateBtn) {
            var lHandler = locateMe;
            locateBtn.addEventListener('click', lHandler);
            _listeners.push({ el: locateBtn, type: 'click', fn: lHandler });
        }

        var refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) {
            var rHandler = function() {
                refreshBtn.classList.add('spinning');
                refreshAll();
                _timeouts.push(setTimeout(function() {
                    refreshBtn.classList.remove('spinning');
                }, 800));
            };
            refreshBtn.addEventListener('click', rHandler);
            _listeners.push({ el: refreshBtn, type: 'click', fn: rHandler });
        }

        // Hide loading
        _timeouts.push(setTimeout(function() {
            var ld = document.getElementById('loadingScreen');
            if (ld) ld.classList.add('hidden');
        }, 600));

        // First load
        refreshAll();

        // Auto refresh every 10s
        _intervals.push(setInterval(refreshAll, 10000));

        console.log('✅ Monitoring v13.0 ready');
    }

    // ============================================================
    // BOOT
    // ============================================================
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            _timeouts.push(setTimeout(init, 100));
        });
    } else {
        _timeouts.push(setTimeout(init, 100));
    }

    window.monitoringDebug = {
        refresh: refreshAll,
        getUsers: function() { return users; },
        getLocations: function() { return locations; },
        getSessions: function() { return sessions; }
    };

    console.log('✅ monitoring.html v13.0 ready');

})();
</script>
