<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الوسائل البرية - الحرس البحري</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/print.css">
</head>
<body>

<div id="page-vehicles">
<style>
    /* ============================================================
       🚛 VEHICLES PAGE v7.0 — Screen Styles
       الطباعة تُدار مركزياً من /css/print.css
       ============================================================ */
    #page-vehicles {
        width: 100%; padding: 0; margin: 0;
        min-height: 100vh;
        font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
        background: transparent; color: #e8edf5;
        position: relative; z-index: 1;
    }
    #page-vehicles *, #page-vehicles *::before, #page-vehicles *::after { box-sizing: border-box; }
    .veh-container { padding: 20px; max-width: 1600px; margin: 0 auto; }

    /* ===== HEADER ===== */
    .veh-header {
        background: linear-gradient(135deg, rgba(96,165,250,0.08), rgba(247,215,116,0.05));
        border-radius: 20px; padding: 24px 28px;
        border: 1px solid rgba(255,255,255,0.06);
        margin-bottom: 24px;
        display: flex; justify-content: space-between; align-items: center;
        flex-wrap: wrap; gap: 16px;
        position: relative; overflow: hidden;
    }
    .veh-header::before {
        content: ''; position: absolute;
        top: -50%; right: -50%; width: 100%; height: 100%;
        background: radial-gradient(circle, rgba(247,215,116,0.04) 0%, transparent 70%);
        pointer-events: none;
    }
    .veh-header .title-section { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
    .veh-header .title-icon {
        width: 56px; height: 56px;
        background: linear-gradient(135deg, rgba(247,215,116,0.2), rgba(247,215,116,0.05));
        border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        font-size: 28px;
        border: 1px solid rgba(247,215,116,0.2);
        flex-shrink: 0;
    }
    .veh-header .title { font-size: 22px; font-weight: 900; color: #f7d774; line-height: 1.2; }
    .veh-header .subtitle { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; }
    .veh-header h2 { font-size: 22px; font-weight: 900; color: #f7d774; line-height: 1.2; margin: 0; }
    .veh-header p { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; }
    .veh-header .header-actions { display: flex; gap: 10px; position: relative; z-index: 1; flex-wrap: wrap; }

    /* ===== STATS ===== */
    .veh-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px; margin-bottom: 24px;
    }
    .veh-stat {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 14px; padding: 16px;
        text-align: center; transition: all 0.3s;
    }
    .veh-stat:hover { background: rgba(255,255,255,0.04); transform: translateY(-2px); border-color: rgba(247,215,116,0.15); }
    .veh-stat .number { font-size: 26px; font-weight: 900; color: #f7d774; line-height: 1; }
    .veh-stat .label { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 6px; font-weight: 600; }
    .veh-stat.stat-valid .number { color: #4ade80; }
    .veh-stat.stat-broken .number { color: #f87171; }
    .veh-stat.stat-maint .number { color: #fbbf24; }

    /* ===== ACTIONS ===== */
    .veh-actions {
        display: flex; gap: 12px; margin-bottom: 20px;
        flex-wrap: wrap; align-items: center;
    }
    .veh-btn {
        padding: 12px 22px; border: none;
        border-radius: 12px; font-family: inherit;
        font-size: 13px; font-weight: 700;
        cursor: pointer;
        display: inline-flex; align-items: center; gap: 8px;
        transition: all 0.25s; white-space: nowrap;
    }
    .veh-btn-primary { background: linear-gradient(135deg, #f7d774, #e6b31e); color: #0a0e1a; }
    .veh-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(247,215,116,0.3); }
    .veh-btn-secondary { background: rgba(255,255,255,0.05); color: #e8edf5; border: 1px solid rgba(255,255,255,0.08); }
    .veh-btn-secondary:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
    .veh-btn-info { background: linear-gradient(135deg, #60a5fa, #3b82f6); color: white; }
    .veh-btn-info:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(96,165,250,0.3); }
    .veh-btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }
    .veh-btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(34,197,94,0.3); }
    .veh-btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
    .veh-btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(239,68,68,0.3); }

    .veh-input, .veh-select {
        padding: 12px 16px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        color: #e8edf5; font-family: inherit;
        font-size: 13px; transition: all 0.2s;
    }
    .veh-input { flex: 1; min-width: 180px; }
    .veh-input:focus, .veh-select:focus { outline: none; border-color: rgba(247,215,116,0.4); background: rgba(255,255,255,0.05); }
    .veh-select option, .veh-select optgroup { background: #1a1f2e; color: #e8edf5; }

    .veh-auto-toggle {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 16px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px; cursor: pointer;
        font-size: 12px; font-weight: 700;
        color: rgba(255,255,255,0.5);
        transition: all 0.2s; user-select: none;
    }
    .veh-auto-toggle:hover { background: rgba(255,255,255,0.06); color: #e8edf5; }
    .veh-auto-toggle input { display: none; }
    .veh-auto-toggle .toggle-dot {
        width: 32px; height: 18px;
        background: rgba(255,255,255,0.15);
        border-radius: 10px; position: relative;
        transition: all 0.25s;
    }
    .veh-auto-toggle .toggle-dot::before {
        content: ''; position: absolute;
        top: 2px; right: 2px;
        width: 14px; height: 14px;
        background: #fff; border-radius: 50%;
        transition: all 0.25s;
    }
    .veh-auto-toggle input:checked ~ .toggle-dot { background: #4ade80; }
    .veh-auto-toggle input:checked ~ .toggle-dot::before { right: calc(100% - 16px); }
    .veh-auto-toggle input:checked ~ .toggle-label { color: #4ade80; }

    /* ===== TABLE ===== */
    .veh-table-wrap {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 16px;
        overflow: hidden; overflow-x: auto;
    }
    .veh-table-head, .veh-table-row {
        display: grid;
        grid-template-columns: 50px 110px 190px 150px 1fr 130px 100px 110px 120px 130px 1fr 100px;
        gap: 8px; padding: 14px 20px;
        align-items: center; font-size: 13px;
        min-width: 1750px;
    }
    .veh-table-head {
        background: rgba(247,215,116,0.05);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        font-size: 12px; font-weight: 800;
        color: #f7d774;
    }
    .veh-table-row {
        border-bottom: 1px solid rgba(255,255,255,0.04);
        transition: background 0.2s;
    }
    .veh-table-row:hover { background: rgba(255,255,255,0.03); }
    .veh-table-row:last-child { border-bottom: none; }

    .veh-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .veh-cell.center { text-align: center; }

    .veh-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 8px;
        font-size: 11px; font-weight: 700;
    }
    .veh-badge.type { background: rgba(96,165,250,0.15); color: #60a5fa; }
    .veh-badge.brand { background: rgba(247,215,116,0.15); color: #f7d774; font-size: 11px; }
    .veh-badge.model { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); font-size: 10px; }
    .veh-badge.year { background: rgba(34,197,94,0.1); color: #4ade80; font-size: 10px; }
    .veh-badge.region { background: rgba(247,215,116,0.15); color: #f7d774; font-size: 10px; }
    .veh-badge.zone { background: rgba(74,222,128,0.15); color: #4ade80; font-size: 10px; }
    .veh-badge.status-صالحة { background: rgba(74,222,128,0.15); color: #4ade80; }
    .veh-badge.status-معطبة { background: rgba(248,113,113,0.15); color: #f87171; }
    .veh-badge.status-صيانة { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .veh-badge.cond-جديدة { background: rgba(96,165,250,0.15); color: #60a5fa; }
    .veh-badge.cond-متوسطة { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .veh-badge.cond-قديمة { background: rgba(148,163,184,0.15); color: #94a3b8; }

    .veh-plate {
        font-family: 'Courier New', monospace;
        font-weight: 900; color: #f7d774;
        letter-spacing: 1px;
        background: rgba(247,215,116,0.1);
        padding: 3px 10px; border-radius: 6px;
        display: inline-block; font-size: 12px;
    }

    .veh-action-btn {
        width: 32px; height: 32px;
        border: none; border-radius: 8px;
        cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 13px; transition: all 0.2s;
        margin: 0 2px;
    }
    .veh-action-btn.edit { background: rgba(96,165,250,0.15); color: #60a5fa; }
    .veh-action-btn.edit:hover { background: rgba(96,165,250,0.3); transform: scale(1.1); }
    .veh-action-btn.delete { background: rgba(248,113,113,0.15); color: #f87171; }
    .veh-action-btn.delete:hover { background: rgba(248,113,113,0.3); transform: scale(1.1); }

    .veh-empty { padding: 60px 20px; text-align: center; color: rgba(255,255,255,0.3); }
    .veh-empty i { font-size: 48px; margin-bottom: 16px; opacity: 0.4; color: #f7d774; }
    .veh-empty p { font-size: 14px; }

    /* ===== MODAL ===== */
    .veh-modal {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
        z-index: 99999;
        display: none; align-items: center; justify-content: center;
        padding: 20px;
    }
    .veh-modal.active { display: flex; }
    .veh-modal-box {
        background: linear-gradient(135deg, #1a1f2e, #0f1420);
        border: 1px solid rgba(247,215,116,0.2);
        border-radius: 20px; padding: 28px;
        width: 100%; max-width: 650px;
        max-height: 90vh; overflow-y: auto;
        box-shadow: 0 24px 64px rgba(0,0,0,0.8);
    }
    .veh-modal-head {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 20px; padding-bottom: 14px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .veh-modal-head h3 {
        font-size: 18px; font-weight: 900; color: #f7d774;
        display: flex; align-items: center; gap: 10px; margin: 0;
    }
    .veh-modal-close {
        background: rgba(255,255,255,0.05);
        border: none; color: rgba(255,255,255,0.6);
        width: 36px; height: 36px;
        border-radius: 10px; cursor: pointer;
        font-size: 18px;
        display: flex; align-items: center; justify-content: center;
    }
    .veh-modal-close:hover { background: rgba(248,113,113,0.2); color: #f87171; }

    .veh-form-group { margin-bottom: 16px; }
    .veh-form-group label {
        display: block; font-size: 12px; font-weight: 700;
        color: rgba(255,255,255,0.5);
        margin-bottom: 6px;
    }
    .veh-form-group label .req { color: #f87171; }
    .veh-form-control {
        width: 100%; padding: 12px 14px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        color: #e8edf5; font-family: inherit;
        font-size: 13px;
    }
    .veh-form-control:focus { outline: none; border-color: rgba(247,215,116,0.4); background: rgba(255,255,255,0.05); }
    .veh-form-control:disabled { opacity: 0.5; cursor: not-allowed; }
    .veh-form-control option, .veh-form-control optgroup { background: #1a1f2e; color: #e8edf5; }
    textarea.veh-form-control { resize: vertical; min-height: 70px; }

    .veh-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .veh-modal-actions { display: flex; gap: 12px; margin-top: 24px; }
    .veh-modal-actions .veh-btn { flex: 1; justify-content: center; padding: 14px; }

    /* ===== TOAST ===== */
    .veh-toast {
        position: fixed; bottom: 24px; left: 24px;
        z-index: 999999; max-width: 360px;
        display: flex; align-items: center; gap: 10px;
        padding: 14px 20px; border-radius: 12px;
        color: #fff; font-family: 'Cairo', sans-serif;
        font-size: 13px; font-weight: 700;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        animation: vehToastIn 0.25s ease-out;
        direction: rtl;
    }
    .veh-toast.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); }
    .veh-toast.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); }
    .veh-toast.info { background: rgba(96,165,250,0.15); border: 1px solid rgba(96,165,250,0.3); }

    @keyframes vehToastIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 992px) {
        .veh-header { flex-direction: column; text-align: center; }
        .veh-header .header-actions { width: 100%; justify-content: center; }
    }
    @media (max-width: 600px) {
        .veh-container { padding: 12px; }
        .veh-header { padding: 18px; }
        .veh-header h2 { font-size: 18px; }
        .veh-stats { grid-template-columns: repeat(2, 1fr); }
        .veh-form-row { grid-template-columns: 1fr; }
        .veh-actions { flex-direction: column; }
        .veh-input, .veh-select, .veh-btn { width: 100%; }
    }
</style>

<div class="veh-container">

    <!-- ===== HEADER ===== -->
    <div class="veh-header fleet-header">
        <div class="title-section fleet-header-left">
            <div class="title-icon">🚛</div>
            <div>
                <h2>الوسائل البرية - الحرس البحري</h2>
                <p>إدارة السيارات والآليات البرية</p>
            </div>
        </div>
        <div class="header-actions fleet-header-actions">
            <button class="veh-btn veh-btn-success" id="vehExcelBtn">
                <i class="fas fa-file-excel"></i> تصدير Excel
            </button>
            <button class="veh-btn veh-btn-info" id="vehPrintBtn">
                <i class="fas fa-print"></i> طباعة
            </button>
            <button class="veh-btn veh-btn-secondary" id="vehRefreshBtn" title="تحديث">
                <i class="fas fa-rotate"></i> تحديث
            </button>
        </div>
    </div>

    <!-- ===== STATS ===== -->
    <div class="veh-stats stats-grid">
        <div class="veh-stat stat-card">
            <div class="number" id="vehStatTotal">0</div>
            <div class="label">📊 المجموع</div>
        </div>
        <div class="veh-stat stat-card stat-valid">
            <div class="number" id="vehStatValid">0</div>
            <div class="label">✅ صالحة</div>
        </div>
        <div class="veh-stat stat-card stat-broken">
            <div class="number" id="vehStatBroken">0</div>
            <div class="label">🔴 معطبة</div>
        </div>
        <div class="veh-stat stat-card stat-maint">
            <div class="number" id="vehStatMaint">0</div>
            <div class="label">🔧 صيانة</div>
        </div>
    </div>

    <!-- ===== ACTIONS ===== -->
    <div class="veh-actions">
        <button class="veh-btn veh-btn-primary" id="vehAddBtn">
            <i class="fas fa-plus"></i> إضافة وسيلة
        </button>

        <input type="text" class="veh-input" id="vehSearch" placeholder="🔍 ابحث برقم الوسيلة أو الماركة...">

        <select class="veh-select" id="vehFilterRegion">
            <option value="all">كل الإدارات والأقاليم</option>
            <optgroup label="🏛️ الإدارات المركزية">
                <option value="إدارة إسناد الوحدات البحرية">🏛️ إسناد الوحدات</option>
                <option value="إدارة حرس السواحل">🚢 حرس السواحل</option>
            </optgroup>
            <optgroup label="🌊 الأقاليم البحرية">
                <option value="إقليم الحرس البحري بالشمال">🌊 الشمال</option>
                <option value="إقليم الحرس البحري بالساحل">🌊 الساحل</option>
                <option value="إقليم الحرس البحري بالوسط">🌊 الوسط</option>
                <option value="إقليم الحرس البحري بالجنوب">🌊 الجنوب</option>
            </optgroup>
            <optgroup label="🛠️ وحدات الصيانة">
                <option value="وحدة الصيانة والإسناد البحري تونس">🛠️ صيانة تونس</option>
                <option value="وحدة الصيانة والإسناد البحري صفاقس">🛠️ صيانة صفاقس</option>
                <option value="وحدة الصيانة والإسناد البحري المنستير">🛠️ صيانة المنستير</option>
                <option value="وحدة الصيانة والإسناد البحري جرجيس">🛠️ صيانة جرجيس</option>
            </optgroup>
            <optgroup label="🏛️ أخرى">
                <option value="المجمع الأمني بقبيبة">🏛️ بقبيبة</option>
            </optgroup>
        </select>

        <select class="veh-select" id="vehFilterZone">
            <option value="all">كل المناطق</option>
        </select>

        <select class="veh-select" id="vehFilterBrand">
            <option value="all">كل الماركات</option>
        </select>

        <select class="veh-select" id="vehFilterStatus">
            <option value="all">كل الحالات</option>
            <option value="صالحة">✅ صالحة</option>
            <option value="معطبة">🔴 معطبة</option>
            <option value="صيانة">🔧 صيانة</option>
        </select>

        <select class="veh-select" id="vehFilterType">
            <option value="all">كل الأنواع</option>
            <option value="سيارة">🚗 سيارة</option>
            <option value="كواد">🛺 كواد</option>
            <option value="شاحنة">🚚 شاحنة</option>
            <option value="شاحنة صهريج">🚛 شاحنة صهريج</option>
            <option value="حافلة">🚌 حافلة</option>
            <option value="بيك أب">🛻 بيك أب</option>
            <option value="فان">🚐 فان</option>
            <option value="جيب">🚙 جيب</option>
            <option value="دراجة">🏍️ دراجة</option>
            <option value="مدرعة">🛡️ مدرعة</option>
            <option value="إسعاف">🚑 إسعاف</option>
            <option value="إطفاء">🚒 إطفاء</option>
            <option value="رافعة">🏗️ رافعة</option>
            <option value="جرافة">🚜 جرافة</option>
            <option value="أخرى">⚙️ أخرى</option>
        </select>

        <label class="veh-auto-toggle" title="تحديث تلقائي كل 30 ثانية">
            <input type="checkbox" id="vehAutoRefresh">
            <span class="toggle-dot"></span>
            <span class="toggle-label">تحديث تلقائي</span>
        </label>
    </div>

    <!-- ===== TABLE ===== -->
    <div class="veh-table-wrap">
        <div class="veh-table-head">
            <div class="veh-cell center">#</div>
            <div class="veh-cell center">النوع</div>
            <div class="veh-cell">الماركة / الطراز</div>
            <div class="veh-cell">رقم الوسيلة</div>
            <div class="veh-cell">الإدارة / الإقليم</div>
            <div class="veh-cell">المنطقة</div>
            <div class="veh-cell center">الحالة</div>
            <div class="veh-cell center">حالة العمل</div>
            <div class="veh-cell center">تاريخ التعيين</div>
            <div class="veh-cell center">⚠️ تاريخ العطب</div>
            <div class="veh-cell">ملاحظات</div>
            <div class="veh-cell center">إجراءات</div>
        </div>
        <div id="vehTableBody">
            <div class="veh-empty">
                <i class="fas fa-spinner fa-spin"></i>
                <p>جاري التحميل...</p>
            </div>
        </div>
    </div>

</div>

<!-- ===== MODAL ===== -->
<div class="veh-modal" id="vehModal">
    <div class="veh-modal-box">
        <div class="veh-modal-head">
            <h3><i class="fas fa-truck"></i> <span id="vehModalTitle">إضافة وسيلة برية</span></h3>
            <button class="veh-modal-close" id="vehModalClose">×</button>
        </div>

        <form id="vehForm" autocomplete="off">
            <input type="hidden" id="vehId">

            <div class="veh-form-row">

                    <i class="fas fa-save"></i> حفظ

<script>
/* ============================================================
   🚛 VEHICLES v7.0 — Logic
   ============================================================ */
(function() {
    'use strict';

    const API_BASE = '/api/vehicles';
    const STORAGE_KEY = 'veh_cache_v7';

    const state = {
        vehicles: [],
        filtered: [],
        autoTimer: null,
        editingId: null
    };

    /* ===== Helpers ===== */
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));

    function toast(msg, type = 'info') {
        const t = document.createElement('div');
        t.className = `veh-toast ${type}`;
        const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
        t.innerHTML = `<span>${icon}</span><span>${esc(msg)}</span>`;
        document.body.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 2600);
        setTimeout(() => t.remove(), 3000);
    }

    function fmtDate(d) {
        if (!d) return '—';
        try { return new Date(d).toLocaleDateString('fr-TN'); } catch { return d; }
    }

    /* ===== Load / Save ===== */
    async function loadVehicles() {
        try {
            const r = await fetch(API_BASE, { credentials: 'same-origin' });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const data = await r.json();
            state.vehicles = Array.isArray(data) ? data : (data.vehicles || data.data || []);
        } catch (e) {
            // fallback local
            try {
                const cached = localStorage.getItem(STORAGE_KEY);
                state.vehicles = cached ? JSON.parse(cached) : [];
            } catch { state.vehicles = []; }
        }
        render();
    }

    async function persist() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state.vehicles));
        } catch {}
    }

    /* ===== Filters ===== */
    function applyFilters() {
        const q = $('#vehSearch').value.trim().toLowerCase();
        const region = $('#vehFilterRegion').value;
        const zone = $('#vehFilterZone').value;
        const brand = $('#vehFilterBrand').value;
        const status = $('#vehFilterStatus').value;
        const type = $('#vehFilterType').value;

        state.filtered = state.vehicles.filter(v => {
            if (q) {
                const hay = [v.plate, v.brand, v.model, v.zone, v.region].join(' ').toLowerCase();
                if (!hay.includes(q)) return false;
            }
            if (region !== 'all' && v.region !== region) return false;
            if (zone !== 'all' && v.zone !== zone) return false;
            if (brand !== 'all' && v.brand !== brand) return false;
            if (status !== 'all' && v.status !== status) return false;
            if (type !== 'all' && v.type !== type) return false;
            return true;
        });
        renderTable();
        renderStats();
    }

    function rebuildFilterOptions() {
        const zones = [...new Set(state.vehicles.map(v => v.zone).filter(Boolean))].sort();
        const brands = [...new Set(state.vehicles.map(v => v.brand).filter(Boolean))].sort();

        const zSel = $('#vehFilterZone');
        const zCur = zSel.value;
        zSel.innerHTML = '<option value="all">كل المناطق</option>' +
            zones.map(z => `<option value="${esc(z)}">${esc(z)}</option>`).join('');
        if ([...zSel.options].some(o => o.value === zCur)) zSel.value = zCur;

        const bSel = $('#vehFilterBrand');
        const bCur = bSel.value;
        bSel.innerHTML = '<option value="all">كل الماركات</option>' +
            brands.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('');
        if ([...bSel.options].some(o => o.value === bCur)) bSel.value = bCur;

        // datalist models
        const models = [...new Set(state.vehicles.map(v => v.model).filter(Boolean))];
        $('#vehModelsList').innerHTML = models.map(m => `<option value="${esc(m)}">`).join('');
    }

    /* ===== Render ===== */
    function renderStats() {
        const list = state.filtered.length ? state.filtered : state.vehicles;
        const total = state.vehicles.length;
        const valid = state.vehicles.filter(v => v.status === 'صالحة').length;
        const broken = state.vehicles.filter(v => v.status === 'معطبة').length;
        const maint = state.vehicles.filter(v => v.status === 'صيانة').length;
        $('#vehStatTotal').textContent = total;
        $('#vehStatValid').textContent = valid;
        $('#vehStatBroken').textContent = broken;
        $('#vehStatMaint').textContent = maint;
    }

    function renderTable() {
        const body = $('#vehTableBody');
        if (!state.filtered.length) {
            body.innerHTML = `<div class="veh-empty">
                <i class="fas fa-inbox"></i>
                <p>لا توجد وسائل مطابقة</p>
            </div>`;
            return;
        }

        body.innerHTML = state.filtered.map((v, i) => `
            <div class="veh-table-row" data-id="${esc(v.id)}">
                <div class="veh-cell center">${i + 1}</div>
                <div class="veh-cell center"><span class="veh-badge type">${esc(v.type || '—')}</span></div>
                <div class="veh-cell">
                    <span class="veh-badge brand">${esc(v.brand || '—')}</span>
                    ${v.model ? `<span class="veh-badge model">${esc(v.model)}</span>` : ''}
                    ${v.year ? `<span class="veh-badge year">${esc(v.year)}</span>` : ''}
                </div>
                <div class="veh-cell"><span class="veh-plate">${esc(v.plate || '—')}</span></div>
                <div class="veh-cell"><span class="veh-badge region">${esc(v.region || '—')}</span></div>
                <div class="veh-cell">${v.zone ? `<span class="veh-badge zone">${esc(v.zone)}</span>` : '—'}</div>
                <div class="veh-cell center"><span class="veh-badge status-${esc(v.status)}">${esc(v.status || '—')}</span></div>
                <div class="veh-cell center">${v.condition ? `<span class="veh-badge cond-${esc(v.condition)}">${esc(v.condition)}</span>` : '—'}</div>
                <div class="veh-cell center">${fmtDate(v.assignDate)}</div>
                <div class="veh-cell center">${v.breakDate ? `<span style="color:#f87171">${fmtDate(v.breakDate)}</span>` : '—'}</div>
                <div class="veh-cell" title="${esc(v.notes)}">${esc(v.notes) || '—'}</div>
                <div class="veh-cell center">
                    <button class="veh-action-btn edit" data-act="edit" data-id="${esc(v.id)}" title="تعديل"><i class="fas fa-pen"></i></button>
                    <button class="veh-action-btn delete" data-act="del" data-id="${esc(v.id)}" title="حذف"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        `).join('');
    }

    function render() {
        rebuildFilterOptions();
        applyFilters();
    }

    /* ===== Modal ===== */
    function openModal(v) {
        state.editingId = v ? v.id : null;
        $('#vehModalTitle').textContent = v ? 'تعديل وسيلة برية' : 'إضافة وسيلة برية';
        $('#vehId').value = v?.id || '';
        $('#vehType').value = v?.type || 'سيارة';
        $('#vehPlate').value = v?.plate || '';
        $('#vehBrand').value = v?.brand || '';
        $('#vehModel').value = v?.model || '';
        $('#vehYear').value = v?.year || '';
        $('#vehColor').value = v?.color || '';
        $('#vehRegion').value = v?.region || '';
        $('#vehZone').value = v?.zone || '';
        $('#vehStatus').value = v?.status || 'صالحة';
        $('#vehCondition').value = v?.condition || '';
        $('#vehAssignDate').value = v?.assignDate || '';
        $('#vehBreakDate').value = v?.breakDate || '';
        $('#vehNotes').value = v?.notes || '';
        $('#vehModal').classList.add('active');
    }
    function closeModal() {
        $('#vehModal').classList.remove('active');
        state.editingId = null;
        $('#vehForm').reset();
    }

    /* ===== Save ===== */
    async function saveVehicle(e) {
        e.preventDefault();
        const data = {
            id: $('#vehId').value || ('v_' + Date.now()),
            type: $('#vehType').value,
            plate: $('#vehPlate').value.trim(),
            brand: $('#vehBrand').value,
            model: $('#vehModel').value.trim(),
            year: $('#vehYear').value,
            color: $('#vehColor').value,
            region: $('#vehRegion').value,
            zone: $('#vehZone').value.trim(),
            status: $('#vehStatus').value,
            condition: $('#vehCondition').value,
            assignDate: $('#vehAssignDate').value,
            breakDate: $('#vehBreakDate').value,
            notes: $('#vehNotes').value.trim()
        };

        if (!data.plate) { toast('رقم الوسيلة مطلوب', 'error'); return; }
        if (!data.region) { toast('الإدارة / الإقليم مطلوب', 'error'); return; }

        try {
            const method = state.editingId ? 'PUT' : 'POST';
            const url = state.editingId ? `${API_BASE}/${state.editingId}` : API_BASE;
            const r = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify(data)
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const saved = await r.json().catch(() => data);
            if (state.editingId) {
                const idx = state.vehicles.findIndex(v => v.id === state.editingId);
                if (idx >= 0) state.vehicles[idx] = { ...state.vehicles[idx], ...data };
            } else {
                state.vehicles.push(saved.id ? saved : data);
            }
        } catch {
            // fallback local
            if (state.editingId) {
                const idx = state.vehicles.findIndex(v => v.id === state.editingId);
                if (idx >= 0) state.vehicles[idx] = { ...state.vehicles[idx], ...data };
            } else {
                state.vehicles.push(data);
            }
            persist();
        }

        toast(state.editingId ? 'تم التعديل بنجاح' : 'تمت الإضافة بنجاح', 'success');
        closeModal();
        render();
    }

    /* ===== Delete ===== */
    async function deleteVehicle(id) {
        if (!confirm('هل أنت متأكد من حذف هذه الوسيلة؟')) return;
        try {
            const r = await fetch(`${API_BASE}/${id}`, { method: 'DELETE', credentials: 'same-origin' });
            if (!r.ok) throw new Error('HTTP ' + r.status);
        } catch {}
        state.vehicles = state.vehicles.filter(v => v.id !== id);
        persist();
        toast('تم الحذف', 'success');
        render();
    }

    /* ===== Export Excel (CSV with BOM) ===== */
    function exportExcel() {
        const rows = state.filtered.length ? state.filtered : state.vehicles;
        if (!rows.length) { toast('لا توجد بيانات', 'error'); return; }
        const headers = ['#','النوع','الماركة','الطراز','السنة','اللون','رقم الوسيلة','الإدارة/الإقليم','المنطقة','الحالة','حالة العمل','تاريخ التعيين','تاريخ العطب','ملاحظات'];
        const lines = [headers.join(',')];
        rows.forEach((v, i) => {
            const row = [
                i+1, v.type, v.brand, v.model, v.year, v.color,
                v.plate, v.region, v.zone, v.status, v.condition,
                v.assignDate, v.breakDate, (v.notes || '').replace(/,/g,'؛')
            ].map(x => `"${String(x ?? '').replace(/"/g,'""')}"`).join(',');
            lines.push(row);
        });
        const csv = '\uFEFF' + lines.join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `vehicles_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
        toast('تم التصدير', 'success');
    }

    /* ===== Print ===== */
    function printPage() {
        window.print();
    }

    /* ===== Auto refresh ===== */
    function setAutoRefresh(on) {
        if (state.autoTimer) { clearInterval(state.autoTimer); state.autoTimer = null; }
        if (on) {
            state.autoTimer = setInterval(() => loadVehicles(), 30000);
            toast('تحديث تلقائي مُفعّل', 'info');
        } else {
            toast('تحديث تلقائي مُعطّل', 'info');
        }
    }

    /* ===== Events ===== */
    function bindEvents() {
        $('#vehAddBtn').addEventListener('click', () => openModal(null));
        $('#vehModalClose').addEventListener('click', closeModal);
        $('#vehCancelBtn').addEventListener('click', closeModal);
        $('#vehModal').addEventListener('click', (e) => { if (e.target.id === 'vehModal') closeModal(); });
        $('#vehForm').addEventListener('submit', saveVehicle);

        $('#vehTableBody').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-act]');
            if (!btn) return;
            const id = btn.dataset.id;
            if (btn.dataset.act === 'edit') {
                const v = state.vehicles.find(x => x.id === id);
                if (v) openModal(v);
            } else if (btn.dataset.act === 'del') {
                deleteVehicle(id);
            }
        });

        $('#vehSearch').addEventListener('input', applyFilters);
        ['vehFilterRegion','vehFilterZone','vehFilterBrand','vehFilterStatus','vehFilterType']
            .forEach(id => $('#'+id).addEventListener('change', applyFilters));

        $('#vehRefreshBtn').addEventListener('click', () => { loadVehicles(); toast('تم التحديث', 'info'); });
        $('#vehExcelBtn').addEventListener('click', exportExcel);
        $('#vehPrintBtn').addEventListener('click', printPage);

        $('#vehAutoRefresh').addEventListener('change', (e) => setAutoRefresh(e.target.checked));

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && $('#vehModal').classList.contains('active')) closeModal();
        });
    }

    /* ===== Init ===== */
    function init() {
        bindEvents();
        loadVehicles();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
