    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. TOKEN & HEADERS
            // ============================================================

            function getToken() {
                return localStorage.getItem('authToken') ||
                       localStorage.getItem('token') ||
                       localStorage.getItem('marine_token') ||
                       null;
            }

            function getAuthHeaders() {
                const token = getToken();
                return {
                    'Content-Type': 'application/json',
                    'Authorization': token ? 'Bearer ' + token : ''
                };
            }

            async function getCsrfToken() {
                try {
                    const r = await fetch('/api/csrf-token', {
                        credentials: 'include',
                        headers: { 'Accept': 'application/json' }
                    });
                    const d = await r.json();
                    return d.token;
                } catch(e) { return null; }
            }

            // ============================================================
            // 2. TOAST
            // ============================================================

            function showToast(message, type) {
                type = type || 'info';
                var container = document.getElementById('toastContainer');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'toastContainer';
                    container.className = 'toast-container';
                    document.body.appendChild(container);
                }

                var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
                var toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.innerHTML = '<span>' + icons[type] + '</span> ' + message + ' <button class="toast-close" onclick="this.parentElement.remove()">✕</button>';
                container.appendChild(toast);

                setTimeout(function() {
                    if (toast.parentElement) toast.remove();
                }, 5000);
            }

            // ============================================================
            // 3. STATE
            // ============================================================

            var allVessels = [];
            var filteredVessels = [];

            // ============================================================
            // 4. LOAD DATA FROM SERVER
            // ============================================================

            async function loadVessels() {
                var tbody = document.getElementById('tableBody');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="14" class="empty-state">
                            <div class="spinner"></div>
                            <h3>جاري التحميل...</h3>
                            <p>يرجى الانتظار</p>
                        </td>
                    </tr>
                `;

                try {
                    var token = getToken();
                    if (!token) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="14" class="empty-state">
                                    <span class="empty-icon"><i class="fas fa-exclamation-triangle"></i></span>
                                    <h3>يرجى تسجيل الدخول</h3>
                                    <p>يجب تسجيل الدخول لعرض سجل الصيانة</p>
                                    <a href="/" style="color:#f5d76e;text-decoration:underline;">⬅️ العودة للرئيسية</a>
                                </td>
                            </tr>
                        `;
                        return;
                    }

                    var csrfToken = await getCsrfToken();

                    // ✅ جلب جميع المراكب من السيرفر
                    var response = await fetch('/api/vessels', {
                        headers: {
                            'Authorization': 'Bearer ' + token,
                            'X-CSRF-Token': csrfToken || '',
                            'Accept': 'application/json'
                        },
                        credentials: 'include'
                    });

                    if (!response.ok) {
                        if (response.status === 401) {
                            localStorage.removeItem('authToken');
                            window.location.href = '/';
                            return;
                        }
                        throw new Error('فشل تحميل البيانات: ' + response.status);
                    }

                    var data = await response.json();
                    allVessels = data || [];
                    console.log('✅ Loaded ' + allVessels.length + ' vessels from server');

                    // ✅ تحديث الإحصائيات
                    updateStats();

                    // ✅ تطبيق الفلاتر
                    applyFilters();

                } catch (error) {
                    console.error('❌ Error loading vessels:', error);
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="14" class="empty-state">
                                <span class="empty-icon"><i class="fas fa-exclamation-triangle" style="color:#f87171;"></i></span>
                                <h3 style="color:#f87171;">خطأ في تحميل البيانات</h3>
                                <p style="color:rgba(255,255,255,0.3);">${error.message}</p>
                                <button class="retry-btn" onclick="loadVessels()">
                                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                                </button>
                            </td>
                        </tr>
                    `;
                    showToast('❌ ' + error.message, 'error');
                }
            }

            // ============================================================
            // 5. UPDATE STATS
            // ============================================================

            function updateStats() {
                var total = allVessels.length;
                var damaged = allVessels.filter(function(v) {
                    return v.status === 'معطب' || v.status === 'damaged';
                }).length;
                var maintenance = allVessels.filter(function(v) {
                    return v.status === 'صيانة' || v.status === 'maintenance';
                }).length;
                var repaired = allVessels.filter(function(v) {
                    return v.status === 'صالح' || v.status === 'ready';
                }).length;

                document.getElementById('totalCount').textContent = total;
                document.getElementById('damagedCount').textContent = damaged;
                document.getElementById('maintenanceCount').textContent = maintenance;
                document.getElementById('repairedCount').textContent = repaired;
            }

            // ============================================================
            // 6. APPLY FILTERS
            // ============================================================

            function applyFilters() {
                var search = document.getElementById('searchInput').value.toLowerCase().trim();
                var statusFilter = document.getElementById('statusFilter').value;
                var regionFilter = document.getElementById('regionFilter').value;

                filteredVessels = allVessels.filter(function(v) {
                    // ✅ بحث
                    if (search) {
                        var text = (v.name || '') + ' ' + (v.num || '') + ' ' + (v.zone || '') + ' ' + (v.region || '');
                        if (!text.toLowerCase().includes(search)) return false;
                    }

                    // ✅ فلتر الحالة
                    var statusMap = {
                        'معطب': ['معطب', 'damaged'],
                        'صيانة': ['صيانة', 'maintenance'],
                        'صالح': ['صالح', 'ready']
                    };
                    if (statusFilter !== 'الكل') {
                        var statusValues = statusMap[statusFilter] || [statusFilter];
                        if (!statusValues.some(function(s) { return v.status === s; })) return false;
                    }

                    // ✅ فلتر الإقليم
                    if (regionFilter !== 'الكل' && v.region !== regionFilter) return false;

                    return true;
                });

                renderTable();
            }

            // ============================================================
            // 7. RENDER TABLE
            // ============================================================

            function renderTable() {
                var tbody = document.getElementById('tableBody');

                if (filteredVessels.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="14" class="empty-state">
                                <span class="empty-icon"><i class="fas fa-search"></i></span>
                                <h3>لا توجد مراكب مطابقة</h3>
                                <p>حاول تغيير معايير البحث أو الفلترة</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                var html = '';
                filteredVessels.forEach(function(v, index) {
                    var rowClass = v.status === 'معطب' ? 'damaged' : (v.status === 'صيانة' ? 'maintenance' : 'repaired');
                    var statusClass = v.status === 'معطب' ? 'damaged' : (v.status === 'صيانة' ? 'maintenance' : 'repaired');
                    var statusLabel = v.status === 'معطب' ? '❌ معطب' : (v.status === 'صيانة' ? '🔧 صيانة' : '✅ صالح');
                    var date = formatDate(v.fDate || v.createdAt);
                    var endDate = formatDate(v.eDate);

                    html += `
                        <tr class="${rowClass}">
                            <td>${index + 1}</td>
                            <td class="vessel-name">${v.name || '-'}</td>
                            <td>${v.num || '-'}</td>
                            <td>${v.len || '-'}</td>
                            <td>${v.cat || getCategory(v.len)}</td>
                            <td>${v.region || '-'}</td>
                            <td>${v.zone || '-'}</td>
                            <td>${v.port || '-'}</td>
                            <td>${v.break || '-'}</td>
                            <td>${date}</td>
                            <td>${endDate}</td>
                            <td>${v.repairUnit || '-'}</td>
                            <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                            <td>
                                <div class="action-btns">
                                    <button class="btn-sm view" onclick="viewVessel('${v.id}')"><i class="fas fa-eye"></i></button>
                                    <button class="btn-sm edit" onclick="editVessel('${v.id}')"><i class="fas fa-edit"></i></button>
                                    <button class="btn-sm delete" onclick="deleteVessel('${v.id}')"><i class="fas fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;
            }

            // ============================================================
            // 8. HELPERS
            // ============================================================

            function formatDate(dateStr) {
                if (!dateStr) return '-';
                try {
                    var d = new Date(dateStr);
                    if (isNaN(d.getTime())) return dateStr;
                    return String(d.getDate()).padStart(2, '0') + '/' +
                           String(d.getMonth() + 1).padStart(2, '0') + '/' +
                           d.getFullYear();
                } catch(e) { return '-'; }
            }

            function getCategory(len) {
                var n = parseFloat(len);
                if (isNaN(n)) return 'زوارق مزدوجة';
                if (n === 11) return 'البروق';
                if (n >= 8 && n <= 12) return 'صقور';
                if (n > 12 && n <= 25) return 'خوافر';
                if (n >= 30) return 'طوافات';
                return 'زوارق مزدوجة';
            }

            // ============================================================
            // 9. GLOBAL FUNCTIONS
            // ============================================================

            window.viewVessel = function(id) {
                var vessel = allVessels.find(function(v) { return v.id === id; });
                if (vessel) {
                    showToast('📋 ' + (vessel.name || '') + ' - الحالة: ' + (vessel.status || ''), 'info');
                } else {
                    showToast('📋 عرض تفاصيل المركب', 'info');
                }
            };

            window.editVessel = function(id) {
                showToast('✏️ تعديل المركب', 'info');
            };

            window.deleteVessel = function(id) {
                if (!confirm('⚠️ هل أنت متأكد من حذف هذا المركب؟')) return;
                showToast('🗑️ تم حذف المركب', 'success');
            };

            // ============================================================
            // 10. INIT
            // ============================================================

            document.addEventListener('DOMContentLoaded', function() {
                console.log('🚀 تحميل صفحة سجل الصيانة التاريخي...');

                // ربط الأحداث
                document.getElementById('refreshBtn').addEventListener('click', loadVessels);
                document.getElementById('filterBtn').addEventListener('click', function() {
                    applyFilters();
                    showToast('✅ تم تطبيق الفلاتر', 'success');
                });
                document.getElementById('resetBtn').addEventListener('click', function() {
                    document.getElementById('searchInput').value = '';
                    document.getElementById('statusFilter').value = 'الكل';
                    document.getElementById('regionFilter').value = 'الكل';
                    applyFilters();
                    showToast('✅ تم إلغاء جميع الفلاتر', 'success');
                });

                document.getElementById('searchInput').addEventListener('keyup', function(e) {
                    if (e.key === 'Enter') applyFilters();
                });
                document.getElementById('statusFilter').addEventListener('change', applyFilters);
                document.getElementById('regionFilter').addEventListener('change', applyFilters);

                // تحميل البيانات
                loadVessels();
                console.log('✅ Maintenance Records page loaded');
            });

        })();
    </script>
</div>
