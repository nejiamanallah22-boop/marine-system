<!-- ============================================================ -->
<!-- JavaScript الخاص بصفحة السجل العام -->
<!-- ============================================================ -->

<script>

    // ============================================================
    // إعدادات عامة
    // ============================================================

    const API_URL = window.location.origin;

    let token = localStorage.getItem('token') || null;

    let currentUser = JSON.parse(
        localStorage.getItem('currentUser') || 'null'
    );


    // ============================================================
    // قائمة الفئات
    // ============================================================

    const CATS_LIST = [

        "البروق",

        "صقور",

        "خوافر",

        "زوارق مزدوجة",

        "طوافات"

    ];


    // ============================================================
    // قائمة الأقاليم
    // ============================================================

    const ZONES_DATA = {

        "الشمال": [

            "تونس",

            "بنزرت",

            "طبرقة"

        ],

        "الساحل": [

            "سوسة",

            "المنستير",

            "نابل"

        ],

        "الوسط": [

            "صفاقس",

            "المهدية",

            "قرقنة"

        ],

        "الجنوب": [

            "جرجيس",

            "جربة",

            "قابس"

        ]

    };


    // ============================================================
    // دالة الاتصال بالخادم
    // ============================================================

    async function apiCall(
        endpoint,
        method = 'GET',
        body = null
    ) {

        const headers = {

            'Content-Type': 'application/json',

            'Authorization': `Bearer ${token}`

        };


        const options = {

            method: method,

            headers: headers

        };


        if (body) {

            options.body = JSON.stringify(body);

        }


        const response = await fetch(

            `${API_URL}${endpoint}`,

            options

        );


        let data;


        try {

            data = await response.json();

        } catch (error) {

            data = {};

        }


        if (!response.ok) {

            if (

                response.status === 401 ||

                response.status === 403

            ) {

                alert(

                    '⚠️ انتهت الجلسة، يرجى تسجيل الدخول مرة أخرى'

                );

                window.location.href = '../index.html';

            }


            throw new Error(

                data.error || 'حدث خطأ في الاتصال بالخادم'

            );

        }


        return data;

    }


    // ============================================================
    // التحقق من الصلاحيات
    // ============================================================

    function canEdit() {

        return currentUser && (

            currentUser.role === 'مسؤول' ||

            currentUser.role === 'محرر'

        );

    }


    function canDelete() {

        return currentUser &&

            currentUser.role === 'مسؤول';

    }


    // ============================================================
    // حماية النصوص
    // ============================================================

    function escapeHtml(str) {

        if (

            str === null ||

            str === undefined

        ) {

            return '';

        }


        return String(str).replace(

            /[&<>"']/g,

            function(match) {

                const entities = {

                    '&': '&amp;',

                    '<': '&lt;',

                    '>': '&gt;',

                    '"': '&quot;',

                    "'": '&#039;'

                };


                return entities[match];

            }

        );

    }


    // ============================================================
    // تنسيق التاريخ
    // ============================================================

    function formatDate(dateValue) {

        if (!dateValue) {

            return '-';

        }


        try {

            const date = new Date(dateValue);


            if (isNaN(date.getTime())) {

                return escapeHtml(dateValue);

            }


            const day = String(

                date.getDate()

            ).padStart(2, '0');


            const month = String(

                date.getMonth() + 1

            ).padStart(2, '0');


            const year = date.getFullYear();


            return `${day}/${month}/${year}`;

        } catch (error) {

            return escapeHtml(dateValue);

        }

    }


    // ============================================================
    // تحديد الفئة حسب الطول
    // ============================================================

    function getCategory(len) {

        const n = parseFloat(len);


        if (isNaN(n)) {

            return 'زوارق مزدوجة';

        }


        if (n === 11) {

            return 'البروق';

        }


        if (

            n >= 8 &&

            n <= 12

        ) {

            return 'صقور';

        }


        if (

            n > 12 &&

            n <= 25

        ) {

            return 'خوافر';

        }


        if (n >= 30) {

            return 'طوافات';

        }


        return 'زوارق مزدوجة';

    }


    // ============================================================
    // تحميل الفلاتر
    // ============================================================

    function initFilters() {

        const categorySelect =

            document.getElementById('fCatMain');


        const regionSelect =

            document.getElementById('fRegMain');


        categorySelect.innerHTML =

            '<option value="الكل">الكل</option>';


        CATS_LIST.forEach(function(category) {

            categorySelect.innerHTML +=

                `<option value="${category}">${category}</option>`;

        });


        regionSelect.innerHTML =

            '<option value="الكل">الكل</option>';


        Object.keys(ZONES_DATA).forEach(function(region) {

            regionSelect.innerHTML +=

                `<option value="${region}">${region}</option>`;

        });

    }


    // ============================================================
    // عرض المراكب
    // ============================================================

    async function renderMain() {

        const tbody =

            document.getElementById('mainBody');


        try {

            tbody.innerHTML = `

                <tr>

                    <td colspan="13">

                        ⏳ جاري تحميل البيانات...

                    </td>

                </tr>

            `;


            const vessels = await apiCall(

                '/api/vessels'

            );


            const category =

                document.getElementById(

                    'fCatMain'

                ).value;


            const region =

                document.getElementById(

                    'fRegMain'

                ).value;


            const search =

                document.getElementById(

                    'searchMain'

                ).value

                .trim()

                .toLowerCase();


            let filtered = vessels.filter(function(vessel) {

                const vesselCategory =

                    vessel.category ||

                    getCategory(

                        vessel.length ||

                        vessel.len

                    );


                const vesselRegion =

                    vessel.region ||

                    vessel.reg ||

                    '';


                const categoryMatch =

                    category === 'الكل' ||

                    vesselCategory === category;


                const regionMatch =

                    region === 'الكل' ||

                    vesselRegion === region;


                return categoryMatch && regionMatch;

            });


            if (search) {

                filtered = filtered.filter(

                    function(vessel) {

                        const searchableText = [

                            vessel.name,

                            vessel.num,

                            vessel.region ||

                            vessel.reg,

                            vessel.zone,

                            vessel.port,

                            vessel.status ||

                            vessel.stat,

                            vessel.category

                        ]

                        .filter(Boolean)

                        .join(' ')

                        .toLowerCase();


                        return searchableText.includes(search);

                    }

                );

            }


            let html = '';


            filtered.forEach(function(v) {

                const id =

                    v._id ||

                    v.id;


                const name =

                    v.name ||

                    '-';


                const number =

                    v.num ||

                    '-';


                const length =

                    v.length ||

                    v.len ||

                    '-';


                const category =

                    v.category ||

                    getCategory(length);


                const region =

                    v.region ||

                    v.reg ||

                    '-';


                const zone =

                    v.zone ||

                    '-';


                const port =

                    v.port ||

                    '-';


                const supportLocation =

                    v.support_location ||

                    v.supp ||

                    '-';


                const status =

                    v.status ||

                    v.stat ||

                    '-';


                const breakType =

                    v.break_type ||

                    v.break ||

                    '-';


                const faultDate =

                    v.fault_date ||

                    v.fDate;


                const endDate =

                    v.end_date ||

                    v.eDate;


                html += `

                    <tr>

                        <td>

                            <strong>

                                ${escapeHtml(name)}

                            </strong>

                        </td>


                        <td>

                            ${escapeHtml(number)}

                        </td>


                        <td>

                            ${escapeHtml(length)}

                        </td>


                        <td>

                            ${escapeHtml(category)}

                        </td>


                        <td>

                            ${escapeHtml(region)}

                        </td>


                        <td>

                            ${escapeHtml(zone)}

                        </td>


                        <td>

                            ${escapeHtml(port)}

                        </td>


                        <td>

                            ${escapeHtml(supportLocation)}

                        </td>


                        <td class="status-${escapeHtml(status)}">

                            ${escapeHtml(status)}

                        </td>


                        <td>

                            ${escapeHtml(breakType)}

                        </td>


                        <td>

                            ${formatDate(faultDate)}

                        </td>


                        <td>

                            ${formatDate(endDate)}

                        </td>


                        <td>

                            ${

                                canEdit()

                                ?

                                `

                                <button

                                    class="btn btn-orange btn-sm"

                                    onclick="editItem('${id}')"

                                >

                                    ✏️ تعديل

                                </button>

                                `

                                :

                                ''

                            }


                            ${

                                canDelete()

                                ?

                                `

                                <button

                                    class="btn btn-danger btn-sm"

                                    onclick="deleteItem(

                                        '${id}',

                                        '${escapeHtml(name)}'

                                    )"

                                >

                                    🗑️ حذف

                                </button>

                                `

                                :

                                ''

                            }

                        </td>

                    </tr>

                `;

            });


            if (!html) {

                html = `

                    <tr>

                        <td colspan="13">

                            📭 لا توجد مراكب مطابقة للبحث

                        </td>

                    </tr>

                `;

            }


            tbody.innerHTML = html;

        } catch (error) {

            console.error(

                'خطأ في تحميل المراكب:',

                error

            );


            tbody.innerHTML = `

                <tr>

                    <td colspan="13">

                        ❌ خطأ في تحميل بيانات المراكب

                    </td>

                </tr>

            `;

        }

    }


    // ============================================================
    // إضافة مركب
    // ============================================================

    async function addItem() {

        if (!canEdit()) {

            alert(

                '⚠️ ليس لديك صلاحية لإضافة مركب'

            );

            return;

        }


        const name =

            document.getElementById(

                'iName'

            ).value.trim();


        if (!name) {

            alert(

                '⚠️ يرجى إدخال اسم المركب'

            );

            return;

        }


        const status =

            document.getElementById(

                'iStat'

            ).value;


        const faultDate =

            document.getElementById(

                'iDate'

            ).value;


        if (

            (

                status === 'معطب' ||

                status === 'صيانة'

            )

            &&

            !faultDate

        ) {

            alert(

                '⚠️ تاريخ العطب مطلوب للمركب المعطب أو الذي تحت الصيانة'

            );

            return;

        }


        const vessel = {

            name: name,

            num:

                document.getElementById(

                    'iNum'

                ).value.trim(),


            len:

                document.getElementById(

                    'iLen'

                ).value,


            reg:

                document.getElementById(

                    'iReg'

                ).value,


            zone:

                document.getElementById(

                    'iZone'

                ).value,


            port:

                document.getElementById(

                    'iPort'

                ).value.trim(),


            supp:

                document.getElementById(

                    'iSupp'

                ).value.trim(),


            stat: status,


            break:

                document.getElementById(

                    'iBreak'

                ).value.trim(),


            fDate: faultDate,


            eDate:

                document.getElementById(

                    'iEnd'

                ).value,


            ref:

                document.getElementById(

                    'iRef'

                ).value.trim()

        };


        try {

            await apiCall(

                '/api/vessels',

                'POST',

                vessel

            );


            clearVesselForm();


            await renderMain();


            alert(

                '✅ تم حفظ المركب بنجاح'

            );

        } catch (error) {

            alert(

                '❌ ' + error.message

            );

        }

    }


    // ============================================================
    // مسح نموذج الإدخال
    // ============================================================

    function clearVesselForm() {

        [

            'iName',

            'iNum',

            'iLen',

            'iPort',

            'iSupp',

            'iBreak',

            'iDate',

            'iEnd',

            'iRef'

        ].forEach(function(id) {

            const element =

                document.getElementById(id);


            if (element) {

                element.value = '';

            }

        });


        document.getElementById(

            'iReg'

        ).value = '';


        document.getElementById(

            'iZone'

        ).value = '';


        document.getElementById(

            'iStat'

        ).value = 'صالح';

    }


    // ============================================================
    // حذف مركب
    // ============================================================

    async function deleteItem(id, name) {

        if (!canDelete()) {

            alert(

                '⚠️ ليس لديك صلاحية لحذف المراكب'

            );

            return;

        }


        const confirmed = confirm(

            `⚠️ هل أنت متأكد من حذف المركب "${name}"؟`

        );


        if (!confirmed) {

            return;

        }


        try {

            await apiCall(

                `/api/vessels/${id}`,

                'DELETE'

            );


            await renderMain();


            alert(

                '✅ تم حذف المركب بنجاح'

            );

        } catch (error) {

            alert(

                '❌ ' + error.message

            );

        }

    }


    // ============================================================
    // تعديل مركب
    // ============================================================

    async function editItem(id) {

        if (!canEdit()) {

            alert(

                '⚠️ ليس لديك صلاحية لتعديل المراكب'

            );

            return;

        }


        try {

            const vessels = await apiCall(

                '/api/vessels'

            );


            const vessel = vessels.find(function(v) {

                return String(

                    v._id || v.id

                ) === String(id);

            });


            if (!vessel) {

                alert(

                    '❌ المركب غير موجود'

                );

                return;

            }


            document.getElementById(

                'iName'

            ).value = vessel.name || '';


            document.getElementById(

                'iNum'

            ).value = vessel.num || '';


            document.getElementById(

                'iLen'

            ).value =

                vessel.length ||

                vessel.len ||

                '';


            document.getElementById(

                'iReg'

            ).value =

                vessel.region ||

                vessel.reg ||

                '';


            document.getElementById(

                'iZone'

            ).value = vessel.zone || '';


            document.getElementById(

                'iPort'

            ).value = vessel.port || '';


            document.getElementById(

                'iSupp'

            ).value =

                vessel.support_location ||

                vessel.supp ||

                '';


            document.getElementById(

                'iStat'

            ).value =

                vessel.status ||

                vessel.stat ||

                'صالح';


            document.getElementById(

                'iBreak'

            ).value =

                vessel.break_type ||

                vessel.break ||

                '';


            document.getElementById(

                'iDate'

            ).value =

                vessel.fault_date ||

                vessel.fDate ||

                '';


            document.getElementById(

                'iEnd'

            ).value =

                vessel.end_date ||

                vessel.eDate ||

                '';


            document.getElementById(

                'iRef'

            ).value = vessel.ref || '';


            const saveButton =

                document.getElementById(

                    'saveVesselBtn'

                );


            saveButton.innerHTML =

                '🔄 تحديث المركب';


            saveButton.onclick = async function() {

                await updateItem(id);

            };


            window.scrollTo({

                top: 0,

                behavior: 'smooth'

            });

        } catch (error) {

            alert(

                '❌ ' + error.message

            );

        }

    }


    // ============================================================
    // تحديث المركب
    // ============================================================

    async function updateItem(id) {

        const name =

            document.getElementById(

                'iName'

            ).value.trim();


        if (!name) {

            alert(

                '⚠️ اسم المركب مطلوب'

            );

            return;

        }


        const vessel = {

            name: name,

            num:

                document.getElementById(

                    'iNum'

                ).value.trim(),


            len:

                document.getElementById(

                    'iLen'

                ).value,


            reg:

                document.getElementById(

                    'iReg'

                ).value,


            zone:

                document.getElementById(

                    'iZone'

                ).value,


            port:

                document.getElementById(

                    'iPort'

                ).value.trim(),


            supp:

                document.getElementById(

                    'iSupp'

                ).value.trim(),


            stat:

                document.getElementById(

                    'iStat'

                ).value,


            break:

                document.getElementById(

                    'iBreak'

                ).value.trim(),


            fDate:

                document.getElementById(

                    'iDate'

                ).value,


            eDate:

                document.getElementById(

                    'iEnd'

                ).value,


            ref:

                document.getElementById(

                    'iRef'

                ).value.trim()

        };


        try {

            await apiCall(

                `/api/vessels/${id}`,

                'PUT',

                vessel

            );


            clearVesselForm();


            const saveButton =

                document.getElementById(

                    'saveVesselBtn'

                );


            saveButton.innerHTML =

                '✅ حفظ المركب';


            saveButton.onclick = addItem;


            await renderMain();


            alert(

                '✅ تم تحديث المركب بنجاح'

            );

        } catch (error) {

            alert(

                '❌ ' + error.message

            );

        }

    }


    // ============================================================
    // مسح البحث
    // ============================================================

    function clearMainSearch() {

        document.getElementById(

            'searchMain'

        ).value = '';


        document.getElementById(

            'fCatMain'

        ).value = 'الكل';


        document.getElementById(

            'fRegMain'

        ).value = 'الكل';


        renderMain();

    }


    // ============================================================
    // تشغيل الصفحة
    // ============================================================

    document.addEventListener(

        'DOMContentLoaded',

        async function() {

            initFilters();


            if (!token) {

                console.warn(

                    'لا يوجد Token - يجب تسجيل الدخول'

                );

            }


            await renderMain();

        }

    );

</script>
