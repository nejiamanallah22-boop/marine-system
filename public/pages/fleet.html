
<!-- ===== صفحة الأسطول - تعمل داخل الإطار الرئيسي ===== -->

<div class="page-content active">
    <!-- ===== الإحصائيات ===== -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
        <h2 style="color:#60a5fa;font-size:20px;">⚓ الأسطول البحري</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="refreshFleetData()" style="padding:8px 16px;">
                <i class="fas fa-sync-alt"></i> تحديث
            </button>
            <button class="btn btn-success" onclick="showFleetForm()" style="padding:8px 16px;">
                <i class="fas fa-plus"></i> إضافة مركب
            </button>
        </div>
    </div>

    <!-- ===== الإحصائيات ===== -->
    <div class="stats-grid" id="fleetStats">
        <div class="stat-card">
            <span class="icon">🚢</span>
            <span class="number" id="fleetTotal">0</span>
            <span class="label">إجمالي المراكب</span>
        </div>
        <div class="stat-card" style="border-color:#22c55e;">
            <span class="icon">✅</span>
            <span class="number" id="fleetActive">0</span>
            <span class="label">صالح</span>
        </div>
        <div class="stat-card" style="border-color:#f59e0b;">
            <span class="icon">🔧</span>
            <span class="number" id="fleetMaintenance">0</span>
            <span class="label">صيانة</span>
        </div>
        <div class="stat-card" style="border-color:#ef4444;">
            <span class="icon">❌</span>
            <span class="number" id="fleetBroken">0</span>
            <span class="label">معطب</span>
        </div>
    </div>

    <!-- ===== شريط الفلترة ===== -->
    <div class="filter-bar" style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);padding:12px 16px;border-radius:8px;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <input type="text" id="fleetSearch" placeholder="🔍 بحث..." style="flex:1;min-width:150px;padding:8px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:#fff;font-family:inherit;">
        <select id="fleetFilterStatus" style="padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:#fff;font-family:inherit;">
            <option value="الكل">📋 جميع الحالات</option>
            <option value="صالح">✅ صالح</option>
            <option value="صيانة">🔧 صيانة</option>
            <option value="معطب">❌ معطب</option>
        </select>
        <select id="fleetFilterRegion" style="padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:#fff;font-family:inherit;">
            <option value="الكل">🌍 جميع الأقاليم</option>
            <option value="الشمال">الشمال</option>
            <option value="الساحل">الساحل</option>
            <option value="الوسط">الوسط</option>
            <option value="الجنوب">الجنوب</option>
        </select>
        <button class="btn btn-primary" onclick="applyFleetFilters()" style="padding:8px 16px;">🔍 بحث</button>
    </div>

    <!-- ===== نموذج الإضافة ===== -->
    <div id="fleetForm" style="display:none;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:8px;padding:16px;margin-bottom:16px;">
        <h3 style="color:#60a5fa;margin-bottom:12px;">➕ إضافة مركب جديد</h3>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;">
            <input type="text" id="fVesselName" placeholder="الاسم *" style="padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:#fff;">
            <input type="text" id="fVesselNum" placeholder="الرقم" style="padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:#fff;">
            <input type="number" id="fVesselLen" placeholder="الطول (م)" style="padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:#fff;">
            <select id="fVesselRegion" style="padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:#fff;">
                <option value="">الإقليم</option>
                <option value="الشمال">الشمال</option>
                <option value="الساحل">الساحل</option>
                <option value="الوسط">الوسط</option>
                <option value="الجنوب">الجنوب</option>
            </select>
            <select id="fVesselStatus" style="padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:#fff;">
                <option value="صالح">✅ صالح</option>
                <option value="صيانة">🔧 صيانة</option>
                <option value="معطب">❌ معطب</option>
            </select>
            <input type="text" id="fVesselPort" placeholder="الميناء" style="padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:#fff;">
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;">
            <button class="btn btn-success" onclick="saveFleetVessel()" style="padding:8px 20px;">💾 حفظ</button>
            <button class="btn" onclick="hideFleetForm()" style="padding:8px 20px;background:#64748b;color:#fff;border:none;border-radius:6px;cursor:pointer;">❌ إلغاء</button>
        </div>
        <div id="fleetFormError" style="color:#f87171;margin-top:8px;display:none;"></div>
    </div>

    <!-- ===== الجدول ===== -->
    <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:8px;padding:12px;overflow-x:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
            <span style="color:#94a3b8;font-size:13px;">🚢 قائمة الأسطول</span>
            <span style="color:#64748b;font-size:12px;" id="fleetCount">0 مركب</span>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead>
                <tr style="background:rgba(255,255,255,0.03);">
                    <th style="text-align:right;padding:8px 10px;color:#94a3b8;">الاسم</th>
                    <th style="text-align:right;padding:8px 10px;color:#94a3b8;">الرقم</th>
                    <th style="text-align:right;padding:8px 10px;color:#94a3b8;">الطول</th>
                    <th style="text-align:right;padding:8px 10px;color:#94a3b8;">الحالة</th>
                    <th style="text-align:right;padding:8px 10px;color:#94a3b8;">الإقليم</th>
                    <th style="text-align:right;padding:8px 10px;color:#94a3b8;">الميناء</th>
                </tr>
            </thead>
            <tbody id="fleetTableBody">
                <tr><td colspan="6" style="text-align:center;padding:30px;color:rgba(255,255,255,0.2);">🚢 جاري تحميل البيانات...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ============================================================
    // 🚢 صفحة الأسطول - JavaScript
    // ============================================================

    let fleetVessels = [];
    let fleetFiltered = [];

    // ===== تحميل البيانات =====
    async function loadFleetData() {
        try {
            const token = sessionStorage.getItem('auth_token');
            const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

            const response = await fetch('/api/vessels', { headers });
            if (response.ok) {
                const data = await response.json();
                fleetVessels = data.vessels || data || [];
                applyFleetFilters();
                updateFleetStats();
            } else {
                fleetVessels = [];
                applyFleetFilters();
                updateFleetStats();
            }
        } catch (e) {
            console.error('❌ Fleet load error:', e);
            fleetVessels = [];
            applyFleetFilters();
        }
    }

    // ===== تحديث الإحصائيات =====
    function updateFleetStats() {
        const total = fleetVessels.length;
        const active = fleetVessels.filter(v => v.stat === 'صالح').length;
        const maintenance = fleetVessels.filter(v => v.stat === 'صيانة').length;
        const broken = fleetVessels.filter(v => v.stat === 'معطب').length;

        document.getElementById('fleetTotal').textContent = total;
        document.getElementById('fleetActive').textContent = active;
        document.getElementById('fleetMaintenance').textContent = maintenance;
        document.getElementById('fleetBroken').textContent = broken;
    }

    // ===== الفلترة =====
    function applyFleetFilters() {
        const search = document.getElementById('fleetSearch').value.toLowerCase();
        const status = document.getElementById('fleetFilterStatus').value;
        const region = document.getElementById('fleetFilterRegion').value;

        fleetFiltered = fleetVessels.filter(v => {
            const matchSearch = !search ||
                (v.name && v.name.toLowerCase().includes(search)) ||
                (v.num && v.num.toLowerCase().includes(search));
            const matchStatus = status === 'الكل' || v.stat === status;
            const matchRegion = region === 'الكل' || v.reg === region;
            return matchSearch && matchStatus && matchRegion;
        });

        renderFleetTable();
        document.getElementById('fleetCount').textContent = `${fleetFiltered.length} مركب`;
    }

    // ===== عرض الجدول =====
    function renderFleetTable() {
        const tbody = document.getElementById('fleetTableBody');

        if (!fleetFiltered.length) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:30px;color:rgba(255,255,255,0.2);">🚢 لا توجد مراكب</td></tr>`;
            return;
        }

        let html = '';
        fleetFiltered.forEach(v => {
            const statusClass = v.stat === 'صالح' ? 'status-ready' : v.stat === 'صيانة' ? 'status-maintenance' :
                'status-broken';
            html += `
                <tr>
                    <td style="padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.03);"><strong>${v.name || '-'}</strong></td>
                    <td style="padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.03);">${v.num || '-'}</td>
                    <td style="padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.03);">${v.len || '-'}</td>
                    <td style="padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.03);"><span class="status-badge ${statusClass}">${v.stat || 'غير محدد'}</span></td>
                    <td style="padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.03);">${v.region || v.reg || '-'}</td>
                    <td style="padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.03);">${v.port || '-'}</td>
                </tr>
            `;
        });

        tbody.innerHTML = html;
    }

    // ===== إظهار نموذج الإضافة =====
    function showFleetForm() {
        document.getElementById('fleetForm').style.display = 'block';
        document.getElementById('fleetFormError').style.display = 'none';
        document.querySelectorAll('#fleetForm input, #fleetForm select').forEach(el => el.value = '');
    }

    function hideFleetForm() {
        document.getElementById('fleetForm').style.display = 'none';
    }

    // ===== حفظ مركب جديد =====
    async function saveFleetVessel() {
        const name = document.getElementById('fVesselName').value.trim();
        const num = document.getElementById('fVesselNum').value.trim();
        const len = parseFloat(document.getElementById('fVesselLen').value);
        const region = document.getElementById('fVesselRegion').value;
        const status = document.getElementById('fVesselStatus').value;
        const port = document.getElementById('fVesselPort').value.trim();

        const errorEl = document.getElementById('fleetFormError');

        if (!name) {
            errorEl.textContent = '⚠️ الاسم مطلوب';
            errorEl.style.display = 'block';
            return;
        }

        if (!len || len <= 0) {
            errorEl.textContent = '⚠️ الطول يجب أن يكون أكبر من 0';
            errorEl.style.display = 'block';
            return;
        }

        if (!region) {
            errorEl.textContent = '⚠️ يرجى اختيار الإقليم';
            errorEl.style.display = 'block';
            return;
        }

        errorEl.style.display = 'none';

        // حساب الفئة تلقائياً
        let cat = 'زوارق مزدوجة';
        if (len === 11) cat = 'البروق';
        else if (len >= 8 && len <= 12) cat = 'صقور';
        else if (len > 12 && len <= 25) cat = 'خوافر';
        else if (len > 30) cat = 'طوافات';

        const data = {
            name,
            num: num || '',
            len: String(len),
            reg: region,
            port: port || '',
            stat: status,
            cat: cat
        };

        try {
            const token = sessionStorage.getItem('auth_token');
            const response = await fetch('/api/vessels', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok && result.success) {
                showToast('✅ تم إضافة المركب بنجاح', 'success');
                hideFleetForm();
                await loadFleetData();
            } else {
                errorEl.textContent = '❌ ' + (result.error || 'فشل الإضافة');
                errorEl.style.display = 'block';
            }
        } catch (e) {
            errorEl.textContent = '❌ ' + e.message;
            errorEl.style.display = 'block';
        }
    }

    // ===== تحديث البيانات =====
    function refreshFleetData() {
        showToast('🔄 جاري التحديث...', 'info');
        loadFleetData();
    }

    // ===== Toast =====
    function showToast(msg, type = 'info') {
        const container = document.getElementById('toastContainer') || document.querySelector('.toast-container');
        if (!container) return;
        const t = document.createElement('div');
        t.className = `toast toast-${type}`;
        const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        t.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${msg}`;
        container.appendChild(t);
        setTimeout(() => { t.style.opacity = '0';
            setTimeout(() => t.remove(), 300); }, 4000);
    }

    // ===== ربط الأحداث =====
    document.addEventListener('DOMContentLoaded', function() {
        // ربط أحداث الفلترة
        document.getElementById('fleetSearch').addEventListener('input', applyFleetFilters);
        document.getElementById('fleetFilterStatus').addEventListener('change', applyFleetFilters);
        document.getElementById('fleetFilterRegion').addEventListener('change', applyFleetFilters);

        // تحميل البيانات
        loadFleetData();
    });

    // ===== تصدير الدوال =====
    window.loadFleetData = loadFleetData;
    window.applyFleetFilters = applyFleetFilters;
    window.showFleetForm = showFleetForm;
    window.hideFleetForm = hideFleetForm;
    window.saveFleetVessel = saveFleetVessel;
    window.refreshFleetData = refreshFleetData;
    window.showToast = showToast;
</script>
