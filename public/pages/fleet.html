<div class="fleet-container">
    <div class="page-header">
        <div>
            <h1>🚢 الأسطول البحري</h1>
            <p class="subtitle">إدارة المراكب والقوارب</p>
        </div>
        <button class="refresh-btn" onclick="loadVessels()">🔄 تحديث</button>
    </div>

    <div class="fleet-stats">
        <span>📊 إجمالي المراكب: <strong id="fleetCount">0</strong></span>
    </div>

    <!-- نموذج الإضافة -->
    <div class="form-container">
        <h3>➕ إضافة مركب جديد</h3>
        <div class="form-grid">
            <input type="text" id="iName" placeholder="اسم المركب *">
            <input type="text" id="iNum" placeholder="رقم المركب">
            <input type="number" id="iLen" placeholder="الطول">
            <select id="iCat">
                <option value="البروق">البروق</option>
                <option value="صقور">صقور</option>
                <option value="خوافر">خوافر</option>
                <option value="طوافات">طوافات</option>
                <option value="زوارق مزدوجة">زوارق مزدوجة</option>
            </select>
            <select id="iReg" onchange="updateZones()">
                <option value="الشمال">الشمال</option>
                <option value="الساحل">الساحل</option>
                <option value="الوسط">الوسط</option>
                <option value="الجنوب">الجنوب</option>
            </select>
            <select id="iZone"><option value="">📍 المنطقة</option></select>
            <input type="text" id="iPort" placeholder="الميناء">
            <input type="text" id="iSupp" placeholder="الوحدة">
            <select id="iStat">
                <option value="صالح">صالح</option>
                <option value="معطب">معطب</option>
                <option value="صيانة">صيانة</option>
            </select>
            <input type="text" id="iBreak" placeholder="العطل">
            <input type="date" id="iDate" placeholder="تاريخ التصنيع">
            <input type="date" id="iEnd" placeholder="تاريخ الانتهاء">
            <input type="text" id="iRef" placeholder="المرجع">
            <input type="text" id="iRepairer" placeholder="الفني المسؤول">
        </div>
        <button class="btn-add" onclick="addItem()">💾 إضافة مركب</button>
    </div>

    <!-- جدول المراكب -->
    <div class="table-container">
        <div class="scrollable-table">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الرقم</th>
                        <th>الطول</th>
                        <th>الفئة</th>
                        <th>المنطقة</th>
                        <th>الميناء</th>
                        <th>الوحدة</th>
                        <th>الحالة</th>
                        <th>العطل</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
