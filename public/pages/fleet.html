<!-- 📦 JAVASCRIPT - FLEET PAGE (المُعدل) -->
<!-- ============================================================ -->
<script>
    // ============================================================
    // 🚢 FLEET PAGE - النسخة المُعدلة
    // ============================================================

    // ✅ بيانات المناطق الكاملة
    const ZONES_DATA = {
        "الشمال": ["تونس", "بنزرت", "طبرقة"],
        "الساحل": ["سوسة", "المنستير", "نابل"],
        "الوسط": ["صفاقس", "المهدية", "قرقنة"],
        "الجنوب": ["جرجيس", "جربة", "قابس"],
        "وحدة الصيانة والإسناد البحري تونس": ["تونس"],
        "وحدة الصيانة والإسناد البحري المنستير": ["المنستير"],
        "وحدة الصيانة والإسناد البحري صفاقس": ["صفاقس"],
        "وحدة الصيانة والإسناد البحري جرجيس": ["جرجيس"],
        "المجمع الأمني بقبيبة": ["قبيبة"]
    };

    const CATS_LIST = ['البروق', 'صقور', 'خوافر', 'زوارق مزدوجة', 'طوافات'];

    // ============================================================
    // 1. الحصول على المستخدم من window
    // ============================================================

    function getUser() {
        return window.currentUser || null;
    }

    // ============================================================
    // 2. التحقق من المستخدم
    // ============================================================

    async function checkUser() {
        try {
            const token = localStorage.getItem('marine_token');
            if (!token) {
                console.warn('⚠️ لا يوجد توكن');
                window.location.href = '/index.html';
                return false;
            }

            const response = await fetch('/api/auth/me', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (!response.ok) {
                console.warn('⚠️ جلسة غير صالحة');
                localStorage.removeItem('marine_token');
                window.location.href = '/index.html';
                return false;
            }

            const data = await response.json();
            if (data.success && data.user) {
                window.currentUser = data.user;
                console.log('✅ المستخدم الحالي:', window.currentUser);
                console.log('👤 الدور:', window.currentUser.role);
                return true;
            } else {
                window.location.href = '/index.html';
                return false;
            }
        } catch (error) {
            console.error('❌ خطأ:', error);
            window.location.href = '/index.html';
            return false;
        }
    }

    // ============================================================
    // 3. صلاحيات المستخدم (مُعدلة)
    // ============================================================

    function canEdit() {
        const user = getUser();
        if (!user) {
            console.warn('⚠️ لا يوجد مستخدم');
            return false;
        }
        const role = user.role;
        console.log('👤 دور المستخدم في canEdit:', role);
        
        // ✅ قائمة الأدوار المسموح لها بالتعديل
        const allowedRoles = ['مسؤول', 'محرر', 'admin', 'manager', 'مدير'];
        const hasPermission = allowedRoles.includes(role);
        console.log(`✅ ${hasPermission ? 'لديه' : 'ليس لديه'} صلاحية التعديل`);
        return hasPermission;
    }

    function canDelete() {
        const user = getUser();
        if (!user) return false;
        const role = user.role;
        const allowedRoles = ['مسؤول', 'admin', 'مدير'];
        return allowedRoles.includes(role);
    }

    // ============================================================
    // 4. تحديث المناطق (مع بيانات كاملة)
    // ============================================================

    function updateZones() {
        const reg = document.getElementById('iReg').value;
        const zoneSel = document.getElementById('iZone');
        zoneSel.innerHTML = '<option value="">المنطقة</option>';
        if (ZONES_DATA[reg]) {
            ZONES_DATA[reg].forEach(z => {
                zoneSel.innerHTML += `<option value="${z}">${z}</option>`;
            });
        }
        console.log('✅ تم تحديث المناطق للإقليم:', reg, '→', ZONES_DATA[reg] || []);
    }

    // ============================================================
    // 5. دوال مساعدة
    // ============================================================

    function escapeHtml(str) {
        if (!str) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return String(str).replace(/[&<>"']/g, (m) => map[m]);
    }

    function formatDate(val) {
        if (!val) return '-';
        try {
            const d = new Date(val);
            if (isNaN(d.getTime())) return escapeHtml(val);
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();
            return `${dd}/${mm}/${yyyy}`;
        } catch (_) { return escapeHtml(val); }
    }

    function getCategory(len) {
        const n = parseFloat(len);
        if (isNaN(n)) return 'زوارق مزدوجة';
        if (n === 11) return 'البروق';
        if (n >= 8 && n <= 12) return 'صقور';
        if (n > 12 && n <= 25) return 'خوافر';
        if (n >= 30) return 'طوافات';
        return 'زوارق مزدوجة';
    }

    // ============================================================
    // 6. عرض البيانات
    // ============================================================

    async function renderMain() {
        const mainBody = document.getElementById('mainBody');

        mainBody.innerHTML = `
            <tr>
                <td colspan="14" style="text-align:center; padding:40px 20px; color:rgba(255,255,255,0.2);">
                    <div style="width:30px; height:30px; border:3px solid rgba(255,255,255,0.04); border-top-color:#e94560; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 10px;"></div>
                    <h3 style="color:rgba(255,255,255,0.2); font-weight:600; margin-bottom:3px; font-size:0.9rem;">جاري التحميل...</h3>
                    <p style="color:rgba(255,255,255,0.1); font-size:0.75rem;">يرجى الانتظار</p>
                </td>
            </tr>
        `;

        try {
            const token = localStorage.getItem('marine_token');
            if (!token) {
                window.location.href = '/index.html';
                return;
            }

            const response = await fetch('/api/vessels', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (!response.ok) {
                if (response.status === 401) {
                    localStorage.removeItem('marine_token');
                    window.location.href = '/index.html';
                    return;
                }
                throw new Error('فشل تحميل البيانات');
            }

            const vessels = await response.json();

            const fCatMain = document.getElementById('fCatMain');
            const fRegMain = document.getElementById('fRegMain');
            const searchMain = document.getElementById('searchMain');

            const catFilter = fCatMain.value || 'الكل';
            const regFilter = fRegMain.value || 'الكل';
            const search = searchMain.value.trim().toLowerCase();

            let filtered = vessels.filter(v => {
                const vCat = v.cat || getCategory(v.len);
                const vReg = v.region || v.reg || '';
                const catMatch = (catFilter === 'الكل' || vCat === catFilter);
                const regMatch = (regFilter === 'الكل' || vReg === regFilter);
                return catMatch && regMatch;
            });

            if (search) {
                filtered = filtered.filter(v => {
                    const text = [
                        v.name, v.num, v.region || v.reg, v.zone,
                        v.port, v.status || v.stat, v.cat,
                        v.repairUnit
                    ].filter(Boolean).join(' ').toLowerCase();
                    return text.includes(search);
                });
            }

            if (filtered.length === 0) {
                mainBody.innerHTML = `
                    <tr>
                        <td colspan="14" style="text-align:center; padding:40px 20px; color:rgba(255,255,255,0.15);">
                            <i class="fas fa-inbox" style="font-size:2rem; display:block; margin-bottom:10px; color:rgba(255,255,255,0.05);"></i>
                            <h3 style="color:rgba(255,255,255,0.2); font-weight:600; font-size:0.9rem;">لا توجد مراكب</h3>
                            <p style="color:rgba(255,255,255,0.1); font-size:0.75rem;">لم يتم العثور على أي مراكب مطابقة</p>
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            for (const v of filtered) {
                const id = v._id || v.id;
                const name = v.name || '-';
                const number = v.num || '-';
                const length = v.len || '-';
                const category = v.cat || getCategory(length);
                const region = v.region || v.reg || '-';
                const zone = v.zone || '-';
                const port = v.port || '-';
                const supp = v.supp || '-';
                const status = v.status || v.stat || '-';
                const breakType = v.break || '-';
                const fDate = v.fDate;
                const eDate = v.eDate;
                const repairUnit = v.repairUnit || '-';

                const editBtn = canEdit() ?
                    `<button class="btn-sm btn-edit" onclick="editItem('${id}')" style="padding:2px 7px; border:none; border-radius:20px; font-size:0.55rem; font-weight:600; cursor:pointer; background:rgba(245,200,66,0.1); color:#f5c842; transition:all 0.3s;"><i class="fas fa-edit"></i></button>` :
                    '';
                const delBtn = canDelete() ?
                    `<button class="btn-sm btn-delete" onclick="deleteItem('${id}','${escapeHtml(name)}')" style="padding:2px 7px; border:none; border-radius:20px; font-size:0.55rem; font-weight:600; cursor:pointer; background:rgba(225,112,85,0.1); color:#e17055; transition:all 0.3s;"><i class="fas fa-trash-alt"></i></button>` :
                    '';

                html += `<tr style="transition:all 0.3s;">
                    <td style="font-weight:700; color:#fff; padding:8px 5px; border-bottom:1px solid rgba(255,255,255,0.02);">${escapeHtml(name)}</td>
                    <td style="padding:8px 5px; border-bottom:1px solid rgba(255,255,255,0.02); color:rgba(255,255,255,0.6);">${escapeHtml(number)}</td>
                    <td style="padding:8px 5px; border-bottom:1px solid rgba(255,255,255,0.02); color:rgba(255,255,255,0.6);">${escapeHtml(length)}</td>
                    <td style="padding:8px 5px; border-bottom:1px solid rgba(255,255,255,0.02); color:rgba(255,255,255,0.6);">${escapeHtml(category)}</td>
                    <td style="padding:8px 5px; border-bottom:1px solid rgba(255,255,255,0.02); color:rgba(255,255,255,0.6);">${escapeHtml(region)}</td>
                    <td style="padding:8px 5px; border-bottom:1px solid rgba(255,255,255,0.02); color:rgba(255,255,255,0.6);">${escapeHtml(zone)}</td>
                    <td style="padding:8px 5px; border-bottom:1px solid rgba(255,255,255,0.02); color:rgba(255,255,255,0.6);">${escapeHtml(port)}</td>
                    <td style="padding:8px 5px; border-bottom:1px solid rgba(255,255,255,0.02); color:rgba(255,255,255,0.6);">${escapeHtml(supp)}</td>
                    <td style="padding:8px 5px; border-bottom:1px solid rgba(255,255,255,0.02); font-weight:700; color:${status === 'صالح' ? '#00b894' : (status === 'معطب' ? '#e17055' : '#fdcb6e')};">${escapeHtml(status)}</td>
                    <td style="padding:8px 5px; border-bottom:1px solid rgba(255,255,255,0.02); color:rgba(255,255,255,0.6);">${escapeHtml(breakType)}</td>
                    <td style="padding:8px 5px; border-bottom:1px solid rgba(255,255,255,0.02); color:rgba(255,255,255,0.6);">${formatDate(fDate)}</td>
                    <td style="padding:8px 5px; border-bottom:1px solid rgba(255,255,255,0.02); color:rgba(255,255,255,0.6);">${formatDate(eDate)}</td>
                    <td style="padding:8px 5px; border-bottom:1px solid rgba(255,255,255,0.02); color:rgba(255,255,255,0.6);">${escapeHtml(repairUnit)}</td>
                    <td style="padding:8px 5px; border-bottom:1px solid rgba(255,255,255,0.02);"><div style="display:flex; gap:3px; flex-wrap:wrap; justify-content:center;">${editBtn} ${delBtn}</div></td>
                </tr>`;
            }
            mainBody.innerHTML = html;

        } catch (err) {
            console.error('❌ renderMain error:', err);
            mainBody.innerHTML = `
                <tr>
                    <td colspan="14" style="text-align:center; padding:40px 20px; color:#f87171;">
                        <i class="fas fa-exclamation-triangle" style="font-size:2rem; display:block; margin-bottom:10px;"></i>
                        <h3 style="color:#f87171; font-weight:600; font-size:0.9rem;">خطأ في تحميل البيانات</h3>
                        <p style="color:rgba(255,255,255,0.3); font-size:0.75rem;">${escapeHtml(err.message)}</p>
                        <button onclick="renderMain()" style="margin-top:10px; padding:6px 20px; background:linear-gradient(135deg,#e94560,#f5c842); border:none; border-radius:30px; color:#fff; font-weight:600; cursor:pointer; transition:all 0.3s;">
                            <i class="fas fa-sync-alt"></i> إعادة المحاولة
                        </button>
                    </td>
                </tr>
            `;
        }
    }

    // ============================================================
    // 7. إضافة مركب
    // ============================================================

    async function addItem() {
        if (!canEdit()) {
            alert('⚠️ ليس لديك صلاحية لإضافة مركب');
            return;
        }

        const name = document.getElementById('iName').value.trim();
        if (!name) {
            alert('⚠️ يرجى إدخال اسم المركب');
            return;
        }

        const status = document.getElementById('iStat').value;
        const faultDate = document.getElementById('iDate').value;
        if ((status === 'معطب' || status === 'صيانة') && !faultDate) {
            alert('⚠️ تاريخ العطب مطلوب للمركب المعطب أو الذي تحت الصيانة');
            return;
        }

        const vessel = {
            name: name,
            num: document.getElementById('iNum').value.trim(),
            len: document.getElementById('iLen').value,
            region: document.getElementById('iReg').value,
            zone: document.getElementById('iZone').value,
            port: document.getElementById('iPort').value.trim(),
            supp: document.getElementById('iSupp').value.trim(),
            stat: status,
            break: document.getElementById('iBreak').value.trim(),
            fDate: faultDate,
            eDate: document.getElementById('iEnd').value,
            ref: document.getElementById('iRef').value.trim(),
            repairUnit: document.getElementById('iRepairUnit').value
        };

        try {
            const token = localStorage.getItem('marine_token');
            const response = await fetch('/api/vessels', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(vessel)
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'فشل حفظ المركب');
            }

            clearForm();
            await renderMain();
            alert('✅ تم حفظ المركب بنجاح');
        } catch (err) {
            alert('❌ ' + err.message);
        }
    }

    // ============================================================
    // 8. مسح النموذج
    // ============================================================

    function clearForm() {
        ['iName', 'iNum', 'iLen', 'iPort', 'iSupp', 'iBreak', 'iDate', 'iEnd', 'iRef'].forEach(id => {
            document.getElementById(id).value = '';
        });
        document.getElementById('iReg').value = '';
        document.getElementById('iZone').innerHTML = '<option value="">المنطقة</option>';
        document.getElementById('iStat').value = 'صالح';
        document.getElementById('iRepairUnit').value = '';
    }

    // ============================================================
    // 9. حذف مركب
    // ============================================================

    window.deleteItem = async function(id, name) {
        if (!canDelete()) {
            alert('⚠️ ليس لديك صلاحية للحذف');
            return;
        }
        if (!confirm(`⚠️ هل أنت متأكد من حذف المركب "${name}"؟`)) return;

        try {
            const token = localStorage.getItem('marine_token');
            const response = await fetch(`/api/vessels/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'فشل حذف المركب');
            }

            await renderMain();
            alert('✅ تم حذف المركب بنجاح');
        } catch (err) {
            alert('❌ ' + err.message);
        }
    };

    // ============================================================
    // 10. تعديل مركب
    // ============================================================

    window.editItem = async function(id) {
        if (!canEdit()) {
            alert('⚠️ ليس لديك صلاحية للتعديل');
            return;
        }

        try {
            const token = localStorage.getItem('marine_token');
            const response = await fetch('/api/vessels', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (!response.ok) throw new Error('فشل تحميل البيانات');

            const vessels = await response.json();
            const v = vessels.find(item => String(item._id || item.id) === String(id));
            if (!v) {
                alert('❌ المركب غير موجود');
                return;
            }

            document.getElementById('iName').value = v.name || '';
            document.getElementById('iNum').value = v.num || '';
            document.getElementById('iLen').value = v.len || '';
            document.getElementById('iReg').value = v.region || v.reg || '';
            updateZones();
            setTimeout(() => { document.getElementById('iZone').value = v.zone || ''; }, 50);
            document.getElementById('iPort').value = v.port || '';
            document.getElementById('iSupp').value = v.supp || '';
            document.getElementById('iStat').value = v.status || v.stat || 'صالح';
            document.getElementById('iBreak').value = v.break || '';
            document.getElementById('iDate').value = v.fDate || '';
            document.getElementById('iEnd').value = v.eDate || '';
            document.getElementById('iRef').value = v.ref || '';
            document.getElementById('iRepairUnit').value = v.repairUnit || '';

            const saveBtn = document.getElementById('saveVesselBtn');
            saveBtn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث المركب';
            saveBtn.onclick = async function() {
                await updateItem(id);
            };

            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
            alert('❌ ' + err.message);
        }
    };

    // ============================================================
    // 11. تحديث مركب
    // ============================================================

    async function updateItem(id) {
        const name = document.getElementById('iName').value.trim();
        if (!name) {
            alert('⚠️ اسم المركب مطلوب');
            return;
        }

        const vessel = {
            name: name,
            num: document.getElementById('iNum').value.trim(),
            len: document.getElementById('iLen').value,
            region: document.getElementById('iReg').value,
            zone: document.getElementById('iZone').value,
            port: document.getElementById('iPort').value.trim(),
            supp: document.getElementById('iSupp').value.trim(),
            stat: document.getElementById('iStat').value,
            break: document.getElementById('iBreak').value.trim(),
            fDate: document.getElementById('iDate').value,
            eDate: document.getElementById('iEnd').value,
            ref: document.getElementById('iRef').value.trim(),
            repairUnit: document.getElementById('iRepairUnit').value
        };

        try {
            const token = localStorage.getItem('marine_token');
            const response = await fetch(`/api/vessels/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(vessel)
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'فشل تحديث المركب');
            }

            clearForm();
            const saveBtn = document.getElementById('saveVesselBtn');
            saveBtn.innerHTML = '<i class="fas fa-save"></i> حفظ المركب';
            saveBtn.onclick = addItem;
            await renderMain();
            alert('✅ تم تحديث المركب بنجاح');
        } catch (err) {
            alert('❌ ' + err.message);
        }
    }

    // ============================================================
    // 12. مسح البحث
    // ============================================================

    window.clearMainSearch = function() {
        document.getElementById('searchMain').value = '';
        document.getElementById('fCatMain').value = 'الكل';
        document.getElementById('fRegMain').value = 'الكل';
        renderMain();
    };

    // ============================================================
    // 13. تهيئة الفلاتر
    // ============================================================

    function initFilters() {
        const fCatMain = document.getElementById('fCatMain');
        const fRegMain = document.getElementById('fRegMain');

        fCatMain.innerHTML = '<option value="الكل">الكل</option>';
        CATS_LIST.forEach(c => {
            fCatMain.innerHTML += `<option value="${c}">${c}</option>`;
        });

        fRegMain.innerHTML = '<option value="الكل">الكل</option>';
        Object.keys(ZONES_DATA).forEach(r => {
            fRegMain.innerHTML += `<option value="${r}">${r}</option>`;
        });
    }

    // ============================================================
    // 14. تصدير / تحديث
    // ============================================================

    window.exportFleetData = function() {
        alert('📤 سيتم تصدير بيانات الأسطول قريباً');
    };

    window.refreshFleet = function() {
        renderMain();
        alert('🔄 تم تحديث البيانات');
    };

    // ============================================================
    // 15. التهيئة
    // ============================================================

    document.addEventListener('DOMContentLoaded', async function() {
        console.log('🚀 تحميل صفحة السجل العام...');

        const userChecked = await checkUser();
        if (!userChecked) return;

        // ✅ تحديث عرض الدور
        const roleDisplay = document.getElementById('userRoleDisplay');
        if (roleDisplay && window.currentUser) {
            roleDisplay.textContent = window.currentUser.role;
        }

        // ✅ إظهار/إخفاء زر الإضافة
        const addBtn = document.getElementById('saveVesselBtn');
        if (addBtn) {
            addBtn.style.display = canEdit() ? 'inline-flex' : 'none';
            console.log('✅ زر الإضافة:', addBtn.style.display);
        }

        initFilters();
        updateZones();
        await renderMain();

        console.log('✅ صفحة السجل العام جاهزة');
        console.log('👤 المستخدم:', window.currentUser);
        console.log('🔑 صلاحية التعديل:', canEdit());
    });
</script>
