<script>
    (function() {
        "use strict";

        // ===== الحالة العامة =====
        var fleetData = [];
        var editId = null;
        var isLoading = false;
        var isInitialized = false; // لمنع التهيئة المزدوجة

        // ===== الحصول على التوكن =====
        function getToken() {
            return sessionStorage.getItem('token') || localStorage.getItem('token') || null;
        }

        // ===== الحصول على الرأس مع التوكن =====
        function getHeaders() {
            var headers = { 'Content-Type': 'application/json' };
            var token = getToken();
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }
            return headers;
        }

        // ===== عرض رسالة (Toast) مع تحسين لمنع التكرار =====
        function showToast(msg, type) {
            type = type || 'info';
            var container = document.getElementById('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            var toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.innerHTML = '<span>' + (icons[type] || 'ℹ️') + '</span> ' + msg;
            container.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(30px)';
                setTimeout(function() { toast.remove(); }, 300);
            }, 3000);
        }

        // ===== جلب البيانات من الخادم =====
        async function fetchVessels() {
            try {
                isLoading = true;
                var tbody = document.getElementById('mainBody');
                if (tbody) {
                    tbody.innerHTML = '<tr><td colspan="13" class="empty-state"><div class="spinner"></div><h3>جاري التحميل...</h3></td></tr>';
                }

                var response = await fetch('/api/vessels', {
                    method: 'GET',
                    headers: getHeaders(),
                    credentials: 'include'
                });

                if (response.status === 401) {
                    showToast('⚠️ جلسة منتهية، يرجى تسجيل الدخول', 'warning');
                    // استخدام replace بدلاً من href لمنع تكدس السجلات في History
                    window.location.replace('/');
                    return [];
                }

                if (!response.ok) {
                    throw new Error('فشل تحميل البيانات: ' + response.status);
                }

                var data = await response.json();
                if (data.success && Array.isArray(data.vessels)) {
                    fleetData = data.vessels;
                    return fleetData;
                } else {
                    fleetData = [];
                    return [];
                }

            } catch (error) {
                console.error('❌ Error fetching vessels:', error);
                showToast('⚠️ حدث خطأ في تحميل المراكب', 'error');
                fleetData = [];
                return [];
            } finally {
                isLoading = false;
            }
        }

        // ===== حساب الفئة حسب الطول =====
        function getCategory(len) {
            var n = parseFloat(len);
            if (isNaN(n) || n === 0) return 'غير محدد';
            if (n === 11) return 'البروق';
            if (n >= 8 && n < 12) return 'صقور';
            if (n >= 12 && n < 30) return 'خوافر';
            if (n >= 30) return 'طوافات';
            return 'زوارق مزدوجة';
        }

        // ===== عرض الجدول =====
        function renderTable() {
            var search = document.getElementById('searchMain');
            var catFilter = document.getElementById('fCatMain');
            var regFilter = document.getElementById('fRegMain');
            var tbody = document.getElementById('mainBody');

            // التحقق من وجود العناصر قبل المتابعة (يمنع الأعطال)
            if (!tbody || !search || !catFilter || !regFilter) return;

            var searchVal = search.value.toLowerCase().trim();
            var catVal = catFilter.value;
            var regVal = regFilter.value;

            var filtered = fleetData.filter(function(v) {
                var cat = getCategory(v.len);
                if (catVal !== 'الكل' && cat !== catVal) return false;
                if (regVal !== 'الكل' && v.region !== regVal) return false;
                if (searchVal) {
                    var text = [v.name, v.num, v.region, v.zone, v.port, v.stat, v.cat].join(' ').toLowerCase();
                    if (!text.includes(searchVal)) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="13" style="text-align:center;padding:40px;color:rgba(255,255,255,0.15);">🔍 لا توجد مراكب مطابقة</td></tr>';
                return;
            }

            var html = '';
            filtered.forEach(function(v) {
                var cat = getCategory(v.len);
                var statusColor = v.stat === 'صالح' ? '#4ade80' : v.stat === 'معطب' ? '#f87171' : '#fbbf24';
                var statusLabel = v.stat === 'صالح' ? '✅ صالح' : v.stat === 'معطب' ? '❌ معطب' : '🔧 صيانة';

                // استخدام escapeHtml لسلامة النصوص
                var name = escapeHtml(v.name);
                var num = escapeHtml(v.num);
                var region = escapeHtml(v.region);
                var zone = escapeHtml(v.zone);
                var port = escapeHtml(v.port);
                var supp = escapeHtml(v.supp);
                var breakT = escapeHtml(v.break || '-');
                var ref = escapeHtml(v.ref || '');

                html += '<tr>' +
                    '<td class="vessel-name">' + name + '</td>' +
                    '<td>' + num + '</td>' +
                    '<td>' + escapeHtml(v.len) + '</td>' +
                    '<td>' + escapeHtml(cat) + '</td>' +
                    '<td>' + region + '</td>' +
                    '<td>' + zone + '</td>' +
                    '<td>' + port + '</td>' +
                    '<td>' + supp + '</td>' +
                    '<td style="color:' + statusColor + ';font-weight:700;">' + statusLabel + '</td>' +
                    '<td>' + breakT + '</td>' +
                    '<td>' + formatDate(v.fDate) + '</td>' +
                    '<td>' + formatDate(v.eDate) + '</td>' +
                    '<td><button class="btn-sm edit" data-id="' + v._id + '"><i class="fas fa-edit"></i></button> ' +
                    '<button class="btn-sm delete" data-id="' + v._id + '"><i class="fas fa-trash"></i></button></td>' +
                    '</tr>';
            });
            tbody.innerHTML = html;

            // ===== ربط الأحداث بطريقة آمنة بدلاً من onclick في HTML =====
            tbody.querySelectorAll('.btn-sm.edit').forEach(function(btn) {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    editVessel(this.getAttribute('data-id'));
                };
            });
            tbody.querySelectorAll('.btn-sm.delete').forEach(function(btn) {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    deleteVessel(this.getAttribute('data-id'));
                };
            });
        }

        // ===== تحديث الإحصائيات =====
        function updateStats() {
            var totalEl = document.getElementById('totalVessels');
            var activeEl = document.getElementById('activeVessels');
            var maintEl = document.getElementById('maintenanceVessels');
            var damagedEl = document.getElementById('damagedVessels');
            if (!totalEl || !activeEl || !maintEl || !damagedEl) return;

            var total = fleetData.length;
            var active = fleetData.filter(function(v) { return v.stat === 'صالح'; }).length;
            var maintenance = fleetData.filter(function(v) { return v.stat === 'صيانة'; }).length;
            var damaged = fleetData.filter(function(v) { return v.stat === 'معطب'; }).length;

            totalEl.textContent = total;
            activeEl.textContent = active;
            maintEl.textContent = maintenance;
            damagedEl.textContent = damaged;
        }

        // ===== تحميل البيانات =====
        async function loadData() {
            await fetchVessels();
            updateStats();
            renderTable();
        }

        // ===== دوال مساعدة =====
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function formatDate(val) {
            if (!val) return '-';
            try {
                var d = new Date(val);
                if (isNaN(d.getTime())) return val;
                return d.toLocaleDateString('ar-TN');
            } catch { return val; }
        }

        function clearForm() {
            ['iName', 'iNum', 'iLen', 'iPort', 'iSupp', 'iBreak', 'iDate', 'iEnd', 'iRef'].forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.value = '';
            });
            var reg = document.getElementById('iReg');
            if (reg) reg.value = '';
            var zone = document.getElementById('iZone');
            if (zone) zone.innerHTML = '<option value="">المنطقة</option>';
            var stat = document.getElementById('iStat');
            if (stat) stat.value = 'صالح';
            resetSaveButton();
            editId = null;
        }

        function resetSaveButton() {
            var btn = document.querySelector('.btn-save');
            if (btn) {
                btn.innerHTML = '<i class="fas fa-save"></i> حفظ المركب';
                btn.onclick = function() { addVessel(); };
            }
            editId = null;
        }

        function updateZones() {
            var reg = document.getElementById('iReg');
            var zoneSel = document.getElementById('iZone');
            if (!reg || !zoneSel) return;

            var zones = {
                'الشمال': ['تونس', 'بنزرت', 'طبرقة'],
                'الساحل': ['سوسة', 'المنستير', 'نابل'],
                'الوسط': ['صفاقس', 'المهدية', 'قرقنة'],
                'الجنوب': ['جرجيس', 'جربة', 'قابس']
            };
            zoneSel.innerHTML = '<option value="">المنطقة</option>';
            if (zones[reg.value]) {
                zones[reg.value].forEach(function(z) {
                    zoneSel.innerHTML += '<option value="' + z + '">' + z + '</option>';
                });
            }
        }

        function clearSearch() {
            var search = document.getElementById('searchMain');
            var cat = document.getElementById('fCatMain');
            var reg = document.getElementById('fRegMain');
            if (search) search.value = '';
            if (cat) cat.value = 'الكل';
            if (reg) reg.value = 'الكل';
            renderTable();
            showToast('🔄 تم مسح الفلاتر', 'info');
        }

        // ===== إضافة مركب =====
        async function addVessel() {
            var name = document.getElementById('iName');
            var num = document.getElementById('iNum');
            var len = document.getElementById('iLen');
            var region = document.getElementById('iReg');
            var zone = document.getElementById('iZone');
            var port = document.getElementById('iPort');
            var supp = document.getElementById('iSupp');
            var stat = document.getElementById('iStat');
            var breakT = document.getElementById('iBreak');
            var fDate = document.getElementById('iDate');
            var eDate = document.getElementById('iEnd');
            var ref = document.getElementById('iRef');

            // التحقق من وجود العناصر
            if (!name || !num || !len || !region || !zone) return;

            var nameVal = name.value.trim();
            var numVal = num.value.trim();
            var lenVal = len.value;
            var regionVal = region.value;
            var zoneVal = zone.value;
            var portVal = port ? port.value.trim() : '';
            var suppVal = supp ? supp.value.trim() : '';
            var statVal = stat ? stat.value : 'صالح';
            var breakVal = breakT ? breakT.value.trim() : '';
            var fDateVal = fDate ? fDate.value : '';
            var eDateVal = eDate ? eDate.value : '';
            var refVal = ref ? ref.value.trim() : '';

            if (!nameVal || !numVal || !lenVal || !regionVal || !zoneVal) {
                showToast('⚠️ يرجى ملء جميع الحقول المطلوبة', 'warning');
                return;
            }

            if ((statVal === 'معطب' || statVal === 'صيانة') && !fDateVal) {
                showToast('⚠️ تاريخ العطب مطلوب', 'warning');
                return;
            }

            var vesselData = {
                name: nameVal,
                num: numVal,
                len: parseFloat(lenVal),
                region: regionVal,
                zone: zoneVal,
                port: portVal || '-',
                supp: suppVal || '-',
                stat: statVal,
                break: breakVal || '-',
                fDate: fDateVal || null,
                eDate: eDateVal || null,
                ref: refVal || ''
            };

            try {
                var response = await fetch('/api/vessels', {
                    method: 'POST',
                    headers: getHeaders(),
                    credentials: 'include',
                    body: JSON.stringify(vesselData)
                });

                if (response.status === 401) {
                    showToast('⚠️ جلسة منتهية، يرجى تسجيل الدخول', 'warning');
                    window.location.replace('/');
                    return;
                }

                if (!response.ok) {
                    var errData = await response.json();
                    throw new Error(errData.error || 'فشل الإضافة');
                }

                var data = await response.json();
                if (data.success) {
                    clearForm();
                    await loadData();
                    showToast('✅ تم إضافة المركب بنجاح', 'success');
                } else {
                    throw new Error(data.error || 'فشل الإضافة');
                }

            } catch (error) {
                console.error('❌ Add vessel error:', error);
                showToast('❌ ' + error.message, 'error');
            }
        }

        // ===== تعديل مركب =====
        function editVessel(id) {
            var v = fleetData.find(function(item) { return item._id === id; });
            if (!v) {
                showToast('⚠️ المركب غير موجود', 'error');
                return;
            }

            editId = id;

            var name = document.getElementById('iName');
            var num = document.getElementById('iNum');
            var len = document.getElementById('iLen');
            var region = document.getElementById('iReg');
            var zone = document.getElementById('iZone');
            var port = document.getElementById('iPort');
            var supp = document.getElementById('iSupp');
            var stat = document.getElementById('iStat');
            var breakT = document.getElementById('iBreak');
            var fDate = document.getElementById('iDate');
            var eDate = document.getElementById('iEnd');
            var ref = document.getElementById('iRef');

            if (name) name.value = v.name || '';
            if (num) num.value = v.num || '';
            if (len) len.value = v.len || '';
            if (region) region.value = v.region || '';
            // تحديث المناطق بناءً على الإقليم الجديد
            updateZones();
            // تعيين المنطقة بعد التحديث مباشرة
            if (zone) zone.value = v.zone || '';
            if (port) port.value = v.port || '';
            if (supp) supp.value = v.supp || '';
            if (stat) stat.value = v.stat || 'صالح';
            if (breakT) breakT.value = v.break || '';
            if (fDate) fDate.value = v.fDate ? v.fDate.split('T')[0] : '';
            if (eDate) eDate.value = v.eDate ? v.eDate.split('T')[0] : '';
            if (ref) ref.value = v.ref || '';

            var btn = document.querySelector('.btn-save');
            if (btn) {
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث المركب';
                btn.onclick = function() { updateVessel(); };
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast('✏️ قم بتعديل البيانات ثم اضغط تحديث', 'info');
        }

        // ===== تحديث مركب =====
        async function updateVessel() {
            if (!editId) {
                showToast('⚠️ لا يوجد مركب للتحديث', 'error');
                return;
            }

            var name = document.getElementById('iName');
            var num = document.getElementById('iNum');
            var len = document.getElementById('iLen');
            var region = document.getElementById('iReg');
            var zone = document.getElementById('iZone');
            var port = document.getElementById('iPort');
            var supp = document.getElementById('iSupp');
            var stat = document.getElementById('iStat');
            var breakT = document.getElementById('iBreak');
            var fDate = document.getElementById('iDate');
            var eDate = document.getElementById('iEnd');
            var ref = document.getElementById('iRef');

            if (!name || !num || !len || !region || !zone) return;

            var nameVal = name.value.trim();
            var numVal = num.value.trim();
            var lenVal = len.value;
            var regionVal = region.value;
            var zoneVal = zone.value;
            var portVal = port ? port.value.trim() : '';
            var suppVal = supp ? supp.value.trim() : '';
            var statVal = stat ? stat.value : 'صالح';
            var breakVal = breakT ? breakT.value.trim() : '';
            var fDateVal = fDate ? fDate.value : '';
            var eDateVal = eDate ? eDate.value : '';
            var refVal = ref ? ref.value.trim() : '';

            if (!nameVal || !numVal || !lenVal || !regionVal || !zoneVal) {
                showToast('⚠️ يرجى ملء جميع الحقول المطلوبة', 'warning');
                return;
            }

            var vesselData = {
                name: nameVal,
                num: numVal,
                len: parseFloat(lenVal),
                region: regionVal,
                zone: zoneVal,
                port: portVal || '-',
                supp: suppVal || '-',
                stat: statVal,
                break: breakVal || '-',
                fDate: fDateVal || null,
                eDate: eDateVal || null,
                ref: refVal || ''
            };

            try {
                var response = await fetch('/api/vessels/' + editId, {
                    method: 'PUT',
                    headers: getHeaders(),
                    credentials: 'include',
                    body: JSON.stringify(vesselData)
                });

                if (response.status === 401) {
                    showToast('⚠️ جلسة منتهية، يرجى تسجيل الدخول', 'warning');
                    window.location.replace('/');
                    return;
                }

                if (!response.ok) {
                    var errData = await response.json();
                    throw new Error(errData.error || 'فشل التحديث');
                }

                var data = await response.json();
                if (data.success) {
                    clearForm();
                    resetSaveButton();
                    editId = null;
                    await loadData();
                    showToast('✅ تم تحديث المركب بنجاح', 'success');
                } else {
                    throw new Error(data.error || 'فشل التحديث');
                }

            } catch (error) {
                console.error('❌ Update vessel error:', error);
                showToast('❌ ' + error.message, 'error');
            }
        }

        // ===== حذف مركب =====
        async function deleteVessel(id) {
            var v = fleetData.find(function(item) { return item._id === id; });
            if (!v) {
                showToast('⚠️ المركب غير موجود', 'error');
                return;
            }

            if (!confirm('⚠️ هل أنت متأكد من حذف "' + v.name + '"؟')) return;

            try {
                var response = await fetch('/api/vessels/' + id, {
                    method: 'DELETE',
                    headers: getHeaders(),
                    credentials: 'include'
                });

                if (response.status === 401) {
                    showToast('⚠️ جلسة منتهية، يرجى تسجيل الدخول', 'warning');
                    window.location.replace('/');
                    return;
                }

                if (!response.ok) {
                    var errData = await response.json();
                    throw new Error(errData.error || 'فشل الحذف');
                }

                var data = await response.json();
                if (data.success) {
                    await loadData();
                    showToast('🗑️ تم حذف المركب بنجاح', 'success');
                } else {
                    throw new Error(data.error || 'فشل الحذف');
                }

            } catch (error) {
                console.error('❌ Delete vessel error:', error);
                showToast('❌ ' + error.message, 'error');
            }
        }

        // ===== تهيئة الفلاتر =====
        function initFilters() {
            var cats = ['البروق', 'صقور', 'خوافر', 'زوارق مزدوجة', 'طوافات'];
            var catSelect = document.getElementById('fCatMain');
            if (catSelect) {
                catSelect.innerHTML = '<option value="الكل">الكل</option>';
                cats.forEach(function(c) {
                    catSelect.innerHTML += '<option value="' + c + '">' + c + '</option>';
                });
            }

            var regs = ['الشمال', 'الساحل', 'الوسط', 'الجنوب'];
            var regSelect = document.getElementById('fRegMain');
            if (regSelect) {
                regSelect.innerHTML = '<option value="الكل">الكل</option>';
                regs.forEach(function(r) {
                    regSelect.innerHTML += '<option value="' + r + '">' + r + '</option>';
                });
            }
        }

        // ===== التهيئة الرئيسية (آمنة للتحميل الديناميكي) =====
        function initFleet() {
            // منع التهيئة المتكررة
            if (isInitialized) return;
            
            try {
                console.log('🚢 Fleet initializing...');

                // التحقق من وجود العنصر الرئيسي في الصفحة
                var page = document.getElementById('page-fleet');
                if (!page) {
                    console.warn('⚠️ page-fleet not found, retrying later...');
                    return;
                }

                // التأكد من أن الصفحة مرئية (يمنع التشويش)
                page.style.display = 'block';
                page.style.width = '100%';

                // تهيئة الفلاتر والمناطق
                initFilters();
                updateZones();

                // ربط زر التحديث
                var refreshBtn = document.getElementById('refreshBtn');
                if (refreshBtn) {
                    refreshBtn.onclick = function() {
                        showToast('🔄 جاري تحديث البيانات...', 'info');
                        loadData();
                    };
                }

                // ربط تغيير الإقليم بمنطقة التحديد
                var regSelect = document.getElementById('iReg');
                if (regSelect) {
                    regSelect.onchange = function() {
                        updateZones();
                    };
                }

                // ربط أحداث البحث والفلترة المباشرة
                var searchMain = document.getElementById('searchMain');
                if (searchMain) {
                    searchMain.onkeyup = function() { renderTable(); };
                }
                var fCatMain = document.getElementById('fCatMain');
                if (fCatMain) {
                    fCatMain.onchange = function() { renderTable(); };
                }
                var fRegMain = document.getElementById('fRegMain');
                if (fRegMain) {
                    fRegMain.onchange = function() { renderTable(); };
                }

                // تحميل البيانات
                loadData().then(function() {
                    console.log('✅ Fleet page ready, ' + fleetData.length + ' vessels loaded');
                });

                isInitialized = true;

            } catch (error) {
                console.error('❌ Fleet initialization error:', error);
                showToast('⚠️ حدث خطأ في تهيئة الصفحة، حاول التحديث', 'error');
            }
        }

        // ===== تعريض الدوال للنطاق العام (لتكون متاحة للصفحة) =====
        window.addVessel = addVessel;
        window.editVessel = editVessel;
        window.updateVessel = updateVessel;
        window.deleteVessel = deleteVessel;
        window.renderTable = renderTable;
        window.clearSearch = clearSearch;
        window.updateZones = updateZones;
        window.initFleet = initFleet;
        window.showToast = showToast;
        window.loadData = loadData;

        // ===== تشغيل التهيئة =====
        // الانتظار قليلاً للتأكد من اكتمال تحميل DOM، خصوصاً في حال التحميل الديناميكي
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(initFleet, 0);
            });
        } else {
            setTimeout(initFleet, 0);
        }

    })();
</script>
