<!-- public/pages/fleet.html -->
<div id="page-fleet">
    <style>
        /* ============================================================
           🚢 FLEET PAGE - GOLD EDITION v9.12
           ============================================================ */

        :root {
            --primary-dark: #0a1628;
            --primary: #0f3460;
            --primary-light: #1a4f8a;
            --secondary: #e94560;
            --secondary-light: #ff6b81;
            --gold: #e6b31e;
            --gold-light: #f5d76e;
            --gold-dark: #c99a0e;
            --success: #00b894;
            --success-light: #55efc4;
            --danger: #e17055;
            --warning: #fdcb6e;
            --info: #0984e3;
            --glass-bg: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.06);
            --shadow-gold: 0 0 40px rgba(230,179,30,0.08);
            --shadow-card: 0 8px 32px rgba(0,0,0,0.15);
            --shadow-hover: 0 12px 48px rgba(0,0,0,0.25);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.4s cubic-bezier(0.4,0,0.2,1);
            --font: 'Cairo', 'Segoe UI', system-ui, sans-serif;
        }

        #page-fleet {
            width: 100%;
            max-width: 100%;
            padding: 0;
            margin: 0;
            font-family: var(--font);
            background: #0a0e1a;
            color: #e8edf5;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        #page-fleet::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(230,179,30,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(233,69,96,0.03) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
            animation: bgPulse 15s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(2deg); }
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-light); }

        .fleet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 64px;
            z-index: 10;
            margin: 0;
            width: 100%;
        }

        .fleet-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .fleet-header-left .header-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #0a1628;
            box-shadow: var(--shadow-gold);
            animation: pulseGold 2s ease-in-out infinite;
        }

        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 20px rgba(230,179,30,0.1); }
            50% { box-shadow: 0 0 40px rgba(230,179,30,0.2); }
        }

        .fleet-header-left h2 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold-light), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .fleet-header-left p {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin: 0;
            -webkit-text-fill-color: rgba(255,255,255,0.3);
        }

        .fleet-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .fleet-header-actions .btn-action {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
        }

        .fleet-header-actions .btn-action.primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0a1628;
            box-shadow: var(--shadow-gold);
        }

        .fleet-header-actions .btn-action.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,179,30,0.3);
        }

        .fleet-header-actions .btn-action.secondary {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: rgba(255,255,255,0.5);
        }

        .fleet-header-actions .btn-action.secondary:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            padding: 16px 24px;
            margin: 0;
            width: 100%;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 16px 18px;
            text-align: center;
            transition: all var(--transition);
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            opacity: 0.6;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(230,179,30,0.15);
            box-shadow: var(--shadow-hover);
        }

        .stat-card .number {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        .stat-card .number.gold { color: var(--gold-light); }
        .stat-card .number.green { color: var(--success-light); }
        .stat-card .number.yellow { color: var(--warning); }
        .stat-card .number.red { color: var(--danger); }

        .stat-card .label {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .stat-card .icon-bg {
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 50px;
            opacity: 0.04;
            pointer-events: none;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 16px 20px;
            border-radius: var(--radius);
            margin: 0 24px 16px;
            transition: all var(--transition);
        }

        .input-grid:hover {
            border-color: rgba(230,179,30,0.15);
            box-shadow: var(--shadow-hover);
        }

        .input-grid input,
        .input-grid select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.8rem;
            transition: all var(--transition);
            font-family: var(--font);
        }

        .input-grid input:focus,
        .input-grid select:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 4px rgba(230,179,30,0.06);
            background: rgba(255,255,255,0.06);
        }

        .input-grid input::placeholder {
            color: rgba(255,255,255,0.15);
        }

        .input-grid select option {
            background: #0a1628;
            color: #e2e8f0;
        }

        .input-grid .btn-save {
            grid-column: span 1;
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: var(--font);
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0a1628;
            box-shadow: var(--shadow-gold);
        }

        .input-grid .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,179,30,0.3);
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            padding: 10px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
            margin: 0;
            width: 100%;
        }

        .filter-bar .search-input {
            flex: 2 1 200px;
            min-width: 150px;
            position: relative;
        }

        .filter-bar .search-input input {
            width: 100%;
            padding: 8px 16px 8px 40px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.8rem;
            transition: all var(--transition);
            font-family: var(--font);
        }

        .filter-bar .search-input input:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 4px rgba(230,179,30,0.06);
            background: rgba(255,255,255,0.06);
        }

        .filter-bar .search-input input::placeholder {
            color: rgba(255,255,255,0.15);
        }

        .filter-bar .search-input .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.1);
            font-size: 0.8rem;
        }

        .filter-bar label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-bar select {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.75rem;
            min-width: 100px;
            cursor: pointer;
            font-family: var(--font);
        }

        .filter-bar select:focus {
            outline: none;
            border-color: var(--gold);
        }

        .filter-bar select option {
            background: #0a1628;
            color: #e2e8f0;
        }

        .filter-bar .btn-filter {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-bar .btn-filter.primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0a1628;
        }

        .filter-bar .btn-filter.primary:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 20px rgba(230,179,30,0.2);
        }

        .filter-bar .btn-filter.outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: rgba(255,255,255,0.3);
        }

        .filter-bar .btn-filter.outline:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 0 24px 24px;
            width: 100%;
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            min-width: 900px;
            border-radius: var(--radius);
            overflow: hidden;
        }

        thead {
            background: rgba(15,52,96,0.4);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(230,179,30,0.15);
        }

        thead th {
            padding: 12px 10px;
            text-align: right;
            font-weight: 700;
            font-size: 0.6rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.8px;
            white-space: nowrap;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        thead th i {
            margin-left: 6px;
            color: var(--gold);
            font-size: 0.7rem;
        }

        tbody td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            vertical-align: middle;
            color: rgba(255,255,255,0.6);
            font-size: 0.78rem;
        }

        tbody tr {
            transition: all var(--transition);
            border-radius: 4px;
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }

        tbody tr.damaged {
            border-right: 3px solid var(--danger);
            background: rgba(225,112,85,0.04);
        }

        tbody tr.damaged:hover {
            background: rgba(225,112,85,0.08);
        }

        .vessel-name {
            font-weight: 700;
            color: #fff;
        }

        .status-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }

        .status-badge.active { background: rgba(74,222,128,0.12); color: #4ade80; }
        .status-badge.pending { background: rgba(251,191,36,0.12); color: #fbbf24; }
        .status-badge.completed { background: rgba(96,165,250,0.12); color: #60a5fa; }
        .status-badge.cancelled { background: rgba(248,113,113,0.12); color: #f87171; }
        .status-badge.damaged { background: rgba(225,112,85,0.12); color: #e17055; }

        .action-btns {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-sm {
            padding: 4px 10px;
            border: none;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: var(--font);
        }

        .btn-sm i {
            font-size: 0.55rem;
        }

        .btn-sm.edit {
            background: rgba(230,179,30,0.12);
            color: var(--gold);
        }

        .btn-sm.edit:hover {
            background: var(--gold);
            color: #0a1628;
            transform: scale(1.05);
        }

        .btn-sm.delete {
            background: rgba(225,112,85,0.12);
            color: var(--danger);
        }

        .btn-sm.delete:hover {
            background: var(--danger);
            color: #fff;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            color: rgba(255,255,255,0.04);
            display: block;
            margin-bottom: 12px;
        }

        .empty-state .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.04);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: rgba(255,255,255,0.2);
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.1);
        }

        .empty-state .retry-btn {
            margin-top: 12px;
            padding: 8px 24px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0a1628;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }

        .empty-state .retry-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 24px rgba(230,179,30,0.2);
        }

        @media (max-width: 992px) {
            .fleet-header { padding: 12px 16px; top: 60px; }
            .fleet-header-left h2 { font-size: 18px; }
            .stats-grid { padding: 12px 16px; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
            .input-grid { padding: 12px 16px; margin: 0 16px 12px; }
            .filter-bar { padding: 8px 16px; gap: 6px 10px; }
            .table-wrapper { padding: 0 16px 16px; }
        }

        @media (max-width: 768px) {
            .fleet-header { flex-direction: column; align-items: flex-start; padding: 12px 16px; top: 56px; }
            .fleet-header-left { width: 100%; }
            .fleet-header-left h2 { font-size: 16px; }
            .fleet-header-actions { width: 100%; justify-content: flex-start; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px 16px; }
            .stat-card { padding: 12px 14px; }
            .stat-card .number { font-size: 20px; }
            .input-grid { grid-template-columns: 1fr 1fr; padding: 10px 12px; margin: 0 12px 10px; gap: 8px; }
            .input-grid .btn-save { grid-column: span 2; }
            .filter-bar { flex-direction: column; align-items: stretch; padding: 10px 16px; gap: 6px; }
            .filter-bar .search-input { flex: 1; }
            .filter-bar label { font-size: 0.65rem; }
            .filter-bar select { min-width: 100%; }
            .table-wrapper { padding: 0 12px 12px; }
            .table-wrapper table { font-size: 0.7rem; min-width: 700px; }
            thead th, tbody td { padding: 6px 4px; }
            .fleet-header-actions .btn-action { padding: 6px 12px; font-size: 0.7rem; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
            .stat-card { padding: 10px 12px; }
            .stat-card .number { font-size: 18px; }
            .stat-card .label { font-size: 9px; }
            .fleet-header-left .header-icon { width: 36px; height: 36px; font-size: 16px; }
            .fleet-header-left h2 { font-size: 14px; }
            .fleet-header-left p { font-size: 10px; }
            .input-grid { grid-template-columns: 1fr; }
            .input-grid .btn-save { grid-column: span 1; }
        }
    </style>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <div class="fleet-header">
        <div class="fleet-header-left">
            <div class="header-icon">
                <i class="fas fa-ship"></i>
            </div>
            <div>
                <h2>السجل العام للأسطول</h2>
                <p>إدارة ومتابعة جميع المراكب البحرية</p>
            </div>
        </div>
        <div class="fleet-header-actions">
            <button class="btn-action primary" onclick="refreshFleet()">
                <i class="fas fa-sync-alt"></i> تحديث
            </button>
        </div>
    </div>

    <!-- ============================================================
    STATS CARDS
    ============================================================ -->
    <div class="stats-grid" id="fleetStats">
        <div class="stat-card">
            <div class="number gold" id="totalVessels">0</div>
            <div class="label">🚢 إجمالي المراكب</div>
            <span class="icon-bg"><i class="fas fa-ship"></i></span>
        </div>
        <div class="stat-card">
            <div class="number green" id="activeVessels">0</div>
            <div class="label">✅ الصالح</div>
            <span class="icon-bg"><i class="fas fa-check-circle"></i></span>
        </div>
        <div class="stat-card">
            <div class="number yellow" id="maintenanceVessels">0</div>
            <div class="label">🔧 تحت الصيانة</div>
            <span class="icon-bg"><i class="fas fa-tools"></i></span>
        </div>
        <div class="stat-card">
            <div class="number red" id="damagedVessels">0</div>
            <div class="label">🟥 المعطوبة</div>
            <span class="icon-bg"><i class="fas fa-exclamation-triangle"></i></span>
        </div>
    </div>

    <!-- ============================================================
    INPUT FORM
    ============================================================ -->
    <div id="inputArea" class="input-grid">
        <input type="text" id="iName" placeholder="اسم المركب">
        <input type="text" id="iNum" placeholder="الرقم">
        <input type="number" id="iLen" placeholder="الطول (م)" step="0.1">
        
        <select id="iReg" onchange="updateZones()">
            <option value="">الإقليم</option>
            <option value="الشمال">🗺️ الشمال</option>
            <option value="الساحل">🗺️ الساحل</option>
            <option value="الوسط">🗺️ الوسط</option>
            <option value="الجنوب">🗺️ الجنوب</option>
            <option value="وحدة الصيانة والإسناد البحري تونس">🛠️ وحدة الصيانة تونس</option>
            <option value="وحدة الصيانة والإسناد البحري المنستير">🛠️ وحدة الصيانة المنستير</option>
            <option value="وحدة الصيانة والإسناد البحري صفاقس">🛠️ وحدة الصيانة صفاقس</option>
            <option value="وحدة الصيانة والإسناد البحري جرجيس">🛠️ وحدة الصيانة جرجيس</option>
            <option value="المجمع الأمني بقبيبة">🏛️ المجمع الأمني بقبيبة</option>
        </select>
        
        <select id="iZone">
            <option value="">المنطقة</option>
        </select>
        
        <input type="text" id="iPort" placeholder="الميناء">
        <input type="text" id="iSupp" placeholder="مكان التعزيز">
        
        <select id="iStat">
            <option value="صالح">✅ صالح</option>
            <option value="معطب">❌ معطب</option>
            <option value="صيانة">🔧 صيانة</option>
        </select>
        
        <input type="text" id="iBreak" placeholder="نوع العطب">
        <input type="date" id="iDate">
        <input type="date" id="iEnd">
        <input type="text" id="iRef" placeholder="المرجع">
        
        <select id="iRepairUnit">
            <option value="">الوحدة المسؤولة عن الإصلاح</option>
            <option value="وحدة الصيانة تونس">🛠️ وحدة الصيانة تونس</option>
            <option value="وحدة الصيانة المنستير">🛠️ وحدة الصيانة المنستير</option>
            <option value="وحدة الصيانة صفاقس">🛠️ وحدة الصيانة صفاقس</option>
            <option value="وحدة الصيانة جرجيس">🛠️ وحدة الصيانة جرجيس</option>
            <option value="المجمع الأمني بقبيبة">🏛️ المجمع الأمني بقبيبة</option>
            <option value="خارجي">🔧 خارجي</option>
        </select>
        
        <button id="saveVesselBtn" class="btn-save" onclick="addItem()">
            <i class="fas fa-save"></i> حفظ المركب
        </button>
    </div>

    <!-- ============================================================
    FILTER BAR
    ============================================================ -->
    <div class="filter-bar">
        <div class="search-input">
            <input type="text" id="searchMain" placeholder="بحث في السجل..." onkeyup="renderMain()">
            <span class="search-icon"><i class="fas fa-search"></i></span>
        </div>

        <label><i class="fas fa-tag"></i> الفئة:</label>
        <select id="fCatMain" onchange="renderMain()">
            <option value="الكل">الكل</option>
        </select>

        <label><i class="fas fa-map"></i> الإقليم:</label>
        <select id="fRegMain" onchange="renderMain()">
            <option value="الكل">الكل</option>
        </select>

        <button class="btn-filter primary" onclick="renderMain()">
            <i class="fas fa-filter"></i> فلترة
        </button>
        <button class="btn-filter outline" onclick="clearMainSearch()">
            <i class="fas fa-undo-alt"></i> مسح
        </button>
    </div>

    <!-- ============================================================
    TABLE
    ============================================================ -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th><i class="fas fa-ship"></i> الاسم</th>
                    <th><i class="fas fa-hashtag"></i> الرقم</th>
                    <th><i class="fas fa-ruler"></i> الطول</th>
                    <th><i class="fas fa-tag"></i> الفئة</th>
                    <th><i class="fas fa-map"></i> الإقليم</th>
                    <th><i class="fas fa-location-dot"></i> المنطقة</th>
                    <th><i class="fas fa-flag"></i> الميناء</th>
                    <th><i class="fas fa-handshake"></i> التعزيز</th>
                    <th><i class="fas fa-circle"></i> الحالة</th>
                    <th><i class="fas fa-wrench"></i> العطب</th>
                    <th><i class="fas fa-calendar"></i> التاريخ</th>
                    <th><i class="fas fa-calendar-check"></i> الانتهاء</th>
                    <th><i class="fas fa-tools"></i> الوحدة المسؤولة</th>
                    <th><i class="fas fa-cog"></i> إجراء</th>
                </tr>
            </thead>
            <tbody id="mainBody">
                <tr>
                    <td colspan="14" class="empty-state">
                        <div class="spinner"></div>
                        <h3>جاري التحميل...</h3>
                        <p>يرجى الانتظار</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ============================================================
    // 🚢 FLEET PAGE - GOLD EDITION v9.12
    // ✨ 5 Roles + normalizeRole + apiFetch + Cleanup
    // ============================================================
    (function() {
        'use strict';

        // ============================================================
        // ✅ CLEANUP STATE
        // ============================================================
        var _isDestroyed = false;

        function _fleetCleanup() {
            if (_isDestroyed) return;
            _isDestroyed = true;

            try {
                delete window.renderMain;
                delete window.addItem;
                delete window.editItem;
                delete window.updateItem;
                delete window.deleteItem;
                delete window.clearMainSearch;
                delete window.updateZones;
                delete window.refreshFleet;
            } catch (e) {}

            console.log('🧹 Fleet v9.12 cleanup done');
        }

        window._pageCleanup = window._pageCleanup || [];
        window._pageCleanup.push(_fleetCleanup);

        window.addEventListener('beforeunload', _fleetCleanup);
        window.addEventListener('pagehide', _fleetCleanup);

        // ============================================================
        // 🔐 RBAC v9.12 — توحيد الأدوار
        // ============================================================
        // مطابق تمامًا لـ LEGACY_ROLE_MAP في server.js

        var LEGACY_ROLE_MAP = {
            'super_admin': 'admin',
            'مسؤول': 'admin',
            'مدير': 'manager',
            'محرر': 'editor',
            'مشغل': 'maintenance_unit',
            'operator': 'maintenance_unit',
            'user': 'viewer',
            'مشاهد': 'viewer'
        };

        var ALLOWED_ROLES = ['admin', 'manager', 'editor', 'maintenance_unit', 'viewer'];

        function normalizeRole(role) {
            if (!role) return 'viewer';
            var r = String(role).trim();
            if (ALLOWED_ROLES.indexOf(r) !== -1) return r;
            return LEGACY_ROLE_MAP[r] || 'viewer';
        }

        // ============================================================
        // 1. DATA
        // ============================================================

        if (typeof ZONES_DATA === 'undefined') {
            window.ZONES_DATA = {
                "الشمال": ["تونس", "بنزرت", "طبرقة"],
                "الساحل": ["سوسة", "المنستير", "نابل"],
                "الوسط": ["صفاقس", "المهدية", "قرقنة"],
                "الجنوب": ["جرجيس", "جربة", "قابس"],
                "وحدة الصيانة والإسناد البحري تونس": ["تونس"],
                "وحدة الصيانة والإسناد البحري المنستير": ["المنستير"],
                "وحدة الصيانة والإسناد البحري صفاقس": ["صفاقس"],
                "وحدة الصيانة والإسناد البحري جرجيس": ["جرجيس"],
                "المجمع الأمني بقبيبة": ["قبيبة"]
            };
        }

        if (typeof CATS_LIST === 'undefined') {
            window.CATS_LIST = ['البروق', 'صقور', 'خوافر', 'زوارق مزدوجة', 'طوافات'];
        }

        var ZONES_DATA = window.ZONES_DATA;
        var CATS_LIST = window.CATS_LIST;

        // ============================================================
        // 2. TOKEN FUNCTIONS
        // ============================================================

        function getToken() {
            return localStorage.getItem('marine_token') ||
                   localStorage.getItem('token') ||
                   localStorage.getItem('authToken') ||
                   localStorage.getItem('accessToken') ||
                   null;
        }

        // ✅ استخدم apiFetch إن وُجد (من index.html v9.12)
        function fetcher(url, options) {
            if (typeof window.apiFetch === 'function') {
                return window.apiFetch(url, options || {});
            }
            // fallback
            var headers = Object.assign({}, (options && options.headers) || {});
            var token = getToken();
            if (token) headers['Authorization'] = 'Bearer ' + token;
            if (!headers['Accept']) headers['Accept'] = 'application/json';
            return fetch(url, Object.assign({}, options || {}, { headers: headers, credentials: 'include' }));
        }

        // ============================================================
        // 3. PERMISSIONS — v9.12
        // ============================================================
        // ✅ يستخدم window.capabilities أولاً (المصدر الرسمي)
        // ✅ وإلا يعتمد على role مع normalizeRole

        function getUser() {
            return window.currentUser || null;
        }

        // ✅ إضافة / تعديل مركب: admin + manager + editor + maintenance_unit
        function canEdit() {
            if (window.capabilities && typeof window.capabilities.canCreateVessels === 'boolean') {
                return window.capabilities.canCreateVessels || window.capabilities.canUpdateVessels;
            }

            var user = getUser();
            if (!user) return false;
            var role = normalizeRole(user.role);
            return ['admin', 'manager', 'editor', 'maintenance_unit'].indexOf(role) !== -1;
        }

        // ✅ حذف مركب: admin فقط
        function canDelete() {
            if (window.capabilities && typeof window.capabilities.canDeleteVessels === 'boolean') {
                return window.capabilities.canDeleteVessels;
            }

            var user = getUser();
            if (!user) return false;
            return normalizeRole(user.role) === 'admin';
        }

        // ============================================================
        // 4. HELPERS
        // ============================================================

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m];
            });
        }

        function formatDate(val) {
            if (!val) return '-';
            try {
                var d = new Date(val);
                if (isNaN(d.getTime())) return escapeHtml(val);
                return String(d.getDate()).padStart(2,'0') + '/' +
                       String(d.getMonth()+1).padStart(2,'0') + '/' +
                       d.getFullYear();
            } catch (_) { return escapeHtml(val); }
        }

        function getCategory(len) {
            var n = parseFloat(len);
            if (isNaN(n)) return 'زوارق مزدوجة';
            if (n === 11) return 'البروق';
            if (n >= 8 && n <= 12) return 'صقور';
            if (n > 12 && n <= 25) return 'خوافر';
            if (n >= 30) return 'طوافات';
            return 'زوارق مزدوجة';
        }

        // ============================================================
        // 5. UPDATE ZONES
        // ============================================================

        function updateZones() {
            var regEl = document.getElementById('iReg');
            var zoneSel = document.getElementById('iZone');
            if (!regEl || !zoneSel) return;

            var reg = regEl.value;
            zoneSel.innerHTML = '<option value="">المنطقة</option>';
            if (ZONES_DATA[reg]) {
                ZONES_DATA[reg].forEach(function(z) {
                    zoneSel.innerHTML += '<option value="' + z + '">' + z + '</option>';
                });
            }
        }

        // ============================================================
        // 6. RENDER MAIN
        // ============================================================

        async function renderMain() {
            if (_isDestroyed) return;

            var mainBody = document.getElementById('mainBody');
            if (!mainBody) return;

            mainBody.innerHTML = '<tr><td colspan="14" class="empty-state">' +
                '<div class="spinner"></div>' +
                '<h3>جاري التحميل...</h3>' +
                '<p>يرجى الانتظار</p>' +
                '</td></tr>';

            try {
                var token = getToken();
                if (!token) {
                    console.warn('⚠️ لا يوجد توكن');
                    window.location.href = '/index.html';
                    return;
                }

                console.log('📡 جلب بيانات المراكب...');
                var response = await fetcher('/api/vessels', { method: 'GET' });

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('marine_token');
                        window.location.href = '/index.html';
                        return;
                    }
                    throw new Error('فشل تحميل البيانات (Status: ' + response.status + ')');
                }

                var vessels = await response.json();
                console.log('✅ تم تحميل', vessels.length, 'مركب');

                if (_isDestroyed) return;

                var total = vessels.length;
                var active = vessels.filter(function(v) { return v.status === 'صالح'; }).length;
                var maintenance = vessels.filter(function(v) { return v.status === 'صيانة'; }).length;
                var damaged = vessels.filter(function(v) { return v.status === 'معطب'; }).length;

                var tv = document.getElementById('totalVessels');
                var av = document.getElementById('activeVessels');
                var mv = document.getElementById('maintenanceVessels');
                var dv = document.getElementById('damagedVessels');
                if (tv) tv.textContent = total;
                if (av) av.textContent = active;
                if (mv) mv.textContent = maintenance;
                if (dv) dv.textContent = damaged;

                var fCatMain = document.getElementById('fCatMain');
                var fRegMain = document.getElementById('fRegMain');
                var searchMain = document.getElementById('searchMain');

                var catFilter = (fCatMain && fCatMain.value) || 'الكل';
                var regFilter = (fRegMain && fRegMain.value) || 'الكل';
                var search = ((searchMain && searchMain.value) || '').trim().toLowerCase();

                var filtered = vessels.filter(function(v) {
                    var vCat = v.cat || getCategory(v.len);
                    var vReg = v.region || v.reg || '';
                    var catMatch = (catFilter === 'الكل' || vCat === catFilter);
                    var regMatch = (regFilter === 'الكل' || vReg === regFilter);
                    return catMatch && regMatch;
                });

                if (search) {
                    filtered = filtered.filter(function(v) {
                        var text = [v.name, v.num, v.region || v.reg, v.zone, v.port, v.status, v.cat, v.repairUnit]
                            .filter(Boolean).join(' ').toLowerCase();
                        return text.indexOf(search) !== -1;
                    });
                }

                if (filtered.length === 0) {
                    mainBody.innerHTML = '<tr><td colspan="14" class="empty-state">' +
                        '<span class="empty-icon"><i class="fas fa-inbox"></i></span>' +
                        '<h3>لا توجد مراكب</h3>' +
                        '<p>لم يتم العثور على أي مراكب مطابقة</p>' +
                        '</td></tr>';
                    return;
                }

                var editable = canEdit();
                var deletable = canDelete();

                var html = '';
                filtered.forEach(function(v) {
                    var id = v._id || v.id;
                    var name = v.name || '-';
                    var number = v.num || '-';
                    var length = v.len || '-';
                    var category = v.cat || getCategory(length);
                    var region = v.region || v.reg || '-';
                    var zone = v.zone || '-';
                    var port = v.port || '-';
                    var supp = v.supp || '-';
                    var status = v.status || '-';
                    var breakType = v.break || '-';
                    var fDate = v.fDate;
                    var eDate = v.eDate;
                    var repairUnit = v.repairUnit || '-';

                    var statusColor = status === 'صالح' ? '#4ade80' : (status === 'معطب' ? '#e17055' : '#fbbf24');
                    var isDamaged = status === 'معطب';

                    var editBtn = editable ?
                        '<button class="btn-sm edit" onclick="editItem(\'' + id + '\')"><i class="fas fa-edit"></i></button>' : '';
                    var delBtn = deletable ?
                        '<button class="btn-sm delete" onclick="deleteItem(\'' + id + '\',\'' + escapeHtml(name) + '\')"><i class="fas fa-trash-alt"></i></button>' : '';

                    html += '<tr class="' + (isDamaged ? 'damaged' : '') + '">' +
                        '<td class="vessel-name">' + escapeHtml(name) + '</td>' +
                        '<td>' + escapeHtml(number) + '</td>' +
                        '<td>' + escapeHtml(length) + '</td>' +
                        '<td>' + escapeHtml(category) + '</td>' +
                        '<td>' + escapeHtml(region) + '</td>' +
                        '<td>' + escapeHtml(zone) + '</td>' +
                        '<td>' + escapeHtml(port) + '</td>' +
                        '<td>' + escapeHtml(supp) + '</td>' +
                        '<td style="color:' + statusColor + '; font-weight:700;">' + escapeHtml(status) + '</td>' +
                        '<td>' + escapeHtml(breakType) + '</td>' +
                        '<td>' + formatDate(fDate) + '</td>' +
                        '<td>' + formatDate(eDate) + '</td>' +
                        '<td>' + escapeHtml(repairUnit) + '</td>' +
                        '<td><div class="action-btns">' + editBtn + ' ' + delBtn + '</div></td>' +
                    '</tr>';
                });
                mainBody.innerHTML = html;

            } catch (err) {
                console.error('❌ renderMain error:', err);
                if (_isDestroyed) return;
                mainBody.innerHTML = '<tr><td colspan="14" class="empty-state">' +
                    '<span class="empty-icon"><i class="fas fa-exclamation-triangle" style="color:#f87171;"></i></span>' +
                    '<h3 style="color:#f87171;">خطأ في تحميل البيانات</h3>' +
                    '<p style="color:rgba(255,255,255,0.3);">' + escapeHtml(err.message) + '</p>' +
                    '<button class="retry-btn" onclick="renderMain()">' +
                    '<i class="fas fa-sync-alt"></i> إعادة المحاولة' +
                    '</button></td></tr>';
            }
        }

        // ============================================================
        // 7. ADD ITEM
        // ============================================================

        async function addItem() {
            if (_isDestroyed) return;
            if (!canEdit()) {
                alert('⚠️ ليس لديك صلاحية لإضافة مركب');
                return;
            }

            var nameEl = document.getElementById('iName');
            if (!nameEl) return;
            var name = nameEl.value.trim();
            if (!name) { alert('⚠️ يرجى إدخال اسم المركب'); return; }

            var statEl = document.getElementById('iStat');
            var dateEl = document.getElementById('iDate');
            var status = statEl ? statEl.value : 'صالح';
            var faultDate = dateEl ? dateEl.value : '';
            if ((status === 'معطب' || status === 'صيانة') && !faultDate) {
                alert('⚠️ تاريخ العطب مطلوب للمركب المعطب أو الذي تحت الصيانة');
                return;
            }

            var vessel = {
                name: name,
                num: (document.getElementById('iNum') || {}).value || '',
                len: (document.getElementById('iLen') || {}).value || '',
                region: (document.getElementById('iReg') || {}).value || '',
                zone: (document.getElementById('iZone') || {}).value || '',
                port: (document.getElementById('iPort') || {}).value || '',
                supp: (document.getElementById('iSupp') || {}).value || '',
                status: status,
                break: (document.getElementById('iBreak') || {}).value || '',
                fDate: faultDate,
                eDate: (document.getElementById('iEnd') || {}).value || '',
                ref: (document.getElementById('iRef') || {}).value || '',
                repairUnit: (document.getElementById('iRepairUnit') || {}).value || ''
            };

            try {
                var response = await fetcher('/api/vessels', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(vessel)
                });

                if (!response.ok) {
                    var error = await response.json();
                    throw new Error(error.error || 'فشل حفظ المركب');
                }

                clearForm();
                await renderMain();
                alert('✅ تم حفظ المركب بنجاح');
            } catch (err) {
                alert('❌ ' + err.message);
            }
        }

        // ============================================================
        // 8. CLEAR FORM
        // ============================================================

        function clearForm() {
            var ids = ['iName', 'iNum', 'iLen', 'iPort', 'iSupp', 'iBreak', 'iDate', 'iEnd', 'iRef'];
            ids.forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.value = '';
            });

            var iReg = document.getElementById('iReg');
            if (iReg) iReg.value = '';

            var iZone = document.getElementById('iZone');
            if (iZone) iZone.innerHTML = '<option value="">المنطقة</option>';

            var iStat = document.getElementById('iStat');
            if (iStat) iStat.value = 'صالح';

            var iRepairUnit = document.getElementById('iRepairUnit');
            if (iRepairUnit) iRepairUnit.value = '';
        }

        // ============================================================
        // 9. DELETE ITEM
        // ============================================================

        async function deleteItem(id, name) {
            if (_isDestroyed) return;
            if (!canDelete()) { alert('⚠️ ليس لديك صلاحية للحذف'); return; }
            if (!confirm('⚠️ هل أنت متأكد من حذف المركب "' + name + '"؟')) return;

            try {
                var response = await fetcher('/api/vessels/' + id, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    var error = await response.json();
                    throw new Error(error.error || 'فشل حذف المركب');
                }

                await renderMain();
                alert('✅ تم حذف المركب بنجاح');
            } catch (err) { alert('❌ ' + err.message); }
        }

        // ============================================================
        // 10. EDIT ITEM
        // ============================================================

        async function editItem(id) {
            if (_isDestroyed) return;
            if (!canEdit()) { alert('⚠️ ليس لديك صلاحية للتعديل'); return; }

            try {
                var response = await fetcher('/api/vessels', { method: 'GET' });
                if (!response.ok) throw new Error('فشل تحميل البيانات');

                var vessels = await response.json();
                var v = vessels.find(function(item) {
                    return String(item._id || item.id) === String(id);
                });
                if (!v) { alert('❌ المركب غير موجود'); return; }

                var el;
                el = document.getElementById('iName'); if (el) el.value = v.name || '';
                el = document.getElementById('iNum'); if (el) el.value = v.num || '';
                el = document.getElementById('iLen'); if (el) el.value = v.len || '';
                el = document.getElementById('iReg'); if (el) el.value = v.region || v.reg || '';
                updateZones();
                var id2 = setTimeout(function() {
                    var z = document.getElementById('iZone');
                    if (z) z.value = v.zone || '';
                }, 50);
                window._pageTimeouts = window._pageTimeouts || [];
                window._pageTimeouts.push(id2);

                el = document.getElementById('iPort'); if (el) el.value = v.port || '';
                el = document.getElementById('iSupp'); if (el) el.value = v.supp || '';
                el = document.getElementById('iStat'); if (el) el.value = v.status || 'صالح';
                el = document.getElementById('iBreak'); if (el) el.value = v.break || '';
                el = document.getElementById('iDate'); if (el) el.value = v.fDate || '';
                el = document.getElementById('iEnd'); if (el) el.value = v.eDate || '';
                el = document.getElementById('iRef'); if (el) el.value = v.ref || '';
                el = document.getElementById('iRepairUnit'); if (el) el.value = v.repairUnit || '';

                var saveBtn = document.getElementById('saveVesselBtn');
                if (saveBtn) {
                    saveBtn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث المركب';
                    saveBtn.onclick = async function() { await updateItem(id); };
                }

                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) { alert('❌ ' + err.message); }
        }

        // ============================================================
        // 11. UPDATE ITEM
        // ============================================================

        async function updateItem(id) {
            if (_isDestroyed) return;

            var nameEl = document.getElementById('iName');
            if (!nameEl) return;
            var name = nameEl.value.trim();
            if (!name) { alert('⚠️ اسم المركب مطلوب'); return; }

            var vessel = {
                name: name,
                num: (document.getElementById('iNum') || {}).value || '',
                len: (document.getElementById('iLen') || {}).value || '',
                region: (document.getElementById('iReg') || {}).value || '',
                zone: (document.getElementById('iZone') || {}).value || '',
                port: (document.getElementById('iPort') || {}).value || '',
                supp: (document.getElementById('iSupp') || {}).value || '',
                status: (document.getElementById('iStat') || {}).value || 'صالح',
                break: (document.getElementById('iBreak') || {}).value || '',
                fDate: (document.getElementById('iDate') || {}).value || '',
                eDate: (document.getElementById('iEnd') || {}).value || '',
                ref: (document.getElementById('iRef') || {}).value || '',
                repairUnit: (document.getElementById('iRepairUnit') || {}).value || ''
            };

            try {
                var response = await fetcher('/api/vessels/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(vessel)
                });

                if (!response.ok) {
                    var error = await response.json();
                    throw new Error(error.error || 'فشل تحديث المركب');
                }

                clearForm();
                var saveBtn = document.getElementById('saveVesselBtn');
                if (saveBtn) {
                    saveBtn.innerHTML = '<i class="fas fa-save"></i> حفظ المركب';
                    saveBtn.onclick = addItem;
                }
                await renderMain();
                alert('✅ تم تحديث المركب بنجاح');
            } catch (err) { alert('❌ ' + err.message); }
        }

        // ============================================================
        // 12. CLEAR SEARCH
        // ============================================================

        function clearMainSearch() {
            var s = document.getElementById('searchMain'); if (s) s.value = '';
            var c = document.getElementById('fCatMain'); if (c) c.value = 'الكل';
            var r = document.getElementById('fRegMain'); if (r) r.value = 'الكل';
            renderMain();
        }

        // ============================================================
        // 13. INIT FILTERS
        // ============================================================

        function initFilters() {
            var fCatMain = document.getElementById('fCatMain');
            var fRegMain = document.getElementById('fRegMain');
            if (!fCatMain || !fRegMain) return;

            fCatMain.innerHTML = '<option value="الكل">الكل</option>';
            CATS_LIST.forEach(function(c) {
                fCatMain.innerHTML += '<option value="' + c + '">' + c + '</option>';
            });

            fRegMain.innerHTML = '<option value="الكل">الكل</option>';
            Object.keys(ZONES_DATA).forEach(function(r) {
                fRegMain.innerHTML += '<option value="' + r + '">' + r + '</option>';
            });
        }

        // ============================================================
        // 14. REFRESH
        // ============================================================

        function refreshFleet() {
            renderMain();
        }

        // ============================================================
        // 15. INIT
        // ============================================================

        document.addEventListener('DOMContentLoaded', async function() {
            if (_isDestroyed) return;
            console.log('🚀 تحميل صفحة السجل العام - Gold Edition v9.12...');

            var token = getToken();
            if (!token) {
                console.warn('⚠️ لا يوجد توكن');
                window.location.href = '/index.html';
                return;
            }

            try {
                var response = await fetcher('/api/auth/me', { method: 'GET' });

                if (!response.ok) {
                    console.warn('⚠️ جلسة غير صالحة');
                    localStorage.removeItem('marine_token');
                    window.location.href = '/index.html';
                    return;
                }

                var data = await response.json();
                if (data.success && data.user) {
                    window.currentUser = data.user;
                    console.log('✅ المستخدم الحالي:', window.currentUser);
                    console.log('👤 الدور (الأصلي):', window.currentUser.role);
                    console.log('👤 الدور (الموحّد):', normalizeRole(window.currentUser.role));
                    console.log('🔐 canEdit:', canEdit());
                    console.log('🔐 canDelete:', canDelete());
                }
            } catch (error) {
                console.error('❌ خطأ:', error);
                window.location.href = '/index.html';
                return;
            }

            if (_isDestroyed) return;

            var addBtn = document.getElementById('saveVesselBtn');
            if (addBtn) {
                addBtn.style.display = canEdit() ? 'inline-flex' : 'none';
            }

            initFilters();
            updateZones();
            await renderMain();

            console.log('✅ صفحة السجل العام - Gold Edition v9.12 جاهزة');
        });

        // ============================================================
        // 16. GLOBAL EXPOSURE
        // ============================================================

        window.renderMain = renderMain;
        window.addItem = addItem;
        window.editItem = editItem;
        window.updateItem = updateItem;
        window.deleteItem = deleteItem;
        window.clearMainSearch = clearMainSearch;
        window.updateZones = updateZones;
        window.refreshFleet = refreshFleet;
        window.getToken = getToken;

    })();
</script>
</div>
