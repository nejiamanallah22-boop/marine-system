<script>
// ============================================================
// 🔧 MAINTENANCE PAGE - FINAL FIXED
// ============================================================

// ============================================================
// ✅ 1. قراءة التوكن مباشرة
// ============================================================

const TOKEN_KEY = 'marine_token';
const token = localStorage.getItem(TOKEN_KEY);

console.log('🔑 التوكن:', token ? '✅ موجود' : '❌ غير موجود');

// ============================================================
// ✅ 2. قراءة المراكب من window.allVessels
// ============================================================

let vesselsData = window.allVessels || [];
console.log('🚢 عدد المراكب:', vesselsData.length);

// ============================================================
// ✅ 3. إذا لم توجد بيانات، جرب جلبها من API
// ============================================================

async function loadVesselsFromAPI() {
    try {
        if (!token) return [];
        const response = await fetch('/api/vessels', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!response.ok) return [];
        const data = await response.json();
        vesselsData = Array.isArray(data) ? data : [];
        window.allVessels = vesselsData;
        console.log('✅ تم جلب المراكب من API:', vesselsData.length);
        return vesselsData;
    } catch (error) {
        console.error('❌ خطأ في جلب المراكب:', error);
        return [];
    }
}

// ============================================================
// ✅ 4. متغيرات الصيانة
// ============================================================

let maintenanceData = [];
let currentEditId = null;

// ============================================================
// ✅ 5. دوال التوكن (للتوافق)
// ============================================================

function getToken() {
    return localStorage.getItem('marine_token') ||
           localStorage.getItem('token') ||
           localStorage.getItem('authToken') ||
           localStorage.getItem('accessToken') ||
           null;
}

function getAuthHeaders() {
    const t = getToken();
    return {
        'Content-Type': 'application/json',
        'Authorization': t ? 'Bearer ' + t : ''
    };
}

// ============================================================
// ✅ 6. جلب الصيانة
// ============================================================

async function loadMaintenance() {
    try {
        const t = getToken();
        if (!t) return [];

        const response = await fetch('/api/maintenance', {
            headers: getAuthHeaders()
        });

        if (!response.ok) return [];

        const data = await response.json();
        const records = data.maintenance || data || [];

        maintenanceData = records.map(r => ({
            id: r._id || r.id || Date.now(),
            vesselId: r.vesselId || r.vessel_id || '',
            vesselName: r.vesselName || r.vessel_name || 'مركب غير معروف',
            damage: r.damage || r.break || r.damage_type || 'عطل غير محدد',
            technician: r.technician || r.assignedTo || 'غير محدد',
            date: r.date || r.fDate || r.createdAt || new Date().toISOString(),
            status: r.status || r.maintenance_status || 'قيد الإنجاز',
            cost: parseFloat(r.cost || r.totalCost || 0),
            parts: r.parts || r.spareParts || [],
            history: r.history || [],
            description: r.description || r.notes || '',
            createdAt: r.createdAt || r.date || new Date().toISOString()
        }));

        return maintenanceData;
    } catch (error) {
        console.error('❌ خطأ في جلب الصيانة:', error);
        return [];
    }
}

// ============================================================
// ✅ 7. عرض البيانات
// ============================================================

async function renderMaintenance() {
    const tbody = document.getElementById('maintenanceBody');
    tbody.innerHTML = `<tr><td colspan="8" class="empty-state"><i class="fas fa-spinner fa-pulse"></i><h3>جاري تحميل البيانات...</h3><p>يرجى الانتظار</p></td></tr>`;

    try {
        // ✅ جلب المراكب
        if (!vesselsData || vesselsData.length === 0) {
            vesselsData = await loadVesselsFromAPI();
        }

        // ✅ جلب الصيانة
        await loadMaintenance();

        // ✅ إضافة المراكب المعطوبة تلقائياً
        const damagedVessels = vesselsData.filter(v => v.stat === 'معطب' || v.status === 'معطب');
        const existingIds = new Set(maintenanceData.map(m => m.vesselId));

        damagedVessels.forEach(v => {
            const vid = v._id || v.id;
            if (!existingIds.has(vid)) {
                maintenanceData.push({
                    id: 'damaged_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    vesselId: vid,
                    vesselName: v.name || 'مركب غير معروف',
                    damage: v.break || v.break_type || 'عطل غير محدد',
                    technician: 'غير محدد',
                    date: v.fDate || v.fault_date || new Date().toISOString(),
                    status: 'معطب',
                    cost: 0,
                    parts: [],
                    history: [{ action: 'تم إضافة المركب تلقائياً من السجل العام', date: new Date().toISOString() }],
                    description: v.break || v.break_type || '',
                    createdAt: new Date().toISOString()
                });
            }
        });

        // ✅ تطبيق الفلاتر
        const search = document.getElementById('searchMaint').value.toLowerCase();
        const yearFilter = document.getElementById('yearFilter').value;
        const statusFilter = document.getElementById('statusFilter').value;

        let filtered = maintenanceData.filter(r => {
            const searchText = [r.vesselName, r.damage, r.technician, r.description].filter(Boolean).join(' ').toLowerCase();
            const matchSearch = !search || searchText.includes(search);
            const year = r.date ? new Date(r.date).getFullYear().toString() : '';
            const matchYear = yearFilter === 'الكل' || year === yearFilter;
            const matchStatus = statusFilter === 'الكل' || r.status === statusFilter;
            return matchSearch && matchYear && matchStatus;
        });

        // ✅ ترتيب حسب التاريخ
        filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="empty-state"><i class="fas fa-inbox"></i><h3>لا توجد مهام صيانة</h3><p>قم بإضافة مهمة صيانة جديدة</p><button onclick="openAddMaintenance()" style="margin-top:10px;padding:6px 20px;background:linear-gradient(135deg,#e94560,#f5c842);border:none;border-radius:30px;color:#0a1628;font-weight:600;cursor:pointer;"><i class="fas fa-plus"></i> إضافة صيانة</button></td></tr>`;
            updateStats();
            initFilters();
            return;
        }

        let html = '';
        filtered.forEach((r, index) => {
            const statusMap = { 'مكتملة': 'completed', 'ملغية': 'cancelled', 'قيد الإنجاز': 'active', 'معطب': 'damaged' };
            const statusDisplay = r.status || 'قيد الإنجاز';
            const statusClass = statusMap[statusDisplay] || 'pending';
            const isDamaged = statusDisplay === 'معطب';

            html += `<tr class="${isDamaged ? 'damaged' : ''}">
                <td>${index + 1}</td>
                <td><strong style="color:#fff;">${r.vesselName}</strong></td>
                <td style="color:${isDamaged ? '#e17055' : 'rgba(255,255,255,0.6)'}">${r.damage || '-'}</td>
                <td>${r.technician}</td>
                <td>${formatDate(r.date)}</td>
                <td><span class="status-badge ${statusClass}">${statusDisplay}</span></td>
                <td>${r.cost ? r.cost.toFixed(2) : '0.00'} د.ت</td>
                <td>
                    <button class="btn-sm edit" onclick="openEditModal('${r.id}')"><i class="fas fa-edit"></i></button>
                    <button class="btn-sm complete" onclick="completeMaintenance('${r.id}')"><i class="fas fa-check"></i></button>
                    <button class="btn-sm history" onclick="showHistory('${r.id}')"><i class="fas fa-history"></i></button>
                    <button class="btn-sm delete" onclick="deleteMaintenance('${r.id}')"><i class="fas fa-trash-alt"></i></button>
                </td>
            </tr>`;
        });
        tbody.innerHTML = html;
        updateStats();
        initFilters();

    } catch (error) {
        console.error('❌ خطأ:', error);
        tbody.innerHTML = `<tr><td colspan="8" class="empty-state"><i class="fas fa-exclamation-triangle" style="color:#f87171;"></i><h3 style="color:#f87171;">خطأ في تحميل البيانات</h3><p>${error.message}</p><button onclick="renderMaintenance()" style="margin-top:10px;padding:6px 20px;background:linear-gradient(135deg,#e94560,#f5c842);border:none;border-radius:30px;color:#0a1628;font-weight:600;cursor:pointer;"><i class="fas fa-sync-alt"></i> إعادة المحاولة</button></td></tr>`;
    }
}

// ============================================================
// ✅ 8. تحديث الإحصائيات
// ============================================================

function updateStats() {
    const total = maintenanceData.length;
    const active = maintenanceData.filter(r => r.status === 'قيد الإنجاز').length;
    const completed = maintenanceData.filter(r => r.status === 'مكتملة').length;
    const damaged = maintenanceData.filter(r => r.status === 'معطب').length;
    const totalCost = maintenanceData.reduce((sum, r) => sum + (r.cost || 0), 0);
    const damagedVessels = vesselsData.filter(v => v.stat === 'معطب' || v.status === 'معطب').length;

    document.getElementById('totalTasks').textContent = total;
    document.getElementById('activeTasks').textContent = active;
    document.getElementById('completedTasks').textContent = completed;
    document.getElementById('damagedCount').textContent = damagedVessels || damaged;
    document.getElementById('totalCost').textContent = totalCost.toFixed(0);
}

// ============================================================
// ✅ 9. دوال مساعدة
// ============================================================

function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m])); }
function formatDate(d) { if (!d) return '-'; try { const dt = new Date(d); if (isNaN(dt.getTime())) return d; return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`; } catch(_) { return d; } }

function getYears() {
    const years = new Set();
    maintenanceData.forEach(r => { if (r.date) { const y = new Date(r.date).getFullYear(); if (y) years.add(y.toString()); } });
    return Array.from(years).sort();
}

function initFilters() {
    const yearSelect = document.getElementById('yearFilter');
    const years = getYears();
    yearSelect.innerHTML = '<option value="الكل">-- جميع السنوات --</option>';
    years.forEach(y => { yearSelect.innerHTML += `<option value="${y}">${y}</option>`; });
}

function resetFilters() {
    document.getElementById('searchMaint').value = '';
    document.getElementById('yearFilter').value = 'الكل';
    document.getElementById('statusFilter').value = 'الكل';
    renderMaintenance();
}

// ============================================================
// ✅ 10. فتح مودال الإضافة
// ============================================================

    currentEditId = null;
    document.getElementById('modalTitle').textContent = '➕ إضافة مهمة صيانة جديدة';

        const vid = v._id || v.id;
        vesselOptions += `<option value="${vid}">${v.name}</option>`;
    });

    document.getElementById('modalBody').innerHTML = `
        <div class="form-group"><label>🚢 المركب</label><select id="mVessel">${vesselOptions}</select></div>
        <div class="form-group"><label>🔧 نوع العطب</label><input type="text" id="mDamage" placeholder="مثال: عطل في المحرك"></div>
        <div class="form-group"><label>👤 الفني المسؤول</label><input type="text" id="mTechnician" placeholder="اسم الفني"></div>
        <div class="form-row">
            <div class="form-group"><label>📅 تاريخ العطب</label><input type="date" id="mDate"></div>
            <div class="form-group"><label>💰 التكلفة (د.ت)</label><input type="number" id="mCost" placeholder="0.00" step="0.01"></div>
        </div>
        <div class="form-group"><label>📝 وصف العطب</label><textarea id="mDescription" placeholder="تفاصيل العطب..."></textarea></div>
        <div class="form-group"><label>🔧 قطع الغيار (افصل بينها بفاصلة)</label><input type="text" id="mParts" placeholder="مثال: محرك, مضخة, بطارية"></div>
        <div class="modal-footer">
            <button class="btn-submit" onclick="saveMaintenance()"><i class="fas fa-save"></i> حفظ</button>
            <button class="btn-submit secondary" onclick="closeModal()">إلغاء</button>
        </div>

    document.getElementById('maintenanceModal').classList.add('active');
}

// ============================================================
// ✅ 11. فتح مودال التعديل
// ============================================================

function openEditModal(id) {
    const record = maintenanceData.find(r => r.id == id);
    if (!record) { alert('❌ المهمة غير موجودة'); return; }

    currentEditId = id;
    document.getElementById('modalTitle').textContent = '✏️ تعديل مهمة الصيانة';

    let vesselOptions = '<option value="">اختر المركب</option>';
    vesselsData.forEach(v => {
        const vid = v._id || v.id;
        const selected = vid == record.vesselId ? 'selected' : '';
        vesselOptions += `<option value="${vid}" ${selected}>${v.name}</option>`;
    });

    const partsText = (record.parts || []).map(p => typeof p === 'string' ? p : (p.name || p)).join(', ');

    document.getElementById('modalBody').innerHTML = `
        <div class="form-group"><label>🚢 المركب</label><select id="mVessel">${vesselOptions}</select></div>
        <div class="form-group"><label>🔧 نوع العطب</label><input type="text" id="mDamage" value="${record.damage || ''}" placeholder="مثال: عطل في المحرك"></div>
        <div class="form-group"><label>👤 الفني المسؤول</label><input type="text" id="mTechnician" value="${record.technician || ''}" placeholder="اسم الفني"></div>
        <div class="form-row">
            <div class="form-group"><label>📅 تاريخ العطب</label><input type="date" id="mDate" value="${record.date ? record.date.split('T')[0] : ''}"></div>
            <div class="form-group"><label>💰 التكلفة (د.ت)</label><input type="number" id="mCost" value="${record.cost || 0}" step="0.01"></div>
        </div>
        <div class="form-group"><label>📝 وصف العطب</label><textarea id="mDescription">${record.description || ''}</textarea></div>
        <div class="form-group"><label>🔧 قطع الغيار (افصل بينها بفاصلة)</label><input type="text" id="mParts" value="${partsText}" placeholder="مثال: محرك, مضخة, بطارية"></div>
        <div class="form-group"><label>📊 الحالة</label>
            <select id="mStatus">
                <option value="قيد الإنجاز" ${record.status === 'قيد الإنجاز' ? 'selected' : ''}>🔄 قيد الإنجاز</option>
                <option value="مكتملة" ${record.status === 'مكتملة' ? 'selected' : ''}>✅ مكتملة</option>
                <option value="ملغية" ${record.status === 'ملغية' ? 'selected' : ''}>❌ ملغية</option>
            </select>
        </div>
        <div class="modal-footer">
            <button class="btn-submit" onclick="saveMaintenance()"><i class="fas fa-save"></i> تحديث</button>
            <button class="btn-submit secondary" onclick="closeModal()">إلغاء</button>
        </div>
    `;
    document.getElementById('maintenanceModal').classList.add('active');
}

// ============================================================
// ✅ 12. حفظ الصيانة
// ============================================================

async function saveMaintenance() {
    const vesselId = document.getElementById('mVessel').value;
    const damage = document.getElementById('mDamage').value.trim();
    const technician = document.getElementById('mTechnician').value.trim();
    const date = document.getElementById('mDate').value;
    const cost = parseFloat(document.getElementById('mCost').value) || 0;
    const description = document.getElementById('mDescription').value.trim();
    const partsInput = document.getElementById('mParts').value.trim();
    const status = document.getElementById('mStatus') ? document.getElementById('mStatus').value : 'قيد الإنجاز';

    if (!vesselId) { alert('⚠️ يرجى اختيار المركب'); return; }
    if (!damage) { alert('⚠️ يرجى إدخال نوع العطب'); return; }

    const vessel = vesselsData.find(v => (v._id || v.id) == vesselId);
    const vesselName = vessel ? vessel.name : 'مركب غير معروف';
    const parts = partsInput ? partsInput.split(',').map(p => p.trim()).filter(p => p) : [];

    const data = {
        vesselId, vesselName, damage, technician: technician || 'غير محدد',
        date: date || new Date().toISOString(), cost, parts, description,
        status: status || 'قيد الإنجاز',
        history: [{ action: currentEditId ? 'تم تعديل المهمة' : 'تم إنشاء المهمة', date: new Date().toISOString() }]
    };

    try {
        const t = getToken();
        if (!t) { alert('⚠️ الرجاء تسجيل الدخول مرة أخرى'); window.location.href = '/index.html'; return; }

        const method = currentEditId ? 'PUT' : 'POST';
        const url = currentEditId ? `/api/maintenance/${currentEditId}` : '/api/maintenance';

        const response = await fetch(url, {
            method: method,
            headers: getAuthHeaders(),
            body: JSON.stringify(data)
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'فشل حفظ البيانات');
        }

        closeModal();
        await renderMaintenance();
        alert(currentEditId ? '✅ تم تحديث المهمة' : '✅ تم إضافة المهمة');
    } catch (error) {
        alert('❌ خطأ: ' + error.message);
    }
}

// ============================================================
// ✅ 13. إكمال المهمة
// ============================================================

async function completeMaintenance(id) {
    if (!confirm('✅ هل تريد إكمال هذه المهمة؟')) return;
    try {
        const record = maintenanceData.find(r => r.id == id);
        if (!record) { alert('❌ المهمة غير موجودة'); return; }

        record.status = 'مكتملة';
        record.history = record.history || [];
        record.history.push({ action: 'تم إكمال المهمة', date: new Date().toISOString() });

        const response = await fetch(`/api/maintenance/${id}`, {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify(record)
        });

        if (!response.ok) throw new Error('فشل إكمال المهمة');
        await renderMaintenance();
        alert('✅ تم إكمال المهمة');
    } catch (error) { alert('❌ خطأ: ' + error.message); }
}

// ============================================================
// ✅ 14. حذف المهمة
// ============================================================

async function deleteMaintenance(id) {
    if (!confirm('⚠️ هل أنت متأكد من حذف هذه المهمة؟')) return;
    try {
        const response = await fetch(`/api/maintenance/${id}`, {
            method: 'DELETE',
            headers: getAuthHeaders()
        });
        if (!response.ok) throw new Error('فشل حذف المهمة');
        await renderMaintenance();
        alert('✅ تم حذف المهمة');
    } catch (error) { alert('❌ خطأ: ' + error.message); }
}

// ============================================================
// ✅ 15. عرض سجل التاريخ
// ============================================================

function showHistory(id) {
    const record = maintenanceData.find(r => r.id == id);
    if (!record) { alert('❌ المهمة غير موجودة'); return; }

    const history = record.history || [];
    let historyHtml = '<div class="history-list">';
    if (history.length === 0) {
        historyHtml += '<p style="color:rgba(255,255,255,0.2);text-align:center;padding:20px;">لا يوجد سجل تاريخي</p>';
    } else {
        history.forEach(h => {
            historyHtml += `<div class="history-item"><div class="h-action">${h.action || 'تحديث'}</div><div class="h-date">${formatDate(h.date)}</div><div class="h-details">${h.details || ''}</div></div>`;
        });
    }
    historyHtml += '</div>';

    const parts = record.parts || [];
    let partsHtml = '';
    if (parts.length > 0) {
        partsHtml = `<div style="margin:12px 0;"><label style="font-size:0.75rem;color:rgba(255,255,255,0.4);display:block;margin-bottom:6px;">🔧 قطع الغيار المستخدمة:</label><div class="parts-list">${parts.map(p => {
            const name = typeof p === 'string' ? p : (p.name || p);
            const qty = typeof p === 'string' ? 1 : (p.qty || 1);
            const cost = typeof p === 'string' ? 0 : (p.cost || 0);
            return `<div class="part-item"><span class="part-name">${name}</span><span class="part-qty">الكمية: ${qty}</span><span class="part-cost">${cost ? cost.toFixed(2) + ' د.ت' : ''}</span></div>`;
        }).join('')}</div></div>`;
    }

    document.getElementById('modalTitle').textContent = `📜 سجل الصيانة - ${record.vesselName}`;
    document.getElementById('modalBody').innerHTML = `
        <div style="margin-bottom:14px;">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:0.85rem;">
                <div><strong style="color:#fff;">🔧 العطب:</strong> <span style="color:rgba(255,255,255,0.6);">${record.damage || '-'}</span></div>
                <div><strong style="color:#fff;">👤 الفني:</strong> <span style="color:rgba(255,255,255,0.6);">${record.technician || '-'}</span></div>
                <div><strong style="color:#fff;">💰 التكلفة:</strong> <span style="color:#f5d76e;">${record.cost ? record.cost.toFixed(2) + ' د.ت' : '0.00 د.ت'}</span></div>
                <div><strong style="color:#fff;">📊 الحالة:</strong> <span class="status-badge ${record.status === 'مكتملة' ? 'completed' : (record.status === 'معطب' ? 'damaged' : 'active')}">${record.status || 'قيد الإنجاز'}</span></div>
            </div>
            ${partsHtml}
            ${record.description ? `<div style="margin-top:6px;font-size:0.8rem;color:rgba(255,255,255,0.4);">📝 ${record.description}</div>` : ''}
        </div>
        <hr style="border-color:rgba(255,255,255,0.04);margin:12px 0;">
        <h4 style="color:rgba(255,255,255,0.4);font-size:0.85rem;margin-bottom:10px;">📋 سجل التعديلات</h4>
        ${historyHtml}
        <div style="margin-top:16px;"><button onclick="closeModal()" style="width:100%;padding:10px;border:none;border-radius:8px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.4);cursor:pointer;font-weight:600;transition:all 0.3s;"><i class="fas fa-times"></i> إغلاق</button></div>
    `;
    document.getElementById('maintenanceModal').classList.add('active');
}

// ============================================================
// ✅ 16. إغلاق المودال

function closeModal() {
    document.getElementById('maintenanceModal').classList.remove('active');
    currentEditId = null;
}
