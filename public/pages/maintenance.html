<!-- public/pages/maintenance.html -->
<div id="page-maintenance">
    <style>
        /* ===== STYLES ===== */
        .maint-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .maint-header h2 { margin: 0; color: white; font-size: 22px; }
        .maint-header p { margin: 0; color: rgba(255,255,255,0.4); font-size: 13px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px 16px;
            text-align: center;
        }
        .stat-card .number { font-size: 22px; font-weight: 700; color: #60a5fa; }
        .stat-card .label { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 4px; }
        .stat-card .number.green { color: #4ade80; }
        .stat-card .number.yellow { color: #fbbf24; }
        .stat-card .number.red { color: #f87171; }
        .stat-card .number.gold { color: #f5d76e; }
        
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            background: rgba(255,255,255,0.02);
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.06);
            margin: 12px 0 16px;
            align-items: center;
        }
        .filter-bar input, .filter-bar select {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.8rem;
            min-width: 100px;
        }
        .filter-bar label { font-size: 0.75rem; color: rgba(255,255,255,0.3); font-weight: 600; }
        .filter-bar .btn {
            padding: 4px 14px;
            border-radius: 20px;
            border: none;
            background: rgba(233,69,96,0.15);
            color: #e94560;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filter-bar .btn:hover { background: rgba(233,69,96,0.25); }
        .filter-bar .btn.primary { background: rgba(96,165,250,0.15); color: #60a5fa; }
        .filter-bar .btn.primary:hover { background: rgba(96,165,250,0.25); }
        .filter-bar .btn.success { background: rgba(74,222,128,0.15); color: #4ade80; }
        .filter-bar .btn.success:hover { background: rgba(74,222,128,0.25); }
        
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            margin-top: 10px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
        thead {
            background: rgba(15,52,96,0.3);
            border-bottom: 2px solid rgba(233,69,96,0.08);
        }
        thead th {
            padding: 10px 8px;
            text-align: right;
            font-weight: 600;
            font-size: 0.6rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        thead th i { margin-left: 4px; color: #e94560; }
        tbody td {
            padding: 8px 6px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.6);
        }
        tbody tr:hover { background: rgba(255,255,255,0.02); }
        tbody tr.damaged { border-right: 3px solid #e17055; }
        
        .status-badge {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.active { background: rgba(74,222,128,0.15); color: #4ade80; }
        .status-badge.pending { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .status-badge.completed { background: rgba(96,165,250,0.15); color: #60a5fa; }
        .status-badge.cancelled { background: rgba(248,113,113,0.15); color: #f87171; }
        .status-badge.damaged { background: rgba(225,112,85,0.15); color: #e17055; }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255,255,255,0.15);
        }
        .empty-state i { font-size: 2.5rem; display: block; margin-bottom: 10px; color: rgba(255,255,255,0.05); }
        .empty-state h3 { font-size: 0.9rem; font-weight: 600; color: rgba(255,255,255,0.2); }
        .empty-state p { font-size: 0.75rem; }
        
        .btn-sm {
            padding: 3px 10px;
            border: none;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-sm.edit { background: rgba(245,200,66,0.12); color: #f5c842; }
        .btn-sm.edit:hover { background: #f5c842; color: #0a1628; }
        .btn-sm.delete { background: rgba(225,112,85,0.12); color: #e17055; }
        .btn-sm.delete:hover { background: #e17055; color: #fff; }
        .btn-sm.complete { background: rgba(74,222,128,0.12); color: #4ade80; }
        .btn-sm.complete:hover { background: #4ade80; color: #0a1628; }
        .btn-sm.history { background: rgba(96,165,250,0.12); color: #60a5fa; }
        .btn-sm.history:hover { background: #60a5fa; color: #0a1628; }
        .btn-sm + .btn-sm { margin-right: 4px; }
        
        /* ===== MODAL ===== */
        .maint-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .maint-modal.active { display: flex; }
        .maint-modal .modal-content {
            background: #111e3a;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            animation: modalFade 0.3s ease;
        }
        @keyframes modalFade { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .maint-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .maint-modal .modal-header h3 { color: #fff; font-size: 18px; font-weight: 700; }
        .maint-modal .modal-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.2);
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .maint-modal .modal-close:hover { background: rgba(255,255,255,0.04); color: #fff; }
        .maint-modal .form-group { margin-bottom: 12px; }
        .maint-modal .form-group label {
            display: block;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .maint-modal .form-group input,
        .maint-modal .form-group select,
        .maint-modal .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.04);
            color: #e2e8f0;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .maint-modal .form-group input:focus,
        .maint-modal .form-group select:focus,
        .maint-modal .form-group textarea:focus {
            border-color: #e94560;
            outline: none;
            box-shadow: 0 0 0 4px rgba(233,69,96,0.06);
        }
        .maint-modal .form-group textarea { min-height: 60px; resize: vertical; }
        .maint-modal .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .maint-modal .btn-submit {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #e94560, #f5c842);
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        .maint-modal .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(233,69,96,0.3); }
        .maint-modal .btn-submit.secondary {
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.4);
        }
        .maint-modal .btn-submit.secondary:hover { background: rgba(255,255,255,0.08); transform: none; box-shadow: none; }
        .maint-modal .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .maint-modal .modal-footer .btn-submit { flex: 1; }
        
        .parts-list {
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0;
        }
        .parts-list .part-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.8rem;
        }
        .parts-list .part-item:last-child { border-bottom: none; }
        .parts-list .part-item .part-name { color: #fff; }
        .parts-list .part-item .part-qty { color: rgba(255,255,255,0.4); }
        .parts-list .part-item .part-cost { color: #f5d76e; }
        
        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }
        .history-item {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.8rem;
        }
        .history-item .h-date { color: rgba(255,255,255,0.3); font-size: 0.7rem; }
        .history-item .h-action { color: #60a5fa; }
        .history-item .h-details { color: rgba(255,255,255,0.5); }
        
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .filter-bar { border-radius: 16px; padding: 8px 12px; }
            .filter-bar input, .filter-bar select { min-width: 80px; font-size: 0.7rem; }
            table { font-size: 0.7rem; }
            thead th, tbody td { padding: 6px 4px; }
            .maint-modal .form-row { grid-template-columns: 1fr; }
            .maint-modal .modal-content { padding: 16px; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .stat-card { padding: 10px 12px; }
            .stat-card .number { font-size: 18px; }
        }
    </style>

    <!-- ===== HEADER ===== -->
    <div class="maint-header">
        <div>
            <h2>🔧 إدارة الصيانة</h2>
            <p>متابعة وإدارة مهام الصيانة للمراكب البحرية</p>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button onclick="openAddMaintenance()" style="padding:6px 14px; border:none; border-radius:8px; background:linear-gradient(135deg,#00b894,#00cec9); color:#fff; font-weight:600; cursor:pointer; font-size:0.8rem;">
                <i class="fas fa-plus"></i> إضافة صيانة
            </button>
            <button onclick="refreshMaintenance()" style="padding:6px 14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:8px; color:rgba(255,255,255,0.5); cursor:pointer; font-size:0.8rem;">
                <i class="fas fa-sync-alt"></i> تحديث
            </button>
        </div>
    </div>

    <!-- ===== STATS ===== -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="number" id="totalTasks">0</div>
            <div class="label">📊 إجمالي المهام</div>
        </div>
        <div class="stat-card">
            <div class="number green" id="activeTasks">0</div>
            <div class="label">🔄 قيد الإنجاز</div>
        </div>
        <div class="stat-card">
            <div class="number gold" id="completedTasks">0</div>

        </div>
        <div class="stat-card">
            <div class="number red" id="damagedCount">0</div>

    <!-- ===== FILTERS ===== -->
    <div class="filter-bar">

        <label><i class="fas fa-calendar"></i> السنة:</label>
        <select id="yearFilter" onchange="renderMaintenance()">
            <option value="الكل">-- جميع السنوات --</option>
        </select>

            <option value="الكل">الكل</option>

            <option value="مكتملة">✅ مكتملة</option>
            <option value="ملغية">❌ ملغية</option>
            <option value="معطب">🟥 معطب</option>
        </select>
        <button class="btn primary" onclick="renderMaintenance()"><i class="fas fa-filter"></i> فلترة</button>
        <button class="btn" onclick="resetFilters()"><i class="fas fa-undo-alt"></i> إلغاء</button>
    </div>

    <!-- ===== TABLE ===== -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th><i class="fas fa-hashtag"></i> #</th>
                    <th><i class="fas fa-ship"></i> المركب</th>
                    <th><i class="fas fa-tools"></i> العطب</th>
                    <th><i class="fas fa-user"></i> الفني المسؤول</th>
                    <th><i class="fas fa-calendar"></i> تاريخ العطب</th>
                    <th><i class="fas fa-circle"></i> الحالة</th>
                    <th><i class="fas fa-coins"></i> التكلفة</th>
                    <th><i class="fas fa-cog"></i> إجراء</th>
                </tr>
            </thead>
            <tbody id="maintenanceBody">
                <tr>
                    <td colspan="8" class="empty-state">
                        <i class="fas fa-spinner fa-pulse"></i>
                        <h3>جاري تحميل البيانات...</h3>
                        <p>يرجى الانتظار</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ===== MODAL ===== -->
<div class="maint-modal" id="maintenanceModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">📝 إدارة الصيانة</h3>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div id="modalBody">
            <!-- يتم تعبئته بواسطة JavaScript -->
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 🔧 MAINTENANCE PAGE - FULL SYSTEM
    // ============================================================

    // ============================================================
    // 1. المتغيرات
    // ============================================================

    if (typeof maintenanceData === 'undefined') {
        var maintenanceData = [];
    }
    var currentEditId = null;

    // ============================================================
    // 2. دوال التوكن
    // ============================================================

    function getToken() {
        return localStorage.getItem('marine_token') ||
               localStorage.getItem('token') ||
               localStorage.getItem('authToken') ||
               localStorage.getItem('accessToken') ||
               null;
    }

    function getAuthHeaders() {
        const token = getToken();
        return {
            'Content-Type': 'application/json',
            'Authorization': token ? 'Bearer ' + token : ''
        };
    }

    // ============================================================
    // 3. جلب المراكب
    // ============================================================

    async function loadVessels() {
        if (window.allVessels && window.allVessels.length > 0) {
            return window.allVessels;
        }
        try {
            const token = getToken();
            if (!token) return [];
            const response = await fetch('/api/vessels', { headers: getAuthHeaders() });
            if (!response.ok) return [];
            const data = await response.json();
            window.allVessels = Array.isArray(data) ? data : [];
            return window.allVessels;
        } catch (error) {
            console.error('❌ خطأ في تحميل المراكب:', error);
            return [];
        }
    }

    // ============================================================
    // 4. جلب الصيانة من API
    // ============================================================

    async function loadMaintenance() {
        try {
            const token = getToken();
            if (!token) return [];

            const response = await fetch('/api/maintenance', { headers: getAuthHeaders() });
            if (!response.ok) return [];

            const data = await response.json();
            const records = data.maintenance || data || [];
            
            maintenanceData = records.map(r => ({
                id: r._id || r.id || Date.now(),
                vesselId: r.vesselId || r.vessel_id || '',
                vesselName: r.vesselName || r.vessel_name || 'مركب غير معروف',
                damage: r.damage || r.break || r.damage_type || 'عطل غير محدد',
                technician: r.technician || r.assignedTo || 'غير محدد',
                date: r.date || r.fDate || r.createdAt || new Date().toISOString(),
                status: r.status || r.maintenance_status || 'قيد الإنجاز',
                cost: parseFloat(r.cost || r.totalCost || 0),
                parts: r.parts || r.spareParts || [],
                history: r.history || [],
                description: r.description || r.notes || '',
                createdAt: r.createdAt || r.date || new Date().toISOString()
            }));

            return maintenanceData;
        } catch (error) {
            console.error('❌ خطأ في تحميل الصيانة:', error);
            return [];
        }
    }

    // ============================================================
    // 5. عرض البيانات
    // ============================================================

    async function renderMaintenance() {
        const tbody = document.getElementById('maintenanceBody');
        tbody.innerHTML = `
            <tr><td colspan="8" class="empty-state">
                <i class="fas fa-spinner fa-pulse"></i>
                <h3>جاري تحميل البيانات...</h3>
                <p>يرجى الانتظار</p>
            </td></tr>
        `;

        try {
            const vessels = await loadVessels();
            await loadMaintenance();

            // ✅ إضافة المراكب المعطوبة التي ليست في جدول الصيانة
            const damagedVessels = vessels.filter(v => v.stat === 'معطب' || v.status === 'معطب');
            const existingIds = new Set(maintenanceData.map(m => m.vesselId));
            
            damagedVessels.forEach(v => {
                const vid = v._id || v.id;
                if (!existingIds.has(vid)) {
                    maintenanceData.push({
                        id: 'damaged_' + Date.now() + '_' + Math.random(),
                        vesselId: vid,
                        vesselName: v.name || 'مركب غير معروف',
                        damage: v.break || v.break_type || 'عطل غير محدد',
                        technician: 'غير محدد',
                        date: v.fDate || v.fault_date || new Date().toISOString(),
                        status: 'معطب',
                        cost: 0,
                        parts: [],
                        history: [{ action: 'تم إضافة المركب تلقائياً من السجل العام', date: new Date().toISOString() }],
                        description: v.break || v.break_type || '',
                        createdAt: new Date().toISOString()
                    });
                }
            });

            // ✅ تطبيق الفلاتر
            const search = document.getElementById('searchMaint').value.toLowerCase();
            const yearFilter = document.getElementById('yearFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            let filtered = maintenanceData.filter(r => {
                const searchText = [r.vesselName, r.damage, r.technician, r.description]
                    .filter(Boolean).join(' ').toLowerCase();
                const matchSearch = !search || searchText.includes(search);
                const year = r.date ? new Date(r.date).getFullYear().toString() : '';
                const matchYear = yearFilter === 'الكل' || year === yearFilter;
                const matchStatus = statusFilter === 'الكل' || r.status === statusFilter;
                return matchSearch && matchYear && matchStatus;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="8" class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>لا توجد مهام صيانة</h3>
                        <p>قم بإضافة مهمة صيانة جديدة</p>
                    </td></tr>
                `;
                updateStats(vessels);
                return;
            }

            let html = '';
            filtered.forEach((r, index) => {
                const statusMap = {
                    'مكتملة': 'completed',
                    'ملغية': 'cancelled',
                    'قيد الإنجاز': 'active',
                    'معطب': 'damaged'
                };
                const statusDisplay = r.status || 'قيد الإنجاز';
                const statusClassFinal = statusMap[statusDisplay] || 'pending';
                const isDamaged = statusDisplay === 'معطب';

                html += `<tr class="${isDamaged ? 'damaged' : ''}">
                    <td>${index + 1}</td>
                    <td><strong style="color:#fff;">${r.vesselName}</strong></td>
                    <td style="color:${isDamaged ? '#e17055' : 'rgba(255,255,255,0.6)'}">${r.damage || '-'}</td>
                    <td>${r.technician}</td>
                    <td>${formatDate(r.date)}</td>
                    <td><span class="status-badge ${statusClassFinal}">${statusDisplay}</span></td>
                    <td>${r.cost ? r.cost.toFixed(2) : '0.00'} د.ت</td>
                    <td>
                        <button class="btn-sm edit" onclick="openEditModal('${r.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-sm complete" onclick="completeMaintenance('${r.id}')"><i class="fas fa-check"></i></button>
                        <button class="btn-sm history" onclick="showHistory('${r.id}')"><i class="fas fa-history"></i></button>
                        <button class="btn-sm delete" onclick="deleteMaintenance('${r.id}')"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
            updateStats(vessels);
            initFilters();

        } catch (error) {
            console.error('❌ خطأ:', error);
            tbody.innerHTML = `
                <tr><td colspan="8" class="empty-state">
                    <i class="fas fa-exclamation-triangle" style="color:#f87171;"></i>
                    <h3 style="color:#f87171;">خطأ في تحميل البيانات</h3>
                    <p>${error.message}</p>
                    <button onclick="renderMaintenance()" style="margin-top:10px;padding:6px 20px;background:linear-gradient(135deg,#e94560,#f5c842);border:none;border-radius:30px;color:#fff;font-weight:600;cursor:pointer;">
                        <i class="fas fa-sync-alt"></i> إعادة المحاولة
                    </button>
                </td></tr>
            `;
        }
    }

    // ============================================================
    // 6. تحديث الإحصائيات
    // ============================================================

    function updateStats(vessels) {
        const total = maintenanceData.length;
        const active = maintenanceData.filter(r => r.status === 'قيد الإنجاز').length;
        const completed = maintenanceData.filter(r => r.status === 'مكتملة').length;
        const damaged = maintenanceData.filter(r => r.status === 'معطب').length;
        const totalCost = maintenanceData.reduce((sum, r) => sum + (r.cost || 0), 0);
        const vesselList = vessels || window.allVessels || [];
        const damagedVessels = vesselList.filter(v => v.stat === 'معطب' || v.status === 'معطب').length;

        document.getElementById('totalTasks').textContent = total;
        document.getElementById('activeTasks').textContent = active;
        document.getElementById('completedTasks').textContent = completed;
        document.getElementById('damagedCount').textContent = damagedVessels || damaged;
        document.getElementById('totalCost').textContent = totalCost.toFixed(0);
    }

    // ============================================================
    // 7. دوال مساعدة
    // ============================================================

    function formatDate(dateStr) {
        if (!dateStr) return '-';
        try {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        } catch (_) { return dateStr; }
    }

    function getYears() {
        const years = new Set();
        maintenanceData.forEach(r => {
            if (r.date) {
                const year = new Date(r.date).getFullYear();
                if (year) years.add(year.toString());
            }
        });
        return Array.from(years).sort();
    }

    // ============================================================
    // 8. الفلاتر
    // ============================================================

    function initFilters() {
        const yearSelect = document.getElementById('yearFilter');
        const years = getYears();
        yearSelect.innerHTML = '<option value="الكل">-- جميع السنوات --</option>';
        years.forEach(y => {
            yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
        });
    }

    function resetFilters() {
        document.getElementById('searchMaint').value = '';
        document.getElementById('yearFilter').value = 'الكل';
        document.getElementById('statusFilter').value = 'الكل';
        renderMaintenance();
    }

    // ============================================================
    // 9. فتح نموذج الإضافة
    // ============================================================

    function openAddMaintenance() {
        currentEditId = null;
        document.getElementById('modalTitle').textContent = '➕ إضافة مهمة صيانة جديدة';
        
        const vessels = window.allVessels || [];
        let vesselOptions = '<option value="">اختر المركب</option>';
        vessels.forEach(v => {
            const vid = v._id || v.id;
            vesselOptions += `<option value="${vid}">${v.name}</option>`;
        });

        document.getElementById('modalBody').innerHTML = `
            <div class="form-group">
                <label>🚢 المركب</label>
                <select id="mVessel">${vesselOptions}</select>
            </div>
            <div class="form-group">
                <label>🔧 نوع العطب</label>
                <input type="text" id="mDamage" placeholder="مثال: عطل في المحرك">
            </div>
            <div class="form-group">
                <label>👤 الفني المسؤول</label>
                <input type="text" id="mTechnician" placeholder="اسم الفني">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>📅 تاريخ العطب</label>
                    <input type="date" id="mDate">
                </div>
                <div class="form-group">
                    <label>💰 التكلفة التقديرية (د.ت)</label>
                    <input type="number" id="mCost" placeholder="0.00" step="0.01">
                </div>
            </div>
            <div class="form-group">
                <label>📝 وصف العطب</label>
                <textarea id="mDescription" placeholder="تفاصيل العطب..."></textarea>
            </div>
            <div class="form-group">
                <label>🔧 قطع الغيار (افصل بينها بفاصلة)</label>
                <input type="text" id="mParts" placeholder="مثال: محرك, مضخة, بطارية">
            </div>
            <div class="modal-footer">
                <button class="btn-submit" onclick="saveMaintenance()">💾 حفظ</button>
                <button class="btn-submit secondary" onclick="closeModal()">إلغاء</button>
            </div>
        `;
        
        document.getElementById('maintenanceModal').classList.add('active');
    }

    // ============================================================
    // 10. فتح نموذج التعديل
    // ============================================================

    function openEditModal(id) {
        const record = maintenanceData.find(r => r.id == id);
        if (!record) { alert('❌ المهمة غير موجودة'); return; }

        currentEditId = id;
        document.getElementById('modalTitle').textContent = '✏️ تعديل مهمة الصيانة';

        const vessels = window.allVessels || [];
        let vesselOptions = '<option value="">اختر المركب</option>';
        vessels.forEach(v => {
            const vid = v._id || v.id;
            const selected = vid == record.vesselId ? 'selected' : '';
            vesselOptions += `<option value="${vid}" ${selected}>${v.name}</option>`;
        });

        const partsText = (record.parts || []).map(p => p.name || p).join(', ');

        document.getElementById('modalBody').innerHTML = `
            <div class="form-group">
                <label>🚢 المركب</label>
                <select id="mVessel">${vesselOptions}</select>
            </div>
            <div class="form-group">
                <label>🔧 نوع العطب</label>
                <input type="text" id="mDamage" value="${record.damage || ''}" placeholder="مثال: عطل في المحرك">
            </div>
            <div class="form-group">
                <label>👤 الفني المسؤول</label>
                <input type="text" id="mTechnician" value="${record.technician || ''}" placeholder="اسم الفني">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>📅 تاريخ العطب</label>
                    <input type="date" id="mDate" value="${record.date ? record.date.split('T')[0] : ''}">
                </div>
                <div class="form-group">
                    <label>💰 التكلفة (د.ت)</label>
                    <input type="number" id="mCost" value="${record.cost || 0}" step="0.01">
                </div>
            </div>
            <div class="form-group">
                <label>📝 وصف العطب</label>
                <textarea id="mDescription">${record.description || ''}</textarea>
            </div>
            <div class="form-group">
                <label>🔧 قطع الغيار (افصل بينها بفاصلة)</label>
                <input type="text" id="mParts" value="${partsText}" placeholder="مثال: محرك, مضخة, بطارية">
            </div>
            <div class="form-group">
                <label>📊 الحالة</label>
                <select id="mStatus">
                    <option value="قيد الإنجاز" ${record.status === 'قيد الإنجاز' ? 'selected' : ''}>🔄 قيد الإنجاز</option>
                    <option value="مكتملة" ${record.status === 'مكتملة' ? 'selected' : ''}>✅ مكتملة</option>
                    <option value="ملغية" ${record.status === 'ملغية' ? 'selected' : ''}>❌ ملغية</option>

            <div class="modal-footer">

                <button class="btn-submit secondary" onclick="closeModal()">إلغاء</button>
            </div>
        `;
        
        document.getElementById('maintenanceModal').classList.add('active');
    }

    // ============================================================
    // 11. حفظ الصيانة
    // ============================================================

    async function saveMaintenance() {
        const vesselId = document.getElementById('mVessel').value;
        const damage = document.getElementById('mDamage').value.trim();
        const technician = document.getElementById('mTechnician').value.trim();
        const date = document.getElementById('mDate').value;
        const cost = parseFloat(document.getElementById('mCost').value) || 0;
        const description = document.getElementById('mDescription').value.trim();
        const partsInput = document.getElementById('mParts').value.trim();
        const status = document.getElementById('mStatus') ? document.getElementById('mStatus').value : 'قيد الإنجاز';

        if (!vesselId) { alert('⚠️ يرجى اختيار المركب'); return; }
        if (!damage) { alert('⚠️ يرجى إدخال نوع العطب'); return; }

        const vessels = window.allVessels || [];
        const vessel = vessels.find(v => (v._id || v.id) == vesselId);
        const vesselName = vessel ? vessel.name : 'مركب غير معروف';

        const parts = partsInput ? partsInput.split(',').map(p => p.trim()).filter(p => p) : [];

        const data = {
            vesselId: vesselId,
            vesselName: vesselName,
            damage: damage,
            technician: technician || 'غير محدد',
            date: date || new Date().toISOString(),
            cost: cost,
            parts: parts,
            description: description,
            status: status || 'قيد الإنجاز',
            history: [{ action: currentEditId ? 'تم تعديل المهمة' : 'تم إنشاء المهمة', date: new Date().toISOString() }]
        };

        try {
            const token = getToken();
            const method = currentEditId ? 'PUT' : 'POST';
            const url = currentEditId ? `/api/maintenance/${currentEditId}` : '/api/maintenance';

            const response = await fetch(url, {
                method: method,
                headers: getAuthHeaders(),
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'فشل حفظ البيانات');
            }

            closeModal();
            await renderMaintenance();
            alert(currentEditId ? '✅ تم تحديث المهمة بنجاح' : '✅ تم إضافة المهمة بنجاح');
        } catch (error) {
            alert('❌ خطأ: ' + error.message);
        }
    }

    // ============================================================
    // 12. إكمال المهمة
    // ============================================================

    async function completeMaintenance(id) {
        if (!confirm('✅ هل تريد إكمال هذه المهمة؟')) return;
        try {
            const record = maintenanceData.find(r => r.id == id);
            if (!record) { alert('❌ المهمة غير موجودة'); return; }

            record.status = 'مكتملة';
            record.history = record.history || [];
            record.history.push({ action: 'تم إكمال المهمة', date: new Date().toISOString() });

            const response = await fetch(`/api/maintenance/${id}`, {
                method: 'PUT',
                headers: getAuthHeaders(),
                body: JSON.stringify(record)
            });

            if (!response.ok) throw new Error('فشل إكمال المهمة');

            await renderMaintenance();
            alert('✅ تم إكمال المهمة بنجاح');
        } catch (error) {
            alert('❌ خطأ: ' + error.message);
        }
    }

    // ============================================================
    // 13. حذف المهمة
    // ============================================================

    async function deleteMaintenance(id) {
        if (!confirm('⚠️ هل أنت متأكد من حذف هذه المهمة؟')) return;
        try {
            const response = await fetch(`/api/maintenance/${id}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });
            if (!response.ok) throw new Error('فشل حذف المهمة');
            await renderMaintenance();
            alert('✅ تم حذف المهمة بنجاح');
        } catch (error) {
            alert('❌ خطأ: ' + error.message);
        }
    }

    // ============================================================
    // 14. عرض سجل التاريخ
    // ============================================================

    function showHistory(id) {
        const record = maintenanceData.find(r => r.id == id);
        if (!record) { alert('❌ المهمة غير موجودة'); return; }

        const history = record.history || [];
        let historyHtml = '<div class="history-list">';
        if (history.length === 0) {
            historyHtml += '<p style="color:rgba(255,255,255,0.3);">لا يوجد سجل تاريخي</p>';
        } else {
            history.forEach(h => {
                historyHtml += `
                    <div class="history-item">
                        <div class="h-action">${h.action || 'تحديث'}</div>
                        <div class="h-date">${formatDate(h.date)}</div>
                        <div class="h-details">${h.details || ''}</div>
                    </div>
                `;
            });
        }
        historyHtml += '</div>';

        // عرض قطع الغيار
        const parts = record.parts || [];
        let partsHtml = '';
        if (parts.length > 0) {
            partsHtml = `
                <div style="margin: 10px 0;">
                    <label style="font-size:0.75rem;color:rgba(255,255,255,0.4);">🔧 قطع الغيار المستخدمة:</label>
                    <div class="parts-list">
                        ${parts.map(p => `
                            <div class="part-item">
                                <span class="part-name">${typeof p === 'string' ? p : p.name || p}</span>
                                <span class="part-qty">الكمية: ${p.qty || 1}</span>
                                <span class="part-cost">${p.cost ? p.cost.toFixed(2) + ' د.ت' : ''}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        document.getElementById('modalTitle').textContent = `📜 سجل الصيانة - ${record.vesselName}`;
        document.getElementById('modalBody').innerHTML = `
            <div style="margin-bottom:12px;">
                <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
                    <div><strong style="color:#fff;">🔧 العطب:</strong> <span style="color:rgba(255,255,255,0.6);">${record.damage || '-'}</span></div>
                    <div><strong style="color:#fff;">👤 الفني:</strong> <span style="color:rgba(255,255,255,0.6);">${record.technician || '-'}</span></div>
                    <div><strong style="color:#fff;">💰 التكلفة:</strong> <span style="color:#f5d76e;">${record.cost ? record.cost.toFixed(2) + ' د.ت' : '0.00 د.ت'}</span></div>
                    <div><strong style="color:#fff;">📊 الحالة:</strong> <span class="status-badge ${record.status === 'مكتملة' ? 'completed' : 'active'}">${record.status || 'قيد الإنجاز'}</span></div>
                </div>
                ${partsHtml}
            </div>
            <hr style="border-color:rgba(255,255,255,0.04); margin:12px 0;">
            <h4 style="color:rgba(255,255,255,0.5); font-size:0.9rem; margin-bottom:8px;">📋 سجل التعديلات</h4>
            ${historyHtml}
            <div class="modal-footer" style="margin-top:16px;">
                <button class="btn-submit secondary" onclick="closeModal()" style="width:100%;">إغلاق</button>
            </div>
        `;
        
        document.getElementById('maintenanceModal').classList.add('active');
    }

    // ============================================================
    // 15. إغلاق المودال
    // ============================================================

    function closeModal() {
        document.getElementById('maintenanceModal').classList.remove('active');
        currentEditId = null;
    }

    // ============================================================
    // 16. تحديث الصفحة
    // ============================================================

    function refreshMaintenance() {
        renderMaintenance();
        alert('🔄 تم تحديث البيانات');
    }

    // ============================================================
    // 17. التهيئة
    // ============================================================

    document.addEventListener('DOMContentLoaded', async function() {
        console.log('🔧 تحميل صفحة الصيانة...');
        await renderMaintenance();
        console.log('✅ صفحة الصيانة جاهزة');
    });

    // ============================================================
    // 18. الربط العالمي
    // ============================================================

    window.renderMaintenance = renderMaintenance;
    window.refreshMaintenance = refreshMaintenance;
    window.resetFilters = resetFilters;
    window.openAddMaintenance = openAddMaintenance;
    window.openEditModal = openEditModal;
    window.saveMaintenance = saveMaintenance;
    window.deleteMaintenance = deleteMaintenance;
    window.completeMaintenance = completeMaintenance;
    window.showHistory = showHistory;
    window.closeModal = closeModal;
    window.getToken = getToken;
    window.getAuthHeaders = getAuthHeaders;

    console.log('✅ صفحة الصيانة v13.0 جاهزة');
</script>
</div>
