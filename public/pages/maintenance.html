<!-- public/pages/maintenance.html -->
<script>
// ============================================================
// 🛡️ MAINTENANCE PAGE - v12.0 (FIXED)
// ============================================================

// ✅ دالة لجلب البيانات من window
function getMaintenanceData() {
    var vessels = window.allVessels || [];
    var maintenance = window.allMaintenance || [];
    
    console.log('🔧 Maintenance page loaded (v12.0)');
    console.log('👤 Current user:', window.currentUser?.name || 'Unknown');
    console.log('🚢 Vessels data:', vessels.length);
    console.log('🔧 Maintenance data:', maintenance.length);
    
    return { vessels: vessels, maintenance: maintenance };
}

// ✅ استخدام البيانات
var data = getMaintenanceData();
var vesselsData = data.vessels;
var maintenanceData = data.maintenance;

// ============================================================
// 1. HELPERS
// ============================================================

function getToken() {
    var token = localStorage.getItem('token');
    if (!token) {
        console.warn('⚠️ No token found');
        return null;
    }
    return token;
}

function showToast(message, type) {
    type = type || 'info';
    var container = document.getElementById('toastContainer');
    if (!container) {
        container = document.createElement('div');
        container.id = 'toastContainer';
        container.className = 'toast-container';
        document.body.appendChild(container);
    }

    var toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.innerHTML = '<span class="toast-icon">' + (type === 'success' ? '✅' : type === 'warning' ? '⚠️' : type === 'danger' ? '❌' : 'ℹ️') + '</span> <span>' + message + '</span> <button class="toast-close" onclick="this.parentElement.remove()">✕</button>';
    container.appendChild(toast);

    setTimeout(function() {
        if (toast.parentElement) toast.remove();
    }, 5000);
}

// ============================================================
// 2. LOAD DATA
// ============================================================

async function loadMaintenanceData() {
    console.log('🔄 [MAINT] Loading maintenance data...');
    
    try {
        var token = getToken();
        if (!token) {
            document.getElementById('generalMaintenanceContainer').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><h3>يرجى تسجيل الدخول أولاً</h3></div>';
            return;
        }

        // تحميل المراكب من API
        var vesselsRes = await fetch('/api/vessels', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (vesselsRes.ok) {
            var data = await vesselsRes.json();
            window.allVessels = data.vessels || data || [];
            vesselsData = window.allVessels;
            console.log('✅ [MAINT] Vessels loaded:', vesselsData.length);
        } else {
            console.error('❌ [MAINT] Vessels API error:', vesselsRes.status);
        }

        // تحميل سجل الصيانة من API
        var maintRes = await fetch('/api/maintenance', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (maintRes.ok) {
            var data = await maintRes.json();
            window.allMaintenance = data.maintenance || data || [];
            maintenanceData = window.allMaintenance;
            console.log('✅ [MAINT] Maintenance loaded:', maintenanceData.length);
        } else {
            console.error('❌ [MAINT] Maintenance API error:', maintRes.status);
        }

        // تحديث الواجهة
        renderAll();
        
        console.log('✅ [MAINT] Data loaded successfully');
    } catch (error) {
        console.error('❌ [MAINT] Load error:', error);
        showToast('❌ فشل تحميل البيانات: ' + error.message, 'danger');
    }
}

// ============================================================
// 3. RENDER FUNCTIONS
// ============================================================

function renderAll() {
    renderStats();
    renderBrokenVessels();
    renderHistory();
    renderUnits();
    updateVesselSelect();
    updateYearFilter();
    updateBrokenBadge();
}

function renderStats() {
    var records = maintenanceData || [];
    var total = records.length;
    var inProgress = records.filter(function(r) { return r.status === 'قيد الإنجاز' || r.status === 'معلقة'; }).length;
    var completed = records.filter(function(r) { return r.status === 'مكتملة'; }).length;
    var cancelled = records.filter(function(r) { return r.status === 'ملغية' || r.status === 'ملغاة'; }).length;
    var totalCost = records.reduce(function(sum, r) { return sum + (r.cost || 0); }, 0);

    document.getElementById('totalCount').textContent = total;
    document.getElementById('inProgressCount').textContent = inProgress;
    document.getElementById('completedCount').textContent = completed;
    document.getElementById('cancelledCount').textContent = cancelled;
    document.getElementById('totalCost').textContent = totalCost.toLocaleString();

    var progressPercent = total > 0 ? Math.round((inProgress / total) * 100) : 0;
    var completedPercent = total > 0 ? Math.round((completed / total) * 100) : 0;
    var cancelledPercent = total > 0 ? Math.round((cancelled / total) * 100) : 0;

    document.getElementById('progressBar').style.width = Math.min(progressPercent, 100) + '%';
    document.getElementById('completedBar').style.width = Math.min(completedPercent, 100) + '%';
    document.getElementById('cancelledBar').style.width = Math.min(cancelledPercent, 100) + '%';
}

function renderBrokenVessels() {
    var container = document.getElementById('generalMaintenanceContainer');
    if (!container) return;

    var vessels = vesselsData || [];
    var broken = vessels.filter(function(v) { return v.stat === 'معطب' || v.stat === 'صيانة'; });

    document.getElementById('brokenCount').textContent = broken.length;

    if (broken.length === 0) {
        container.innerHTML = '<div class="empty-state" style="border-color: rgba(74,222,128,0.1);"><div class="icon" style="font-size:48px;">✅</div><h3 style="color:#4ade80;">لا توجد مراكب معطبة حالياً</h3><p style="color:rgba(255,255,255,0.3);">جميع المراكب في حالة جاهزة</p></div>';
        return;
    }

    var html = '<div class="table-container"><table class="maintenance-table"><thead><tr><th>🚢 المركب</th><th>الفئة</th><th>📊 الحالة</th><th>⚠️ العطل</th><th>🔄 الإصلاحات</th><th>⚙️ الإجراءات</th></tr></thead><tbody>';

    broken.forEach(function(v) {
        var vesselId = v._id || v.id;
        var records = maintenanceData || [];
        var repairs = records.filter(function(r) { return r.vesselId == vesselId; });
        var completedRepairs = repairs.filter(function(r) { return r.status === 'مكتملة'; });
        var totalCost = repairs.reduce(function(sum, r) { return sum + (r.cost || 0); }, 0);

        html += '<tr><td><strong>' + (v.name || '-') + '</strong></td><td style="color:rgba(255,255,255,0.4);">' + (v.cat || '-') + '</td><td><span class="status-badge status-broken">' + (v.stat === 'معطب' ? '🔴 معطبة' : '🟠 صيانة') + '</span></td><td style="color:rgba(255,255,255,0.4);">' + (v.break || '-') + '</td><td style="color:#60a5fa; font-weight:600;">' + completedRepairs.length + ' مرة' + (totalCost > 0 ? ' 💰 ' + totalCost + ' د.ت' : '') + '</td><td><div style="display:flex; gap:6px; justify-content:center; flex-wrap:wrap;"><button class="btn-sm btn-success fix-btn" data-id="' + vesselId + '">✅ إصلاح</button><button class="btn-sm btn-history history-btn" data-id="' + vesselId + '" data-name="' + v.name + '">📜 التاريخ (' + repairs.length + ')</button></div></td></tr>';
    });

    html += '</tbody></table></div>';
    container.innerHTML = html;

    container.querySelectorAll('.fix-btn').forEach(function(btn) {
        btn.onclick = function() { fixVessel(this.dataset.id); };
    });
    container.querySelectorAll('.history-btn').forEach(function(btn) {
        btn.onclick = function() { showHistory(this.dataset.id, this.dataset.name); };
    });
}

function renderHistory() {
    var container = document.getElementById('historyMaintenanceContainer');
    if (!container) return;

    var records = maintenanceData || [];
    
    var vesselFilter = document.getElementById('filterVessel')?.value?.toLowerCase() || '';
    var yearFilter = document.getElementById('filterYear')?.value || '';
    var typeFilter = document.getElementById('filterType')?.value || '';
    var unitFilter = document.getElementById('filterUnit')?.value || '';
    var faultFilter = document.getElementById('filterFaultType')?.value || '';
    var costFilter = document.getElementById('filterCost')?.value || '';

    if (vesselFilter) {
        records = records.filter(function(r) { return (r.vesselName || '').toLowerCase().includes(vesselFilter); });
    }
    if (yearFilter) {
        records = records.filter(function(r) { return r.date && r.date.startsWith(yearFilter); });
    }
    if (typeFilter) {
        records = records.filter(function(r) { return r.type === typeFilter; });
    }
    if (unitFilter) {
        records = records.filter(function(r) { return r.unit === unitFilter; });
    }
    if (faultFilter) {
        records = records.filter(function(r) { return r.faultType === faultFilter || (r.description || '').includes(faultFilter); });
    }
    if (costFilter) {
        records = records.filter(function(r) {
            var cost = r.cost || 0;
            switch(costFilter) {
                case '0-1000': return cost < 1000;
                case '1000-5000': return cost >= 1000 && cost <= 5000;
                case '5000-10000': return cost > 5000 && cost <= 10000;
                case '10000+': return cost > 10000;
                default: return true;
            }
        });
    }

    document.getElementById('historyCount').textContent = records.length;

    if (records.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h3>لا توجد سجلات صيانة</h3><p>لا توجد سجلات مطابقة للفلترة</p></div>';
        return;
    }

    var sorted = records.sort(function(a, b) {
        var dateA = a.date ? new Date(a.date) : new Date(0);
        var dateB = b.date ? new Date(b.date) : new Date(0);
        return dateB - dateA;
    });

    var html = '<div class="table-container"><table class="maintenance-table"><thead><tr><th>📅 التاريخ</th><th>🚢 المركب</th><th>🔧 النوع</th><th>⚠️ العطل</th><th>👨‍🔧 الفني</th><th>💰 التكلفة</th><th>📊 الحالة</th><th>⚙️</th></tr></thead><tbody>';

    sorted.forEach(function(r) {
        var statusMap = {
            'مكتملة': '<span class="status-badge status-completed">✅ مكتملة</span>',
            'قيد الإنجاز': '<span class="status-badge status-in-progress">🔄 قيد الإنجاز</span>',
            'معلقة': '<span class="status-badge status-pending">⏳ معلقة</span>',
            'ملغية': '<span class="status-badge status-cancelled">❌ ملغية</span>'
        };

        html += '<tr><td>' + (r.date ? new Date(r.date).toLocaleDateString('ar-TN') : '-') + '</td><td><strong>' + (r.vesselName || '-') + '</strong></td><td style="color:rgba(255,255,255,0.4);">' + (r.type || '-') + '</td><td style="color:rgba(255,255,255,0.4);">' + (r.description || '-') + '</td><td style="color:rgba(255,255,255,0.4);">' + (r.technician || '-') + '</td><td style="color:#4ade80; font-weight:600;">' + (r.cost ? r.cost + ' د.ت' : '-') + '</td><td>' + (statusMap[r.status] || r.status || 'غير محدد') + '</td><td><button class="btn-sm btn-danger delete-btn" data-id="' + (r._id || r.id) + '">🗑️</button></td></tr>';
    });

    html += '</tbody></table></div>';
    container.innerHTML = html;

    container.querySelectorAll('.delete-btn').forEach(function(btn) {
        btn.onclick = function() { deleteMaintenance(this.dataset.id); };
    });
}

function renderUnits() {
    var container = document.getElementById('maintenanceUnitsContainer');
    if (!container) return;

    var records = maintenanceData || [];
    var units = [
        'وحدة الصيانة والإسناد البحري تونس',
        'وحدة الصيانة والإسناد البحري صفاقس',
        'وحدة الصيانة والإسناد البحري المنستير',
        'وحدة الصيانة والإسناد البحري جرجيس',
        'شركة خاصة'
    ];

    var html = '';
    units.forEach(function(unit) {
        var unitRecords = records.filter(function(r) { return r.unit === unit; });
        var total = unitRecords.length;
        var completed = unitRecords.filter(function(r) { return r.status === 'مكتملة'; }).length;
        var inProgress = unitRecords.filter(function(r) { return r.status === 'قيد الإنجاز'; }).length;

        html += '<div style="background:rgba(255,255,255,0.02); border-radius:12px; padding:16px 20px; margin:12px 0; border:1px solid rgba(255,255,255,0.04);"><div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;"><div><strong style="color:rgba(255,255,255,0.8);">🏭 ' + unit.replace('وحدة الصيانة والإسناد البحري ', '') + '</strong><span style="font-size:12px; color:rgba(255,255,255,0.2); margin-left:10px;">📊 ' + total + ' سجل</span></div><div style="font-size:12px; color:rgba(255,255,255,0.3);">✅ ' + completed + ' مكتملة &nbsp;|&nbsp; 🔄 ' + inProgress + ' قيد الإنجاز</div></div>';

        if (total === 0) {
            html += '<div style="text-align:center; padding:10px; color:rgba(255,255,255,0.15); font-size:13px;">🚫 لا توجد سجلات في هذه الوحدة</div>';
        } else {
            html += '<div style="overflow-x:auto;"><table style="width:100%; border-collapse:collapse; font-size:12px;"><thead><tr><th style="padding:6px 10px; text-align:center; color:rgba(255,255,255,0.2); border-bottom:1px solid rgba(255,255,255,0.04);">المركب</th><th style="padding:6px 10px; text-align:center; color:rgba(255,255,255,0.2); border-bottom:1px solid rgba(255,255,255,0.04);">👨‍🔧 الفني</th><th style="padding:6px 10px; text-align:center; color:rgba(255,255,255,0.2); border-bottom:1px solid rgba(255,255,255,0.04);">💰 التكلفة</th><th style="padding:6px 10px; text-align:center; color:rgba(255,255,255,0.2); border-bottom:1px solid rgba(255,255,255,0.04);">📊 الحالة</th></tr></thead><tbody>';
            
            unitRecords.slice(-5).reverse().forEach(function(r) {
                var statusClass = r.status === 'مكتملة' ? 'status-completed' : r.status === 'قيد الإنجاز' ? 'status-in-progress' : 'status-cancelled';
                html += '<tr><td style="padding:6px 10px; text-align:center; color:rgba(255,255,255,0.6);">' + (r.vesselName || '-') + '</td><td style="padding:6px 10px; text-align:center; color:rgba(255,255,255,0.4);">' + (r.technician || '-') + '</td><td style="padding:6px 10px; text-align:center; color:#4ade80; font-weight:600;">' + (r.cost ? r.cost + ' د.ت' : '-') + '</td><td style="padding:6px 10px; text-align:center;"><span class="status-badge ' + statusClass + '">' + (r.status || 'غير محدد') + '</span></td></tr>';
            });

            html += '</tbody></table></div>';
        }

        html += '</div>';
    });

    container.innerHTML = html;
}

function updateBrokenBadge() {
    var vessels = vesselsData || [];
    var brokenCount = vessels.filter(function(v) { return v.stat === 'معطب' || v.stat === 'صيانة'; }).length;
    var badge = document.getElementById('maintenanceBadge');
    if (badge) {
        badge.textContent = brokenCount;
        badge.style.display = brokenCount > 0 ? 'inline' : 'none';
    }
    document.getElementById('brokenCount').textContent = brokenCount;
}

// ============================================================
// 4. FORM HELPERS
// ============================================================

function toggleMaintenanceForm() {
    var form = document.getElementById('maintenanceForm');
    var isActive = form.classList.contains('active');
    
    if (isActive) {
        form.classList.remove('active');
        document.getElementById('formTitle').textContent = '📝 تسجيل صيانة جديدة';
        document.getElementById('mRecordId').value = '';
        document.querySelectorAll('#maintenanceForm input, #maintenanceForm select, #maintenanceForm textarea').forEach(function(el) {
            if (el.id !== 'mRecordId' && el.id !== 'mVesselId') {
                el.value = '';
            }
        });
        document.getElementById('mStartDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('partsContainer').innerHTML = '';
        addPart();
    } else {
        form.classList.add('active');
        document.getElementById('mStartDate').value = new Date().toISOString().split('T')[0];
        if (document.getElementById('partsContainer').children.length === 0) {
            addPart();
        }
        updateVesselSelect();
    }
}

function updateVesselSelect() {
    var select = document.getElementById('mVesselId');
    if (!select) return;
    var vessels = vesselsData || [];
    var currentValue = select.value;
    select.innerHTML = '<option value="">-- اختر المركب --</option>';
    vessels.forEach(function(v) {
        var option = document.createElement('option');
        option.value = v._id || v.id;
        option.textContent = v.name + ' (' + (v.num || 'بدون رقم') + ') - ' + (v.cat || 'بدون فئة');
        if (option.value == currentValue) option.selected = true;
        select.appendChild(option);
    });
}

function updateYearFilter() {
    var select = document.getElementById('filterYear');
    if (!select) return;
    var records = maintenanceData || [];
    var years = new Set();
    records.forEach(function(r) {
        if (r.date) {
            var year = r.date.split('-')[0];
            if (year && year.length === 4) years.add(year);
        }
    });
    var currentValue = select.value;
    select.innerHTML = '<option value="">-- جميع السنوات --</option>';
    Array.from(years).sort().reverse().forEach(function(year) {
        var option = document.createElement('option');
        option.value = year;
        option.textContent = '📅 ' + year;
        if (year === currentValue) option.selected = true;
        select.appendChild(option);
    });
}

function addPart() {
    var container = document.getElementById('partsContainer');
    if (!container) return;
    var div = document.createElement('div');
    div.className = 'part-item';
    div.style.cssText = 'display:flex; gap:10px; margin-bottom:8px; flex-wrap:wrap; align-items:center;';
    div.innerHTML = '<input type="text" placeholder="اسم القطعة" class="part-name" style="flex:2; min-width:120px; padding:8px 12px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:6px; color:white; font-family:\'Cairo\',sans-serif;"><input type="number" placeholder="الكمية" class="part-qty" style="width:70px; padding:8px 12px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:6px; color:white; font-family:\'Cairo\',sans-serif;"><input type="number" placeholder="السعر" class="part-price" style="width:80px; padding:8px 12px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:6px; color:white; font-family:\'Cairo\',sans-serif;"><button class="remove-part-btn" style="padding:4px 10px; background:rgba(248,113,113,0.15); color:#f87171; border:1px solid rgba(248,113,113,0.1); border-radius:6px; cursor:pointer; font-size:16px;">✕</button>';
    container.appendChild(div);

    div.querySelector('.remove-part-btn').onclick = function() { removePart(this); };
}

function removePart(btn) {
    var container = document.getElementById('partsContainer');
    if (container.children.length > 1) {
        btn.closest('.part-item').remove();
    } else {
        showToast('⚠️ يجب أن يكون هناك قطعة واحدة على الأقل', 'warning');
    }
}

function getPartsData() {
    var parts = [];
    document.querySelectorAll('#partsContainer .part-item').forEach(function(item) {
        var name = item.querySelector('.part-name')?.value;
        var qty = parseFloat(item.querySelector('.part-qty')?.value) || 0;
        var price = parseFloat(item.querySelector('.part-price')?.value) || 0;
        if (name) {
            parts.push({ name: name, quantity: qty, price: price });
        }
    });
    return parts;
}

// ============================================================
// 5. CRUD OPERATIONS
// ============================================================

async function saveMaintenance() {
    var vesselId = document.getElementById('mVesselId')?.value;
    var type = document.getElementById('mType')?.value;
    var unit = document.getElementById('mUnit')?.value;
    var technician = document.getElementById('mTechnician')?.value.trim();
    var description = document.getElementById('mDescription')?.value.trim();
    var repair = document.getElementById('mRepair')?.value.trim();
    var faultType = document.getElementById('mFaultType')?.value;
    var startDate = document.getElementById('mStartDate')?.value;
    var status = document.getElementById('mStatus')?.value;
    var cost = parseFloat(document.getElementById('mCost')?.value) || 0;
    var notes = document.getElementById('mNotes')?.value.trim();
    var parts = getPartsData();
    var recordId = document.getElementById('mRecordId')?.value;

    if (!vesselId) { showToast('⚠️ الرجاء اختيار المركب', 'warning'); return; }
    if (!description) { showToast('⚠️ الرجاء إدخال وصف العطل', 'warning'); return; }
    if (!technician) { showToast('⚠️ الرجاء إدخال اسم الفني المسؤول', 'warning'); return; }

    var vessels = vesselsData || [];
    var vessel = vessels.find(function(v) { return (v._id || v.id) == vesselId; });
    var vesselName = vessel ? vessel.name : 'مركب غير معروف';

    var data = {
        vesselId: vesselId, vesselName: vesselName, type: type || 'عادية',
        unit: unit || 'غير محدد', technician: technician, description: description,
        repair: repair || '', faultType: faultType || 'أخرى',
        cost: cost, notes: notes || '', parts: parts,
        status: status || 'قيد الإنجاز',
        startDate: startDate || new Date().toISOString().split('T')[0],
        createdBy: window.currentUser?.name || 'Admin'
    };

    try {
        var token = getToken();
        if (!token) return;

        var url = recordId ? '/api/maintenance/' + recordId : '/api/maintenance';
        var method = recordId ? 'PUT' : 'POST';
        
        var response = await fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(data)
        });

        if (!response.ok) throw new Error('فشل الحفظ');
        
        showToast('✅ ' + (recordId ? 'تم تحديث' : 'تم إضافة') + ' سجل الصيانة بنجاح', 'success');
        toggleMaintenanceForm();
        await loadMaintenanceData();
    } catch (error) {
        console.error('❌ Save error:', error);
        showToast('❌ ' + error.message, 'danger');
    }
}

async function deleteMaintenance(id) {
    if (!confirm('⚠️ هل أنت متأكد من حذف هذا السجل؟')) return;
    try {
        var token = getToken();
        if (!token) return;

        var response = await fetch('/api/maintenance/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!response.ok) throw new Error('فشل الحذف');
        
        showToast('✅ تم حذف السجل', 'success');
        await loadMaintenanceData();
    } catch (error) {
        console.error('❌ Delete error:', error);
        showToast('❌ ' + error.message, 'danger');
    }
}

async function fixVessel(vesselId) {
    var records = maintenanceData || [];
    var openRecords = records.filter(function(r) { 
        return r.vesselId == vesselId && 
        (r.status === 'قيد الإنجاز' || r.status === 'معلقة');
    });

    if (openRecords.length > 0) {
        if (!confirm('⚠️ يوجد ' + openRecords.length + ' سجل(ات) صيانة مفتوحة. إكمال الإصلاح سيغلقها تلقائياً.')) {
            return;
        }
    }

    if (!confirm('⚠️ هل أنت متأكد من إصلاح هذا المركب وعودته للخدمة؟')) return;

    try {
        var token = getToken();
        if (!token) return;

        var vessels = vesselsData || [];
        var vessel = vessels.find(function(v) { return (v._id || v.id) == vesselId; });
        
        await fetch('/api/vessels/' + vesselId, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ 
                stat: 'صالح', 
                break: '',
                eDate: new Date().toISOString().split('T')[0]
            })
        });

        for (var i = 0; i < openRecords.length; i++) {
            var record = openRecords[i];
            await fetch('/api/maintenance/' + (record._id || record.id), {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ 
                    status: 'مكتملة',
                    completedAt: new Date().toISOString()
                })
            });
        }

        await fetch('/api/maintenance', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({
                vesselId: vesselId,
                vesselName: vessel ? vessel.name : 'مركب غير معروف',
                type: 'إصلاح كامل',
                unit: vessel?.repairUnit || 'غير محدد',
                technician: window.currentUser?.name || 'النظام',
                description: 'تم إصلاح المركب وعودته للخدمة',
                cost: 0,
                status: 'مكتملة',
                date: new Date().toISOString().split('T')[0],
                faultType: vessel?.break || 'تم الإصلاح',
                notes: 'تم الإصلاح بواسطة ' + (window.currentUser?.name || 'النظام')
            })
        });

        showToast('✅ تم إصلاح المركب وعودته للخدمة', 'success');
        await loadMaintenanceData();
    } catch (error) {
        console.error('❌ Fix vessel error:', error);
        showToast('❌ ' + error.message, 'danger');
    }
}

// ============================================================
// 6. HISTORY MODAL
// ============================================================

function showHistory(vesselId, vesselName) {
    var records = maintenanceData || [];
    var vesselRecords = records.filter(function(r) { return r.vesselId == vesselId; });
    var total = vesselRecords.length;
    var completed = vesselRecords.filter(function(r) { return r.status === 'مكتملة'; }).length;
    var totalCost = vesselRecords.reduce(function(sum, r) { return sum + (r.cost || 0); }, 0);
    var avgCost = total > 0 ? (totalCost / total).toFixed(0) : 0;

    document.getElementById('historyVesselName').textContent = '- ' + vesselName;
    document.getElementById('historyTotal').textContent = total;
    document.getElementById('historyCompleted').textContent = completed;
    document.getElementById('historyCost').textContent = totalCost.toLocaleString();
    document.getElementById('historyAvg').textContent = avgCost.toLocaleString();

    var tbody = document.getElementById('historyTableBody');
    if (vesselRecords.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="no-history"><div class="icon">🚫</div><div>لا توجد سجلات صيانة لهذا المركب</div></td></tr>';
    } else {
        tbody.innerHTML = vesselRecords.map(function(r) {
            var statusMap = {
                'مكتملة': '<span class="status-badge status-completed">✅ مكتملة</span>',
                'قيد الإنجاز': '<span class="status-badge status-in-progress">🔄 قيد الإنجاز</span>',
                'معلقة': '<span class="status-badge status-pending">⏳ معلقة</span>',
                'ملغية': '<span class="status-badge status-cancelled">❌ ملغية</span>'
            };
            return '<tr><td>' + (r.date ? new Date(r.date).toLocaleDateString('ar-TN') : '-') + '</td><td>' + (r.type || '-') + '</td><td>' + (r.technician || '-') + '</td><td style="color:#4ade80; font-weight:600;">' + (r.cost ? r.cost + ' د.ت' : '-') + '</td><td>' + (statusMap[r.status] || r.status || '-') + '</td></tr>';
        }).join('');
    }

    document.getElementById('historyModal').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeHistoryModal() {
    document.getElementById('historyModal').classList.remove('active');
    document.body.style.overflow = '';
}

// ============================================================
// 7. FILTERS
// ============================================================

function applyHistoryFilters() { renderHistory(); showToast('✅ تم تطبيق الفلترة', 'success'); }
function resetHistoryFilters() {
    document.querySelectorAll('#page-maintenance .filters-grid input, #page-maintenance .filters-grid select').forEach(function(el) {
        if (el.tagName === 'INPUT') el.value = '';
        if (el.tagName === 'SELECT') el.value = '';
    });
    renderHistory();
    showToast('✅ تم إلغاء الفلترة', 'success');
}

// ============================================================
// 8. EXPORT
// ============================================================

function exportMaintenanceReport() {
    var records = maintenanceData || [];
    if (records.length === 0) {
        showToast('⚠️ لا توجد بيانات للتصدير', 'warning');
        return;
    }

    var csv = 'التاريخ,المركب,نوع الصيانة,الفني,التكلفة,الحالة,الوحدة\n';
    records.forEach(function(r) {
        csv += (r.date || '') + ',' + (r.vesselName || '') + ',' + (r.type || '') + ',' + (r.technician || '') + ',' + (r.cost || 0) + ',' + (r.status || '') + ',' + (r.unit || '') + '\n';
    });

    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'تقرير_الصيانة_' + new Date().toISOString().split('T')[0] + '.csv';
    link.click();
    URL.revokeObjectURL(link.href);
    showToast('✅ تم تصدير التقرير بنجاح', 'success');
}
