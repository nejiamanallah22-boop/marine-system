<!-- public/pages/maintenance.html -->
<div id="page-maintenance">
    <style>
        .maintenance-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .maintenance-header h2 {
            margin: 0;
            color: white;
            font-size: 22px;
        }
        .maintenance-header p {
            margin: 0;
            color: rgba(255,255,255,0.4);
            font-size: 13px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }
        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 14px 18px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 24px;
            font-weight: 700;
            color: #60a5fa;
        }
        .stat-card .label {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
        }
        .stat-card .number.green { color: #4ade80; }
        .stat-card .number.yellow { color: #fbbf24; }
        .stat-card .number.red { color: #f87171; }
        .stat-card .number.gold { color: #f5d76e; }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            background: rgba(255,255,255,0.02);
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.06);
            margin: 12px 0 16px;
            align-items: center;
        }
        .filter-bar input, .filter-bar select {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.8rem;
            min-width: 100px;
        }
        .filter-bar label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
        }
        .filter-bar .btn {
            padding: 4px 14px;
            border-radius: 20px;
            border: none;
            background: rgba(233,69,96,0.15);
            color: #e94560;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filter-bar .btn:hover {
            background: rgba(233,69,96,0.25);
        }
        .filter-bar .btn.primary {
            background: rgba(96,165,250,0.15);
            color: #60a5fa;
        }
        .filter-bar .btn.primary:hover {
            background: rgba(96,165,250,0.25);
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
        }
        thead {
            background: rgba(15,52,96,0.3);
            border-bottom: 2px solid rgba(233,69,96,0.08);
        }
        thead th {
            padding: 10px 8px;
            text-align: right;
            font-weight: 600;
            font-size: 0.6rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        thead th i {
            margin-left: 4px;
            color: #e94560;
        }
        tbody td {
            padding: 8px 6px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.6);
        }
        tbody tr:hover {
            background: rgba(255,255,255,0.02);
        }
        .status-badge {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.active {
            background: rgba(74,222,128,0.15);
            color: #4ade80;
        }
        .status-badge.pending {
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
        }
        .status-badge.completed {
            background: rgba(96,165,250,0.15);
            color: #60a5fa;
        }
        .status-badge.cancelled {
            background: rgba(248,113,113,0.15);
            color: #f87171;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255,255,255,0.15);
        }
        .empty-state i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
            color: rgba(255,255,255,0.05);
        }
        .empty-state h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255,255,255,0.2);
        }
        .empty-state p {
            font-size: 0.75rem;
        }
        .btn-sm {
            padding: 3px 10px;
            border: none;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-sm.edit {
            background: rgba(245,200,66,0.12);
            color: #f5c842;
        }
        .btn-sm.edit:hover {
            background: #f5c842;
            color: #0a1628;
        }
        .btn-sm.delete {
            background: rgba(225,112,85,0.12);
            color: #e17055;
        }
        .btn-sm.delete:hover {
            background: #e17055;
            color: #fff;
        }
        .btn-sm.complete {
            background: rgba(74,222,128,0.12);
            color: #4ade80;
        }
        .btn-sm.complete:hover {
            background: #4ade80;
            color: #0a1628;
        }
        .btn-sm + .btn-sm {
            margin-right: 4px;
        }
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .filter-bar {
                border-radius: 16px;
                padding: 8px 12px;
            }
            .filter-bar input, .filter-bar select {
                min-width: 80px;
                font-size: 0.7rem;
            }
            table {
                font-size: 0.7rem;
            }
            thead th, tbody td {
                padding: 6px 4px;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-card {
                padding: 10px 12px;
            }
            .stat-card .number {
                font-size: 18px;
            }
        }
    </style>

    <!-- ===== HEADER ===== -->
    <div class="maintenance-header">
        <div>
            <h2>🔧 إدارة الصيانة</h2>
            <p>متابعة وإدارة مهام الصيانة للمراكب البحرية</p>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button onclick="openAddMaintenance()" style="padding:6px 14px; border:none; border-radius:8px; background:linear-gradient(135deg,#00b894,#00cec9); color:#fff; font-weight:600; cursor:pointer; font-size:0.8rem;">
                <i class="fas fa-plus"></i> إضافة صيانة
            </button>
            <button onclick="refreshMaintenance()" style="padding:6px 14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:8px; color:rgba(255,255,255,0.5); cursor:pointer; font-size:0.8rem;">
                <i class="fas fa-sync-alt"></i> تحديث
            </button>
        </div>
    </div>

    <!-- ===== STATS ===== -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="number" id="totalTasks">0</div>
            <div class="label">📊 إجمالي المهام</div>
        </div>
        <div class="stat-card">
            <div class="number green" id="activeTasks">0</div>
            <div class="label">🔄 قيد الإنجاز</div>
        </div>
        <div class="stat-card">
            <div class="number gold" id="completedTasks">0</div>
            <div class="label">✅ مكتملة</div>
        </div>
        <div class="stat-card">
            <div class="number red" id="cancelledTasks">0</div>
            <div class="label">❌ ملغية</div>
        </div>
        <div class="stat-card">
            <div class="number yellow" id="totalCost">0</div>
            <div class="label">💰 إجمالي التكلفة (د.ت)</div>
        </div>
        <div class="stat-card">
            <div class="number" id="damagedVessels">0</div>
            <div class="label">🟥 المراكب المعطبة</div>
        </div>
    </div>

    <!-- ===== FILTERS ===== -->
    <div class="filter-bar">
        <input type="text" id="searchMaint" placeholder="🔍 بحث..." onkeyup="renderMaintenance()" style="flex:1; min-width:120px;">
        
        <label><i class="fas fa-calendar"></i> السنة:</label>
        <select id="yearFilter" onchange="renderMaintenance()">
            <option value="الكل">-- جميع السنوات --</option>
        </select>
        
        <label><i class="fas fa-tools"></i> النوع:</label>
        <select id="typeFilter" onchange="renderMaintenance()">
            <option value="الكل">الكل</option>
            <option value="ميكانيكية">ميكانيكية</option>
            <option value="كهربائية">كهربائية</option>
            <option value="هيكلية">هيكلية</option>
            <option value="ملاحية">ملاحية</option>
            <option value="أخرى">أخرى</option>
        </select>
        
        <label><i class="fas fa-building"></i> الوحدة:</label>
        <select id="unitFilter" onchange="renderMaintenance()">
            <option value="الكل">الكل</option>
        </select>
        
        <button class="btn primary" onclick="renderMaintenance()"><i class="fas fa-filter"></i> فلترة</button>
        <button class="btn" onclick="resetFilters()"><i class="fas fa-undo-alt"></i> إلغاء</button>
    </div>

    <!-- ===== TABLE ===== -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th><i class="fas fa-hashtag"></i> #</th>
                    <th><i class="fas fa-ship"></i> المركب</th>
                    <th><i class="fas fa-tools"></i> النوع</th>
                    <th><i class="fas fa-calendar"></i> التاريخ</th>
                    <th><i class="fas fa-user"></i> الفني</th>
                    <th><i class="fas fa-circle"></i> الحالة</th>
                    <th><i class="fas fa-coins"></i> التكلفة</th>
                    <th><i class="fas fa-building"></i> الوحدة</th>
                    <th><i class="fas fa-cog"></i> إجراء</th>
                </tr>
            </thead>
            <tbody id="maintenanceBody">
                <tr>
                    <td colspan="9" class="empty-state">
                        <i class="fas fa-spinner fa-pulse"></i>
                        <h3>جاري تحميل البيانات...</h3>
                        <p>يرجى الانتظار</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ============================================================
    // 🔧 MAINTENANCE PAGE - FIXED
    // ============================================================

    let maintenanceData = [];
    let vesselsData = [];

    // ============================================================
    // 1. GET TOKEN - متوافق مع جميع الأنظمة
    // ============================================================

    function getToken() {
        // ✅ محاولة قراءة التوكن من جميع المصادر الممكنة
        return localStorage.getItem('marine_token') ||
               localStorage.getItem('token') ||
               localStorage.getItem('authToken') ||
               localStorage.getItem('accessToken') ||
               null;
    }

    function getAuthHeaders() {
        const token = getToken();
        return {
            'Content-Type': 'application/json',
            'Authorization': token ? 'Bearer ' + token : ''
        };
    }

    // ============================================================
    // 2. جلب بيانات المراكب - من window.allVessels أو API
    // ============================================================

    async function loadVessels() {
        // ✅ أولاً: حاول القراءة من window.allVessels (من index.html)
        if (window.allVessels && window.allVessels.length > 0) {
            vesselsData = window.allVessels;
            console.log('✅ تم تحميل المراكب من window.allVessels:', vesselsData.length);
            return vesselsData;
        }

        // ✅ ثانياً: حاول القراءة من window.vesselsData
        if (window.vesselsData && window.vesselsData.length > 0) {
            vesselsData = window.vesselsData;
            console.log('✅ تم تحميل المراكب من window.vesselsData:', vesselsData.length);
            return vesselsData;
        }

        // ✅ ثالثاً: جلب من API
        try {
            const token = getToken();
            if (!token) {
                console.warn('⚠️ لا يوجد توكن');
                return [];
            }

            const response = await fetch('/api/vessels', {
                headers: getAuthHeaders()
            });

            if (!response.ok) {
                console.error('❌ فشل تحميل المراكب:', response.status);
                return [];
            }

            const data = await response.json();
            vesselsData = Array.isArray(data) ? data : [];
            
            // ✅ حفظ في window للمرة القادمة
            window.allVessels = vesselsData;
            window.vesselsData = vesselsData;
            
            console.log('✅ تم تحميل المراكب من API:', vesselsData.length);
            return vesselsData;
        } catch (error) {
            console.error('❌ خطأ في تحميل المراكب:', error);
            return [];
        }
    }

    // ============================================================
    // 3. جلب بيانات الصيانة
    // ============================================================

    async function loadMaintenance() {
        try {
            const token = getToken();
            if (!token) {
                console.warn('⚠️ لا يوجد توكن');
                return [];
            }

            const response = await fetch('/api/maintenance', {
                headers: getAuthHeaders()
            });

            if (!response.ok) {
                console.error('❌ فشل تحميل الصيانة:', response.status);
                return [];
            }

            const data = await response.json();
            const records = data.maintenance || data || [];
            
            // ✅ تحويل البيانات إلى صيغة موحدة
            maintenanceData = records.map(r => ({
                id: r._id || r.id || Date.now(),
                vesselId: r.vesselId || r.vessel_id || '',
                vesselName: r.vesselName || r.vessel_name || 'مركب غير معروف',
                type: r.type || r.maintenance_type || 'أخرى',
                date: r.date || r.createdAt || r.maintenance_date || new Date().toISOString(),
                technician: r.technician || r.assignedTo || 'غير محدد',
                status: r.status || r.maintenance_status || 'قيد الإنجاز',
                cost: parseFloat(r.cost || r.price || 0),
                unit: r.unit || r.repairUnit || r.region || 'غير محدد',
                description: r.description || r.notes || '',
                createdAt: r.createdAt || r.date || new Date().toISOString()
            }));

            console.log('✅ تم تحميل الصيانة:', maintenanceData.length);
            return maintenanceData;
        } catch (error) {
            console.error('❌ خطأ في تحميل الصيانة:', error);
            return [];
        }
    }

    // ============================================================
    // 4. عرض البيانات
    // ============================================================

    async function renderMaintenance() {
        const tbody = document.getElementById('maintenanceBody');
        tbody.innerHTML = `
            <tr>
                <td colspan="9" class="empty-state">
                    <i class="fas fa-spinner fa-pulse"></i>
                    <h3>جاري تحميل البيانات...</h3>
                    <p>يرجى الانتظار</p>
                </td>
            </tr>
        `;

        try {
            // ✅ تحميل المراكب أولاً
            await loadVessels();
            
            // ✅ تحميل الصيانة
            await loadMaintenance();

            // ✅ تحديث الإحصائيات
            updateStats();

            // ✅ تطبيق الفلاتر
            const search = document.getElementById('searchMaint').value.toLowerCase();
            const yearFilter = document.getElementById('yearFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            const unitFilter = document.getElementById('unitFilter').value;

            let filtered = maintenanceData.filter(r => {
                // البحث
                const searchText = [r.vesselName, r.type, r.technician, r.description, r.unit]
                    .filter(Boolean).join(' ').toLowerCase();
                const matchSearch = !search || searchText.includes(search);
                
                // السنة
                const year = r.date ? new Date(r.date).getFullYear().toString() : '';
                const matchYear = yearFilter === 'الكل' || year === yearFilter;
                
                // النوع
                const matchType = typeFilter === 'الكل' || r.type === typeFilter;
                
                // الوحدة
                const matchUnit = unitFilter === 'الكل' || r.unit === unitFilter;
                
                return matchSearch && matchYear && matchType && matchUnit;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <h3>لا توجد مهام صيانة</h3>
                            <p>قم بإضافة مهمة صيانة جديدة</p>
                        </td>
                    </tr>
                `;
                return;
            }

            // ✅ عرض البيانات
            let html = '';
            filtered.forEach((r, index) => {
                const statusClass = r.status === 'مكتملة' ? 'completed' :
                                   r.status === 'ملغية' ? 'cancelled' :
                                   r.status === 'قيد الإنجاز' ? 'active' : 'pending';
                
                const statusMap = {
                    'مكتملة': 'completed',
                    'ملغية': 'cancelled',
                    'قيد الإنجاز': 'active'
                };
                const statusDisplay = r.status || 'قيد الإنجاز';
                const statusClassFinal = statusMap[statusDisplay] || 'pending';

                html += `<tr>
                    <td>${index + 1}</td>
                    <td><strong style="color:#fff;">${r.vesselName}</strong></td>
                    <td>${r.type}</td>
                    <td>${formatDate(r.date)}</td>
                    <td>${r.technician}</td>
                    <td><span class="status-badge ${statusClassFinal}">${statusDisplay}</span></td>
                    <td>${r.cost ? r.cost.toFixed(2) : '0.00'} د.ت</td>
                    <td>${r.unit}</td>
                    <td>
                        <button class="btn-sm edit" onclick="editMaintenance('${r.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-sm delete" onclick="deleteMaintenance('${r.id}')"><i class="fas fa-trash-alt"></i></button>
                        <button class="btn-sm complete" onclick="completeMaintenance('${r.id}')"><i class="fas fa-check"></i></button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;

        } catch (error) {
            console.error('❌ خطأ في renderMaintenance:', error);
            tbody.innerHTML = `
                <tr>
                    <td colspan="9" class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color:#f87171;"></i>
                        <h3 style="color:#f87171;">خطأ في تحميل البيانات</h3>
                        <p>${error.message}</p>
                        <button onclick="renderMaintenance()" style="margin-top:10px;padding:6px 20px;background:linear-gradient(135deg,#e94560,#f5c842);border:none;border-radius:30px;color:#fff;font-weight:600;cursor:pointer;">
                            <i class="fas fa-sync-alt"></i> إعادة المحاولة
                        </button>
                    </td>
                </tr>
            `;
        }
    }

    // ============================================================
    // 5. تحديث الإحصائيات
    // ============================================================

    function updateStats() {
        const total = maintenanceData.length;
        const active = maintenanceData.filter(r => r.status === 'قيد الإنجاز').length;
        const completed = maintenanceData.filter(r => r.status === 'مكتملة').length;
        const cancelled = maintenanceData.filter(r => r.status === 'ملغية').length;
        const totalCost = maintenanceData.reduce((sum, r) => sum + (r.cost || 0), 0);
        const damaged = vesselsData.filter(v => v.stat === 'معطب' || v.status === 'معطب').length;

        document.getElementById('totalTasks').textContent = total;
        document.getElementById('activeTasks').textContent = active;
        document.getElementById('completedTasks').textContent = completed;
        document.getElementById('cancelledTasks').textContent = cancelled;
        document.getElementById('totalCost').textContent = totalCost.toFixed(0);
        document.getElementById('damagedVessels').textContent = damaged;
    }

    // ============================================================
    // 6. دوال مساعدة
    // ============================================================

    function formatDate(dateStr) {
        if (!dateStr) return '-';
        try {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        } catch (_) { return dateStr; }
    }

    function getYears() {
        const years = new Set();
        maintenanceData.forEach(r => {
            if (r.date) {
                const year = new Date(r.date).getFullYear();
                if (year) years.add(year.toString());
            }
        });
        return Array.from(years).sort();
    }

    function getUnits() {
        const units = new Set();
        maintenanceData.forEach(r => {
            if (r.unit) units.add(r.unit);
        });
        return Array.from(units).sort();
    }

    // ============================================================
    // 7. دوال الفلاتر
    // ============================================================

    function initFilters() {
        const yearSelect = document.getElementById('yearFilter');
        const unitSelect = document.getElementById('unitFilter');

        // تعبئة السنوات
        const years = getYears();
        yearSelect.innerHTML = '<option value="الكل">-- جميع السنوات --</option>';
        years.forEach(y => {
            yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
        });

        // تعبئة الوحدات
        const units = getUnits();
        unitSelect.innerHTML = '<option value="الكل">الكل</option>';
        units.forEach(u => {
            unitSelect.innerHTML += `<option value="${u}">${u}</option>`;
        });
    }

    function resetFilters() {
        document.getElementById('searchMaint').value = '';
        document.getElementById('yearFilter').value = 'الكل';
        document.getElementById('typeFilter').value = 'الكل';
        document.getElementById('unitFilter').value = 'الكل';
        renderMaintenance();
    }

    // ============================================================
    // 8. إضافة / تعديل / حذف / إكمال
    // ============================================================

    function openAddMaintenance() {
        alert('📝 سيتم فتح نموذج إضافة صيانة قريباً');
    }

    function editMaintenance(id) {
        alert('✏️ سيتم فتح نموذج تعديل الصيانة');
    }

    async function deleteMaintenance(id) {
        if (!confirm('⚠️ هل أنت متأكد من حذف هذه المهمة؟')) return;
        try {
            const token = getToken();
            const response = await fetch(`/api/maintenance/${id}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });
            if (response.ok) {
                await renderMaintenance();
                alert('✅ تم حذف المهمة بنجاح');
            } else {
                alert('❌ فشل حذف المهمة');
            }
        } catch (error) {
            alert('❌ خطأ: ' + error.message);
        }
    }

    async function completeMaintenance(id) {
        if (!confirm('✅ هل تريد إكمال هذه المهمة؟')) return;
        try {
            const token = getToken();
            const response = await fetch(`/api/maintenance/${id}/complete`, {
                method: 'PUT',
                headers: getAuthHeaders()
            });
            if (response.ok) {
                await renderMaintenance();
                alert('✅ تم إكمال المهمة بنجاح');
            } else {
                alert('❌ فشل إكمال المهمة');
            }
        } catch (error) {
            alert('❌ خطأ: ' + error.message);
        }
    }

    // ============================================================
    // 9. تحديث الصفحة
    // ============================================================

    function refreshMaintenance() {
        renderMaintenance();
        alert('🔄 تم تحديث البيانات');
    }

    // ============================================================
    // 10. التهيئة
    // ============================================================

    document.addEventListener('DOMContentLoaded', async function() {
        console.log('🔧 تحميل صفحة الصيانة...');
        await renderMaintenance();
        initFilters();
        console.log('✅ صفحة الصيانة جاهزة');
    });

    // ============================================================
    // 11. الربط العالمي
    // ============================================================

    window.renderMaintenance = renderMaintenance;
    window.refreshMaintenance = refreshMaintenance;
    window.resetFilters = resetFilters;
    window.openAddMaintenance = openAddMaintenance;
    window.editMaintenance = editMaintenance;
    window.deleteMaintenance = deleteMaintenance;
    window.completeMaintenance = completeMaintenance;
    window.getToken = getToken;
    window.getAuthHeaders = getAuthHeaders;
    window.loadVessels = loadVessels;
    window.loadMaintenance = loadMaintenance;

    console.log('✅ صفحة الصيانة v12.0 جاهزة');
</script>
