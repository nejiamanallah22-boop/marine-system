<script>
// ============================================================
// دوال الصيانة - كود مستقل داخل الصفحة
// ============================================================

function refreshMaintenancePage() {
    console.log('🔄 Refreshing maintenance page...');
    
    // تحديث قائمة المراكب في النموذج
    updateMaintenanceVessels();
    
    // تحديث الإحصائيات
    updateMaintenanceStats();
    
    // تحديث المراكب المعطبة
    renderGeneralMaintenance();
    
    // تحديث سجل الصيانة
    renderHistoryMaintenance();
    
    // تحديث وحدات الصيانة
    renderMaintenanceUnits();
    
    // تحديث فلتر السنوات
    updateYearFilter();
}

// استدعاء التحديث عند تحميل الصفحة
if (document.getElementById('page-maintenance')) {
    setTimeout(refreshMaintenancePage, 300);
    setTimeout(refreshMaintenancePage, 1000);
}

// ============================================================
// دوال الصيانة (مستقلة)
// ============================================================

function updateMaintenanceVessels() {
    const select = document.getElementById('mVesselId');
    if (!select) return;
    const currentValue = select.value;
    select.innerHTML = '<option value="">اختر المركب</option>';
    if (typeof allVessels !== 'undefined' && allVessels.length > 0) {
        allVessels.forEach(v => {
            const option = document.createElement('option');
            option.value = v.id;
            option.textContent = `${v.name} (${v.num || 'بدون رقم'}) - ${v.cat || 'بدون فئة'}`;
            if (v.id == currentValue) option.selected = true;
            select.appendChild(option);
        });
    }
}

function toggleMaintenanceForm() {
    const form = document.getElementById('maintenanceForm');
    if (!form) return;
    if (form.style.display === 'none' || form.style.display === '') {
        form.style.display = 'block';
        updateMaintenanceVessels();
        const startDate = document.getElementById('mStartDate');
        if (startDate) {
            startDate.value = new Date().toISOString().split('T')[0];
        }
        // إعادة تعيين الحقول
        document.getElementById('mRecordId').value = '';
        document.getElementById('mType').value = 'كبرى';
        document.getElementById('mUnit').value = 'وحدة الصيانة والإسناد البحري تونس';
        document.getElementById('mTechnician').value = '';
        document.getElementById('mFaultType').value = 'محرك';
        document.getElementById('mStatus').value = 'قيد الإنجاز';
        document.getElementById('mDescription').value = '';
        document.getElementById('mRepair').value = '';
        document.getElementById('mCost').value = '';
        document.getElementById('mNotes').value = '';
        document.getElementById('partsContainer').innerHTML = '';
        addPart();
        showAlert('📝 فتح نموذج إضافة صيانة', 'info');
    } else {
        form.style.display = 'none';
    }
}

function addPart() {
    const container = document.getElementById('partsContainer');
    if (!container) return;
    const div = document.createElement('div');
    div.className = 'part-item';
    div.style.cssText = 'display:flex; gap:10px; margin-bottom:5px; flex-wrap:wrap; align-items:center;';
    div.innerHTML = `
        <input type="text" placeholder="اسم القطعة" class="part-name" style="flex:2; min-width:120px; padding:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:4px; color:white;">
        <input type="number" placeholder="الكمية" class="part-qty" style="width:60px; padding:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:4px; color:white;">
        <input type="number" placeholder="السعر" class="part-price" style="width:60px; padding:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:4px; color:white;">
        <button onclick="removePart(this)" style="padding:4px 10px; background:rgba(248,113,113,0.15); color:#f87171; border:1px solid rgba(248,113,113,0.1); border-radius:4px; cursor:pointer;">✕</button>
    `;
    container.appendChild(div);
}

function removePart(btn) {
    const container = document.getElementById('partsContainer');
    if (!container) return;
    if (container.children.length > 1) {
        btn.parentElement.remove();
    } else {
        showAlert('⚠️ يجب أن يكون هناك قطعة واحدة على الأقل', 'warning');
    }
}

function getPartsData() {
    const parts = [];
    document.querySelectorAll('#partsContainer .part-item').forEach(item => {
        const name = item.querySelector('.part-name')?.value;
        const qty = parseFloat(item.querySelector('.part-qty')?.value) || 0;
        const price = parseFloat(item.querySelector('.part-price')?.value) || 0;
        if (name) {
            parts.push({ name, quantity: qty, price });
        }
    });
    return parts;
}

function saveMaintenance() {
    const token = getToken();
    if (!token) {
        showAlert('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
        return;
    }
    
    const vesselId = document.getElementById('mVesselId')?.value;
    const type = document.getElementById('mType')?.value;
    const unit = document.getElementById('mUnit')?.value;
    const technician = document.getElementById('mTechnician')?.value.trim();
    const description = document.getElementById('mDescription')?.value.trim();
    const repair = document.getElementById('mRepair')?.value.trim();
    const faultType = document.getElementById('mFaultType')?.value;
    const startDate = document.getElementById('mStartDate')?.value;
    const status = document.getElementById('mStatus')?.value;
    const cost = parseFloat(document.getElementById('mCost')?.value) || 0;
    const notes = document.getElementById('mNotes')?.value.trim();
    const parts = getPartsData();
    
    if (!vesselId) {
        showAlert('⚠️ الرجاء اختيار المركب', 'warning');
        return;
    }
    if (!description) {
        showAlert('⚠️ الرجاء إدخال وصف العطل', 'warning');
        return;
    }
    if (!technician) {
        showAlert('⚠️ الرجاء إدخال اسم الفني المسؤول', 'warning');
        return;
    }
    
    // الحصول على اسم المركب
    const vessel = typeof allVessels !== 'undefined' ? allVessels.find(v => v.id == vesselId) : null;
    const vesselName = vessel ? vessel.name : 'مركب غير معروف';
    
    // إنشاء سجل الصيانة
    const record = {
        id: Date.now(),
        vesselId: parseFloat(vesselId),
        vesselName: vesselName,
        type: type || 'عادية',
        unit: unit || 'غير محدد',
        technician: technician,
        description: description,
        repair: repair || '',
        faultType: faultType || 'أخرى',
        cost: cost,
        notes: notes || '',
        parts: parts,
        status: status || 'قيد الإنجاز',
        date: new Date().toISOString().split('T')[0],
        startDate: startDate || new Date().toISOString().split('T')[0],
        endDate: null,
        createdBy: currentUser?.name || 'Admin'
    };
    
    // حفظ في localStorage كنسخة احتياطية
    let localRecords = JSON.parse(localStorage.getItem('maintenance_records') || '[]');
    localRecords.push(record);
    localStorage.setItem('maintenance_records', JSON.stringify(localRecords));
    
    // إضافة إلى allMaintenance
    if (typeof allMaintenance !== 'undefined') {
        allMaintenance.push(record);
    }
    
    showAlert('✅ تم إضافة سجل الصيانة بنجاح', 'success');
    toggleMaintenanceForm();
    refreshMaintenancePage();
    loadAllData();
}

function renderGeneralMaintenance() {
    const container = document.getElementById('generalMaintenanceContainer');
    if (!container) return;
    
    // استخدام allVessels من التطبيق الرئيسي
    const vessels = typeof allVessels !== 'undefined' ? allVessels.filter(v => v.stat === 'معطب' || v.stat === 'صيانة') : [];
    
    if (vessels.length === 0) {
        container.innerHTML = `
            <div style="text-align:center; padding:30px; background:rgba(255,255,255,0.02); border-radius:8px; border:1px solid rgba(74,222,128,0.1);">
                <h3 style="color:#4ade80; margin:0;">✅ لا توجد مراكب معطبة حالياً</h3>
                <p style="color:rgba(255,255,255,0.3);">جميع المراكب في حالة جاهزة</p>
            </div>
        `;
        return;
    }
    
    let html = `
        <div class="scrollable-table">
            <table>
                <thead>
                    <tr>
                        <th>🚢 المركب</th>
                        <th>الفئة</th>
                        <th>الحالة</th>
                        <th>⚠️ العطل</th>
                        <th>📅 بداية العطل</th>
                        <th>⏱️ مدة التوقف</th>
                        <th>🏭 المسؤول</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody>
    `;
    
    vessels.forEach(v => {
        let downtime = '-';
        if (v.fDate) {
            const start = new Date(v.fDate);
            const now = new Date();
            const days = Math.floor((now - start) / (1000 * 60 * 60 * 24));
            if (days > 0) downtime = `${days} يوم${days > 1 ? 'اً' : ''}`;
            else downtime = 'اليوم';
        }
        
        const statusColors = {
            'معطب': '🔴 معطبة',
            'صيانة': '🟠 صيانة',
            'خارج الخدمة': '⚫ خارج الخدمة'
        };
        
        html += `
            <tr>
                <td><strong>${v.name || '-'}</strong></td>
                <td>${v.cat || '-'}</td>
                <td><span class="status-badge status-broken">${statusColors[v.stat] || v.stat}</span></td>
                <td>${v.break || '-'}</td>
                <td>${v.fDate || '-'}</td>
                <td>${downtime}</td>
                <td>${v.repairer || v.supp || '-'}</td>
                <td>
                    <button class="btn-sm btn-primary" onclick="openMaintenanceFile(${v.id})">📂 فتح</button>
                    <button class="btn-sm btn-success" onclick="fixVessel(${v.id})">✅ إصلاح</button>
                </td>
            </tr>
        `;
    });
    
    html += `</tbody></table></div>`;
    container.innerHTML = html;
}

function fixVessel(vesselId) {
    if (!confirm('⚠️ هل أنت متأكد من إصلاح هذا المركب؟')) return;
    const token = getToken();
    if (!token) {
        showAlert('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
        return;
    }
    
    // تحديث حالة المركب في allVessels
    if (typeof allVessels !== 'undefined') {
        const vessel = allVessels.find(v => v.id === vesselId);
        if (vessel) {
            vessel.stat = 'صالح';
            vessel.break = '';
        }
    }
    
    // تحديث في localStorage
    let vessels = JSON.parse(localStorage.getItem('vessels_data') || '[]');
    const idx = vessels.findIndex(v => v.id === vesselId);
    if (idx !== -1) {
        vessels[idx].stat = 'صالح';
        vessels[idx].break = '';
        localStorage.setItem('vessels_data', JSON.stringify(vessels));
    }
    
    showAlert('✅ تم إصلاح المركب وعودته للخدمة', 'success');
    loadAllData();
    refreshMaintenancePage();
}

function openMaintenanceFile(vesselId) {
    const vessel = typeof allVessels !== 'undefined' ? allVessels.find(v => v.id === vesselId) : null;
    if (!vessel) {
        showAlert('⚠️ المركب غير موجود', 'warning');
        return;
    }
    
    // عرض سجلات الصيانة لهذا المركب
    const records = typeof allMaintenance !== 'undefined' ? allMaintenance.filter(r => r.vesselId === vesselId) : [];
    const totalMaintenance = records.length;
    const totalCost = records.reduce((sum, r) => sum + (r.cost || 0), 0);
    const lastMaintenance = records.length > 0 ? records[records.length - 1] : null;
    
    let message = `📂 ملف المركب: ${vessel.name}\n`;
    message += `━━━━━━━━━━━━━━━━━━━━━\n`;
    message += `الفئة: ${vessel.cat || '-'}\n`;
    message += `الحالة: ${vessel.stat || '-'}\n`;
    message += `عدد الصيانات: ${totalMaintenance}\n`;
    message += `إجمالي التكلفة: ${totalCost} د.ت\n`;
    if (lastMaintenance) {
        message += `آخر صيانة: ${lastMaintenance.date || '-'}\n`;
    }
    message += `━━━━━━━━━━━━━━━━━━━━━\n`;
    if (records.length > 0) {
        message += `سجلات الصيانة:\n`;
        records.slice().reverse().forEach(r => {
            message += `- ${r.date || '-'} | ${r.type || '-'} | ${r.description || '-'} | ${r.cost || 0} د.ت\n`;
        });
    } else {
        message += `🚫 لا توجد سجلات صيانة\n`;
    }
    
    alert(message);
    showAlert(`📂 فتح ملف المركب: ${vessel.name}`, 'info');
}

function renderHistoryMaintenance() {
    const container = document.getElementById('historyMaintenanceContainer');
    if (!container) return;
    
    let records = typeof allMaintenance !== 'undefined' ? [...allMaintenance] : [];
    
    // تطبيق الفلترة
    const vesselFilter = document.getElementById('filterVessel')?.value?.toLowerCase() || '';
    const yearFilter = document.getElementById('filterYear')?.value || '';
    const typeFilter = document.getElementById('filterType')?.value || '';
    const unitFilter = document.getElementById('filterUnit')?.value || '';
    const costFilter = document.getElementById('filterCost')?.value || '';
    const faultFilter = document.getElementById('filterFaultType')?.value || '';
    
    if (vesselFilter) {
        records = records.filter(r => {
            const name = r.vesselName || (typeof allVessels !== 'undefined' ? allVessels.find(v => v.id === r.vesselId)?.name : '') || '';
            return name.toLowerCase().includes(vesselFilter);
        });
    }
    if (yearFilter) {
        records = records.filter(r => r.date && r.date.startsWith(yearFilter));
    }
    if (typeFilter) {
        records = records.filter(r => r.type === typeFilter);
    }
    if (unitFilter) {
        records = records.filter(r => r.unit === unitFilter);
    }
    if (faultFilter) {
        records = records.filter(r => r.faultType === faultFilter || r.description?.includes(faultFilter));
    }
    if (costFilter) {
        records = records.filter(r => {
            const cost = r.cost || 0;
            switch(costFilter) {
                case '0-1000': return cost < 1000;
                case '1000-5000': return cost >= 1000 && cost <= 5000;
                case '5000-10000': return cost > 5000 && cost <= 10000;
                case '10000+': return cost > 10000;
                default: return true;
            }
        });
    }
    
    const countEl = document.getElementById('historyCount');
    if (countEl) countEl.textContent = `📊 ${records.length} سجل`;
    
    if (records.length === 0) {
        container.innerHTML = `
            <div style="text-align:center; padding:30px; color:rgba(255,255,255,0.2); background:rgba(255,255,255,0.02); border-radius:8px;">
                🚫 لا توجد سجلات صيانة مطابقة للفلترة
            </div>
        `;
        return;
    }
    
    let html = `
        <div class="scrollable-table">
            <table>
                <thead>
                    <tr>
                        <th>📅 التاريخ</th>
                        <th>🚢 المركب</th>
                        <th>🔧 نوع الصيانة</th>
                        <th>⚠️ العطل</th>
                        <th>🔩 الإصلاح</th>
                        <th>💰 التكلفة</th>
                        <th>📊 الحالة</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody>
    `;
    
    records.slice().reverse().forEach(r => {
        const vesselName = r.vesselName || (typeof allVessels !== 'undefined' ? allVessels.find(v => v.id === r.vesselId)?.name : '') || '-';
        const statusColors = {
            'قيد الإنجاز': '#fbbf24',
            'مكتملة': '#4ade80',
            'ملغية': '#f87171'
        };
        
        html += `
            <tr>
                <td>${r.date ? new Date(r.date).toLocaleDateString('ar-TN') : '-'}</td>
                <td><strong>${vesselName}</strong></td>
                <td>${r.type || '-'}</td>
                <td>${r.description || '-'}</td>
                <td>${r.repair || '-'}</td>
                <td style="color:#4ade80; font-weight:600;">${r.cost ? r.cost + ' د.ت' : '-'}</td>
                <td><span style="color:${statusColors[r.status] || '#6c757d'}; font-weight:600;">${r.status || 'غير محدد'}</span></td>
                <td>
                    <button class="btn-sm btn-warning" onclick="editMaintenance(${r.id})">✏️</button>
                    <button class="btn-sm btn-danger" onclick="deleteMaintenance(${r.id})">🗑️</button>
                </td>
            </tr>
        `;
    });
    
    html += `</tbody></table></div>`;
    container.innerHTML = html;
}

function editMaintenance(id) {
    const records = typeof allMaintenance !== 'undefined' ? allMaintenance : [];
    const record = records.find(r => r.id === id);
    if (!record) {
        showAlert('⚠️ السجل غير موجود', 'warning');
        return;
    }
    
    // فتح النموذج وملء البيانات
    toggleMaintenanceForm();
    document.getElementById('mVesselId').value = record.vesselId;
    document.getElementById('mType').value = record.type || 'كبرى';
    document.getElementById('mUnit').value = record.unit || 'وحدة الصيانة والإسناد البحري تونس';
    document.getElementById('mTechnician').value = record.technician || '';
    document.getElementById('mFaultType').value = record.faultType || 'محرك';
    document.getElementById('mStartDate').value = record.startDate || '';
    document.getElementById('mStatus').value = record.status || 'قيد الإنجاز';
    document.getElementById('mDescription').value = record.description || '';
    document.getElementById('mRepair').value = record.repair || '';
    document.getElementById('mCost').value = record.cost || '';
    document.getElementById('mNotes').value = record.notes || '';
    document.getElementById('mRecordId').value = record.id;
    
    // إضافة القطع
    const container = document.getElementById('partsContainer');
    container.innerHTML = '';
    if (record.parts && record.parts.length) {
        record.parts.forEach(p => {
            const div = document.createElement('div');
            div.className = 'part-item';
            div.style.cssText = 'display:flex; gap:10px; margin-bottom:5px; flex-wrap:wrap; align-items:center;';
            div.innerHTML = `
                <input type="text" placeholder="اسم القطعة" class="part-name" style="flex:2; min-width:120px; padding:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:4px; color:white;" value="${p.name || ''}">
                <input type="number" placeholder="الكمية" class="part-qty" style="width:60px; padding:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:4px; color:white;" value="${p.quantity || p.qty || 0}">
                <input type="number" placeholder="السعر" class="part-price" style="width:60px; padding:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:4px; color:white;" value="${p.price || 0}">
                <button onclick="removePart(this)" style="padding:4px 10px; background:rgba(248,113,113,0.15); color:#f87171; border:1px solid rgba(248,113,113,0.1); border-radius:4px; cursor:pointer;">✕</button>
            `;
            container.appendChild(div);
        });
    } else {
        addPart();
    }
    
    // تغيير عنوان النموذج
    document.querySelector('#maintenanceForm h3').textContent = '✏️ تعديل سجل صيانة';
    showAlert('✏️ جارٍ تعديل السجل', 'info');
}

function deleteMaintenance(id) {
    if (!confirm('⚠️ هل أنت متأكد من حذف هذا السجل؟')) return;
    
    if (typeof allMaintenance !== 'undefined') {
        const index = allMaintenance.findIndex(r => r.id === id);
        if (index !== -1) {
            allMaintenance.splice(index, 1);
        }
    }
    
    // حذف من localStorage
    let records = JSON.parse(localStorage.getItem('maintenance_records') || '[]');
    records = records.filter(r => r.id !== id);
    localStorage.setItem('maintenance_records', JSON.stringify(records));
    
    showAlert('✅ تم حذف السجل', 'success');
    refreshMaintenancePage();
}

function updateMaintenanceStats() {
    const container = document.getElementById('maintenanceStats');
    if (!container) return;
    
    const records = typeof allMaintenance !== 'undefined' ? allMaintenance : [];
    const total = records.length;
    const inProgress = records.filter(r => r.status === 'قيد الإنجاز').length;
    const completed = records.filter(r => r.status === 'مكتملة').length;
    const cancelled = records.filter(r => r.status === 'ملغية').length;
    
    container.innerHTML = `
        <div class="maintenance-stats">
            <div class="stat-box stat-total"><h4>${total}</h4><p>📊 المجموع</p></div>
            <div class="stat-box stat-progress"><h4>${inProgress}</h4><p>🔄 قيد الإنجاز</p></div>
            <div class="stat-box stat-completed"><h4>${completed}</h4><p>✅ مكتملة</p></div>
            <div class="stat-box stat-cancelled"><h4>${cancelled}</h4><p>❌ ملغية</p></div>
        </div>
    `;
}

function renderMaintenanceUnits() {
    const container = document.getElementById('maintenanceUnitsContainer');
    if (!container) return;
    
    const records = typeof allMaintenance !== 'undefined' ? allMaintenance : [];
    const units = [
        'وحدة الصيانة والإسناد البحري تونس',
        'وحدة الصيانة والإسناد البحري صفاقس',
        'وحدة الصيانة والإسناد البحري المنستير',
        'وحدة الصيانة والإسناد البحري جرجيس',
        'شركة خاصة'
    ];
    
    let html = '';
    units.forEach(unit => {
        const unitRecords = records.filter(r => r.unit === unit);
        const total = unitRecords.length;
        const completed = unitRecords.filter(r => r.status === 'مكتملة').length;
        const inProgress = unitRecords.filter(r => r.status === 'قيد الإنجاز').length;
        const cancelled = unitRecords.filter(r => r.status === 'ملغية').length;
        
        html += `
            <div class="region-table-card">
                <div class="region-table-header">
                    🏭 ${unit.replace('وحدة الصيانة والإسناد البحري ', '')}
                    <span style="font-size:12px; font-weight:400; color:rgba(255,255,255,0.3); margin-right:10px;">
                        📊 ${total} سجل
                    </span>
                    <span style="font-size:11px; font-weight:400; margin-right:5px; color:rgba(255,255,255,0.3);">
                        ✅ ${completed} | 🔄 ${inProgress} | ❌ ${cancelled}
                    </span>
                </div>
                ${total === 0 ? `
                    <div style="text-align:center; padding:15px; color:rgba(255,255,255,0.2);">
                        🚫 لا توجد سجلات في هذه الوحدة
                    </div>
                ` : `
                    <div class="scrollable-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>المركب</th>
                                    <th>👨‍🔧 الفني</th>
                                    <th>💰 التكلفة</th>
                                    <th>📊 الحالة</th>
                                    <th>📅 التاريخ</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${unitRecords.slice().reverse().map(r => {
                                    const vesselName = r.vesselName || (typeof allVessels !== 'undefined' ? allVessels.find(v => v.id === r.vesselId)?.name : '') || '-';
                                    const statusColors = {
                                        'قيد الإنجاز': '#fbbf24',
                                        'مكتملة': '#4ade80',
                                        'ملغية': '#f87171'
                                    };
                                    return `
                                        <tr>
                                            <td><strong>${vesselName}</strong></td>
                                            <td>${r.technician || '-'}</td>
                                            <td style="color:#4ade80; font-weight:600;">${r.cost ? r.cost + ' د.ت' : '-'}</td>
                                            <td><span style="color:${statusColors[r.status] || '#6c757d'}; font-weight:600;">${r.status || 'غير محدد'}</span></td>
                                            <td>${r.date ? new Date(r.date).toLocaleDateString('ar-TN') : '-'}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `}
            </div>
        `;
    });
    container.innerHTML = html;
}

function updateYearFilter() {
    const select = document.getElementById('filterYear');
    if (!select) return;
    
    const records = typeof allMaintenance !== 'undefined' ? allMaintenance : [];
    const years = new Set();
    records.forEach(r => {
        if (r.date) {
            const year = r.date.split('-')[0];
            if (year) years.add(year);
        }
    });
    
    select.innerHTML = '<option value="">الكل</option>';
    Array.from(years).sort().reverse().forEach(year => {
        select.innerHTML += `<option value="${year}">${year}</option>`;
    });
}

function applyHistoryFilters() {
    renderHistoryMaintenance();
    showAlert('✅ تم تطبيق الفلترة', 'success');
}

function resetHistoryFilters() {
    document.getElementById('filterVessel').value = '';
    document.getElementById('filterYear').value = '';
    document.getElementById('filterType').value = '';
    document.getElementById('filterUnit').value = '';
    document.getElementById('filterCost').value = '';
    document.getElementById('filterFaultType').value = '';
    renderHistoryMaintenance();
    showAlert('✅ تم إلغاء الفلترة', 'success');
}

// ============================================================
// تحديث الدوال لتكون متوافقة مع app.js
// ============================================================

// إذا كانت دالة loadAllData غير معرفة، نستخدم localStorage
if (typeof loadAllData === 'undefined') {
    function loadAllData() {
        // تحميل البيانات من localStorage
        const vessels = JSON.parse(localStorage.getItem('vessels_data') || '[]');
        const records = JSON.parse(localStorage.getItem('maintenance_records') || '[]');
        
        if (typeof allVessels !== 'undefined') {
            if (vessels.length > 0) {
                allVessels = vessels;
            }
        }
        if (typeof allMaintenance !== 'undefined') {
            if (records.length > 0) {
                allMaintenance = records;
            }
        }
        refreshMaintenancePage();
    }
}

// تحميل البيانات عند بدء الصفحة
setTimeout(loadAllData, 200);
</script>
