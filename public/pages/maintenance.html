<!-- صفحة سجل الصيانة - نسخة محسنة ومصححة -->
<div id="pageMaint" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 15px;">
        <h2 style="color: #0d6efd; margin: 0;">🔧 إدارة الصيانة</h2>
        <button onclick="toggleMaintenanceForm()" class="btn btn-success" style="padding:10px 20px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer;">➕ إضافة سجل صيانة جديد</button>
    </div>

    <!-- ===== إحصائيات الصيانة ===== -->
    <div id="maintenanceStats"></div>

    <!-- ===== 1. المراكب المعطبة ===== -->
    <h3 style="color: #dc3545; margin: 30px 0 15px;">🟥 1. المراكب المعطبة</h3>
    <div id="generalMaintenanceContainer"></div>

    <!-- ===== نموذج إضافة الصيانة ===== -->
    <div id="maintenanceForm" style="display:none; background:#f8f9fa; padding:20px; border-radius:10px; margin:15px 0; border:2px solid #0d6efd;">
        <h3 style="margin-top:0; color:#0d6efd;">📝 تسجيل صيانة</h3>
        
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px;">
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:5px;">🚢 المركب</label>
                <select id="mVesselId" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px;">
                    <option value="">اختر المركب</option>
                </select>
            </div>
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:5px;">📋 نوع الصيانة</label>
                <select id="mType" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px;">
                    <option value="كبرى">كبرى</option>
                    <option value="دورية">دورية</option>
                    <option value="طارئة">طارئة</option>
                    <option value="عادية">عادية</option>
                </select>
            </div>
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:5px;">🏭 الوحدة</label>
                <select id="mUnit" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px;">
                    <option value="وحدة الصيانة والإسناد البحري تونس">تونس</option>
                    <option value="وحدة الصيانة والإسناد البحري صفاقس">صفاقس</option>
                    <option value="وحدة الصيانة والإسناد البحري المنستير">المنستير</option>
                    <option value="وحدة الصيانة والإسناد البحري جرجيس">جرجيس</option>
                    <option value="شركة خاصة">شركة خاصة</option>
                </select>
            </div>
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:5px;">👨‍🔧 الفني</label>
                <input type="text" id="mTechnician" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px;" placeholder="اسم الفني">
            </div>
        </div>
        
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-top:15px;">
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:5px;">⚠️ نوع العطل</label>
                <select id="mFaultType" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px;">
                    <option value="محرك">محرك</option>
                    <option value="كهرباء">كهرباء</option>
                    <option value="هيدروليك">هيدروليك</option>
                    <option value="هيكل">هيكل</option>
                    <option value="توجيه">توجيه</option>
                    <option value="تبريد">تبريد</option>
                    <option value="أخرى">أخرى</option>
                </select>
            </div>
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:5px;">📅 تاريخ بدء العطل</label>
                <input type="date" id="mStartDate" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px;">
            </div>
        </div>
        
        <div style="margin-top:15px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">📝 وصف العطل</label>
            <textarea id="mDescription" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px; height:80px;" placeholder="وصف تفصيلي للعطل"></textarea>
        </div>
        
        <div style="margin-top:15px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">🔧 الإصلاح المقترح</label>
            <textarea id="mRepair" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px; height:60px;" placeholder="خطة الإصلاح المقترحة"></textarea>
        </div>
        
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-top:15px;">
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:5px;">💰 التكلفة (د.ت)</label>
                <input type="number" id="mCost" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px;" placeholder="0">
            </div>
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:5px;">📝 ملاحظات</label>
                <input type="text" id="mNotes" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px;" placeholder="ملاحظات إضافية">
            </div>
        </div>
        
        <!-- قطع الغيار -->
        <div style="margin-top:15px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">🔩 قطع الغيار المستخدمة</label>
            <div id="partsContainer">
                <div class="part-item">
                    <input type="text" placeholder="اسم القطعة" class="part-name" style="flex:2; min-width:150px; padding:8px; border:1px solid #ced4da; border-radius:5px;">
                    <input type="number" placeholder="الكمية" class="part-qty" style="width:80px; padding:8px; border:1px solid #ced4da; border-radius:5px;">
                    <input type="number" placeholder="السعر" class="part-price" style="width:80px; padding:8px; border:1px solid #ced4da; border-radius:5px;">
                    <button onclick="removePart(this)" style="padding:8px 15px; background:#dc3545; color:white; border:none; border-radius:5px; cursor:pointer;">✕</button>
                </div>
            </div>
            <button onclick="addPart()" style="padding:5px 15px; background:#0d6efd; color:white; border:none; border-radius:5px; cursor:pointer; margin-top:5px;">➕ إضافة قطعة</button>
        </div>
        
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button onclick="saveMaintenance()" class="btn btn-success" style="padding:10px 30px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer;">💾 حفظ</button>
            <button onclick="toggleMaintenanceForm()" class="btn btn-secondary" style="padding:10px 30px; background:#6c757d; color:white; border:none; border-radius:5px; cursor:pointer;">❌ إلغاء</button>
        </div>
    </div>
    
    <!-- ===== 4. Historique de Maintenance ===== -->
    <h3 style="color:#0d6efd; margin:30px 0 15px;">📚 4. Historique de Maintenance</h3>
    
    <!-- فلترة متقدمة -->
    <div style="background:#f8f9fa; padding:15px; border-radius:8px; margin-bottom:15px;">
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px;">
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:3px; font-size:12px;">🚢 المركب</label>
                <input type="text" id="filterVessel" placeholder="بحث" style="width:100%; padding:6px; border:1px solid #ced4da; border-radius:5px;">
            </div>
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:3px; font-size:12px;">📅 السنة</label>
                <select id="filterYear" style="width:100%; padding:6px; border:1px solid #ced4da; border-radius:5px;">
                    <option value="">الكل</option>
                </select>
            </div>
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:3px; font-size:12px;">🔧 نوع الصيانة</label>
                <select id="filterType" style="width:100%; padding:6px; border:1px solid #ced4da; border-radius:5px;">
                    <option value="">الكل</option>
                    <option value="كبرى">كبرى</option>
                    <option value="دورية">دورية</option>
                    <option value="طارئة">طارئة</option>
                    <option value="عادية">عادية</option>
                </select>
            </div>
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:3px; font-size:12px;">🏭 الوحدة</label>
                <select id="filterUnit" style="width:100%; padding:6px; border:1px solid #ced4da; border-radius:5px;">
                    <option value="">الكل</option>
                    <option value="وحدة الصيانة والإسناد البحري تونس">تونس</option>
                    <option value="وحدة الصيانة والإسناد البحري صفاقس">صفاقس</option>
                    <option value="وحدة الصيانة والإسناد البحري المنستير">المنستير</option>
                    <option value="وحدة الصيانة والإسناد البحري جرجيس">جرجيس</option>
                    <option value="شركة خاصة">شركة خاصة</option>
                </select>
            </div>
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:3px; font-size:12px;">💰 التكلفة</label>
                <select id="filterCost" style="width:100%; padding:6px; border:1px solid #ced4da; border-radius:5px;">
                    <option value="">الكل</option>
                    <option value="0-1000">أقل من 1000</option>
                    <option value="1000-5000">1000 - 5000</option>
                    <option value="5000-10000">5000 - 10000</option>
                    <option value="10000+">أكثر من 10000</option>
                </select>
            </div>
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:3px; font-size:12px;">⚠️ نوع العطل</label>
                <select id="filterFaultType" style="width:100%; padding:6px; border:1px solid #ced4da; border-radius:5px;">
                    <option value="">الكل</option>
                    <option value="محرك">محرك</option>
                    <option value="كهرباء">كهرباء</option>
                    <option value="هيدروليك">هيدروليك</option>
                    <option value="هيكل">هيكل</option>
                    <option value="توجيه">توجيه</option>
                    <option value="تبريد">تبريد</option>
                </select>
            </div>
        </div>
        <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
            <button onclick="applyHistoryFilters()" class="btn btn-primary" style="padding:8px 20px; background:#0d6efd; color:white; border:none; border-radius:5px; cursor:pointer;">🔍 فلترة</button>
            <button onclick="resetHistoryFilters()" class="btn btn-secondary" style="padding:8px 20px; background:#6c757d; color:white; border:none; border-radius:5px; cursor:pointer;">🔄 إلغاء</button>
            <span id="historyCount" style="font-weight:bold; padding:8px; background:#e9ecef; border-radius:5px;">📊 0 سجل</span>
        </div>
    </div>
    
    <div id="historyMaintenanceContainer"></div>
    
    <!-- ===== وحدات الصيانة ===== -->
    <h3 style="color:#0d6efd; margin:30px 0 15px;">🏭 وحدات الصيانة</h3>
    <div id="maintenanceUnitsContainer"></div>
</div>
