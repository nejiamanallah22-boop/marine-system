<script>
// ============================================================
// 🚢 دوال الصيانة - الكود الكامل المصحح
// ============================================================

// ============================================================
// 1. تحميل البيانات من localStorage أو allVessels
// ============================================================

function getVesselsData() {
    // محاولة الحصول من allVessels (التطبيق الرئيسي)
    if (typeof allVessels !== 'undefined' && allVessels.length > 0) {
        console.log('✅ Using allVessels from app:', allVessels.length);
        return allVessels;
    }
    
    // محاولة من localStorage
    try {
        const stored = localStorage.getItem('vessels_data');
        if (stored) {
            const data = JSON.parse(stored);
            if (data.length > 0) {
                console.log('✅ Loaded vessels from localStorage:', data.length);
                return data;
            }
        }
    } catch(e) {
        console.error('Error loading vessels:', e);
    }
    
    // البيانات التجريبية
    const demo = getDemoVessels();
    localStorage.setItem('vessels_data', JSON.stringify(demo));
    console.log('✅ Using demo vessels:', demo.length);
    return demo;
}

function getMaintenanceRecords() {
    // محاولة الحصول من allMaintenance (التطبيق الرئيسي)
    if (typeof allMaintenance !== 'undefined' && allMaintenance.length > 0) {
        console.log('✅ Using allMaintenance from app:', allMaintenance.length);
        return allMaintenance;
    }
    
    // محاولة من localStorage
    try {
        const stored = localStorage.getItem('maintenance_records');
        if (stored) {
            const data = JSON.parse(stored);
            if (data.length > 0) {
                console.log('✅ Loaded records from localStorage:', data.length);
                return data;
            }
        }
    } catch(e) {
        console.error('Error loading records:', e);
    }
    
    // البيانات التجريبية
    const demo = getDemoRecords();
    localStorage.setItem('maintenance_records', JSON.stringify(demo));
    console.log('✅ Using demo records:', demo.length);
    return demo;
}

function updateMaintenanceVessels() {
    const select = document.getElementById('mVesselId');
    if (!select) return;
    
    const currentValue = select.value;
    const vessels = getVesselsData();
    
    select.innerHTML = '<option value="">-- اختر المركب --</option>';
    
    vessels.forEach(v => {
        const option = document.createElement('option');
        option.value = v.id;
        const num = v.num || 'بدون رقم';
        const cat = v.cat || 'بدون فئة';
        option.textContent = `${v.name} (${num}) - ${cat}`;
        if (v.id == currentValue) option.selected = true;
        select.appendChild(option);
    });
    
    console.log('✅ تم تحديث قائمة المراكب:', vessels.length);
}

// ============================================================
// 4. تحديث فلتر السنوات (2025، 2026، 2027...)
// ============================================================

function updateYearFilter() {
    const select = document.getElementById('filterYear');
    if (!select) return;
    
    const records = getMaintenanceRecords();
    const years = new Set();
    
    // جمع السنوات من السجلات
    records.forEach(r => {
        if (r.date) {
            const year = r.date.split('-')[0];
            if (year && year.length === 4) years.add(year);
        }
        if (r.startDate) {
            const year = r.startDate.split('-')[0];
            if (year && year.length === 4) years.add(year);
        }
    });
    
    // إذا لم توجد سنوات، أضف السنوات الحالية والماضية
    if (years.size === 0) {
        const currentYear = new Date().getFullYear();
        for (let i = -2; i <= 2; i++) {
            years.add((currentYear + i).toString());
        }
    }
    
    const currentValue = select.value;
    select.innerHTML = '<option value="">-- جميع السنوات --</option>';
    
    // ترتيب السنوات تنازلياً
    Array.from(years).sort().reverse().forEach(year => {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = `📅 ${year}`;
        if (year === currentValue) option.selected = true;
        select.appendChild(option);
    });
    
    console.log('✅ تم تحديث فلتر السنوات:', Array.from(years).sort().reverse());
}

function renderHistoryMaintenance() {
    const container = document.getElementById('historyMaintenanceContainer');
    if (!container) return;
    
    let records = getMaintenanceRecords();
    
    // تطبيق الفلترة
    const vesselFilter = document.getElementById('filterVessel')?.value?.toLowerCase() || '';
    const yearFilter = document.getElementById('filterYear')?.value || '';
    const typeFilter = document.getElementById('filterType')?.value || '';
    const unitFilter = document.getElementById('filterUnit')?.value || '';
    const costFilter = document.getElementById('filterCost')?.value || '';
    const faultFilter = document.getElementById('filterFaultType')?.value || '';
    
    if (vesselFilter) {
        records = records.filter(r => {
            const name = r.vesselName || '';
            return name.toLowerCase().includes(vesselFilter);
        });
    }
    if (yearFilter) {
        records = records.filter(r => r.date && r.date.startsWith(yearFilter));
    }
    if (typeFilter) {
        records = records.filter(r => r.type === typeFilter);
    }
    if (unitFilter) {
        records = records.filter(r => r.unit === unitFilter);
    }
    if (faultFilter) {
        records = records.filter(r => r.faultType === faultFilter || r.description?.includes(faultFilter));
    }
    if (costFilter) {
        records = records.filter(r => {
            const cost = r.cost || 0;
            switch(costFilter) {
                case '0-1000': return cost < 1000;
                case '1000-5000': return cost >= 1000 && cost <= 5000;
                case '5000-10000': return cost > 5000 && cost <= 10000;
                case '10000+': return cost > 10000;
                default: return true;
            }
        });
    }
    
    const countEl = document.getElementById('historyCount');
    if (countEl) countEl.textContent = `📊 ${records.length} سجل`;
    
    if (records.length === 0) {
        container.innerHTML = `
            <div style="text-align:center; padding:30px; color:rgba(255,255,255,0.2); background:rgba(255,255,255,0.02); border-radius:8px;">
                🚫 لا توجد سجلات صيانة مطابقة للفلترة
            </div>
        `;
        return;
    }
    
    let html = `
        <div class="scrollable-table">
            <table>
                <thead>
                    <tr>
                        <th>📅 التاريخ</th>
                        <th>🚢 المركب</th>
                        <th>🔧 نوع الصيانة</th>
                        <th>⚠️ العطل</th>
                        <th>💰 التكلفة</th>
                        <th>📊 الحالة</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody>
    `;
    
    records.slice().reverse().forEach(r => {
        const statusColors = {
            'قيد الإنجاز': '#fbbf24',
            'مكتملة': '#4ade80',
            'ملغية': '#f87171'
        };
        
        html += `
            <tr>
                <td>${r.date ? new Date(r.date).toLocaleDateString('ar-TN') : '-'}</td>
                <td><strong>${r.vesselName || '-'}</strong></td>
                <td>${r.type || '-'}</td>
                <td>${r.description || '-'}</td>
                <td style="color:#4ade80; font-weight:600;">${r.cost ? r.cost + ' د.ت' : '-'}</td>
                <td><span style="color:${statusColors[r.status] || '#6c757d'}; font-weight:600;">${r.status || 'غير محدد'}</span></td>
                <td>
                    <button class="btn-sm btn-warning" onclick="editMaintenance(${r.id})">✏️</button>
                    <button class="btn-sm btn-danger" onclick="deleteMaintenance(${r.id})">🗑️</button>
                </td>
            </tr>
        `;
    });
    
    html += `</tbody></table></div>`;
    container.innerHTML = html;
}

function addPart() {
    const container = document.getElementById('partsContainer');
    if (!container) return;
    const div = document.createElement('div');
    div.className = 'part-item';
    div.style.cssText = 'display:flex; gap:10px; margin-bottom:5px; flex-wrap:wrap; align-items:center;';
    div.innerHTML = `
        <input type="text" placeholder="اسم القطعة" class="part-name" style="flex:2; min-width:120px; padding:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:4px; color:white;">
        <input type="number" placeholder="الكمية" class="part-qty" style="width:60px; padding:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:4px; color:white;">
        <input type="number" placeholder="السعر" class="part-price" style="width:60px; padding:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:4px; color:white;">
        <button onclick="removePart(this)" style="padding:4px 10px; background:rgba(248,113,113,0.15); color:#f87171; border:1px solid rgba(248,113,113,0.1); border-radius:4px; cursor:pointer;">✕</button>
    `;
    container.appendChild(div);
}

function removePart(btn) {
    const container = document.getElementById('partsContainer');
    if (!container) return;
    if (container.children.length > 1) {
        btn.parentElement.remove();
    } else {
        showAlert('⚠️ يجب أن يكون هناك قطعة واحدة على الأقل', 'warning');
    }
}

function getPartsData() {
    const parts = [];
    document.querySelectorAll('#partsContainer .part-item').forEach(item => {
        const name = item.querySelector('.part-name')?.value;
        const qty = parseFloat(item.querySelector('.part-qty')?.value) || 0;
        const price = parseFloat(item.querySelector('.part-price')?.value) || 0;
        if (name) {
            parts.push({ name, quantity: qty, price });
        }
    });
    return parts;
}

function saveMaintenance() {
    const vesselId = document.getElementById('mVesselId')?.value;
    const type = document.getElementById('mType')?.value;
    const unit = document.getElementById('mUnit')?.value;
    const technician = document.getElementById('mTechnician')?.value.trim();
    const description = document.getElementById('mDescription')?.value.trim();
    const repair = document.getElementById('mRepair')?.value.trim();
    const faultType = document.getElementById('mFaultType')?.value;
    const startDate = document.getElementById('mStartDate')?.value;
    const status = document.getElementById('mStatus')?.value;
    const cost = parseFloat(document.getElementById('mCost')?.value) || 0;
    const notes = document.getElementById('mNotes')?.value.trim();
    const parts = getPartsData();
    
    if (!vesselId) {
        showAlert('⚠️ الرجاء اختيار المركب', 'warning');
        return;
    }
    if (!description) {
        showAlert('⚠️ الرجاء إدخال وصف العطل', 'warning');
        return;
    }
    if (!technician) {
        showAlert('⚠️ الرجاء إدخال اسم الفني المسؤول', 'warning');
        return;
    }
    
    const vessels = getVesselsData();
    const vessel = vessels.find(v => v.id == vesselId);
    const vesselName = vessel ? vessel.name : 'مركب غير معروف';
    
    const record = {
        id: Date.now(),
        vesselId: parseFloat(vesselId),
        vesselName: vesselName,
        type: type || 'عادية',
        unit: unit || 'غير محدد',
        technician: technician,
        description: description,
        repair: repair || '',
        faultType: faultType || 'أخرى',
        cost: cost,
        notes: notes || '',
        parts: parts,
        status: status || 'قيد الإنجاز',
        date: new Date().toISOString().split('T')[0],
        startDate: startDate || new Date().toISOString().split('T')[0],
        endDate: null,
        createdBy: currentUser?.name || 'Admin'
    };
    
    // حفظ في localStorage
    let records = JSON.parse(localStorage.getItem('maintenance_records') || '[]');
    records.push(record);
    localStorage.setItem('maintenance_records', JSON.stringify(records));
    
    // إذا كان allMaintenance موجوداً
    if (typeof allMaintenance !== 'undefined') {
        allMaintenance.push(record);
    }
    
    showAlert('✅ تم إضافة سجل الصيانة بنجاح', 'success');
    toggleMaintenanceForm();
    refreshMaintenancePage();
}

function deleteMaintenance(id) {
    if (!confirm('⚠️ هل أنت متأكد من حذف هذا السجل؟')) return;
    
    let records = JSON.parse(localStorage.getItem('maintenance_records') || '[]');
    records = records.filter(r => r.id !== id);
    localStorage.setItem('maintenance_records', JSON.stringify(records));
    
    if (typeof allMaintenance !== 'undefined') {
        const index = allMaintenance.findIndex(r => r.id === id);
        if (index !== -1) allMaintenance.splice(index, 1);
    }
    
    showAlert('✅ تم حذف السجل', 'success');
    refreshMaintenancePage();
}

function editMaintenance(id) {
    const records = getMaintenanceRecords();
    const record = records.find(r => r.id === id);
    if (!record) {
        showAlert('⚠️ السجل غير موجود', 'warning');
        return;
    }
    
    toggleMaintenanceForm();
    document.getElementById('mVesselId').value = record.vesselId;
    document.getElementById('mType').value = record.type || 'كبرى';
    document.getElementById('mUnit').value = record.unit || 'وحدة الصيانة والإسناد البحري تونس';
    document.getElementById('mTechnician').value = record.technician || '';
    document.getElementById('mFaultType').value = record.faultType || 'محرك';
    document.getElementById('mStartDate').value = record.startDate || '';
    document.getElementById('mStatus').value = record.status || 'قيد الإنجاز';
    document.getElementById('mDescription').value = record.description || '';
    document.getElementById('mRepair').value = record.repair || '';
    document.getElementById('mCost').value = record.cost || '';
    document.getElementById('mNotes').value = record.notes || '';
    document.getElementById('mRecordId').value = record.id;
    
    const container = document.getElementById('partsContainer');
    container.innerHTML = '';
    if (record.parts && record.parts.length) {
        record.parts.forEach(p => {
            const div = document.createElement('div');
            div.className = 'part-item';
            div.style.cssText = 'display:flex; gap:10px; margin-bottom:5px; flex-wrap:wrap; align-items:center;';
            div.innerHTML = `
                <input type="text" placeholder="اسم القطعة" class="part-name" style="flex:2; min-width:120px; padding:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:4px; color:white;" value="${p.name || ''}">
                <input type="number" placeholder="الكمية" class="part-qty" style="width:60px; padding:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:4px; color:white;" value="${p.quantity || p.qty || 0}">
                <input type="number" placeholder="السعر" class="part-price" style="width:60px; padding:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:4px; color:white;" value="${p.price || 0}">
                <button onclick="removePart(this)" style="padding:4px 10px; background:rgba(248,113,113,0.15); color:#f87171; border:1px solid rgba(248,113,113,0.1); border-radius:4px; cursor:pointer;">✕</button>
            `;
            container.appendChild(div);
        });
    } else {
        addPart();
    }
    
    document.querySelector('#maintenanceForm h3').textContent = '✏️ تعديل سجل صيانة';
}

function fixVessel(vesselId) {
    if (!confirm('⚠️ هل أنت متأكد من إصلاح هذا المركب؟')) return;
    
    let vessels = JSON.parse(localStorage.getItem('vessels_data') || '[]');
    const idx = vessels.findIndex(v => v.id === vesselId);
    if (idx !== -1) {
        vessels[idx].stat = 'صالح';
        vessels[idx].break = '';
        localStorage.setItem('vessels_data', JSON.stringify(vessels));
    }
    
    if (typeof allVessels !== 'undefined') {
        const vessel = allVessels.find(v => v.id === vesselId);
        if (vessel) {
            vessel.stat = 'صالح';
            vessel.break = '';
        }
    }
    
    showAlert('✅ تم إصلاح المركب وعودته للخدمة', 'success');
    refreshMaintenancePage();
}

function openMaintenanceFile(vesselId) {
    const vessels = getVesselsData();
    const vessel = vessels.find(v => v.id === vesselId);
    if (!vessel) {
        showAlert('⚠️ المركب غير موجود', 'warning');
        return;
    }
    
    const records = getMaintenanceRecords().filter(r => r.vesselId === vesselId);
    const totalMaintenance = records.length;
    const totalCost = records.reduce((sum, r) => sum + (r.cost || 0), 0);
    
    let message = `📂 ملف المركب: ${vessel.name}\n`;
    message += `━━━━━━━━━━━━━━━━━━━━━\n`;
    message += `الفئة: ${vessel.cat || '-'}\n`;
    message += `الحالة: ${vessel.stat || '-'}\n`;
    message += `عدد الصيانات: ${totalMaintenance}\n`;
    message += `إجمالي التكلفة: ${totalCost} د.ت\n`;
    message += `━━━━━━━━━━━━━━━━━━━━━\n`;
    if (records.length > 0) {
        message += `سجلات الصيانة:\n`;
        records.slice().reverse().forEach(r => {
            message += `- ${r.date || '-'} | ${r.type || '-'} | ${r.description || '-'} | ${r.cost || 0} د.ت\n`;
        });
    } else {
        message += `🚫 لا توجد سجلات صيانة\n`;
    }
    
    alert(message);
}

function applyHistoryFilters() {
    renderHistoryMaintenance();
    showAlert('✅ تم تطبيق الفلترة', 'success');
}

function resetHistoryFilters() {
    document.getElementById('filterVessel').value = '';
    document.getElementById('filterYear').value = '';
    document.getElementById('filterType').value = '';
    document.getElementById('filterUnit').value = '';
    document.getElementById('filterCost').value = '';
    document.getElementById('filterFaultType').value = '';
    renderHistoryMaintenance();
    showAlert('✅ تم إلغاء الفلترة', 'success');
}
