<div id="page-maintenance">
    <h2 style="color:#0d6efd; margin-bottom:20px;">🔧 إدارة الصيانة</h2>
    
    <!-- ===== إحصائيات الصيانة ===== -->
    <div id="maintenanceStats"></div>
    
    <!-- ===== زر إضافة صيانة جديدة ===== -->
    <button onclick="toggleMaintenanceForm()" style="padding:10px 20px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer; font-size:14px; margin:15px 0;">
        ➕ إضافة سجل صيانة جديد
    </button>
    
    <!-- ===== نموذج إضافة الصيانة ===== -->
    <div id="maintenanceForm" style="display:none; background:#f8f9fa; padding:20px; border-radius:10px; margin:15px 0; border:2px solid #0d6efd;">
        <h3 style="margin-top:0; color:#0d6efd;">📝 تسجيل صيانة</h3>
        
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px;">
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:5px;">🚢 المركب</label>
                <select id="mVesselId" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px;">
                    <option value="">اختر المركب</option>
                </select>
            </div>
            
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:5px;">📋 نوع الصيانة</label>
                <select id="mType" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px;">
                    <option value="عادية">عادية</option>
                    <option value="طارئة">طارئة</option>
                    <option value="دورية">دورية</option>
                    <option value="كبيرة">كبيرة</option>
                </select>
            </div>
            
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:5px;">🏭 الوحدة</label>
                <select id="mUnit" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px;">
                    <option value="وحدة الصيانة والإسناد البحري تونس">وحدة الصيانة والإسناد البحري تونس</option>
                    <option value="وحدة الصيانة والإسناد البحري صفاقس">وحدة الصيانة والإسناد البحري صفاقس</option>
                    <option value="وحدة الصيانة والإسناد البحري المنستير">وحدة الصيانة والإسناد البحري المنستير</option>
                    <option value="وحدة الصيانة والإسناد البحري جرجيس">وحدة الصيانة والإسناد البحري جرجيس</option>
                    <option value="شركة خاصة">شركة خاصة</option>
                </select>
            </div>
            
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:5px;">👨‍🔧 الفني المسؤول</label>
                <input type="text" id="mTechnician" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px;" placeholder="اسم الفني">
            </div>
        </div>
        
        <div style="margin-top:15px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">📝 وصف العطل</label>
            <textarea id="mDescription" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px; height:80px;" placeholder="وصف تفصيلي للعطل"></textarea>
        </div>
        
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-top:15px;">
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:5px;">💰 التكلفة (د.ت)</label>
                <input type="number" id="mCost" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px;" placeholder="0">
            </div>
            <div>
                <label style="display:block; font-weight:bold; margin-bottom:5px;">📝 ملاحظات</label>
                <input type="text" id="mNotes" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:5px;" placeholder="ملاحظات إضافية">
            </div>
        </div>
        
        <!-- ===== قطع الغيار ===== -->
        <div style="margin-top:15px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">🔩 قطع الغيار المستخدمة</label>
            <div id="partsContainer">
                <div class="part-item" style="display:flex; gap:10px; margin-bottom:5px; flex-wrap:wrap;">
                    <input type="text" placeholder="اسم القطعة" class="part-name" style="flex:2; padding:8px; border:1px solid #ced4da; border-radius:5px;">
                    <input type="number" placeholder="الكمية" class="part-qty" style="width:80px; padding:8px; border:1px solid #ced4da; border-radius:5px;">
                    <input type="number" placeholder="السعر" class="part-price" style="width:80px; padding:8px; border:1px solid #ced4da; border-radius:5px;">
                    <button class="remove-part" onclick="removePart(this)" style="padding:8px 15px; background:#dc3545; color:white; border:none; border-radius:5px; cursor:pointer;">✕</button>
                </div>
            </div>
            <button onclick="addPart()" style="padding:5px 15px; background:#0d6efd; color:white; border:none; border-radius:5px; cursor:pointer; margin-top:5px;">➕ إضافة قطعة</button>
        </div>
        
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button onclick="saveMaintenance()" style="padding:10px 30px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer;">💾 حفظ</button>
            <button onclick="toggleMaintenanceForm()" style="padding:10px 30px; background:#6c757d; color:white; border:none; border-radius:5px; cursor:pointer;">❌ إلغاء</button>
        </div>
    </div>
    
    <!-- ===== الصيانة العامة (المراكب المعطبة) ===== -->
    <h3 style="color:#dc3545; margin:30px 0 15px;">🛠️ المراكب المعطبة</h3>
    <div id="generalMaintenanceContainer"></div>
    
    <!-- ===== سجل الصيانة المكتملة ===== -->
    <h3 style="color:#28a745; margin:30px 0 15px;">📋 سجل الصيانة المكتملة</h3>
    
    <!-- فلترة -->
    <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:15px; background:#f8f9fa; padding:15px; border-radius:8px;">
        <input type="text" id="filterVessel" placeholder="🔍 بحث بالمركب" style="padding:8px; border:1px solid #ced4da; border-radius:5px; flex:1; min-width:150px;">
        <input type="date" id="filterDateFrom" style="padding:8px; border:1px solid #ced4da; border-radius:5px;">
        <span style="display:flex; align-items:center;">إلى</span>
        <input type="date" id="filterDateTo" style="padding:8px; border:1px solid #ced4da; border-radius:5px;">
        <select id="filterStatus" style="padding:8px; border:1px solid #ced4da; border-radius:5px;">
            <option value="">جميع الحالات</option>
            <option value="مكتملة">✅ مكتملة</option>
            <option value="ملغية">❌ ملغية</option>
        </select>
        <button onclick="applyHistoryFilters()" style="padding:8px 20px; background:#0d6efd; color:white; border:none; border-radius:5px; cursor:pointer;">🔍 فلترة</button>
        <button onclick="resetHistoryFilters()" style="padding:8px 20px; background:#6c757d; color:white; border:none; border-radius:5px; cursor:pointer;">🔄 إلغاء</button>
    </div>
    
    <div id="historyCount" style="margin-bottom:10px; font-weight:bold;">📊 0 سجل</div>
    <div id="historyMaintenanceContainer"></div>
    
    <!-- ===== وحدات الصيانة ===== -->
    <h3 style="color:#0d6efd; margin:30px 0 15px;">🏭 وحدات الصيانة</h3>
    <div id="maintenanceUnitsContainer"></div>
</div>
