<script>
// ============================================================
// 📊 EFFICIENCY PAGE - v7.0 PRO MAX
// ============================================================

// ============================================================
// 1. المتغيرات العامة
// ============================================================

let allVessels = [];
let fleetChart = null;
let categoriesChart = null;
let comparisonChart = null;
let currentChartType = 'doughnut';

const CATEGORIES = ['البروق', 'صقور', 'خوافر', 'زوارق مزدوجة', 'طوافات'];
const REGIONS = ['الشمال', 'الساحل', 'الوسط', 'الجنوب'];
const REGION_NAMES = {
    'الشمال': '🗺️ الحرس البحري بالشمال',
    'الساحل': '🗺️ الحرس البحري بالساحل',
    'الوسط': '🗺️ الحرس البحري بالوسط',
    'الجنوب': '🗺️ الحرس البحري بالجنوب'
};

// ============================================================
// 2. دوال مساعدة
// ============================================================

function escapeHTML(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function getToken() {
    return localStorage.getItem('marine_auth_token') || localStorage.getItem('token');
}

function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer') || document.body;
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    
    const icons = {
        success: '✅',
        error: '❌',
        warning: '⚠️',
        info: 'ℹ️'
    };
    
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${message}`;
    container.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(30px)';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function formatDate(dateStr) {
    if (!dateStr) return '--';
    try {
        const date = new Date(dateStr);
        if (isNaN(date.getTime())) return '--';
        return date.toLocaleDateString('ar-TN', {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
        });
    } catch {
        return '--';
    }
}

function getEfficiencyBadge(percent) {
    if (percent >= 80) return { class: 'success', text: '✅ ممتاز' };
    if (percent >= 50) return { class: 'warning', text: '⚠️ متوسط' };
    return { class: 'danger', text: '❌ ضعيف' };
}

function getRowClass(percent) {
    if (percent >= 80) return 'row-high';
    if (percent >= 50) return 'row-mid';
    return 'row-low';
}

// ============================================================
// 3. تحميل البيانات
// ============================================================

async function loadVessels() {
    console.log('🔄 تحميل بيانات الأسطول...');
    
    const token = getToken();
    if (!token) {
        console.warn('⚠️ لا يوجد توكن');
        return [];
    }
    
    try {
        const response = await fetch('/api/vessels', {
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            }
        });
        
        if (!response.ok) throw new Error('فشل تحميل البيانات');
        
        const data = await response.json();
        const vessels = data.vessels || data || [];
        allVessels = vessels;
        console.log('✅ تم تحميل المراكب:', vessels.length);
        return vessels;
        
    } catch (error) {
        console.error('❌ خطأ في تحميل البيانات:', error);
        showToast('❌ خطأ في تحميل البيانات: ' + error.message, 'error');
        return [];
    }
}

// ============================================================
// 4. عرض بطاقات الإحصائيات
// ============================================================

function renderStats(vessels) {
    const container = document.getElementById('statsCards');
    if (!container) return;
    
    const data = vessels || allVessels;
    const total = data.length;
    const ok = data.filter(x => x.stat === 'صالح').length;
    const maintenance = data.filter(x => x.stat === 'صيانة').length;
    const broken = data.filter(x => x.stat === 'معطب').length;
    const efficiency = total ? ((ok / total) * 100).toFixed(1) : 0;
    
    container.innerHTML = `
        <div class="stat-card">
            <div class="stat-icon">🚢</div>
            <div class="stat-value">${total}</div>
            <div class="stat-label">إجمالي المراكب</div>
        </div>
        <div class="stat-card" style="border-top-color: var(--color-success);">
            <div class="stat-icon">✅</div>
            <div class="stat-value" style="color: var(--color-success);">${ok}</div>
            <div class="stat-label">صالح للخدمة</div>
        </div>
        <div class="stat-card" style="border-top-color: var(--color-warning);">
            <div class="stat-icon">🔧</div>
            <div class="stat-value" style="color: var(--color-warning);">${maintenance}</div>
            <div class="stat-label">تحت الصيانة</div>
        </div>
        <div class="stat-card" style="border-top-color: var(--color-danger);">
            <div class="stat-icon">⚠️</div>
            <div class="stat-value" style="color: var(--color-danger);">${broken}</div>
            <div class="stat-label">معطب</div>
        </div>
        <div class="stat-card" style="border-top-color: var(--color-gold);">
            <div class="stat-icon">📈</div>
            <div class="stat-value" style="color: var(--color-gold);">${efficiency}%</div>
            <div class="stat-label">نسبة النجاعة</div>
        </div>
    `;
}

// ============================================================
// 5. النجاعة العامة
// ============================================================

function renderGeneralEfficiency(vessels) {
    const container = document.getElementById('generalEffTableContainer');
    if (!container) return;
    
    const data = vessels || allVessels;
    const totalOk = data.filter(x => x.stat === 'صالح').length;
    const totalAll = data.length;
    const generalEff = totalAll ? ((totalOk / totalAll) * 100).toFixed(1) : 0;
    const badge = getEfficiencyBadge(generalEff);
    
    // تحديث الشارة
    const badgeEl = document.getElementById('generalEffBadge');
    if (badgeEl) {
        badgeEl.className = `section-badge ${badge.class}`;
        badgeEl.textContent = `📊 ${generalEff}% - ${badge.text}`;
    }
    
    let html = `
        <div class="section-content">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>الفئة</th>
                            <th>✅ صالح</th>
                            <th>⚠️ معطب</th>
                            <th>📊 نسبة النجاعة</th>
                            <th>📈 الحالة</th>
                        </tr>
                    </thead>
                    <tbody>
    `;
    
    for (let cat of CATEGORIES) {
        const catData = data.filter(x => x.cat === cat);
        const ok = catData.filter(x => x.stat === 'صالح').length;
        const broken = catData.filter(x => x.stat !== 'صالح').length;
        const percent = catData.length ? ((ok / catData.length) * 100).toFixed(1) : 0;
        const rowClass = getRowClass(percent);
        const badgeInfo = getEfficiencyBadge(percent);
        
        html += `
            <tr class="${rowClass}">
                <td><strong>${escapeHTML(cat)}</strong></td>
                <td style="color: var(--color-success); font-weight: 700;">${ok}</td>
                <td style="color: var(--color-danger); font-weight: 700;">${broken}</td>
                <td><strong>${percent}%</strong></td>
                <td>
                    <span class="status-badge status-${badgeInfo.class}">
                        ${badgeInfo.text}
                    </span>
                </td>
            </tr>
        `;
    }
    
    html += `
                    </tbody>
                </table>
            </div>
        </div>
    `;
    
    container.innerHTML = html;
}

// ============================================================
// 6. الأقاليم
// ============================================================

function renderRegions(vessels) {
    const container = document.getElementById('regionTables');
    if (!container) return;
    
    const data = vessels || allVessels;
    const selectedRegion = document.getElementById('fRegEff').value;
    const selectedCategory = document.getElementById('fCatEff').value;
    const selectedStatus = document.getElementById('fStatusEff').value;
    
    let regions = REGIONS;
    if (selectedRegion !== 'الكل') {
        regions = [selectedRegion];
    }
    
    let html = `<div class="section-content">`;
    
    for (let region of regions) {
        let regData = data.filter(x => x.reg === region);
        
        // تطبيق فلتر الفئة
        if (selectedCategory !== 'الكل') {
            regData = regData.filter(x => x.cat === selectedCategory);
        }
        
        // تطبيق فلتر الحالة
        if (selectedStatus !== 'الكل') {
            regData = regData.filter(x => x.stat === selectedStatus);
        }
        
        const total = regData.length;
        const ok = regData.filter(x => x.stat === 'صالح').length;
        const efficiency = total ? ((ok / total) * 100).toFixed(1) : 0;
        const badgeClass = efficiency >= 80 ? 'high' : (efficiency >= 50 ? 'medium' : 'low');
        const regionDisplay = REGION_NAMES[region] || region;
        
        html += `
            <div class="region-card">
                <div class="region-header">
                    <span class="region-name">📍 ${escapeHTML(regionDisplay)}</span>
                    <span class="region-badge ${badgeClass}">
                        📊 ${efficiency}% (${ok}/${total})
                    </span>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>الفئة</th>
                                <th>✅ صالح</th>
                                <th>⚠️ معطب</th>
                                <th>📊 نسبة النجاعة</th>
                                <th>📈 الحالة</th>
                            </tr>
                        </thead>
                        <tbody>
        `;
        
        for (let cat of CATEGORIES) {
            const catData = regData.filter(x => x.cat === cat);
            const ok2 = catData.filter(x => x.stat === 'صالح').length;
            const broken = catData.filter(x => x.stat !== 'صالح').length;
            const percent = catData.length ? ((ok2 / catData.length) * 100).toFixed(1) : 0;
            const rowClass = getRowClass(percent);
            const badgeInfo = getEfficiencyBadge(percent);
            
            html += `
                <tr class="${rowClass}">
                    <td><strong>${escapeHTML(cat)}</strong></td>
                    <td style="color: var(--color-success); font-weight: 700;">${ok2}</td>
                    <td style="color: var(--color-danger); font-weight: 700;">${broken}</td>
                    <td><strong>${percent}%</strong></td>
                    <td>
                        <span class="status-badge status-${badgeInfo.class}">
                            ${badgeInfo.text}
                        </span>
                    </td>
                </tr>
            `;
        }
        
        html += `
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }
    
    html += `</div>`;
    
    if (!html || html.includes('</div></div>')) {
        html = `
            <div class="section-content">
                <div class="empty-state">
                    <div style="font-size: 48px; margin-bottom: 12px;">📭</div>
                    <p style="color: var(--color-text-dim);">لا توجد بيانات للأقاليم المحددة</p>
                </div>
            </div>
        `;
    }
    
    container.innerHTML = html;
}

// ============================================================
// 7. الرسوم البيانية
// ============================================================

function renderCharts(vessels) {
    const container = document.getElementById('chartsArea');
    if (!container) return;
    
    const data = vessels || allVessels;
    const ok = data.filter(x => x.stat === 'صالح').length;
    const maintenance = data.filter(x => x.stat === 'صيانة').length;
    const broken = data.filter(x => x.stat === 'معطب').length;
    
    const categoryCounts = {};
    CATEGORIES.forEach(c => {
        categoryCounts[c] = data.filter(x => x.cat === c).length;
    });
    
    const regionEfficiencies = REGIONS.map(reg => {
        const regData = data.filter(x => x.reg === reg);
        const okReg = regData.filter(x => x.stat === 'صالح').length;
        return regData.length ? ((okReg / regData.length) * 100) : 0;
    });
    const regionLabels = REGIONS.map(r => REGION_NAMES[r] || r);
    
    container.innerHTML = `
        <div class="charts-container">
            <div class="chart-box">
                <h4>📊 حالة الأسطول</h4>
                <canvas id="fleetChartCanvas"></canvas>
            </div>
            <div class="chart-box">
                <h4>📦 توزيع المراكب حسب الفئة</h4>
                <canvas id="categoriesChartCanvas"></canvas>
            </div>
            <div class="chart-box full">
                <h4>🏆 مقارنة النجاعة بين الأقاليم</h4>
                <canvas id="comparisonChartCanvas"></canvas>
            </div>
        </div>
    `;
    
    // حذف المخططات القديمة
    if (fleetChart) { fleetChart.destroy(); fleetChart = null; }
    if (categoriesChart) { categoriesChart.destroy(); categoriesChart = null; }
    if (comparisonChart) { comparisonChart.destroy(); comparisonChart = null; }
    
    const chartType = currentChartType === 'doughnut' ? 'doughnut' : 
                      (currentChartType === 'bar' ? 'bar' : 'line');
    
    // مخطط حالة الأسطول
    const fleetCtx = document.getElementById('fleetChartCanvas');
    if (fleetCtx && typeof Chart !== 'undefined') {
        fleetChart = new Chart(fleetCtx.getContext('2d'), {
            type: chartType,
            data: {
                labels: ['صالح', 'تحت الصيانة', 'معطب'],
                datasets: [{
                    data: [ok, maintenance, broken],
                    backgroundColor: [
                        'rgba(34, 197, 94, 0.8)',
                        'rgba(234, 179, 8, 0.8)',
                        'rgba(239, 68, 68, 0.8)'
                    ],
                    borderColor: ['#22c55e', '#eab308', '#ef4444'],
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: { family: 'Cairo', size: 12 },
                            padding: 15,
                            usePointStyle: true
                        }
                    }
                }
            }
        });
    }
    
    // مخطط توزيع المراكب
    const categoriesCtx = document.getElementById('categoriesChartCanvas');
    if (categoriesCtx && typeof Chart !== 'undefined') {
        categoriesChart = new Chart(categoriesCtx.getContext('2d'), {
            type: 'bar',
            data: {
                labels: CATEGORIES,
                datasets: [{
                    label: 'عدد المراكب',
                    data: CATEGORIES.map(c => categoryCounts[c] || 0),
                    backgroundColor: 'rgba(230, 179, 30, 0.8)',
                    borderColor: '#e6b31e',
                    borderWidth: 2,
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { 
                        beginAtZero: true, 
                        ticks: { stepSize: 1, font: { family: 'Cairo' } },
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    },
                    x: {
                        ticks: { font: { family: 'Cairo' } }
                    }
                }
            }
        });
    }
    
    // مخطط مقارنة الأقاليم
    const comparisonCtx = document.getElementById('comparisonChartCanvas');
    if (comparisonCtx && typeof Chart !== 'undefined') {
        const colors = [
            'rgba(34, 197, 94, 0.8)',
            'rgba(59, 130, 246, 0.8)',
            'rgba(234, 179, 8, 0.8)',
            'rgba(239, 68, 68, 0.8)'
        ];
        
        comparisonChart = new Chart(comparisonCtx.getContext('2d'), {
            type: 'bar',
            data: {
                labels: regionLabels,
                datasets: [{
                    label: 'نسبة النجاعة (%)',
                    data: regionEfficiencies,
                    backgroundColor: colors,
                    borderColor: ['#22c55e', '#3b82f6', '#eab308', '#ef4444'],
                    borderWidth: 2,
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.parsed.y.toFixed(1) + '%';
                            }
                        }
                    }
                },
                scales: {
                    y: { 
                        beginAtZero: true, 
                        max: 100,
                        ticks: { 
                            callback: function(value) { return value + '%'; },
                            font: { family: 'Cairo' }
                        },
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    },
                    x: {
                        ticks: { font: { family: 'Cairo' } }
                    }
                }
            }
        });
    }
}

// ============================================================
// 8. تغيير نوع المخطط
// ============================================================

function switchChartType(type, btn) {
    currentChartType = type;
    document.querySelectorAll('.chart-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderCharts(allVessels);
}

// ============================================================
// 9. تحديث الصفحة
// ============================================================

async function renderEfficiency() {
    console.log('📊 تحديث صفحة الجاهزية...');
    
    try {
        const vessels = await loadVessels();
        allVessels = vessels;
        
        renderStats(vessels);
        renderGeneralEfficiency(vessels);
        renderRegions(vessels);
        renderCharts(vessels);
        
        console.log('✅ تم تحديث صفحة الجاهزية');
    } catch (error) {
        console.error('❌ خطأ في تحديث الصفحة:', error);
        showToast('❌ خطأ في تحديث البيانات', 'error');
    }
}

async function refreshEfficiency() {
    showToast('⏳ جاري تحديث البيانات...', 'info');
    await renderEfficiency();
    showToast('✅ تم تحديث البيانات بنجاح', 'success');
}

// ============================================================
// 10. تصدير التقرير
// ============================================================

function exportEfficiencyReport() {
    if (!allVessels || allVessels.length === 0) {
        showToast('⚠️ لا توجد بيانات للتصدير', 'warning');
        return;
    }
    
    // إنشاء CSV
    const headers = ['المركب', 'الفئة', 'الإقليم', 'الحالة', 'تاريخ آخر صيانة'];
    const rows = allVessels.map(v => [
        v.name || v.vesselName || '-',
        v.cat || '-',
        v.reg || '-',
        v.stat || '-',
        formatDate(v.lastMaintenance || v.updatedAt)
    ]);
    
    const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `efficiency_report_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);
    
    showToast('📥 تم تصدير التقرير بنجاح', 'success');
}

// 11. تهيئة الصفحة

function initEfficiencyPage() {
    console.log('📊 تهيئة صفحة الجاهزية...');
    
    if (!document.getElementById('page-efficiency')) return;
    
    setTimeout(renderEfficiency, 300);
}

// تنشيط الصفحة
if (document.getElementById('page-efficiency')) {
    console.log('📄 تم اكتشاف صفحة الجاهزية');
    setTimeout(initEfficiencyPage, 300);
}

window.renderEfficiency = renderEfficiency;
window.refreshEfficiency = refreshEfficiency;
window.switchChartType = switchChartType;
window.exportEfficiencyReport = exportEfficiencyReport;
window.loadVessels = loadVessels;

console.log('✅ صفحة الجاهزية v7.0 جاهزة');
</script>
