<!-- public/pages/sessions.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقبة</title>
    <style>
        .sessions-container {
            padding: 20px;
        }

        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .session-card {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .session-card .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .session-card .user-name {
            font-weight: bold;
            color: rgba(255,255,255,0.8);
        }

        .session-card .user-role {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.4);
        }

        .session-card .info {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin: 4px 0;
        }

        .session-card .info i {
            margin-left: 6px;
            width: 16px;
        }

        .session-card .status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            margin-top: 6px;
        }

        .status.active {
            background: rgba(74,222,128,0.15);
            color: #4ade80;
        }

        .status.inactive {
            background: rgba(248,113,113,0.15);
            color: #f87171;
        }

        /* ===== خريطة مصغرة ===== */
        .mini-map-container {
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .mini-map-container h3 {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .mini-map {
            width: 100%;
            height: 200px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.2);
            font-size: 14px;
            border: 1px dashed rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .mini-map .map-placeholder {
            text-align: center;
        }

        .mini-map .map-placeholder i {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
            opacity: 0.3;
        }

        /* ===== تتبع المراكب ===== */
        .tracking-section {
            margin-top: 20px;
        }

        .tracking-section h3 {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .tracking-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .tracking-item {
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tracking-item .vessel-name {
            font-weight: bold;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
        }

        .tracking-item .vessel-status {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .tracking-item .vessel-status.online {
            background: rgba(74,222,128,0.15);
            color: #4ade80;
        }

        .tracking-item .vessel-status.offline {
            background: rgba(248,113,113,0.15);
            color: #f87171;
        }

        .tracking-item .vessel-status.maintenance {
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
        }

        .tracking-item .vessel-location {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="sessions-container">
        <h2 style="margin-bottom: 4px;">👁️ المراقبة</h2>
        <p style="opacity:0.4; font-size:14px; margin-bottom:20px;">مراقبة المستخدمين النشطين وتتبع المراكب</p>

        <!-- ===== الجلسات النشطة ===== -->
        <div class="sessions-grid" id="sessionsGrid">
            <div style="text-align:center; padding:30px; color:rgba(255,255,255,0.2);">
                ⏳ جاري تحميل الجلسات...
            </div>
        </div>

        <!-- ===== خريطة مصغرة ===== -->
        <div class="mini-map-container">
            <h3>🗺️ موقع المراكب على الخريطة</h3>
            <div class="mini-map" id="miniMap">
                <div class="map-placeholder">
                    <i class="fas fa-map"></i>
                    <span>خريطة تتبع المراكب</span>
                    <br>
                    <small style="opacity:0.5;">يتم تحديث المواقع تلقائياً</small>
                </div>
            </div>
        </div>

        <!-- ===== تتبع المراكب ===== -->
        <div class="tracking-section">
            <h3>🚢 تتبع المراكب</h3>
            <div class="tracking-grid" id="trackingGrid">
                <div style="text-align:center; padding:20px; color:rgba(255,255,255,0.2); grid-column: 1 / -1;">
                    ⏳ جاري تحميل بيانات المراكب...
                </div>
            </div>
        </div>
    </div>
</body>
</html>
