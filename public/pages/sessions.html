<div id="page-session">

        /* ===== RESET & BASE ===== */
        #page-session {
            width: 100%;
            max-width: 100%;
            padding: 20px;
            margin: 0;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            background: #0a0e1a;
            color: #e8edf5;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        .ses-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .ses-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .ses-header-left .icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a78bfa, #e6b31e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #0a1628;
        }

        .ses-header-left h2 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .ses-header-left p {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin: 0;
        }

        .ses-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cairo', sans-serif;
        }

        .btn-action.primary {
            background: linear-gradient(135deg, #a78bfa, #c4b5fd);
            color: #0a1628;
        }

        .btn-action.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(167,139,250,0.3);
        }

        .btn-action.danger {
            background: linear-gradient(135deg, #ef4444, #f87171);
            color: #fff;
        }

        .btn-action.danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(239,68,68,0.3);
        }

        .btn-action.secondary {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
        }

        .btn-action.secondary:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
        }

        /* ===== STATS ===== */
        .ses-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #a78bfa, #e6b31e);
            opacity: 0.6;
        }

        .stat-card .number {
            font-size: 26px;
            font-weight: 800;
            color: #a78bfa;
            line-height: 1.2;
        }

        .stat-card .number.gold { color: #f5d76e; }
        .stat-card .number.green { color: #4ade80; }
        .stat-card .number.red { color: #f87171; }
        .stat-card .number.purple { color: #a78bfa; }

        .stat-card .label {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .filter-bar label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-bar select,
        .filter-bar input {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.75rem;
            min-width: 120px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
        }

        .filter-bar select:focus,
        .filter-bar input:focus {
            outline: none;
            border-color: #a78bfa;
        }

        .filter-bar select option {
            background: #0a1628;
            color: #e2e8f0;
        }

        .filter-bar input[type="date"] {
            min-width: 140px;
            color-scheme: dark;
        }

        .filter-bar input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.6);
            cursor: pointer;
        }

        .btn-filter {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-filter.primary {
            background: linear-gradient(135deg, #a78bfa, #c4b5fd);
            color: #0a1628;
        }

        .btn-filter.primary:hover {
            transform: scale(1.04);
        }

        .btn-filter.outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.3);
        }

        .btn-filter.outline:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        /* ===== SECTION ===== */
        .ses-section {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.02);
            flex-wrap: wrap;
            gap: 8px;
        }

        .section-header h3 {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-header h3 i {
            color: #a78bfa;
        }

        .badge {
            font-size: 11px;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge.purple {
            background: rgba(167,139,250,0.12);
            color: #a78bfa;
        }

        .badge.gold {
            background: rgba(230,179,30,0.12);
            color: #f5d76e;
        }

        .badge.success {
            background: rgba(34,197,94,0.12);
            color: #4ade80;
        }

        .badge.danger {
            background: rgba(239,68,68,0.12);
            color: #f87171;
        }

        /* ===== TABLE ===== */
        .table-wrapper {
            overflow-x: auto;
            padding: 16px 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            min-width: 800px;
        }

        thead {
            background: rgba(167,139,250,0.08);
            border-bottom: 2px solid rgba(167,139,250,0.08);
        }

        thead th {
            padding: 10px 12px;
            text-align: center;
            font-weight: 700;
            font-size: 0.6rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        thead th i {
            margin-left: 4px;
            color: #a78bfa;
        }

        tbody td {
            padding: 9px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            vertical-align: middle;
            color: rgba(255,255,255,0.6);
            font-size: 0.78rem;
            text-align: center;
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }

        /* ===== STATUS BADGES ===== */
        .status-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }

        .status-badge.active {
            background: rgba(34,197,94,0.12);
            color: #4ade80;
        }

        .status-badge.expired {
            background: rgba(234,179,8,0.12);
            color: #fbbf24;
        }

        .status-badge.terminated {
            background: rgba(239,68,68,0.12);
            color: #f87171;
        }

        /* ===== ACTION BUTTONS ===== */
        .action-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .action-btn.view {
            background: rgba(167,139,250,0.1);
            color: #a78bfa;
        }

        .action-btn.view:hover {
            background: rgba(167,139,250,0.2);
        }

        .action-btn.terminate {
            background: rgba(239,68,68,0.1);
            color: #f87171;
        }

        .action-btn.terminate:hover {
            background: rgba(239,68,68,0.2);
        }

        /* ===== PAGINATION ===== */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            flex-wrap: wrap;
            gap: 8px;
        }

        .pagination .info {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.25);
        }

        .pagination .pages {
            display: flex;
            gap: 4px;
        }

        .page-btn {
            padding: 4px 12px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px;
            background: transparent;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.75rem;
            transition: all 0.3s;
        }

        .page-btn:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        .page-btn.active {
            background: linear-gradient(135deg, #a78bfa, #c4b5fd);
            border-color: #a78bfa;
            color: #0a1628;
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.15);
        }

        .empty-state .empty-icon {
            font-size: 4rem;
            color: rgba(255,255,255,0.04);
            display: block;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255,255,255,0.2);
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.1);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 24px;
            border-radius: 12px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            z-index: 9999;
            animation: slideUp 0.4s ease-out;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 400px;
            direction: rtl;
        }

        .toast-success {
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.2);
        }

        .toast-info {
            background: rgba(167,139,250,0.15);
            border: 1px solid rgba(167,139,250,0.2);
        }

        .toast-error {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.2);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            #page-session { padding: 12px; }
            .ses-header { flex-direction: column; align-items: flex-start; }
            .ses-header-left { width: 100%; }
            .ses-header-left h2 { font-size: 16px; }
            .ses-header-actions { width: 100%; }
            .ses-stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .stat-card .number { font-size: 20px; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-bar select, .filter-bar input { min-width: 100%; }
            .table-wrapper { padding: 12px; }
            table { font-size: 0.7rem; min-width: 600px; }
            thead th, tbody td { padding: 6px 8px; }
            .pagination { flex-direction: column; align-items: center; }
        }

        @media (max-width: 480px) {
            .ses-stats { grid-template-columns: 1fr 1fr; gap: 6px; }
            .stat-card { padding: 10px 12px; }
            .stat-card .number { font-size: 18px; }
            .stat-card .label { font-size: 9px; }
            .ses-header-left .icon { width: 36px; height: 36px; font-size: 16px; }
            .ses-header-left h2 { font-size: 14px; }
            .section-header h3 { font-size: 13px; }
            thead th, tbody td { padding: 4px 6px; font-size: 0.6rem; }
            .action-btn { padding: 2px 6px; font-size: 0.55rem; }
        }
    </style>

                { id: 'S-2026-013', user: 'أحمد محمد', email: 'ahmed@example.com', startDate: '2026-08-20 16:30', duration: '5 ساعات 15 دقيقة', status: 'نشطة' },
                { id: 'S-2026-014', user: 'سارة علي', email: 'sara@example.com', startDate: '2026-08-20 08:00', duration: '3 ساعات', status: 'منتهية' },
                { id: 'S-2026-015', user: 'محمد خالد', email: 'mohamed@example.com', startDate: '2026-08-19 13:45', duration: '2 ساعات 30 دقيقة', status: 'نشطة' }
            ];

            // ============================================================
            // STATE
            // ============================================================
            var filteredData = sessionData.slice();
            var currentPage = 1;
            var itemsPerPage = 5;

            // ============================================================
            // DOM REFS
            // ============================================================
            var $ = function(id) { return document.getElementById(id); };

            // ============================================================
            // HELPERS
            // ============================================================
            function getStatusClass(status) {
                var map = {
                    'نشطة': 'active',
                    'منتهية': 'expired',
                    'ملغاة': 'terminated'
                };
                return map[status] || '';
            }

            function getStatusLabel(status) {
                var map = {
                    'نشطة': '🟢 نشطة',
                    'منتهية': '🟡 منتهية',
                    'ملغاة': '🔴 ملغاة'
                };
                return map[status] || status;
            }

            function formatDate(dateStr) {
                if (!dateStr) return '-';
                var parts = dateStr.split(' ');
                var dateParts = parts[0].split('-');
                return dateParts[2] + '/' + dateParts[1] + '/' + dateParts[0] + ' ' + (parts[1] || '');
            }

            // ============================================================
            // RENDER
            // ============================================================
            window.renderSessions = function() {
                renderStats();
                renderTable();
                renderPagination();
            };

            function renderStats() {
                var total = sessionData.length;
                var active = sessionData.filter(function(s) { return s.status === 'نشطة'; }).length;
                var expired = sessionData.filter(function(s) { return s.status === 'منتهية'; }).length;
                var terminated = sessionData.filter(function(s) { return s.status === 'ملغاة'; }).length;

                $('totalSessions').textContent = total;
                $('activeSessions').textContent = active;
                $('expiredSessions').textContent = expired;
                $('terminatedSessions').textContent = terminated;

                var badge = $('sessionBadge');
                if (active > 0) {
                    badge.textContent = '🟢 ' + active + ' جلسات نشطة';
                    badge.className = 'badge success';
                } else if (expired > 0) {
                    badge.textContent = '🟡 ' + expired + ' جلسات منتهية';
                    badge.className = 'badge gold';
                } else {
                    badge.textContent = '📊 ' + total + ' جلسة';
                    badge.className = 'badge purple';
                }
            }

            function renderTable() {
                var search = $('searchSession').value.toLowerCase();
                var userFilter = $('fUserSession').value;
                var statusFilter = $('fStatusSession').value;
                var dateFrom = $('fDateFrom').value;
                var dateTo = $('fDateTo').value;

                filteredData = sessionData.filter(function(s) {
                    if (search && !s.user.includes(search) && !s.email.includes(search)) return false;
                    if (userFilter !== 'الكل' && s.user !== userFilter) return false;
                    if (statusFilter !== 'الكل' && s.status !== statusFilter) return false;
                    if (dateFrom && s.startDate < dateFrom) return false;
                    if (dateTo && s.startDate > dateTo) return false;
                    return true;
                });

                var tbody = $('sessionBody');

                if (filteredData.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="empty-state">
                                <span class="empty-icon"><i class="fas fa-search"></i></span>
                                <h3>لا توجد جلسات مطابقة</h3>
                                <p>حاول تغيير معايير البحث أو الفلترة</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                var start = (currentPage - 1) * itemsPerPage;
                var end = start + itemsPerPage;
                var pageData = filteredData.slice(start, end);

                var html = '';
                for (var i = 0; i < pageData.length; i++) {
                    var s = pageData[i];
                    var statusClass = getStatusClass(s.status);
                    var statusLabel = getStatusLabel(s.status);

                    html += `
                        <tr>
                            <td style="text-align:right;font-weight:600;color:#a78bfa;">${s.id}</td>
                            <td style="text-align:right;font-weight:600;color:#fff;">${s.user}</td>
                            <td>${s.email}</td>
                            <td>${formatDate(s.startDate)}</td>
                            <td>${s.duration}</td>
                            <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                            <td>
                                <button class="action-btn view" onclick="viewSession('${s.id}')"><i class="fas fa-eye"></i></button>
                                ${s.status === 'نشطة' ? `<button class="action-btn terminate" onclick="terminateSession('${s.id}')"><i class="fas fa-power-off"></i></button>` : ''}
                            </td>
                        </tr>
                    `;
                }

                tbody.innerHTML = html;
                $('paginationInfo').textContent = 'عرض ' + (start + 1) + '-' + Math.min(end, filteredData.length) + ' من ' + filteredData.length + ' جلسة';
            }

            function renderPagination() {
                var totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
                $('prevPage').disabled = currentPage <= 1;
                $('nextPage').disabled = currentPage >= totalPages;

                for (var i = 1; i <= 3; i++) {
                    var btn = $('page' + i);
                    if (i <= totalPages) {
                        btn.style.display = 'inline-block';
                        btn.textContent = i;
                        btn.className = 'page-btn ' + (i === currentPage ? 'active' : '');
                        btn.onclick = function(page) { return function() { goToPage(page); }; }(i);
                    } else {
                        btn.style.display = 'none';
                    }
                }
            }

            // ============================================================
            // ACTIONS
            // ============================================================
            window.changePage = function(delta) {
                var totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
                var newPage = currentPage + delta;
                if (newPage >= 1 && newPage <= totalPages) {
                    currentPage = newPage;
                    renderSessions();
                }
            };

            window.goToPage = function(page) {
                var totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
                if (page >= 1 && page <= totalPages) {
                    currentPage = page;
                    renderSessions();
                }
            };

            window.refreshSessions = function() {
                var btn = document.querySelector('.btn-action.primary');
                var original = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';
                btn.disabled = true;

                setTimeout(function() {
                    renderSessions();
                    btn.innerHTML = original;
                    btn.disabled = false;
                    showNotification('✅ تم تحديث الجلسات بنجاح', 'success');
                }, 600);
            };

            window.resetFilters = function() {
                $('searchSession').value = '';
                $('fUserSession').value = 'الكل';
                $('fStatusSession').value = 'الكل';
                $('fDateFrom').value = '';
                $('fDateTo').value = '';
                currentPage = 1;
                renderSessions();
                showNotification('✅ تم إلغاء جميع الفلاتر', 'success');
            };

            window.terminateAllSessions = function() {
                if (confirm('⚠️ هل أنت متأكد من إنهاء جميع الجلسات النشطة؟')) {
                    var activeSessions = sessionData.filter(function(s) { return s.status === 'نشطة'; });
                    if (activeSessions.length === 0) {
                        showNotification('ℹ️ لا توجد جلسات نشطة لإنهائها', 'info');
                        return;
                    }
                    activeSessions.forEach(function(s) { s.status = 'ملغاة'; });
                    renderSessions();
                    showNotification('✅ تم إنهاء ' + activeSessions.length + ' جلسات بنجاح', 'success');
                }
            };

            // ============================================================
            // GLOBAL FUNCTIONS
            // ============================================================
            window.viewSession = function(id) {
                var session = sessionData.find(function(s) { return s.id === id; });
                if (session) {
                    showNotification('📋 عرض تفاصيل الجلسة: ' + session.user + ' (' + session.email + ')', 'info');
                }
            };

            window.terminateSession = function(id) {
                if (confirm('⚠️ هل أنت متأكد من إنهاء الجلسة ' + id + '؟')) {
                    var session = sessionData.find(function(s) { return s.id === id; });
                    if (session) {
                        session.status = 'ملغاة';
                        renderSessions();
                        showNotification('✅ تم إنهاء الجلسة ' + id + ' بنجاح', 'success');
                    }
                }
            };

            // ============================================================
            // NOTIFICATION
            // ============================================================
            function showNotification(message, type) {
                var old = document.querySelector('.toast');
                if (old) old.remove();

                var colors = {
                    success: 'rgba(34,197,94,0.15)',
                    info: 'rgba(167,139,250,0.15)',
                    error: 'rgba(239,68,68,0.15)'
                };

                var notif = document.createElement('div');
                notif.className = 'toast toast-' + type;
                notif.style.cssText = `
                    position: fixed;
                    bottom: 24px;
                    right: 24px;
                    background: ${colors[type] || colors.info};
                    backdrop-filter: blur(12px);
                    border: 1px solid rgba(255,255,255,0.1);
                    padding: 14px 24px;
                    border-radius: 12px;
                    color: #fff;
                    font-family: Cairo, sans-serif;
                    font-size: 14px;
                    z-index: 9999;
                    animation: slideUp 0.4s ease-out;
                    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
                    max-width: 400px;
                    direction: rtl;
                `;
                notif.textContent = message;

                document.body.appendChild(notif);

                setTimeout(function() {
                    notif.style.opacity = '0';
                    notif.style.transform = 'translateY(20px)';
                    notif.style.transition = 'all 0.4s ease-out';
                    setTimeout(function() { notif.remove(); }, 400);
                }, 3000);
            }

            // ============================================================
            // ADD STYLES
            // ============================================================
            var styleNotif = document.createElement('style');
            styleNotif.textContent = `
                @keyframes slideUp {
                    from { opacity: 0; transform: translateY(20px); }
                    to { opacity: 1; transform: translateY(0); }
                }
            `;
            document.head.appendChild(styleNotif);

            // ============================================================
            // INIT
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                renderSessions();
                console.log('✅ Session Page loaded successfully!');
                console.log('🟣 ' + sessionData.length + ' sessions loaded.');
            });

        })();
    </script>
</div>
