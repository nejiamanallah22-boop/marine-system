<div id="page-sessions">
    <style>
        /* ============================================================
           🔄 SESSIONS PAGE - PROFESSIONAL v3.2 (MULTI LAYER MAP)

        /* ===== CSS VARIABLES ===== */
        :root {
            --primary-dark: #0a1628;
            --primary: #0f3460;
            --primary-light: #1a4f8a;
            --gold: #e6b31e;
            --gold-light: #f5d76e;
            --gold-dark: #c99a0e;

            --success-light: #55efc4;
            --danger: #e17055;
            --warning: #fdcb6e;
            --info: #0984e3;

            --glass-border: rgba(255,255,255,0.06);
            --shadow-gold: 0 0 40px rgba(230,179,30,0.08);
            --shadow-card: 0 8px 32px rgba(0,0,0,0.15);
            --shadow-hover: 0 12px 48px rgba(0,0,0,0.25);

            --radius-sm: 8px;

            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ===== BACKGROUND EFFECT ===== */
        #page-sessions::before {
            content: '';

            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(230,179,30,0.04) 0%, transparent 60%),

<script>
// ============================================================
// 🔄 SESSIONS PAGE - v3.2 (MULTI LAYER MAP)
// ============================================================

// ✅ تجنب إعادة تعريف المتغيرات
if (typeof window._sessionsLoaded === 'undefined') {
    window._sessionsLoaded = false;
}

// ✅ استخدم var لتجنب التكرار
if (typeof sessionMap === 'undefined') {
    var sessionMap = null;
}
if (typeof sessionMarkers === 'undefined') {
    var sessionMarkers = {};
}
if (typeof sessionsData === 'undefined') {
    var sessionsData = [];
}
if (typeof currentLayer === 'undefined') {
    var currentLayer = 'street';
}
var mapInitialized = false;
var mapRefreshInterval = null;
var tileLayer = null;

// ============================================================
// 1. TOKEN FUNCTIONS (موحدة)
// ============================================================

function getToken() {
    return localStorage.getItem('marine_token') ||
           localStorage.getItem('token') ||
           localStorage.getItem('authToken') ||
           localStorage.getItem('accessToken') ||
           null;
}

function getAuthHeaders() {
    const token = getToken();
    return {
        'Content-Type': 'application/json',
        'Authorization': token ? 'Bearer ' + token : ''
    };
}

function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer') || document.body;
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    
    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${message}`;
    container.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(30px)';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function formatDate(dateStr) {
    if (!dateStr) return '-';
    try {
        const date = new Date(dateStr);
        if (isNaN(date.getTime())) return dateStr;
        return date.toLocaleString('ar-TN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    } catch { return dateStr; }
}

function getDuration(startDate) {
    const now = new Date();
    const diff = now - new Date(startDate);
    const seconds = Math.floor(diff / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    
    if (days > 0) return days + ' يوم';
    if (hours > 0) return hours + ' ساعة';
    if (minutes > 0) return minutes + ' دقيقة';
    return 'الآن';
}

// ============================================================
// 2. تهيئة الخريطة
// ============================================================

function initSessionMap() {
    // ✅ التحقق من وجود مكتبة Leaflet
    if (typeof L === 'undefined') {
        console.warn('⚠️ مكتبة Leaflet غير محملة، جاري التحميل...');
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
        document.head.appendChild(link);
        
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
        script.onload = function() {
            console.log('✅ تم تحميل Leaflet');
            initSessionMap();
        };
        document.head.appendChild(script);
        return;
    }
    
    if (sessionMap) {
        sessionMap.invalidateSize();
        return;
    }
    
    console.log('🗺️ تهيئة خريطة الجلسات...');
    
    const mapContainer = document.getElementById('sessionMap');
    if (!mapContainer) {
        console.warn('⚠️ عنصر الخريطة غير موجود');
        return;
    }
    
    try {
        sessionMap = L.map('sessionMap', {
            center: [36.8, 10.18],
            zoom: 7,
            zoomControl: true
        });
        
        // ✅ الطبقة الافتراضية
        tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        }).addTo(sessionMap);
        
        mapInitialized = true;
        console.log('✅ تم تهيئة الخريطة');
        
        setTimeout(updateSessionMarkers, 500);
        
    } catch(error) {
        console.error('❌ خطأ في الخريطة:', error);
        mapContainer.innerHTML = `
            <div style="display:flex; align-items:center; justify-content:center; height:100%; color:#f87171; flex-direction:column; padding:20px; text-align:center;">
                <div style="font-size:48px; margin-bottom:10px;">🗺️</div>
                <div style="font-weight:600; margin-bottom:4px;">خطأ في تحميل الخريطة</div>
                <div style="font-size:12px; color:rgba(255,255,255,0.3);">${escapeHtml(error.message || 'يرجى المحاولة مرة أخرى')}</div>
                <button onclick="initSessionMap()" style="margin-top:10px; padding:8px 20px; background:rgba(96,165,250,0.15); border:1px solid rgba(96,165,250,0.1); border-radius:8px; color:#60a5fa; cursor:pointer;">
                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                </button>
            </div>
        `;
    }
}

// ============================================================
// 3. تغيير طبقة الخريطة
// ============================================================

function changeMapLayer(layer, btn) {
    if (!sessionMap || !mapInitialized) {
        showToast('⚠️ الخريطة غير مهيأة', 'warning');
        return;
    }
    
    currentLayer = layer;
    
    // ✅ تحديث الأزرار
    document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    
    // ✅ حذف الطبقة الحالية
    if (tileLayer) {
        sessionMap.removeLayer(tileLayer);
    }
    
    // ✅ إضافة الطبقة الجديدة
    const layers = {
        'street': {
            url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            attribution: '© OpenStreetMap'
        },
        'satellite': {
            url: 'https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
            attribution: '© Google',
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        },
        'dark': {
            url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
            attribution: '© CartoDB'
        },
        'topo': {
            url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
            attribution: '© OpenTopoMap'
        }
    };
    
    const config = layers[layer] || layers['street'];
    
    tileLayer = L.tileLayer(config.url, {
        attribution: config.attribution,
        maxZoom: 19,
        subdomains: config.subdomains || 'abc'
    }).addTo(sessionMap);
    
    showToast(`🗺️ تم التبديل إلى ${layer === 'street' ? 'الخريطة العادية' : layer === 'satellite' ? 'الفضائية' : layer === 'dark' ? 'الوضع الليلي' : 'الطبوغرافية'}`, 'info');
}

// ============================================================
// 4. تحميل الجلسات
// ============================================================

function loadSessions() {
    console.log('🔄 تحميل الجلسات...');
    
    const token = getToken();
    if (!token) {
        console.warn('⚠️ لا يوجد توكن');
        document.getElementById('sessionsBody').innerHTML = `
            <tr>
                <td colspan="7" class="empty-state">
                    <span class="icon"><i class="fas fa-exclamation-triangle"></i></span>
                    ⚠️ الرجاء تسجيل الدخول أولاً
                </td>
            </tr>
        `;
        return;
    }
    
    fetch('/api/sessions', {
        headers: getAuthHeaders()
    })
    .then(res => {
        if (!res.ok) {
            if (res.status === 401) {
                localStorage.removeItem('marine_token');
                localStorage.removeItem('token');
                window.location.href = '/index.html';
            }
            throw new Error('فشل تحميل الجلسات');
        }
        return res.json();
    })
    .then(data => {
        sessionsData = data.sessions || data || [];
        console.log('✅ تم تحميل الجلسات:', sessionsData.length);
        renderSessions(sessionsData);
        updateSessionStats(sessionsData);
        updateSessionMarkers();
        updateMapOnlineCount(sessionsData);
    })
    .catch(err => {
        console.error('❌ خطأ في تحميل الجلسات:', err);
        document.getElementById('sessionsBody').innerHTML = `
            <tr>
                <td colspan="7" class="empty-state" style="color:#f87171;">
                    <span class="icon"><i class="fas fa-exclamation-triangle"></i></span>
                    ❌ ${escapeHtml(err.message)}
                    <br>
                    <button class="retry-btn" onclick="loadSessions()">
                        <i class="fas fa-sync-alt"></i> إعادة المحاولة
                    </button>
                </td>
            </tr>
        `;
    });
}

// ============================================================
// 5. عرض الجلسات
// ============================================================

function renderSessions(sessions) {
    const tbody = document.getElementById('sessionsBody');
    if (!tbody) return;
    
    document.getElementById('sessionCount').textContent = sessions.length + ' جلسة';
    
    if (!sessions || sessions.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="empty-state">
                    <span class="icon"><i class="fas fa-inbox"></i></span>
                    🚫 لا توجد جلسات نشطة
                </td>
            </tr>
        `;
        return;
    }
    
    let html = '';
    sessions.forEach((s, i) => {
        const statusMap = {
            'active': 'active',
            'inactive': 'inactive',
            'expired': 'expired'
        };
        const statusClass = statusMap[s.status] || 'inactive';
        const statusText = s.status === 'active' ? '🟢 نشط' : (s.status === 'expired' ? '🔴 منتهية' : '⚫ غير نشط');
        const deviceName = s.device || s.userAgent || 'جهاز غير معروف';
        const duration = s.createdAt ? getDuration(s.createdAt) : '--';
        const sessionId = s.sessionId || s.id || i;
        
        html += `
            <tr>
                <td><strong style="color:#fff;">${escapeHtml(s.username || s.userName || 'مجهول')}</strong></td>
                <td style="font-size:11px;color:rgba(255,255,255,0.4);">${escapeHtml(deviceName.substring(0, 30))}</td>
                <td style="font-size:12px;color:rgba(255,255,255,0.3);">${escapeHtml(s.ip || s.ipAddress || '--')}</td>
                <td>${formatDate(s.createdAt)}</td>
                <td>${duration}</td>
                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                <td>
                    <button class="btn-sm warning" onclick="terminateSession('${sessionId}')">
                        <i class="fas fa-stop-circle"></i> إنهاء
                    </button>
                </td>
            </tr>
        `;
    });
    tbody.innerHTML = html;
}

// ============================================================
// 6. تحديث الإحصائيات
// ============================================================

function updateSessionStats(sessions) {
    const total = sessions.length;
    const active = sessions.filter(s => s.status === 'active').length;
    const expired = sessions.filter(s => s.status === 'expired' || s.status === 'inactive').length;
    const uniqueUsers = new Set(sessions.map(s => s.userName || s.username)).size;
    
    document.getElementById('totalSessions').textContent = total;
    document.getElementById('activeSessions').textContent = active;
    document.getElementById('expiredSessions').textContent = expired;
    document.getElementById('uniqueUsers').textContent = uniqueUsers;
    document.getElementById('sessionOnline').textContent = active;
}

function updateMapOnlineCount(sessions) {
    const active = sessions.filter(s => s.status === 'active').length;
    document.getElementById('mapOnlineCount').textContent = active;
}

// ============================================================
// 7. تحديث الماركرز على الخريطة
// ============================================================

function updateSessionMarkers() {
    if (!mapInitialized || !sessionMap) {
        console.warn('⚠️ الخريطة غير مهيأة');
        return;
    }
    
    // حذف الماركرز القديمة
    Object.values(sessionMarkers).forEach(marker => {
        if (sessionMap) sessionMap.removeLayer(marker);
    });
    sessionMarkers = {};
    
    // ✅ تصفية الجلسات النشطة فقط للماركرز
    const activeSessions = sessionsData.filter(s => s.status === 'active' && s.lat && s.lng);
    
    if (activeSessions.length === 0) {
        console.log('ℹ️ لا توجد جلسات نشطة مع مواقع');
        return;
    }
    
    console.log(`📍 تحديث ${activeSessions.length} ماركر على الخريطة`);
    
    activeSessions.forEach(s => {
        const isActive = s.status === 'active';
        const icon = L.divIcon({
            className: 'custom-div-icon',
            html: `
                <div class="session-marker">
                    <div class="avatar ${isActive ? 'active' : 'inactive'}">
                        ${s.role === 'admin' || s.role === 'مسؤول' ? '👑' : '👤'}
                    </div>
                    <div class="name">${escapeHtml(s.username || s.userName || 'مجهول')}</div>
                </div>
            `,
            iconSize: [50, 50],
            iconAnchor: [25, 25],
            popupAnchor: [0, -25]
        });
        
        const marker = L.marker([s.lat, s.lng], { icon: icon }).addTo(sessionMap);
        
        const popupContent = `
            <div style="text-align:right; font-family:Cairo, sans-serif; min-width:150px; direction:rtl;">
                <div style="font-weight:bold; font-size:14px; color:white;">${escapeHtml(s.username || s.userName || 'مجهول')}</div>
                <div style="color:rgba(255,255,255,0.6); font-size:12px;">${escapeHtml(s.role || 'مشاهد')}</div>
                <div style="margin:4px 0;">
                    <span style="color:${isActive ? '#4ade80' : '#6c757d'}; font-size:11px;">${isActive ? '🟢 نشط' : '🔴 غير نشط'}</span>
                </div>
                <div style="color:rgba(255,255,255,0.4); font-size:10px;">
                    📍 ${s.lat.toFixed(6)}, ${s.lng.toFixed(6)}
                </div>
                <div style="color:rgba(255,255,255,0.2); font-size:9px; margin-top:2px;">
                    ${s.updatedAt ? '🕐 ' + new Date(s.updatedAt).toLocaleString('ar-TN') : ''}
                </div>
                <div style="color:rgba(255,255,255,0.2); font-size:9px; margin-top:4px;">
                    📱 ${escapeHtml((s.device || s.userAgent || 'جهاز غير معروف').substring(0, 30))}
                </div>
            </div>
        `;
        marker.bindPopup(popupContent);
        
        sessionMarkers[s.sessionId || s.id] = marker;
    });
    
    // ✅ تكبير الخريطة لتشمل جميع الماركرز
    if (Object.keys(sessionMarkers).length > 0) {
        const group = L.featureGroup(Object.values(sessionMarkers));
        sessionMap.fitBounds(group.getBounds(), { padding: [50, 50] });
    }
}

// ============================================================
// 8. إنهاء الجلسة
// ============================================================

function terminateSession(id) {
    if (!confirm('⚠️ هل أنت متأكد من إنهاء هذه الجلسة؟')) return;
    
    const token = getToken();
    if (!token) {
        showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
        return;
    }
    
    fetch(`/api/sessions/${id}`, {
        method: 'DELETE',
        headers: getAuthHeaders()
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            showToast('✅ تم إنهاء الجلسة بنجاح', 'success');
            loadSessions();
        } else {
            showToast('❌ ' + (data.error || 'فشل إنهاء الجلسة'), 'error');
        }
    })
    .catch(err => {
        console.error('❌ خطأ في إنهاء الجلسة:', err);
        showToast('❌ خطأ في إنهاء الجلسة', 'error');
    });
}

// ============================================================
// 9. تحديث الجلسات
// ============================================================

function refreshSessions() {
    loadSessions();
    showToast('🔄 تم تحديث الجلسات', 'info');
}

// ============================================================
// 10. بدء التحديث التلقائي
// ============================================================

function startAutoRefresh() {
    if (mapRefreshInterval) {
        clearInterval(mapRefreshInterval);
    }
    mapRefreshInterval = setInterval(() => {
        if (document.getElementById('page-sessions')) {
            loadSessions();
        }
    }, 30000);
}

// ============================================================
// 11. التهيئة
// ============================================================

function initSessionsPage() {
    console.log('🔄 تهيئة صفحة المراقبة...');
    
    if (window._sessionsLoaded) {
        console.log('⚠️ تم تهيئة الصفحة مسبقاً');
        return;
    }
    window._sessionsLoaded = true;
    
    setTimeout(() => {
        initSessionMap();
        loadSessions();
        startAutoRefresh();
    }, 300);
}

// ============================================================
// 12. ربط الدوال
// ============================================================

if (document.getElementById('page-sessions')) {
    console.log('📄 تم اكتشاف صفحة المراقبة');
    setTimeout(initSessionsPage, 300);
}

window.refreshSessions = refreshSessions;
window.terminateSession = terminateSession;
window.initSessionMap = initSessionMap;
window.loadSessions = loadSessions;
window.startAutoRefresh = startAutoRefresh;
window.changeMapLayer = changeMapLayer;

console.log('✅ صفحة المراقبة v3.2 جاهزة (مع طبقات متعددة للخريطة)');
</script>
</div>
