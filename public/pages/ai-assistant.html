<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي</title>
    <style>
        .ai-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .chat-box {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            height: 400px;
            overflow-y: auto;
            padding: 16px;
            margin-bottom: 16px;
        }

        .chat-message {
            margin: 8px 0;
            padding: 10px 16px;
            border-radius: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        .chat-message.user {
            background: rgba(96,165,250,0.15);
            border: 1px solid rgba(96,165,250,0.2);
            margin-left: auto;
            text-align: right;
        }

        .chat-message.ai {
            background: rgba(74,222,128,0.08);
            border: 1px solid rgba(74,222,128,0.15);
            margin-right: auto;
        }

        .chat-message .sender {
            font-size: 11px;
            opacity: 0.5;
            margin-bottom: 4px;
        }

        .chat-message .content {
            font-size: 14px;
            line-height: 1.6;
        }

        .chat-message .time {
            font-size: 10px;
            opacity: 0.3;
            margin-top: 4px;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
        }

        .chat-input-area input:focus {
            outline: none;
            background: rgba(255,255,255,0.08);
        }

        .chat-input-area button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: white;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            transition: all 0.3s;
        }

        .chat-input-area button:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        .chat-input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .ai-features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .ai-feature-card {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
            transition: all 0.3s;
        }

        .ai-feature-card:hover {
            background: rgba(255,255,255,0.06);
            transform: translateY(-2px);
            border-color: rgba(96,165,250,0.3);
        }

        .ai-feature-card .icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .ai-feature-card .label {
            font-size: 13px;
            opacity: 0.7;
        }

        .typing-indicator {
            display: none;
            padding: 10px 16px;
            background: rgba(74,222,128,0.05);
            border-radius: 12px;
            max-width: 60px;
            margin: 8px 0;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(74,222,128,0.5);
            animation: typing 1.4s infinite both;
            margin: 0 2px;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .quick-actions button {
            padding: 6px 14px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-size: 12px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s;
        }

        .quick-actions button:hover {
            background: rgba(96,165,250,0.1);
            border-color: rgba(96,165,250,0.3);
            color: white;
        }

        /* وضع التحميل */
        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(3) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            33% { content: '.'; }
            66% { content: '..'; }
            100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="ai-container">
        <h2 style="margin-bottom: 8px;">🤖 المساعد الذكي</h2>
        <p style="opacity:0.5; font-size:14px; margin-bottom:20px;">اسألني أي شيء عن المراكب، الصيانة، أو الإحصائيات</p>

        <div class="ai-features-grid">
            <div class="ai-feature-card" onclick="askAI('عرض تقرير عن حالة المراكب')">
                <div class="icon">📊</div>
                <div class="label">تقرير المراكب</div>
            </div>
            <div class="ai-feature-card" onclick="askAI('عرض إحصائيات الصيانة')">
                <div class="icon">🔧</div>
                <div class="label">إحصائيات الصيانة</div>
            </div>
            <div class="ai-feature-card" onclick="askAI('توقع الأعطال القادمة')">
                <div class="icon">🔮</div>
                <div class="label">توقع الأعطال</div>
            </div>
            <div class="ai-feature-card" onclick="askAI('نصائح لتحسين الجاهزية')">
                <div class="icon">💡</div>
                <div class="label">نصائح تحسين</div>
            </div>
        </div>

        <div class="quick-actions">
            <button onclick="askAI('كم عدد المراكب الصالحة؟')">🚢 المراكب الصالحة</button>
            <button onclick="askAI('كم عدد المراكب المعطبة؟')">⚠️ المراكب المعطبة</button>
            <button onclick="askAI('عرض تكاليف الصيانة')">💰 تكاليف الصيانة</button>
            <button onclick="askAI('تقرير عن الوحدات البحرية')">🏭 الوحدات البحرية</button>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="chat-message ai">
                <div class="sender">🤖 المساعد الذكي</div>
                <div class="content">مرحباً! 👋 أنا مساعدك الذكي. اسألني عن أي شيء يتعلق بالمراكب، الصيانة، أو الإحصائيات.</div>
                <div class="time">الآن</div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span></span><span></span><span></span>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="اكتب سؤالك هنا..." onkeypress="if(event.key==='Enter') askAI()">
            <button onclick="askAI()" id="sendBtn">إرسال</button>
        </div>
    </div>
</body>
</html>
