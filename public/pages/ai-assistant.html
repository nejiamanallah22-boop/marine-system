<!-- public/pages/sessions.html -->
<div id="page-sessions">
    <!-- ===== HEADER ===== -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; flex-wrap:wrap; gap:8px; border-bottom:1px solid rgba(255,255,255,0.05);">
        <div>
            <h2 style="margin:0; color:white; font-size:22px;">🔄 المراقبة</h2>
            <p style="margin:0; color:rgba(255,255,255,0.4); font-size:13px;">مراقبة الجلسات النشطة والأجهزة المتصلة</p>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <span style="background:rgba(74,222,128,0.15); color:#4ade80; padding:6px 16px; border-radius:20px; font-size:12px; border:1px solid rgba(74,222,128,0.1);">
                🟢 <span id="sessionOnline">0</span> متصل
            </span>
            <button onclick="refreshSessions()" style="padding:6px 14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:10px; color:rgba(255,255,255,0.5); cursor:pointer;">🔄 تحديث</button>
            <button onclick="initUserMap()" style="padding:6px 14px; background:rgba(96,165,250,0.15); border:1px solid rgba(96,165,250,0.1); border-radius:10px; color:#60a5fa; cursor:pointer;">🗺️ خريطة</button>
        </div>
    </div>

    <!-- ===== إحصائيات سريعة ===== -->
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin:15px 0;">
        <div class="stat-card" style="padding:12px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05); border-radius:10px; text-align:center;">
            <div style="font-size:22px; font-weight:700; color:#60a5fa;" id="totalSessions">0</div>
            <div style="font-size:11px; color:rgba(255,255,255,0.3);">📊 إجمالي الجلسات</div>
        </div>
        <div class="stat-card" style="padding:12px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05); border-radius:10px; text-align:center;">
            <div style="font-size:22px; font-weight:700; color:#4ade80;" id="activeSessions">0</div>
            <div style="font-size:11px; color:rgba(255,255,255,0.3);">🟢 جلسات نشطة</div>
        </div>
        <div class="stat-card" style="padding:12px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05); border-radius:10px; text-align:center;">
            <div style="font-size:22px; font-weight:700; color:#f87171;" id="expiredSessions">0</div>
            <div style="font-size:11px; color:rgba(255,255,255,0.3);">🔴 منتهية</div>
        </div>
        <div class="stat-card" style="padding:12px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05); border-radius:10px; text-align:center;">
            <div style="font-size:22px; font-weight:700; color:#fbbf24;" id="uniqueUsers">0</div>
            <div style="font-size:11px; color:rgba(255,255,255,0.3);">👤 مستخدمين فريدين</div>
        </div>
    </div>

    <!-- ===== الخريطة ===== -->
    <div style="background:rgba(255,255,255,0.02); border-radius:12px; padding:10px; border:1px solid rgba(255,255,255,0.04); margin-bottom:15px;">
        <div id="sessionMap" style="height:400px; width:100%; border-radius:8px; background:#0a0a1a;"></div>
    </div>

    <!-- ===== قائمة الجلسات ===== -->
    <div class="stat-card" style="padding:15px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h4 style="color:rgba(255,255,255,0.7); margin:0; font-size:14px;">📋 قائمة الجلسات النشطة</h4>
            <span style="color:rgba(255,255,255,0.3); font-size:11px;" id="sessionCount">0 جلسة</span>
        </div>
        <div class="scrollable-table">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>👤 المستخدم</th>
                        <th>📍 الجهاز</th>
                        <th>🌐 IP</th>
                        <th>🕐 بداية الجلسة</th>
                        <th>📊 الحالة</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="sessionsBody">
                    <tr><td colspan="7" style="text-align:center; padding:20px; color:rgba(255,255,255,0.2);">⏳ جاري تحميل البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ============================================================
     Leaflet CSS & JS
     ============================================================ -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    #sessionMap {
        height: 400px;
        width: 100%;
        border-radius: 8px;
        background: #0a0a1a;
    }
    .session-marker {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 12px;
        color: white;
        font-weight: bold;
        text-align: center;
    }
    .session-marker .avatar {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        border: 2px solid white;
        box-shadow: 0 0 20px rgba(13,110,253,0.3);
    }
    .session-marker .avatar.active { background: #4ade80; border-color: #4ade80; animation: pulse-marker 2s infinite; }
    .session-marker .avatar.inactive { background: #6c757d; border-color: #6c757d; }
    .session-marker .name { font-size: 10px; margin-top: 2px; background: rgba(0,0,0,0.8); padding: 2px 8px; border-radius: 10px; backdrop-filter: blur(4px); }
    @keyframes pulse-marker { 0%, 100% { box-shadow: 0 0 20px rgba(74,222,128,0.3); } 50% { box-shadow: 0 0 40px rgba(74,222,128,0.6); } }
    
    .scrollable-table { overflow-x: auto; margin: 10px 0; }
    .scrollable-table table { width: 100%; border-collapse: collapse; font-family: 'Cairo', sans-serif; font-size: 13px; }
    .scrollable-table table th { background: rgba(255,255,255,0.04); padding: 10px; border-bottom: 2px solid rgba(255,255,255,0.06); text-align: center; color: rgba(255,255,255,0.7); }
    .scrollable-table table td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.04); text-align: center; color: rgba(255,255,255,0.6); }
    .scrollable-table table tr:hover { background: rgba(255,255,255,0.02); }
    
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; }
    .status-active { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.1); }
    .status-inactive { background: rgba(108,117,125,0.15); color: #6c757d; border: 1px solid rgba(108,117,125,0.1); }
    .status-expired { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.1); }
    
    .btn-sm { padding: 4px 10px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; margin: 2px; }
    .btn-sm:hover { opacity: 0.8; }
    .btn-danger { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.1); }
    .btn-warning { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.1); }
    
    .stat-card { transition: all 0.3s; }
    .stat-card:hover { background: rgba(255,255,255,0.04) !important; }
</style>

<script>
// ============================================================
// 🔄 SESSIONS PAGE - الكود الكامل المصحح
// ============================================================

let sessionMap = null;
let sessionMarkers = {};
let sessionsData = [];
let mapInitialized = false;

// ============================================================
// 1. تهيئة الخريطة
// ============================================================

function initUserMap() {
    console.log('🗺️ initUserMap called');
    
    if (sessionMap) {
        sessionMap.invalidateSize();
        return;
    }
    
    try {
        sessionMap = L.map('sessionMap', {
            center: [36.8, 10.18],
            zoom: 13
        });
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        }).addTo(sessionMap);
        
        mapInitialized = true;
        console.log('✅ Session map initialized');
        
        setTimeout(updateSessionMarkers, 500);
        
    } catch(error) {
        console.error('❌ Map error:', error);
        document.getElementById('sessionMap').innerHTML = `
            <div style="display:flex; align-items:center; justify-content:center; height:100%; color:#f87171; flex-direction:column;">
                <div style="font-size:48px;">🗺️</div>
                <div style="margin-top:10px;">❌ خطأ في تحميل الخريطة</div>
                <button onclick="initUserMap()" style="margin-top:10px; padding:8px 20px; background:rgba(96,165,250,0.15); border:1px solid rgba(96,165,250,0.1); border-radius:8px; color:#60a5fa; cursor:pointer;">🔄 إعادة المحاولة</button>
            </div>
        `;
    }
}

// ============================================================
// 2. تحميل الجلسات
// ============================================================

function loadSessions() {
    console.log('🔄 Loading sessions...');
    
    const token = localStorage.getItem('token');
    if (!token) {
        document.getElementById('sessionsBody').innerHTML = `
            <tr><td colspan="7" style="text-align:center; padding:20px; color:rgba(255,255,255,0.2);">
                ⚠️ الرجاء تسجيل الدخول أولاً
            </td></tr>
        `;
        return;
    }
    
    // ✅ جلب البيانات من API
    fetch('/api/sessions', {
        headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(res => {
        if (!res.ok) throw new Error('فشل تحميل الجلسات');
        return res.json();
    })
    .then(data => {
        sessionsData = data.sessions || data || [];
        console.log('✅ Sessions loaded:', sessionsData.length);
        renderSessions(sessionsData);
        updateSessionStats(sessionsData);
        updateSessionMarkers();
    })
    .catch(err => {
        console.error('❌ Load sessions error:', err);
        document.getElementById('sessionsBody').innerHTML = `
            <tr><td colspan="7" style="text-align:center; padding:20px; color:#f87171;">
                ❌ خطأ في تحميل البيانات: ${err.message}
            </td></tr>
        `;
    });
}

// ============================================================
// 3. عرض الجلسات
// ============================================================

function renderSessions(sessions) {
    const tbody = document.getElementById('sessionsBody');
    if (!tbody) return;
    
    document.getElementById('sessionCount').textContent = sessions.length + ' جلسة';
    
    if (!sessions || sessions.length === 0) {
        tbody.innerHTML = `
            <tr><td colspan="7" style="text-align:center; padding:20px; color:rgba(255,255,255,0.2);">
                🚫 لا توجد جلسات نشطة
            </td></tr>
        `;
        return;
    }
    
    tbody.innerHTML = sessions.map((s, i) => {
        const statusClass = s.status === 'active' ? 'status-active' : s.status === 'expired' ? 'status-expired' : 'status-inactive';
        const statusText = s.status === 'active' ? '🟢 نشط' : s.status === 'expired' ? '🔴 منتهية' : '⚪ غير نشط';
        const deviceName = s.device || s.userAgent || 'جهاز غير معروف';
        
        return `
            <tr>
                <td>${i + 1}</td>
                <td><strong>${s.username || s.userName || 'مجهول'}</strong></td>
                <td>${deviceName}</td>
                <td>${s.ip || s.ipAddress || '--'}</td>
                <td>${s.createdAt ? new Date(s.createdAt).toLocaleString('ar-TN') : '--'}</td>
                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                <td>
                    <button class="btn-sm btn-danger" onclick="terminateSession('${s.sessionId || s.id || i}')">⏹️ إنهاء</button>
                </td>
            </tr>
        `;
    }).join('');
}

// ============================================================
// 4. تحديث الإحصائيات
// ============================================================

function updateSessionStats(sessions) {
    const total = sessions.length;
    const active = sessions.filter(s => s.status === 'active').length;
    const expired = sessions.filter(s => s.status === 'expired' || s.status === 'inactive').length;
    const uniqueUsers = new Set(sessions.map(s => s.userId || s.userName)).size;
    
    document.getElementById('totalSessions').textContent = total;
    document.getElementById('activeSessions').textContent = active;
    document.getElementById('expiredSessions').textContent = expired;
    document.getElementById('uniqueUsers').textContent = uniqueUsers;
    document.getElementById('sessionOnline').textContent = active;
}

// ============================================================
// 5. تحديث الماركرز
// ============================================================

function updateSessionMarkers() {
    if (!mapInitialized || !sessionMap) return;
    
    // حذف الماركرز القديمة
    Object.values(sessionMarkers).forEach(marker => {
        sessionMap.removeLayer(marker);
    });
    sessionMarkers = {};
    
    // إضافة ماركرز جديدة
    sessionsData.forEach(s => {
        if (!s.lat || !s.lng) return;
        
        const isActive = s.status === 'active';
        const icon = L.divIcon({
            className: 'custom-div-icon',
            html: `
                <div class="session-marker">
                    <div class="avatar ${isActive ? 'active' : 'inactive'}">
                        ${s.role === 'admin' || s.role === 'مسؤول' ? '👑' : '👤'}
                    </div>
                    <div class="name">${s.username || s.userName || 'مجهول'}</div>
                </div>
            `,
            iconSize: [50, 50],
            iconAnchor: [25, 25],
            popupAnchor: [0, -25]
        });
        
        const marker = L.marker([s.lat, s.lng], { icon: icon }).addTo(sessionMap);
        
        const popupContent = `
            <div style="text-align:right; font-family:Cairo, sans-serif; min-width:150px;">
                <div style="font-weight:bold; font-size:14px; color:white;">${s.username || s.userName || 'مجهول'}</div>
                <div style="color:rgba(255,255,255,0.6); font-size:12px;">${s.role || 'مشاهد'}</div>
                <div style="margin:4px 0;">
                    <span style="color:${isActive ? '#4ade80' : '#6c757d'}; font-size:11px;">${isActive ? '🟢 نشط' : '🔴 غير نشط'}</span>
                </div>
                <div style="color:rgba(255,255,255,0.4); font-size:10px;">
                    📍 ${s.lat.toFixed(6)}, ${s.lng.toFixed(6)}
                </div>
                <div style="color:rgba(255,255,255,0.2); font-size:9px; margin-top:2px;">
                    ${s.updatedAt ? '🕐 ' + new Date(s.updatedAt).toLocaleString('ar-TN') : ''}
                </div>
            </div>
        `;
        marker.bindPopup(popupContent);
        
        sessionMarkers[s.sessionId || s.id || s._id] = marker;
    });
    
    // تحديث مركز الخريطة
    const keys = Object.keys(sessionMarkers);
    if (keys.length > 0 && sessionsData.length > 0) {
        const first = sessionsData.find(s => s.lat && s.lng);
        if (first) {
            sessionMap.setView([first.lat, first.lng], 13);
        }
    }
}

// ============================================================
// 6. إنهاء جلسة
// ============================================================

function terminateSession(id) {
    if (!confirm('⚠️ هل أنت متأكد من إنهاء هذه الجلسة؟')) return;
    
    const token = localStorage.getItem('token');
    if (!token) {
        showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
        return;
    }
    
    fetch(`/api/sessions/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            showToast('✅ تم إنهاء الجلسة بنجاح', 'success');
            refreshSessions();
        } else {
            showToast('❌ ' + (data.error || 'فشل إنهاء الجلسة'), 'danger');
        }
    })
    .catch(err => {
        console.error('❌ Terminate session error:', err);
        showToast('❌ خطأ في إنهاء الجلسة', 'danger');
    });
}

// ============================================================
// 7. تحديث الجلسات
// ============================================================

function refreshSessions() {
    loadSessions();
    showToast('🔄 تم تحديث الجلسات', 'info');
}

function startMapAutoRefresh() {
    setInterval(() => {
        if (document.getElementById('page-sessions')) {
            loadSessions();
        }
    }, 30000);
}

// ============================================================
// 8. التهيئة
// ============================================================

if (document.getElementById('page-sessions')) {
    console.log('🔄 Sessions page loaded');
    
    setTimeout(() => {
        initUserMap();
        loadSessions();
        startMapAutoRefresh();
    }, 300);
}

// ============================================================
// 9. دوال عالمية
// ============================================================

window.refreshSessions = refreshSessions;
window.terminateSession = terminateSession;
window.initUserMap = initUserMap;
window.startMapAutoRefresh = startMapAutoRefresh;

console.log('✅ Sessions page ready');
</script>
