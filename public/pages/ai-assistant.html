<script>
// ============================================================
// 🤖 GEMINI AI ASSISTANT
// ============================================================

// ============================================================
// 1. CONFIGURATION
// ============================================================

const GEMINI_CONFIG = {
    // ✅ استخدم API endpoint المتوافق مع OpenAI
    API_URL: 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions',
    MODEL: 'gemini-2.5-flash',  // أو gemini-2.5-pro
    MAX_TOKENS: 1000,
    TEMPERATURE: 0.7,
    SYSTEM_PROMPT: `أنت مساعد ذكي متخصص في الأسطول البحري التونسي، ولديك معرفة عامة واسعة.
    
    ⚓ الأسطول البحري التونسي:
    - المنظومة: منظومة متابعة الوسائل البحرية
    - المطور: أمان الله ناجي
    - الإصدار: v7.0
    
    🌍 المعرفة العامة:
    - أنت خبير في جميع المجالات: التاريخ، الجغرافيا، العلوم، الثقافة، السياسة، الاقتصاد، الرياضة، إلخ.
    - تجيب باللغة العربية الفصحى أو بالعامية التونسية حسب سؤال المستخدم.
    - كن دقيقاً ومفصلاً في إجاباتك.
    - إذا لم تكن تعرف الإجابة، قل ذلك بصراحة.`
};

// ============================================================
// 2. STATE
// ============================================================

let chatHistory = [];
let isProcessing = false;
let apiKey = localStorage.getItem('gemini_api_key') || '';
let vesselData = [];

// ============================================================
// 3. LOAD DATA
// ============================================================

function loadVesselData() {
    try {
        if (window.allVessels && Array.isArray(window.allVessels)) {
            vesselData = window.allVessels;
        } else {
            vesselData = [
                { name: 'البروق 1', num: 'B001', stat: 'صالح', reg: 'الشمال', len: 11, zone: 'تونس' },
                { name: 'صقر 2', num: 'S002', stat: 'صالح', reg: 'الساحل', len: 10, zone: 'سوسة' },
                { name: 'خافرة 3', num: 'K003', stat: 'معطب', reg: 'الوسط', len: 20, zone: 'صفاق스', break: 'عطل في المحرك' },
                { name: 'طوافة 4', num: 'T004', stat: 'صيانة', reg: 'الجنوب', len: 35, zone: 'جرجيس', break: 'أعطال كهربائية' },
                { name: 'زورق سريع 5', num: 'Z005', stat: 'صالح', reg: 'الشمال', len: 15, zone: 'بنزرت' },
                { name: 'البروق 6', num: 'B006', stat: 'صيانة', reg: 'الساحل', len: 11, zone: 'المنستير', break: 'نظام ملاحة' },
                { name: 'صقر 7', num: 'S007', stat: 'صالح', reg: 'الجنوب', len: 9, zone: 'جربة' },
            ];
        }
        console.log('✅ بيانات الأسطول محملة:', vesselData.length, 'مركب');
    } catch(e) {
        console.warn('⚠️ فشل تحميل بيانات الأسطول:', e);
    }
}

// ============================================================
// 4. GET MARINE CONTEXT
// ============================================================

function getMarineContext() {
    try {
        const vessels = vesselData || [];
        const total = vessels.length;
        const active = vessels.filter(v => v.stat === 'صالح').length;
        const maintenance = vessels.filter(v => v.stat === 'صيانة').length;
        const broken = vessels.filter(v => v.stat === 'معطب').length;
        const efficiency = total ? ((active / total) * 100).toFixed(1) : 0;
        
        const regions = {};
        vessels.forEach(v => {
            if (!regions[v.reg]) regions[v.reg] = { total: 0, active: 0 };
            regions[v.reg].total++;
            if (v.stat === 'صالح') regions[v.reg].active++;
        });
        
        let regionStats = '';
        Object.entries(regions).forEach(([name, data]) => {
            const eff = data.total ? ((data.active / data.total) * 100).toFixed(1) : 0;
            regionStats += `- ${name}: ${data.active}/${data.total} صالح (${eff}%)\n`;
        });
        
        const brokenList = vessels.filter(v => v.stat === 'معطب' || v.stat === 'صيانة');
        let brokenStats = '';
        brokenList.forEach(v => {
            brokenStats += `- ${v.name} (${v.num}): ${v.stat} - ${v.break || 'بدون تفاصيل'}\n`;
        });
        
        return {
            total, active, maintenance, broken, efficiency,
            regionStats, brokenStats, brokenCount: brokenList.length,
            vessels
        };
    } catch(e) { return null; }
}

// ============================================================
// 5. API KEY MANAGEMENT
// ============================================================

function saveApiKey() {
    const input = document.getElementById('apiKeyInput');
    const key = input.value.trim();
    
    if (!key) {
        updateKeyStatus('invalid', '⚠️ المفتاح مطلوب');
        return;
    }
    
    if (!key.startsWith('AIza')) {
        updateKeyStatus('invalid', '⚠️ مفتاح غير صحيح (يبدأ بـ AIza)');
        return;
    }
    
    apiKey = key;
    localStorage.setItem('gemini_api_key', key);
    updateKeyStatus('valid', '✅ تم حفظ المفتاح');
    showToast('✅ تم حفظ مفتاح Gemini بنجاح', 'success');
    
    // اختبار المفتاح
    testApiKey(key);
}

function updateKeyStatus(type, text) {
    const el = document.getElementById('keyStatus');
    el.className = 'key-status ' + type;
    el.textContent = text;
}

function loadSavedKey() {
    if (apiKey) {
        document.getElementById('apiKeyInput').value = apiKey;
        updateKeyStatus('valid', '✅ مفتاح محفوظ');
    } else {
        updateKeyStatus('invalid', '⚠️ يرجى إدخال مفتاح');
    }
}

async function testApiKey(key) {
    updateKeyStatus('checking', '🔄 جاري التحقق...');
    try {
        const response = await fetch(GEMINI_CONFIG.API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + key
            },
            body: JSON.stringify({
                model: GEMINI_CONFIG.MODEL,
                messages: [{ role: 'user', content: 'Hello' }],
                max_tokens: 10
            })
        });
        
        if (response.ok) {
            updateKeyStatus('valid', '✅ مفتاح صالح');
        } else if (response.status === 401) {
            updateKeyStatus('invalid', '❌ مفتاح غير صالح');
        } else if (response.status === 429) {
            updateKeyStatus('invalid', '⚠️ تم تجاوز الحد اليومي');
        } else {
            updateKeyStatus('invalid', '⚠️ خطأ: ' + response.status);
        }
    } catch(e) {
        updateKeyStatus('invalid', '❌ فشل الاتصال');
    }
}

// ============================================================
// 6. SEND TO GEMINI
// ============================================================

async function sendToGemini(userMessage) {
    if (!apiKey) {
        return '⚠️ يرجى إدخال مفتاح Gemini API أولاً في الحقل أعلاه. 🔑';
    }
    
    // الحصول على سياق الأسطول
    const context = getMarineContext();
    let contextText = '';
    if (context) {
        contextText = `
📊 بيانات الأسطول الحالية:
- إجمالي المراكب: ${context.total}
- الصالح: ${context.active} (${context.efficiency}%)
- تحت الصيانة: ${context.maintenance}
- المعطوب: ${context.broken}

📋 تفاصيل الأقاليم:
${context.regionStats}

⚠️ المراكب المعطوبة (${context.brokenCount}):
${context.brokenStats || 'لا توجد مراكب معطوبة'}

📌 المراكب:
${context.vessels.map(v => `- ${v.name} (${v.num}) - ${v.stat} - ${v.reg} - ${v.zone}`).join('\n')}
`;
    }
    
    try {
        const response = await fetch(GEMINI_CONFIG.API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + apiKey
            },
            body: JSON.stringify({
                model: GEMINI_CONFIG.MODEL,
                messages: [
                    { role: 'system', content: GEMINI_CONFIG.SYSTEM_PROMPT },
                    { role: 'system', content: `هذه هي بيانات الأسطول الحالية (استخدمها فقط إذا سأل المستخدم عن الأسطول):\n${contextText}` },
                    ...chatHistory.slice(-8),
                    { role: 'user', content: userMessage }
                ],
                max_tokens: GEMINI_CONFIG.MAX_TOKENS,
                temperature: GEMINI_CONFIG.TEMPERATURE
            })
        });
        
        if (!response.ok) {
            const errorData = await response.json();
            console.error('❌ Gemini API Error:', errorData);
            
            if (response.status === 401) {
                return '❌ مفتاح Gemini غير صالح. يرجى التحقق من المفتاح في الحقل أعلاه. 🔑';
            } else if (response.status === 429) {
                return '⚠️ تم تجاوز الحد اليومي للمفتاح. يرجى المحاولة غداً أو استخدام مفتاح آخر. 📅';
            } else {
                return `❌ خطأ في الاتصال: ${response.status}`;
            }
        }
        
        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || 'عذراً، لم أستطع معالجة طلبك.';
        
        chatHistory.push({ role: 'user', content: userMessage });
        chatHistory.push({ role: 'assistant', content: reply });
        
        return reply;
        
    } catch(error) {
        console.error('❌ Gemini Error:', error);
        return '❌ عذراً، حدث خطأ في الاتصال. يرجى المحاولة لاحقاً. 🔄';
    }
}

// 7. UI FUNCTIONS
// ============================================================

function addMessage(text, type = 'assistant', isHtml = false) {
    const container = document.getElementById('aiMessages');
    const time = new Date().toLocaleTimeString('ar-TN', { hour: '2-digit', minute: '2-digit' });
    const avatar = type === 'user' ? '👤' : '🧠';
    const bubbleClass = type === 'user' ? 'user' : 'assistant';
    
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${bubbleClass}`;
    msgDiv.innerHTML = `
        <div class="avatar">${avatar}</div>
        <div class="bubble">
            ${isHtml ? text : text.replace(/\n/g, '<br>')}
            <span class="message-time">${time}</span>
        </div>
    `;
    container.appendChild(msgDiv);
    container.scrollTop = container.scrollHeight;
}

function addTypingIndicator() {
    const container = document.getElementById('aiMessages');
    const time = new Date().toLocaleTimeString('ar-TN', { hour: '2-digit', minute: '2-digit' });
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message assistant';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = `
        <div class="avatar">🧠</div>
        <div class="bubble">
            <div class="typing-indicator"><span></span><span></span><span></span></div>
            <span class="message-time">${time}</span>
        </div>
    `;
    container.appendChild(typingDiv);
    container.scrollTop = container.scrollHeight;
}

function removeTypingIndicator() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
}

function autoResizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

// ============================================================
// 8. MAIN FUNCTIONS
// ============================================================

async function sendAIMessage() {
    const input = document.getElementById('aiInput');
    const text = input.value.trim();
    const sendBtn = document.getElementById('sendBtn');
    
    if (!text || isProcessing) return;
    if (text.length > 2000) {
        showToast('⚠️ الرسالة طويلة جداً (حد أقصى 2000 حرف)', 'warning');
        return;
    }
    
    addMessage(text, 'user');
    input.value = '';
    document.getElementById('charCounter').textContent = '0 / 2000';
    autoResizeTextarea(input);
    
    isProcessing = true;
    sendBtn.disabled = true;
    sendBtn.classList.add('loading');
    addTypingIndicator();
    
    try {
        const reply = await sendToGemini(text);
        removeTypingIndicator();
        addMessage(reply, 'assistant', true);
    } catch(error) {
        removeTypingIndicator();
        addMessage('❌ عذراً، حدث خطأ: ' + error.message, 'assistant');
    }
    
    isProcessing = false;
    sendBtn.disabled = false;
    sendBtn.classList.remove('loading');
}

function sendQuickPrompt(text) {
    document.getElementById('aiInput').value = text;
    document.getElementById('charCounter').textContent = text.length + ' / 2000';
    sendAIMessage();
}

function handleAIKey(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendAIMessage();
    }
}

function clearChat() {
    if (!confirm('هل تريد مسح جميع الرسائل؟')) return;
    const container = document.getElementById('aiMessages');
    container.innerHTML = `
        <div class="message assistant">
            <div class="avatar">🧠</div>
            <div class="bubble">
                <div>مرحباً بك في المساعد الذكي! 👋</div>
                <div style="color:rgba(255,255,255,0.5); font-size:13px; margin-top:6px;">
                    أنا مدعوم من <strong>Google Gemini</strong>. يمكنني الإجابة عن أي سؤال.
                </div>
                <div class="suggestions">
                    <button class="suggestion-btn" onclick="sendQuickPrompt('عرض إحصائيات الأسطول')">📊 الإحصائيات</button>
                    <button class="suggestion-btn" onclick="sendQuickPrompt('ما هي عاصمة تونس؟')">🌍 سؤال عام</button>
                </div>
                <span class="message-time">الآن</span>
            </div>
        </div>
    `;
    chatHistory = [];
    showToast('🗑️ تم مسح المحادثة', 'info');
}
