<script>
// ============================================================
// 🔄 SESSIONS PAGE - v7.0 PRO MAX
// ============================================================

// ============================================================
// 1. المتغيرات العامة
// ============================================================

let sessionMap = null;
let sessionMarkers = {};
let sessionsData = [];
let mapInitialized = false;
let sessionsRefreshTimer = null;
let isPageActive = false;

// ============================================================
// 2. دوال مساعدة
// ============================================================

function escapeHTML(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function getToken() {
    return localStorage.getItem('marine_auth_token') || localStorage.getItem('token');
}

function getTimeAgo(dateStr) {
    if (!dateStr) return '--';
    try {
        const date = new Date(dateStr);
        const now = Date.now();
        const diff = now - date.getTime();
        
        if (diff < 60000) return 'الآن';
        if (diff < 3600000) return Math.floor(diff / 60000) + ' دقيقة';
        if (diff < 86400000) return Math.floor(diff / 3600000) + ' ساعة';
        return Math.floor(diff / 86400000) + ' يوم';
    } catch {
        return '--';
    }
}

function isValidCoordinate(lat, lng) {
    return typeof lat === 'number' && 
           typeof lng === 'number' &&
           lat >= -90 && lat <= 90 &&
           lng >= -180 && lng <= 180;
}

function showToast(msg, type = 'info') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    
    const icons = {
        success: '✅',
        error: '❌',
        warning: '⚠️',
        info: 'ℹ️'
    };
    
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${msg}`;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(30px)';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// ============================================================
// 3. تهيئة الخريطة
// ============================================================

function initSessionMap() {
    console.log('🗺️ تهيئة الخريطة...');
    
    // التحقق من وجود Leaflet
    if (typeof L === 'undefined') {
        console.warn('⚠️ Leaflet غير محمّل، إعادة محاولة...');
        document.getElementById('mapStatus').textContent = '⏳ جاري تحميل الخريطة...';
        setTimeout(initSessionMap, 500);
        return;
    }
    
    const mapContainer = document.getElementById('sessionMap');
    if (!mapContainer) return;
    
    // إذا كانت الخريطة موجودة
    if (sessionMap) {
        setTimeout(() => sessionMap.invalidateSize(true), 300);
        return;
    }
    
    try {
        // إنشاء الخريطة
        sessionMap = L.map('sessionMap', {
            center: [36.8065, 10.1815], // تونس
            zoom: 12,
            zoomControl: true
        });
        
        // إضافة طبقة الخريطة
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(sessionMap);
        
        mapInitialized = true;
        document.getElementById('mapStatus').textContent = '📍 الخريطة جاهزة';
        console.log('✅ تم تهيئة الخريطة');
        
        // تحديث حجم الخريطة
        setTimeout(() => {
            if (sessionMap) sessionMap.invalidateSize(true);
        }, 500);
        
        // تحديث الماركرز
        setTimeout(updateMarkers, 300);
        
    } catch (error) {
        console.error('❌ خطأ في الخريطة:', error);
        document.getElementById('sessionMap').innerHTML = `
            <div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--color-danger); flex-direction:column; padding:20px; text-align:center;">
                <div style="font-size:48px;">🗺️</div>
                <div style="margin-top:10px;">❌ خطأ في تحميل الخريطة</div>
                <div style="font-size:12px; color:var(--color-text-dim);">${escapeHTML(error.message)}</div>
                <button onclick="initSessionMap()" style="margin-top:10px; padding:8px 20px; background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.1); border-radius:8px; color:var(--color-info); cursor:pointer; font-family:inherit;">
                    🔄 إعادة المحاولة
                </button>
            </div>
        `;
    }
}

// ============================================================
// 4. مركز الخريطة
// ============================================================

function centerSessionMap() {
    if (!sessionMap) {
        showToast('⚠️ الخريطة غير جاهزة', 'warning');
        return;
    }
    
    // البحث عن جلسة نشطة
    const activeSession = sessionsData.find(s => 
        s.status === 'active' && isValidCoordinate(s.lat, s.lng)
    );
    
    if (activeSession) {
        sessionMap.setView([activeSession.lat, activeSession.lng], 13);
        showToast('🎯 تم التوجيه إلى موقع نشط', 'success');
    } else {
        sessionMap.setView([36.8065, 10.1815], 12);
        showToast('🎯 تم التوجيه إلى المركز', 'info');
    }
}

// ============================================================
// 5. تحميل الجلسات
// ============================================================

function loadSessions() {
    console.log('🔄 تحميل الجلسات...');
    
    const token = getToken();
    if (!token) {
        document.getElementById('sessionsBody').innerHTML = `
            <tr><td colspan="7" style="text-align:center; padding:30px; color:var(--color-warning);">
                ⚠️ الرجاء تسجيل الدخول أولاً
            </td></tr>
        `;
        return;
    }
    
    // عرض حالة التحميل
    document.getElementById('sessionsBody').innerHTML = `
        <tr><td colspan="7" class="loading-text">
            <div class="loader-spinner"></div>
            جاري تحميل الجلسات...
        </td></tr>
    `;
    
    fetch('/api/sessions', {
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        }
    })
    .then(res => {
        if (!res.ok) {
            if (res.status === 401) throw new Error('غير مصرح - يرجى تسجيل الدخول من جديد');
            if (res.status === 403) throw new Error('ليس لديك صلاحية للوصول');
            throw new Error('خطأ ' + res.status + ': ' + res.statusText);
        }
        return res.json();
    })
    .then(data => {
        // التحقق من صيغة البيانات
        if (data.success !== undefined && !data.success) {
            throw new Error(data.error || 'فشل تحميل الجلسات');
        }
        
        sessionsData = Array.isArray(data.sessions) ? data.sessions : [];
        console.log('✅ تم تحميل الجلسات:', sessionsData.length);
        
        renderSessions(sessionsData);
        updateStats(sessionsData);
        updateMarkers();
        
        // تحديث حالة الخريطة
        const hasLocations = sessionsData.some(s => isValidCoordinate(s.lat, s.lng));
        document.getElementById('mapStatus').textContent = hasLocations 
            ? '📍 ' + sessionsData.filter(s => isValidCoordinate(s.lat, s.lng)).length + ' موقع متاح'
            : '📍 لا توجد مواقع متاحة حالياً';
    })
    .catch(err => {
        console.error('❌ خطأ في تحميل الجلسات:', err);
        document.getElementById('sessionsBody').innerHTML = `
            <tr><td colspan="7" style="text-align:center; padding:30px; color:var(--color-danger);">
                ❌ ${escapeHTML(err.message)}
            </td></tr>
        `;
        document.getElementById('mapStatus').textContent = '❌ خطأ في تحميل البيانات';
        showToast('❌ ' + err.message, 'error');
    });
}

// ============================================================
// 6. عرض الجلسات
// ============================================================

function renderSessions(sessions) {
    const tbody = document.getElementById('sessionsBody');
    if (!tbody) return;
    
    document.getElementById('sessionCount').textContent = sessions.length + ' جلسة';
    
    if (!sessions || sessions.length === 0) {
        tbody.innerHTML = `
            <tr><td colspan="7" style="text-align:center; padding:30px; color:var(--color-text-dim);">
                🚫 لا توجد جلسات حالياً
            </td></tr>
        `;
        return;
    }
    
    tbody.innerHTML = sessions.map((s, i) => {
        const username = escapeHTML(s.username || s.userName || 'مجهول');
        const device = escapeHTML(s.device || s.userAgent || 'جهاز غير معروف');
        const ip = escapeHTML(s.ip || s.ipAddress || '--');
        
        const statusClass = s.status === 'active' ? 'status-active' : 
                           s.status === 'expired' ? 'status-expired' : 'status-inactive';
        const statusText = s.status === 'active' ? '🟢 نشط' : 
                          s.status === 'expired' ? '🔴 منتهية' : '⚪ غير نشط';
        
        const createdAt = s.createdAt ? new Date(s.createdAt).toLocaleString('ar-TN') : '--';
        const sessionId = s.sessionId || s.id || s._id || i;
        
        return `
            <tr>
                <td>${i + 1}</td>
                <td><strong>${username}</strong></td>
                <td>${device}</td>
                <td>${ip}</td>
                <td>${createdAt}</td>
                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                <td>
                    <button class="btn-sm btn-danger-sm" onclick="terminateSession('${escapeHTML(sessionId)}')">
                        <i class="fas fa-power-off"></i> إنهاء
                    </button>
                </td>
            </tr>
        `;
    }).join('');
}

// ============================================================
// 7. تحديث الإحصائيات
// ============================================================

function updateStats(sessions) {
    const total = sessions.length;
    const active = sessions.filter(s => s.status === 'active').length;
    const expired = sessions.filter(s => s.status === 'expired').length;
    const inactive = sessions.filter(s => s.status === 'inactive').length;
    const uniqueUsers = new Set(sessions.map(s => s.userId || s.userName)).size;
    
    document.getElementById('totalSessions').textContent = total;
    document.getElementById('activeSessions').textContent = active;
    document.getElementById('expiredSessions').textContent = expired + inactive;
    document.getElementById('uniqueUsers').textContent = uniqueUsers || sessions.length;
    document.getElementById('sessionOnline').textContent = active;
}

// ============================================================
// 8. تحديث الماركرز
// ============================================================

function updateMarkers() {
    if (!mapInitialized || !sessionMap) {
        console.warn('⚠️ الخريطة غير جاهزة للماركرز');
        return;
    }
    
    // حذف الماركرز القديمة
    Object.values(sessionMarkers).forEach(marker => {
        if (marker && sessionMap) {
            sessionMap.removeLayer(marker);
        }
    });
    sessionMarkers = {};
    
    // إضافة ماركرز جديدة
    let markerCount = 0;
    
    sessionsData.forEach(s => {
        // التحقق من صحة الإحداثيات
        if (!isValidCoordinate(s.lat, s.lng)) return;
        
        const isActive = s.status === 'active';
        const isExpired = s.status === 'expired';
        const avatarClass = isActive ? 'active' : isExpired ? 'expired' : 'inactive';
        const avatarIcon = s.role === 'admin' || s.role === 'مسؤول' ? '👑' : '👤';
        const username = escapeHTML(s.username || s.userName || '?');
        
        // إنشاء أيقونة مخصصة
        const icon = L.divIcon({
            className: 'custom-div-icon',
            html: `
                <div class="session-marker">
                    <div class="avatar ${avatarClass}">
                        ${avatarIcon}
                    </div>
                    <div class="name">${username}</div>
                </div>
            `,
            iconSize: [50, 50],
            iconAnchor: [25, 25],
            popupAnchor: [0, -25]
        });
        
        const marker = L.marker([s.lat, s.lng], { icon }).addTo(sessionMap);
        
        // نافذة منبثقة
        const statusText = isActive ? '🟢 نشط' : isExpired ? '🔴 منتهية' : '⚪ غير نشط';
        const updatedAt = s.updatedAt ? getTimeAgo(s.updatedAt) : '--';
        
        const popupContent = `
            <div style="text-align:right; font-family:Cairo, sans-serif; min-width:150px; direction:rtl;">
                <div style="font-weight:bold; font-size:14px; color:#fff;">${username}</div>
                <div style="color:rgba(255,255,255,0.6); font-size:12px;">${escapeHTML(s.role || 'مشاهد')}</div>
                <div style="margin:4px 0;">
                    <span style="color:${isActive ? '#4ade80' : isExpired ? '#ef4444' : '#adb5bd'}; font-size:11px;">${statusText}</span>
                </div>
                <div style="color:rgba(255,255,255,0.4); font-size:10px;">
                    📍 ${s.lat.toFixed(6)}, ${s.lng.toFixed(6)}
                </div>
                <div style="color:rgba(255,255,255,0.2); font-size:9px; margin-top:2px;">
                    🕐 ${updatedAt}
                </div>
            </div>
        `;
        marker.bindPopup(popupContent);
        
        const key = s.sessionId || s.id || s._id || markerCount;
        sessionMarkers[key] = marker;
        markerCount++;
    });
    
    // إذا كانت هناك ماركرات، نغير المركز إلى أول موقع نشط
    if (markerCount > 0) {
        const firstActive = sessionsData.find(s => 
            s.status === 'active' && isValidCoordinate(s.lat, s.lng)
        );
        if (firstActive) {
            sessionMap.setView([firstActive.lat, firstActive.lng], 13);
        }
    }
    
    console.log('✅ تم تحديث الماركرز:', markerCount);
}

// ============================================================
// 9. إنهاء جلسة
// ============================================================

function terminateSession(id) {
    if (!confirm('⚠️ هل أنت متأكد من إنهاء هذه الجلسة؟')) return;
    
    const token = getToken();
    if (!token) {
        showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
        return;
    }
    
    const sessionId = String(id);
    
    fetch(`/api/sessions/${encodeURIComponent(sessionId)}`, {
        method: 'DELETE',
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        }
    })
    .then(res => {
        if (!res.ok) {
            if (res.status === 401) throw new Error('غير مصرح');
            if (res.status === 403) throw new Error('ليس لديك صلاحية');
            if (res.status === 404) throw new Error('الجلسة غير موجودة');
            throw new Error('خطأ ' + res.status);
        }
        return res.json();
    })
    .then(data => {
        if (data.success) {
            showToast('✅ تم إنهاء الجلسة بنجاح', 'success');
            loadSessions();
        } else {
            showToast('❌ ' + (data.error || 'فشل إنهاء الجلسة'), 'error');
        }
    })
    .catch(err => {
        console.error('❌ خطأ في إنهاء الجلسة:', err);
        showToast('❌ ' + err.message, 'error');
    });
}

// ============================================================
// 10. تحديث تلقائي

function startAutoRefresh() {
    if (sessionsRefreshTimer) {
        clearInterval(sessionsRefreshTimer);
        sessionsRefreshTimer = null;
    }
    
    sessionsRefreshTimer = setInterval(() => {
        if (document.getElementById('page-sessions')) {
            loadSessions();
        }
    }, 30000);
}

// ============================================================
// 11. تهيئة الصفحة
// ============================================================

function initSessionsPage() {
    console.log('🔄 تهيئة صفحة المراقبة...');
    isPageActive = true;
    
    setTimeout(() => {
        initSessionMap();
        loadSessions();
        startAutoRefresh();
    }, 300);
}

// ============================================================
// 12. تنشيط عند ظهور الصفحة
// ============================================================

if (document.getElementById('page-sessions')) {
    console.log('📄 تم اكتشاف صفحة المراقبة');
    setTimeout(initSessionsPage, 300);
}

// ============================================================

window.initSessionsPage = initSessionsPage;
window.loadSessions = loadSessions;
window.refreshSessions = loadSessions;
