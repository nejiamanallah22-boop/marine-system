<script>
// ============================================================
// 🤖 GEMINI AI ASSISTANT - الكود الكامل
// ============================================================

// ============================================================
// 1. CONFIGURATION
// ============================================================

const AI_CONFIG = {
    API_URL: 'https://generativelanguage.googleapis.com/v1beta/models/',
    MODEL: 'gemini-2.0-flash',
    MAX_TOKENS: 2048,
    TEMPERATURE: 0.7,
    SYSTEM_PROMPT: `أنت مساعد ذكي متخصص في الأسطول البحري التونسي، ولديك معرفة عامة واسعة.
    
    ⚓ الأسطول البحري التونسي:
    - المنظومة: منظومة متابعة الوسائل البحرية
    - المطور: أمان الله ناجي
    - الإصدار: v7.0
    
    🌍 المعرفة العامة:
    - أنت خبير في جميع المجالات: التاريخ، الجغرافيا، العلوم، الثقافة، السياسة، الاقتصاد، الرياضة، إلخ.
    - تجيب باللغة العربية الفصحى أو بالعامية التونسية حسب سؤال المستخدم.
    - كن دقيقاً ومفصلاً في إجاباتك.
    - إذا لم تكن تعرف الإجابة، قل ذلك بصراحة.`
};

// ============================================================
// 2. STATE
// ============================================================

let chatHistory = [];
let isProcessing = false;
let GEMINI_API_KEY = '';
let vesselData = [];

// ============================================================
// 3. LOAD DATA
// ============================================================

function loadVesselData() {
    try {
        if (window.allVessels && Array.isArray(window.allVessels)) {
            vesselData = window.allVessels;
            console.log('✅ بيانات الأسطول محملة من التطبيق:', vesselData.length, 'مركب');
        } else {
            // بيانات تجريبية
            vesselData = [
                { name: 'البروق 1', num: 'B001', stat: 'صالح', reg: 'الشمال', len: 11, zone: 'تونس' },
                { name: 'صقر 2', num: 'S002', stat: 'صالح', reg: 'الساحل', len: 10, zone: 'سوسة' },
                { name: 'خافرة 3', num: 'K003', stat: 'معطب', reg: 'الوسط', len: 20, zone: 'صفاقس', break: 'عطل في المحرك' },
                { name: 'طوافة 4', num: 'T004', stat: 'صيانة', reg: 'الجنوب', len: 35, zone: 'جرجيس', break: 'أعطال كهربائية' },
                { name: 'زورق سريع 5', num: 'Z005', stat: 'صالح', reg: 'الشمال', len: 15, zone: 'بنزرت' },
                { name: 'البروق 6', num: 'B006', stat: 'صيانة', reg: 'الساحل', len: 11, zone: 'المنستير', break: 'نظام ملاحة' },
                { name: 'صقر 7', num: 'S007', stat: 'صالح', reg: 'الجنوب', len: 9, zone: 'جربة' },
            ];
            console.log('✅ بيانات الأسطول التجريبية محملة:', vesselData.length, 'مركب');
        }
    } catch(e) {
        console.warn('⚠️ فشل تحميل بيانات الأسطول:', e);
    }
}

// ============================================================
// 4. GET MARINE CONTEXT
// ============================================================

function getMarineContext() {
    try {
        const vessels = vesselData || [];
        const total = vessels.length;
        const active = vessels.filter(v => v.stat === 'صالح').length;
        const maintenance = vessels.filter(v => v.stat === 'صيانة').length;
        const broken = vessels.filter(v => v.stat === 'معطب').length;
        const efficiency = total ? ((active / total) * 100).toFixed(1) : 0;
        
        const regions = {};
        vessels.forEach(v => {
            if (!regions[v.reg]) regions[v.reg] = { total: 0, active: 0 };
            regions[v.reg].total++;
            if (v.stat === 'صالح') regions[v.reg].active++;
        });
        
        let regionStats = '';
        Object.entries(regions).forEach(([name, data]) => {
            const eff = data.total ? ((data.active / data.total) * 100).toFixed(1) : 0;
            regionStats += `- ${name}: ${data.active}/${data.total} صالح (${eff}%)\n`;
        });
        
        const brokenList = vessels.filter(v => v.stat === 'معطب' || v.stat === 'صيانة');
        let brokenStats = '';
        brokenList.forEach(v => {
            brokenStats += `- ${v.name} (${v.num}): ${v.stat} - ${v.break || 'بدون تفاصيل'}\n`;
        });
        
        return {
            total, active, maintenance, broken, efficiency,
            regionStats, brokenStats, brokenCount: brokenList.length,
            vessels
        };
    } catch(e) { 
        console.warn('⚠️ خطأ في جلب السياق:', e);
        return null; 
    }
}

// ============================================================
// 5. LOAD API KEY FROM SERVER
// ============================================================

async function loadApiKeys() {
    try {
        const response = await fetch('/api/config');
        if (!response.ok) throw new Error('فشل تحميل المفاتيح');
        const config = await response.json();
        
        GEMINI_API_KEY = config.GEMINI_API_KEY || '';
        const modelName = config.GEMINI_MODEL || 'gemini-2.0-flash';
        
        console.log('🔑 Gemini API Key:', GEMINI_API_KEY ? '✅ موجود' : '❌ غير موجود');
        console.log('📦 Model:', modelName);
        
        document.getElementById('aiModel').textContent = 'Gemini ' + modelName;
        document.getElementById('apiModelName').textContent = modelName;
        document.getElementById('aiSubtitle').textContent = 'بواسطة Google Gemini AI';
        
        if (GEMINI_API_KEY) {
            updateApiStatus('valid', '✅ مفتاح صالح');
            await testGeminiKey();
        } else {
            updateApiStatus('invalid', '⚠️ لم يتم إعداد المفتاح');
        }
    } catch(error) {
        console.error('❌ فشل تحميل المفاتيح:', error);
        updateApiStatus('invalid', '❌ خطأ في الاتصال بالخادم');
    }
}

function updateApiStatus(type, text) {
    const el = document.getElementById('apiKeyStatus');
    const textEl = document.getElementById('apiKeyStatusText');
    el.className = 'status-value ' + type;
    textEl.textContent = text;
}

async function testGeminiKey() {
    if (!GEMINI_API_KEY) return;
    
    updateApiStatus('checking', '🔄 جاري التحقق...');
    
    try {
        const response = await fetch(`${AI_CONFIG.API_URL}${AI_CONFIG.MODEL}:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: 'Hello' }] }],
                generationConfig: { maxOutputTokens: 5 }
            })
        });
        
        if (response.ok) {
            updateApiStatus('valid', '✅ مفتاح صالح');
        } else if (response.status === 403) {
            updateApiStatus('invalid', '❌ مفتاح غير صالح');
        } else if (response.status === 429) {
            updateApiStatus('invalid', '⚠️ تم تجاوز الحد اليومي');
        } else {
            updateApiStatus('invalid', '⚠️ خطأ: ' + response.status);
        }
    } catch(e) {
        updateApiStatus('invalid', '❌ فشل الاتصال');
    }
}

// ============================================================
// 6. SEND TO GEMINI API
// ============================================================

async function sendToGemini(userMessage) {
    if (!GEMINI_API_KEY) {
        return '⚠️ مفتاح Gemini غير موجود. يرجى إعداده في متغيرات البيئة على الخادم. 🔑';
    }
    
    const context = getMarineContext();
    let contextText = '';
    if (context) {
        contextText = `
📊 بيانات الأسطول الحالية:
- إجمالي المراكب: ${context.total}
- الصالح: ${context.active} (${context.efficiency}%)
- تحت الصيانة: ${context.maintenance}
- المعطوب: ${context.broken}

📋 تفاصيل الأقاليم:
${context.regionStats}

⚠️ المراكب المعطوبة (${context.brokenCount}):
${context.brokenStats || 'لا توجد مراكب معطوبة'}

📌 المراكب:
${context.vessels.map(v => `- ${v.name} (${v.num}) - ${v.stat} - ${v.reg} - ${v.zone}`).join('\n')}
`;
    }
    
    try {
        // ✅ بناء الرسالة كاملة
        let fullPrompt = AI_CONFIG.SYSTEM_PROMPT + '\n\n';
        fullPrompt += `هذه هي بيانات الأسطول الحالية (استخدمها فقط إذا سأل المستخدم عن الأسطول):\n${contextText}\n\n`;
        if (chatHistory.length > 0) {
            fullPrompt += `المحادثة السابقة:\n`;
            chatHistory.slice(-8).forEach(msg => {
                fullPrompt += `${msg.role}: ${msg.content}\n`;
            });
            fullPrompt += `\n`;
        }
        fullPrompt += `المستخدم: ${userMessage}`;
        
        // ✅ إرسال إلى Gemini API
        const response = await fetch(`${AI_CONFIG.API_URL}${AI_CONFIG.MODEL}:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: fullPrompt }]
                }],
                generationConfig: {
                    temperature: AI_CONFIG.TEMPERATURE,
                    maxOutputTokens: AI_CONFIG.MAX_TOKENS,
                    topP: 0.95,
                    topK: 40
                }
            })
        });
        
        if (!response.ok) {
            const errorData = await response.json();
            console.error('❌ Gemini API Error:', errorData);
            
            if (response.status === 403) {
                return '❌ مفتاح Gemini غير صالح أو منتهي الصلاحية. يرجى التحقق من الإعدادات. 🔑';
            } else if (response.status === 429) {
                return '⚠️ تم تجاوز الحد اليومي لمفتاح Gemini. يرجى المحاولة غداً. 📅';
            } else {
                return `❌ خطأ في الاتصال: ${response.status}`;
            }
        }
        
        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'عذراً، لم أستطع معالجة طلبك.';
        
        chatHistory.push({ role: 'المستخدم', content: userMessage });
        chatHistory.push({ role: 'المساعد', content: reply });
        
        return reply;
        
    } catch(error) {
        console.error('❌ Gemini Error:', error);
        return '❌ عذراً، حدث خطأ في الاتصال. يرجى المحاولة لاحقاً. 🔄';
    }
}

// 7. UI FUNCTIONS
// ============================================================

function addMessage(text, type = 'assistant', isHtml = false) {
    const container = document.getElementById('aiMessages');
    const time = new Date().toLocaleTimeString('ar-TN', { hour: '2-digit', minute: '2-digit' });
    const avatar = type === 'user' ? '👤' : '🧠';
    const bubbleClass = type === 'user' ? 'user' : 'assistant';
    
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${bubbleClass}`;
    msgDiv.innerHTML = `
        <div class="avatar">${avatar}</div>
        <div class="bubble">
            ${isHtml ? text : text.replace(/\n/g, '<br>')}
            <span class="message-time">${time}</span>
        </div>
    `;
    container.appendChild(msgDiv);
    container.scrollTop = container.scrollHeight;
}

function addTypingIndicator() {
    const container = document.getElementById('aiMessages');
    const time = new Date().toLocaleTimeString('ar-TN', { hour: '2-digit', minute: '2-digit' });
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message assistant';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = `
        <div class="avatar">🧠</div>
        <div class="bubble">
            <div class="typing-indicator"><span></span><span></span><span></span></div>
            <span class="message-time">${time}</span>
        </div>
    `;
    container.appendChild(typingDiv);
    container.scrollTop = container.scrollHeight;
}

function removeTypingIndicator() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
}

function autoResizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

// ============================================================
// 8. MAIN FUNCTIONS
// ============================================================

async function sendAIMessage() {
    const input = document.getElementById('aiInput');
    const text = input.value.trim();
    const sendBtn = document.getElementById('sendBtn');
    
    if (!text || isProcessing) return;
    if (text.length > 2000) {
        showToast('⚠️ الرسالة طويلة جداً (حد أقصى 2000 حرف)', 'warning');
        return;
    }
    
    addMessage(text, 'user');
    input.value = '';
    document.getElementById('charCounter').textContent = '0 / 2000';
    autoResizeTextarea(input);
    
    isProcessing = true;
    sendBtn.disabled = true;
    sendBtn.classList.add('loading');
    addTypingIndicator();
    
    try {
        const reply = await sendToGemini(text);
        removeTypingIndicator();
        addMessage(reply, 'assistant', true);
    } catch(error) {
        removeTypingIndicator();
        addMessage('❌ عذراً، حدث خطأ: ' + error.message, 'assistant');
    }
    
    isProcessing = false;
    sendBtn.disabled = false;
    sendBtn.classList.remove('loading');
}

function sendQuickPrompt(text) {
    document.getElementById('aiInput').value = text;
    document.getElementById('charCounter').textContent = text.length + ' / 2000';
    sendAIMessage();
}

function handleAIKey(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendAIMessage();
    }
}

function clearChat() {
    if (!confirm('هل تريد مسح جميع الرسائل؟')) return;
    const container = document.getElementById('aiMessages');
    container.innerHTML = `
        <div class="message assistant">
            <div class="avatar">🧠</div>
            <div class="bubble">
                <div>مرحباً بك في المساعد الذكي! 👋</div>
                <div style="color:rgba(255,255,255,0.5); font-size:13px; margin-top:6px;">
                    أنا مدعوم من <strong>Google Gemini AI</strong>. يمكنني الإجابة عن أي سؤال.
                </div>
                <div class="suggestions">
                    <button class="suggestion-btn" onclick="sendQuickPrompt('عرض إحصائيات الأسطول')">📊 الإحصائيات</button>
                    <button class="suggestion-btn" onclick="sendQuickPrompt('ما هي عاصمة تونس؟')">🌍 سؤال عام</button>
                </div>
                <span class="message-time">الآن</span>
            </div>
        </div>
    `;
    chatHistory = [];
    showToast('🗑️ تم مسح المحادثة', 'info');
}

// ============================================================
// 9. TOAST NOTIFICATION
// ============================================================

function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    const colors = {
        info: 'rgba(66,133,244,0.9)',
        warning: 'rgba(251,191,36,0.9)',
        error: 'rgba(248,113,113,0.9)',
        success: 'rgba(74,222,128,0.9)'
    };
    toast.style.cssText = `
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        border-radius: 8px;
        background: ${colors[type] || colors.info};
        color: #fff;
        font-size: 14px;
        z-index: 9999;
        animation: messageSlide 0.3s ease;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        font-family: 'Cairo', sans-serif;
    `;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
