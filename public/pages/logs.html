<div id="page-logs">
    <style>
        /* ===== STYLES ===== */
        #page-logs {
            width: 100%;
            max-width: 100%;
            padding: 0;
            margin: 0;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            background: #0a0e1a;
            color: #e8edf5;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: sticky;
            top: 64px;
            z-index: 10;
            width: 100%;
        }

        .logs-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logs-header-left .header-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5d76e, #e6b31e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #0a1628;
        }

        .logs-header-left h2 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #f5d76e, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .logs-header-left p {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin: 0;
        }

        .logs-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cairo', sans-serif;
        }

        .btn-action.primary {
            background: linear-gradient(135deg, #e6b31e, #f5d76e);
            color: #0a1628;
        }

        .btn-action.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,179,30,0.3);
        }

        .btn-action.secondary {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
        }

        .btn-action.secondary:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
        }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            padding: 16px 24px;
            width: 100%;
        }

        .stat-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 16px 18px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #e6b31e, #f5d76e);
            opacity: 0.6;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(230,179,30,0.15);
        }

        .stat-card .number {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        .stat-card .number.gold { color: #f5d76e; }
        .stat-card .number.green { color: #4ade80; }
        .stat-card .number.yellow { color: #fbbf24; }
        .stat-card .number.red { color: #f87171; }
        .stat-card .number.blue { color: #60a5fa; }

        .stat-card .label {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
        }

        .stat-card .icon-bg {
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 50px;
            opacity: 0.04;
            pointer-events: none;
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            padding: 10px 24px;
            background: rgba(255,255,255,0.04);
            border-top: 1px solid rgba(255,255,255,0.06);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            width: 100%;
        }

        .filter-bar .search-input {
            flex: 2 1 200px;
            min-width: 150px;
            position: relative;
        }

        .filter-bar .search-input input {
            width: 100%;
            padding: 8px 16px 8px 40px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.8rem;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        .filter-bar .search-input input:focus {
            border-color: #e6b31e;
            outline: none;
        }

        .filter-bar .search-input input::placeholder {
            color: rgba(255,255,255,0.15);
        }

        .filter-bar .search-input .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.1);
        }

        .filter-bar label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-bar select {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.75rem;
            min-width: 100px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
        }

        .filter-bar select:focus {
            outline: none;
            border-color: #e6b31e;
        }

        .filter-bar select option {
            background: #0a1628;
            color: #e2e8f0;
        }

        .btn-filter {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-filter.primary {
            background: linear-gradient(135deg, #e6b31e, #f5d76e);
            color: #0a1628;
        }

        .btn-filter.primary:hover {
            transform: scale(1.04);
        }

        .btn-filter.outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.3);
        }

        .btn-filter.outline:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        /* ===== TABLE ===== */
        .table-wrapper {
            overflow-x: auto;
            padding: 16px 24px 24px;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            min-width: 700px;
        }

        thead {
            background: rgba(15,52,96,0.4);
            border-bottom: 2px solid rgba(230,179,30,0.15);
        }

        thead th {
            padding: 12px 10px;
            text-align: right;
            font-weight: 700;
            font-size: 0.6rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.8px;
            white-space: nowrap;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        thead th i {
            margin-left: 6px;
            color: #e6b31e;
            font-size: 0.7rem;
        }

        tbody td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            vertical-align: middle;
            color: rgba(255,255,255,0.6);
            font-size: 0.78rem;
            text-align: center;
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }

        .vessel-name {
            font-weight: 700;
            color: #fff;
        }

        /* ===== STATUS BADGES ===== */
        .status-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }

        .status-badge.completed {
            background: rgba(74,222,128,0.12);
            color: #4ade80;
        }

        .status-badge.in-progress {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
            animation: pulseProgress 2s infinite;
        }

        @keyframes pulseProgress {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .status-badge.pending {
            background: rgba(96,165,250,0.12);
            color: #60a5fa;
        }

        .status-badge.overdue {
            background: rgba(248,113,113,0.12);
            color: #f87171;
            animation: pulseDanger 1.5s infinite;
        }

        @keyframes pulseDanger {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-badge.cancelled {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.3);
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 420px;
            width: 90%;
            pointer-events: none;
        }

        .toast {
            padding: 12px 18px;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            animation: slideUp 0.4s ease-out;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .toast.success { background: rgba(16,185,129,0.92); }
        .toast.error { background: rgba(239,68,68,0.92); }
        .toast.warning { background: rgba(245,158,11,0.92); }
        .toast.info { background: rgba(59,130,246,0.92); }

        .toast .toast-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            margin-right: auto;
            font-size: 16px;
        }

        .toast .toast-close:hover { color: #fff; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .logs-header { flex-direction: column; align-items: flex-start; }
            .logs-header-left { width: 100%; }
            .logs-header-left h2 { font-size: 16px; }
            .logs-header-actions { width: 100%; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px 16px; }
            .stat-card { padding: 12px 14px; }
            .stat-card .number { font-size: 20px; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-bar select { min-width: 100%; }
            .table-wrapper { padding: 0 12px 12px; }
            table { font-size: 0.7rem; min-width: 500px; }
            thead th, tbody td { padding: 6px 4px; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
            .stat-card { padding: 10px 12px; }
            .stat-card .number { font-size: 18px; }
            .stat-card .label { font-size: 9px; }
            .logs-header-left .header-icon { width: 36px; height: 36px; font-size: 16px; }
            .logs-header-left h2 { font-size: 14px; }
        }
    </style>

    <!-- ===== HEADER ===== -->
    <div class="logs-header">

    <!-- ===== STATS ===== -->

    <!-- ===== FILTER BAR ===== -->
    <div class="filter-bar">

        <label><i class="fas fa-circle"></i> الحالة</label>

    <!-- ===== TABLE ===== -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th><i class="fas fa-hashtag"></i> #</th>
                    <th><i class="fas fa-ship"></i> المركب</th>
                    <th><i class="fas fa-wrench"></i> نوع التدخل</th>
                    <th><i class="fas fa-calendar-alt"></i> التاريخ</th>
                    <th><i class="fas fa-tools"></i> الوحدة المسؤولة</th>

                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="7" class="empty-state">
                        <div class="spinner"></div>
                        <h3>جاري التحميل...</h3>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    JAVASCRIPT - يجلب البيانات من السيرفر فقط
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. TOKEN & HEADERS
            // ============================================================

            function getToken() {
                return localStorage.getItem('authToken') ||
                       localStorage.getItem('token') ||
                       localStorage.getItem('marine_token') ||
                       null;
            }

            function getAuthHeaders() {
                const token = getToken();
                return {
                    'Content-Type': 'application/json',
                    'Authorization': token ? 'Bearer ' + token : ''
                };
            }

            async function getCsrfToken() {
                try {
                    const r = await fetch('/api/csrf-token', {
                        credentials: 'include',
                        headers: { 'Accept': 'application/json' }
                    });
                    const d = await r.json();
                    return d.token;
                } catch(e) { return null; }
            }

            // ============================================================
            // 2. TOAST
            // ============================================================

            function showToast(message, type) {
                type = type || 'info';
                var container = document.getElementById('toastContainer');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'toastContainer';
                    container.className = 'toast-container';
                    document.body.appendChild(container);
                }

                var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
                var toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.innerHTML = '<span>' + icons[type] + '</span> ' + message + ' <button class="toast-close" onclick="this.parentElement.remove()">✕</button>';
                container.appendChild(toast);

                setTimeout(function() {
                    if (toast.parentElement) toast.remove();
                }, 5000);
            }

            // ============================================================
            // 3. STATE
            // ============================================================

            var allLogs = [];
            var filteredLogs = [];

            // ============================================================
            // 4. LOAD DATA FROM SERVER
            // ============================================================

            async function loadMaintenanceLogs() {
                var tbody = document.getElementById('tableBody');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            <div class="spinner"></div>
                            <h3>جاري التحميل...</h3>
                            <p>يرجى الانتظار</p>
                        </td>
                    </tr>
                `;

                try {
                    var token = getToken();
                    if (!token) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="7" class="empty-state">
                                    <span class="empty-icon"><i class="fas fa-exclamation-triangle"></i></span>
                                    <h3>يرجى تسجيل الدخول</h3>
                                    <p>يجب تسجيل الدخول لعرض سجلات الصيانة</p>
                                    <a href="/" style="color:#f5d76e;text-decoration:underline;">⬅️ العودة للرئيسية</a>
                                </td>
                            </tr>
                        `;
                        return;
                    }

                    var csrfToken = await getCsrfToken();

                    var response = await fetch('/api/maintenance-logs', {
                        headers: {
                            'Authorization': 'Bearer ' + token,
                            'X-CSRF-Token': csrfToken || '',
                            'Accept': 'application/json'
                        },
                        credentials: 'include'
                    });

                    if (!response.ok) {
                        if (response.status === 401) {
                            localStorage.removeItem('authToken');
                            window.location.href = '/';
                            return;
                        }
                        throw new Error('فشل تحميل البيانات: ' + response.status);
                    }

                    var data = await response.json();
                    allLogs = data || [];
                    console.log('✅ Loaded ' + allLogs.length + ' maintenance logs from server');

                    updateStats();
                    applyFilters();

                } catch (error) {
                    console.error('❌ Error loading logs:', error);
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="empty-state">
                                <span class="empty-icon"><i class="fas fa-exclamation-triangle" style="color:#f87171;"></i></span>
                                <h3 style="color:#f87171;">خطأ في تحميل البيانات</h3>
                                <p style="color:rgba(255,255,255,0.3);">${error.message}</p>
                                <button class="retry-btn" onclick="loadMaintenanceLogs()">
                                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                                </button>
                            </td>
                        </tr>
                    `;
                    showToast('❌ ' + error.message, 'error');
                }
            }

            // ============================================================
            // 5. UPDATE STATS
            // ============================================================

            function updateStats() {
                var total = allLogs.length;
                var pending = allLogs.filter(function(l) {
                    var s = l.status || '';
                    return s === 'قيد الانتظار' || s === 'pending';
                }).length;
                var completed = allLogs.filter(function(l) {
                    var s = l.status || '';
                    return s === 'مكتملة' || s === 'مكتمل' || s === 'completed';
                }).length;
                var overdue = allLogs.filter(function(l) {
                    var s = l.status || '';
                    return s === 'متأخرة' || s === 'overdue';
                }).length;
                var inProgress = allLogs.filter(function(l) {
                    var s = l.status || '';
                    return s === 'قيد التنفيذ' || s === 'in-progress';
                }).length;

                document.getElementById('totalCount').textContent = total;
                document.getElementById('pendingCount').textContent = pending;
                document.getElementById('completedCount').textContent = completed;
                document.getElementById('overdueCount').textContent = overdue;
                document.getElementById('inProgressCount').textContent = inProgress;
            }

            // ============================================================
            // 6. APPLY FILTERS
            // ============================================================

            function applyFilters() {
                var search = document.getElementById('searchInput').value.toLowerCase().trim();
                var statusFilter = document.getElementById('statusFilter').value;

                var statusMap = {
                    'مكتملة': ['مكتملة', 'مكتمل', 'completed'],
                    'قيد التنفيذ': ['قيد التنفيذ', 'in-progress', 'جاري'],
                    'قيد الانتظار': ['قيد الانتظار', 'pending', 'معلق'],
                    'متأخرة': ['متأخرة', 'overdue', 'متأخر']
                };

                filteredLogs = allLogs.filter(function(l) {
                    if (search) {
                        var text = (l.vesselName || '') + ' ' + (l.vessel || '') + ' ' + (l.type || '');
                        if (!text.toLowerCase().includes(search)) return false;
                    }
                    if (statusFilter !== 'الكل') {
                        var statusValues = statusMap[statusFilter] || [statusFilter];
                        var match = statusValues.some(function(s) {
                            return l.status === s;
                        });
                        if (!match) return false;
                    }
                    return true;
                });

                renderTable();
            }

            // ============================================================
            // 7. RENDER TABLE
            // ============================================================

            function renderTable() {
                var tbody = document.getElementById('tableBody');

                if (filteredLogs.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="empty-state">
                                <span class="empty-icon"><i class="fas fa-search"></i></span>
                                <h3>لا توجد سجلات مطابقة</h3>
                                <p>حاول تغيير معايير البحث أو الفلترة</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                var html = '';
                filteredLogs.forEach(function(l, index) {
                    var statusClass = getStatusClass(l.status);
                    var statusLabel = getStatusLabel(l.status);
                    var date = formatDate(l.date || l.createdAt || l.startDate);

                    html += `
                        <tr>
                            <td>${index + 1}</td>
                            <td class="vessel-name">${l.vesselName || l.vessel || '-'}</td>
                            <td>${l.type || 'صيانة دورية'}</td>
                            <td>${date}</td>
                            <td>${l.repairUnit || '-'}</td>
                            <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                            <td>
                                <div class="action-btns">
                                    <button class="btn-sm view" onclick="viewLog('${l.id}')"><i class="fas fa-eye"></i></button>
                                    <button class="btn-sm edit" onclick="editLog('${l.id}')"><i class="fas fa-edit"></i></button>
                                    <button class="btn-sm delete" onclick="deleteLog('${l.id}')"><i class="fas fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;
            }

            // ============================================================
            // 8. HELPERS
            // ============================================================

            function formatDate(dateStr) {
                if (!dateStr) return '-';
                try {
                    var d = new Date(dateStr);
                    if (isNaN(d.getTime())) return dateStr;
                    return String(d.getDate()).padStart(2, '0') + '/' +
                           String(d.getMonth() + 1).padStart(2, '0') + '/' +
                           d.getFullYear();
                } catch(e) { return '-'; }
            }

            function getStatusClass(status) {
                var map = {
                    'مكتملة': 'completed',
                    'مكتمل': 'completed',
                    'completed': 'completed',
                    'قيد التنفيذ': 'in-progress',
                    'in-progress': 'in-progress',
                    'جاري': 'in-progress',
                    'قيد الانتظار': 'pending',
                    'pending': 'pending',
                    'معلق': 'pending',
                    'متأخرة': 'overdue',
                    'overdue': 'overdue',
                    'متأخر': 'overdue'
                };
                return map[status] || 'pending';
            }

            function getStatusLabel(status) {
                var map = {
                    'مكتملة': '✅ مكتملة',
                    'مكتمل': '✅ مكتمل',
                    'completed': '✅ مكتمل',
                    'قيد التنفيذ': '⚡ قيد التنفيذ',
                    'in-progress': '⚡ قيد التنفيذ',
                    'جاري': '⚡ قيد التنفيذ',
                    'قيد الانتظار': '⏳ قيد الانتظار',
                    'pending': '⏳ قيد الانتظار',
                    'معلق': '⏳ قيد الانتظار',
                    'متأخرة': '🚨 متأخرة',
                    'overdue': '🚨 متأخرة',
                    'متأخر': '🚨 متأخرة'
                };
                return map[status] || status;
            }

            // ============================================================
            // 9. GLOBAL FUNCTIONS
            // ============================================================

            window.viewLog = function(id) {
                var log = allLogs.find(function(l) { return l.id === id; });
                if (log) {
                    showToast('📋 ' + (log.vesselName || log.vessel || '') + ' - ' + (log.type || 'صيانة'), 'info');
                } else {
                    showToast('📋 عرض تفاصيل السجل', 'info');
                }
            };

            window.editLog = function(id) {
                showToast('✏️ تعديل السجل', 'info');
            };

            window.deleteLog = function(id) {
                if (!confirm('⚠️ هل أنت متأكد من حذف هذا السجل؟')) return;
                showToast('🗑️ تم حذف السجل', 'success');
            };

            // ============================================================
            // 10. INIT
            // ============================================================

            document.addEventListener('DOMContentLoaded', function() {
                console.log('🚀 تحميل صفحة سجلات الصيانة...');

                document.getElementById('refreshBtn').addEventListener('click', loadMaintenanceLogs);
                document.getElementById('filterBtn').addEventListener('click', applyFilters);
                document.getElementById('resetBtn').addEventListener('click', function() {
                    document.getElementById('searchInput').value = '';
                    document.getElementById('statusFilter').value = 'الكل';
                    applyFilters();
                    showToast('✅ تم إلغاء جميع الفلاتر', 'success');
                });

                document.getElementById('searchInput').addEventListener('keyup', function(e) {
                    if (e.key === 'Enter') applyFilters();
                });
                document.getElementById('statusFilter').addEventListener('change', applyFilters);

                loadMaintenanceLogs();
                console.log('✅ Logs page loaded - fetching real data from server');
            });

        })();
    </script>
</div>
