<div id="page-logs">
    <style>
        body { background: #060911; margin: 0; padding: 0; }

        #page-logs {
            --c-bg-1: #060911;
            --c-bg-2: #0a1020;
            --c-surface-1: rgba(18, 26, 44, 0.75);
            --c-surface-2: rgba(24, 34, 56, 0.65);
            --c-border-soft: rgba(148, 163, 184, 0.08);
            --c-border-mid: rgba(148, 163, 184, 0.15);
            --c-border-strong: rgba(148, 163, 184, 0.25);

            --c-gold-1: #f7d774;
            --c-gold-2: #e6b31e;
            --c-gold-3: #b8860b;
            --c-gold-glow: rgba(230, 179, 30, 0.35);

            --c-emerald-1: #6ee7b7;
            --c-emerald-2: #10b981;
            --c-emerald-3: #047857;
            --c-emerald-glow: rgba(16, 185, 129, 0.35);

            --c-amber-1: #fcd34d;
            --c-amber-2: #f59e0b;
            --c-amber-3: #b45309;
            --c-amber-glow: rgba(245, 158, 11, 0.35);

            --c-red-1: #fca5a5;
            --c-red-2: #ef4444;
            --c-red-3: #b91c1c;
            --c-red-glow: rgba(239, 68, 68, 0.35);

            --c-blue-1: #93c5fd;
            --c-blue-2: #3b82f6;
            --c-blue-3: #1d4ed8;
            --c-blue-glow: rgba(59, 130, 246, 0.35);

            --c-text-1: #f1f5f9;
            --c-text-2: #cbd5e1;
            --c-text-3: #94a3b8;
            --c-text-4: #64748b;

            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 20px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Cairo', 'Segoe UI', system-ui, -apple-system, sans-serif;

            width: 100%;
            max-width: 100%;
            padding: 0;
            margin: 0;
            font-family: var(--font);
            color: var(--c-text-1);
            background:
                radial-gradient(ellipse 80% 50% at 20% 0%, rgba(59, 130, 246, 0.08), transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 10%, rgba(230, 179, 30, 0.06), transparent 50%),
                radial-gradient(ellipse 70% 50% at 50% 100%, rgba(16, 185, 129, 0.05), transparent 60%),
                linear-gradient(180deg, #060911 0%, #0a1020 50%, #060911 100%);
            min-height: 100vh;
            position: relative;
            z-index: 2;
            overflow-x: hidden;
        }

        #page-logs *,
        #page-logs *::before,
        #page-logs *::after { box-sizing: border-box; }

        #page-logs::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle 400px at 10% 20%, rgba(59, 130, 246, 0.06), transparent 70%),
                radial-gradient(circle 500px at 90% 60%, rgba(230, 179, 30, 0.05), transparent 70%),
                radial-gradient(circle 350px at 50% 90%, rgba(16, 185, 129, 0.05), transparent 70%);
            z-index: -1;
            pointer-events: none;
            animation: orbsFloat 20s ease-in-out infinite;
        }
        @keyframes orbsFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(3%,-2%) scale(1.05); }
            66% { transform: translate(-3%,2%) scale(0.97); }
        }

        /* SCROLLBAR */
        #page-logs ::-webkit-scrollbar { width: 8px; height: 8px; }
        #page-logs ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 4px; }
        #page-logs ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--c-gold-2), var(--c-gold-3));
            border-radius: 4px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 28px;
            flex-wrap: wrap;
            gap: 16px;
            background: linear-gradient(135deg,
                rgba(18, 26, 44, 0.85) 0%,
                rgba(24, 34, 56, 0.75) 100%);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid var(--c-border-mid);
            position: sticky;
            top: 64px;
            z-index: 10;
            width: 100%;
            box-shadow:
                0 1px 0 rgba(255,255,255,0.03) inset,
                0 8px 32px rgba(0,0,0,0.35);
        }

        .logs-header-left { display: flex; align-items: center; gap: 16px; }

        .logs-header-left .header-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--c-gold-2) 0%, var(--c-gold-3) 50%, #7c5c07 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #060911;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 8px 24px var(--c-gold-glow),
                0 0 0 1px rgba(255,255,255,0.08) inset,
                0 1px 0 rgba(255,255,255,0.15) inset;
            animation: iconFloat 4s ease-in-out infinite;
        }
        .logs-header-left .header-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 50%);
            pointer-events: none;
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(-2deg); }
        }
        .logs-header-left .header-icon img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 16px;
            display: none;
        }
        .logs-header-left .header-icon.has-logo img { display: block; }
        .logs-header-left .header-icon.has-logo {
            animation: none;
            background: transparent;
            box-shadow: 0 0 24px var(--c-gold-glow);
        }
        .logs-header-left .header-icon.has-logo i { display: none; }

        .logs-header-left h2 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--c-gold-1) 0%, var(--c-gold-2) 50%, var(--c-gold-1) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 0 4px 0;
            letter-spacing: -0.5px;
            text-shadow: 0 0 30px var(--c-gold-glow);
        }

        .logs-header-left p {
            font-size: 12px;
            color: var(--c-text-3);
            margin: 0;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .logs-header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 11px 22px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }
        .btn-action::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .btn-action.primary {
            background: linear-gradient(135deg, var(--c-gold-1) 0%, var(--c-gold-2) 50%, var(--c-gold-3) 100%);
            color: #060911;
            box-shadow:
                0 8px 24px var(--c-gold-glow),
                0 0 0 1px rgba(255,255,255,0.1) inset,
                0 1px 0 rgba(255,255,255,0.3) inset;
        }
        .btn-action.primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow:
                0 12px 32px var(--c-gold-glow),
                0 0 0 1px rgba(255,255,255,0.15) inset;
        }
        .btn-action.primary:active { transform: translateY(0) scale(0.98); }

        .btn-action.secondary {
            background: linear-gradient(135deg,
                rgba(148, 163, 184, 0.08) 0%,
                rgba(148, 163, 184, 0.04) 100%);
            border: 1px solid var(--c-border-mid);
            color: var(--c-text-2);
            backdrop-filter: blur(8px);
        }
        .btn-action.secondary:hover {
            background: linear-gradient(135deg,
                rgba(148, 163, 184, 0.15) 0%,
                rgba(148, 163, 184, 0.08) 100%);
            color: var(--c-text-1);
            transform: translateY(-2px);
            border-color: var(--c-border-strong);
        }

        /* ============================================================
           STATS
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            padding: 24px 28px;
            width: 100%;
        }

        .stat-card {
            background: linear-gradient(135deg,
                rgba(24, 34, 56, 0.7) 0%,
                rgba(18, 26, 44, 0.85) 100%);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid var(--c-border-soft);
            border-radius: var(--radius);
            padding: 20px 22px;
            text-align: center;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow:
                0 1px 0 rgba(255,255,255,0.05) inset,
                0 8px 24px rgba(0,0,0,0.25);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, currentColor 50%, transparent 100%);
            opacity: 0.7;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: -50%; right: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, currentColor 0%, transparent 40%);
            opacity: 0.04;
            pointer-events: none;
            transition: opacity var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--c-border-strong);
            box-shadow:
                0 1px 0 rgba(255,255,255,0.1) inset,
                0 16px 40px rgba(0,0,0,0.4),
                0 0 40px currentColor;
        }
        .stat-card:hover::after { opacity: 0.08; }

        .stat-card:nth-child(1) { color: var(--c-gold-2); }
        .stat-card:nth-child(2) { color: var(--c-emerald-2); }
        .stat-card:nth-child(3) { color: var(--c-blue-2); }
        .stat-card:nth-child(4) { color: var(--c-red-2); }
        .stat-card:nth-child(5) { color: var(--c-amber-2); }

        .stat-card .number {
            font-size: 30px;
            font-weight: 900;
            line-height: 1.1;
            color: currentColor;
            text-shadow: 0 0 30px currentColor;
            letter-spacing: -1px;
            position: relative;
            z-index: 1;
        }
        .stat-card .label {
            font-size: 11px;
            color: var(--c-text-3);
            margin-top: 6px;
            font-weight: 600;
            letter-spacing: 0.4px;
            position: relative;
            z-index: 1;
        }
        .stat-card .icon-bg {
            position: absolute;
            right: -10px; bottom: -10px;
            font-size: 50px;
            opacity: 0.04;
            pointer-events: none;
        }

        /* ============================================================
           FILTER BAR
           ============================================================ */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 16px;
            padding: 16px 28px;
            background: linear-gradient(135deg,
                rgba(18, 26, 44, 0.6) 0%,
                rgba(24, 34, 56, 0.5) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--c-border-soft);
            border-bottom: 1px solid var(--c-border-soft);
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2) inset;
        }

        .filter-bar .search-input {
            flex: 2 1 240px;
            min-width: 180px;
            position: relative;
        }
        .filter-bar .search-input input {
            width: 100%;
            padding: 11px 20px 11px 42px;
            border-radius: 10px;
            border: 1px solid var(--c-border-mid);
            background: linear-gradient(135deg,
                rgba(10, 16, 32, 0.8) 0%,
                rgba(18, 26, 44, 0.6) 100%);
            color: var(--c-text-1);
            font-size: 13px;
            transition: all var(--transition);
            font-family: var(--font);
            font-weight: 500;
        }
        .filter-bar .search-input input:focus {
            border-color: var(--c-gold-2);
            outline: none;
            box-shadow: 0 0 0 3px var(--c-gold-glow);
        }
        .filter-bar .search-input input::placeholder {
            color: var(--c-text-4);
        }
        .filter-bar .search-input .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--c-gold-2);
            font-size: 14px;
            pointer-events: none;
        }

        .filter-bar label {
            font-size: 11px;
            color: var(--c-text-3);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .filter-bar label i { color: var(--c-gold-2); }

        .filter-bar select {
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--c-border-mid);
            background: linear-gradient(135deg,
                rgba(10, 16, 32, 0.8) 0%,
                rgba(18, 26, 44, 0.6) 100%);
            color: var(--c-text-1);
            font-size: 13px;
            min-width: 150px;
            cursor: pointer;
            font-family: var(--font);
            font-weight: 600;
            transition: all var(--transition);
            appearance: none;
            background-image:
                linear-gradient(135deg, rgba(10, 16, 32, 0.8), rgba(18, 26, 44, 0.6)),
                url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e6b31e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center, left 12px center;
            background-size: auto, 16px;
            padding-left: 36px;
        }
        .filter-bar select:focus {
            outline: none;
            border-color: var(--c-gold-2);
            box-shadow: 0 0 0 3px var(--c-gold-glow);
        }
        .filter-bar select option {
            background: #0a1020;
            color: var(--c-text-1);
            padding: 8px;
        }

        .btn-filter {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }
        .btn-filter::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent 50%);
            pointer-events: none;
        }
        .btn-filter.primary {
            background: linear-gradient(135deg, var(--c-gold-1), var(--c-gold-2));
            color: #060911;
            box-shadow: 0 6px 20px var(--c-gold-glow);
        }
        .btn-filter.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px var(--c-gold-glow);
        }
        .btn-filter.outline {
            background: transparent;
            border: 1px solid var(--c-border-mid);
            color: var(--c-text-3);
        }
        .btn-filter.outline:hover {
            background: rgba(148, 163, 184, 0.06);
            color: var(--c-text-1);
            border-color: var(--c-border-strong);
        }

        /* ============================================================
           TABLE
           ============================================================ */
        .table-wrapper {
            overflow-x: auto;
            padding: 20px 28px 28px;
            width: 100%;
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
            min-width: 850px;
            background: linear-gradient(135deg,
                rgba(24, 34, 56, 0.55) 0%,
                rgba(18, 26, 44, 0.75) 100%);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid var(--c-border-soft);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow:
                0 1px 0 rgba(255,255,255,0.04) inset,
                0 12px 40px rgba(0,0,0,0.3);
        }

        thead {
            background: linear-gradient(135deg,
                rgba(15, 23, 42, 0.9) 0%,
                rgba(30, 41, 59, 0.7) 100%);
            position: relative;
        }
        thead::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--c-gold-2) 50%,
                transparent 100%);
            opacity: 0.5;
        }

        thead th {
            padding: 16px 14px;
            text-align: center;
            font-weight: 800;
            font-size: 10px;
            text-transform: uppercase;
            color: var(--c-text-3);
            letter-spacing: 1px;
            white-space: nowrap;
            position: relative;
        }
        thead th i {
            margin-left: 6px;
            color: var(--c-gold-2);
            font-size: 11px;
            filter: drop-shadow(0 0 6px var(--c-gold-glow));
        }

        tbody td {
            padding: 14px 14px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.05);
            vertical-align: middle;
            color: var(--c-text-2);
            font-size: 13px;
            text-align: center;
            font-weight: 500;
            transition: all var(--transition);
        }

        tbody tr {
            transition: all var(--transition);
            position: relative;
        }
        tbody tr:hover {
            background: rgba(148, 163, 184, 0.04);
        }
        tbody tr:last-child td { border-bottom: none; }

        tbody td.vessel-name {
            font-weight: 800 !important;
            color: var(--c-text-1) !important;
            font-size: 14px;
            letter-spacing: -0.2px;
            text-align: right;
            padding-right: 20px;
        }

        /* STATUS BADGES */
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            display: inline-block;
            white-space: nowrap;
            letter-spacing: 0.4px;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
        }
        .status-badge::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .status-badge.completed {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.1));
            color: var(--c-emerald-1);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
        }

        .status-badge.in-progress {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.1));
            color: var(--c-amber-1);
            border-color: rgba(245, 158, 11, 0.3);
            box-shadow: 0 4px 16px var(--c-amber-glow);
            animation: pulseProgress 2s ease-in-out infinite;
        }
        @keyframes pulseProgress {
            0%, 100% { box-shadow: 0 4px 16px var(--c-amber-glow); }
            50% { box-shadow: 0 4px 24px rgba(245, 158, 11, 0.6); }
        }

        .status-badge.pending {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.1));
            color: var(--c-blue-1);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .status-badge.overdue {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(239, 68, 68, 0.15));
            color: var(--c-red-1);
            border-color: rgba(239, 68, 68, 0.3);
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.25);
            animation: criticalPulse 2s ease-in-out infinite;
        }
        @keyframes criticalPulse {
            0%, 100% {
                box-shadow: 0 4px 16px rgba(239, 68, 68, 0.25);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 4px 24px rgba(239, 68, 68, 0.5);
                transform: scale(1.02);
            }
        }

        .status-badge.cancelled {
            background: linear-gradient(135deg, rgba(148, 163, 184, 0.15), rgba(148, 163, 184, 0.08));
            color: var(--c-text-4);
            border-color: rgba(148, 163, 184, 0.2);
        }

        /* ACTION BUTTONS */
        .action-btns {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-icon {
            padding: 8px 10px;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .btn-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent 50%);
            opacity: 0;
            transition: opacity var(--transition);
        }
        .btn-icon:hover::before { opacity: 1; }

        .btn-view {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(59, 130, 246, 0.08));
            color: var(--c-blue-1);
            border-color: rgba(59, 130, 246, 0.2);
        }
        .btn-view:hover {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(59, 130, 246, 0.15));
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
        }

        .btn-delete {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.08));
            color: var(--c-red-1);
            border-color: rgba(239, 68, 68, 0.2);
        }
        .btn-delete:hover {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(239, 68, 68, 0.15));
            transform: translateY(-2px) scale(1.05);

            _pageIntervals.forEach(function(id) {

            _pageIntervals = [];

            _pageTimeouts.forEach(function(id) {

            });
            _pageTimeouts = [];

            _eventListeners.forEach(function(item) {

                    if (item.el && item.fn) {
                        item.el.removeEventListener(item.type, item.fn);

                } catch (e) {}
            });

        // ============================================================
        // 🔐 RBAC
        // ============================================================
        var LEGACY_ROLE_MAP = {
            'super_admin': 'admin',
            'مسؤول': 'admin',
            'مدير': 'manager',
            'محرر': 'editor',
            'مشغل': 'maintenance_unit',
            'operator': 'maintenance_unit',
            'user': 'viewer',
            'مشاهد': 'viewer'
        };

        var ALLOWED_ROLES = ['admin', 'manager', 'editor', 'maintenance_unit', 'viewer'];

        function normalizeRole(role) {
            if (!role) return 'viewer';
            var r = String(role).trim();
            if (ALLOWED_ROLES.indexOf(r) !== -1) return r;
            return LEGACY_ROLE_MAP[r] || 'viewer';
        }

        function canDeleteLog() {
            if (window.capabilities && typeof window.capabilities.canDeleteMaintenance === 'boolean') {
                return window.capabilities.canDeleteMaintenance;
            }
            var u = window.currentUser;
            if (!u) return false;
            var r = normalizeRole(u.role);
            return ['admin', 'manager'].indexOf(r) !== -1;
        }

        // ============================================================
        // 🔧 HELPERS
        // ============================================================
        function $(id) { return document.getElementById(id); }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            var div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function addSafeListener(el, type, fn, options) {
            if (!el) return;
            el.addEventListener(type, fn, options);
            _eventListeners.push({ el: el, type: type, fn: fn });
        }

        // ============================================================
        // 🔑 TOKEN
        // ============================================================
        function getToken() {
            return (
                localStorage.getItem('marine_token') ||
                localStorage.getItem('authToken') ||
                localStorage.getItem('token') ||
                null
            );
        }

        function fetcher(url, options) {
            if (typeof window.apiFetch === 'function') {
                return window.apiFetch(url, options || {});
            }
            var token = getToken();
            var headers = Object.assign({
                'Accept': 'application/json'
            }, (options && options.headers) || {});
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return fetch(url, Object.assign({}, options || {}, {
                headers: headers,
                credentials: 'include'
            }));
        }

        // ============================================================
        // 🍞 TOAST
        // ============================================================
        function showToast(message, type) {
            type = type || 'info';
            if (_isDestroyed) return;

            var container = $('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }

            var icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };

            var toast = document.createElement('div');
            toast.className = 'toast ' + type;

            var icon = document.createElement('span');
            icon.textContent = icons[type] || icons.info;

            var text = document.createElement('span');
            text.textContent = String(message || '');
            text.style.flex = '1';

            var close = document.createElement('button');
            close.className = 'toast-close';
            close.textContent = '✕';
            close.addEventListener('click', function() { toast.remove(); });

            toast.appendChild(icon);
            toast.appendChild(text);
            toast.appendChild(close);
            container.appendChild(toast);

            var tid = window.setTimeout(function() {
                if (toast.parentNode) toast.remove();
            }, 5000);
            _pageTimeouts.push(tid);
        }

        // ============================================================
        // 📊 STATE
        // ============================================================
        var allLogs = [];
        var filteredLogs = [];

        function normalizeLog(log) {
            if (!log || typeof log !== 'object') return null;

            var vesselName =
                log.vesselName ||
                log.vessel ||
                log.vessel_num ||
                log.ship ||
                '—';

            var type =
                log.type ||
                log.intervention_type ||
                log.maintenance_type ||
                'صيانة دورية';

            var dateRaw = log.date || log.createdAt || log.startDate || null;
            var displayDate = '—';
            var isoDate = null;

            if (dateRaw) {
                try {
                    var d = new Date(dateRaw);
                    if (!isNaN(d.getTime())) {
                        displayDate = d.toLocaleDateString('ar-EG');
                        isoDate = d.toISOString();
                    } else {
                        displayDate = String(dateRaw);
                    }
                } catch (e) {
                    displayDate = String(dateRaw);
                }
            }

            var repairUnit =
                log.repairUnit ||
                log.unit ||
                log.workshop ||
                log.department ||
                '—';

            var status = log.status || 'قيد الانتظار';
            var id = log.id || log._id || null;

            return {
                id: id,
                vesselName: vesselName,
                vessel: vesselName,
                vesselNum: log.vesselNum || log.num || '',
                type: type,
                date: displayDate,
                isoDate: isoDate,
                createdAt: log.createdAt || null,
                repairUnit: repairUnit,
                unit: repairUnit,
                status: status,
                cost: Number(log.cost) || 0,
                notes: log.notes || '',
                vesselId: log.vesselId || '',
                _raw: log
            };
        }

        // ============================================================
        // 📥 LOAD LOGS
        // ============================================================
        async function loadMaintenanceLogs() {
            if (_isDestroyed) return;

            var tbody = $('tableBody');
            if (!tbody) return;

            tbody.innerHTML =
                '<tr>' +
                    '<td colspan="7" class="empty-state">' +
                        '<div class="spinner"></div>' +
                        '<h3>جاري التحميل...</h3>' +
                        '<p>يرجى الانتظار</p>' +
                    '</td>' +
                '</tr>';

            try {
                var token = getToken();
                if (!token) {
                    tbody.innerHTML =
                        '<tr>' +
                            '<td colspan="7" class="empty-state">' +
                                '<span class="empty-icon"><i class="fas fa-exclamation-triangle"></i></span>' +
                                '<h3>يرجى تسجيل الدخول</h3>' +
                                '<p>يجب تسجيل الدخول لعرض سجلات الصيانة</p>' +
                            '</td>' +
                        '</tr>';
                    return;
                }

                var response = await fetcher('/api/maintenance-logs', { method: 'GET' });

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('marine_token');
                        throw new Error('انتهت الجلسة — يرجى إعادة تسجيل الدخول');
                    }
                    if (response.status === 403) {
                        throw new Error('ليس لديك صلاحية لعرض السجلات');
                    }
                    throw new Error('فشل تحميل البيانات: ' + response.status);
                }

                var data = await response.json();

                var rawLogs = [];
                if (Array.isArray(data)) rawLogs = data;
                else if (data && Array.isArray(data.records)) rawLogs = data.records;
                else if (data && Array.isArray(data.logs)) rawLogs = data.logs;
                else if (data && Array.isArray(data.data)) rawLogs = data.data;

                allLogs = rawLogs.map(normalizeLog).filter(function(log) { return log !== null; });

                updateStats();
                applyFilters();

                showToast('✅ تم تحميل ' + allLogs.length + ' سجل', 'success');

            } catch (error) {
                if (_isDestroyed) return;
                console.error('❌ Error loading logs:', error);

                tbody.innerHTML =
                    '<tr>' +
                        '<td colspan="7" class="empty-state">' +
                            '<span class="empty-icon"><i class="fas fa-exclamation-triangle" style="color:#f87171;"></i></span>' +
                            '<h3 style="color:#f87171;">خطأ في تحميل البيانات</h3>' +
                            '<p style="color:rgba(255,255,255,0.3);">' + escapeHtml(error.message) + '</p>' +
                            '<button class="retry-btn" id="retryBtn">' +
                                '<i class="fas fa-sync-alt"></i> إعادة المحاولة' +
                            '</button>' +
                        '</td>' +
                    '</tr>';

                var retryBtn = $('retryBtn');
                if (retryBtn) {
                    addSafeListener(retryBtn, 'click', function() {
                        loadMaintenanceLogs();
                    });
                }

                showToast('❌ ' + error.message, 'error');
            }
        }

        // ============================================================
        // 📊 STATS
        // ============================================================
        function updateStats() {
            if (_isDestroyed) return;

            var total = allLogs.length;
            var pending = 0, completed = 0, overdue = 0, inProgress = 0;

            allLogs.forEach(function(l) {
                var s = l.status || '';
                if (s === 'قيد الانتظار' || s === 'pending' || s === 'معلق') pending++;
                else if (s === 'مكتملة' || s === 'مكتمل' || s === 'completed') completed++;
                else if (s === 'متأخرة' || s === 'متأخر' || s === 'overdue') overdue++;
                else if (s === 'قيد التنفيذ' || s === 'in-progress' || s === 'جاري') inProgress++;
            });

            var el;
            el = $('totalCount'); if (el) el.textContent = total;
            el = $('completedCount'); if (el) el.textContent = completed;
            el = $('pendingCount'); if (el) el.textContent = pending;
            el = $('overdueCount'); if (el) el.textContent = overdue;
            el = $('inProgressCount'); if (el) el.textContent = inProgress;
        }

        // ============================================================
        // 🔽 FILTERS
        // ============================================================
        function applyFilters() {
            if (_isDestroyed) return;

            var searchEl = $('searchInput');
            var statusEl = $('statusFilter');
            var search = searchEl ? searchEl.value.toLowerCase().trim() : '';
            var statusFilter = statusEl ? statusEl.value : 'الكل';

            var statusMap = {
                'مكتملة': ['مكتملة', 'مكتمل', 'completed'],
                'قيد التنفيذ': ['قيد التنفيذ', 'in-progress', 'جاري'],
                'قيد الانتظار': ['قيد الانتظار', 'pending', 'معلق'],
                'متأخرة': ['متأخرة', 'متأخر', 'overdue']
            };

            filteredLogs = allLogs.filter(function(l) {
                if (search) {
                    var text = [l.vesselName, l.type, l.repairUnit, l.status, l.notes]
                        .filter(Boolean).join(' ').toLowerCase();
                    if (text.indexOf(search) === -1) return false;
                }
                if (statusFilter !== 'الكل') {
                    var statusValues = statusMap[statusFilter] || [statusFilter];
                    var match = statusValues.some(function(s) { return l.status === s; });
                    if (!match) return false;
                }
                return true;
            });

            renderTable();
        }

        // ============================================================
        // 📋 RENDER TABLE
        // ============================================================
        function renderTable() {
            if (_isDestroyed) return;

            var tbody = $('tableBody');
            if (!tbody) return;

            if (filteredLogs.length === 0) {
                tbody.innerHTML =
                    '<tr>' +
                        '<td colspan="7" class="empty-state">' +
                            '<span class="empty-icon"><i class="fas fa-search"></i></span>' +
                            '<h3>لا توجد سجلات مطابقة</h3>' +
                            '<p>حاول تغيير معايير البحث أو الفلترة</p>' +
                        '</td>' +
                    '</tr>';
                return;
            }

            var canDel = canDeleteLog();
            var html = '';

            filteredLogs.forEach(function(l, index) {
                var statusClass = getStatusClass(l.status);
                var statusLabel = getStatusLabel(l.status);

                var delBtn = canDel ?
                    '<button type="button" class="btn-icon btn-delete delete-btn" data-id="' + escapeHtml(l.id || '') + '" title="حذف">' +
                        '<i class="fas fa-trash"></i>' +
                    '</button>' : '';

                html +=
                    '<tr>' +
                        '<td>' + (index + 1) + '</td>' +
                        '<td class="vessel-name">' + escapeHtml(l.vesselName) + '</td>' +
                        '<td>' + escapeHtml(l.type) + '</td>' +
                        '<td>' + escapeHtml(l.date) + '</td>' +
                        '<td>' + escapeHtml(l.repairUnit) + '</td>' +
                        '<td><span class="status-badge ' + statusClass + '">' + statusLabel + '</span></td>' +
                        '<td>' +
                            '<div class="action-btns">' +
                                '<button type="button" class="btn-icon btn-view view-btn" data-id="' + escapeHtml(l.id || '') + '" title="عرض">' +
                                    '<i class="fas fa-eye"></i>' +
                                '</button>' +
                                delBtn +
                            '</div>' +
                        '</td>' +
                    '</tr>';
            });

            tbody.innerHTML = html;

            tbody.querySelectorAll('.view-btn').forEach(function(btn) {
                addSafeListener(btn, 'click', function() {
                    openLogModal(this.dataset.id);
                });
            });

            tbody.querySelectorAll('.delete-btn').forEach(function(btn) {
                addSafeListener(btn, 'click', function() {
                    deleteLog(this.dataset.id);
                });
            });
        }

        function getStatusClass(status) {
            var map = {
                'مكتملة': 'completed', 'مكتمل': 'completed', 'completed': 'completed',
                'قيد التنفيذ': 'in-progress', 'in-progress': 'in-progress', 'جاري': 'in-progress',
                'قيد الانتظار': 'pending', 'pending': 'pending', 'معلق': 'pending',
                'متأخرة': 'overdue', 'متأخر': 'overdue', 'overdue': 'overdue',
                'ملغاة': 'cancelled', 'cancelled': 'cancelled'
            };
            return map[status] || 'pending';
        }

        function getStatusLabel(status) {
            var map = {
                'مكتملة': '✅ مكتملة', 'مكتمل': '✅ مكتمل', 'completed': '✅ مكتمل',
                'قيد التنفيذ': '⚡ قيد التنفيذ', 'in-progress': '⚡ قيد التنفيذ', 'جاري': '⚡ قيد التنفيذ',
                'قيد الانتظار': '⏳ قيد الانتظار', 'pending': '⏳ قيد الانتظار', 'معلق': '⏳ قيد الانتظار',
                'متأخرة': '🚨 متأخرة', 'متأخر': '🚨 متأخر', 'overdue': '🚨 متأخرة',
                'ملغاة': '⛔ ملغاة', 'cancelled': '⛔ ملغاة'
            };
            return map[status] || status;
        }

        // ============================================================
        // 🗑️ DELETE LOG
        // ============================================================
        function deleteLog(id) {
            if (_isDestroyed) return;

            if (!canDeleteLog()) {
                showToast('⚠️ ليس لديك صلاحية الحذف', 'error');
                return;
            }

            if (!confirm('⚠️ هل أنت متأكد من حذف هذا السجل؟')) return;

            fetcher('/api/maintenance-logs/' + id, { method: 'DELETE' })
                .then(function(response) {
                    if (!response.ok) {
                        return response.json().then(function(err) {
                            throw new Error(err.error || 'فشل الحذف');
                        });
                    }
                    return response.json();
                })
                .then(function() {
                    showToast('✅ تم حذف السجل', 'success');
                    loadMaintenanceLogs();
                })
                .catch(function(error) {
                    showToast('❌ ' + error.message, 'error');
                });
        }

        // ============================================================
        // 📤 EXPORT CSV
        // ============================================================
        function exportLogs() {
            if (_isDestroyed) return;

            try {
                var csv = 'المركب,النوع,التاريخ,الوحدة,الحالة,التكلفة,ملاحظات\n';

                filteredLogs.forEach(function(l) {
                    csv +=
                        '"' + (l.vesselName || '') + '",' +
                        '"' + (l.type || '') + '",' +
                        '"' + (l.date || '') + '",' +
                        '"' + (l.repairUnit || '') + '",' +
                        '"' + (l.status || '') + '",' +
                        (l.cost || 0) + ',' +
                        '"' + (l.notes || '').replace(/"/g, '""') + '"\n';
                });

                var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'maintenance-logs-' + Date.now() + '.csv';
                a.click();
                URL.revokeObjectURL(url);

                showToast('✅ تم تصدير ' + filteredLogs.length + ' سجل', 'success');
            } catch (e) {
                showToast('❌ فشل التصدير: ' + e.message, 'error');
            }
        }

        // ============================================================
        // ✅ INIT
        // ============================================================
        function init() {
            if (_isDestroyed || _initialized) return false;

            var headerEl = document.getElementById('logsHeader');
            if (!headerEl) return false;

            _initialized = true;
            console.log('🚀 Logs Ultra Pro — Initializing...');
            console.log('👤 Role:', window.currentUser ? normalizeRole(window.currentUser.role) : 'unknown');
            console.log('🔐 canDeleteLog:', canDeleteLog());

            // Logo
            applyLogo();
            syncLogoFromServer();
            updatePrintDate();

            // Events
            addSafeListener($('refreshBtn'), 'click', function() {
                if (_isDestroyed) return;
                showToast('🔄 جاري التحديث...', 'info');
                loadMaintenanceLogs();
            });

            addSafeListener($('exportBtn'), 'click', exportLogs);

            addSafeListener($('printBtn'), 'click', printLogs);

            addSafeListener($('filterBtn'), 'click', function() {
                applyFilters();
                showToast('✅ تم تطبيق الفلتر', 'success');
            });

            addSafeListener($('resetBtn'), 'click', function() {
                var s = $('searchInput'); if (s) s.value = '';
                var f = $('statusFilter'); if (f) f.value = 'الكل';
                applyFilters();
                showToast('✅ تم إلغاء الفلاتر', 'success');
            });

            addSafeListener($('searchInput'), 'keyup', function(e) {
                if (e.key === 'Enter') applyFilters();
            });

            addSafeListener($('statusFilter'), 'change', applyFilters);

            // Modal events
            addSafeListener($('modalClose'), 'click', closeLogModal);
            addSafeListener($('modalCancel'), 'click', closeLogModal);
            addSafeListener($('logModal'), 'click', function(e) {
                if (e.target === this) closeLogModal();
            });

            // Storage event for logo
            addSafeListener(window, 'storage', function(e) {
                if (e.key === 'marine_logo' && e.newValue) applyLogo();
            });

            addSafeListener(window, 'beforeprint', updatePrintDate);

            // Load data
            loadMaintenanceLogs();

            console.log('✅ Logs Ultra Pro ready');
            return true;

        // ============================================================
        // ✅ AUTO-INIT (SPA-safe)
        // ============================================================
        function tryInit() {
            if (_initialized || _isDestroyed) return;

        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', tryInit, { once: true });

        }

        // Retry every 300ms
        var retry = setInterval(function() {
            if (_initialized || _isDestroyed) {
                clearInterval(retry);

        setTimeout(function() { clearInterval(retry); }, 10000);

        if (typeof MutationObserver !== 'undefined' && document.body) {

            setTimeout(function() { observer.disconnect(); }, 10000);
        }

        // Expose globally
        window.loadMaintenanceLogs = loadMaintenanceLogs;
        window.applyFilters = applyFilters;
        window.renderTable = renderTable;
        window.viewLog = openLogModal;
        window.deleteLog = deleteLog;
        window.exportLogs = exportLogs;
        window.printLogs = printLogs;
        window.initLogsPage = init;
