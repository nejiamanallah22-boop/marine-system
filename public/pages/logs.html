<!-- public/pages/logs.html -->
<div id="page-logs">
    <style>
        #page-logs {
            width: 100%;
            max-width: 100%;
            padding: 0;
            margin: 0;
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: #0a0e1a;
            color: #e8edf5;
            min-height: 100vh;
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: sticky;
            top: 64px;
            z-index: 10;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logs-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logs-header-left .icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e6b31e, #f87171);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #0a1628;
        }

        .logs-header-left h2 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #f5d76e, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .logs-header-left p {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin: 0;
        }

        .logs-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cairo', sans-serif;
        }

        .btn-action.primary {
            background: linear-gradient(135deg, #e6b31e, #f5d76e);
            color: #0a1628;
        }

        .btn-action.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,179,30,0.3);
        }

        .btn-action.secondary {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
        }

        .btn-action.secondary:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
        }

        .btn-action.export {
            background: linear-gradient(135deg, #22c55e, #4ade80);
            color: #0a1628;
        }

        .btn-action.export:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(34,197,94,0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            padding: 16px 24px;
        }

        .stat-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #e6b31e, #f87171);
            opacity: 0.6;
        }

        .stat-card .number {
            font-size: 26px;
            font-weight: 800;
            color: #f5d76e;
            line-height: 1.2;
        }

        .stat-card .number.green { color: #4ade80; }
        .stat-card .number.red { color: #f87171; }
        .stat-card .number.blue { color: #60a5fa; }
        .stat-card .number.purple { color: #a78bfa; }

        .stat-card .label {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            padding: 10px 24px;
            background: rgba(255,255,255,0.04);
            border-top: 1px solid rgba(255,255,255,0.06);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .filter-bar .search-input {
            flex: 2 1 200px;
            min-width: 150px;
            position: relative;
        }

        .filter-bar .search-input input {
            width: 100%;
            padding: 8px 16px 8px 40px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.8rem;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        .filter-bar .search-input input:focus {
            border-color: #e6b31e;
            outline: none;
        }

        .filter-bar .search-input input::placeholder {
            color: rgba(255,255,255,0.15);
        }

        .filter-bar .search-input .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.1);
        }

        .filter-bar label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-bar select {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: #e2e8f0;
            font-size: 0.75rem;
            min-width: 100px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
        }

        .filter-bar select:focus {
            outline: none;
            border-color: #e6b31e;
        }

        .filter-bar select option {
            background: #0a1628;
            color: #e2e8f0;
        }

        .btn-filter {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-filter.primary {
            background: linear-gradient(135deg, #e6b31e, #f5d76e);
            color: #0a1628;
        }

        .btn-filter.primary:hover {
            transform: scale(1.04);
        }

        .btn-filter.outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.3);
        }

        .btn-filter.outline:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        .logs-section {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            overflow: hidden;
            margin: 16px 24px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.02);
            flex-wrap: wrap;
            gap: 8px;
        }

        .section-header h3 {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-header h3 i {
            color: #e6b31e;
        }

        .badge {
            font-size: 11px;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge.gold { background: rgba(230,179,30,0.12); color: #f5d76e; }
        .badge.green { background: rgba(34,197,94,0.12); color: #4ade80; }
        .badge.red { background: rgba(239,68,68,0.12); color: #f87171; }
        .badge.blue { background: rgba(96,165,250,0.12); color: #60a5fa; }

        .table-wrapper {
            overflow-x: auto;
            padding: 16px 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            min-width: 700px;
        }

        thead {
            background: rgba(230,179,30,0.08);
            border-bottom: 2px solid rgba(230,179,30,0.08);
        }

        thead th {
            padding: 10px 12px;
            text-align: center;
            font-weight: 700;
            font-size: 0.6rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        thead th i {
            margin-left: 4px;
            color: #e6b31e;
        }

        tbody td {
            padding: 9px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            vertical-align: middle;
            color: rgba(255,255,255,0.6);
            font-size: 0.78rem;
            text-align: center;
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }

        .vessel-name {
            font-weight: 600;
            color: #fff;
        }

        .status-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }

        .status-badge.completed { background: rgba(34,197,94,0.12); color: #4ade80; }
        .status-badge.in-progress { background: rgba(234,179,8,0.12); color: #fbbf24; animation: pulseProgress 2s infinite; }
        .status-badge.pending { background: rgba(96,165,250,0.12); color: #60a5fa; }
        .status-badge.overdue { background: rgba(239,68,68,0.2); color: #f87171; animation: pulseDanger 1.5s infinite; }

        @keyframes pulseProgress { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        @keyframes pulseDanger { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.15);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 12px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            z-index: 99999;
            animation: slideUp 0.4s ease-out;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 350px;
            direction: rtl;
        }

        .toast-success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.2); }
        .toast-info { background: rgba(96,165,250,0.15); border: 1px solid rgba(96,165,250,0.2); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .logs-header { flex-direction: column; align-items: flex-start; }
            .logs-header-left { width: 100%; }
            .logs-header-left h2 { font-size: 16px; }
            .logs-header-actions { width: 100%; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px 16px; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-bar select { min-width: 100%; }
            .logs-section { margin: 10px 12px; }
            .table-wrapper { padding: 10px 12px; }
            table { font-size: 0.7rem; min-width: 500px; }
            thead th, tbody td { padding: 6px 8px; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
            .stat-card { padding: 10px 12px; }
            .stat-card .number { font-size: 18px; }
            .stat-card .label { font-size: 9px; }
            .logs-header-left .icon { width: 36px; height: 36px; font-size: 16px; }
            .logs-header-left h2 { font-size: 14px; }
        }
    </style>

    <!-- HEADER -->
    <div class="logs-header">
        <div class="logs-header-left">
            <div class="icon"><i class="fas fa-history"></i></div>
            <div>
                <h2>سجلات الصيانة</h2>
                <p>سجل كامل لعمليات الصيانة والتدخلات الفنية</p>
            </div>
        </div>
        <div class="logs-header-actions">
            <button class="btn-action primary" id="refreshBtn"><i class="fas fa-sync-alt"></i> تحديث</button>
            <button class="btn-action export" id="exportBtn"><i class="fas fa-file-excel"></i> تصدير</button>
            <button class="btn-action secondary" onclick="window.print()"><i class="fas fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- STATS -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="number" id="totalLogs">0</div><div class="label">📋 إجمالي السجلات</div></div>
        <div class="stat-card"><div class="number green" id="completedLogs">0</div><div class="label">✅ مكتملة</div></div>
        <div class="stat-card"><div class="number blue" id="pendingLogs">0</div><div class="label">⏳ قيد الانتظار</div></div>
        <div class="stat-card"><div class="number red" id="overdueLogs">0</div><div class="label">🚨 متأخرة</div></div>
        <div class="stat-card"><div class="number purple" id="inProgressLogs">0</div><div class="label">⚡ قيد التنفيذ</div></div>
    </div>

    <!-- FILTER -->
    <div class="filter-bar">
        <div class="search-input">
            <input type="text" id="searchLog" placeholder="بحث في السجلات...">
            <span class="search-icon"><i class="fas fa-search"></i></span>
        </div>

        <label><i class="fas fa-circle"></i> الحالة</label>
        <select id="fStatusLog">
            <option value="الكل">📊 جميع الحالات</option>
            <option value="مكتملة">✅ مكتملة</option>
            <option value="قيد التنفيذ">⚡ قيد التنفيذ</option>
            <option value="قيد الانتظار">⏳ قيد الانتظار</option>
            <option value="متأخرة">🚨 متأخرة</option>
        </select>

        <button class="btn-filter primary" id="filterBtn"><i class="fas fa-filter"></i> فلترة</button>
        <button class="btn-filter outline" id="resetBtn"><i class="fas fa-undo-alt"></i> إلغاء</button>
    </div>

    <!-- TABLE -->
    <div class="logs-section">
        <div class="section-header">
            <h3><i class="fas fa-list-ul"></i> سجل عمليات الصيانة</h3>
            <span class="badge gold" id="logsBadge">📊 جاري التحميل...</span>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="text-align:right;"><i class="fas fa-hashtag"></i> #</th>
                        <th style="text-align:right;"><i class="fas fa-ship"></i> المركب</th>
                        <th><i class="fas fa-wrench"></i> نوع التدخل</th>
                        <th><i class="fas fa-calendar-alt"></i> التاريخ</th>
                        <th><i class="fas fa-tools"></i> الوحدة</th>
                        <th><i class="fas fa-circle"></i> الحالة</th>
                    </tr>
                </thead>
                <tbody id="logsBody">
                    <tr>
                        <td colspan="6" class="empty-state">
                            <span class="empty-icon"><i class="fas fa-spinner fa-pulse"></i></span>
                            جاري التحميل...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ============================================================
    JAVASCRIPT - يجلب البيانات من السيرفر
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            console.log('📋 Logs Page - loading...');

            // ============================================================
            // TOKEN
            // ============================================================

            function getToken() {
                return localStorage.getItem('authToken') ||
                       localStorage.getItem('token') ||
                       localStorage.getItem('marine_token') ||
                       null;
            }

            function getAuthHeaders() {
                const token = getToken();
                return {
                    'Content-Type': 'application/json',
                    'Authorization': token ? 'Bearer ' + token : ''
                };
            }

            // ============================================================
            // TOAST
            // ============================================================

            function showToast(msg, type) {
                type = type || 'info';
                var old = document.querySelector('.toast');
                if (old) old.remove();
                var n = document.createElement('div');
                n.className = 'toast toast-' + (type || 'info');
                n.textContent = msg;
                document.body.appendChild(n);
                setTimeout(function() {
                    n.style.opacity = '0';
                    n.style.transform = 'translateY(20px)';
                    n.style.transition = 'all 0.4s';
                    setTimeout(function() { n.remove(); }, 400);
                }, 2500);
            }

            // ============================================================
            // HELPERS
            // ============================================================

            function formatDate(dateStr) {
                if (!dateStr) return '-';
                try {
                    var d = new Date(dateStr);
                    if (isNaN(d.getTime())) return dateStr;
                    return String(d.getDate()).padStart(2, '0') + '/' +
                           String(d.getMonth() + 1).padStart(2, '0') + '/' +
                           d.getFullYear();
                } catch(e) { return '-'; }
            }

            function getStatusClass(status) {
                var map = {
                    'مكتملة': 'completed',
                    'مكتمل': 'completed',
                    'completed': 'completed',
                    'قيد التنفيذ': 'in-progress',
                    'in-progress': 'in-progress',
                    'قيد الانتظار': 'pending',
                    'pending': 'pending',
                    'متأخرة': 'overdue',
                    'overdue': 'overdue'
                };
                return map[status] || 'pending';
            }

            function getStatusLabel(status) {
                var map = {
                    'مكتملة': '✅ مكتملة',
                    'مكتمل': '✅ مكتمل',
                    'completed': '✅ مكتمل',
                    'قيد التنفيذ': '⚡ قيد التنفيذ',
                    'in-progress': '⚡ قيد التنفيذ',
                    'قيد الانتظار': '⏳ قيد الانتظار',
                    'pending': '⏳ قيد الانتظار',
                    'متأخرة': '🚨 متأخرة',
                    'overdue': '🚨 متأخرة'
                };
                return map[status] || status;
            }

            // ============================================================
            // LOAD DATA
            // ============================================================

            var allLogs = [];
            var filteredLogs = [];

            async function loadLogs() {
                var tbody = document.getElementById('logsBody');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <span class="empty-icon"><i class="fas fa-spinner fa-pulse"></i></span>
                            جاري التحميل...
                        </td>
                    </tr>
                `;

                try {
                    var token = getToken();
                    if (!token) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="6" class="empty-state">
                                    <span class="empty-icon"><i class="fas fa-exclamation-triangle"></i></span>
                                    يرجى تسجيل الدخول
                                    <br>
                                    <a href="/" style="color:#f5d76e;">⬅️ العودة للرئيسية</a>
                                </td>
                            </tr>
                        `;
                        return;
                    }

                    console.log('📡 Fetching maintenance logs...');

                    var response = await fetch('/api/maintenance-logs', {
                        headers: getAuthHeaders(),
                        credentials: 'include'
                    });

                    if (!response.ok) {
                        if (response.status === 401) {
                            localStorage.removeItem('authToken');
                            window.location.href = '/';
                            return;
                        }
                        throw new Error('فشل تحميل البيانات: ' + response.status);
                    }

                    allLogs = await response.json();
                    console.log('✅ Loaded ' + allLogs.length + ' logs');

                    updateStats();
                    applyFilters();

                } catch (error) {
                    console.error('❌ Error:', error);
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6" class="empty-state">
                                <span class="empty-icon"><i class="fas fa-exclamation-triangle" style="color:#f87171;"></i></span>
                                <span style="color:#f87171;">${error.message}</span>
                                <br>
                                <button onclick="loadLogs()" style="margin-top:12px;padding:8px 24px;background:linear-gradient(135deg,#e6b31e,#f5d76e);color:#0a1628;border:none;border-radius:30px;cursor:pointer;font-family:'Cairo',sans-serif;">
                                    <i class="fas fa-sync-alt"></i> إعادة المحاولة
                                </button>
                            </td>
                        </tr>
                    `;
                    showToast('❌ ' + error.message, 'error');
                }
            }

            // ============================================================
            // STATS
            // ============================================================

            function updateStats() {
                var total = allLogs.length;
                var completed = allLogs.filter(function(l) {
                    var s = l.status || '';
                    return s === 'مكتملة' || s === 'مكتمل' || s === 'completed';
                }).length;
                var pending = allLogs.filter(function(l) {
                    var s = l.status || '';
                    return s === 'قيد الانتظار' || s === 'pending';
                }).length;
                var overdue = allLogs.filter(function(l) {
                    var s = l.status || '';
                    return s === 'متأخرة' || s === 'overdue';
                }).length;
                var inProgress = allLogs.filter(function(l) {
                    var s = l.status || '';
                    return s === 'قيد التنفيذ' || s === 'in-progress';
                }).length;

                document.getElementById('totalLogs').textContent = total;
                document.getElementById('completedLogs').textContent = completed;
                document.getElementById('pendingLogs').textContent = pending;
                document.getElementById('overdueLogs').textContent = overdue;
                document.getElementById('inProgressLogs').textContent = inProgress;

                var badge = document.getElementById('logsBadge');
                if (badge) {
                    if (overdue > 0) {
                        badge.textContent = '🚨 ' + overdue + ' متأخر';
                        badge.className = 'badge red';
                    } else if (pending > 0) {
                        badge.textContent = '⏳ ' + pending + ' قيد الانتظار';
                        badge.className = 'badge blue';
                    } else {
                        badge.textContent = '✅ ' + completed + ' مكتمل';
                        badge.className = 'badge green';
                    }
                }
            }

            // ============================================================
            // FILTERS
            // ============================================================

            function applyFilters() {
                var search = document.getElementById('searchLog').value.toLowerCase().trim();
                var statusFilter = document.getElementById('fStatusLog').value;

                var statusMap = {
                    'مكتملة': ['مكتملة', 'مكتمل', 'completed'],
                    'قيد التنفيذ': ['قيد التنفيذ', 'in-progress'],
                    'قيد الانتظار': ['قيد الانتظار', 'pending'],
                    'متأخرة': ['متأخرة', 'overdue']
                };

                filteredLogs = allLogs.filter(function(l) {
                    if (search) {
                        var text = (l.vesselName || '') + ' ' + (l.vessel || '') + ' ' + (l.type || '');
                        if (!text.toLowerCase().includes(search)) return false;
                    }
                    if (statusFilter !== 'الكل') {
                        var values = statusMap[statusFilter] || [statusFilter];
                        if (!values.some(function(s) { return l.status === s; })) return false;
                    }
                    return true;
                });

                renderTable();
            }

            // ============================================================
            // RENDER
            // ============================================================

            function renderTable() {
                var tbody = document.getElementById('logsBody');

                if (filteredLogs.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6" class="empty-state">
                                <span class="empty-icon"><i class="fas fa-search"></i></span>
                                لا توجد سجلات مطابقة
                            </td>
                        </tr>
                    `;
                    return;
                }

                var html = '';
                filteredLogs.forEach(function(l, index) {
                    var statusClass = getStatusClass(l.status);
                    var statusLabel = getStatusLabel(l.status);
                    var date = formatDate(l.date || l.createdAt);

                    html += `
                        <tr>
                            <td>${index + 1}</td>
                            <td class="vessel-name">${l.vesselName || l.vessel || '-'}</td>
                            <td>${l.type || 'صيانة دورية'}</td>
                            <td>${date}</td>
                            <td>${l.repairUnit || '-'}</td>
                            <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;
            }

            // ============================================================
            // ACTIONS
            // ============================================================

            function refreshLogs() {
                var btn = document.getElementById('refreshBtn');
                var original = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';
                btn.disabled = true;

                loadLogs().then(function() {
                    btn.innerHTML = original;
                    btn.disabled = false;
                    showToast('✅ تم تحديث السجلات', 'success');
                }).catch(function() {
                    btn.innerHTML = original;
                    btn.disabled = false;
                });
            }

            function exportLogs() {
                showToast('📊 جاري تصدير البيانات...', 'info');
                setTimeout(function() {
                    showToast('✅ تم التصدير', 'success');
                }, 1500);
            }

            function resetFilters() {
                document.getElementById('searchLog').value = '';
                document.getElementById('fStatusLog').value = 'الكل';
                applyFilters();
                showToast('✅ تم إلغاء الفلاتر', 'success');
            }

            // ============================================================
            // INIT
            // ============================================================

            document.addEventListener('DOMContentLoaded', function() {
                console.log('🚀 Initializing Logs page...');

                document.getElementById('refreshBtn').addEventListener('click', refreshLogs);
                document.getElementById('exportBtn').addEventListener('click', exportLogs);
                document.getElementById('filterBtn').addEventListener('click', applyFilters);
                document.getElementById('resetBtn').addEventListener('click', resetFilters);
                document.getElementById('searchLog').addEventListener('keyup', function(e) {
                    if (e.key === 'Enter') applyFilters();
                });
                document.getElementById('fStatusLog').addEventListener('change', applyFilters);

                loadLogs();
                console.log('✅ Logs page loaded');
            });

        })();
    </script>
</div>
