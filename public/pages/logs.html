    <script>
    (function() {
        'use strict';

        console.log('📋 Logs Page v9.12 - loading...');

        // ============================================================
        // ✅ CLEANUP STATE
        // ============================================================
        var _isDestroyed = false;
        var _pageIntervals = [];
        var _pageTimeouts = [];
        var _eventListeners = [];

        function _logsCleanup() {
            if (_isDestroyed) return;
            _isDestroyed = true;

            _pageIntervals.forEach(function(id) {
                try { clearInterval(id); } catch (e) {}
            });
            _pageIntervals = [];

            _pageTimeouts.forEach(function(id) {
                try { clearTimeout(id); } catch (e) {}
            });
            _pageTimeouts = [];

            _eventListeners.forEach(function(item) {
                try {
                    if (item.el && item.fn) {
                        item.el.removeEventListener(item.type, item.fn);
                    }
                } catch (e) {}
            });
            _eventListeners = [];

            try {
                delete window.loadMaintenanceLogs;
                delete window.applyFilters;
                delete window.renderTable;
                delete window.viewLog;
                delete window.deleteLog;
                delete window.exportLogs;
            } catch (e) {}

            console.log('🧹 Logs v9.12 cleanup done');
        }

        window._pageCleanup = window._pageCleanup || [];
        window._pageCleanup.push(_logsCleanup);

        window.addEventListener('beforeunload', _logsCleanup);
        window.addEventListener('pagehide', _logsCleanup);

        // ============================================================
        // 🔐 RBAC v9.12 — توحيد الأدوار
        // ============================================================
        var LEGACY_ROLE_MAP = {
            'super_admin': 'admin',
            'مسؤول': 'admin',
            'مدير': 'manager',
            'محرر': 'editor',
            'مشغل': 'maintenance_unit',
            'operator': 'maintenance_unit',
            'user': 'viewer',
            'مشاهد': 'viewer'
        };

        var ALLOWED_ROLES = ['admin', 'manager', 'editor', 'maintenance_unit', 'viewer'];

        function normalizeRole(role) {
            if (!role) return 'viewer';
            var r = String(role).trim();
            if (ALLOWED_ROLES.indexOf(r) !== -1) return r;
            return LEGACY_ROLE_MAP[r] || 'viewer';
        }

        // ✅ يمكن الحذف: admin + manager فقط
        function canDeleteLog() {
            if (window.capabilities && typeof window.capabilities.canDeleteMaintenance === 'boolean') {
                return window.capabilities.canDeleteMaintenance;
            }
            var u = window.currentUser;
            if (!u) return false;
            var r = normalizeRole(u.role);
            return ['admin', 'manager'].indexOf(r) !== -1;
        }

        // ============================================================
        // 🔧 HELPERS
        // ============================================================
        function $(id) {
            return document.getElementById(id);
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            var div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function addSafeListener(el, type, fn, options) {
            if (!el) return;
            el.addEventListener(type, fn, options);
            _eventListeners.push({ el: el, type: type, fn: fn });
        }

        // ============================================================
        // 🔑 TOKEN + AUTH
        // ============================================================
        function getToken() {
            return (
                localStorage.getItem('marine_token') ||
                localStorage.getItem('authToken') ||
                localStorage.getItem('token') ||
                null
            );
        }

        // ✅ v9.12: يستخدم apiFetch إن وُجد (تجديد تلقائي + CSRF من الخادم)
        function fetcher(url, options) {
            if (typeof window.apiFetch === 'function') {
                return window.apiFetch(url, options || {});
            }
            // fallback
            var token = getToken();
            var headers = Object.assign({
                'Accept': 'application/json'
            }, (options && options.headers) || {});
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return fetch(url, Object.assign({}, options || {}, {
                headers: headers,
                credentials: 'include'
            }));
        }

        // ============================================================
        // 🍞 TOAST
        // ============================================================
        function showToast(message, type) {
            type = type || 'info';
            if (_isDestroyed) return;

            var container = $('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }

            var icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };

            var toast = document.createElement('div');
            toast.className = 'toast ' + type;

            var icon = document.createElement('span');
            icon.textContent = icons[type] || icons.info;

            var text = document.createElement('span');
            text.textContent = String(message || '');

            var close = document.createElement('button');
            close.className = 'toast-close';
            close.textContent = '✕';
            close.addEventListener('click', function() {
                toast.remove();
            });

            toast.appendChild(icon);
            toast.appendChild(text);
            toast.appendChild(close);
            container.appendChild(toast);

            var tid = window.setTimeout(function() {
                if (toast.parentNode) toast.remove();
            }, 5000);
            _pageTimeouts.push(tid);
        }

        // ============================================================
        // 📊 STATE
        // ============================================================
        var allLogs = [];
        var filteredLogs = [];

        // ============================================================
        // ✅ normalizeLog — يقبل كل الأسماء
        // ============================================================
        function normalizeLog(log) {
            if (!log || typeof log !== 'object') return null;

            var vesselName =
                log.vesselName ||
                log.vessel ||
                log.vessel_num ||
                log.ship ||
                '—';

            var type =
                log.type ||
                log.intervention_type ||
                log.maintenance_type ||
                'صيانة دورية';

            var dateRaw = log.date || log.createdAt || log.startDate || null;
            var displayDate = '—';
            var isoDate = null;

            if (dateRaw) {
                try {
                    var d = new Date(dateRaw);
                    if (!isNaN(d.getTime())) {
                        displayDate = d.toLocaleDateString('ar-EG');
                        isoDate = d.toISOString();
                    } else {
                        displayDate = String(dateRaw);
                    }
                } catch (e) {
                    displayDate = String(dateRaw);
                }
            }

            var repairUnit =
                log.repairUnit ||
                log.unit ||
                log.workshop ||
                log.department ||
                '—';

            var status = log.status || 'قيد الانتظار';

            var id = log.id || log._id || null;

            return {
                id: id,
                vesselName: vesselName,
                vessel: vesselName,
                vesselNum: log.vesselNum || log.num || '',
                type: type,
                date: displayDate,
                isoDate: isoDate,
                createdAt: log.createdAt || null,
                repairUnit: repairUnit,
                unit: repairUnit,
                status: status,
                cost: Number(log.cost) || 0,
                notes: log.notes || '',
                vesselId: log.vesselId || '',
                _raw: log
            };
        }

        // ============================================================
        // 📊 LOAD LOGS — v9.12
        // ============================================================
        async function loadMaintenanceLogs() {
            if (_isDestroyed) return;

            var tbody = $('tableBody');
            if (!tbody) return;

            tbody.innerHTML =
                '<tr>' +
                    '<td colspan="7" class="empty-state">' +
                        '<div class="spinner"></div>' +
                        '<h3>جاري التحميل...</h3>' +
                        '<p>يرجى الانتظار</p>' +
                    '</td>' +
                '</tr>';

            try {
                var token = getToken();

                if (!token) {
                    tbody.innerHTML =
                        '<tr>' +
                            '<td colspan="7" class="empty-state">' +
                                '<span class="empty-icon"><i class="fas fa-exclamation-triangle"></i></span>' +
                                '<h3>يرجى تسجيل الدخول</h3>' +
                                '<p>يجب تسجيل الدخول لعرض سجلات الصيانة</p>' +
                            '</td>' +
                        '</tr>';
                    return;
                }

                // ✅ v9.12: عبر fetcher (apiFetch يوفر CSRF والتجديد التلقائي)
                var response = await fetcher('/api/maintenance-logs', { method: 'GET' });

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('marine_token');
                        throw new Error('انتهت الجلسة — يرجى إعادة تسجيل الدخول');
                    }
                    if (response.status === 403) {
                        throw new Error('ليس لديك صلاحية لعرض السجلات');
                    }
                    throw new Error('فشل تحميل البيانات: ' + response.status);
                }

                var data = await response.json();

                console.log('📦 Maintenance logs response:', data);

                var rawLogs = [];

                if (Array.isArray(data)) {
                    rawLogs = data;
                } else if (data && Array.isArray(data.records)) {
                    rawLogs = data.records;
                } else if (data && Array.isArray(data.logs)) {
                    rawLogs = data.logs;
                } else if (data && Array.isArray(data.data)) {
                    rawLogs = data.data;
                }

                console.log('✅ Extracted', rawLogs.length, 'raw logs');

                allLogs = rawLogs
                    .map(normalizeLog)
                    .filter(function(log) { return log !== null; });

                console.log('✅ Normalized', allLogs.length, 'logs');
                if (allLogs[0]) console.log('📋 Sample log:', allLogs[0]);

                updateStats();
                applyFilters();

                showToast('✅ تم تحميل ' + allLogs.length + ' سجل', 'success');

            } catch (error) {
                if (_isDestroyed) return;

                console.error('❌ Error loading logs:', error);

                tbody.innerHTML =
                    '<tr>' +
                        '<td colspan="7" class="empty-state">' +
                            '<span class="empty-icon"><i class="fas fa-exclamation-triangle" style="color:#f87171;"></i></span>' +
                            '<h3 style="color:#f87171;">خطأ في تحميل البيانات</h3>' +
                            '<p style="color:rgba(255,255,255,0.3);">' + escapeHtml(error.message) + '</p>' +
                            '<button class="retry-btn" onclick="window.loadMaintenanceLogs()">' +
                                '<i class="fas fa-sync-alt"></i> إعادة المحاولة' +
                            '</button>' +
                        '</td>' +
                    '</tr>';

                showToast('❌ ' + error.message, 'error');
            }
        }

        // ============================================================
        // 📊 UPDATE STATS
        // ============================================================
        function updateStats() {
            if (_isDestroyed) return;

            var total = allLogs.length;

            var pending = allLogs.filter(function(l) {
                var s = l.status || '';
                return s === 'قيد الانتظار' || s === 'pending' || s === 'معلق';
            }).length;

            var completed = allLogs.filter(function(l) {
                var s = l.status || '';
                return s === 'مكتملة' || s === 'مكتمل' || s === 'completed';
            }).length;

            var overdue = allLogs.filter(function(l) {
                var s = l.status || '';
                return s === 'متأخرة' || s === 'متأخر' || s === 'overdue';
            }).length;

            var inProgress = allLogs.filter(function(l) {
                var s = l.status || '';
                return s === 'قيد التنفيذ' || s === 'in-progress' || s === 'جاري';
            }).length;

            var el;
            el = $('totalCount'); if (el) el.textContent = total;
            el = $('pendingCount'); if (el) el.textContent = pending;
            el = $('completedCount'); if (el) el.textContent = completed;
            el = $('overdueCount'); if (el) el.textContent = overdue;
            el = $('inProgressCount'); if (el) el.textContent = inProgress;
        }

        // ============================================================
        // 🔍 APPLY FILTERS
        // ============================================================
        function applyFilters() {
            if (_isDestroyed) return;

            var searchEl = $('searchInput');
            var statusEl = $('statusFilter');

            var search = searchEl ? searchEl.value.toLowerCase().trim() : '';
            var statusFilter = statusEl ? statusEl.value : 'الكل';

            var statusMap = {
                'مكتملة': ['مكتملة', 'مكتمل', 'completed'],
                'قيد التنفيذ': ['قيد التنفيذ', 'in-progress', 'جاري'],
                'قيد الانتظار': ['قيد الانتظار', 'pending', 'معلق'],
                'متأخرة': ['متأخرة', 'متأخر', 'overdue']
            };

            filteredLogs = allLogs.filter(function(l) {
                if (search) {
                    var text = [
                        l.vesselName,
                        l.type,
                        l.repairUnit,
                        l.status,
                        l.notes
                    ].filter(Boolean).join(' ').toLowerCase();

                    if (text.indexOf(search) === -1) return false;
                }

                if (statusFilter !== 'الكل') {
                    var statusValues = statusMap[statusFilter] || [statusFilter];
                    var match = statusValues.some(function(s) {
                        return l.status === s;
                    });
                    if (!match) return false;
                }

                return true;
            });

            renderTable();
        }

        // ============================================================
        // 🎨 RENDER TABLE
        // ============================================================
        function renderTable() {
            if (_isDestroyed) return;

            var tbody = $('tableBody');
            if (!tbody) return;

            if (filteredLogs.length === 0) {
                tbody.innerHTML =
                    '<tr>' +
                        '<td colspan="7" class="empty-state">' +
                            '<span class="empty-icon"><i class="fas fa-search"></i></span>' +
                            '<h3>لا توجد سجلات مطابقة</h3>' +
                            '<p>حاول تغيير معايير البحث أو الفلترة</p>' +
                        '</td>' +
                    '</tr>';
                return;
            }

            var canDel = canDeleteLog();
            var html = '';

            filteredLogs.forEach(function(l, index) {
                var statusClass = getStatusClass(l.status);
                var statusLabel = getStatusLabel(l.status);

                var delBtn = canDel ?
                    '<button type="button" class="btn-icon btn-delete delete-btn" data-id="' + escapeHtml(l.id || '') + '" title="حذف">' +
                        '<i class="fas fa-trash"></i>' +
                    '</button>' : '';

                html +=
                    '<tr>' +
                        '<td>' + (index + 1) + '</td>' +
                        '<td class="vessel-name">' + escapeHtml(l.vesselName) + '</td>' +
                        '<td>' + escapeHtml(l.type) + '</td>' +
                        '<td>' + escapeHtml(l.date) + '</td>' +
                        '<td>' + escapeHtml(l.repairUnit) + '</td>' +
                        '<td><span class="status-badge ' + statusClass + '">' + statusLabel + '</span></td>' +
                        '<td>' +
                            '<div class="action-btns">' +
                                '<button type="button" class="btn-icon btn-view view-btn" data-id="' + escapeHtml(l.id || '') + '" title="عرض">' +
                                    '<i class="fas fa-eye"></i>' +
                                '</button>' +
                                delBtn +
                            '</div>' +
                        '</td>' +
                    '</tr>';
            });

            tbody.innerHTML = html;

            tbody.querySelectorAll('.view-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    window.viewLog(this.dataset.id);
                });
            });

            tbody.querySelectorAll('.delete-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    window.deleteLog(this.dataset.id);
                });
            });

            console.log('✅ Rendered', filteredLogs.length, 'logs');
        }

        // ============================================================
        // 🔧 STATUS HELPERS
        // ============================================================
        function getStatusClass(status) {
            var map = {
                'مكتملة': 'completed',
                'مكتمل': 'completed',
                'completed': 'completed',
                'قيد التنفيذ': 'in-progress',
                'in-progress': 'in-progress',
                'جاري': 'in-progress',
                'قيد الانتظار': 'pending',
                'pending': 'pending',
                'معلق': 'pending',
                'متأخرة': 'overdue',
                'متأخر': 'overdue',
                'overdue': 'overdue'
            };
            return map[status] || 'pending';
        }

        function getStatusLabel(status) {
            var map = {
                'مكتملة': '✅ مكتملة',
                'مكتمل': '✅ مكتمل',
                'completed': '✅ مكتمل',
                'قيد التنفيذ': '⚡ قيد التنفيذ',
                'in-progress': '⚡ قيد التنفيذ',
                'جاري': '⚡ قيد التنفيذ',
                'قيد الانتظار': '⏳ قيد الانتظار',
                'pending': '⏳ قيد الانتظار',
                'معلق': '⏳ قيد الانتظار',
                'متأخرة': '🚨 متأخرة',
                'متأخر': '🚨 متأخرة',
                'overdue': '🚨 متأخرة'
            };
            return map[status] || status;
        }

        // ============================================================
        // 🌐 GLOBAL FUNCTIONS
        // ============================================================
        window.viewLog = function(id) {
            if (_isDestroyed) return;

            var log = allLogs.find(function(l) {
                return String(l.id) === String(id);
            });

            if (log) {
                var details =
                    '📋 تفاصيل السجل\n' +
                    '═══════════════════\n' +
                    '🚢 المركب: ' + (log.vesselName || '—') + '\n' +
                    '🔧 النوع: ' + (log.type || '—') + '\n' +
                    '📅 التاريخ: ' + (log.date || '—') + '\n' +
                    '🏭 الوحدة: ' + (log.repairUnit || '—') + '\n' +
                    '📊 الحالة: ' + (log.status || '—') + '\n' +
                    '💰 التكلفة: ' + (log.cost || 0) + ' دينار\n' +
                    '📝 ملاحظات: ' + (log.notes || '—');

                alert(details);
            } else {
                showToast('لم يُعثر على السجل', 'warning');
            }
        };

        window.deleteLog = function(id) {
            if (_isDestroyed) return;

            if (!canDeleteLog()) {
                showToast('⚠️ ليس لديك صلاحية الحذف', 'error');
                return;
            }

            if (!confirm('⚠️ هل أنت متأكد من حذف هذا السجل؟')) return;

            fetcher('/api/maintenance-logs/' + id, { method: 'DELETE' })
                .then(function(response) {
                    if (!response.ok) {
                        return response.json().then(function(err) {
                            throw new Error(err.error || 'فشل الحذف');
                        });
                    }
                    return response.json();
                })
                .then(function() {
                    showToast('✅ تم حذف السجل', 'success');
                    loadMaintenanceLogs();
                })
                .catch(function(error) {
                    showToast('❌ ' + error.message, 'error');
                });
        };

        window.exportLogs = function() {
            if (_isDestroyed) return;

            try {
                var csv = 'المركب,النوع,التاريخ,الوحدة,الحالة,التكلفة,ملاحظات\n';

                filteredLogs.forEach(function(l) {
                    csv +=
                        '"' + (l.vesselName || '') + '",' +
                        '"' + (l.type || '') + '",' +
                        '"' + (l.date || '') + '",' +
                        '"' + (l.repairUnit || '') + '",' +
                        '"' + (l.status || '') + '",' +
                        (l.cost || 0) + ',' +
                        '"' + (l.notes || '').replace(/"/g, '""') + '"\n';
                });

                var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'maintenance-logs-' + Date.now() + '.csv';
                a.click();
                URL.revokeObjectURL(url);

                showToast('✅ تم تصدير ' + filteredLogs.length + ' سجل', 'success');

            } catch (e) {
                showToast('❌ فشل التصدير: ' + e.message, 'error');
            }
        };

        // ============================================================
        // 🚀 INIT
        // ============================================================
        function init() {
            if (_isDestroyed) return;

            console.log('🚀 Initializing Logs page v9.12...');
            console.log('👤 Role:', window.currentUser ? normalizeRole(window.currentUser.role) : 'unknown');
            console.log('🔐 canDeleteLog:', canDeleteLog());

            addSafeListener($('refreshBtn'), 'click', function() {
                if (_isDestroyed) return;
                showToast('🔄 جاري التحديث...', 'info');
                loadMaintenanceLogs();
            });

            addSafeListener($('exportBtn'), 'click', function() {
                window.exportLogs();
            });

            addSafeListener($('filterBtn'), 'click', function() {
                applyFilters();
                showToast('✅ تم تطبيق الفلتر', 'success');
            });

            addSafeListener($('resetBtn'), 'click', function() {
                var s = $('searchInput'); if (s) s.value = '';
                var f = $('statusFilter'); if (f) f.value = 'الكل';
                applyFilters();
                showToast('✅ تم إلغاء الفلاتر', 'success');
            });

            addSafeListener($('searchInput'), 'keyup', function(e) {
                if (e.key === 'Enter') {
                    applyFilters();
                }
            });

            addSafeListener($('statusFilter'), 'change', function() {
                applyFilters();
            });

            loadMaintenanceLogs();

            console.log('✅ Logs v9.12 ready');
        }

        // ============================================================
        // 🌐 GLOBAL EXPORTS
        // ============================================================
        window.loadMaintenanceLogs = loadMaintenanceLogs;
        window.applyFilters = applyFilters;
        window.renderTable = renderTable;
        window.allLogs = allLogs;

        // ============================================================
        // 🏁 BOOT
        // ============================================================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init, { once: true });
        } else {
            init();
        }

    })();
    </script>
</div>
