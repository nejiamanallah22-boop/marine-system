    <script>
    (function() {
        'use strict';

        console.log('🛟 Support Page v9.1 - Loading...');

        // ============================================================
        // ✅ v9.1: CLEANUP
        // ============================================================
        var _isDestroyed = false;
        var _pageIntervals = [];
        var _pageTimeouts = [];
        var _eventListeners = [];

        function _supportCleanup() {
            if (_isDestroyed) return;
            _isDestroyed = true;

            _pageIntervals.forEach(function(id) {
                try { clearInterval(id); } catch (e) {}
            });
            _pageIntervals = [];

            _pageTimeouts.forEach(function(id) {
                try { clearTimeout(id); } catch (e) {}
            });
            _pageTimeouts = [];

            _eventListeners.forEach(function(item) {
                try {
                    if (item.el && item.fn) {
                        item.el.removeEventListener(item.type, item.fn);
                    }
                } catch (e) {}
            });
            _eventListeners = [];

            try {
                delete window.sendTicket;
                delete window.loadTickets;
                delete window.renderTickets;
                delete window.updateStats;
                delete window.showToast;
            } catch (e) {}

            console.log('🧹 Support cleanup done');
        }

        window._pageCleanup = window._pageCleanup || [];
        window._pageCleanup.push(_supportCleanup);

        window.addEventListener('beforeunload', _supportCleanup);
        window.addEventListener('pagehide', _supportCleanup);

        // ============================================================
        // HELPERS
        // ============================================================
        function getToken() {
            return localStorage.getItem('marine_token') ||
                   localStorage.getItem('token') ||
                   sessionStorage.getItem('token') ||
                   null;
        }

        function getAuthHeaders() {
            var token = getToken();
            var headers = {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return headers;
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m];
            });
        }

        function addSafeListener(el, type, fn) {
            if (!el) return;
            el.addEventListener(type, fn);
            _eventListeners.push({ el: el, type: type, fn: fn });
        }

        function formatDate(d) {
            try {
                var date = new Date(d);
                if (isNaN(date.getTime())) return '-';
                return date.toLocaleDateString('ar-TN') + ' ' + date.toLocaleTimeString('ar-TN', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (e) { return '-'; }
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type, duration) {
            if (_isDestroyed) return;
            type = type || 'info';
            duration = duration || 3000;

            var existing = document.querySelector('.support-toast');
            if (existing) existing.remove();

            var toast = document.createElement('div');
            toast.className = 'support-toast ' + type;

            var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            var icon = document.createElement('span');
            icon.textContent = icons[type] || icons.info;

            var text = document.createElement('span');
            text.textContent = String(message || '');

            toast.appendChild(icon);
            toast.appendChild(text);
            document.body.appendChild(toast);

            var id = setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all .25s ease';
                var id2 = setTimeout(function() {
                    if (toast.parentNode) toast.remove();
                }, 250);
                _pageTimeouts.push(id2);
            }, duration);
            _pageTimeouts.push(id);
        }

        // ============================================================
        // STATE
        // ============================================================
        var tickets = [];

        // ============================================================
        // STATS
        // ============================================================
        function updateStats() {
            if (_isDestroyed) return;

            var total = tickets.length;
            var open = tickets.filter(function(t) { return t.status === 'مفتوحة'; }).length;
            var progress = tickets.filter(function(t) { return t.status === 'قيد المعالجة'; }).length;
            var closed = tickets.filter(function(t) { return t.status === 'مغلقة'; }).length;

            var el;
            el = document.getElementById('statTotal'); if (el) el.textContent = total;
            el = document.getElementById('statOpen'); if (el) el.textContent = open;
            el = document.getElementById('statProgress'); if (el) el.textContent = progress;
            el = document.getElementById('statClosed'); if (el) el.textContent = closed;

            el = document.getElementById('ticketCount');
            if (el) el.textContent = total + ' تذكرة';
        }

        // ============================================================
        // RENDER TICKETS
        // ============================================================
        function renderTickets() {
            if (_isDestroyed) return;

            var list = document.getElementById('ticketsList');
            if (!list) return;

            if (!tickets.length) {
                list.innerHTML = '<div class="no-tickets"><i class="fas fa-inbox"></i> لا توجد تذاكر</div>';
                return;
            }

            var statusClass = {
                'مفتوحة': 'open',
                'قيد المعالجة': 'progress',
                'مغلقة': 'closed'
            };

            var priorityClass = {
                'منخفضة': 'low',
                'متوسطة': 'medium',
                'عالية': 'high',
                'عاجلة': 'urgent'
            };

            var html = '';
            tickets.forEach(function(t) {
                var sClass = statusClass[t.status] || 'open';
                var pClass = priorityClass[t.priority] || 'medium';

                html +=
                    '<div class="ticket-item fade-in">' +
                        '<div class="ticket-header">' +
                            '<div class="ticket-subject">' + escapeHtml(t.subject) + '</div>' +
                            '<span class="ticket-status ' + sClass + '">' + escapeHtml(t.status) + '</span>' +
                        '</div>' +
                        '<div class="ticket-message">' + escapeHtml(t.message) + '</div>' +
                        '<div class="ticket-footer">' +
                            '<div class="user-info">' +
                                '<i class="fas fa-user"></i> ' + escapeHtml(t.user || 'مستخدم') +
                                ' &nbsp;|&nbsp; <i class="fas fa-clock"></i> ' + formatDate(t.createdAt) +
                            '</div>' +
                            '<span class="ticket-priority ' + pClass + '">' + escapeHtml(t.priority) + '</span>' +
                        '</div>' +
                    '</div>';
            });
            list.innerHTML = html;
        }

        // ============================================================
        // LOAD TICKETS
        // ============================================================
        function loadTickets() {
            if (_isDestroyed) return;

            var token = getToken();
            if (!token) {
                console.log('ℹ️ No token — using local tickets only');
                renderTickets();
                updateStats();
                return;
            }

            fetch('/api/support/tickets', { headers: getAuthHeaders() })
                .then(function(res) {
                    if (res.status === 401) throw new Error('Unauthorized');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(data) {
                    if (_isDestroyed) return;
                    tickets = Array.isArray(data) ? data : (data.tickets || []);
                    renderTickets();
                    updateStats();
                })
                .catch(function(err) {
                    if (_isDestroyed) return;
                    console.warn('⚠️ Could not load tickets from server:', err.message);
                    renderTickets();
                    updateStats();
                });
        }

        // ============================================================
        // SEND TICKET
        // ============================================================
        function sendTicket(event) {
            if (event && event.preventDefault) event.preventDefault();
            if (_isDestroyed) return;

            var subjectEl = document.getElementById('ticketSubject');
            var messageEl = document.getElementById('ticketMessage');
            var priorityEl = document.getElementById('ticketPriority');
            var btn = document.getElementById('sendTicketBtn');

            if (!subjectEl || !messageEl || !priorityEl) return;

            var subject = subjectEl.value.trim();
            var message = messageEl.value.trim();
            var priority = priorityEl.value;

            if (!subject) { showToast('⚠️ يرجى إدخال الموضوع', 'error'); return; }
            if (!message) { showToast('⚠️ يرجى إدخال وصف المشكلة', 'error'); return; }

            var newTicket = {
                id: 'T-' + Date.now(),
                subject: subject,
                message: message,
                priority: priority,
                status: 'مفتوحة',
                user: (window.currentUser && window.currentUser.name) || 'مستخدم',
                createdAt: new Date().toISOString()
            };

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '⏳ جاري الإرسال...';
            }

            var token = getToken();

            // ✅ Try to send to server, fallback to local
            var promise;
            if (token) {
                promise = fetch('/api/support/tickets', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(newTicket)
                })
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                });
            } else {
                promise = Promise.resolve({ success: true, local: true });
            }

            promise
                .then(function() {
                    if (_isDestroyed) return;
                    tickets.unshift(newTicket);
                    renderTickets();
                    updateStats();

                    if (subjectEl) subjectEl.value = '';
                    if (messageEl) messageEl.value = '';
                    if (priorityEl) priorityEl.value = 'متوسطة';

                    showToast('✅ تم إرسال التذكرة بنجاح', 'success');
                })
                .catch(function(err) {
                    if (_isDestroyed) return;
                    console.warn('⚠️ Server error, saving locally:', err.message);
                    // ✅ Fallback: keep ticket locally
                    tickets.unshift(newTicket);
                    renderTickets();
                    updateStats();

                    if (subjectEl) subjectEl.value = '';
                    if (messageEl) messageEl.value = '';
                    if (priorityEl) priorityEl.value = 'متوسطة';

                    showToast('✅ تم حفظ التذكرة محلياً', 'info');
                })
                .finally(function() {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = '📨 إرسال التذكرة';
                    }
                });
        }

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            if (_isDestroyed) return;
            console.log('🚀 Initializing Support page...');

            // ✅ Event listeners
            var form = document.getElementById('ticketForm');
            if (form) {
                addSafeListener(form, 'submit', sendTicket);
            }

            // ✅ Load tickets
            loadTickets();

            console.log('✅ Support page ready');
        }

        // ============================================================
        // BOOT
        // ============================================================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                var id = setTimeout(function() { if (!_isDestroyed) init(); }, 50);
                _pageTimeouts.push(id);
            });
        } else {
            var id0 = setTimeout(function() { if (!_isDestroyed) init(); }, 50);
            _pageTimeouts.push(id0);
        }

        // ============================================================
        // EXPOSE
        // ============================================================
        window.sendTicket = sendTicket;
        window.loadTickets = loadTickets;
        window.renderTickets = renderTickets;
        window.updateStats = updateStats;
        window.showToast = showToast;

        console.log('✅ Support Page v9.1 ready');

    })();
    </script>
</div>
