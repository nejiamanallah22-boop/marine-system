<div id="page-support">
    <style>
        /* ============================================================
           🛟 SUPPORT PAGE - PROFESSIONAL v10.0
           ✅ CSRF Token + Users List + Modal + Filters
           ============================================================ */

        #page-support {
            width: 100%; padding: 0; margin: 0;
            min-height: 100vh;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            background: #0a0e1a;
            color: #e8edf5;
            position: relative;
            z-index: 1;
        }

        #page-support *, #page-support *::before, #page-support *::after {
            box-sizing: border-box;
        }

        #page-support::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(96,165,250,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(74,222,128,0.03) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
            animation: supportBgPulse 15s ease-in-out infinite;
        }

        @keyframes supportBgPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(2deg); }
        }

        #page-support ::-webkit-scrollbar { width: 5px; height: 5px; }
        #page-support ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        #page-support ::-webkit-scrollbar-thumb { background: #60a5fa; border-radius: 10px; }

        .support-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .support-header {
            background: linear-gradient(135deg, rgba(96,165,250,0.1), rgba(74,222,128,0.05));
            border-radius: 20px;
            padding: 30px 35px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .support-header::before {
            content: '';
            position: absolute;
            top: -50%; right: -50%;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(96,165,250,0.03) 0%, transparent 70%);
            pointer-events: none;
        }

        .support-header .header-content {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .support-header .title-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .support-header .title-icon {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, rgba(96,165,250,0.2), rgba(74,222,128,0.1));
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .support-header .title {
            font-size: 24px; font-weight: bold;
            color: rgba(255,255,255,0.95);
        }

        .support-header .subtitle {
            font-size: 13px;
            color: rgba(255,255,255,0.35);
            margin-top: 2px;
        }

        .support-header .developer-badge {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 14px 22px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            min-width: 200px;
        }

        .support-header .developer-badge .name {
            font-size: 15px; font-weight: bold;
            color: #fbbf24;
        }

        .support-header .developer-badge .role {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
        }

        .support-header .developer-badge .contact {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 4px;
        }

        .support-header .developer-badge .contact a {
            color: #60a5fa;
            text-decoration: none;
        }

        .support-header .developer-badge .contact a:hover {
            text-decoration: underline;
        }

        /* ===== STATS ===== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-item {
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            padding: 14px 18px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
            transition: all 0.3s;
        }

        .stat-item:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        .stat-item .number {
            font-size: 24px; font-weight: bold;
        }

        .stat-item .label {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 2px;
        }

        .stat-item.total .number { color: #60a5fa; }
        .stat-item.open .number { color: #fbbf24; }
        .stat-item.progress .number { color: #06b6d4; }
        .stat-item.closed .number { color: #4ade80; }

        /* ===== GRID ===== */
        .support-grid {
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 24px;
        }

        .support-card {
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            padding: 22px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
        }

        .support-card:hover {
            border-color: rgba(255,255,255,0.08);
        }

        .support-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .support-card .card-header h4 {
            color: rgba(255,255,255,0.7);
            font-size: 15px; margin: 0;
            display: flex; align-items: center; gap: 8px;
        }

        .support-card .card-header .badge-count {
            background: rgba(255,255,255,0.05);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
        }

        /* ===== FILTERS ===== */
        .tickets-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .tickets-filters select,
        .tickets-filters input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 12px;
            flex: 1;
            min-width: 100px;
        }

        .tickets-filters select:focus,
        .tickets-filters input:focus {
            outline: none;
            border-color: rgba(96,165,250,0.3);
            background: rgba(255,255,255,0.05);
        }

        .tickets-filters select option {
            background: #1a1a2e;
        }

        /* ===== TICKETS ===== */
        .ticket-item {
            background: rgba(255,255,255,0.02);
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-right: 3px solid rgba(251,191,36,0.3);
            transition: all 0.3s;
            cursor: pointer;
        }

        .ticket-item:hover {
            background: rgba(255,255,255,0.04);
            transform: translateX(-3px);
            border-right-color: rgba(96,165,250,0.5);
        }

        .ticket-item .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .ticket-item .ticket-id {
            font-size: 10px;
            color: rgba(96,165,250,0.7);
            font-family: monospace;
            font-weight: bold;
        }

        .ticket-item .ticket-subject {
            font-weight: bold;
            color: rgba(255,255,255,0.85);
            font-size: 14px;
            flex: 1;
        }

        .ticket-item .ticket-message {
            font-size: 13px;
            color: rgba(255,255,255,0.35);
            margin: 6px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .ticket-item .ticket-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            flex-wrap: wrap;
            gap: 6px;
        }

        .ticket-item .ticket-footer .user-info {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .ticket-item .ticket-footer .user-badge {
            background: rgba(96,165,250,0.1);
            color: #60a5fa;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
        }

        .ticket-item .ticket-status {
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .ticket-status.open {
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
        }

        .ticket-status.progress {
            background: rgba(6,182,212,0.15);
            color: #06b6d4;
        }

        .ticket-status.closed {
            background: rgba(74,222,128,0.15);
            color: #4ade80;
        }

        .ticket-priority {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .ticket-priority.low { color: #4ade80; background: rgba(74,222,128,0.1); }
        .ticket-priority.medium { color: #fbbf24; background: rgba(251,191,36,0.1); }
        .ticket-priority.high { color: #f97316; background: rgba(249,115,22,0.1); }
        .ticket-priority.urgent { color: #f87171; background: rgba(248,113,113,0.1); }

        .no-tickets {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255,255,255,0.15);
        }

        .no-tickets i {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
            opacity: 0.3;
        }

        /* ===== FORM ===== */
        .support-form .form-group {
            margin-bottom: 14px;
        }

        .support-form .form-group label {
            display: block;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 4px;
            font-weight: bold;
        }

        .support-form .form-group input,
        .support-form .form-group textarea,
        .support-form .form-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            transition: all 0.3s;
        }

        .support-form .form-group input:focus,
        .support-form .form-group textarea:focus,
        .support-form .form-group select:focus {
            outline: none;
            border-color: rgba(96,165,250,0.3);
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 20px rgba(96,165,250,0.05);
        }

        .support-form .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }

        .support-form .form-group select option {
            background: #1a1a2e;
        }

        /* ✅ NEW: User selector */
        .support-form .user-selector {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .support-form .user-selector .current-user-badge {
            background: rgba(96,165,250,0.15);
            color: #60a5fa;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .support-form .user-selector select {
            flex: 1;
        }

        .support-form .btn-submit {
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: white;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            transition: all 0.3s;
            width: 100%;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .support-form .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(96,165,250,0.2);
        }

        .support-form .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== MODAL ===== */
        .ticket-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 99998;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .ticket-modal.active {
            display: flex;
        }

        .ticket-modal .modal-content {
            background: linear-gradient(135deg, #1a1f2e, #0f1420);
            border-radius: 16px;
            padding: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(96,165,250,0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .ticket-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .ticket-modal .modal-title {
            font-size: 17px;
            font-weight: bold;
            color: #60a5fa;
        }

        .ticket-modal .modal-close {
            background: rgba(255,255,255,0.05);
            border: none;
            color: rgba(255,255,255,0.6);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .ticket-modal .modal-close:hover {
            background: rgba(239,68,68,0.2);
            color: #f87171;
        }

        .ticket-modal .modal-body {
            font-size: 13px;
            line-height: 1.7;
            color: rgba(255,255,255,0.75);
        }

        .ticket-modal .modal-body .field {
            margin-bottom: 14px;
        }

        .ticket-modal .modal-body .field-label {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
        }

        .ticket-modal .modal-body .field-value {
            color: rgba(255,255,255,0.85);
            font-size: 14px;
            word-break: break-word;
        }

        .ticket-modal .modal-body textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            resize: vertical;
            min-height: 80px;
        }

        /* ===== SCROLL ===== */
        .tickets-scroll {
            max-height: 500px;
            overflow-y: auto;
            padding-left: 4px;
        }

        .tickets-scroll::-webkit-scrollbar { width: 4px; }
        .tickets-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .support-grid {
                grid-template-columns: 1fr;
            }
            .support-header .header-content {
                flex-direction: column;
                text-align: center;
            }
            .support-header .title-section {
                flex-direction: column;
            }
            .support-header .developer-badge {
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            .support-container { padding: 12px; }
            .support-header { padding: 20px; }
            .support-header .title { font-size: 18px; }
            .support-header .developer-badge { padding: 10px 14px; min-width: 0; }
            .support-header .developer-badge .name { font-size: 13px; }
            .support-header .developer-badge .contact { font-size: 10px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .support-card { padding: 14px; }
            .ticket-modal .modal-content { padding: 18px; }
            .tickets-filters { flex-direction: column; }
        }

        /* ===== Animations ===== */
        .fade-in {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Toast ===== */
        .support-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 99999;
            max-width: 360px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 12px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,.35);
            animation: supportToastIn .25s ease-out;
        }

        .support-toast.success {
            background: rgba(34,197,94,.15);
            border: 1px solid rgba(34,197,94,.2);
        }

        .support-toast.error {
            background: rgba(239,68,68,.15);
            border: 1px solid rgba(239,68,68,.2);
        }

        .support-toast.info {
            background: rgba(96,165,250,.15);
            border: 1px solid rgba(96,165,250,.2);
        }

        @keyframes supportToastIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

                            <option value="متوسطة" selected>🟡 متوسطة</option>
                            <option value="عالية">🟠 عالية</option>
                            <option value="عاجلة">🔴 عاجلة</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit" id="sendTicketBtn">
                        📨 إرسال التذكرة
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="ticket-modal" id="ticketModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">تفاصيل التذكرة</div>
                <button type="button" class="modal-close" id="modalClose">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        console.log('🛟 Support Page v10.0 - Loading...');

        // ============================================================
        // CLEANUP
        // ============================================================
        var _isDestroyed = false;
        var _pageIntervals = [];
        var _pageTimeouts = [];
        var _eventListeners = [];

        function _supportCleanup() {
            if (_isDestroyed) return;
            _isDestroyed = true;

            _pageIntervals.forEach(function(id) { try { clearInterval(id); } catch (e) {} });
            _pageIntervals = [];
            _pageTimeouts.forEach(function(id) { try { clearTimeout(id); } catch (e) {} });
            _pageTimeouts = [];
            _eventListeners.forEach(function(item) {
                try { if (item.el && item.fn) item.el.removeEventListener(item.type, item.fn); } catch (e) {}
            });
            _eventListeners = [];

            try {
                delete window.sendTicket;
                delete window.loadTickets;
                delete window.renderTickets;
                delete window.updateStats;
                delete window.showToast;
            } catch (e) {}

            console.log('🧹 Support cleanup done');
        }

        window._pageCleanup = window._pageCleanup || [];
        window._pageCleanup.push(_supportCleanup);

        window.addEventListener('beforeunload', _supportCleanup);
        window.addEventListener('pagehide', _supportCleanup);

        // ============================================================
        // HELPERS
        // ============================================================
        function getToken() {
            return localStorage.getItem('marine_token') ||
                   localStorage.getItem('token') ||
                   localStorage.getItem('marine_auth_token') ||
                   sessionStorage.getItem('token') ||
                   null;
        }

        /* ✅ CSRF Token from cookie */
        function getCsrfToken() {
            try {
                var match = document.cookie.match(/marine_csrf=([^;]+)/);
                return match ? decodeURIComponent(match[1]) : '';
            } catch (e) { return ''; }
        }

        function getAuthHeaders() {
            var token = getToken();
            var csrf = getCsrfToken();
            var headers = {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            if (csrf) headers['X-CSRF-Token'] = csrf;
            return headers;
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m];
            });
        }

        function addSafeListener(el, type, fn) {
            if (!el) return;
            el.addEventListener(type, fn);
            _eventListeners.push({ el: el, type: type, fn: fn });
        }

        function formatDate(d) {
            try {
                var date = new Date(d);
                if (isNaN(date.getTime())) return '-';
                return date.toLocaleDateString('ar-TN') + ' ' + date.toLocaleTimeString('ar-TN', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (e) { return '-'; }
        }

        /* ✅ Normalize status (Arabic/English) */
        function normalizeStatus(status) {
            if (!status) return 'مفتوحة';
            var s = String(status).toLowerCase().trim();
            if (s === 'open' || s === 'مفتوحة' || s === 'مفتوح') return 'مفتوحة';
            if (s === 'progress' || s === 'in-progress' || s === 'قيد المعالجة') return 'قيد المعالجة';
            if (s === 'closed' || s === 'مغلقة' || s === 'مغلق') return 'مغلقة';
            return 'مفتوحة';
        }

        function normalizePriority(priority) {
            if (!priority) return 'متوسطة';
            var p = String(priority).toLowerCase().trim();
            if (p === 'low' || p === 'منخفضة' || p === 'منخفض') return 'منخفضة';
            if (p === 'medium' || p === 'متوسطة' || p === 'متوسط') return 'متوسطة';
            if (p === 'high' || p === 'عالية' || p === 'عالي') return 'عالية';
            if (p === 'urgent' || p === 'critical' || p === 'عاجلة' || p === 'عاجل') return 'عاجلة';
            return 'متوسطة';
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type, duration) {
            if (_isDestroyed) return;
            type = type || 'info';
            duration = duration || 3000;

            var existing = document.querySelector('.support-toast');
            if (existing) existing.remove();

            var toast = document.createElement('div');
            toast.className = 'support-toast ' + type;

            var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            var icon = document.createElement('span');
            icon.textContent = icons[type] || icons.info;

            var text = document.createElement('span');
            text.textContent = String(message || '');

            toast.appendChild(icon);
            toast.appendChild(text);
            document.body.appendChild(toast);

            var id = setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all .25s ease';
                var id2 = setTimeout(function() {
                    if (toast.parentNode) toast.remove();
                }, 250);
                _pageTimeouts.push(id2);
            }, duration);
            _pageTimeouts.push(id);
        }

        // ============================================================
        // STATE
        // ============================================================
        var tickets = [];
        var allUsers = [];
        var currentUser = null;

        // ============================================================
        // LOAD CURRENT USER
        // ============================================================
        function loadCurrentUser() {
            try {
                var keys = ['marine_user', 'currentUser', 'user'];
                for (var i = 0; i < keys.length; i++) {
                    var raw = localStorage.getItem(keys[i]) || sessionStorage.getItem(keys[i]);
                    if (raw) {
                        var parsed = JSON.parse(raw);
                        if (parsed && (parsed.name || parsed.username)) {
                            currentUser = parsed;
                            break;
                        }
                    }
                }
            } catch (e) {}

            var badge = document.getElementById('currentUserName');
            if (badge) {
                badge.textContent = currentUser ? (currentUser.name || currentUser.username) : 'زائر';
            }
        }

        // ============================================================
        // LOAD USERS
        // ============================================================
        function loadUsers() {
            if (_isDestroyed) return;

            var select = document.getElementById('ticketSender');
            if (!select) return;

            var token = getToken();
            if (!token) {
                // Show only current user
                select.innerHTML = '';
                if (currentUser) {
                    var opt = document.createElement('option');
                    opt.value = currentUser.username || currentUser.name || 'me';
                    opt.textContent = '👤 ' + (currentUser.name || currentUser.username);
                    select.appendChild(opt);
                }
                return;
            }

            fetch('/api/users', { headers: getAuthHeaders() })
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(data) {
                    if (_isDestroyed) return;
                    allUsers = Array.isArray(data) ? data : (data.users || []);

                    select.innerHTML = '';

                    // Add current user as default
                    if (currentUser) {
                        var myOpt = document.createElement('option');
                        myOpt.value = currentUser.username || currentUser.name || 'me';
                        myOpt.textContent = '👤 ' + (currentUser.name || currentUser.username) + ' (أنا)';
                        myOpt.selected = true;
                        select.appendChild(myOpt);
                    }

                    // Add other users
                    allUsers.forEach(function(u) {
                        var myName = currentUser ? (currentUser.username || currentUser.name) : '';
                        if (u.username === myName || u.name === myName) return;

                        var opt = document.createElement('option');
                        opt.value = u.username || u.name || u.id;
                        opt.textContent = '👤 ' + (u.name || u.username) +
                                        (u.roleLabel ? ' — ' + u.roleLabel : '');
                        select.appendChild(opt);
                    });

                    console.log('✅ Loaded', allUsers.length, 'users');
                })
                .catch(function(err) {
                    if (_isDestroyed) return;
                    console.warn('⚠️ Could not load users:', err.message);

                    // Fallback: only current user
                    select.innerHTML = '';
                    if (currentUser) {
                        var opt = document.createElement('option');
                        opt.value = currentUser.username || currentUser.name || 'me';
                        opt.textContent = '👤 ' + (currentUser.name || currentUser.username);
                        select.appendChild(opt);
                    }
                });
        }

        // ============================================================
        // STATS
        // ============================================================
        function updateStats() {
            if (_isDestroyed) return;

            var total = tickets.length;
            var open = tickets.filter(function(t) { return t.status === 'مفتوحة'; }).length;
            var progress = tickets.filter(function(t) { return t.status === 'قيد المعالجة'; }).length;
            var closed = tickets.filter(function(t) { return t.status === 'مغلقة'; }).length;

            var el;
            el = document.getElementById('statTotal'); if (el) el.textContent = total;
            el = document.getElementById('statOpen'); if (el) el.textContent = open;
            el = document.getElementById('statProgress'); if (el) el.textContent = progress;
            el = document.getElementById('statClosed'); if (el) el.textContent = closed;

            el = document.getElementById('ticketCount');
            if (el) el.textContent = total + ' تذكرة';
        }

        // ============================================================
        // FILTER TICKETS
        // ============================================================
        function getFilteredTickets() {
            var statusFilter = document.getElementById('filterStatus');
            var priorityFilter = document.getElementById('filterPriority');
            var searchFilter = document.getElementById('filterSearch');

            var status = statusFilter ? statusFilter.value : 'all';
            var priority = priorityFilter ? priorityFilter.value : 'all';
            var search = searchFilter ? searchFilter.value.trim().toLowerCase() : '';

            return tickets.filter(function(t) {
                if (status !== 'all' && t.status !== status) return false;
                if (priority !== 'all' && t.priority !== priority) return false;
                if (search) {
                    var text = (t.subject + ' ' + t.message + ' ' + (t.sender || '')).toLowerCase();
                    if (text.indexOf(search) === -1) return false;
                }
                return true;
            });
        }

        // ============================================================
        // RENDER TICKETS
        // ============================================================
        function renderTickets() {
            if (_isDestroyed) return;

            var list = document.getElementById('ticketsList');
            if (!list) return;

            var filtered = getFilteredTickets();

            if (!filtered.length) {
                var msg = tickets.length === 0 ? 'لا توجد تذاكر' : 'لا توجد تذاكر مطابقة';
                list.innerHTML = '<div class="no-tickets"><i class="fas fa-inbox"></i> ' + msg + '</div>';
                return;
            }

            var statusClass = {
                'مفتوحة': 'open',
                'قيد المعالجة': 'progress',
                'مغلقة': 'closed'
            };

            var priorityClass = {
                'منخفضة': 'low',
                'متوسطة': 'medium',
                'عالية': 'high',
                'عاجلة': 'urgent'
            };

            var html = '';
            filtered.forEach(function(t) {
                var sClass = statusClass[t.status] || 'open';
                var pClass = priorityClass[t.priority] || 'medium';

                html +=
                    '<div class="ticket-item fade-in" data-ticket-id="' + escapeHtml(t.id) + '">' +
                        '<div class="ticket-header">' +
                            '<div class="ticket-subject">' + escapeHtml(t.subject) + '</div>' +
                            '<span class="ticket-status ' + sClass + '">' + escapeHtml(t.status) + '</span>' +
                        '</div>' +
                        '<div class="ticket-message">' + escapeHtml(t.message) + '</div>' +
                        '<div class="ticket-footer">' +
                            '<div class="user-info">' +
                                '<span class="user-badge">👤 ' + escapeHtml(t.sender || t.user || 'مستخدم') + '</span>' +
                                '<i class="fas fa-clock"></i> ' + formatDate(t.createdAt) +
                            '</div>' +
                            '<span class="ticket-priority ' + pClass + '">' + escapeHtml(t.priority) + '</span>' +
                        '</div>' +
                    '</div>';
            });
            list.innerHTML = html;

            // ✅ Add click handlers for opening modal
            list.querySelectorAll('.ticket-item').forEach(function(item) {
                var handler = function() {
                    var tid = this.getAttribute('data-ticket-id');
                    openTicketModal(tid);
                };
                item.addEventListener('click', handler);
                _eventListeners.push({ el: item, type: 'click', fn: handler });
            });
        }

        // ============================================================
        // TICKET MODAL
        // ============================================================
        function openTicketModal(ticketId) {
            var ticket = tickets.find(function(t) { return t.id === ticketId; });
            if (!ticket) return;

            var modal = document.getElementById('ticketModal');
            var title = document.getElementById('modalTitle');
            var body = document.getElementById('modalBody');
            if (!modal || !body) return;

            if (title) title.textContent = '🎫 ' + ticket.subject;

            body.innerHTML =
                '<div class="field">' +
                    '<span class="field-label">👤 المرسل</span>' +
                    '<span class="field-value">' + escapeHtml(ticket.sender || ticket.user || 'مستخدم') + '</span>' +
                '</div>' +
                '<div class="field">' +
                    '<span class="field-label">📋 الموضوع</span>' +
                    '<span class="field-value">' + escapeHtml(ticket.subject) + '</span>' +
                '</div>' +
                '<div class="field">' +
                    '<span class="field-label">📝 الوصف</span>' +
                    '<div class="field-value" style="background:rgba(255,255,255,0.03);padding:12px;border-radius:8px;line-height:1.7">' +
                        escapeHtml(ticket.message) +
                    '</div>' +
                '</div>' +
                '<div class="field" style="display:flex;gap:10px;flex-wrap:wrap">' +
                    '<div style="flex:1">' +
                        '<span class="field-label">🎯 الأولوية</span>' +
                        '<span class="field-value">' + escapeHtml(ticket.priority) + '</span>' +
                    '</div>' +
                    '<div style="flex:1">' +
                        '<span class="field-label">📊 الحالة</span>' +
                        '<span class="field-value">' + escapeHtml(ticket.status) + '</span>' +
                    '</div>' +
                '</div>' +
                '<div class="field">' +
                    '<span class="field-label">📅 التاريخ</span>' +
                    '<span class="field-value">' + formatDate(ticket.createdAt) + '</span>' +
                '</div>';

            modal.classList.add('active');
        }

        function closeTicketModal() {
            var modal = document.getElementById('ticketModal');
            if (modal) modal.classList.remove('active');
        }

        // ============================================================
        // LOAD TICKETS
        // ============================================================
        function loadTickets() {
            if (_isDestroyed) return;

            // Load from localStorage first
            try {
                var stored = localStorage.getItem('marine_support_tickets');
                if (stored) {
                    var parsed = JSON.parse(stored);
                    if (Array.isArray(parsed)) {
                        tickets = parsed.map(function(t) {
                            return {
                                id: t.id || ('T-' + Date.now() + Math.random()),
                                subject: t.subject || '',
                                message: t.message || '',
                                priority: normalizePriority(t.priority),
                                status: normalizeStatus(t.status),
                                sender: t.sender || t.user || 'مستخدم',
                                user: t.sender || t.user || 'مستخدم',
                                createdAt: t.createdAt || new Date().toISOString()
                            };
                        });
                        renderTickets();
                        updateStats();
                    }
                }
            } catch (e) {}

            var token = getToken();
            if (!token) {
                renderTickets();
                updateStats();
                return;
            }

            fetch('/api/support/tickets', { headers: getAuthHeaders() })
                .then(function(res) {
                    if (res.status === 401) throw new Error('Unauthorized');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(data) {
                    if (_isDestroyed) return;
                    var remoteTickets = Array.isArray(data) ? data : (data.tickets || []);
                    remoteTickets = remoteTickets.map(function(t) {
                        return {
                            id: t.id || t._id || ('T-' + Date.now()),
                            subject: t.subject || t.title || '',
                            message: t.message || t.description || '',
                            priority: normalizePriority(t.priority),
                            status: normalizeStatus(t.status),
                            sender: t.sender || t.user || t.createdByName || 'مستخدم',
                            user: t.sender || t.user || t.createdByName || 'مستخدم',
                            createdAt: t.createdAt || new Date().toISOString()
                        };
                    });

                    tickets = remoteTickets;
                    saveTicketsLocally();
                    renderTickets();
                    updateStats();
                })
                .catch(function(err) {
                    if (_isDestroyed) return;
                    console.warn('⚠️ Could not load tickets:', err.message);
                    renderTickets();
                    updateStats();
                });
        }

        // ============================================================
        // SAVE TICKETS LOCALLY
        // ============================================================
        function saveTicketsLocally() {
            try {
                localStorage.setItem('marine_support_tickets', JSON.stringify(tickets.slice(0, 100)));
            } catch (e) {}
        }

        // ============================================================
        // SEND TICKET
        // ============================================================
        function sendTicket(event) {
            if (event && event.preventDefault) event.preventDefault();
            if (_isDestroyed) return;

            var senderEl = document.getElementById('ticketSender');
            var subjectEl = document.getElementById('ticketSubject');
            var messageEl = document.getElementById('ticketMessage');
            var priorityEl = document.getElementById('ticketPriority');
            var btn = document.getElementById('sendTicketBtn');

            if (!subjectEl || !messageEl || !priorityEl) return;

            var sender = (senderEl && senderEl.value) || (currentUser && (currentUser.name || currentUser.username)) || 'مستخدم';
            var subject = subjectEl.value.trim();
            var message = messageEl.value.trim();
            var priority = priorityEl.value;

            if (!subject) { showToast('⚠️ يرجى إدخال الموضوع', 'error'); return; }
            if (!message) { showToast('⚠️ يرجى إدخال وصف المشكلة', 'error'); return; }

            var newTicket = {
                id: 'T-' + Date.now(),
                subject: subject,
                message: message,
                priority: priority,
                status: 'مفتوحة',
                sender: sender,
                user: sender,
                createdAt: new Date().toISOString()
            };

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '⏳ جاري الإرسال...';
            }

            var token = getToken();

            var promise;
            if (token) {
                promise = fetch('/api/support/tickets', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        title: subject,
                        description: message,
                        priority: priority,
                        sender: sender
                    })
                })
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                });
            } else {
                promise = Promise.resolve({ success: true, local: true });
            }

            promise
                .then(function() {
                    if (_isDestroyed) return;
                    tickets.unshift(newTicket);
                    saveTicketsLocally();
                    renderTickets();
                    updateStats();

                    if (subjectEl) subjectEl.value = '';
                    if (messageEl) messageEl.value = '';
                    if (priorityEl) priorityEl.value = 'متوسطة';

                    showToast('✅ تم إرسال التذكرة بنجاح', 'success');
                })
                .catch(function(err) {
                    if (_isDestroyed) return;
                    console.warn('⚠️ Server error, saving locally:', err.message);
                    tickets.unshift(newTicket);
                    saveTicketsLocally();
                    renderTickets();
                    updateStats();

                    if (subjectEl) subjectEl.value = '';
                    if (messageEl) messageEl.value = '';
                    if (priorityEl) priorityEl.value = 'متوسطة';

                    showToast('✅ تم حفظ التذكرة محلياً', 'info');
                })
                .finally(function() {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = '📨 إرسال التذكرة';
                    }
                });
        }

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            if (_isDestroyed) return;
            console.log('🚀 Initializing Support page v10.0...');

            // Load current user
            loadCurrentUser();

            // Load users list
            loadUsers();

            // Form submit
            var form = document.getElementById('ticketForm');
            if (form) {
                addSafeListener(form, 'submit', sendTicket);
            }

            // Filters
            var filterStatus = document.getElementById('filterStatus');
            if (filterStatus) addSafeListener(filterStatus, 'change', renderTickets);

            var filterPriority = document.getElementById('filterPriority');
            if (filterPriority) addSafeListener(filterPriority, 'change', renderTickets);

            var filterSearch = document.getElementById('filterSearch');
            if (filterSearch) addSafeListener(filterSearch, 'input', renderTickets);

            // Modal close
            var modalClose = document.getElementById('modalClose');
            if (modalClose) addSafeListener(modalClose, 'click', closeTicketModal);

            var modal = document.getElementById('ticketModal');
            if (modal) {
                addSafeListener(modal, 'click', function(e) {
                    if (e.target === modal) closeTicketModal();
                });
            }

            // ESC to close modal
            addSafeListener(document, 'keydown', function(e) {
                if (e.key === 'Escape') closeTicketModal();
            });

            // Load tickets
            loadTickets();

            console.log('✅ Support page ready');
        }

        // ============================================================
        // BOOT
        // ============================================================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                var id = setTimeout(function() { if (!_isDestroyed) init(); }, 50);
                _pageTimeouts.push(id);
            });
        } else {
            var id0 = setTimeout(function() { if (!_isDestroyed) init(); }, 50);
            _pageTimeouts.push(id0);
        }

        // ============================================================
        // EXPOSE
        // ============================================================
        window.sendTicket = sendTicket;
        window.loadTickets = loadTickets;
        window.renderTickets = renderTickets;
        window.updateStats = updateStats;
        window.showToast = showToast;
        window.openTicketModal = openTicketModal;
        window.closeTicketModal = closeTicketModal;

        console.log('✅ Support Page v10.0 ready');

    })();
    </script>
</div>
