<!-- public/reset-password.html -->
<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔑 إعادة تعيين كلمة المرور - منظومة الوسائل البحرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0a1628;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            direction: rtl;
        }
        body::before {
            content: '';
            position: fixed;
            inset: -50%;
            background: radial-gradient(ellipse at 20% 50%, rgba(14,165,233,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(230,179,30,0.04) 0%, transparent 60%);
            animation: bgPulse 12s ease-in-out infinite;
            z-index: -1;
        }
        @keyframes bgPulse {
            0%, 100% { transform: scale(1) rotate(0); }
            50% { transform: scale(1.08) rotate(3deg); }
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 40px 35px;
            animation: slideUp 0.7s cubic-bezier(0.16,1,0.3,1);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header .icon { font-size: 48px; display: block; }
        .header h1 { font-size: 24px; font-weight: 700; color: #f5d76e; margin-top: 8px; }
        .header p { color: rgba(255,255,255,0.3); font-size: 14px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 4px; font-weight: 600; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #f5d76e;
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 4px rgba(245,215,110,0.06);
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.15); }
        .form-group input:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e6b31e, #f5d76e);
            color: #0a1628;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,179,30,0.25);
        }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 14px;
            display: none;
        }
        .message.show { display: block; }
        .message.success { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.1); }
        .message.error { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.1); }

        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(0,0,0,0.15);
            border-top-color: #0a1628;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .btn.loading .spinner { display: inline-block; }
        .btn.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer { text-align: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.04); }
        .footer a { color: rgba(255,255,255,0.3); text-decoration: none; font-size: 13px; }
        .footer a:hover { color: #f5d76e; }

        .info-box {
            background: rgba(230,179,30,0.05);
            border-right: 3px solid #f5d76e;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }
        .info-box strong { color: #f5d76e; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="icon">🔑</span>
            <h1>إعادة تعيين كلمة المرور</h1>
            <p>أدخل كلمة المرور الجديدة لحسابك</p>
        </div>

        <form id="resetForm" autocomplete="off" novalidate>
            <div class="info-box">
                <i class="fas fa-info-circle"></i>
                <strong>ملاحظة:</strong> الرابط صالح لمدة <strong>ساعة واحدة</strong> فقط.
            </div>

            <div class="form-group">
                <label for="resetEmail">📧 البريد الإلكتروني</label>
                <input
                    type="email"
                    id="resetEmail"
                    placeholder="البريد الإلكتروني"
                    readonly
                    aria-readonly="true">
            </div>
            <div class="form-group">
                <label for="newPassword">
                    🔑 كلمة المرور الجديدة <span style="color:#f87171;">*</span>
                </label>
                <input
                    type="password"
                    id="newPassword"
                    placeholder="كلمة المرور الجديدة (12 حرفاً على الأقل)"
                    autocomplete="new-password"
                    minlength="12"
                    maxlength="128"
                    required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">
                    ✅ تأكيد كلمة المرور <span style="color:#f87171;">*</span>
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="أعد كتابة كلمة المرور"
                    autocomplete="new-password"
                    minlength="12"
                    maxlength="128"
                    required>
            </div>

            <div id="resetMessage" class="message" role="alert" aria-live="polite"></div>

            <button type="submit" class="btn btn-primary" id="resetBtn">
                <span class="btn-text">🔄 إعادة تعيين كلمة المرور</span>
                <span class="spinner"></span>
            </button>

            <div class="footer">
                <a href="/">← العودة إلى تسجيل الدخول</a>
            </div>
        </form>
    </div>

    <script>
        (function() {
            'use strict';

            console.log('🔑 Reset password page loaded');

            // ============================================================
            // ✅ v9.1: CLEANUP STATE (احتياطي)
            // ============================================================
            var _isDestroyed = false;
            var _pageTimeouts = [];

            function _resetPasswordCleanup() {
                if (_isDestroyed) return;
                _isDestroyed = true;

                _pageTimeouts.forEach(function(id) {
                    try { clearTimeout(id); } catch (e) {}
                });
                _pageTimeouts = [];

                console.log('🧹 Reset password cleanup done');
            }

            window._pageCleanup = window._pageCleanup || [];
            window._pageCleanup.push(_resetPasswordCleanup);

            window.addEventListener('beforeunload', _resetPasswordCleanup);
            window.addEventListener('pagehide', _resetPasswordCleanup);

            // ============================================================
            // ✅ v9.1: SAFE HELPERS
            // ============================================================

            function safeDecode(value) {
                if (value === null || value === undefined) return '';
                try {
                    return decodeURIComponent(String(value));
                } catch (e) {
                    return String(value);
                }
            }

            function isValidEmail(email) {
                if (!email || typeof email !== 'string') return false;
                if (email.length > 254) return false;
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            function isValidToken(token) {
                if (!token || typeof token !== 'string') return false;
                // token يجب أن يكون بطول معقول (hex 64 عادة)
                return token.length >= 16 && token.length <= 256;
            }

            function getQueryParams() {
                try {
                    var params = new URLSearchParams(window.location.search);
                    return {
                        token: params.get('token'),
                        email: params.get('email')
                    };
                } catch (e) {
                    console.warn('⚠️ Failed to parse URL params:', e.message);
                    return { token: null, email: null };
                }
            }

            // ============================================================
            // ✅ v9.1: SAFE DOM ACCESS
            // ============================================================

            var formEl = document.getElementById('resetForm');
            var emailInput = document.getElementById('resetEmail');
            var newPasswordInput = document.getElementById('newPassword');
            var confirmPasswordInput = document.getElementById('confirmPassword');
            var resetBtn = document.getElementById('resetBtn');
            var messageDiv = document.getElementById('resetMessage');

            // ✅ تعطيل الزر مبدئياً حتى يتم التحقق
            if (resetBtn) {
                resetBtn.disabled = true;
            }

            // ============================================================
            // ✅ v9.1: SAFE MESSAGE HELPER
            // ============================================================

            function showMessage(text, type) {
                if (!messageDiv || _isDestroyed) return;
                messageDiv.className = 'message show ' + (type || 'error');
                messageDiv.textContent = String(text || '');
            }

            function clearMessage() {
                if (!messageDiv) return;
                messageDiv.className = 'message';
                messageDiv.textContent = '';
            }

            // ============================================================
            // ✅ v9.1: CSRF CACHE
            // ============================================================

            var _csrfCache = null;

            async function getCsrfToken(forceRefresh) {
                if (_csrfCache && !forceRefresh) {
                    return _csrfCache;
                }
                try {
                    var res = await fetch('/api/csrf-token', {
                        credentials: 'include',
                        headers: { 'Accept': 'application/json' }
                    });
                    if (!res.ok) return '';
                    var data = await res.json();
                    _csrfCache = data.token || '';
                    return _csrfCache;
                } catch (e) {
                    console.warn('⚠️ CSRF fetch failed:', e.message);
                    return '';
                }
            }

            // ============================================================
            // ✅ v9.1: EXTRACT PARAMS SAFELY
            // ============================================================

            var params = getQueryParams();
            var token = params.token;
            var emailRaw = params.email;
            var email = safeDecode(emailRaw);

            console.log('📌 Token:', token ? '✅ موجود' : '❌ غير موجود');
            console.log('📌 Email:', email ? '✅ موجود' : '❌ غير موجود');

            // ✅ تعبئة البريد إن وُجد
            if (emailInput && email) {
                emailInput.value = email;
            }

            // ============================================================
            // ✅ v9.1: EARLY VALIDATION
            // ============================================================

            if (!isValidToken(token)) {
                showMessage(
                    '❌ رابط إعادة التعيين غير صالح أو منتهي الصلاحية',
                    'error'
                );
                if (resetBtn) resetBtn.disabled = true;
                if (newPasswordInput) newPasswordInput.disabled = true;
                if (confirmPasswordInput) confirmPasswordInput.disabled = true;
                console.warn('⚠️ Invalid or missing token');
                return;
            }

            if (!isValidEmail(email)) {
                showMessage(
                    '❌ البريد الإلكتروني في الرابط غير صالح',
                    'error'
                );
                if (resetBtn) resetBtn.disabled = true;
                if (newPasswordInput) newPasswordInput.disabled = true;
                if (confirmPasswordInput) confirmPasswordInput.disabled = true;
                console.warn('⚠️ Invalid or missing email');
                return;
            }

            // ============================================================
            // ✅ v9.1: VERIFY TOKEN
            // ============================================================

            async function verifyToken() {
                if (_isDestroyed) return false;

                try {
                    var csrfToken = await getCsrfToken();

                    var response = await fetch('/api/auth/verify-reset-token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-Token': csrfToken,
                            'Accept': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            email: email,
                            token: token
                        })
                    });

                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }

                    var data = await response.json();

                    if (!data.success || !data.valid) {
                        showMessage(
                            '❌ ' + (data.message || 'رابط إعادة التعيين غير صالح أو منتهي الصلاحية'),
                            'error'
                        );
                        if (resetBtn) resetBtn.disabled = true;
                        if (newPasswordInput) newPasswordInput.disabled = true;
                        if (confirmPasswordInput) confirmPasswordInput.disabled = true;
                        return false;
                    }

                    console.log('✅ Token is valid');

                    // ✅ تمكين الزر بعد التحقق
                    if (resetBtn) resetBtn.disabled = false;
                    if (newPasswordInput) newPasswordInput.disabled = false;
                    if (confirmPasswordInput) confirmPasswordInput.disabled = false;

                    return true;
                } catch (error) {
                    if (_isDestroyed) return false;
                    console.error('❌ Token verification error:', error);
                    showMessage(
                        '❌ حدث خطأ في التحقق من الرابط. يرجى إعادة المحاولة.',
                        'error'
                    );
                    if (resetBtn) resetBtn.disabled = true;
                    return false;
                }
            }

            // ============================================================
            // ✅ v9.1: PASSWORD STRENGTH CHECK (12 أحرف)
            // ============================================================

            function isStrongEnoughPassword(password) {
                if (!password || typeof password !== 'string') return false;
                return password.length >= 12 && password.length <= 128;
            }

            // ============================================================
            // ✅ v9.1: RESET PASSWORD
            // ============================================================

            async function resetPassword(event) {
                if (event && event.preventDefault) event.preventDefault();
                if (_isDestroyed) return;

                if (!newPasswordInput || !confirmPasswordInput || !resetBtn) return;

                var newPassword = newPasswordInput.value.trim();
                var confirmPassword = confirmPasswordInput.value.trim();

                clearMessage();

                if (!newPassword || !confirmPassword) {
                    showMessage('⚠️ الرجاء إدخال كلمة المرور وتأكيدها', 'error');
                    return;
                }

                if (!isStrongEnoughPassword(newPassword)) {
                    showMessage(
                        '⚠️ كلمة المرور يجب أن تكون 12 حرفاً على الأقل',
                        'error'
                    );
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showMessage('⚠️ كلمة المرور وتأكيدها غير متطابقين', 'error');
                    return;
                }

                resetBtn.disabled = true;
                resetBtn.classList.add('loading');
                clearMessage();

                try {
                    var csrfToken = await getCsrfToken();

                    var response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-Token': csrfToken,
                            'Accept': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            email: email,
                            token: token,
                            newPassword: newPassword
                        })
                    });

                    if (_isDestroyed) return;

                    var data = await response.json();

                    if (response.ok && data.success) {
                        showMessage(
                            '✅ ' + (data.message || 'تم إعادة تعيين كلمة المرور بنجاح'),
                            'success'
                        );

                        // ✅ تجديد CSRF token
                        _csrfCache = null;

                        // ✅ إعادة التوجيه بعد 3 ثوان
                        var id = setTimeout(function() {
                            if (!_isDestroyed) {
                                window.location.href = '/';
                            }
                        }, 3000);
                        _pageTimeouts.push(id);

                    } else {
                        showMessage(
                            '❌ ' + (data.error || data.message || 'حدث خطأ في إعادة التعيين'),
                            'error'
                        );
                        resetBtn.disabled = false;
                    }
                } catch (error) {
                    if (_isDestroyed) return;
                    console.error('❌ Reset password error:', error);
                    showMessage(
                        '❌ حدث خطأ في الاتصال بالخادم',
                        'error'
                    );
                    resetBtn.disabled = false;
                } finally {
                    if (resetBtn && !_isDestroyed) {
                        resetBtn.classList.remove('loading');
                    }
                }
            }

            // ============================================================
            // ✅ v9.1: EVENT LISTENERS
            // ============================================================

            if (formEl) {
                formEl.addEventListener('submit', resetPassword);
            } else if (resetBtn) {
                // Fallback: زر فقط
                resetBtn.addEventListener('click', resetPassword);
            }

            if (confirmPasswordInput) {
                confirmPasswordInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        if (resetBtn) resetBtn.click();
                    }
                });
            }

            if (newPasswordInput) {
                newPasswordInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (confirmPasswordInput) confirmPasswordInput.focus();
                    }
                });
            }

            // ============================================================
            // ✅ v9.1: INIT
            // ============================================================

            (async function init() {
                if (_isDestroyed) return;
                console.log('🔐 Verifying reset token...');
                await verifyToken();
                console.log('✅ Reset password page ready');
            })();

        })();
    </script>

</body>
</html>
