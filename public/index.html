<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الأسطول البحري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           🎨 STYLES - MARINE SYSTEM v23
           ============================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            background: #0a0e17;
            color: #e8edf5;
            min-height: 100vh;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }

        /* ===== LOGIN OVERLAY ===== */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10,14,23,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 24px 80px rgba(0,0,0,0.6);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 8px;
        }

        .login-box h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .login-box .subtitle {
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 24px;
        }

        .login-box .subtitle strong {
            color: rgba(255,255,255,0.5);
        }

        .login-box .form-group {
            margin-bottom: 16px;
        }

        .login-box .form-group label {
            display: block;
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 4px;
        }

        .login-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
        }

        .login-box .form-group input:focus {
            outline: none;
            border-color: rgba(96,165,250,0.3);
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 3px rgba(96,165,250,0.05);
        }

        .login-box .form-group input::placeholder {
            color: rgba(255,255,255,0.2);
        }

        .login-box .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-box .login-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 4px 24px rgba(96,165,250,0.3);
        }

        .login-box .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-box .login-error {
            color: #f87171;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(248,113,113,0.05);
            border: 1px solid rgba(248,113,113,0.1);
        }

        .login-box .demo-accounts {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.04);
            text-align: center;
        }

        .login-box .demo-accounts p {
            font-size: 12px;
            color: rgba(255,255,255,0.2);
            margin-bottom: 6px;
        }

        .login-box .demo-accounts .demo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
        }

        .login-box .demo-accounts .demo-item {
            font-size: 11px;
            color: rgba(255,255,255,0.15);
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255,255,255,0.02);
        }

        .login-box .demo-accounts .demo-item strong {
            color: rgba(255,255,255,0.3);
        }

        /* ===== MAIN APP ===== */
        #mainApp {
            display: none;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 260px;
            height: 100%;
            background: rgba(10,14,23,0.98);
            border-left: 1px solid rgba(255,255,255,0.04);
            padding: 20px 16px;
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .sidebar .sidebar-header h3 {
            font-size: 16px;
            font-weight: 700;
            color: rgba(255,255,255,0.8);
        }

        .sidebar .sidebar-header .close-sidebar {
            display: none;
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            font-size: 20px;
            cursor: pointer;
            margin-right: auto;
        }

        .sidebar .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar .sidebar-nav .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.4);
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            width: 100%;
        }

        .sidebar .sidebar-nav .nav-btn:hover {
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.7);
        }

        .sidebar .sidebar-nav .nav-btn.active {
            background: rgba(96,165,250,0.08);
            color: #60a5fa;
        }

        .sidebar .sidebar-nav .nav-btn .nav-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .sidebar .sidebar-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.04);
            font-size: 11px;
            color: rgba(255,255,255,0.15);
            text-align: center;
        }

        .sidebar .sidebar-footer strong {
            color: rgba(255,255,255,0.25);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-right: 260px;
            min-height: 100vh;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(10,14,23,0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar .topbar-left .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 24px;
            cursor: pointer;
        }

        .topbar .topbar-left .app-title {
            font-size: 16px;
            font-weight: 700;
            color: rgba(255,255,255,0.7);
        }

        .topbar .topbar-left .app-title span {
            color: #60a5fa;
        }

        .topbar .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar .topbar-right .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }

        .topbar .topbar-right .user-badge .role-badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            background: rgba(96,165,250,0.1);
            color: #60a5fa;
        }

        .topbar .topbar-right .logout-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            background: rgba(248,113,113,0.1);
            color: #f87171;
            font-family: 'Cairo', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .topbar .topbar-right .logout-btn:hover {
            background: rgba(248,113,113,0.2);
        }

        /* ===== PAGE CONTAINER ===== */
        .page-container {
            padding: 20px 24px;
        }

        .page-content {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(100%);
                width: 280px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar .sidebar-header .close-sidebar {
                display: block;
            }

            .main-content {
                margin-right: 0;
            }

            .topbar .topbar-left .menu-toggle {
                display: block;
            }
        }

        @media (max-width: 600px) {
            .login-box {
                padding: 24px;
            }

            .login-box h1 {
                font-size: 20px;
            }

            .topbar {
                padding: 10px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .topbar .topbar-left .app-title {
                font-size: 14px;
            }

            .topbar .topbar-right .user-badge {
                font-size: 12px;
            }

            .page-container {
                padding: 12px 16px;
            }

            .login-box .demo-accounts .demo-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== TOAST NOTIFICATIONS ===== */
        .toast-notification {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 500;
            z-index: 99999;
            max-width: 90%;
            text-align: center;
            background: rgba(10,14,23,0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid;
            animation: fadeInUp 0.3s ease;
        }

        .toast-notification.success {
            color: #4ade80;
            border-color: rgba(74,222,128,0.15);
        }

        .toast-notification.error {
            color: #f87171;
            border-color: rgba(248,113,113,0.15);
        }

        .toast-notification.warning {
            color: #fbbf24;
            border-color: rgba(251,191,36,0.15);
        }

        .toast-notification.info {
            color: #60a5fa;
            border-color: rgba(96,165,250,0.15);
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- ============================================================
         🔐 LOGIN OVERLAY
         ============================================================ -->
    <div id="loginOverlay">
        <div class="login-box">
            <div class="logo">⚓</div>
            <h1>منظومة الوسائل البحرية</h1>
            <p class="subtitle">
                نظام متابعة وإدارة الأسطول البحري<br>
                <strong>الوكيل أمان الله ناجي</strong>
            </p>
            
            <div class="form-group">
                <label>👤 اسم المستخدم</label>
                <input type="text" id="username" placeholder="admin" value="">
            </div>
            <div class="form-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            
            <button class="login-btn" onclick="doLogin()">🚀 دخول</button>
            <div class="login-error" id="loginError"></div>
            
            <div class="demo-accounts">
                <p>📝 حسابات تجريبية (كلمة المرور: 123456)</p>
                <div class="demo-grid">
                    <span class="demo-item"><strong>admin</strong> 👑 مسؤول</span>
                    <span class="demo-item"><strong>north</strong> 📍 محرر الشمال</span>
                    <span class="demo-item"><strong>coast</strong> 📍 محرر الساحل</span>
                    <span class="demo-item"><strong>viewer</strong> 👀 مشاهد</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
         🚀 MAIN APP
         ============================================================ -->
    <div id="mainApp">
        <!-- ===== SIDEBAR ===== -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
                <h3>⚓ منظومة الوسائل البحرية</h3>
            </div>
            
            <nav class="sidebar-nav">
                <button class="nav-btn active" onclick="showPage('dashboard')">
                    <span class="nav-icon">📊</span> لوحة التحكم
                </button>
                <button class="nav-btn" onclick="showPage('fleet')">
                    <span class="nav-icon">🚢</span> الأسطول
                </button>
                <button class="nav-btn" onclick="showPage('maintenance')">
                    <span class="nav-icon">🔧</span> الصيانة
                </button>
                <button class="nav-btn" onclick="showPage('efficiency')">
                    <span class="nav-icon">📈</span> الجاهزية
                </button>
                <button class="nav-btn" onclick="showPage('support')">
                    <span class="nav-icon">🎫</span> الدعم
                </button>
                <button class="nav-btn" onclick="showPage('tracking')">
                    <span class="nav-icon">📍</span> التتبع
                </button>
                <button class="nav-btn" onclick="showPage('map')">
                    <span class="nav-icon">🗺️</span> الخريطة
                </button>
                <button class="nav-btn" onclick="showPage('users')">
                    <span class="nav-icon">👥</span> المستخدمين
                </button>
                <button class="nav-btn" onclick="showPage('notes')">
                    <span class="nav-icon">📝</span> Note Verbale
                </button>
                <button class="nav-btn" onclick="showPage('sessions')">
                    <span class="nav-icon">🔄</span> المراقبة
                </button>
                <button class="nav-btn" onclick="showPage('ai-assistant')">
                    <span class="nav-icon">🤖</span> المساعد الذكي
                </button>
            </nav>
            
            <div class="sidebar-footer">
                <strong>الوكيل أمان الله ناجي</strong><br>
                <span style="font-size:10px; opacity:0.5;">الإصدار 23.0</span>
            </div>
        </div>

        <!-- ===== MAIN CONTENT ===== -->
        <div class="main-content">
            <!-- ===== TOP BAR ===== -->
            <div class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    <span class="app-title">⚓ <span>الأسطول البحري</span></span>
                </div>
                <div class="topbar-right">
                    <span class="user-badge" id="userRoleDisplay">
                        👤 <span id="userNameDisplay">مدير النظام</span>
                        <span class="role-badge" id="userRoleBadge">👑 مسؤول</span>
                    </span>
                    <button class="logout-btn" onclick="doLogout()">🚪 خروج</button>
                </div>
            </div>

            <!-- ===== PAGE CONTAINER ===== -->
            <div class="page-container" id="pageContainer">
                <!-- سيتم تحميل الصفحات هنا -->
            </div>
        </div>
    </div>

    <!-- ============================================================
         📜 JAVASCRIPT - تحميل app.js
         ============================================================ -->
    <script src="/js/app.js"></script>
</body>
</html>
