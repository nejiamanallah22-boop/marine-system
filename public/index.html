<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚓ منظومة الوسائل البحرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0e17;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #loginOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #062f24, #0a4b3a);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: #141b2d;
            padding: 40px;
            border-radius: 16px;
            width: 380px;
            max-width: 95%;
            text-align: center;
            border: 1px solid rgba(96,165,250,0.1);
        }
        .login-box h1 { color: #60a5fa; font-size: 24px; }
        .login-box .sub { color: #94a3b8; font-size: 14px; margin: 8px 0 20px; }
        .developer { color: #60a5fa; font-size: 13px; margin-bottom: 20px; }
        .input-group { margin-bottom: 14px; }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
        }
        .input-group input:focus { outline: none; border-color: #60a5fa; }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
        }
        .login-btn:hover { background: #3b82f6; }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg {
            color: #f87171;
            margin-top: 12px;
            padding: 8px;
            background: rgba(248,113,113,0.08);
            border-radius: 8px;
            display: none;
        }
        .error-msg.show { display: block; }
        .error-msg.success { color: #4ade80; background: rgba(74,222,128,0.08); }
        .version { color: #64748b; font-size: 12px; margin-top: 16px; }
        #mainApp { display: none; width: 100%; min-height: 100vh; flex-direction: column; }
        header {
            background: #0a4b3a;
            color: white;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar {
            position: fixed;
            top: 0; right: 0;
            width: 240px;
            height: 100%;
            background: #141b2d;
            padding-top: 70px;
            overflow-y: auto;
        }
        .sidebar-brand {
            position: absolute;
            top: 0; right: 0;
            width: 100%;
            padding: 16px 20px;
            background: #0a4b3a;
            color: white;
            font-size: 18px;
            font-weight: 700;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            border: none;
            background: transparent;
            width: 100%;
            color: #94a3b8;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.04); color: white; }
        .nav-btn.active { background: rgba(96,165,250,0.08); color: #60a5fa; }
        .main-content { margin-right: 240px; padding: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: #141b2d; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.04); }
        .stat-card .number { font-size: 28px; font-weight: 800; color: #60a5fa; }
        .stat-card .label { color: #94a3b8; font-size: 13px; }
        .table-wrapper { background: #141b2d; border-radius: 12px; padding: 16px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; color: #e2e8f0; }
        th { padding: 10px; text-align: right; color: #94a3b8; border-bottom: 1px solid rgba(255,255,255,0.04); }
        td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .role-badge { color: #60a5fa; }
        .btn-logout { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #f87171; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .btn-logout:hover { background: rgba(239,68,68,0.2); }
        @media (max-width: 768px) { .sidebar { transform: translateX(100%); } .main-content { margin-right: 0; } .sidebar.open { transform: translateX(0); } }
    </style>
</head>
<body>

    <!-- ===== شاشة تسجيل الدخول ===== -->
    <div id="loginOverlay">
        <div class="login-box">
            <h1>⚓ منظومة الوسائل البحرية</h1>
            <p class="sub">نظام متابعة وإدارة الأسطول البحري</p>
            <div class="developer">الوكيل أمان الله ناجي</div>
            <div class="input-group">
                <input type="text" id="username" placeholder="اسم المستخدم">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="كلمة المرور">
            </div>
            <button class="login-btn" id="loginButton">🚀 دخول</button>
            <div id="loginError" class="error-msg"></div>
            <div class="version">v41.0</div>
        </div>
    </div>

    <!-- ===== التطبيق الرئيسي ===== -->
    <div id="mainApp" style="display:none;">
        <header>
            <div style="display:flex;align-items:center;gap:14px;">
                <span onclick="toggleSidebar()" style="cursor:pointer;font-size:22px;">☰</span>
                <h1>⚓ منظومة الوسائل البحرية</h1>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <span id="userRoleDisplay" style="color:#60a5fa;">👤</span>
                <button class="btn-logout" onclick="doLogout()">🚪 خروج</button>
            </div>
        </header>

        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand">⚓ الأسطول البحري</div>
            <button class="nav-btn active" onclick="showPage('dashboard')">📊 لوحة التحكم</button>
            <button class="nav-btn" onclick="showPage('fleet')">🚢 الأسطول</button>
            <button class="nav-btn" onclick="showPage('maintenance')">🔧 الصيانة</button>
            <button class="nav-btn" onclick="showPage('users')">👥 المستخدمين</button>
        </nav>

        <div class="main-content">
            <div id="pageContainer">
                <div style="text-align:center;padding:40px;color:#94a3b8;">🚀 جاري التحميل...</div>
            </div>
        </div>
    </div>

    <!-- ============================================================
    📝 JAVASCRIPT - الكود البسيط الذي يعمل 100%
    ============================================================ -->
    <script>
        console.log('🚀 Marine System v41.0');

        // ============================================================
        // 📦 المتغيرات
        // ============================================================

        var currentUser = null;
        var authToken = null;
        var vessels = [];
        var users = [];

        // ============================================================
        // 🔐 تسجيل الدخول - ✅ يعمل 100%
        // ============================================================

        // ✅ ربط الزر بالدالة بعد تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 DOM ready');

            var loginBtn = document.getElementById('loginButton');

            if (loginBtn) {
                // ✅ ربط مباشر باستخدام onclick
                loginBtn.onclick = function() {
                    console.log('🖱️ زر الدخول تم الضغط عليه!');

                    var username = document.getElementById('username');
                    var password = document.getElementById('password');
                    var errorEl = document.getElementById('loginError');

                    var user = username.value.trim();
                    var pass = password.value.trim();

                    errorEl.className = 'error-msg';
                    errorEl.textContent = '';

                    if (!user || !pass) {
                        errorEl.textContent = '⚠️ يرجى إدخال اسم المستخدم وكلمة المرور';
                        errorEl.className = 'error-msg show';
                        return;
                    }

                    loginBtn.disabled = true;
                    loginBtn.textContent = '⏳ جاري...';

                    // ✅ ✅ ✅ إرسال الطلب إلى السيرفر
                    console.log('📡 إرسال طلب إلى: /api/auth/login');
                    console.log('👤 اسم المستخدم:', user);

                    fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            username: user,
                            password: pass
                        })
                    })
                    .then(function(response) {
                        console.log('📡 حالة الاستجابة:', response.status);
                        return response.json();
                    })
                    .then(function(data) {
                        console.log('📡 البيانات:', data);

                        loginBtn.disabled = false;
                        loginBtn.textContent = '🚀 دخول';

                        if (data.success) {
                            currentUser = data.user;
                            authToken = data.token;

                            localStorage.setItem('authToken', authToken);
                            localStorage.setItem('currentUser', JSON.stringify(currentUser));

                            // ✅ إخفاء شاشة الدخول
                            document.getElementById('loginOverlay').style.display = 'none';
                            document.getElementById('mainApp').style.display = 'flex';

                            // ✅ عرض اسم المستخدم
                            var display = document.getElementById('userRoleDisplay');
                            display.textContent = '👤 ' + (currentUser.name || currentUser.username);

                            // ✅ تحميل البيانات
                            loadAllData();
                            showPage('dashboard');

                            errorEl.textContent = '✅ مرحباً ' + (currentUser.name || user);
                            errorEl.className = 'error-msg show success';

                            console.log('✅ تم تسجيل الدخول بنجاح');

                        } else {
                            errorEl.textContent = '❌ ' + (data.error || 'بيانات الدخول غير صحيحة');
                            errorEl.className = 'error-msg show';
                            console.log('❌ فشل تسجيل الدخول');
                        }
                    })
                    .catch(function(error) {
                        loginBtn.disabled = false;
                        loginBtn.textContent = '🚀 دخول';
                        errorEl.textContent = '❌ خطأ في الاتصال: ' + error.message;
                        errorEl.className = 'error-msg show';
                        console.error('❌ خطأ:', error);
                    });
                };

                console.log('✅ زر الدخول مرتبط بالدالة');
            } else {
                console.error('❌ زر الدخول غير موجود!');
            }

            // ✅ ربط مفتاح Enter
            var passwordField = document.getElementById('password');
            if (passwordField) {
                passwordField.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        document.getElementById('loginButton').click();
                    }
                });
            }

            // ✅ التحقق من الجلسة
            var token = localStorage.getItem('authToken');
            var user = JSON.parse(localStorage.getItem('currentUser') || 'null');

            if (token && user) {
                currentUser = user;
                authToken = token;

                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';

                var display = document.getElementById('userRoleDisplay');
                display.textContent = '👤 ' + (user.name || user.username);

                loadAllData();
                showPage('dashboard');

                console.log('✅ تم استعادة الجلسة');
            }

            console.log('🔐 جاهز لاستقبال طلبات تسجيل الدخول');
        });

        // ============================================================
        // 🚪 تسجيل الخروج
        // ============================================================

        function doLogout() {
            currentUser = null;
            authToken = null;
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');

            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('loginOverlay').style.display = 'flex';

            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('loginError').className = 'error-msg';
        }

        // ============================================================
        // 📑 الصفحات
        // ============================================================

        function showPage(pageName) {
            document.querySelectorAll('.nav-btn').forEach(function(btn) {
                btn.classList.remove('active');
            });

            document.querySelectorAll('.nav-btn').forEach(function(btn) {
                if (btn.textContent.includes(pageName === 'dashboard' ? 'لوحة التحكم' : pageName)) {
                    btn.classList.add('active');
                }
            });

            if (pageName === 'dashboard') renderDashboard();
            else if (pageName === 'fleet') renderFleet();
            else if (pageName === 'maintenance') renderMaintenance();
            else if (pageName === 'users') renderUsers();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // ============================================================
        // 📊 تحميل البيانات
        // ============================================================

        function loadAllData() {
            loadVessels();
            loadUsers();
        }

        function loadVessels() {
            var token = localStorage.getItem('authToken');
            if (!token) return;

            fetch('/api/vessels', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    vessels = data.vessels || [];
                    if (document.querySelector('.page.active')?.id === 'page-fleet') renderFleet();
                    if (document.querySelector('.page.active')?.id === 'page-dashboard') renderDashboard();
                }
            })
            .catch(function(e) { console.error('❌ Vessels error:', e); });
        }

        function loadUsers() {
            var token = localStorage.getItem('authToken');
            if (!token) return;

            fetch('/api/users', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    users = data.users || [];
                    if (document.querySelector('.page.active')?.id === 'page-users') renderUsers();
                    if (document.querySelector('.page.active')?.id === 'page-dashboard') renderDashboard();
                }
            })
            .catch(function(e) { console.error('❌ Users error:', e); });
        }

        // ============================================================
        // 📊 لوحة التحكم
        // ============================================================

        function renderDashboard() {
            var container = document.getElementById('pageContainer');
            var total = vessels.length;
            var ok = vessels.filter(function(v) { return v.stat === 'صالح'; }).length;
            var broken = vessels.filter(function(v) { return v.stat === 'معطب'; }).length;
            var maint = vessels.filter(function(v) { return v.stat === 'صيانة'; }).length;
            var efficiency = total ? Math.round((ok / total) * 100) : 0;

            container.innerHTML = `
                <div class="page active" id="page-dashboard">
                    <h2 style="color:#60a5fa;margin-bottom:16px;">📊 لوحة التحكم</h2>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="number">${total}</div><div class="label">🚢 إجمالي المراكب</div></div>
                        <div class="stat-card"><div class="number">${ok}</div><div class="label">✅ الصالح</div></div>
                        <div class="stat-card"><div class="number">${maint}</div><div class="label">🔧 تحت الصيانة</div></div>
                        <div class="stat-card"><div class="number">${broken}</div><div class="label">❌ المعطوب</div></div>
                        <div class="stat-card"><div class="number">${efficiency}%</div><div class="label">📈 نسبة الجاهزية</div></div>
                        <div class="stat-card"><div class="number">${users.length}</div><div class="label">👥 المستخدمين</div></div>
                    </div>
                    <button class="login-btn" onclick="showPage('fleet')" style="width:auto;padding:10px 20px;">⚓ إدارة الأسطول</button>
                </div>
            `;
        }

        // ============================================================
        // ⚓ الأسطول
        // ============================================================

        function renderFleet() {
            var container = document.getElementById('pageContainer');
            var html = `
                <div class="page active" id="page-fleet">
                    <h2 style="color:#60a5fa;margin-bottom:16px;">⚓ الأسطول البحري</h2>
                    <div class="form-card" style="background:#141b2d;border-radius:12px;padding:16px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.04);">
                        <h3 style="color:#60a5fa;margin-bottom:12px;">➕ إضافة مركب</h3>
                        <form id="vesselForm" onsubmit="handleAddVessel(event)" style="display:flex;gap:10px;flex-wrap:wrap;">
                            <input type="text" id="vesselName" placeholder="الاسم" style="flex:1;min-width:120px;padding:8px 12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:#fff;">
                            <input type="text" id="vesselNum" placeholder="الرقم" style="flex:1;min-width:120px;padding:8px 12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:#fff;">
                            <select id="vesselStatus" style="padding:8px 12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:#fff;">
                                <option value="صالح">✅ صالح</option>
                                <option value="صيانة">🔧 صيانة</option>
                                <option value="معطب">❌ معطب</option>
                            </select>
                            <button type="submit" style="padding:8px 16px;background:#2563eb;border:none;border-radius:6px;color:#fff;cursor:pointer;">➕</button>
                        </form>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead><tr><th>الاسم</th><th>الرقم</th><th>الحالة</th><th>الإقليم</th><th>إجراء</th></tr></thead>
                            <tbody>
                    `;

            if (!vessels.length) {
                html += `<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px;">🚢 لا توجد مراكب</td></tr>`;
            } else {
                vessels.forEach(function(v) {
                    var statusColor = v.stat === 'صالح' ? '#4ade80' : v.stat === 'صيانة' ? '#fbbf24' : '#f87171';
                    html += `<tr>
                        <td><strong>${v.name || '-'}</strong></td>
                        <td>${v.num || '-'}</td>
                        <td style="color:${statusColor}">${v.stat || 'غير محدد'}</td>
                        <td>${v.region || '-'}</td>
                        <td><button onclick="deleteVessel('${v._id}')" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#f87171;padding:4px 10px;border-radius:4px;cursor:pointer;">🗑️</button></td>
                    </tr>`;
                });
            }

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        async function handleAddVessel(e) {
            e.preventDefault();
            var vessel = {
                name: document.getElementById('vesselName').value.trim(),
                num: document.getElementById('vesselNum').value.trim(),
                stat: document.getElementById('vesselStatus').value,
                region: 'الشمال'
            };

            if (!vessel.name || !vessel.num) {
                alert('⚠️ يرجى إدخال الاسم والرقم');
                return;
            }

            var token = localStorage.getItem('authToken');
            try {
                var response = await fetch('/api/vessels', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(vessel)
                });
                var data = await response.json();
                if (data.success) {
                    loadVessels();
                    document.getElementById('vesselForm').reset();
                } else {
                    alert('❌ ' + (data.error || 'فشل الإضافة'));
                }
            } catch (error) {
                alert('❌ خطأ في الاتصال');
            }
        }

        async function deleteVessel(id) {
            if (!confirm('هل أنت متأكد من الحذف؟')) return;
            var token = localStorage.getItem('authToken');
            try {
                await fetch('/api/vessels/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                loadVessels();
            } catch (error) {
                alert('❌ فشل الحذف');
            }
        }

        // ============================================================
        // 🛠️ الصيانة
        // ============================================================

        function renderMaintenance() {
            var container = document.getElementById('pageContainer');
            var broken = vessels.filter(function(v) { return v.stat === 'معطب' || v.stat === 'صيانة'; });

            var html = `
                <div class="page active" id="page-maintenance">
                    <h2 style="color:#60a5fa;margin-bottom:16px;">🛠️ سجل الصيانة</h2>
                    <div class="table-wrapper">
                        <table>
                            <thead><tr><th>الاسم</th><th>الرقم</th><th>الحالة</th><th>الإقليم</th></tr></thead>
                            <tbody>
                    `;

            if (!broken.length) {
                html += `<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:20px;">✅ لا توجد مراكب معطوبة</td></tr>`;
            } else {
                broken.forEach(function(v) {
                    var statusColor = v.stat === 'صيانة' ? '#fbbf24' : '#f87171';
                    html += `<tr>
                        <td><strong>${v.name || '-'}</strong></td>
                        <td>${v.num || '-'}</td>
                        <td style="color:${statusColor}">${v.stat || 'غير محدد'}</td>
                        <td>${v.region || '-'}</td>
                    </tr>`;
                });
            }

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // ============================================================
        // 👥 المستخدمين
        // ============================================================

        function renderUsers() {
            var container = document.getElementById('pageContainer');

            var html = `
                <div class="page active" id="page-users">
                    <h2 style="color:#60a5fa;margin-bottom:16px;">👥 المستخدمين</h2>
                    <div class="table-wrapper">
                        <table>
                            <thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>الحالة</th></tr></thead>
                            <tbody>
                    `;

            if (!users.length) {
                html += `<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:20px;">👥 لا توجد مستخدمين</td></tr>`;
            } else {
                var roles = { 'admin': 'مسؤول', 'manager': 'مدير', 'operator': 'مشغل', 'viewer': 'مشاهد' };
                users.forEach(function(u) {
                    var roleName = roles[u.role] || u.role || 'مشاهد';
                    var statusColor = u.isActive !== false ? '#4ade80' : '#f87171';
                    html += `<tr>
                        <td><strong>${u.name || u.username || '-'}</strong></td>
                        <td>${u.email || '-'}</td>
                        <td>${roleName}</td>
                        <td style="color:${statusColor}">${u.isActive !== false ? '🟢 نشط' : '🔴 معطل'}</td>
                    </tr>`;
                });
            }

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // ============================================================
        // ✅ ربط الدوال للنطاق العام
        // ============================================================

        window.showPage = showPage;
        window.toggleSidebar = toggleSidebar;
        window.doLogout = doLogout;
        window.handleAddVessel = handleAddVessel;
        window.deleteVessel = deleteVessel;

        console.log('✅ Marine System v41.0 ready');
        console.log('🔐 جاهز لتسجيل الدخول');
    </script>

</body>
</html>
