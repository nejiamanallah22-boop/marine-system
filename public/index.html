<!-- public/index.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚓ منظومة الوسائل البحرية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>

    <style>
        /* ============================================================
           🎨 التصميم المتكامل - جميع الأنماط في ملف واحد
           ============================================================ */

        /* ===== الأساسيات ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0a4b3a;
            --primary-light: #1a7a5a;
            --primary-dark: #062f24;
            --secondary: #2c3e50;
            --accent: #e67e22;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --info: #3498db;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --text: #333;
            --text-light: #7f8c8d;
            --bg: #f0f4f8;
            --border: #ddd;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --transition: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            direction: rtl;
            display: flex;
        }

        /* ===== شاشة تسجيل الدخول ===== */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #062f24, #0a4b3a, #1a7a5a);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .login-box {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 45px 40px 35px;
            border-radius: 24px;
            width: 420px;
            max-width: 95%;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .login-logo .logo-icon {
            font-size: 42px;
        }

        .login-logo .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
        }

        .subtitle {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 18px;
        }

        .developer {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #ffd700, #f0c000);
            padding: 4px 18px 4px 14px;
            border-radius: 30px;
            margin-bottom: 22px;
            font-weight: 700;
            color: var(--primary-dark);
            font-size: 13px;
        }

        .dev-label {
            background: var(--primary);
            color: white;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 11px;
        }

        .dev-name {
            font-size: 14px;
        }

        .input-group {
            position: relative;
            margin-bottom: 14px;
        }

        .input-group .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 45px 12px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            transition: var(--transition);
            background: #f8fafc;
            font-family: 'Cairo', sans-serif;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(10, 75, 58, 0.1);
            background: white;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Cairo', sans-serif;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(10, 75, 58, 0.3);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-btn.loading .spinner {
            display: inline-block;
        }

        .login-btn.loading #loginButtonIcon,
        .login-btn.loading #loginButtonText {
            display: none;
        }

        .error-msg {
            color: var(--danger);
            font-size: 14px;
            margin-top: 12px;
            display: none;
            padding: 8px 12px;
            background: #fde8e8;
            border-radius: 8px;
        }

        .error-msg.show {
            display: block;
        }

        .login-footer {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-light);
        }

        .login-footer .version {
            background: var(--light);
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 600;
            color: var(--primary);
        }

        /* ===== التطبيق الرئيسي ===== */
        #mainApp {
            display: none;
            width: 100%;
            min-height: 100vh;
            flex-direction: column;
        }

        /* ===== الهيدر ===== */
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.15);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-toggle {
            font-size: 22px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 8px;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.08);
        }

        .menu-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        header h1 {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header h1 span:first-child {
            font-size: 22px;
        }

        .developer-tag {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: 400;
            margin-right: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .notification-icon {
            position: relative;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 6px;
            border-radius: 50%;
            transition: var(--transition);
        }

        .notification-icon:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .notification-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .role-badge {
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
            white-space: nowrap;
        }

        .btn-outline-white {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-outline-white:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-logout {
            color: #ffcdd2;
            border-color: rgba(255, 205, 210, 0.2);
        }

        .btn-logout:hover {
            background: rgba(231, 76, 60, 0.2);
            color: white;
        }

        /* ===== السايدبار ===== */
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 260px;
            height: 100%;
            background: white;
            box-shadow: 2px 0 30px rgba(0, 0, 0, 0.08);
            transform: translateX(0);
            transition: transform 0.3s ease;
            z-index: 999;
            padding-top: 70px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar.closed {
            transform: translateX(100%);
        }

        .sidebar-brand {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            padding: 16px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-brand span:first-child {
            font-size: 24px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            border: none;
            background: transparent;
            width: 100%;
            text-align: right;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Cairo', sans-serif;
            border-right: 3px solid transparent;
        }

        .nav-btn:hover {
            background: #f0f4f8;
            color: var(--primary);
        }

        .nav-btn.active {
            background: #e8f5e9;
            color: var(--primary);
            border-right-color: var(--primary);
        }

        .nav-btn i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
        }

        /* ===== المحتوى الرئيسي ===== */
        .main-content {
            margin-right: 260px;
            padding: 20px 24px 30px;
            flex: 1;
            min-height: 100vh;
            background: var(--bg);
            transition: margin-right 0.3s ease;
        }

        .sidebar.closed ~ .main-content {
            margin-right: 0;
        }

        /* ===== الصفحات ===== */
        .page {
            display: none;
            animation: fadePage 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadePage {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== البطاقات الإحصائية ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: var(--radius);
            padding: 18px 20px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-card .label {
            font-size: 13px;
            color: var(--text-light);
            display: block;
            margin-top: 4px;
        }

        .stat-card .icon {
            font-size: 24px;
            display: block;
            margin-bottom: 6px;
        }

        /* ===== الفلاتر ===== */
        .filter-bar {
            background: white;
            padding: 12px 18px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .filter-bar label {
            font-weight: 600;
            color: var(--primary);
            font-size: 13px;
        }

        .filter-bar input,
        .filter-bar select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 13px;
            background: white;
            font-family: 'Cairo', sans-serif;
        }

        .filter-bar .search-input {
            flex: 1;
            min-width: 160px;
        }

        .filter-bar .search-input input {
            width: 100%;
            padding: 8px 16px;
            border-radius: 30px;
        }

        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Cairo', sans-serif;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-success:hover {
            background: #1e8449;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }
        .btn-warning:hover {
            background: #d68910;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            background: var(--light);
        }

        .btn-sm {
            padding: 3px 10px;
            font-size: 12px;
        }

        /* ===== الجداول ===== */
        .table-wrapper {
            overflow-x: auto;
            background: white;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 600px;
        }

        thead {
            background: #f8fafc;
            border-bottom: 2px solid var(--border);
        }

        th {
            padding: 10px 12px;
            text-align: right;
            font-weight: 700;
            color: #334155;
            font-size: 12px;
            white-space: nowrap;
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }

        tr:hover td {
            background: #fafcff;
        }

        .status-badge {
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .status-badge.active {
            background: #dcfce7;
            color: #166534;
        }
        .status-badge.inactive {
            background: #fee2e2;
            color: #991b1b;
        }
        .status-badge.maintenance {
            background: #fef3c7;
            color: #92400e;
        }
        .status-badge.repair {
            background: #fce4ec;
            color: #9a1f3d;
        }

        /* ===== النماذج ===== */
        .form-card {
            background: white;
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .form-card h3 {
            font-size: 17px;
            color: var(--primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #334155;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            transition: 0.2s;
            background: white;
            font-family: 'Cairo', sans-serif;
            width: 100%;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(10, 75, 58, 0.08);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        /* ===== التذاكر ===== */
        .ticket-list {
            display: grid;
            gap: 10px;
        }

        .ticket-item {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            transition: var(--transition);
        }

        .ticket-item:hover {
            border-color: var(--primary-light);
        }

        .ticket-info {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }

        .ticket-title {
            font-weight: 600;
        }

        .ticket-date {
            color: var(--text-light);
            font-size: 12px;
        }

        .priority-high {
            color: var(--danger);
            font-weight: 600;
        }
        .priority-medium {
            color: var(--warning);
            font-weight: 600;
        }
        .priority-low {
            color: var(--success);
            font-weight: 600;
        }

        /* ===== GPS والخريطة ===== */
        .gps-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .gps-map {
            background: #e9eef3;
            border-radius: var(--radius);
            height: 420px;
            border: 2px dashed var(--border);
            position: relative;
            overflow: hidden;
        }

        .gps-map .map-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-light);
            text-align: center;
        }

        .gps-map .map-placeholder .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .gps-sidebar {
            background: white;
            border-radius: var(--radius);
            padding: 18px 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .gps-sidebar h4 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--primary);
        }

        .gps-user-list {
            list-style: none;
            padding: 0;
        }

        .gps-user-list li {
            padding: 6px 0;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .gps-user-list .online-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
            margin-left: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .gps-controls {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ===== الرسوم البيانية ===== */
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .chart-box {
            background: white;
            border-radius: var(--radius);
            padding: 18px 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .chart-box h4 {
            text-align: center;
            margin-bottom: 12px;
            color: var(--primary);
            font-size: 15px;
        }

        canvas {
            max-height: 280px;
            width: 100% !important;
        }

        /* ===== الإشعارات ===== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 450px;
            margin: 0 auto;
            z-index: 9999;
        }

        .toast {
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            animation: slideUp 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast-success {
            background: var(--success);
        }
        .toast-error {
            background: var(--danger);
        }
        .toast-warning {
            background: var(--warning);
        }
        .toast-info {
            background: var(--primary);
        }

        .toast .toast-icon {
            font-size: 20px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== أزرار التمرير ===== */
        .scroll-buttons {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 999;
        }

        .scroll-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scroll-btn:hover {
            transform: scale(1.1);
            background: var(--primary-dark);
        }

        /* ===== المودال ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: white;
            padding: 30px 35px;
            border-radius: 18px;
            width: 450px;
            max-width: 95%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        .modal-box h3 {
            color: var(--primary);
            margin-bottom: 8px;
        }

        .modal-box input,
        .modal-box textarea {
            width: 100%;
            padding: 10px 14px;
            margin: 10px 0;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
        }

        .modal-box input:focus,
        .modal-box textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 14px;
        }

        /* ===== استجابة للشاشات الصغيرة ===== */
        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-right: 0;
            }
            .gps-container {
                grid-template-columns: 1fr;
            }
            .gps-map {
                height: 300px;
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 15px;
                flex-wrap: wrap;
            }
            .developer-tag {
                display: none;
            }
            .header-right {
                gap: 6px;
            }
            .btn-outline-white {
                padding: 4px 10px;
                font-size: 12px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .login-box {
                padding: 30px 20px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .chart-grid {
                grid-template-columns: 1fr;
            }
            .modal-box {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .stat-card .number {
                font-size: 22px;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-bar .search-input {
                min-width: unset;
            }
            .ticket-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .gps-controls {
                flex-direction: column;
            }
            .gps-controls .btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* ===== الطباعة ===== */
        @media print {
            .sidebar,
            .scroll-buttons,
            .btn,
            .btn-sm,
            .filter-bar,
            .form-card,
            .header-right .btn-outline-white:not(.btn-logout) {
                display: none !important;
            }
            body {
                background: white !important;
                padding: 10px !important;
            }
            .main-content {
                margin: 0 !important;
                padding: 10px !important;
            }
            .table-wrapper {
                border: 1px solid #ddd !important;
            }
            @page {
                size: landscape;
                margin: 1cm;
            }
        }

        /* ===== أدوات مساعدة ===== */
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .mb-16 {
            margin-bottom: 16px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .gap-8 {
            gap: 8px;
        }

        /* ===== الرسوم البيانية في الصفحة الرئيسية ===== */
        .dashboard-charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .dashboard-charts .chart-box {
            min-height: 250px;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 16px 0;
        }

        .quick-actions .btn {
            padding: 10px 20px;
            font-size: 14px;
        }

        .ai-chat-box {
            background: white;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 16px;
            max-height: 350px;
            overflow-y: auto;

        }

        .ai-chat-box .msg {

        }

        }

            font-size: 10px;
            opacity: 0.6;
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- ===== شاشة تسجيل الدخول ===== -->
    <div id="loginOverlay">
        <div class="login-box">

    </div>

    <!-- ===== التطبيق الرئيسي ===== -->
    <div id="mainApp" style="display:none;">

        <header>

                <span class="menu-toggle" onclick="toggleSidebar()">☰</span>

            </button>

            </button>

            </button>

            </button>

        <!-- CONTENT -->

            <div id="pageContainer">
                <!-- ✅ لا نعيد التوجيه تلقائياً -->

                    console.log('🚀 Marine System ready - Please login');

    <!-- ===== أزرار التمرير ===== -->
    <div class="scroll-buttons">
        <button class="scroll-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">
            <i class="fas fa-chevron-up"></i>
        </button>
        <button class="scroll-btn" onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">
            <i class="fas fa-chevron-down"></i>
        </button>
    </div>

    <!-- ===== الإشعارات ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    📝 JavaScript - كل المنطق في ملف واحد
    ============================================================ -->
    <script>
        /**
         * ============================================================
         * ⚓ منظومة الوسائل البحرية - الكود الكامل
         * 📌 الإصدار: 5.0
         * ============================================================
         */

        // ============================================================
        // 📦 المتغيرات العامة
        // ============================================================

        let currentUser = null;
        let authToken = null;
        let socket = null;
        let trackingActive = false;
        let watchId = null;
        let vessels = [];
        let users = [];
        let tickets = [];
        let logs = [];
        let onlineUsers = [];
        let locations = [];
        let notes = [];
        let sessions = [];
        let notifications = [];
        let dashboardChart = null;
        let efficiencyChart = null;
        let activePage = 'dashboard';

        // ============================================================
        // 🔐 المصادقة
        // ============================================================

        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginButton');

            errorEl.classList.remove('show');
            errorEl.textContent = '';

            if (!username || !password) {
                errorEl.textContent = '⚠️ يرجى إدخال اسم المستخدم وكلمة المرور';
                errorEl.classList.add('show');
                return;
            }

            // إظهار حالة التحميل
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || data.message || 'فشل تسجيل الدخول');
                }

                if (!data.user || !data.user.id) {
                    throw new Error('بيانات المستخدم غير مكتملة');
                }

                currentUser = data.user;
                authToken = data.token;

                // حفظ التوكن
                localStorage.setItem('token', authToken);
                localStorage.setItem('user', JSON.stringify(currentUser));

                // إظهار التطبيق
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';

                // تحديث واجهة المستخدم
                document.getElementById('userRoleDisplay').textContent = `👤 ${currentUser.name || currentUser.username} | ${currentUser.role || 'مستخدم'}`;

                // عرض الصفحة الأولى
                showPage('dashboard');

                // تحميل البيانات
                await loadAllData();

                // الاتصال بـ Socket.IO
                connectSocket();

                showToast('✅ مرحباً ' + (currentUser.name || currentUser.username), 'success');

                // تسجيل الدخول في السجلات
                await logActivity('تسجيل دخول', `قام بتسجيل الدخول إلى النظام`);

            } catch (error) {
                console.error('❌ خطأ في تسجيل الدخول:', error);
                errorEl.textContent = '⚠️ ' + error.message;
                errorEl.classList.add('show');
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        }

        function doLogout() {
            if (socket) {
                socket.disconnect();
                socket = null;
            }

            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            localStorage.removeItem('token');
            localStorage.removeItem('user');
            currentUser = null;
            authToken = null;

            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('loginOverlay').style.display = 'flex';

            showToast('👋 تم تسجيل الخروج', 'info');
        }

        // ============================================================
        // 🔌 Socket.IO
        // ============================================================

        function connectSocket() {
            if (socket && socket.connected) return;

            try {
                socket = io({
                    auth: { token: authToken },
                    transports: ['websocket', 'polling']
                });

                socket.on('connect', () => {
                    console.log('✅ متصل بـ Socket.IO');
                    if (currentUser) {
                        socket.emit('user-connected', { userName: currentUser.name || currentUser.username });
                    }
                });

                socket.on('online-users', (data) => {
                    onlineUsers = data.users || [];
                    updateOnlineUsers();
                });

                socket.on('receive-location', (data) => {
                    updateLocation(data);
                    addNotification(`📍 موقع جديد من ${data.userName || 'مستخدم'}`, 'info');
                });

                socket.on('vessel-added', () => {
                    loadVessels();
                    addNotification('🚢 تم إضافة مركب جديد', 'success');
                });

                socket.on('vessel-updated', () => {
                    loadVessels();
                    addNotification('📝 تم تحديث مركب', 'info');
                });

                socket.on('vessel-deleted', () => {
                    loadVessels();
                    addNotification('🗑️ تم حذف مركب', 'warning');
                });

                socket.on('disconnect', () => {
                    console.log('❌ قطع اتصال Socket.IO');
                });

            } catch (error) {
                console.error('❌ خطأ في Socket.IO:', error);
            }
        }

        // ============================================================
        // 📊 تحميل البيانات
        // ============================================================

        async function loadAllData() {
            try {
                await Promise.all([
                    loadVessels(),
                    loadUsers(),
                    loadTickets(),
                    loadLogs(),
                    loadNotes(),
                    loadSessions()
                ]);
                await loadStats();
            } catch (error) {
                console.error('❌ خطأ في تحميل البيانات:', error);
                showToast('⚠️ خطأ في تحميل بعض البيانات', 'error');
            }
        }

        async function loadVessels() {
            try {
                const response = await fetch('/api/vessels', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (response.ok) {
                    vessels = await response.json();
                    renderVessels();
                    renderMaintenance();
                    renderEfficiency();
                }
            } catch (error) {
                console.error('❌ خطأ في جلب المراكب:', error);
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/users', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (response.ok) {
                    users = await response.json();
                    renderUsers();
                }
            } catch (error) {
                console.error('❌ خطأ في جلب المستخدمين:', error);
            }
        }

        async function loadTickets() {
            try {
                const response = await fetch('/api/tickets', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (response.ok) {
                    tickets = await response.json();
                    renderTickets();
                }
            } catch (error) {
                console.error('❌ خطأ في جلب التذاكر:', error);
            }
        }

        async function loadLogs() {
            try {
                const response = await fetch('/api/security/logs?limit=50', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (response.ok) {
                    logs = await response.json();
                    renderLogs();
                }
            } catch (error) {
                console.error('❌ خطأ في جلب السجلات:', error);
            }
        }

        async function loadNotes() {
            try {
                const response = await fetch('/api/notes', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (response.ok) {
                    notes = await response.json();
                    renderNotes();
                }
            } catch (error) {
                console.error('❌ خطأ في جلب الملاحظات:', error);
            }
        }

        async function loadSessions() {
            try {
                const response = await fetch('/api/sessions', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (response.ok) {
                    sessions = await response.json();
                    renderSessions();
                }
            } catch (error) {
                console.error('❌ خطأ في جلب جلسات المستخدمين:', error);
            }
        }

        async function loadStats() {
            try {
                document.getElementById('statVessels').textContent = vessels.length || 0;
                document.getElementById('statUsers').textContent = users.length || 0;
                document.getElementById('statTickets').textContent = tickets.length || 0;
                document.getElementById('statOnline').textContent = onlineUsers.length || 0;
                document.getElementById('statLocations').textContent = locations.length || 0;
                updateNotificationsBadge();
            } catch (error) {
                console.error('❌ خطأ في تحديث الإحصائيات:', error);
            }
        }

        // ============================================================
        // 📊 عرض البيانات - الصفحات
        // ============================================================

        // ===== لوحة التحكم =====
        function renderDashboard() {
            const container = document.getElementById('pageContainer');
            const total = vessels.length;
            const ok = vessels.filter(v => v.stat === 'صالح').length;
            const maint = vessels.filter(v => v.stat === 'صيانة').length;
            const broken = vessels.filter(v => v.stat === 'معطب').length;
            const efficiency = total ? Math.round((ok / total) * 100) : 0;

            container.innerHTML = `
                <div class="page active" id="page-dashboard">
                    <div class="flex-between mb-16">
                        <h2 style="color:var(--primary);">📊 لوحة التحكم</h2>
                        <span style="font-size:13px;color:var(--text-light);">آخر تحديث: ${new Date().toLocaleString('ar')}</span>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <span class="icon">🚢</span>
                            <span class="number">${total}</span>
                            <span class="label">إجمالي المراكب</span>
                        </div>
                        <div class="stat-card">
                            <span class="icon">✅</span>
                            <span class="number">${ok}</span>
                            <span class="label">الصالح</span>
                        </div>
                        <div class="stat-card">
                            <span class="icon">🔧</span>
                            <span class="number">${maint}</span>
                            <span class="label">تحت الصيانة</span>
                        </div>
                        <div class="stat-card">
                            <span class="icon">❌</span>
                            <span class="number">${broken}</span>
                            <span class="label">المعطوب</span>
                        </div>
                        <div class="stat-card">
                            <span class="icon">📈</span>
                            <span class="number">${efficiency}%</span>
                            <span class="label">نسبة الجاهزية</span>
                        </div>
                        <div class="stat-card">
                            <span class="icon">👥</span>
                            <span class="number">${users.length}</span>
                            <span class="label">المستخدمين</span>
                        </div>
                    </div>

                    <div class="quick-actions">
                        <button class="btn btn-primary" onclick="showPage('fleet')">⚓ إدارة الأسطول</button>
                        <button class="btn btn-success" onclick="showPage('maintenance')">🛠️ سجل الصيانة</button>
                        <button class="btn btn-warning" onclick="showPage('support')">📞 الدعم الفني</button>
                        <button class="btn btn-info" style="background:#3498db;color:white;" onclick="showPage('ai-assistant')">🤖 المساعد الذكي</button>
                    </div>

                    <div class="dashboard-charts">
                        <div class="chart-box">
                            <h4>📊 حالة الأسطول</h4>
                            <canvas id="dashboardChart"></canvas>

        function renderEfficiency() {
            const total = vessels.length;
            const ok = vessels.filter(v => v.stat === 'صالح').length;
            const maint = vessels.filter(v => v.stat === 'صيانة').length;
            const broken = vessels.filter(v => v.stat === 'معطب').length;
            const percent = total ? Math.round((ok / total) * 100) : 0;

            // تحديث الأرقام
            document.getElementById('effTotal').textContent = total;
            document.getElementById('effOk').textContent = ok;
            document.getElementById('effMaint').textContent = maint;
            document.getElementById('effBroken').textContent = broken;
            document.getElementById('effPercent').textContent = percent + '%';

            // الرسم البياني
            const ctx = document.getElementById('efficiencyChart');
            if (ctx) {
                if (efficiencyChart) efficiencyChart.destroy();
                efficiencyChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['صالح', 'صيانة', 'معطب'],
                        datasets: [{
                            data: [ok, maint, broken],
                            backgroundColor: ['#27ae60', '#f39c12', '#e74c3c'],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
            }

            // جدول الفئات
            const tbody = document.getElementById('effTableBody');
            if (!tbody) return;

            const cats = ['البروق', 'صقور', 'خوافر', 'زوارق مزدوجة', 'طوافات'];
            tbody.innerHTML = cats.map(cat => {
                const catVessels = vessels.filter(v => v.cat === cat);
                const catOk = catVessels.filter(v => v.stat === 'صالح').length;
                const catBroken = catVessels.filter(v => v.stat !== 'صالح').length;
                const catPercent = catVessels.length ? Math.round((catOk / catVessels.length) * 100) : 0;
                const rowClass = catPercent >= 80 ? 'high-eff' : (catPercent >= 50 ? 'mid-eff' : 'low-eff');

                return `
                    <tr class="${rowClass}">
                        <td>${cat}</td>
                        <td style="color:green;font-weight:bold;">${catOk}</td>
                        <td style="color:red;font-weight:bold;">${catBroken}</td>
                        <td><strong>${catPercent}%</strong></td>
                    </tr>
                `;
            }).join('');
        }

        async function askAI() {
            const input = document.getElementById('aiInput');

            if (!query) {
                showToast('⚠️ يرجى كتابة سؤال', 'warning');

            chatBox.appendChild(userMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            input.value = '';

            try {

                const response = await generateAIResponse(query);

                const aiMsg = document.createElement('div');
                aiMsg.className = 'msg ai';

            } finally {

            }

        async function generateAIResponse(query) {
            // تحليل السؤال وإرجاع إجابة مناسبة
            const q = query.toLowerCase();

            if (q.includes('إحصائيات') || q.includes('الأسطول') || q.includes('عدد المراكب')) {
                const total = vessels.length;
                const ok = vessels.filter(v => v.stat === 'صالح').length;
                const maint = vessels.filter(v => v.stat === 'صيانة').length;
                const broken = vessels.filter(v => v.stat === 'معطب').length;
                const percent = total ? Math.round((ok / total) * 100) : 0;
                return `📊 <b>إحصائيات الأسطول</b><br>
                🚢 إجمالي المراكب: <b>${total}</b><br>
                ✅ الصالح: <b>${ok}</b><br>
                🔧 تحت الصيانة: <b>${maint}</b><br>
                ❌ المعطوب: <b>${broken}</b><br>
                📈 نسبة الجاهزية: <b>${percent}%</b>`;
            }

            if (q.includes('معطوب') || q.includes('عطل') || q.includes('الصيانة')) {
                const broken = vessels.filter(v => v.stat === 'معطب' || v.stat === 'صيانة');
                if (!broken.length) {
                    return '✅ <b>لا توجد مراكب معطوبة حالياً</b><br>جميع المراكب في حالة جيدة.';
                }
                return `🛠️ <b>قائمة المراكب المعطوبة/تحت الصيانة (${broken.length}):</b><br>
                ${broken.map(v => `• ${v.name} (${v.num || 'رقم غير محدد'}) - الحالة: ${v.stat}${v.break ? ` - العطب: ${v.break}` : ''}`).join('<br>')}`;
            }

            if (q.includes('جاهزية') || q.includes('نجاعة') || q.includes('نسبة')) {
                const total = vessels.length;
                const ok = vessels.filter(v => v.stat === 'صالح').length;
                const percent = total ? Math.round((ok / total) * 100) : 0;

                let status = '';
                if (percent >= 80) status = '🟢 <b>ممتازة</b>';
                else if (percent >= 60) status = '🟡 <b>جيدة</b>';
                else status = '🔴 <b>ضعيفة - تحتاج إلى تحسين</b>';

                return `📈 <b>نسبة الجاهزية: ${percent}%</b><br>
                التقييم: ${status}<br>
                ✅ الصالح: ${ok} من ${total}`;
            }

            if (q.includes('تقرير') || q.includes('صيانة')) {
                const total = vessels.length;
                const ok = vessels.filter(v => v.stat === 'صالح').length;
                const maint = vessels.filter(v => v.stat === 'صيانة').length;
                const broken = vessels.filter(v => v.stat === 'معطب').length;
                const percent = total ? Math.round((ok / total) * 100) : 0;

                return `📋 <b>تقرير حالة الأسطول</b><br>
                📅 التاريخ: ${new Date().toLocaleDateString('ar')}<br>
                🚢 إجمالي المراكب: ${total}<br>
                ✅ الصالح: ${ok}<br>
                🔧 تحت الصيانة: ${maint}<br>
                ❌ المعطوب: ${broken}<br>
                📈 نسبة الجاهزية: ${percent}%<br><br>
                ${percent >= 80 ? '✅ الأسطول في حالة جيدة.' : percent >= 60 ? '⚠️ يوصى بإجراء صيانة لبعض المراكب.' : '🚨 يحتاج الأسطول إلى تدخل عاجل!'}`;
            }

            // إجابة عامة
            return `📌 <b>معلومات عامة عن الأسطول</b><br>
            🚢 عدد المراكب: <b>${vessels.length}</b><br>
            👥 عدد المستخدمين: <b>${users.length}</b><br>
            📋 عدد التذاكر المفتوحة: <b>${tickets.filter(t => t.status !== 'closed').length}</b><br>
            🟢 المستخدمون المتصلون: <b>${onlineUsers.length}</b><br><br>
            💡 يمكنك طرح أسئلة مثل:<br>
            • "إحصائيات الأسطول"<br>
            • "المراكب المعطوبة"<br>
            • "نسبة الجاهزية"<br>
            • "تقرير الصيانة"`;
        }

        // ============================================================
        // 📍 GPS والتتبع
        // ============================================================

        function startTracking() {
            if (!navigator.geolocation) {
                showToast('❌ جهازك لا يدعم تحديد الموقع', 'error');
                return;
            }

            if (trackingActive) {
                showToast('⚠️ التتبع مفعل بالفعل', 'warning');
                return;
            }

            trackingActive = true;
            const statusEl = document.getElementById('gpsStatus');
            if (statusEl) {
                statusEl.textContent = '🟢 جاري التتبع...';
                statusEl.style.color = '#27ae60';
            }

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const { latitude, longitude } = position.coords;
                    if (statusEl) {
                        statusEl.textContent = `📍 ${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
                    }
                    document.getElementById('lastLocation').textContent =
                        `📍 ${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;

                    if (socket && socket.connected) {
                        socket.emit('send-location', {
                            lat: latitude,
                            lng: longitude,
                            userName: currentUser?.name || currentUser?.username || 'مستخدم'
                        });
                    }

                    fetch('/api/locations', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + authToken
                        },
                        body: JSON.stringify({
                            lat: latitude,
                            lng: longitude,
                            userName: currentUser?.name || currentUser?.username || 'مستخدم'
                        })
                    }).catch(err => console.error('خطأ في حفظ الموقع:', err));
                },
                (error) => {
                    console.error('خطأ في تحديد الموقع:', error);
                    showToast('❌ فشل تحديد الموقع: ' + error.message, 'error');
                    stopTracking();
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
            );

            showToast('📍 بدء التتبع المباشر', 'success');
        }

        function stopTracking() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            trackingActive = false;
            const statusEl = document.getElementById('gpsStatus');
            if (statusEl) {
                statusEl.textContent = '⏸️ تم إيقاف التتبع';
                statusEl.style.color = '#94a3b8';
            }
            showToast('⏹️ تم إيقاف التتبع', 'info');
        }

        function updateLocation(data) {
            const statusEl = document.getElementById('gpsStatus');
            const lastLocEl = document.getElementById('lastLocation');

            if (data.lat && data.lng && statusEl) {
                statusEl.textContent = `📍 ${data.userName || 'مستخدم'} - ${data.lat.toFixed(6)}, ${data.lng.toFixed(6)}`;
                statusEl.style.color = '#27ae60';
                if (lastLocEl) {
                    lastLocEl.textContent = `📌 ${data.userName || 'مستخدم'}: ${data.lat.toFixed(6)}, ${data.lng.toFixed(6)}`;
                }
            }
        }

        // ============================================================

        function addNotification(message, type = 'info') {
            notifications.push({ message, type, time: new Date() });
            updateNotificationsBadge();
            showToast(message, type);
        }

        function updateNotificationsBadge() {
            const badge = document.getElementById('notificationBadge');
            if (badge) {
                const count = notifications.filter(n => !n.read).length;
                badge.textContent = count;
                badge.style.display = count > 0 ? 'flex' : 'none';
            }
        }

        function toggleNotifications() {
            // عرض الإشعارات
            const count = notifications.filter(n => !n.read).length;
            if (count === 0) {
                showToast('📭 لا توجد إشعارات جديدة', 'info');
                return;
            }

            notifications.forEach(n => n.read = true);
            updateNotificationsBadge();

            const messages = notifications.slice(-5).map(n =>
                `${n.type === 'success' ? '✅' : n.type === 'error' ? '❌' : n.type === 'warning' ? '⚠️' : 'ℹ️'} ${n.message}`
            ).join('\n');

            alert('📬 الإشعارات:\n\n' + messages);
        }

        // ============================================================
        // 🍞 الإشعارات المنبثقة
        // ============================================================

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };

            toast.innerHTML = `<span class="toast-icon">${icons[type] || 'ℹ️'}</span> ${message}`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ============================================================
        // 📝 تسجيل النشاطات
        // ============================================================

        async function logActivity(action, details) {
            if (!currentUser) return;
            try {
                await fetch('/api/logs', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + authToken
                    },
                    body: JSON.stringify({
                        action,
                        details,
                        user: { id: currentUser.id, name: currentUser.name || currentUser.username }
                    })
                });
            } catch (error) {
                console.error('❌ خطأ في تسجيل النشاط:', error);
            }
        }

        // ============================================================
        // 🔄 تحديث لوحة التحكم
        // ============================================================

        function updateDashboard() {
            if (activePage === 'dashboard') {
                renderDashboard();
            }
        }

        // ============================================================
        // 📑 التنقل بين الصفحات
        // ============================================================

        function showPage(pageName) {
            activePage = pageName;

            // تحديث الأزرار في السايدبار
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.textContent.trim().includes(getPageTitle(pageName))) {
                    btn.classList.add('active');
                }
            });

            // عرض الصفحة المطلوبة
            switch (pageName) {
                case 'dashboard':
                    renderDashboard();
                    break;
                case 'fleet':
                    renderFleetPage();
                    break;
                case 'maintenance':
                    renderMaintenancePage();
                    break;
                case 'efficiency':
                    renderEfficiencyPage();
                    break;
                case 'support':
                    renderSupportPage();
                    break;
                case 'users':
                    renderUsersPage();
                    break;
                case 'notes':
                    renderNotesPage();
                    break;
                case 'sessions':
                    renderSessionsPage();
                    break;
                case 'ai-assistant':
                    renderAIAssistantPage();
                    break;
                case 'logs':
                    renderLogsPage();
                    break;
                default:
                    renderDashboard();
            }

            // تحديث عنوان الصفحة
            const titles = {
                'dashboard': '📊 لوحة التحكم',
                'fleet': '⚓ الأسطول',
                'maintenance': '🛠️ الصيانة',
                'efficiency': '📈 الجاهزية',
                'support': '📞 الدعم',
                'users': '👥 المستخدمين',
                'notes': '📝 Note Verbale',
                'sessions': '👥 المراقبة',
                'ai-assistant': '🤖 المساعد الذكي',
                'logs': '📜 السجلات'
            };
            document.title = `⚓ ${titles[pageName] || 'منظومة الوسائل البحرية'}`;
        }

        function getPageTitle(pageName) {
            const titles = {
                'dashboard': 'لوحة التحكم',
                'fleet': 'الأسطول',
                'maintenance': 'الصيانة',
                'efficiency': 'الجاهزية',
                'support': 'الدعم',
                'users': 'المستخدمين',
                'notes': 'Note Verbale',
                'sessions': 'المراقبة',
                'ai-assistant': 'المساعد الذكي',
                'logs': 'السجلات'
            };
            return titles[pageName] || pageName;
        }

        // ============================================================
        // 🎯 دوال التحديث العامة
        // ============================================================

        function refreshAllPages() {
            loadAllData();
            showToast('🔄 تم تحديث جميع البيانات', 'success');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('closed');
        }

        // ============================================================
        // 🚀 التحقق من الجلسة عند التحميل
        // ============================================================

        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || 'null');

            if (token && user) {
                currentUser = user;
                authToken = token;

                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';

                document.getElementById('userRoleDisplay').textContent = `👤 ${user.name || user.username} | ${user.role || 'مستخدم'}`;

                loadAllData();
                connectSocket();
                showPage('dashboard');

                console.log('✅ تم استعادة الجلسة');
            } else {
                // تأكد من ظهور شاشة الدخول
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }

            console.log('⚓ منظومة الوسائل البحرية v5.0');
        });

        // ============================================================
        // 🛑 معالجة الأخطاء العالمية
        // ============================================================

        window.addEventListener('error', function(e) {
            console.error('❌ خطأ:', e.message);
            if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError')) {
                showToast('⚠️ مشكلة في الاتصال بالخادم', 'error');
            }
        });

        // ============================================================
        // 🎯 ربط الدوال للنطاق العام
        // ============================================================

        window.handleLogin = handleLogin;
        window.doLogout = doLogout;
        window.showPage = showPage;
        window.toggleSidebar = toggleSidebar;
        window.refreshAllPages = refreshAllPages;
        window.startTracking = startTracking;
        window.stopTracking = stopTracking;
        window.handleAddVessel = handleAddVessel;
        window.deleteVessel = deleteVessel;
        window.loadVessels = loadVessels;
        window.loadUsers = loadUsers;
        window.loadTickets = loadTickets;
        window.loadLogs = loadLogs;
        window.loadNotes = loadNotes;
        window.loadSessions = loadSessions;
        window.handleAddTicket = handleAddTicket;
        window.closeTicket = closeTicket;
        window.handleAddUser = handleAddUser;
        window.toggleUser = toggleUser;
        window.handleAddNote = handleAddNote;
        window.deleteNote = deleteNote;
        window.askAI = askAI;
        window.aiQuickAction = aiQuickAction;
        window.toggleNotifications = toggleNotifications;
        window.showToast = showToast;
        window.renderMaintenance = renderMaintenance;
        window.renderEfficiency = renderEfficiency;
        window.renderVessels = renderVessels;
        window.renderUsers = renderUsers;
        window.renderTickets = renderTickets;
        window.renderLogs = renderLogs;
        window.renderNotes = renderNotes;
        window.renderSessions = renderSessions;

        console.log('✅ تم تحميل التطبيق بنجاح');
    </script>

</body>
</html>
