<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚓ منظومة الوسائل البحرية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: #0a0e17;
            color: #e2e8f0;
            min-height: 100vh;
        }
        
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            display: flex !important;
            justify-content: center;
            align-items: center;
            background: rgba(10,14,23,0.98);
            backdrop-filter: blur(10px);
        }
        
        .login-box {
            background: linear-gradient(145deg, #141b2d, #0f1625);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.8);
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(96,165,250,0.15);
        }
        
        .login-logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
        .logo-icon { font-size: 40px; color: #60a5fa; }
        .logo-text {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: rgba(255,255,255,0.4); font-size: 14px; margin-bottom: 20px; }
        
        .developer {
            background: rgba(96,165,250,0.08);
            border-radius: 12px;
            padding: 8px 16px;
            margin-bottom: 24px;
            display: inline-block;
            border: 1px solid rgba(96,165,250,0.1);
        }
        .dev-name { color: #60a5fa; font-weight: 700; font-size: 14px; }
        .dev-label { color: rgba(255,255,255,0.3); font-size: 11px; margin-left: 6px; }
        
        .input-group { position: relative; margin-bottom: 16px; }
        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.2);
        }
        .input-group input {
            width: 100%;
            padding: 14px 48px 14px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 4px rgba(96,165,250,0.08);
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.25); }
        
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(37,99,235,0.3); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .login-btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .login-btn.loading .spinner { display: inline-block; }
        .login-btn.loading .btn-text { display: none; }
        
        #loginError {
            display: none;
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 14px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
        #loginError.show { display: block; }
        #loginError.error {
            color: #f87171;
            background: rgba(248,113,113,0.12);
            border: 1px solid rgba(248,113,113,0.2);
        }
        #loginError.success {
            color: #4ade80;
            background: rgba(74,222,128,0.12);
            border: 1px solid rgba(74,222,128,0.2);
        }
        
        .login-footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            color: rgba(255,255,255,0.2);
            font-size: 11px;
        }
        .version { background: rgba(255,255,255,0.04); padding: 2px 10px; border-radius: 20px; }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #mainApp { display: none; min-height: 100vh; }
        
        header {
            background: #0f1625;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .menu-toggle {
            font-size: 24px;
            cursor: pointer;
            color: rgba(255,255,255,0.4);
            transition: all 0.3s ease;
        }
        .menu-toggle:hover { color: #60a5fa; }
        .header-left h1 { font-size: 18px; font-weight: 700; color: #fff; }
        .header-left h1 span { color: #60a5fa; }
        .developer-tag {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            font-weight: 400;
            margin-right: 8px;
        }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .role-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            background: rgba(96,165,250,0.12);
            color: #60a5fa;
            border: 1px solid rgba(96,165,250,0.15);
        }
        .btn-outline-white {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .btn-outline-white:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); color: #fff; }
        .btn-logout:hover { border-color: #ef4444; color: #ef4444; }
        
        .sidebar {
            position: fixed;
            top: 65px;
            right: 0;
            width: 240px;
            height: calc(100% - 65px);
            background: #0f1625;
            border-left: 1px solid rgba(255,255,255,0.06);
            padding: 16px 12px;
            overflow-y: auto;
            z-index: 50;
            transition: transform 0.3s ease;
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            margin-bottom: 16px;
            color: rgba(255,255,255,0.3);
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding-bottom: 12px;
        }
        .sidebar-brand span:first-child { font-size: 20px; }
        
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 14px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.04); color: #fff; }
        .nav-btn.active {
            background: rgba(96,165,250,0.12);
            color: #60a5fa;
            border-left: 3px solid #60a5fa;
        }
        .nav-btn i { width: 20px; text-align: center; }
        
        .sidebar-footer {
            padding: 12px;
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.15);
            font-size: 11px;
            text-align: center;
        }
        
        .main-content {
            margin-right: 240px;
            padding: 20px;
            min-height: calc(100vh - 65px);
        }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; padding: 12px; }
            .login-box { padding: 30px 20px; margin: 16px; }
            .header-left h1 { font-size: 14px; }
            .developer-tag { display: none; }
        }
    </style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginOverlay">
    <div class="login-box">
        <div class="login-logo">
            <span class="logo-icon">⚓</span>
            <span class="logo-text">منظومة الوسائل البحرية</span>
        </div>

<!-- ===== MAIN APP ===== -->
<div id="mainApp" style="display:none;">
    <header>
        <div class="header-left">
            <span class="menu-toggle" onclick="toggleSidebar()">☰</span>
            <h1>
                <span>⚓</span>
                منظومة الوسائل البحرية

<!-- ============================================================
     📦 JAVASCRIPT - مع تصحيح الأخطاء
     ============================================================ -->

<script>
/**
 * ============================================================
 * 🚀 MARINE SYSTEM v20.0 - مع تصحيح الأخطاء
 * ============================================================
 * ✅ تظهر جميع الأخطاء في الواجهة
 * ✅ تظهر جميع الأخطاء في Console
 * ✅ تعمل مع أي سيرفر
 * ============================================================
 */

console.log('🚀 Marine System v20.0 - Loading...');

// ============================================================
// ⚙️ CONFIGURATION
// ============================================================

// ✅ عنوان السيرفر - غيّر هذا حسب سيرفرك
const API_BASE_URL = 'https://marine-system-71eo.onrender.com';
console.log('📡 API Base URL:', API_BASE_URL);

// ============================================================
// 📝 وظيفة عرض الأخطاء في الواجهة
// ============================================================

function showLoginError(message, type = 'error') {
    const errorEl = document.getElementById('loginError');
    if (!errorEl) {
        console.error('❌ Error element not found!');
        return;
    }
    
    console.log('📝 Showing error:', message, 'Type:', type);
    
    errorEl.textContent = message;
    errorEl.className = 'show ' + type;
    
    // ✅ إذا كان خطأ، نحاول إظهاره أيضاً في Console
    if (type === 'error') {
        console.error('❌ ' + message);
    }
}

function hideLoginError() {
    const errorEl = document.getElementById('loginError');
    if (errorEl) {
        errorEl.className = '';
        errorEl.textContent = '';
    }
}

// ============================================================
// 🔐 LOGIN FUNCTION - مع تصحيح الأخطاء
// ============================================================

function doLogin() {
    console.log('🔐 [doLogin] CALLED - Function is working!');
    
    // ✅ جلب العناصر
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const loginBtn = document.getElementById('loginButton');
    
    // ✅ التحقق من وجود العناصر
    if (!usernameEl) {
        showLoginError('❌ عنصر اسم المستخدم غير موجود', 'error');
        console.error('❌ username element not found');
        return;
    }
    
    if (!passwordEl) {
        showLoginError('❌ عنصر كلمة المرور غير موجود', 'error');
        console.error('❌ password element not found');
        return;
    }
    
    // ✅ الحصول على القيم
    const user = usernameEl.value.trim();
    const pass = passwordEl.value.trim();
    
    console.log('🔐 Username entered:', user || '(empty)');
    console.log('🔐 Password length:', pass.length || 0);
    
    // ✅ إخفاء الخطأ السابق
    hideLoginError();
    
    // ✅ التحقق من المدخلات
    if (!user) {
        showLoginError('⚠️ الرجاء إدخال اسم المستخدم', 'error');
        console.error('❌ Empty username');
        return;
    }
    
    if (!pass) {
        showLoginError('⚠️ الرجاء إدخال كلمة المرور', 'error');
        console.error('❌ Empty password');
        return;
    }
    
    // ✅ حالة التحميل
    if (loginBtn) {
        loginBtn.disabled = true;
        loginBtn.classList.add('loading');
        console.log('⏳ Loading state activated');
    }
    
    // ✅ إرسال الطلب
    const loginUrl = API_BASE_URL + '/api/auth/login';
    const requestData = { username: user, password: pass };
    
    console.log('📡 Sending POST to:', loginUrl);
    console.log('📡 Request data:', JSON.stringify(requestData));
    
    fetch(loginUrl, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify(requestData)
    })
    .then(function(response) {
        console.log('📡 Response status:', response.status);
        console.log('📡 Response statusText:', response.statusText);
        
        // ✅ قراءة النص الخام
        return response.text().then(function(text) {
            console.log('📡 Raw response:', text);
            
            let data;
            try {
                data = JSON.parse(text);
            } catch (e) {
                console.error('❌ JSON parse error:', e);
                data = { error: 'Invalid JSON response: ' + text.substring(0, 100) };
            }
            
            return { status: response.status, ok: response.ok, data: data };
        });
    })
    .then(function(result) {
        console.log('📡 Parsed data:', JSON.stringify(result.data, null, 2));
        
        // ✅ التحقق من النجاح
        if (result.ok && result.data && result.data.success) {
            console.log('✅ Login SUCCESS!');
            
            const userData = result.data.user || result.data.data?.user || result.data;
            console.log('👤 User data:', userData);
            
            // ✅ حفظ في الجلسة
            try {
                sessionStorage.setItem('auth_user', JSON.stringify(userData));
                sessionStorage.setItem('auth_token', result.data.token || 'token-' + Date.now());
                console.log('💾 Session saved');
            } catch (e) {
                console.warn('Session storage error:', e);
            }
            
            // ✅ إظهار التطبيق
            const overlay = document.getElementById('loginOverlay');
            const mainApp = document.getElementById('mainApp');
            
            if (overlay) {
                overlay.style.display = 'none';
                overlay.style.visibility = 'hidden';
                overlay.style.opacity = '0';
                console.log('🔒 Login overlay hidden');
            }
            if (mainApp) {
                mainApp.style.display = 'block';
                mainApp.style.visibility = 'visible';
                mainApp.style.opacity = '1';
                console.log('📱 Main app shown');
            }
            
            // ✅ تحديث الواجهة
            updateUserDisplay();
            loadDashboard();
            
            // ✅ رسالة نجاح
            const name = userData.name || userData.username || user;
            showLoginError('✅ مرحباً ' + name, 'success');
            
            // ✅ إخفاء رسالة النجاح بعد 3 ثواني
            setTimeout(function() {
                hideLoginError();
            }, 3000);
            
        } else {
            // ❌ فشل تسجيل الدخول
            console.log('❌ Login FAILED');
            
            const errorMsg = result.data?.error || result.data?.message || result.data?.msg || 'بيانات الدخول غير صحيحة';
            console.log('❌ Error message:', errorMsg);
            
            showLoginError('❌ ' + errorMsg, 'error');
        }
    })
    .catch(function(error) {
        console.error('❌ Network/Fetch error:', error);
        console.error('❌ Error details:', error.message);
        
        showLoginError('❌ لا يمكن الاتصال بالسيرفر: ' + error.message, 'error');
    })
    .finally(function() {
        // ✅ إعادة تعيين الزر
        if (loginBtn) {
            loginBtn.disabled = false;
            loginBtn.classList.remove('loading');
            console.log('⏳ Button reset');
        }
    });
}

// ============================================================
// 🚪 LOGOUT
// ============================================================

function doLogout() {
    console.log('🚪 [doLogout] CALLED');
    
    if (!confirm('⚠️ هل أنت متأكد من تسجيل الخروج؟')) return;
    
    try {
        sessionStorage.removeItem('auth_user');
        sessionStorage.removeItem('auth_token');
        console.log('🗑️ Session cleared');
    } catch (e) {
        console.warn('Session clear error:', e);
    }
    
    const overlay = document.getElementById('loginOverlay');
    const mainApp = document.getElementById('mainApp');
    
    if (overlay) {
        overlay.style.display = 'flex';
        overlay.style.visibility = 'visible';
        overlay.style.opacity = '1';
    }
    if (mainApp) {
        mainApp.style.display = 'none';
        mainApp.style.visibility = 'hidden';
        mainApp.style.opacity = '0';
    }
    
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    
    if (username) username.value = '';
    if (password) password.value = '';
    
    hideLoginError();
    console.log('👋 Logged out');
}

// ============================================================
// 👤 USER DISPLAY
// ============================================================

function updateUserDisplay() {
    console.log('👤 [updateUserDisplay] CALLED');
    
    const display = document.getElementById('userRoleDisplay');
    if (!display) {
        console.warn('⚠️ userRoleDisplay not found');
        return;
    }
    
    try {
        const userData = sessionStorage.getItem('auth_user');
        if (userData) {
            const user = JSON.parse(userData);
            const emojis = { 'admin': '👑', 'manager': '⭐', 'operator': '🔧', 'viewer': '👀' };
            const emoji = emojis[user.role] || '👤';
            display.textContent = `${emoji} ${user.name || user.username || 'مستخدم'}`;
            console.log('👤 Display updated:', display.textContent);
        } else {
            display.textContent = '👤';
        }
    } catch (e) {
        console.warn('Update user display error:', e);
        display.textContent = '👤';
    }
}

// ============================================================
// 📄 PAGE FUNCTIONS
// ============================================================

function loadDashboard() {
    console.log('📊 [loadDashboard] CALLED');
    
    const container = document.getElementById('pageContainer');
    if (!container) {
        console.warn('⚠️ pageContainer not found');
        return;
    }
    
    container.innerHTML = `
        <div style="text-align:center;padding:60px 20px;">
            <h2 style="color:#60a5fa;font-size:28px;">📊 لوحة التحكم</h2>
            <p style="color:rgba(255,255,255,0.3);margin-top:8px;">مرحباً بك في منظومة الوسائل البحرية</p>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:30px;max-width:800px;margin-left:auto;margin-right:auto;">
                <div style="background:rgba(255,255,255,0.04);padding:20px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);">
                    <div style="font-size:32px;">🚢</div>
                    <div style="font-size:24px;font-weight:700;color:#60a5fa;">0</div>
                    <div style="color:rgba(255,255,255,0.3);font-size:13px;">السفن</div>
                </div>
                <div style="background:rgba(255,255,255,0.04);padding:20px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);">
                    <div style="font-size:32px;">🔧</div>
                    <div style="font-size:24px;font-weight:700;color:#4ade80;">0</div>
                    <div style="color:rgba(255,255,255,0.3);font-size:13px;">مهام الصيانة</div>
                </div>

        container.innerHTML = `

// ============================================================
// 🚀 INITIALIZATION - تشغيل التطبيق
// ============================================================

// ✅ ربط جميع الدوال بالنافذة
window.doLogin = doLogin;
window.doLogout = doLogout;
window.showPage = showPage;
window.toggleSidebar = toggleSidebar;

// ✅ التأكد من أن الزر يعمل
document.addEventListener('DOMContentLoaded', function() {
    console.log('🚀 DOM ready - initializing...');
    console.log('📡 Server URL:', API_BASE_URL);
    console.log('🔐 Credentials: admin / MarineDB2026Secure');
    
    // ✅ ربط زر الدخول
    const loginBtn = document.getElementById('loginButton');
    if (loginBtn) {
        // إزالة أي مستمع قديم
        loginBtn.onclick = null;
        // إضافة المستمع الجديد
        loginBtn.addEventListener('click', function(e) {
            console.log('🖱️ Login button clicked!');
            doLogin();
        });
        console.log('✅ Login button bound');
    } else {
        console.error('❌ Login button not found!');
        showLoginError('❌ خطأ في تهيئة التطبيق، يرجى تحديث الصفحة', 'error');
    }
    
    // ✅ ربط مفتاح Enter
    const passwordField = document.getElementById('password');
    const usernameField = document.getElementById('username');
    
    if (passwordField) {
        passwordField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                console.log('⌨️ Enter pressed on password');
                doLogin();
            }
        });
    }
    
    if (usernameField) {
        usernameField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (passwordField) passwordField.focus();
            }
        });
    }
    
    // ✅ التحقق من الجلسة
    try {
        const userData = sessionStorage.getItem('auth_user');
        const token = sessionStorage.getItem('auth_token');
        
        if (userData && token) {
            console.log('🔄 Session found - auto-login');
            const overlay = document.getElementById('loginOverlay');
            const mainApp = document.getElementById('mainApp');
            
            if (overlay) {
                overlay.style.display = 'none';
                overlay.style.visibility = 'hidden';
                overlay.style.opacity = '0';
            }
            if (mainApp) {
                mainApp.style.display = 'block';
                mainApp.style.visibility = 'visible';
                mainApp.style.opacity = '1';
            }
            
            updateUserDisplay();
            loadDashboard();
            console.log('✅ Auto-login from session');
        } else {
            console.log('🔐 No session - showing login');
            const overlay = document.getElementById('loginOverlay');
            if (overlay) {
                overlay.style.display = 'flex';
                overlay.style.visibility = 'visible';
                overlay.style.opacity = '1';
            }
        }
    } catch (e) {
        console.error('❌ Session check error:', e);
    }
    
    console.log('🚀 Marine System v20.0 - Ready!');
    console.log('🔐 Try: admin / MarineDB2026Secure');
});

console.log('  - doLogout()');
console.log('  - showPage()');
console.log('  - toggleSidebar()');
