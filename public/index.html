<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الوسائل البحرية</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginOverlay">
    <div class="login-box">
        <h2 style="color:#2e7d32">⚓ منظومة الوسائل البحرية</h2>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="doLogin()">دخول</button>
        <div id="loginError" class="error-msg"></div>
    </div>
</div>

<!-- التطبيق الرئيسي -->
<div id="mainApp" class="container" style="display: none;">
    <header>
        <h1>⚓ منظومة متابعة الوسائل البحرية</h1>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:0 20px; margin-top:10px; flex-wrap:wrap; gap:10px">
            <div class="developer-info">💻 Développeur: أمان الله ناجي 🚀</div>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
                <span id="userRoleDisplay" class="role-badge"></span>
                <button class="btn-sm btn-cyan" onclick="exportAllData()" id="exportBtn">📤 تصدير البيانات</button>
                <label class="file-input-label" id="importLabelBtn">📥 استيراد بيانات <input type="file" id="fileInput" accept=".json" onchange="importAllData(this)"></label>
                <button class="btn-sm btn-blue" onclick="refreshAllPages()">🔄 تحديث الكل</button>
                <button class="btn-sm btn-red" onclick="logout()">خروج</button>
            </div>
        </div>
    </header>

    <!-- شريط التنقل -->
    <div class="nav">
        <button class="btn btn-blue" onclick="loadPage('fleet')">⚓ الأسطول البحري</button>
        <button class="btn btn-orange" onclick="loadPage('maintenance')">🛠️ سجل الصيانة</button>
        <button class="btn btn-green" onclick="loadPage('efficiency')">📈 جاهزية الأسطول</button>
        <button class="btn btn-cyan" onclick="loadPage('support')">📞 الدعم الفني</button>
        <button id="trackBtn" class="btn btn-purple" onclick="loadPage('tracking')">📊 تتبع المستخدمين</button>
        <button id="mapBtn" class="btn btn-purple" onclick="loadPage('map')">🗺️ خريطة التتبع</button>
        <button id="admBtn" class="btn btn-red" onclick="loadPage('users')">👥 المستخدمين</button>
        <button id="printBtn" class="btn btn-blue" onclick="window.print()">🖨️ طباعة</button>
    </div>

    <!-- حاوية تحميل الصفحات -->
    <div id="pageContent">
        <div style="text-align:center; padding:50px; color:#666;">
            <h3>📂 اختر صفحة من القائمة أعلاه</h3>
            <p>سيتم تحميل المحتوى هنا...</p>
        </div>
    </div>

    <!-- نموذج الإضافة - يظهر في الأسطول فقط -->
    <div id="inputArea" class="input-grid" style="display:none;">
        <input type="text" id="iName" placeholder="اسم المركب">
        <input type="text" id="iNum" placeholder="الرقم">
        <input type="number" id="iLen" placeholder="الطول (م)">
        <select id="iReg" onchange="updateZones()">
            <option value="">الإقليم</option>
            <option value="الشمال">🗺️ الحرس البحري بالشمال</option>
            <option value="الساحل">🗺️ الحرس البحري بالساحل</option>
            <option value="الوسط">🗺️ الحرس البحري بالوسط</option>
            <option value="الجنوب">🗺️ الحرس البحري بالجنوب</option>
            <option value="وحدة الصيانة والإسناد البحري تونس">🛠️ وحدة الصيانة تونس</option>
            <option value="وحدة الصيانة والإسناد البحري المنستير">🛠️ وحدة الصيانة المنستير</option>
            <option value="وحدة الصيانة والإسناد البحري صفاقس">🛠️ وحدة الصيانة صفاقس</option>
            <option value="وحدة الصيانة والإسناد البحري جرجيس">🛠️ وحدة الصيانة جرجيس</option>
            <option value="المجمع الأمني بقبيبة">🏛️ المجمع الأمني بقبيبة</option>
        </select>
        <select id="iZone"><option value="">المنطقة</option></select>
        <input type="text" id="iPort" placeholder="الميناء">
        <input type="text" id="iSupp" placeholder="مكان التعزيز">
        <select id="iStat"><option value="صالح">صالح</option><option value="معطب">معطب</option><option value="صيانة">صيانة</option></select>
        <input type="text" id="iBreak" placeholder="نوع العطب">
        <input type="date" id="iDate">
        <input type="date" id="iEnd">
        <input type="text" id="iRef" placeholder="المرجع">
        <button class="btn btn-green" onclick="addItem()">✅ حفظ</button>
    </div>
</div>

<!-- نافذة تغيير كلمة المرور -->
<div id="passwordModal" class="modal">
    <div class="modal-content">
        <h3>🔐 تغيير كلمة المرور</h3>
        <p id="modalUserName"></p>
        <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة">
        <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور">
        <button class="btn btn-green" onclick="saveNewPassword()">حفظ</button>
        <button class="btn btn-red" onclick="closePasswordModal()">إلغاء</button>
    </div>
</div>

<!-- أزرار التمرير -->
<div class="scroll-buttons">
    <button class="scroll-btn" onclick="scrollToTop()">⬆️</button>
    <button class="scroll-btn" onclick="scrollToBottom()">⬇️</button>
</div>

<script>
    // ==================== المتغيرات العامة ====================
    let currentUser = null;
    let selectedUserId = null;
    let currentPage = 'fleet';
    let socket = null;
    let trackingMap = null;
    let trackingMarkers = {};
    let trackingInterval = null;
    let fleetChart = null, categoriesChart = null, comparisonChart = null;
    let currentChartType = 'doughnut';

    // ==================== البيانات الثابتة ====================
    const ZONES_DATA = {
        "الشمال": ["تونس", "بنزرت", "طبرقة"],
        "الساحل": ["سوسة", "المنستير", "نابل"],
        "الوسط": ["صفاقس", "المهدية", "قرقنة"],
        "الجنوب": ["جرجيس", "جربة", "قابس"],
        "وحدة الصيانة والإسناد البحري تونس": ["تونس"],
        "وحدة الصيانة والإسناد البحري المنستير": ["المنستير"],
        "وحدة الصيانة والإسناد البحري صفاقس": ["صفاقس"],
        "وحدة الصيانة والإسناد البحري جرجيس": ["جرجيس"],
        "المجمع الأمني بقبيبة": ["قبيبة"]
    };

    const CATS_LIST = ["البروق", "صقور", "خوافر", "زوارق مزدوجة", "طوافات"];
    
    const ALL_REGIONS = [
        "الشمال", "الساحل", "الوسط", "الجنوب",
        "وحدة الصيانة والإسناد البحري تونس",
        "وحدة الصيانة والإسناد البحري المنستير",
        "وحدة الصيانة والإسناد البحري صفاقس",
        "وحدة الصيانة والإسناد البحري جرجيس",
        "المجمع الأمني بقبيبة"
    ];

    const REGION_DISPLAY_NAMES = {
        "الشمال": "🗺️ الحرس البحري بالشمال",
        "الساحل": "🗺️ الحرس البحري بالساحل",
        "الوسط": "🗺️ الحرس البحري بالوسط",
        "الجنوب": "🗺️ الحرس البحري بالجنوب",
        "وحدة الصيانة والإسناد البحري تونس": "🛠️ وحدة الصيانة تونس",
        "وحدة الصيانة والإسناد البحري المنستير": "🛠️ وحدة الصيانة المنستير",
        "وحدة الصيانة والإسناد البحري صفاقس": "🛠️ وحدة الصيانة صفاقس",
        "وحدة الصيانة والإسناد البحري جرجيس": "🛠️ وحدة الصيانة جرجيس",
        "المجمع الأمني بقبيبة": "🏛️ المجمع الأمني بقبيبة"
    };

    // ==================== دوال مساعدة ====================
    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function scrollToBottom() { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }

    function showToast(message, isError = false) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = isError ? '#d9534f' : '#2e7d32';
        toast.innerHTML = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function formatDate(d) {
        if (!d) return '-';
        try {
            let date = new Date(d);
            if (isNaN(date.getTime())) return d;
            return `${date.getDate().toString().padStart(2,'0')}/${(date.getMonth()+1).toString().padStart(2,'0')}/${date.getFullYear()}`;
        } catch(e) { return d; }
    }

    function getCat(len) {
        let n = parseFloat(len);
        if (n === 11) return "البروق";
        if (n >= 8 && n <= 12) return "صقور";
        if (n > 12 && n <= 25) return "خوافر";
        if (n >= 30) return "طوافات";
        return "زوارق مزدوجة";
    }

    function canEdit() { return currentUser && (currentUser.role === "مسؤول" || currentUser.role === "محرر"); }
    function canDelete() { return currentUser && currentUser.role === "مسؤول"; }
    function canManageUsers() { return currentUser && currentUser.role === "مسؤول"; }

    function getCurrentDate() {
        let now = new Date();
        return `${now.getDate().toString().padStart(2,'0')}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getFullYear()}`;
    }

    function getCurrentTime() {
        let now = new Date();
        return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    }

    // ==================== دوال الاتصال بالسيرفر ====================
    async function apiCall(url, method = 'GET', body = null) {
        let options = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) options.body = JSON.stringify(body);
        let response = await fetch(url, options);
        if (!response.ok) throw new Error(await response.text());
        return response.json();
    }

    async function loadVessels() { return apiCall('/api/vessels'); }
    async function saveVessel(vessel) { return apiCall('/api/vessels', 'POST', vessel); }
    async function updateVessel(id, vessel) { return apiCall(`/api/vessels/${id}`, 'PUT', vessel); }
    async function deleteVessel(id) { return apiCall(`/api/vessels/${id}`, 'DELETE'); }
    async function loadUsers() { return apiCall('/api/users'); }
    async function saveUser(user) { return apiCall('/api/users', 'POST', user); }
    async function updateUser(id, user) { return apiCall(`/api/users/${id}`, 'PUT', user); }
    async function deleteUserAPI(id) { return apiCall(`/api/users/${id}`, 'DELETE'); }
    async function loadTickets() { return apiCall('/api/tickets'); }
    async function saveTicket(ticket) { return apiCall('/api/tickets', 'POST', ticket); }
    async function loadLogs() { return apiCall('/api/logs'); }
    async function saveLog(log) { return apiCall('/api/logs', 'POST', log); }
    async function loginAPI(name, pass) { return apiCall('/api/login', 'POST', { name, pass }); }
    async function exportAllDataAPI() { return apiCall('/api/export-all'); }
    async function importAllDataAPI(data) { return apiCall('/api/import-all', 'POST', data); }

    async function logActivity(action, details) {
        if (!currentUser) return;
        try {
            await saveLog({ userName: currentUser.name, userRole: currentUser.role, action: action, details: details });
        } catch(e) { console.error(e); }
    }

    // ==================== دوال تحميل الصفحات ====================
    async function loadPage(page) {
        currentPage = page;
        
        // إخفاء نموذج الإضافة افتراضياً
        document.getElementById('inputArea').style.display = 'none';
        
        // التحقق من الصلاحيات
        if ((page === 'tracking' || page === 'map' || page === 'users') && !canManageUsers()) {
            showToast("غير مسموح - هذه الصفحة للمسؤول فقط", true);
            return;
        }
        
        try {
            const response = await fetch(`/pages/${page}.html`);
            if (!response.ok) throw new Error('Page not found');
            const html = await response.text();
            document.getElementById('pageContent').innerHTML = html;
            
            // إظهار نموذج الإضافة فقط في صفحة الأسطول
            if (page === 'fleet') {
                document.getElementById('inputArea').style.display = 'grid';
                // تهيئة القوائم المنسدلة
                fillSelect('fCatMain', CATS_LIST);
                fillSelect('fRegMain', ALL_REGIONS);
                fillSelect('fRegMaint', ALL_REGIONS);
            }
            
            // تهيئة الصفحة بعد تحميلها
            await initPage(page);
            
        } catch(error) {
            document.getElementById('pageContent').innerHTML = `
                <div style="text-align:center; padding:50px; color:#d9534f;">
                    <h3>❌ خطأ في تحميل الصفحة</h3>
                    <p>${error.message}</p>
                </div>
            `;
        }
    }

    function fillSelect(id, list) {
        let sel = document.getElementById(id);
        if (sel) {
            sel.innerHTML = '<option value="الكل">الكل</option>';
            list.forEach(item => sel.innerHTML += `<option value="${item}">${item}</option>`);
        }
    }

    async function initPage(page) {
        switch(page) {
            case 'fleet':
                await renderMain();
                break;
            case 'maintenance':
                await renderMaint();
                break;
            case 'efficiency':
                await renderEff();
                break;
            case 'support':
                await renderTickets();
                break;
            case 'tracking':
                await renderTrack();
                break;
            case 'map':
                setTimeout(() => {
                    if (trackingMap) trackingMap.invalidateSize();
                    loadLocations();
                }, 100);
                break;
            case 'users':
                await renderUsers();
                break;
        }
    }

    // ==================== دوال الدخول والخروج ====================
    async function doLogin() {
        let username = document.getElementById('username').value.trim();
        let password = document.getElementById('password').value.trim();
        let errorDiv = document.getElementById('loginError');
        
        if (!username || !password) {
            errorDiv.innerHTML = "يرجى إدخال اسم المستخدم وكلمة المرور";
            errorDiv.style.display = "block";
            return;
        }
        
        try {
            let user = await loginAPI(username, password);
            if (user.error) {
                errorDiv.innerHTML = user.error;
                errorDiv.style.display = "block";
                return;
            }
            
            currentUser = user;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userRoleDisplay').innerHTML = `👤 ${currentUser.name} | 🔑 ${currentUser.role}`;
            
            initSocket();
            initTrackingMap();
            
            let isAdmin = currentUser.role === "مسؤول";
            
            document.getElementById('trackBtn').classList.toggle('hidden', !isAdmin);
            document.getElementById('mapBtn').classList.toggle('hidden', !isAdmin);
            document.getElementById('admBtn').classList.toggle('hidden', !isAdmin);
            document.getElementById('printBtn').style.display = isAdmin ? "inline-block" : "none";
            document.getElementById('exportBtn').style.display = isAdmin ? "inline-flex" : "none";
            document.getElementById('importLabelBtn').style.display = isAdmin ? "inline-flex" : "none";
            
            await logActivity("تسجيل دخول", `قام بتسجيل الدخول`);
            showToast(`مرحباً ${username}`);
            
            // تحميل الصفحة الافتراضية
            loadPage('fleet');
            
        } catch(error) {
            errorDiv.innerHTML = "خطأ في الاتصال بالسيرفر!";
            errorDiv.style.display = "block";
        }
    }

    async function logout() {
        if (trackingInterval) stopTracking();
        if (currentUser) await logActivity("تسجيل خروج", `قام بتسجيل الخروج`);
        currentUser = null;
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('loginError').style.display = 'none';
    }

    // ==================== دوال GPS و Socket ====================
    function initSocket() {
        if (socket) return;
        socket = io();
        socket.on('receive-location', (data) => {
            if (currentUser && currentUser.role === 'مسؤول') {
                if (data.userName !== currentUser.name) {
                    updateMapMarker(data.userName, data.lat, data.lng, data.time);
                    showToast(`📍 المستخدم ${data.userName} - موقع محدث`);
                }
            }
        });
    }

    function initTrackingMap() {
        if (trackingMap) return;
        trackingMap = L.map('trackMap').setView([34.5, 9.5], 7);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { 
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors' 
        }).addTo(trackingMap);
    }

    function updateMapMarker(userName, lat, lng, time) {
        if (!trackingMap) initTrackingMap();
        let key = userName;
        let popupContent = `<b>${userName}</b><br>📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}<br>🕐 ${new Date(time).toLocaleString('ar-EG')}`;
        
        if (trackingMarkers[key]) {
            trackingMarkers[key].setLatLng([lat, lng]);
            trackingMarkers[key].bindPopup(popupContent);
        } else {
            let marker = L.marker([lat, lng]).addTo(trackingMap);
            marker.bindPopup(popupContent);
            trackingMarkers[key] = marker;
        }
    }

    function startTracking() {
        if (!currentUser) { showToast("الرجاء تسجيل الدخول أولاً", true); return; }
        if (!navigator.geolocation) { showToast("المتصفح لا يدعم تحديد الموقع", true); return; }
        if (!socket) initSocket();
        
        trackingInterval = setInterval(() => {
            navigator.geolocation.getCurrentPosition((position) => {
                if (socket && currentUser) {
                    socket.emit('send-location', {
                        userName: currentUser.name,
                        userRole: currentUser.role,
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    });
                    let statusEl = document.getElementById('mapStatus');
                    if (statusEl) {
                        statusEl.innerHTML = `📍 يتم مشاركة موقعك... ${position.coords.latitude.toFixed(6)}, ${position.coords.longitude.toFixed(6)}`;
                    }
                }
            }, (error) => {
                console.error('GPS error:', error);
                let statusEl = document.getElementById('mapStatus');
                if (statusEl) statusEl.innerHTML = '❌ تعذر الحصول على الموقع';
            }, { enableHighAccuracy: true, timeout: 5000 });
        }, 5000);
        
        let startBtn = document.getElementById('startTrackingBtn');
        let stopBtn = document.getElementById('stopTrackingBtn');
        if (startBtn) startBtn.style.display = 'none';
        if (stopBtn) stopBtn.style.display = 'inline-block';
        showToast("✅ بدأ مشاركة الموقع");
    }

    function stopTracking() {
        if (trackingInterval) {
            clearInterval(trackingInterval);
            trackingInterval = null;
        }
        let startBtn = document.getElementById('startTrackingBtn');
        let stopBtn = document.getElementById('stopTrackingBtn');
        if (startBtn) startBtn.style.display = 'inline-block';
        if (stopBtn) stopBtn.style.display = 'none';
        let statusEl = document.getElementById('mapStatus');
        if (statusEl) statusEl.innerHTML = '⏹️ توقفت مشاركة الموقع';
        showToast("⏹️ تم إيقاف مشاركة الموقع");
    }

    async function loadLocations() {
        if (!currentUser || currentUser.role !== 'مسؤول') {
            showToast("غير مسموح - هذه الخاصية للمسؤول فقط", true);
            return;
        }
        try {
            let locations = await apiCall('/api/locations');
            if (!trackingMap) initTrackingMap();
            Object.values(trackingMarkers).forEach(marker => marker.remove());
            trackingMarkers = {};
            
            locations.forEach(loc => {
                if (loc.userName !== currentUser.name) {
                    updateMapMarker(loc.userName, loc.lat, loc.lng, loc.timestamp);
                }
            });
            showToast(`✅ تم تحميل مواقع ${locations.length} مستخدم`);
        } catch(err) { 
            console.error(err);
            showToast("❌ خطأ في تحميل المواقع", true); 
        }
    }

    function centerMapOnUser() {
        if (!trackingMap) initTrackingMap();
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                trackingMap.setView([pos.coords.latitude, pos.coords.longitude], 13);
                showToast("🎯 تم التمركز على موقعك");
            }, () => showToast("لا يمكن الحصول على موقعك", true));
        }
    }

    // ==================== دوال التحديث ====================
    async function refreshAllPages() {
        await loadPage(currentPage);
        showToast("✅ تم تحديث الصفحة");
    }

    // ==================== دوال إدارة المراكب (مشتركة) ====================
    function updateZones() {
        let reg = document.getElementById('iReg').value;
        let zoneSel = document.getElementById('iZone');
        if (zoneSel) {
            zoneSel.innerHTML = '<option value="">المنطقة</option>';
            if (ZONES_DATA[reg]) {
                ZONES_DATA[reg].forEach(z => zoneSel.innerHTML += `<option value="${z}">${z}</option>`);
            }
        }
    }

    async function addItem() {
        if (!canEdit()) { showToast("ليس لديك صلاحية للإضافة!", true); return; }
        let name = document.getElementById('iName').value.trim();
        if (!name) return showToast("الاسم مطلوب", true);
        
        let stat = document.getElementById('iStat').value;
        let fDate = document.getElementById('iDate').value;
        
        if ((stat === 'معطب' || stat === 'صيانة') && !fDate) {
            showToast("تاريخ العطب إلزامي للمراكب المعطوبة أو التي تحت الصيانة!", true);
            return;
        }
        
        let newItem = {
            name: name,
            num: document.getElementById('iNum').value,
            len: parseFloat(document.getElementById('iLen').value) || 0,
            reg: document.getElementById('iReg').value,
            zone: document.getElementById('iZone').value,
            port: document.getElementById('iPort').value,
            supp: document.getElementById('iSupp').value,
            stat: stat,
            break: document.getElementById('iBreak').value,
            fDate: fDate,
            eDate: document.getElementById('iEnd').value,
            ref: document.getElementById('iRef').value,
            cat: getCat(document.getElementById('iLen').value)
        };
        
        try {
            await saveVessel(newItem);
            await logActivity("إضافة مركب", `قام بإضافة مركب "${name}"`);
            
            ['iName','iNum','iLen','iPort','iSupp','iBreak','iDate','iEnd','iRef'].forEach(id => {
                let el = document.getElementById(id);
                if (el) el.value = "";
            });
            document.getElementById('iReg').value = "";
            document.getElementById('iZone').innerHTML = '<option value="">المنطقة</option>';
            
            await loadPage('fleet');
            showToast(`✅ تم حفظ المركب بنجاح`);
        } catch(error) {
            showToast("خطأ في حفظ المركب: " + error.message, true);
        }
    }

    async function editItem(id, name) {
        if (!canEdit()) { showToast("ليس لديك صلاحية للتعديل!", true); return; }
        let data = await loadVessels();
        let item = data.find(x => x.id === id);
        if (item) {
            document.getElementById('iName').value = item.name;
            document.getElementById('iNum').value = item.num || '';
            document.getElementById('iLen').value = item.len || '';
            document.getElementById('iReg').value = item.reg || '';
            updateZones();
            setTimeout(() => { document.getElementById('iZone').value = item.zone; }, 50);
            document.getElementById('iPort').value = item.port || '';
            document.getElementById('iSupp').value = item.supp || '';
            document.getElementById('iStat').value = item.stat;
            document.getElementById('iBreak').value = item.break || '';
            document.getElementById('iDate').value = item.fDate || '';
            document.getElementById('iEnd').value = item.eDate || '';
            document.getElementById('iRef').value = item.ref || '';
            window.scrollTo(0, 0);
            
            let oldName = item.name;
            let saveBtn = document.querySelector('#inputArea .btn-green');
            let originalClick = saveBtn.onclick;
            saveBtn.onclick = async () => {
                let updatedItem = {
                    name: document.getElementById('iName').value.trim(),
                    num: document.getElementById('iNum').value,
                    len: parseFloat(document.getElementById('iLen').value) || 0,
                    reg: document.getElementById('iReg').value,
                    zone: document.getElementById('iZone').value,
                    port: document.getElementById('iPort').value,
                    supp: document.getElementById('iSupp').value,
                    stat: document.getElementById('iStat').value,
                    break: document.getElementById('iBreak').value,
                    fDate: document.getElementById('iDate').value,
                    eDate: document.getElementById('iEnd').value,
                    ref: document.getElementById('iRef').value,
                    cat: getCat(document.getElementById('iLen').value)
                };
                try {
                    await updateVessel(id, updatedItem);
                    await logActivity("تعديل مركب", `قام بتعديل مركب "${oldName}" إلى "${updatedItem.name}"`);
                    await loadPage('fleet');
                    showToast("✅ تم تحديث المركب بنجاح");
                    saveBtn.onclick = originalClick;
                    ['iName','iNum','iLen','iPort','iSupp','iBreak','iDate','iEnd','iRef'].forEach(id => {
                        let el = document.getElementById(id);
                        if (el) el.value = "";
                    });
                    document.getElementById('iReg').value = "";
                    document.getElementById('iZone').innerHTML = '<option value="">المنطقة</option>';
                } catch(error) {
                    showToast("خطأ في التحديث: " + error.message, true);
                }
            };
            showToast("✏️ قم بتعديل البيانات ثم اضغط حفظ");
        }
    }

    async function delItem(id, name) {
        if (!canDelete()) { showToast("ليس لديك صلاحية للحذف!", true); return; }
        if (confirm(`هل أنت متأكد من حذف المركب "${name}"؟`)) {
            try {
                await deleteVessel(id);
                await logActivity("حذف مركب", `قام بحذف مركب "${name}"`);
                await loadPage('fleet');
                showToast("✅ تم حذف المركب بنجاح");
            } catch(error) {
                showToast("خطأ في الحذف: " + error.message, true);
            }
        }
    }

    window.formatDate = formatDate;
    window.getCat = getCat;
    window.canEdit = canEdit;
    window.canDelete = canDelete;
    window.canManageUsers = canManageUsers;
    window.loadVessels = loadVessels;
    window.saveVessel = saveVessel;
    window.updateVessel = updateVessel;
    window.deleteVessel = deleteVessel;
    window.loadUsers = loadUsers;
    window.saveUser = saveUser;
    window.updateUser = updateUser;

    window.loadTickets = loadTickets;
