<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚓ منظومة الوسائل البحرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- ===== شاشة الدخول ===== -->
    <div id="loginOverlay">
        <div class="login-box">
            <div class="login-logo">
                <span class="logo-icon">⚓</span>
                <span class="logo-text">منظومة الوسائل البحرية</span>
            </div>
            <p class="subtitle">نظام متابعة وإدارة الأسطول البحري</p>
            <div class="developer">
                <span class="dev-label">الوكيل</span>
                <span class="dev-name">أمان الله ناجي</span>
            </div>
            <div class="input-group">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="username" placeholder="اسم المستخدم">
            </div>
            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="كلمة المرور">
            </div>
            <button class="login-btn" id="loginButton">
                <span class="spinner"></span>
                <span class="btn-text">🚀 دخول</span>
            </button>
            <div id="loginError" class="error-msg"></div>
            <div class="login-footer">
                <span>نظام إدارة وإسناد الوحدات البحرية</span>
                <span class="version">v6.0</span>
            </div>
        </div>
    </div>

    <!-- ===== التطبيق ===== -->
    <div id="mainApp" style="display:none;">
        <header>
            <div class="header-left">
                <span class="menu-toggle" onclick="toggleSidebar()">☰</span>
                <h1>⚓ منظومة الوسائل البحرية <span class="developer-tag">الوكيل أمان الله ناجي</span></h1>
            </div>
            <div class="header-right">
                <span class="role-badge" id="userRoleDisplay">👤</span>
                <button class="btn-outline-white" onclick="refreshAllPages()"><i class="fas fa-sync-alt"></i></button>
                <button class="btn-outline-white btn-logout" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand">⚓ الأسطول البحري</div>
            <button class="nav-btn active" data-page="dashboard"><i class="fas fa-chart-pie"></i> لوحة التحكم</button>
            <button class="nav-btn" data-page="fleet"><i class="fas fa-ship"></i> الأسطول</button>
            <button class="nav-btn" data-page="maintenance"><i class="fas fa-wrench"></i> الصيانة</button>
            <button class="nav-btn" data-page="efficiency"><i class="fas fa-chart-line"></i> الجاهزية</button>
            <button class="nav-btn" data-page="support"><i class="fas fa-headset"></i> الدعم</button>
            <button class="nav-btn" data-page="users"><i class="fas fa-users"></i> المستخدمين</button>
            <button class="nav-btn" data-page="notes"><i class="fas fa-sticky-note"></i> Note Verbale</button>
            <button class="nav-btn" data-page="sessions"><i class="fas fa-users-cog"></i> المراقبة</button>
            <button class="nav-btn" data-page="ai-assistant"><i class="fas fa-robot"></i> المساعد الذكي</button>
            <button class="nav-btn" data-page="settings"><i class="fas fa-cog"></i> الإعدادات</button>
            <button class="nav-btn" data-page="logs"><i class="fas fa-history"></i> السجلات</button>
            <div class="sidebar-footer">الوكيل أمان الله ناجي</div>
        </nav>

        <div class="main-content">
            <div id="pageContainer">
                <div class="page-content active">
                    <div style="padding:60px 20px;text-align:center;color:rgba(255,255,255,0.3);">
                        <div style="font-size:48px;margin-bottom:16px;">🚀</div>
                        <p>جاري تحميل لوحة التحكم...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        // 🚢 MARINE SYSTEM - مختصر جداً، بدون تخزين محلي
        // ============================================================

        console.log('🚀 Marine System v6.0 - No Local Storage');

        // ===== STATE (في الذاكرة فقط) =====
        let currentUser = null;
        let authToken = null;
        let activePage = 'dashboard';

        // ===== HELPERS =====
        function getRoleName(r) {
            const roles = { admin: 'مسؤول', manager: 'مدير', operator: 'مشغل', viewer: 'مشاهد' };
            return roles[r] || r || 'مستخدم';
        }

        function showToast(msg, type = 'info') {
            const c = document.getElementById('toastContainer');
            if (!c) return;
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            t.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${msg}`;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
        }

        // ===== LOGIN =====
        async function doLogin() {
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const errorEl = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginButton');

            const user = username.value.trim();
            const pass = password.value;

            errorEl.className = 'error-msg';
            errorEl.textContent = '';

            if (!user || !pass) {
                errorEl.textContent = '⚠️ يرجى إدخال اسم المستخدم وكلمة المرور';
                errorEl.classList.add('show');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.classList.add('loading');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await response.json();

                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'بيانات غير صحيحة');
                }

                // ✅ تخزين في الذاكرة فقط (وليس localStorage)
                currentUser = data.user;
                authToken = data.token;

                // إظهار التطبيق
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';

                updateUserDisplay();
                showPage('dashboard');
                showToast(`✅ مرحباً ${data.user.name || data.user.username}`, 'success');

            } catch (error) {
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');
                errorEl.textContent = `❌ ${error.message}`;
                errorEl.classList.add('show');
            }
        }

        // ===== LOGOUT =====
        function doLogout() {
            if (!confirm('⚠️ هل أنت متأكد من تسجيل الخروج؟')) return;

            // ✅ مسح البيانات من الذاكرة
            currentUser = null;
            authToken = null;

            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';

            showToast('👋 تم تسجيل الخروج', 'info');
        }

        // ===== UPDATE USER DISPLAY =====
        function updateUserDisplay() {
            const d = document.getElementById('userRoleDisplay');
            if (d && currentUser) {
                d.textContent = `👤 ${currentUser.name || currentUser.username} | ${getRoleName(currentUser.role)}`;
            }
        }

        // ===== API =====
        async function fetchWithAuth(url, options = {}) {
            if (!authToken) {
                throw new Error('انتهت الجلسة، يرجى تسجيل الدخول');
            }

            const headers = {
                ...options.headers,
                'Authorization': `Bearer ${authToken}`,
                'Content-Type': 'application/json'
            };

            const response = await fetch(url, { ...options, headers });

            if (response.status === 401) {
                currentUser = null;
                authToken = null;
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
                throw new Error('انتهت صلاحية الجلسة');
            }

            return response;
        }

        // ===== SHOW PAGE (تحميل من مجلد pages) =====
        function showPage(pageName) {
            activePage = pageName;

            // تحديث الأزرار
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.dataset.page === pageName) {
                    btn.classList.add('active');
                }
            });

            // تحميل الصفحة من الخادم
            const container = document.getElementById('pageContainer');

            fetch(`/api/pages/${pageName}`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.html) {
                    container.innerHTML = data.html;
                } else {
                    container.innerHTML = `
                        <div class="page-content active">
                            <h2 style="color:#60a5fa;">📄 ${pageName}</h2>
                            <p style="color:rgba(255,255,255,0.3);">المحتوى قيد التطوير...</p>
                            <button class="btn btn-primary" onclick="showPage('dashboard')" style="margin-top:16px;">📊 العودة</button>
                        </div>
                    `;
                }
            })
            .catch(() => {
                container.innerHTML = `
                    <div class="page-content active">
                        <h2 style="color:#f87171;">❌ خطأ في تحميل الصفحة</h2>
                        <button class="btn btn-primary" onclick="showPage('dashboard')" style="margin-top:16px;">📊 العودة</button>
                    </div>
                `;
            });

            // تحديث العنوان
            const titles = {
                'dashboard': '📊 لوحة التحكم',
                'fleet': '🚢 الأسطول',
                'maintenance': '🛠️ الصيانة',
                'efficiency': '📈 الجاهزية',
                'support': '📞 الدعم',
                'users': '👥 المستخدمين',
                'notes': '📝 Note Verbale',
                'sessions': '👥 المراقبة',
                'ai-assistant': '🤖 المساعد الذكي',
                'settings': '⚙️ الإعدادات',
                'logs': '📜 السجلات'
            };
            document.title = `⚓ ${titles[pageName] || pageName}`;
        }

        // ===== SIDEBAR =====
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // ===== REFRESH =====
        function refreshAllPages() {
            if (activePage) {
                showPage(activePage);
            }
            showToast('🔄 تم التحديث', 'success');
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', function() {
            // ربط زر الدخول
            document.getElementById('loginButton').onclick = doLogin;

            // Enter
            document.getElementById('password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') doLogin();
            });

            // ربط أزرار التنقل
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.onclick = function() {
                    showPage(this.dataset.page);
                };
            });

            console.log('✅ Marine System v6.0 ready - No Local Storage');
        });

        // ===== EXPOSE =====
        window.doLogin = doLogin;
        window.doLogout = doLogout;
        window.showPage = showPage;
        window.toggleSidebar = toggleSidebar;
        window.refreshAllPages = refreshAllPages;
        window.showToast = showToast;
    </script>

</body>
</html>
