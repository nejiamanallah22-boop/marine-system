<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="dark">

    <title>⚓ منظومة الوسائل البحرية - Enterprise</title>

    <!--
        ============================================================
        SECURITY NOTE
        ============================================================
        في بيئة الإنتاج:
        1. ضع CSP كـ HTTP Response Header من الخادم.
        2. يفضل Self-Host للخطوط والأيقونات.
        3. لا تعتمد على CSP الموجودة في HTML وحدها.
    -->

    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --secondary: #1a2a4a;

            --accent: #3b82f6;
            --accent-hover: #2563eb;

            --success: #22c55e;
            --danger: #ef4444;
            --danger-light: #fca5a5;
            --warning: #eab308;
            --info: #8b5cf6;
            --info-dark: #7c3aed;

            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;

            --border: rgba(255,255,255,.08);

            --shadow:
                0 25px 50px -12px rgba(0,0,0,.55);

            --radius: 16px;
            --radius-sm: 9px;

            --transition:
                .25s cubic-bezier(.4,0,.2,1);

            --font-primary:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--primary);
        }

        body {
            min-height: 100vh;
            background: var(--primary);
            color: var(--text);

            font-family: var(--font-primary);

            direction: rtl;
            overflow-x: hidden;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        ::selection {
            background: rgba(59,130,246,.25);
        }

        /* =========================================================
           SCROLLBAR
           ========================================================= */

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: var(--primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 20px;
        }

        /* =========================================================
           LOGIN OVERLAY
           ========================================================= */

        #loginOverlay {
            position: fixed;
            inset: 0;

            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    ellipse at 20% 50%,
                    rgba(59,130,246,.06),
                    transparent 55%
                ),
                radial-gradient(
                    ellipse at 80% 50%,
                    rgba(139,92,246,.04),
                    transparent 55%
                ),
                var(--primary);

            overflow: auto;
            padding: 20px;
        }

        #loginOverlay::before {
            content: "";

            position: absolute;
            inset: -50%;

            background:
                radial-gradient(
                    ellipse at 30% 50%,
                    rgba(59,130,246,.035),
                    transparent 55%
                ),
                radial-gradient(
                    ellipse at 70% 50%,
                    rgba(139,92,246,.025),
                    transparent 55%
                );

            animation: backgroundPulse 18s ease-in-out infinite;

            pointer-events: none;
        }

        @keyframes backgroundPulse {
            0%,100% {
                transform: scale(1) rotate(0deg);
            }

            50% {
                transform: scale(1.05) rotate(2deg);
            }
        }

        /* =========================================================
           LOGIN CONTAINER
           ========================================================= */

        .login-container {
            position: relative;
            z-index: 10;

            width: 100%;
            max-width: 440px;
        }

        .login-box {
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.018)
                );

            border: 1px solid var(--border);

            border-radius: var(--radius);

            padding: 45px 36px 30px;

            box-shadow: var(--shadow);

            animation:
                slideUp .55s cubic-bezier(.16,1,.3,1);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform:
                    translateY(25px)
                    scale(.98);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* =========================================================
           LOGO
           ========================================================= */

        .login-logo {
            text-align: center;
        }

        .logo-icon {
            display: inline-block;

            font-size: 52px;

            animation:
                logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .logo-text {
            margin-top: 8px;

            font-size: 25px;
            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    #60a5fa,
                    #a78bfa
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        .logo-sub {
            margin-top: 5px;

            color: var(--text-dim);

            font-size: 13px;
        }

        /* =========================================================
           DIVIDER
           ========================================================= */

        .login-divider {
            display: flex;
            align-items: center;

            gap: 12px;

            margin:
                25px 0 27px;

            color: var(--text-dim);

            font-size: 12px;
        }

        .login-divider::before,
        .login-divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--border),
                    transparent
                );
        }

        /* =========================================================
           FORM
           ========================================================= */

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;

            margin-bottom: 7px;

            color: var(--text-muted);

            font-size: 12px;
            font-weight: 600;

            text-align: right;
        }

        .input-wrapper {
            position: relative;

            display: flex;
            align-items: center;

            min-height: 50px;

            background:
                rgba(255,255,255,.025);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius-sm);

            transition:
                border-color var(--transition),
                box-shadow var(--transition),
                background var(--transition);
        }

        .input-wrapper:focus-within {
            border-color:
                var(--accent);

            background:
                rgba(255,255,255,.04);

            box-shadow:
                0 0 0 4px
                rgba(59,130,246,.08);
        }

        .input-icon {
            position: absolute;

            right: 14px;

            color:
                var(--text-dim);

            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;

            padding:
                13px 45px 13px 48px;

            border: 0;
            outline: 0;

            background: transparent;

            color:
                var(--text);

            font-size: 14px;

            direction: rtl;
        }

        .input-wrapper input::placeholder {
            color:
                var(--text-dim);

            font-size: 13px;
        }

        .input-wrapper input:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        /* =========================================================
           PASSWORD TOGGLE
           ========================================================= */

        .toggle-password {
            position: absolute;

            left: 10px;

            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;
            border-radius: 7px;

            background: transparent;

            color:
                var(--text-dim);

            cursor: pointer;

            transition:
                background var(--transition),
                color var(--transition);
        }

        .toggle-password:hover,
        .toggle-password:focus-visible {
            background:
                rgba(255,255,255,.05);

            color:
                var(--text);
        }

        /* =========================================================
           LOGIN OPTIONS
           ========================================================= */

        .login-options {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin:
                18px 0 22px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;

            gap: 8px;

            color:
                var(--text-muted);

            font-size: 13px;

            cursor: pointer;

            user-select: none;
        }

        .checkbox-label input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .checkmark {
            width: 18px;
            height: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                2px solid
                var(--text-dim);

            border-radius: 4px;

            transition:
                all var(--transition);
        }

        .checkbox-label input:checked + .checkmark {
            background:
                var(--accent);

            border-color:
                var(--accent);
        }

        .checkbox-label input:checked + .checkmark::after {
            content: "✓";

            color: white;

            font-size: 11px;
            font-weight: 700;
        }

        .forgot-link {
            border: 0;
            padding: 0;

            background: transparent;

            color:
                var(--text-dim);

            font-size: 13px;

            cursor: pointer;

            text-decoration: none;

            transition:
                color var(--transition);
        }

        .forgot-link:hover,
        .forgot-link:focus-visible {
            color:
                var(--accent);
        }

        /* =========================================================
           BUTTON
           ========================================================= */

        .login-btn {
            position: relative;

            width: 100%;

            min-height: 50px;

            border: 0;

            border-radius:
                var(--radius-sm);

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--info)
                );

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            overflow: hidden;

            box-shadow:
                0 5px 22px
                rgba(59,130,246,.18);

            transition:
                transform var(--transition),
                box-shadow var(--transition),
                opacity var(--transition);
        }

        .login-btn:hover:not(:disabled) {
            transform:
                translateY(-1px);

            box-shadow:
                0 9px 30px
                rgba(59,130,246,.28);
        }

        .login-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .btn-content {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 9px;

            z-index: 2;
        }

        .spinner {
            display: none;

            width: 20px;
            height: 20px;

            border:
                2.5px solid
                rgba(255,255,255,.25);

            border-top-color:
                white;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;
        }

        .login-btn.loading .spinner {
            display: block;
        }

        .login-btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           ERROR
           ========================================================= */

        .error-msg {
            display: none;

            margin-top: 12px;

            padding:
                10px 14px;

            border-right:
                3px solid
                var(--danger);

            border-radius:
                var(--radius-sm);

            background:
                rgba(239,68,68,.06);

            color:
                var(--danger);

            font-size: 13px;

            text-align: right;
        }

        .error-msg.show {
            display: block;

            animation:
                shake .35s ease;
        }

        .error-msg.success {
            border-right-color:
                var(--success);

            background:
                rgba(34,197,94,.06);

            color:
                var(--success);
        }

        @keyframes shake {
            0%,100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-3px);
            }
        }

        /* =========================================================
           ACCOUNT LOCK
           ========================================================= */

        #accountLocked {
            display: none;

            margin-bottom: 14px;

            padding:
                12px 15px;

            border-right:
                3px solid
                var(--danger);

            border-radius:
                var(--radius-sm);

            background:
                rgba(239,68,68,.08);

            text-align: right;
        }

        #accountLocked.show {
            display: block;
        }

        .lock-message {
            color:
                var(--danger-light);

            font-size: 13px;
        }

        .lock-timer {
            color:
                var(--warning);

            font-weight: 700;

            direction: ltr;

            display: inline-block;

            font-variant-numeric:
                tabular-nums;
        }

        /* =========================================================
           OTP
           ========================================================= */

        #otpGroup {
            display: none;
        }

        #otpGroup.show {
            display: block;

            animation:
                fadeIn .3s ease;
        }

        .otp-timer {
            display: flex;
            align-items: center;
            justify-content: center;

            flex-wrap: wrap;

            gap: 6px;

            margin-top: 8px;

            color:
                var(--text-dim);

            font-size: 12px;
        }

        .timer-text {
            color:
                var(--accent);

            font-weight: 700;

            font-variant-numeric:
                tabular-nums;
        }

        .otp-resend {
            border: 0;

            background: transparent;

            color:
                var(--accent);

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;

            padding:
                2px 7px;

            border-radius: 4px;
        }

        .otp-resend:hover:not(:disabled) {
            background:
                rgba(59,130,246,.1);
        }

        .otp-resend:disabled {
            opacity: .3;
            cursor: not-allowed;
        }

        /* =========================================================
           SECURITY BADGES
           ========================================================= */

        .security-badges {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 14px;

            margin-top: 16px;
        }

        .security-badge {
            display: flex;
            align-items: center;

            gap: 5px;

            color:
                var(--text-dim);

            font-size: 11px;
        }

        .badge-shield {
            color:
                var(--success);
        }

        .badge-2fa {
            color:
                var(--accent);
        }

        .badge-lock {
            color:
                var(--warning);
        }

        /* =========================================================
           FOOTER
           ========================================================= */

        .login-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-top: 20px;
            padding-top: 15px;

            border-top:
                1px solid
                var(--border);

            color:
                var(--text-dim);

            font-size: 11px;
        }

        .footer-version {
            padding:
                2px 10px;

            border:
                1px solid
                var(--border);

            border-radius: 20px;

            background:
                rgba(255,255,255,.025);
        }

        /* =========================================================
           TOAST
           ========================================================= */

        #toastContainer {
            position: fixed;

            left: 50%;
            bottom: 22px;

            transform:
                translateX(-50%);

            z-index: 100000;

            width: min(400px, 90%);

            display: flex;
            flex-direction: column;

            gap: 8px;

            pointer-events: none;
        }

        .toast {
            display: flex;
            align-items: center;

            gap: 9px;

            padding:
                11px 15px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius:
                var(--radius-sm);

            color: white;

            font-size: 13px;

            box-shadow:
                0 8px 30px
                rgba(0,0,0,.35);

            animation:
                toastIn .3s ease;

            pointer-events: auto;

            backdrop-filter:
                blur(12px);
        }

        .toast-success {
            background:
                rgba(16,185,129,.94);
        }

        .toast-error {
            background:
                rgba(239,68,68,.94);
        }

        .toast-warning {
            background:
                rgba(245,158,11,.94);
        }

        .toast-info {
            background:
                rgba(59,130,246,.94);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform:
                    translateY(15px)
                    scale(.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* =========================================================
           ACCESSIBILITY
           ========================================================= */

        button:focus-visible,
        input:focus-visible {
            outline:
                2px solid
                var(--accent);

            outline-offset: 2px;
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width:480px) {

            #loginOverlay {
                padding: 12px;
            }

            .login-box {
                padding:
                    30px 20px 23px;
            }

            .logo-icon {
                font-size: 40px;
            }

            .logo-text {
                font-size: 20px;
            }

            .logo-sub {
                font-size: 12px;
            }

            .input-wrapper {
                min-height: 47px;
            }

            .input-wrapper input {
                padding:
                    11px 42px 11px 43px;

                font-size: 13px;
            }

            .login-btn {
                min-height: 47px;
                font-size: 14px;
            }

            .login-options {
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         LOGIN
         ========================================================= -->

    <main id="loginOverlay">

        <div class="login-container">

            <section
                class="login-box"
                aria-labelledby="loginTitle">

                <div class="login-logo">

                    <span
                        class="logo-icon"
                        aria-hidden="true">
                        ⚓
                    </span>

                    <h1
                        id="loginTitle"
                        class="logo-text">
                        منظومة الوسائل البحرية
                    </h1>

                    <p class="logo-sub">
                        نظام إدارة الأسطول المتقدم
                    </p>

                </div>

                <div
                    class="login-divider"
                    aria-hidden="true">

                    <span>
                        تسجيل الدخول الآمن
                    </span>

                </div>

                <!-- ACCOUNT LOCK -->

                <div
                    id="accountLocked"
                    role="alert"
                    aria-live="assertive">

                    <span class="lock-message">

                        🔒 تم قفل الحساب مؤقتاً.
                        حاول بعد

                        <span
                            id="lockTimer"
                            class="lock-timer">
                            15:00
                        </span>

                    </span>

                </div>

                <!-- LOGIN FORM -->

                <form
                    id="loginForm"
                    autocomplete="on"
                    novalidate>

                    <!-- USERNAME -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="username">

                            اسم المستخدم

                        </label>

                        <div class="input-wrapper">

                            <span
                                class="input-icon"
                                aria-hidden="true">
                                👤
                            </span>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="أدخل اسم المستخدم"
                                autocomplete="username"
                                autocapitalize="none"
                                spellcheck="false"
                                maxlength="100"
                                required>

                        </div>

                    </div>

                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="password">

                            كلمة المرور

                        </label>

                        <div class="input-wrapper">

                            <span
                                class="input-icon"
                                aria-hidden="true">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="أدخل كلمة المرور"
                                autocomplete="current-password"
                                maxlength="256"
                                required>

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                                aria-label="إظهار كلمة المرور"
                                aria-pressed="false">

                                👁

                            </button>

                        </div>

                    </div>

                    <!-- OTP -->

                    <div
                        class="form-group"
                        id="otpGroup">

                        <label
                            class="form-label"
                            for="otpCode">

                            رمز التحقق الثنائي (2FA)

                        </label>

                        <div class="input-wrapper">

                            <span
                                class="input-icon"
                                aria-hidden="true">
                                🔐
                            </span>

                            <input
                                type="text"
                                id="otpCode"
                                name="otp"
                                placeholder="أدخل رمز 6 أرقام"
                                inputmode="numeric"
                                autocomplete="one-time-code"
                                maxlength="6"
                                pattern="[0-9]{6}"
                                dir="ltr">

                        </div>

                        <div class="otp-timer">

                            <span>
                                الرمز صالح لمدة
                            </span>

                            <span
                                id="otpTimer"
                                class="timer-text">
                                05:00
                            </span>

                            <button
                                type="button"
                                id="resendOtpBtn"
                                class="otp-resend"
                                disabled>

                                إعادة الإرسال

                            </button>

                        </div>

                    </div>

                    <!-- OPTIONS -->

                    <div
                        id="loginOptions"
                        class="login-options">

                        <label class="checkbox-label">

                            <input
                                type="checkbox"
                                id="rememberMe"
                                name="rememberMe">

                            <span
                                class="checkmark"
                                aria-hidden="true">
                            </span>

                            تذكر الجهاز

                        </label>

                        <button
                            type="button"
                            id="forgotPasswordLink"
                            class="forgot-link">

                            نسيت كلمة المرور؟

                        </button>

                    </div>

                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="login-btn">

                        <span class="btn-content">

                            <span
                                id="btnText"
                                class="btn-text">

                                🔑 دخول إلى النظام

                            </span>

                            <span
                                class="spinner"
                                aria-hidden="true">
                            </span>

                        </span>

                    </button>

                    <!-- ERROR -->

                    <div
                        id="loginError"
                        class="error-msg"
                        role="alert"
                        aria-live="polite">
                    </div>

                    <!-- BADGES -->

                    <div class="security-badges">

                        <span class="security-badge">
                            <span
                                class="badge-shield"
                                aria-hidden="true">
                                🛡
                            </span>
                            تشفير شامل
                        </span>

                        <span class="security-badge">
                            <span
                                class="badge-2fa"
                                aria-hidden="true">
                                🔐
                            </span>
                            2FA
                        </span>

                        <span class="security-badge">
                            <span
                                class="badge-lock"
                                aria-hidden="true">
                                🔒
                            </span>
                            جلسة آمنة
                        </span>

                    </div>

                </form>

                <!-- FOOTER -->

                <footer class="login-footer">

                    <span>
                        نظام إدارة الأسطول البحري
                    </span>

                    <span class="footer-version">
                        Enterprise v17.1
                    </span>

                </footer>

            </section>

        </div>

    </main>

    <!-- TOAST -->

    <div
        id="toastContainer"
        aria-live="polite"
        aria-atomic="true">
    </div>

    <script>

        "use strict";

        /*
         * ============================================================
         * MARINE SYSTEM v17.1
         * SECURE FRONTEND
         * ============================================================
         *
         * IMPORTANT:
         *
         * Frontend security is NOT authentication.
         *
         * All authentication, authorization, lockout,
         * rate limiting and OTP validation MUST happen server-side.
         *
         * No password is stored.
         * No JWT is stored in localStorage.
         * No access token is stored in sessionStorage.
         *
         * ============================================================
         */

        /* =========================================================
           STATE
           ========================================================= */

        let isOtpStep = false;

        let otpTransactionId = null;

        let otpTimerInterval = null;

        let otpSeconds = 300;

        let csrfToken = null;

        let loginInProgress = false;

        /* =========================================================
           DOM
           ========================================================= */

        const loginForm =
            document.getElementById("loginForm");

        const usernameInput =
            document.getElementById("username");

        const passwordInput =
            document.getElementById("password");

        const otpInput =
            document.getElementById("otpCode");

        const otpGroup =
            document.getElementById("otpGroup");

        const loginButton =
            document.getElementById("loginButton");

        const btnText =
            document.getElementById("btnText");

        const loginError =
            document.getElementById("loginError");

        const loginOptions =
            document.getElementById("loginOptions");

        const resendOtpButton =
            document.getElementById("resendOtpBtn");

        const otpTimer =
            document.getElementById("otpTimer");

        const accountLocked =
            document.getElementById("accountLocked");

        const lockTimer =
            document.getElementById("lockTimer");

        /* =========================================================
           SAFE TEXT
           ========================================================= */

        function setError(message, success = false) {

            loginError.textContent = "";

            loginError.className =
                success
                    ? "error-msg success show"
                    : "error-msg show";

            /*
             * SECURITY:
             * textContent instead of innerHTML.
             */

            loginError.textContent = message;
        }

        function clearError() {

            loginError.textContent = "";

            loginError.className =
                "error-msg";
        }

        /* =========================================================
           TOAST - XSS SAFE
           ========================================================= */

        function showToast(message, type = "info") {

            const container =
                document.getElementById(
                    "toastContainer"
                );

            if (!container) {
                return;
            }

            const icons = {
                success: "✅",
                error: "❌",
                warning: "⚠️",
                info: "ℹ️"
            };

            const toast =
                document.createElement("div");

            toast.className =
                "toast toast-" +
                String(type);

            const icon =
                document.createElement("span");

            icon.setAttribute(
                "aria-hidden",
                "true"
            );

            icon.textContent =
                icons[type] || icons.info;

            const text =
                document.createElement("span");

            /*
             * SECURITY FIX:
             *
             * NEVER use innerHTML for dynamic messages.
             */

            text.textContent =
                String(message);

            toast.appendChild(icon);
            toast.appendChild(text);

            container.appendChild(toast);

            window.setTimeout(() => {

                toast.style.opacity = "0";

                toast.style.transform =
                    "translateY(10px)";

                window.setTimeout(() => {

                    if (toast.parentNode) {
                        toast.parentNode.removeChild(
                            toast
                        );
                    }

                }, 300);

            }, 3500);
        }

        /* =========================================================
           CSRF
           ========================================================= */

        async function getCSRFToken() {

            try {

                const response =
                    await fetch(
                        "/api/auth/csrf-token",
                        {
                            method: "GET",

                            credentials: "include",

                            headers: {
                                "Accept":
                                    "application/json"
                            },

                            cache: "no-store"
                        }
                    );

                if (!response.ok) {
                    return null;
                }

                const data =
                    await response.json();

                if (
                    data &&
                    data.success &&
                    typeof data.token === "string" &&
                    data.token.length > 0
                ) {

                    csrfToken =
                        data.token;

                    return csrfToken;
                }

            } catch (error) {

                console.warn(
                    "CSRF initialization failed"
                );
            }

            return null;
        }

        function buildHeaders() {

            const headers = {
                "Accept":
                    "application/json",

                "Content-Type":
                    "application/json"
            };

            if (
                csrfToken &&
                typeof csrfToken === "string"
            ) {

                headers["X-CSRF-Token"] =
                    csrfToken;
            }

            return headers;
        }

        /* =========================================================
           API JSON
           ========================================================= */

        async function parseResponse(response) {

            const contentType =
                response.headers.get(
                    "content-type"
                ) || "";

            if (
                contentType.includes(
                    "application/json"
                )
            ) {

                return await response.json();
            }

            return {
                success: false,
                error:
                    "استجابة غير صالحة من الخادم"
            };
        }

        /* =========================================================
           LOADING
           ========================================================= */

        function setLoading(state) {

            loginInProgress =
                Boolean(state);

            loginButton.disabled =
                Boolean(state);

            loginButton.classList.toggle(
                "loading",
                Boolean(state)
            );
        }

        /* =========================================================
           INPUT VALIDATION
           ========================================================= */

        function validateUsername(username) {

            if (!username) {
                return false;
            }

            if (username.length > 100) {
                return false;
            }

            return true;
        }

        function validateOtp(otp) {

            return /^[0-9]{6}$/.test(
                otp
            );
        }

        /* =========================================================
           LOGIN
           ========================================================= */

        async function doLogin(event) {

            event.preventDefault();

            if (loginInProgress) {
                return;
            }

            clearError();

            /*
             * =====================================================
             * OTP STEP
             * =====================================================
             */

            if (isOtpStep) {

                const otp =
                    otpInput.value
                        .trim();

                if (!validateOtp(otp)) {

                    setError(
                        "⚠️ يرجى إدخال رمز التحقق المكون من 6 أرقام"
                    );

                    otpInput.focus();

                    return;
                }

                await verifyOtp(otp);

                return;
            }

            /*
             * =====================================================
             * NORMAL LOGIN
             * =====================================================
             */

            const username =
                usernameInput.value
                    .trim();

            const password =
                passwordInput.value;

            const rememberMe =
                document.getElementById(
                    "rememberMe"
                ).checked;

            if (
                !validateUsername(
                    username
                ) ||
                !password
            ) {

                setError(
                    "⚠️ يرجى إدخال اسم المستخدم وكلمة المرور"
                );

                return;
            }

            setLoading(true);

            try {

                /*
                 * Get CSRF token immediately
                 * before authentication.
                 */

                if (!csrfToken) {

                    await getCSRFToken();
                }

                const response =
                    await fetch(
                        "/api/auth/login",
                        {
                            method: "POST",

                            credentials: "include",

                            cache: "no-store",

                            headers:
                                buildHeaders(),

                            body:
                                JSON.stringify({
                                    username:
                                        username,

                                    password:
                                        password,

                                    rememberMe:
                                        Boolean(
                                            rememberMe
                                        )
                                })
                        }
                    );

                const data =
                    await parseResponse(
                        response
                    );

                /*
                 * =================================================
                 * OTP REQUIRED
                 * =================================================
                 */

                if (
                    response.ok &&
                    data &&
                    data.success &&
                    data.requiresOtp
                ) {

                    /*
                     * Transaction ID must be
                     * generated server-side.
                     */

                    if (
                        typeof data.transactionId !==
                        "string" ||
                        !data.transactionId
                    ) {

                        throw new Error(
                            "Invalid OTP transaction"
                        );
                    }

                    otpTransactionId =
                        data.transactionId;

                    isOtpStep = true;

                    otpGroup.classList.add(
                        "show"
                    );

                    loginOptions.style.display =
                        "none";

                    btnText.textContent =
                        "🔐 تأكيد رمز التحقق";

                    otpInput.value = "";

                    otpInput.focus();

                    startOtpTimer();

                    setError(
                        "✅ " +
                        (
                            data.message ||
                            "تم إرسال رمز التحقق"
                        ),
                        true
                    );

                    showToast(
                        "تم إرسال رمز التحقق",
                        "info"
                    );

                    return;
                }

                /*
                 * =================================================
                 * LOGIN SUCCESS WITHOUT OTP
                 * =================================================
                 */

                if (
                    response.ok &&
                    data &&
                    data.success
                ) {

                    completeLogin(
                        data.user
                    );

                    return;
                }

                /*
                 * =================================================
                 * LOCKED
                 * =================================================
                 */

                if (
                    response.status === 423 ||
                    data?.locked
                ) {

                    showAccountLocked(
                        Number(
                            data.retryAfter ||
                            900
                        )
                    );

                    setError(
                        "🔒 تم قفل الحساب مؤقتاً"
                    );

                    return;
                }

                /*
                 * =================================================
                 * GENERIC AUTH FAILURE
                 * =================================================
                 *
                 * Deliberately generic.
                 * Do not distinguish:
                 *
                 * user does not exist
                 * wrong password
                 * disabled account
                 *
                 */

                setError(
                    "❌ اسم المستخدم أو كلمة المرور غير صحيحة"
                );

            } catch (error) {

                console.error(
                    "Authentication error"
                );

                setError(
                    "❌ تعذر الاتصال بالخادم. يرجى المحاولة لاحقاً."
                );

            } finally {

                setLoading(false);
            }
        }

        /* =========================================================
           VERIFY OTP
           ========================================================= */

        async function verifyOtp(otp) {

            if (
                !otpTransactionId
            ) {

                resetOtpState();

                setError(
                    "❌ انتهت جلسة التحقق. يرجى تسجيل الدخول من جديد."
                );

                return;
            }

            setLoading(true);

            try {

                const response =
                    await fetch(
                        "/api/auth/verify-otp",
                        {
                            method: "POST",

                            credentials: "include",

                            cache: "no-store",

                            headers:
                                buildHeaders(),

                            body:
                                JSON.stringify({
                                    otp:
                                        otp,

                                    transactionId:
                                        otpTransactionId
                                })
                        }
                    );

                const data =
                    await parseResponse(
                        response
                    );

                if (
                    response.ok &&
                    data &&
                    data.success
                ) {

                    stopOtpTimer();

                    completeLogin(
                        data.user
                    );

                    return;
                }

                /*
                 * Server should enforce OTP
                 * attempt limits.
                 */

                setError(
                    "❌ رمز التحقق غير صحيح أو منتهي الصلاحية"
                );

                otpInput.value = "";

                otpInput.focus();

            } catch (error) {

                console.error(
                    "OTP verification error"
                );

                setError(
                    "❌ حدث خطأ في الاتصال بالخادم"
                );

            } finally {

                setLoading(false);
            }
        }

        /* =========================================================
           COMPLETE LOGIN
           ========================================================= */

        function completeLogin(user) {

            /*
             * IMPORTANT:
             *
             * We intentionally do NOT store:
             *
             * password
             * access token
             * refresh token
             * session ID
             *
             * Authentication should be represented
             * by a secure HttpOnly cookie controlled
             * by the server.
             */

            if (
                user &&
                typeof user === "object"
            ) {

                /*
                 * Only display-safe information.
                 *
                 * Do not trust these values for authorization.
                 */

                const displayName =
                    typeof user.name === "string" &&
                    user.name.length <= 200
                        ? user.name
                        : (
                            typeof user.username === "string"
                                ? user.username
                                : "المستخدم"
                        );

                showToast(
                    "مرحباً " +
                    displayName,
                    "success"
                );

            } else {

                showToast(
                    "تم تسجيل الدخول بنجاح",
                    "success"
                );
            }

            /*
             * Redirect to server-protected page.
             */

            window.setTimeout(() => {

                window.location.replace(
                    "/dashboard"
                );

            }, 500);
        }

        /* =========================================================
           OTP TIMER
           ========================================================= */

        function startOtpTimer() {

            stopOtpTimer();

            otpSeconds = 300;

            resendOtpButton.disabled =
                true;

            updateOtpTimer();

            otpTimerInterval =
                window.setInterval(() => {

                    otpSeconds--;

                    updateOtpTimer();

                    if (
                        otpSeconds <= 0
                    ) {

                        stopOtpTimer();

                        resendOtpButton.disabled =
                            false;

                        otpTimer.textContent =
                            "00:00";
                    }

                }, 1000);
        }

        function stopOtpTimer() {

            if (
                otpTimerInterval !== null
            ) {

                window.clearInterval(
                    otpTimerInterval
                );

                otpTimerInterval = null;
            }
        }

        function updateOtpTimer() {

            const safeSeconds =
                Math.max(
                    0,
                    Number(otpSeconds) || 0
                );

            const minutes =
                Math.floor(
                    safeSeconds / 60
                );

            const seconds =
                safeSeconds % 60;

            otpTimer.textContent =
                String(minutes)
                    .padStart(2, "0") +
                ":" +
                String(seconds)
                    .padStart(2, "0");

            otpTimer.style.color =
                safeSeconds <= 60
                    ? "var(--danger)"
                    : "";
        }

        /* =========================================================
           RESET OTP
           ========================================================= */

        function resetOtpState() {

            stopOtpTimer();

            isOtpStep = false;

            otpTransactionId = null;

            otpSeconds = 300;

            otpGroup.classList.remove(
                "show"
            );

            loginOptions.style.display =
                "";

            btnText.textContent =
                "🔑 دخول إلى النظام";

            otpInput.value = "";

            resendOtpButton.disabled =
                true;

            updateOtpTimer();
        }

        /* =========================================================
           RESEND OTP
           ========================================================= */

        async function resendOtp() {

            if (
                loginInProgress ||
                !otpTransactionId
            ) {
                return;
            }

            resendOtpButton.disabled =
                true;

            try {

                const response =
                    await fetch(
                        "/api/auth/resend-otp",
                        {
                            method: "POST",

                            credentials: "include",

                            cache: "no-store",

                            headers:
                                buildHeaders(),

                            body:
                                JSON.stringify({
                                    transactionId:
                                        otpTransactionId
                                })
                        }
                    );

                const data =
                    await parseResponse(
                        response
                    );

                if (
                    response.ok &&
                    data &&
                    data.success &&
                    typeof data.transactionId ===
                    "string"
                ) {

                    otpTransactionId =
                        data.transactionId;

                    startOtpTimer();

                    showToast(
                        "تم إعادة إرسال رمز التحقق",
                        "success"
                    );

                    return;
                }

                showToast(
                    "تعذر إعادة إرسال الرمز",
                    "error"
                );

                resendOtpButton.disabled =
                    false;

            } catch (error) {

                console.error(
                    "OTP resend error"
                );

                showToast(
                    "حدث خطأ في إعادة الإرسال",
                    "error"
                );

                resendOtpButton.disabled =
                    false;
            }
        }

        /* =========================================================
           FORGOT PASSWORD
           ========================================================= */

        async function handleForgotPassword() {

            /*
             * Do not reveal whether
             * an account exists.
             */

            const email =
                window.prompt(
                    "📧 أدخل بريدك الإلكتروني لإعادة تعيين كلمة المرور:"
                );

            if (!email) {
                return;
            }

            const cleanEmail =
                email.trim();

            if (
                cleanEmail.length === 0 ||
                cleanEmail.length > 254
            ) {
                showToast(
                    "يرجى إدخال بريد إلكتروني صالح",
                    "warning"
                );

                return;
            }

            try {

                /*
                 * Refresh CSRF if necessary.
                 */

                if (!csrfToken) {
                    await getCSRFToken();
                }

                await fetch(
                    "/api/auth/forgot-password",
                    {
                        method: "POST",

                        credentials: "include",

                        cache: "no-store",

                        headers:
                            buildHeaders(),

                        body:
                            JSON.stringify({
                                email:
                                    cleanEmail
                            })
                    }
                );

            } catch (error) {

                /*
                 * Intentionally ignored.
                 *
                 * User receives same message
                 * whether account exists or not.
                 */
            }

            showToast(
                "إذا كان البريد مسجلاً لدينا، فستصلك رسالة إعادة التعيين",
                "success"
            );
        }

        /* =========================================================
           ACCOUNT LOCK UI
           ========================================================= */

        let lockTimerInterval = null;

        function showAccountLocked(seconds) {

            let remaining =
                Math.max(
                    0,
                    Number(seconds) || 900
                );

            accountLocked.classList.add(
                "show"
            );

            if (
                lockTimerInterval !== null
            ) {

                window.clearInterval(
                    lockTimerInterval
                );
            }

            updateLockTimer(
                remaining
            );

            lockTimerInterval =
                window.setInterval(() => {

                    remaining--;

                    updateLockTimer(
                        remaining
                    );

                    if (
                        remaining <= 0
                    ) {

                        window.clearInterval(
                            lockTimerInterval
                        );

                        lockTimerInterval =
                            null;

                        accountLocked.classList.remove(
                            "show"
                        );
                    }

                }, 1000);
        }

        function updateLockTimer(
            seconds
        ) {

            const safeSeconds =
                Math.max(
                    0,
                    Number(seconds) || 0
                );

            const minutes =
                Math.floor(
                    safeSeconds / 60
                );

            const secs =
                safeSeconds % 60;

            lockTimer.textContent =
                String(minutes)
                    .padStart(2, "0") +
                ":" +
                String(secs)
                    .padStart(2, "0");
        }

        /* =========================================================
           PASSWORD VISIBILITY
           ========================================================= */

        function togglePassword() {

            const isPassword =
                passwordInput.type ===
                "password";

            passwordInput.type =
                isPassword
                    ? "text"
                    : "password";

            const button =
                document.getElementById(
                    "togglePassword"
                );

            button.setAttribute(
                "aria-pressed",
                String(isPassword)
            );

            button.setAttribute(
                "aria-label",
                isPassword
                    ? "إخفاء كلمة المرور"
                    : "إظهار كلمة المرور"
            );

            button.textContent =
                isPassword
                    ? "🙈"
                    : "👁";
        }

        /* =========================================================
           OTP INPUT
           ========================================================= */

        otpInput.addEventListener(
            "input",
            () => {

                /*
                 * Allow digits only.
                 */

                otpInput.value =
                    otpInput.value
                        .replace(
                            /[^0-9]/g,
                            ""
                        )
                        .slice(
                            0,
                            6
                        );
            }
        );

        /* =========================================================
           EVENTS
           ========================================================= */

        loginForm.addEventListener(
            "submit",
            doLogin
        );

        document
            .getElementById(
                "togglePassword"
            )
            .addEventListener(
                "click",
                togglePassword
            );

        document
            .getElementById(
                "forgotPasswordLink"
            )
            .addEventListener(
                "click",
                handleForgotPassword
            );

        resendOtpButton.addEventListener(
            "click",
            resendOtp
        );

        /* =========================================================
           INITIALIZATION
           ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                console.log(
                    "Marine System v17.1 initializing"
                );

                /*
                 * Initialize CSRF.
                 */

                await getCSRFToken();

                /*
                 * Focus username.
                 */

                usernameInput.focus();

                console.log(
                    "Marine System v17.1 ready"
                );
            }
        );

        /* =========================================================
           CLEANUP
           ========================================================= */

        window.addEventListener(
            "pagehide",
            () => {

                stopOtpTimer();

                if (
                    lockTimerInterval !== null
                ) {

                    window.clearInterval(
                        lockTimerInterval
                    );

                    lockTimerInterval =
                        null;
                }

                /*
                 * Clear transient authentication state.
                 */

                otpTransactionId = null;
                csrfToken = null;
            }
        );

    </script>

</body>
