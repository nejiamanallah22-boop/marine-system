<!DOCTYPE html>

<head>

<body>

<!-- ============================================================
     LOGIN
     ============================================================ -->

<div id="loginOverlay">
    <div class="login-box">
        <div class="login-logo">
            <span class="logo-icon">⚓</span>
            <span class="logo-text">منظومة الوسائل البحرية</span>
        </div>
        <p class="subtitle">نظام متابعة وإدارة الأسطول البحري</p>
        <div class="developer">
            <span class="dev-label">الوكيل</span>
            <span class="dev-name">أمان الله ناجي</span>
        </div>

        <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="username">
        </div>

        <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password">
        </div>

        <button type="button" class="login-btn" id="loginButton">
            <span id="loginButtonIcon">🚀</span>
            <span id="loginButtonText">دخول</span>
        </button>

        <div id="loginError" class="error-msg" role="alert"></div>

        <div class="login-footer">
            <span>نظام إدارة وإسناد الوحدات البحرية</span>
            <span class="version">v5.1</span>
        </div>
    </div>
</div>

<!-- ============================================================
     MAIN APP
     ============================================================ -->

<div id="mainApp" style="display:none;">

    <header>
        <div class="header-left">
            <button type="button" class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <h1>⚓ منظومة الوسائل البحرية <span class="developer-tag">الوكيل أمان الله ناجي</span></h1>
        </div>
        <div class="header-right">
            <button type="button" class="notification-icon" onclick="toggleNotifications()">🔔 <span class="notification-badge" id="notificationBadge">0</span></button>
            <span class="role-badge" id="userRoleDisplay">👤</span>
            <button class="btn-outline-white" onclick="window.print()"><i class="fas fa-print"></i></button>
            <button class="btn-outline-white" onclick="refreshAllPages()"><i class="fas fa-sync-alt"></i></button>
            <button class="btn-outline-white btn-logout" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand"><span>⚓</span> الأسطول البحري</div>

        <button class="nav-btn active" onclick="showPage('dashboard')"><i class="fas fa-chart-pie"></i> لوحة التحكم</button>
        <button class="nav-btn" onclick="showPage('fleet')"><i class="fas fa-ship"></i> الأسطول</button>
        <button class="nav-btn" onclick="showPage('maintenance')"><i class="fas fa-wrench"></i> الصيانة</button>
        <button class="nav-btn" onclick="showPage('efficiency')"><i class="fas fa-chart-line"></i> الجاهزية</button>
        <button class="nav-btn" onclick="showPage('support')"><i class="fas fa-headset"></i> الدعم</button>
        <button class="nav-btn" onclick="showPage('users')"><i class="fas fa-users"></i> المستخدمين</button>
        <button class="nav-btn" onclick="showPage('notes')"><i class="fas fa-sticky-note"></i> Note Verbale</button>
        <button class="nav-btn" onclick="showPage('sessions')"><i class="fas fa-users-cog"></i> المراقبة</button>
        <button class="nav-btn" onclick="showPage('ai-assistant')"><i class="fas fa-robot"></i> 🤖 المساعد الذكي</button>

        <div class="sidebar-footer"><span>الوكيل أمان الله ناجي</span> <span class="version">v5.1</span></div>
    </nav>

    <main class="main-content">
        <div id="pageContainer">
            <!-- سيتم تحميل المحتوى هنا -->
        </div>
    </main>

</div>

<!-- ============================================================
     SCROLL BUTTONS
     ============================================================ -->

<div class="scroll-buttons">
    <button class="scroll-btn" onclick="scrollToTop()"><i class="fas fa-chevron-up"></i></button>
    <button class="scroll-btn" onclick="scrollToBottom()"><i class="fas fa-chevron-down"></i></button>
</div>

<!-- ============================================================
     MODALS
     ============================================================ -->

<div id="passwordModal" class="modal-overlay">
    <div class="modal-box">
        <h3>🔑 تغيير كلمة المرور</h3>
        <p id="modalUserName"></p>
        <input type="password" id="currentPassword" placeholder="كلمة المرور الحالية">
        <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة">
        <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور">
        <div class="modal-actions">
            <button class="btn-save" onclick="saveNewPassword()">حفظ</button>
            <button class="btn-cancel" onclick="closePasswordModal()">إلغاء</button>
        </div>
    </div>
</div>

<div id="notificationModal" class="modal-overlay">
    <div class="modal-box">
        <h3>🔔 الإشعارات</h3>
        <div id="notificationList"><p style="color:rgba(255,255,255,0.4);text-align:center;padding:20px;">لا توجد إشعارات جديدة</p></div>

</div>

    console.log('🚀 تطبيق البحرية جاهز');

    // ============================================================
    // 📦 البيانات التجريبية
    // ============================================================

    const DEMO_DATA = {
        vessels: [
            { name: 'البروق 1', stat: 'صالح' },
            { name: 'البروق 2', stat: 'صالح' },
            { name: 'البروق 3', stat: 'صالح' },
            { name: 'البروق 4', stat: 'صالح' },
            { name: 'البروق 5', stat: 'معطب' },
            { name: 'البروق 6', stat: 'صيانة' },
            { name: 'البروق 7', stat: 'صالح' },
            { name: 'البروق 8', stat: 'صالح' },
        ],
        maintenance: [
            { vesselName: 'البروق 3', cost: 1200 },
            { vesselName: 'البروق 6', cost: 500 },
            { vesselName: 'البروق 5', cost: 2300 },

    };

    // ============================================================
    // 🧰 دوال مساعدة
    // ============================================================

    function getElement(id) {
        return document.getElementById(id);
    }

    function getStoredUser() {
        try {
            const data = localStorage.getItem('userData');
            return data ? JSON.parse(data) : null;
        } catch { return null; }
    }

    function getStoredToken() {
        return localStorage.getItem('authToken');
    }

    // ============================================================
    // 👤 عرض المستخدم
    // ============================================================

    function updateUserDisplay() {
        const user = getStoredUser();
        const el = getElement('userRoleDisplay');
        if (!el) return;
        if (user) {
            el.textContent = `👤 ${user.name || 'مستخدم'} - ${user.role || 'مستخدم'}`;
        } else {
            el.textContent = '👤';
        }
    }

    function showApplication() {
        const login = getElement('loginOverlay');
        const main = getElement('mainApp');
        if (login) login.style.display = 'none';
        if (main) main.style.display = 'block';
        updateUserDisplay();
    }

    function showLogin() {
        const login = getElement('loginOverlay');
        const main = getElement('mainApp');
        if (login) login.style.display = 'flex';
        if (main) main.style.display = 'none';
    }

    // ============================================================
    // 🔑 تسجيل الدخول
    // ============================================================

    function doLogin() {
        const username = getElement('username')?.value?.trim() || '';
        const password = getElement('password')?.value || '';
        const errorEl = getElement('loginError');

        if (errorEl) errorEl.textContent = '';

        if (!username || !password) {
            if (errorEl) errorEl.textContent = '❌ يرجى إدخال اسم المستخدم وكلمة المرور';
            return;
        }

        if (username === 'admin' && password === '123456') {
            const user = { name: 'مدير النظام', email: 'admin', role: 'مسؤول' };
            localStorage.setItem('authToken', 'demo-token');
            localStorage.setItem('userData', JSON.stringify(user));
            showApplication();
            showPage('dashboard');
            return;
        }

        if (errorEl) {
            errorEl.textContent = '❌ اسم المستخدم أو كلمة المرور غير صحيحة (admin / 123456)';
        }
    }

    function doLogout() {
        localStorage.removeItem('authToken');
        localStorage.removeItem('userData');
        showLogin();
    }

                    <div style="background:rgba(255,255,255,0.02); border-radius:14px; padding:20px; border:1px solid rgba(255,255,255,0.05); margin-top:15px;">
                        <div style="display:flex; align-items:center; padding:12px; border-bottom:1px solid rgba(255,255,255,0.05);">
                            <span style="width:40px; height:40px; border-radius:50%; background:rgba(74,222,128,0.2); display:flex; align-items:center; justify-content:center; color:#4ade80; font-weight:bold;">أ</span>
                            <div style="margin-right:15px; flex:1;">
                                <div style="font-weight:600; color:#fff;">مدير النظام</div>
                                <div style="font-size:12px; color:rgba(255,255,255,0.3);">نشط الآن</div>
                            </div>
                            <span style="font-size:12px; color:#4ade80;">🟢 متصل</span>
                        </div>
                        <div style="display:flex; align-items:center; padding:12px;">
                            <span style="width:40px; height:40px; border-radius:50%; background:rgba(251,191,36,0.2); display:flex; align-items:center; justify-content:center; color:#fbbf24; font-weight:bold;">م</span>
                            <div style="margin-right:15px; flex:1;">
                                <div style="font-weight:600; color:#fff;">مشرف العمليات</div>
                                <div style="font-size:12px; color:rgba(255,255,255,0.3);">آخر نشاط: 5 دقائق</div>
                            </div>
                            <span style="font-size:12px; color:#fbbf24;">🟡 غير نشط</span>
                        </div>
                    </div>
                </div>
            `,

            // ================================================
            // 🤖 AI ASSISTANT
            // ================================================

            'ai-assistant': `
                <div style="padding:20px;">
                    <h2 style="color:#60a5fa;">🤖 المساعد الذكي</h2>
                    <div style="background:rgba(255,255,255,0.02); border-radius:14px; padding:30px; border:1px solid rgba(255,255,255,0.05); margin-top:15px; text-align:center;">
                        <div style="font-size:60px; margin-bottom:15px;">🤖</div>
                        <h3 style="color:#fff; margin-bottom:10px;">المساعد الذكي جاهز</h3>
                        <p style="color:rgba(255,255,255,0.4); max-width:400px; margin:0 auto;">اسألني عن أي شيء يتعلق بالأسطول البحري</p>
                        <div style="display:flex; gap:10px; max-width:500px; margin:20px auto 0;">
                            <input type="text" placeholder="اكتب سؤالك هنا..." style="flex:1; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:#fff;">
                            <button style="padding:12px 25px; border-radius:10px; border:none; background:#60a5fa; color:#fff; cursor:pointer;">إرسال</button>
                        </div>
                    </div>
                </div>
            `
        };

        return pages[page] || `
            <div style="padding:40px; text-align:center;">
                <div style="font-size:48px; margin-bottom:15px;">⚠️</div>
                <h2 style="color:#f87171;">الصفحة غير موجودة</h2>
                <p style="color:rgba(255,255,255,0.4);">${page}</p>
                <button onclick="showPage('dashboard')" style="margin-top:15px; padding:10px 30px; background:#60a5fa; border:none; border-radius:10px; color:white; cursor:pointer;">🏠 العودة للرئيسية</button>
            </div>
        `;
    }

    // ============================================================
    // 📄 عرض الصفحة
    // ============================================================

    function showPage(page) {
        const container = getElement('pageContainer');
        if (!container) return;

        console.log('📄 عرض الصفحة:', page);

        // تحديث الأزرار النشطة
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = Array.from(document.querySelectorAll('.nav-btn')).find(btn => {
            const onclick = btn.getAttribute('onclick') || '';
            return onclick.includes(`'${page}'`) || onclick.includes(`"${page}"`);
        });
        if (activeBtn) activeBtn.classList.add('active');

        // عرض المحتوى
        container.innerHTML = getPageHTML(page);

        // تهيئة Dashboard
        if (page === 'dashboard') {
            setTimeout(initDashboard, 100);
        }

        // تهيئة Efficiency Chart
        if (page === 'efficiency') {
            setTimeout(initEfficiencyChart, 100);
        }

        // إغلاق Sidebar على الشاشات الصغيرة
        if (window.innerWidth <= 900) {
            const sidebar = getElement('sidebar');
            if (sidebar) sidebar.classList.remove('open');
        }
    }

    // ============================================================
    // 📊 تهيئة Dashboard
    // ============================================================

    function initDashboard() {
        const vessels = DEMO_DATA.vessels;
        const maintenance = DEMO_DATA.maintenance;

        const total = vessels.length;
        const ready = vessels.filter(v => v.stat === 'صالح').length;
        const broken = vessels.filter(v => v.stat === 'معطب').length;
        const maintenanceCount = vessels.filter(v => v.stat === 'صيانة').length;
        const readyPercent = total ? Math.round((ready / total) * 100) : 0;
        const totalCost = maintenance.reduce((s, r) => s + (r.cost || 0), 0);

        const ids = {
            dashTotal: total,
            dashReady: ready,
            dashBroken: broken,
            dashMaintenance: maintenanceCount,
            dashReadyPercent: readyPercent + '%',
            dashTotalCost: totalCost.toLocaleString() + ' د.ت'
        };

        Object.entries(ids).forEach(([id, val]) => {
            const el = document.getElementById(id);
            if (el) el.textContent = val;
        });

        // رسوم بيانية
        if (typeof Chart !== 'undefined') {
            try {
                const ctx = document.getElementById('dashChart');
                if (ctx) {
                    if (window.dashChart) window.dashChart.destroy();
                    window.dashChart = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['✅ صالح', '❌ معطب', '🔧 صيانة'],
                            datasets: [{
                                data: [ready, broken, maintenanceCount],
                                backgroundColor: ['rgba(74,222,128,0.8)', 'rgba(248,113,113,0.8)', 'rgba(251,191,36,0.8)'],
                                borderColor: ['#4ade80', '#f87171', '#fbbf24'],
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '60%',
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: 'rgba(255,255,255,0.6)', font: { size: 11 } }
                                }
                            }
                        }
                    });
                }

                const lineCtx = document.getElementById('dashLineChart');
                if (lineCtx) {
                    if (window.dashLineChart) window.dashLineChart.destroy();
                    window.dashLineChart = new Chart(lineCtx, {
                        type: 'line',
                        data: {
                            labels: ['جانفي', 'فيفري', 'مارس', 'أفريل', 'ماي', 'جوان'],
                            datasets: [{
                                label: '📈 نسبة الجاهزية %',
                                data: [72, 75, 78, 82, 85, 88],
                                borderColor: '#34d399',
                                backgroundColor: 'rgba(52,211,153,0.15)',
                                fill: true,
                                tension: 0.4,
                                pointBackgroundColor: '#34d399',
                                pointBorderColor: '#ffffff',
                                pointBorderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: 'rgba(255,255,255,0.6)', font: { size: 11 } }
                                }
                            },
                            scales: {
                                x: { ticks: { color: 'rgba(255,255,255,0.3)' }, grid: { color: 'rgba(255,255,255,0.03)' } },
                                y: { ticks: { color: 'rgba(255,255,255,0.3)' }, beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,0.03)' } }
                            }
                        }
                    });
                }
            } catch (e) {
                console.warn('Chart error:', e);
            }
        }
    }

    // ============================================================
    // 📊 تهيئة Efficiency Chart
    // ============================================================

    function initEfficiencyChart() {
        if (typeof Chart === 'undefined') return;

        try {
            const ctx = document.getElementById('efficiencyChart');
            if (!ctx) return;

            if (window.efficiencyChart) window.efficiencyChart.destroy();

            window.efficiencyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['البروق 1', 'البروق 2', 'البروق 3', 'البروق 4', 'البروق 5', 'البروق 6'],
                    datasets: [{
                        label: 'نسبة الجاهزية',
                        data: [95, 88, 92, 78, 45, 60],
                        backgroundColor: ['rgba(74,222,128,0.8)', 'rgba(74,222,128,0.7)', 'rgba(74,222,128,0.8)', 'rgba(251,191,36,0.8)', 'rgba(248,113,113,0.8)', 'rgba(251,191,36,0.8)'],
                        borderColor: ['#4ade80', '#4ade80', '#4ade80', '#fbbf24', '#f87171', '#fbbf24'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: 'rgba(255,255,255,0.6)', font: { size: 11 } }
                        }
                    },
                    scales: {
                        x: { ticks: { color: 'rgba(255,255,255,0.3)' }, grid: { color: 'rgba(255,255,255,0.03)' } },
                        y: { ticks: { color: 'rgba(255,255,255,0.3)' }, beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,0.03)' } }
                    }
                }
            });
        } catch (e) {
            console.warn('Efficiency chart error:', e);
        }
    }

    // ============================================================
    // 🔔 دوال إضافية
    // ============================================================

    function toggleSidebar() {
        const sidebar = getElement('sidebar');
        if (sidebar) sidebar.classList.toggle('open');
    }

    function toggleNotifications() {
        const modal = getElement('notificationModal');
        if (modal) {
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }
    }

    function closeNotificationModal() {
        const modal = getElement('notificationModal');
        if (modal) modal.style.display = 'none';
    }

    function closePasswordModal() {
        const modal = getElement('passwordModal');
        if (modal) modal.style.display = 'none';
    }

    function openPasswordModal(userId, userName) {
        const modal = getElement('passwordModal');
        const nameEl = getElement('modalUserName');
        if (modal) {
            modal.dataset.userId = userId || '';
            if (nameEl) nameEl.textContent = userName || 'المستخدم';
            modal.style.display = 'flex';
        }
    }

    function saveNewPassword() {
        alert('وظيفة تغيير كلمة المرور قيد التطوير');
        closePasswordModal();
    }

    function refreshAllPages() {
        showPage('dashboard');
    }

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function scrollToBottom() {
        window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
    }

    // ============================================================
    // 🚀 تشغيل التطبيق
    // ============================================================

    function initApp() {
        // أزرار الدخول
        const loginBtn = getElement('loginButton');
        if (loginBtn) {
            loginBtn.addEventListener('click', doLogin);
        }

        // Enter في حقول الدخول
        const username = getElement('username');
        const password = getElement('password');

        if (username) {
            username.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (password) password.focus();
                }
            });
        }

        if (password) {
            password.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    doLogin();
                }
            });
        }

        // التحقق من الجلسة
        const token = getStoredToken();
        const user = getStoredUser();

        if (token && user) {
            showApplication();
            showPage('dashboard');
        } else {
            showLogin();
        }
    }

    // ============================================================
    // 🌐 دوال عامة
    // ============================================================

    window.doLogin = doLogin;
    window.handleLogin = doLogin;
    window.doLogout = doLogout;
    window.showPage = showPage;
    window.toggleSidebar = toggleSidebar;
    window.toggleNotifications = toggleNotifications;
    window.closeNotificationModal = closeNotificationModal;
    window.closePasswordModal = closePasswordModal;
    window.openPasswordModal = openPasswordModal;
    window.saveNewPassword = saveNewPassword;
    window.refreshAllPages = refreshAllPages;
    window.scrollToTop = scrollToTop;
    window.scrollToBottom = scrollToBottom;

    // ============================================================
    // بدء التشغيل
    // ============================================================

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
    } else {
        initApp();
    }
</script>

</body>
</html>
