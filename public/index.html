<!-- ============================================================
     LOGIN OVERLAY
     ============================================================ -->

<div id="loginOverlay" role="dialog" aria-labelledby="loginTitle">

    <div class="login-box">

        <div class="login-logo">
            <span class="logo-icon" aria-hidden="true">⚓</span>
            <span class="logo-text" id="loginTitle">منظومة الوسائل البحرية</span>
        </div>

        <p class="subtitle">نظام متابعة وإدارة الأسطول البحري</p>

        <div class="developer">
            <span class="dev-label">الوكيل</span>
            <span class="dev-name">أمان الله ناجي</span>
        </div>

        <!-- Username -->
        <div class="input-group">
            <i class="fas fa-user input-icon" aria-hidden="true"></i>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="اسم المستخدم"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                maxlength="100"
                required
            >
        </div>

        <!-- Password -->
        <div class="input-group">
            <i class="fas fa-lock input-icon" aria-hidden="true"></i>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="كلمة المرور"
                autocomplete="current-password"
                maxlength="200"
                required
            >
        </div>

        <!-- Login Button -->
        <button
            type="button"
            class="login-btn"
            id="loginButton"
            aria-label="تسجيل الدخول"
        >
            <span id="loginButtonIcon" aria-hidden="true">🚀</span>
            <span id="loginButtonText">دخول</span>
        </button>

        <!-- Error Message -->
        <div id="loginError" class="error-msg" role="alert" aria-live="polite"></div>

        <div class="login-footer">
            <span>نظام إدارة وإسناد الوحدات البحرية</span>
            <span class="version">v5.1</span>
        </div>

    </div>

</div>

<!-- ============================================================
     FALLBACK - إذا فشل تحميل app.js
     ============================================================ -->

<script>
    (function ensureAppWorks() {

        // انتظار حتى يكتمل تحميل الصفحة
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', checkAndFallback);
        } else {
            checkAndFallback();
        }

        function checkAndFallback() {

            // إذا كان app.js قد حمل بنجاح، لا نفعل شيئاً
            if (typeof window.showPage === 'function' && typeof window.doLogin === 'function') {
                console.log('✅ app.js loaded successfully');
                return;
            }

            console.warn('⚠️ app.js not loaded - using fallback');

            // ====================================================
            // تعريف جميع الدوال الأساسية في Fallback
            // ====================================================

            // بيانات تجريبية
            const DEMO_DATA = {
                vessels: [
                    { name: 'البروق 1', stat: 'صالح' },
                    { name: 'البروق 2', stat: 'صالح' },
                    { name: 'البروق 3', stat: 'صالح' },
                    { name: 'البروق 4', stat: 'صالح' },
                    { name: 'البروق 5', stat: 'معطب' },
                    { name: 'البروق 6', stat: 'صيانة' },
                    { name: 'البروق 7', stat: 'صالح' },
                    { name: 'البروق 8', stat: 'صالح' },
                ],
                maintenance: [
                    { vesselName: 'البروق 3', cost: 1200 },
                    { vesselName: 'البروق 6', cost: 500 },
                    { vesselName: 'البروق 5', cost: 2300 },
                ]
            };

            // دوال مساعدة
            function getElement(id) {
                return document.getElementById(id);
            }

            // إدارة الجلسة
            function getStoredUser() {
                try {
                    const data = localStorage.getItem('userData');
                    return data ? JSON.parse(data) : null;
                } catch { return null; }
            }

            function showApplication() {
                const login = getElement('loginOverlay');
                const main = getElement('mainApp');
                if (login) login.style.display = 'none';
                if (main) main.style.display = 'block';
                const user = getStoredUser();
                const roleEl = getElement('userRoleDisplay');
                if (roleEl && user) {
                    roleEl.textContent = `👤 ${user.name || 'مستخدم'} - ${user.role || 'مستخدم'}`;
                }
            }

            function showLogin() {
                const login = getElement('loginOverlay');
                const main = getElement('mainApp');
                if (login) login.style.display = 'flex';
                if (main) main.style.display = 'none';
            }

            // دوال أساسية
            window.doLogin = function() {
                const username = getElement('username')?.value?.trim() || '';
                const password = getElement('password')?.value || '';
                const errorEl = getElement('loginError');

                if (errorEl) errorEl.textContent = '';

                if (!username || !password) {
                    if (errorEl) errorEl.textContent = '❌ يرجى إدخال اسم المستخدم وكلمة المرور';
                    return;
                }

                if (username === 'admin' && password === '123456') {
                    const user = { name: 'مدير النظام', email: 'admin', role: 'مسؤول' };
                    localStorage.setItem('authToken', 'demo-token');
                    localStorage.setItem('userData', JSON.stringify(user));
                    showApplication();
                    window.showPage('dashboard');
                    return;
                }

                if (errorEl) {
                    errorEl.textContent = '❌ اسم المستخدم أو كلمة المرور غير صحيحة (admin / 123456)';
                }
            };

            window.handleLogin = window.doLogin;

            window.doLogout = function() {
                localStorage.removeItem('authToken');
                localStorage.removeItem('userData');
                showLogin();
            };

            window.toggleSidebar = function() {
                const sidebar = getElement('sidebar');
                if (sidebar) sidebar.classList.toggle('open');
            };

            window.toggleNotifications = function() {
                const modal = getElement('notificationModal');
                if (modal) {
                    modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
                }
            };

            window.closeNotificationModal = function() {
                const modal = getElement('notificationModal');
                if (modal) modal.style.display = 'none';
            };

            window.closePasswordModal = function() {
                const modal = getElement('passwordModal');
                if (modal) modal.style.display = 'none';
            };

            window.openPasswordModal = function(userId, userName) {
                const modal = getElement('passwordModal');
                const nameEl = getElement('modalUserName');
                if (modal) {
                    modal.dataset.userId = userId || '';
                    if (nameEl) nameEl.textContent = userName || 'المستخدم';
                    modal.style.display = 'flex';
                }
            };

            window.saveNewPassword = function() {
                alert('وظيفة تغيير كلمة المرور قيد التطوير');
                window.closePasswordModal();
            };

            window.refreshAllPages = function() {
                window.showPage(window.currentPage || 'dashboard');
            };

            window.scrollToTop = function() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            window.scrollToBottom = function() {
                window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
            };

            // عرض الصفحات (مع محتوى مضمن)
            window.showPage = function(page) {
                const container = getElement('pageContainer');
                if (!container) return;

                window.currentPage = page || 'dashboard';

                // تحديث الأزرار النشطة
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                const activeBtn = Array.from(document.querySelectorAll('.nav-btn')).find(btn => {
                    const onclick = btn.getAttribute('onclick') || '';
                    return onclick.includes(`'${page}'`) || onclick.includes(`"${page}"`);
                });
                if (activeBtn) activeBtn.classList.add('active');

                // محتوى الصفحات المضمنة
                const pages = {
                    dashboard: `
                        <div style="padding:20px;">
                            <h2 style="color:#60a5fa;">📊 لوحة التحكم</h2>
                            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin:20px 0;">
                                <div style="background:rgba(255,255,255,0.02);border-radius:14px;padding:16px;border:1px solid rgba(255,255,255,0.05);">
                                    <div style="font-size:28px;font-weight:800;color:#60a5fa;" id="dashTotal">0</div>
                                    <div style="font-size:12px;color:rgba(255,255,255,0.4);">🚢 إجمالي المراكب</div>
                                </div>
                                <div style="background:rgba(255,255,255,0.02);border-radius:14px;padding:16px;border:1px solid rgba(255,255,255,0.05);">
                                    <div style="font-size:28px;font-weight:800;color:#4ade80;" id="dashReady">0</div>
                                    <div style="font-size:12px;color:rgba(255,255,255,0.4);">✅ صالح</div>
                                </div>
                                <div style="background:rgba(255,255,255,0.02);border-radius:14px;padding:16px;border:1px solid rgba(255,255,255,0.05);">
                                    <div style="font-size:28px;font-weight:800;color:#fbbf24;" id="dashMaintenance">0</div>
                                    <div style="font-size:12px;color:rgba(255,255,255,0.4);">🔧 صيانة</div>
                                </div>
                                <div style="background:rgba(255,255,255,0.02);border-radius:14px;padding:16px;border:1px solid rgba(255,255,255,0.05);">
                                    <div style="font-size:28px;font-weight:800;color:#f87171;" id="dashBroken">0</div>
                                    <div style="font-size:12px;color:rgba(255,255,255,0.4);">❌ معطب</div>
                                </div>
                                <div style="background:rgba(255,255,255,0.02);border-radius:14px;padding:16px;border:1px solid rgba(255,255,255,0.05);">
                                    <div style="font-size:28px;font-weight:800;color:#34d399;" id="dashReadyPercent">0%</div>
                                    <div style="font-size:12px;color:rgba(255,255,255,0.4);">📊 نسبة الجاهزية</div>
                                </div>
                                <div style="background:rgba(255,255,255,0.02);border-radius:14px;padding:16px;border:1px solid rgba(255,255,255,0.05);">
                                    <div style="font-size:28px;font-weight:800;color:#f5d76e;" id="dashTotalCost">0 د.ت</div>
                                    <div style="font-size:12px;color:rgba(255,255,255,0.4);">💰 تكاليف الصيانة</div>
                                </div>
                            </div>
                            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;">
                                <div style="background:rgba(255,255,255,0.02);border-radius:14px;padding:18px;border:1px solid rgba(255,255,255,0.05);">
                                    <h4 style="color:rgba(255,255,255,0.6);">📊 توزيع الحالات</h4>
                                    <canvas id="dashChart" style="width:100%;height:200px;"></canvas>
                                </div>
                                <div style="background:rgba(255,255,255,0.02);border-radius:14px;padding:18px;border:1px solid rgba(255,255,255,0.05);">
                                    <h4 style="color:rgba(255,255,255,0.6);">📈 تطور الجاهزية</h4>
                                    <canvas id="dashLineChart" style="width:100%;height:200px;"></canvas>
                                </div>
                            </div>
                        </div>
                    `,
                    fleet: `<div style="padding:20px;"><h2 style="color:#60a5fa;">🚢 الأسطول</h2><p>جاري تحميل البيانات...</p></div>`,
                    maintenance: `<div style="padding:20px;"><h2 style="color:#60a5fa;">🔧 الصيانة</h2><p>جاري تحميل البيانات...</p></div>`,
                    efficiency: `<div style="padding:20px;"><h2 style="color:#60a5fa;">📊 الجاهزية</h2><p>جاري تحميل البيانات...</p></div>`,
                    support: `<div style="padding:20px;"><h2 style="color:#60a5fa;">🎫 الدعم</h2><p>جاري تحميل البيانات...</p></div>`,
                    users: `<div style="padding:20px;"><h2 style="color:#60a5fa;">👥 المستخدمين</h2><p>جاري تحميل البيانات...</p></div>`,
                    notes: `<div style="padding:20px;"><h2 style="color:#60a5fa;">📝 Note Verbale</h2><p>جاري تحميل البيانات...</p></div>`,
                    sessions: `<div style="padding:20px;"><h2 style="color:#60a5fa;">👥 المراقبة</h2><p>جاري تحميل البيانات...</p></div>`,
                    'ai-assistant': `<div style="padding:20px;"><h2 style="color:#60a5fa;">🤖 المساعد الذكي</h2><p>جاري تحميل البيانات...</p></div>`
                };

                container.innerHTML = pages[page] || `<div style="padding:20px;text-align:center;"><h2 style="color:#f87171;">⚠️ الصفحة غير موجودة</h2></div>`;

                // تهيئة Dashboard إذا كانت الصفحة هي Dashboard
                if (page === 'dashboard') {
                    setTimeout(function() {
                        const vessels = DEMO_DATA.vessels;
                        const maintenance = DEMO_DATA.maintenance;

                        const total = vessels.length;
                        const ready = vessels.filter(v => v.stat === 'صالح').length;
                        const broken = vessels.filter(v => v.stat === 'معطب').length;
                        const maintenanceCount = vessels.filter(v => v.stat === 'صيانة').length;
                        const readyPercent = total ? Math.round((ready / total) * 100) : 0;
                        const totalCost = maintenance.reduce((s, r) => s + (r.cost || 0), 0);

                        const ids = {
                            dashTotal: total,
                            dashReady: ready,
                            dashBroken: broken,
                            dashMaintenance: maintenanceCount,
                            dashReadyPercent: readyPercent + '%',
                            dashTotalCost: totalCost.toLocaleString() + ' د.ت'
                        };
                        Object.entries(ids).forEach(([id, val]) => {
                            const el = document.getElementById(id);
                            if (el) el.textContent = val;
                        });

                        // رسوم بيانية
                        if (typeof Chart !== 'undefined') {
                            try {
                                const ctx = document.getElementById('dashChart');
                                if (ctx) {
                                    if (window.dashChart) window.dashChart.destroy();
                                    window.dashChart = new Chart(ctx, {
                                        type: 'doughnut',
                                        data: {
                                            labels: ['✅ صالح', '❌ معطب', '🔧 صيانة'],
                                            datasets: [{
                                                data: [ready, broken, maintenanceCount],
                                                backgroundColor: ['rgba(74,222,128,0.8)', 'rgba(248,113,113,0.8)', 'rgba(251,191,36,0.8)'],
                                                borderColor: ['#4ade80', '#f87171', '#fbbf24'],
                                                borderWidth: 2
                                            }]
                                        },
                                        options: { responsive: true, maintainAspectRatio: false, cutout: '60%' }
                                    });
                                }
                                const lineCtx = document.getElementById('dashLineChart');
                                if (lineCtx) {
                                    if (window.dashLineChart) window.dashLineChart.destroy();
                                    window.dashLineChart = new Chart(lineCtx, {
                                        type: 'line',
                                        data: {
                                            labels: ['جانفي', 'فيفري', 'مارس', 'أفريل', 'ماي', 'جوان'],
                                            datasets: [{
                                                label: '📈 نسبة الجاهزية %',
                                                data: [72, 75, 78, 82, 85, 88],
                                                borderColor: '#34d399',
                                                backgroundColor: 'rgba(52,211,153,0.15)',
                                                fill: true,
                                                tension: 0.4
                                            }]
                                        },
                                        options: { responsive: true, maintainAspectRatio: false }
                                    });
                                }
                            } catch (e) {
                                console.warn('Chart error:', e);
                            }
                        }
                    }, 100);
                }
            };

            // التحقق من الجلسة
            const token = localStorage.getItem('authToken');
            const user = getStoredUser();
            if (token && user) {
                showApplication();
                window.showPage('dashboard');
            } else {
                showLogin();
            }

            console.log('✅ Fallback system ready');
        }

    })();
</script>

</body>
</html>
