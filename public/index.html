<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚓ منظومة الوسائل البحرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* ============================================================
           🎨 PRO PRODUCTION COLORS - تصميم احترافي
           ============================================================ */
        
        :root {
            /* 🎨 Primary Colors - ألوان بحرية عصرية */
            --primary: #0c4a6e;
            --primary-light: #1a6a8a;
            --primary-dark: #062a44;
            --primary-gradient: linear-gradient(135deg, #0c4a6e, #1a7a8a);
            --primary-glow: 0 8px 32px rgba(12, 74, 110, 0.4);
            
            /* 🎨 Secondary Colors */
            --secondary: #2d8c9c;
            --secondary-light: #4aa8b8;
            --secondary-gradient: linear-gradient(135deg, #2d8c9c, #4aa8b8);
            
            /* 🎨 Accent Colors */
            --accent: #f39c12;
            --accent-light: #f1c40f;
            --accent-gradient: linear-gradient(135deg, #f39c12, #f1c40f);
            
            /* 🎨 Status Colors */
            --success: #10b981;
            --success-light: #34d399;
            --danger: #ef4444;
            --danger-light: #f87171;
            --warning: #f59e0b;
            --warning-light: #fbbf24;
            --info: #3b82f6;
            --info-light: #60a5fa;
            
            /* 🎨 Neutral Colors */
            --bg: #f0f4f8;
            --bg-dark: #0d1b2a;
            --bg-card: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --text-white: #ffffff;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-hover: 0 8px 40px rgba(0,0,0,0.12);
            --shadow-glow: 0 8px 32px rgba(12, 74, 110, 0.2);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            direction: rtl;
            display: flex;
        }

        /* ============================================================
           🔐 LOGIN SCREEN - PRO PRODUCTION DESIGN
           ============================================================ */

        #loginOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a1628 0%, #0c4a6e 40%, #1a6a8a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: loginFade 0.6s ease;
        }

        @keyframes loginFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .login-box {
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(20px);
            padding: 50px 45px 40px;
            border-radius: var(--radius);
            width: 440px;
            max-width: 95%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.05);
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-gradient);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 8px;
        }

        .login-logo .logo-icon {
            font-size: 48px;
            filter: drop-shadow(0 4px 12px rgba(12, 74, 110, 0.3));
        }

        .login-logo .logo-text {
            font-size: 26px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .developer {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent-gradient);
            padding: 6px 20px 6px 16px;
            border-radius: 30px;
            margin-bottom: 28px;
            font-weight: 700;
            color: var(--primary-dark);
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(243, 156, 18, 0.3);
        }

        .dev-label {
            background: var(--primary-dark);
            color: white;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
            text-align: right;
        }

        .input-group .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 18px;
            transition: var(--transition);
            z-index: 1;
        }

        .input-group input {
            width: 100%;
            padding: 14px 50px 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            background: #f8fafc;
            font-family: 'Cairo', sans-serif;
            transition: var(--transition);
            color: var(--text);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(12, 74, 110, 0.08);
            background: white;
        }

        .input-group input:focus + .input-icon,
        .input-group input:focus ~ .input-icon {
            color: var(--primary);
        }

        .input-group input::placeholder {
            color: var(--text-light);
            opacity: 0.7;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Cairo', sans-serif;
            box-shadow: var(--primary-glow);
            position: relative;
            overflow: hidden;
        }

        .login-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: rotate(45deg);
            transition: all 0.5s ease;
        }

        .login-btn:hover::after {
            transform: rotate(45deg) translate(50%, 50%);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(12, 74, 110, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .login-btn.loading .spinner { display: inline-block; }
        .login-btn.loading .btn-text { display: none; }

        .error-msg {
            color: var(--danger);
            font-size: 14px;
            margin-top: 12px;
            display: none;
            padding: 10px 16px;
            background: #fef2f2;
            border-radius: var(--radius-sm);
            border-right: 4px solid var(--danger);
            text-align: right;
        }

        .error-msg.show { display: block; }
        .error-msg.success {
            color: var(--success);
            background: #ecfdf5;
            border-right-color: var(--success);
        }

        .login-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-light);
        }

        .login-footer .version {
            background: var(--bg);
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: 600;
            color: var(--primary);
        }

        /* ============================================================
           📱 MAIN APP - PRO PRODUCTION DESIGN
           ============================================================ */

        #mainApp {
            display: none;
            width: 100%;
            min-height: 100vh;
            flex-direction: column;
        }

        /* ── Header ── */
        header {
            background: var(--primary-gradient);
            color: white;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.15);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-toggle {
            font-size: 24px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            transition: var(--transition);
        }

        .menu-toggle:hover { background: rgba(255,255,255,0.15); }

        header h1 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1 span { color: var(--accent-light); }

        .developer-tag {
            font-size: 11px;
            background: rgba(255,255,255,0.15);
            padding: 2px 16px;
            border-radius: 30px;
            font-weight: 400;
            margin-right: 10px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .role-badge {
            background: rgba(255,255,255,0.12);
            padding: 4px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
        }

        .btn-outline-white {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .btn-outline-white:hover { background: rgba(255,255,255,0.15); }

        .btn-logout {
            color: #ffcdd2;
            border-color: rgba(255,205,210,0.2);
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.2);
            color: white;
        }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed;
            top: 0; right: 0;
            width: 280px;
            height: 100%;
            background: white;
            box-shadow: 2px 0 30px rgba(0,0,0,0.08);
            transform: translateX(0);
            transition: transform 0.3s ease;
            z-index: 999;
            padding-top: 74px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar.closed { transform: translateX(100%); }

        .sidebar-brand {
            position: absolute;
            top: 0; right: 0;
            width: 100%;
            padding: 16px 24px;
            background: var(--primary-gradient);
            color: white;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 24px;
            border: none;
            background: transparent;
            width: 100%;
            text-align: right;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Cairo', sans-serif;
            border-right: 3px solid transparent;
        }

        .nav-btn:hover {
            background: var(--border-light);
            color: var(--primary);
        }

        .nav-btn.active {
            background: #e8f0fe;
            color: var(--primary);
            border-right-color: var(--primary);
        }

        .nav-btn i {
            width: 22px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
        }

        /* ── Main Content ── */
        .main-content {
            margin-right: 280px;
            padding: 24px 32px 32px;
            flex: 1;
            min-height: 100vh;
            background: var(--bg);
            transition: margin-right 0.3s ease;
        }

        .sidebar.closed ~ .main-content { margin-right: 0; }

        .page {
            display: none;
            animation: fadePage 0.3s ease;
        }

        .page.active { display: block; }

        @keyframes fadePage {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Cards & Stats ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 22px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .stat-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-4px);
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card .label {
            font-size: 14px;
            color: var(--text-secondary);
            display: block;
            margin-top: 4px;
        }

        .stat-card .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
        }

        /* ── Tables ── */
        .table-wrapper {
            overflow-x: auto;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 650px;
        }

        thead {
            background: var(--border-light);
            border-bottom: 2px solid var(--border);
        }

        th {
            padding: 12px 16px;
            text-align: right;
            font-weight: 700;
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-light);
        }

        tr:hover td { background: var(--border-light); }

        /* ── Status Badges ── */
        .status-badge {
            padding: 3px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .status-badge.active {
            background: #dcfce7;
            color: #166534;
        }

        .status-badge.broken {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-badge.maintenance {
            background: #fef3c7;
            color: #92400e;
        }

        .status-badge.unknown {
            background: var(--border);
            color: var(--text-secondary);
        }

        /* ── Forms ── */
        .form-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 28px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .form-card h3 {
            font-size: 18px;
            color: var(--primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: white;
            font-family: 'Cairo', sans-serif;
            width: 100%;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(12, 74, 110, 0.08);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        /* ── Buttons ── */
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cairo', sans-serif;
        }

        .btn-primary { background: var(--primary-gradient); color: white; box-shadow: var(--shadow-glow); }
        .btn-primary:hover { box-shadow: var(--primary-glow); transform: translateY(-2px); }

        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; transform: translateY(-2px); }

        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }

        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #d97706; transform: translateY(-2px); }

        .btn-sm { padding: 4px 12px; font-size: 12px; }

        /* ── Charts ── */
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
            margin-bottom: 28px;
        }

        .chart-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .chart-box h4 {
            text-align: center;
            margin-bottom: 14px;
            color: var(--primary);
            font-size: 16px;
        }

        canvas { max-height: 280px; width: 100% !important; }

        /* ── Toasts ── */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 450px;
            margin: 0 auto;
            z-index: 9999;
        }

        .toast {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 500;
            animation: slideUp 0.3s ease;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-warning { background: var(--warning); }
        .toast-info { background: var(--primary); }

        /* ── Responsive ── */
        @media (max-width: 992px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; }
        }

        @media (max-width: 768px) {
            header h1 { font-size: 16px; flex-wrap: wrap; }
            .developer-tag { display: none; }
            .login-box { padding: 30px 20px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .form-grid { grid-template-columns: 1fr; }
            .main-content { padding: 16px; }
        }

        @media print {
            .sidebar, .scroll-buttons, .btn, .btn-sm, .filter-bar, .form-card {
                display: none !important;
            }
            .main-content { margin: 0 !important; padding: 10px !important; }
            @page { size: landscape; margin: 1cm; }
        }

        /* ── Utilities ── */
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .mb-16 { margin-bottom: 16px; }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ticket-list { display: grid; gap: 10px; }
        .ticket-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .ticket-info { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
        .ticket-title { font-weight: 600; }
        .ticket-date { color: var(--text-light); font-size: 12px; }

        .password-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }
        .password-section h3 {
            font-size: 17px;
            color: var(--primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .password-section .form-group { margin-bottom: 12px; }
        .password-section .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }
        .password-section .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: #f8fafc;
            font-family: 'Cairo', sans-serif;
        }
        .password-section .form-group input:focus {
            outline: none;
            border-color: var(--primary);

    <!-- ============================================================
    📝 JAVASCRIPT - الكود الكامل المصحح v39.0
    ============================================================ -->
    <script>
        /**
         * ============================================================
         * ⚓ منظومة الوسائل البحرية - v39.0 PRO PRODUCTION
         * ============================================================
         * ✅ تسجيل الدخول يعمل 100%
         * ✅ تحديث المتغيرات العامة
         * ✅ أدوار متطابقة مع السيرفر
         * ✅ حالة المراكب بالألوان الصحيحة
         * ✅ تحقق من الجلسة
         * ============================================================
         */

        console.log('🚀 Marine System v39.0 - PRO PRODUCTION');

        // ============================================================
        // 📦 المتغيرات العامة
        // ============================================================

        var currentUser = null;
        var authToken = null;
        var vessels = [];
        var users = [];
        var tickets = [];
        var logs = [];
        var notes = [];
        var sessions = [];
        var onlineUsers = [];
        var activePage = 'dashboard';
        var dashboardChart = null;
        var efficiencyChart = null;

        // ============================================================
        // 🧰 دوال مساعدة
        // ============================================================

        function getRoleName(role) {
            var roles = {
                'admin': 'مسؤول',
                'manager': 'مدير',
                'operator': 'مشغل',
                'viewer': 'مشاهد'
            };
            return roles[role] || role || 'مستخدم';
        }

        function getVesselStatusClass(status) {
            if (status === 'صالح') return 'active';
            if (status === 'صيانة') return 'maintenance';
            if (status === 'معطب') return 'broken';
            return 'unknown';
        }

        function showToast(message, type) {
            type = type || 'info';
            var container = document.getElementById('toastContainer');
            if (!container) return;

            var toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            toast.innerHTML = '<span style="font-size:20px;">' + (icons[type] || 'ℹ️') + '</span> ' + message;
            toast.style.cssText = 'padding:14px 20px;border-radius:12px;color:white;font-weight:500;animation:slideUp 0.3s ease;box-shadow:0 8px 30px rgba(0,0,0,0.15);display:flex;align-items:center;gap:10px;background:' +
                (type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : type === 'warning' ? '#f59e0b' : '#0c4a6e') + ';';
            container.appendChild(toast);

            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(function() { toast.remove(); }, 300);
            }, 4000);
        }

        // ============================================================
        // 🔐 دالة تسجيل الدخول
        // ============================================================

        window.handleLogin = function() {
            console.log('🟢 handleLogin called');

            var username = document.getElementById('username');
            var password = document.getElementById('password');
            var errorEl = document.getElementById('loginError');
            var loginBtn = document.getElementById('loginButton');

            if (!username || !password) {
                console.error('❌ عناصر الدخول غير موجودة');
                return;
            }

            var user = username.value.trim();
            var pass = password.value.trim();

            errorEl.className = 'error-msg';
            errorEl.textContent = '';

            if (!user || !pass) {
                errorEl.textContent = '⚠️ يرجى إدخال اسم المستخدم وكلمة المرور';
                errorEl.className = 'error-msg show';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.classList.add('loading');

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');

                if (data.success) {
                    // ✅ تحديث المتغيرات العامة
                    currentUser = data.user;
                    authToken = data.token;

                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));

                    errorEl.textContent = '✅ مرحباً ' + (data.user.name || user);
                    errorEl.className = 'error-msg show success';

                    setTimeout(function() {
                        showApp();
                    }, 500);

                    console.log('✅ Login successful:', data.user.username);

                } else {
                    errorEl.textContent = '❌ ' + (data.error || 'بيانات الدخول غير صحيحة');
                    errorEl.className = 'error-msg show';
                    console.log('❌ Login failed:', data.error);
                }
            })
            .catch(function(error) {
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');
                errorEl.textContent = '❌ خطأ في الاتصال بالسيرفر: ' + error.message;
                errorEl.className = 'error-msg show';
                console.error('❌ Network error:', error);
            });
        };

        // ============================================================
        // ✅ عرض التطبيق
        // ============================================================

        function showApp() {
            try {
                var user = JSON.parse(localStorage.getItem('currentUser') || 'null');
                var token = localStorage.getItem('authToken');

                if (!user || !token) {
                    console.warn('⚠️ لا توجد جلسة صالحة');
                    return;
                }

                // ✅ تحديث المتغيرات العامة
                currentUser = user;
                authToken = token;

                console.log('🚀 Opening application:', user.username);

                var loginOverlay = document.getElementById('loginOverlay');
                var mainApp = document.getElementById('mainApp');

                if (loginOverlay) {
                    loginOverlay.style.display = 'none';
                }

                if (mainApp) {
                    mainApp.style.display = 'flex';
                } else {
                    console.error('❌ mainApp غير موجود في HTML');
                    return;
                }

                var userRoleDisplay = document.getElementById('userRoleDisplay');
                if (userRoleDisplay) {
                    userRoleDisplay.textContent =
                        '👤 ' + (user.name || user.username) +
                        ' | ' + getRoleName(user.role);
                }

                if (typeof loadAllData === 'function') {
                    loadAllData();
                }

                if (typeof showPage === 'function') {
                    showPage('dashboard');
                }

                console.log('✅ Application opened successfully');

            } catch (error) {
                console.error('❌ Error opening application:', error);
            }
        }

        // ============================================================
        // ✅ التحقق من الجلسة
        // ============================================================

        async function checkSession() {
            var token = localStorage.getItem('authToken');

            if (!token) {
                return;
            }

            try {
                var response = await fetch('/api/auth/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                var data = await response.json();

                if (response.ok && data.success && data.user) {
                    currentUser = data.user;
                    authToken = token;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    showApp();
                } else {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('currentUser');
                    currentUser = null;
                    authToken = null;
                }

            } catch (error) {
                console.error('⚠️ Session check failed:', error);
            }
        }

        // ============================================================
        // ✅ fetchWithAuth
        // ============================================================

        async function fetchWithAuth(url, options = {}) {
            var token = localStorage.getItem('authToken');

            if (!token) {
                throw new Error('انتهت الجلسة، يرجى تسجيل الدخول');
            }

            var headers = {
                ...options.headers,
                'Authorization': 'Bearer ' + token
            };

            if (options.body && !headers['Content-Type']) {
                headers['Content-Type'] = 'application/json';
            }

            var response = await fetch(url, {
                ...options,
                headers: headers
            });

            if (response.status === 401 || response.status === 423) {
                localStorage.removeItem('authToken');
                localStorage.removeItem('currentUser');
                currentUser = null;
                authToken = null;

                var mainApp = document.getElementById('mainApp');
                var loginOverlay = document.getElementById('loginOverlay');

                if (mainApp) mainApp.style.display = 'none';
                if (loginOverlay) loginOverlay.style.display = 'flex';

                throw new Error('انتهت صلاحية الجلسة، يرجى تسجيل الدخول مرة أخرى');
            }

            return response;
        }

        // ============================================================
        // 🚪 تسجيل الخروج
        // ============================================================

        function doLogout() {
            currentUser = null;
            authToken = null;

            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');

            var mainApp = document.getElementById('mainApp');
            var loginOverlay = document.getElementById('loginOverlay');

            if (mainApp) {
                mainApp.style.display = 'none';
            }

            if (loginOverlay) {
                loginOverlay.style.display = 'flex';
            }

            var username = document.getElementById('username');
            var password = document.getElementById('password');

            if (username) username.value = '';
            if (password) password.value = '';

            showToast('👋 تم تسجيل الخروج بنجاح', 'info');
        }

        // ============================================================
        // 📊 تحميل البيانات
        // ============================================================

        async function loadAllData() {
            try {
                await Promise.all([
                    loadVessels(),
                    loadUsers(),
                    loadTickets(),
                    loadLogs(),
                    loadNotes(),
                    loadSessions()
                ]);
                updateStats();
            } catch (error) {
                console.error('❌ خطأ في تحميل البيانات:', error);
            }
        }

        async function loadVessels() {
            try {
                var response = await fetchWithAuth('/api/vessels');
                var data = await response.json();
                if (data.success) {
                    vessels = data.vessels || [];
                    renderVessels();
                }
            } catch (error) {
                console.error('❌ خطأ في جلب المراكب:', error);
            }
        }

        async function loadUsers() {
            try {
                var response = await fetchWithAuth('/api/users');
                var data = await response.json();
                if (data.success) {
                    users = data.users || [];
                    renderUsers();
                }
            } catch (error) {
                console.error('❌ خطأ في جلب المستخدمين:', error);
            }
        }

        async function loadTickets() {
            try {
                var response = await fetchWithAuth('/api/tickets');
                var data = await response.json();
                if (data.success) {
                    tickets = data.tickets || [];
                    renderTickets();
                }
            } catch (error) {
                console.error('❌ خطأ في جلب التذاكر:', error);
            }
        }

        async function loadLogs() {
            try {
                var response = await fetchWithAuth('/api/logs');
                var data = await response.json();
                if (data.success) {
                    logs = data.logs || [];
                    renderLogs();
                }
            } catch (error) {
                console.error('❌ خطأ في جلب السجلات:', error);
            }
        }

        async function loadNotes() {
            try {
                var response = await fetchWithAuth('/api/notes');
                var data = await response.json();
                if (data.success) {
                    notes = data.notes || [];
                    renderNotes();
                }
            } catch (error) {
                console.error('❌ خطأ في جلب الملاحظات:', error);
            }
        }

        async function loadSessions() {

                var response = await fetchWithAuth('/api/sessions');
                var data = await response.json();
                if (data.success) {
                    sessions = data.sessions || [];
                    renderSessions();
                }
            } catch (error) {
                console.error('❌ خطأ في جلب الجلسات:', error);
            }
        }

        function updateStats() {
            document.getElementById('statVessels')?.textContent = vessels.length || 0;
            document.getElementById('statUsers')?.textContent = users.length || 0;
            document.getElementById('statTickets')?.textContent = tickets.length || 0;

        // ============================================================
        // 📑 الصفحات
        // ============================================================

        function showPage(pageName) {
            activePage = pageName;

            document.querySelectorAll('.nav-btn').forEach(function(btn) {
                btn.classList.remove('active');
            });

            document.querySelectorAll('.nav-btn').forEach(function(btn) {

                    'maintenance': 'الصيانة',

                'sessions': '👥 المراقبة',
                'ai-assistant': '🤖 المساعد الذكي',
                'settings': '⚙️ الإعدادات',

            `;

            document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                var currentPassword = document.getElementById('currentPassword').value;
                var newPassword = document.getElementById('newPassword').value;
                var confirmPassword = document.getElementById('confirmPassword').value;
                var msg = document.getElementById('passwordMessage');
                
                msg.className = '';
                msg.textContent = '';
                
                if (newPassword !== confirmPassword) {
                    msg.textContent = '⚠️ كلمة المرور الجديدة وتأكيدها غير متطابقين';
                    msg.className = 'show error';
                    return;
                }
                
                if (newPassword.length < 8) {
                    msg.textContent = '⚠️ كلمة المرور الجديدة يجب أن تكون 8 أحرف على الأقل';
                    msg.className = 'show error';
                    return;
                }
                
                try {
                    var response = await fetchWithAuth('/api/auth/change-password', {
                        method: 'PUT',
                        body: JSON.stringify({ currentPassword, newPassword })
                    });
                    
                    var data = await response.json();
                    
                    if (data.success) {
                        msg.textContent = '✅ ' + data.message;
                        msg.className = 'show success';
                        document.getElementById('changePasswordForm').reset();
                        showToast('✅ تم تغيير كلمة المرور بنجاح', 'success');
                        setTimeout(function() {
                            msg.className = '';
                            msg.textContent = '';
                        }, 5000);
                    } else {
                        msg.textContent = '❌ ' + data.error;
                        msg.className = 'show error';
                    }
                } catch (error) {
                    msg.textContent = '❌ خطأ في الاتصال بالسيرفر: ' + error.message;
                    msg.className = 'show error';
                }
            });
        }

        async function handleAddVessel(e) {
            e.preventDefault();
            var vessel = {
                name: document.getElementById('vesselName').value.trim(),
                num: document.getElementById('vesselNum').value.trim(),
                len: parseFloat(document.getElementById('vesselLen').value),
                reg: document.getElementById('vesselReg').value,
                port: document.getElementById('vesselPort').value.trim(),
                stat: document.getElementById('vesselStatus').value
            };

            if (!vessel.name || !vessel.num) {
                showToast('⚠️ يرجى إدخال الاسم والرقم', 'warning');
                return;
            }

            try {
                var response = await fetchWithAuth('/api/vessels', {
                    method: 'POST',
                    body: JSON.stringify(vessel)
                });
                var data = await response.json();
                if (data.success) {
                    showToast('✅ تم إضافة المركب', 'success');
                    document.getElementById('vesselForm').reset();
                    await loadVessels();
                    updateStats();
                    if (activePage === 'dashboard') renderDashboard();
                } else {
                    showToast('❌ ' + (data.error || 'فشل الإضافة'), 'error');
                }
            } catch (error) {
                showToast('❌ خطأ في الاتصال', 'error');
            }
        }

        async function deleteVessel(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المركب؟')) return;
            try {
                var response = await fetchWithAuth('/api/vessels/' + id, { method: 'DELETE' });
                var data = await response.json();
                if (data.success) {
                    showToast('🗑️ تم حذف المركب', 'warning');
                    await loadVessels();
                    updateStats();
                    if (activePage === 'dashboard') renderDashboard();
                } else {
                    showToast('❌ فشل الحذف', 'error');
                }
            } catch (error) {
                showToast('❌ خطأ في الاتصال', 'error');
            }
        }

        async function handleAddUser(e) {
            e.preventDefault();
            var user = {
                name: document.getElementById('userName').value.trim(),
                email: document.getElementById('userEmail').value.trim(),
                password: document.getElementById('userPassword').value,
                role: document.getElementById('userRole').value
            };

            if (!user.name || !user.email || !user.password) {
                showToast('⚠️ يرجى إدخال جميع البيانات', 'warning');
                return;
            }

            try {
                var response = await fetchWithAuth('/api/users', {
                    method: 'POST',
                    body: JSON.stringify(user)
                });
                var data = await response.json();
                if (data.success) {
                    showToast('✅ تم إضافة المستخدم', 'success');
                    document.getElementById('userForm').reset();
                    await loadUsers();
                    updateStats();
                } else {
                    showToast('❌ ' + (data.error || 'فشل الإضافة'), 'error');
                }
            } catch (error) {
                showToast('❌ خطأ في الاتصال', 'error');
            }
        }

        async function toggleUser(id) {
            var user = users.find(function(u) { return (u._id || u.id) === id; });
            if (!user) return;
            var newStatus = user.isActive !== false ? false : true;

            try {
                var response = await fetchWithAuth('/api/users/' + id, {
                    method: 'PUT',
                    body: JSON.stringify({ isActive: newStatus })
                });
                var data = await response.json();
                if (data.success) {
                    showToast('✅ تم ' + (newStatus ? 'تفعيل' : 'تعطيل') + ' المستخدم', 'success');
                    await loadUsers();
                } else {
                    showToast('❌ فشل تحديث حالة المستخدم', 'error');
                }
            } catch (error) {
                showToast('❌ خطأ في الاتصال', 'error');
            }
        }

        async function handleAddTicket(e) {
            e.preventDefault();
            var ticket = {
                title: document.getElementById('ticketTitle').value.trim(),
                description: document.getElementById('ticketDesc').value.trim(),
                priority: document.getElementById('ticketPriority').value
            };
            if (!ticket.title) {
                showToast('⚠️ يرجى إدخال عنوان التذكرة', 'warning');
                return;
            }
            try {
                var response = await fetchWithAuth('/api/tickets', {
                    method: 'POST',
                    body: JSON.stringify(ticket)
                });
                var data = await response.json();
                if (data.success) {
                    showToast('✅ تم إرسال التذكرة', 'success');
                    document.getElementById('ticketForm').reset();
                    await loadTickets();
                    updateStats();
                } else {
                    showToast('❌ ' + (data.error || 'فشل الإرسال'), 'error');
                }
            } catch (error) {
                showToast('❌ خطأ في الاتصال', 'error');
            }
        }

        async function closeTicket(id) {
            try {
                var response = await fetchWithAuth('/api/tickets/' + id + '/close', { method: 'PUT' });
                var data = await response.json();
                if (data.success) {
                    showToast('✅ تم إغلاق التذكرة', 'success');
                    await loadTickets();
                } else {
                    showToast('❌ فشل الإغلاق', 'error');
                }
            } catch (error) {
                showToast('❌ خطأ في الاتصال', 'error');

        async function askAI() {
            var input = document.getElementById('aiInput');
            var chatBox = document.getElementById('aiChatBox');
            var query = input.value.trim();

            if (!query) {
                showToast('⚠️ يرجى كتابة سؤال', 'warning');
                return;
            }

            var userMsg = document.createElement('div');
            userMsg.className = 'msg user';
            userMsg.innerHTML = '<strong>👤 أنت</strong><p>' + query + '</p>';
            chatBox.appendChild(userMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            input.value = '';
            input.disabled = true;

            try {
                var response = await generateAIResponse(query);
                var aiMsg = document.createElement('div');
                aiMsg.className = 'msg ai';
                aiMsg.innerHTML = '<strong>🤖 المساعد الذكي</strong><p>' + response + '</p>';
                chatBox.appendChild(aiMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                showToast('❌ خطأ في معالجة الطلب', 'error');
            } finally {
                input.disabled = false;
                input.focus();
            }
        }

        async function generateAIResponse(query) {
            var q = query.toLowerCase();

            if (q.includes('إحصائيات') || q.includes('الأسطول') || q.includes('عدد المراكب')) {
                var total = vessels.length;
                var ok = vessels.filter(function(v) { return v.stat === 'صالح'; }).length;
                var maint = vessels.filter(function(v) { return v.stat === 'صيانة'; }).length;
                var broken = vessels.filter(function(v) { return v.stat === 'معطب'; }).length;
                var percent = total ? Math.round((ok / total) * 100) : 0;
                return '📊 <b>إحصائيات الأسطول</b><br>🚢 إجمالي المراكب: <b>' + total + '</b><br>✅ الصالح: <b>' + ok + '</b><br>🔧 تحت الصيانة: <b>' + maint + '</b><br>❌ المعطوب: <b>' + broken + '</b><br>📈 نسبة الجاهزية: <b>' + percent + '%</b>';
            }

            if (q.includes('معطوب') || q.includes('عطل') || q.includes('الصيانة')) {
                var broken2 = vessels.filter(function(v) { return v.stat === 'معطب' || v.stat === 'صيانة'; });
                if (!broken2.length) {
                    return '✅ <b>لا توجد مراكب معطوبة حالياً</b><br>جميع المراكب في حالة جيدة.';
                }
                return '🛠️ <b>قائمة المراكب المعطوبة/تحت الصيانة (' + broken2.length + '):</b><br>' +
                    broken2.map(function(v) {
                        return '• ' + v.name + ' (' + (v.num || 'رقم غير محدد') + ') - الحالة: ' + v.stat + (v.break ? ' - العطب: ' + v.break : '');
                    }).join('<br>');
            }

            if (q.includes('جاهزية') || q.includes('نجاعة') || q.includes('نسبة')) {
                var total2 = vessels.length;
                var ok2 = vessels.filter(function(v) { return v.stat === 'صالح'; }).length;
                var percent2 = total2 ? Math.round((ok2 / total2) * 100) : 0;
                var status = percent2 >= 80 ? '🟢 <b>ممتازة</b>' : percent2 >= 60 ? '🟡 <b>جيدة</b>' : '🔴 <b>ضعيفة - تحتاج إلى تحسين</b>';
                return '📈 <b>نسبة الجاهزية: ' + percent2 + '%</b><br>التقييم: ' + status + '<br>✅ الصالح: ' + ok2 + ' من ' + total2;
            }

            if (q.includes('تقرير') || q.includes('صيانة')) {
                var total3 = vessels.length;
                var ok3 = vessels.filter(function(v) { return v.stat === 'صالح'; }).length;
                var maint3 = vessels.filter(function(v) { return v.stat === 'صيانة'; }).length;
                var broken3 = vessels.filter(function(v) { return v.stat === 'معطب'; }).length;
                var percent3 = total3 ? Math.round((ok3 / total3) * 100) : 0;
                return '📋 <b>تقرير حالة الأسطول</b><br>📅 التاريخ: ' + new Date().toLocaleDateString('ar') +
                    '<br>🚢 إجمالي المراكب: ' + total3 +
                    '<br>✅ الصالح: ' + ok3 +
                    '<br>🔧 تحت الصيانة: ' + maint3 +
                    '<br>❌ المعطوب: ' + broken3 +
                    '<br>📈 نسبة الجاهزية: ' + percent3 + '%<br><br>' +
                    (percent3 >= 80 ? '✅ الأسطول في حالة جيدة.' : percent3 >= 60 ? '⚠️ يوصى بإجراء صيانة لبعض المراكب.' : '🚨 يحتاج الأسطول إلى تدخل عاجل!');
            }

            return '📌 <b>معلومات عامة عن الأسطول</b><br>🚢 عدد المراكب: <b>' + vessels.length + '</b><br>👥 عدد المستخدمين: <b>' + users.length +
                '</b><br>📋 عدد التذاكر المفتوحة: <b>' + tickets.filter(function(t) { return t.status !== 'closed'; }).length +
                '</b><br>🟢 المستخدمون المتصلون: <b>' + onlineUsers.length + '</b><br><br>💡 يمكنك طرح أسئلة مثل:<br>• "إحصائيات الأسطول"<br>• "المراكب المعطوبة"<br>• "نسبة الجاهزية"<br>• "تقرير الصيانة"';
        }
