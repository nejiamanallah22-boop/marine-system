<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚓ منظومة الوسائل البحرية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: #0a0e17;
            color: #e2e8f0;
            min-height: 100vh;
        }
        
        /* ===== LOGIN ===== */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            display: flex !important;
            justify-content: center;
            align-items: center;
            background: rgba(10,14,23,0.98);
            backdrop-filter: blur(10px);
        }
        
        .login-box {
            background: linear-gradient(145deg, #141b2d, #0f1625);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.8);
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(96,165,250,0.15);
        }
        
        .login-logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
        .logo-icon { font-size: 40px; color: #60a5fa; }
        .logo-text {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: rgba(255,255,255,0.4); font-size: 14px; margin-bottom: 20px; }
        
        .developer {
            background: rgba(96,165,250,0.08);
            border-radius: 12px;
            padding: 8px 16px;
            margin-bottom: 24px;
            display: inline-block;
            border: 1px solid rgba(96,165,250,0.1);
        }
        .dev-name { color: #60a5fa; font-weight: 700; font-size: 14px; }
        .dev-label { color: rgba(255,255,255,0.3); font-size: 11px; margin-left: 6px; }
        
        .input-group { position: relative; margin-bottom: 16px; }
        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.2);
        }
        .input-group input {
            width: 100%;
            padding: 14px 48px 14px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 4px rgba(96,165,250,0.08);
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.25); }
        
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(37,99,235,0.3); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .login-btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .login-btn.loading .spinner { display: inline-block; }
        .login-btn.loading .btn-text { display: none; }
        
        .error-msg {
            display: none;
            padding: 12px;
            border-radius: 10px;
            margin-top: 14px;
            font-size: 14px;
        }
        .error-msg.show { display: block; }
        .error-msg.error { color: #f87171; background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.15); }
        .error-msg.success { color: #4ade80; background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.15); }
        
        .login-footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            color: rgba(255,255,255,0.2);
            font-size: 11px;
        }
        .version { background: rgba(255,255,255,0.04); padding: 2px 10px; border-radius: 20px; }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* ===== MAIN APP ===== */
        #mainApp { display: none; min-height: 100vh; }
        
        header {
            background: #0f1625;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .menu-toggle {
            font-size: 24px;
            cursor: pointer;
            color: rgba(255,255,255,0.4);
            transition: all 0.3s ease;
        }
        .menu-toggle:hover { color: #60a5fa; }
        .header-left h1 { font-size: 18px; font-weight: 700; color: #fff; }
        .header-left h1 span { color: #60a5fa; }
        .developer-tag {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            font-weight: 400;
            margin-right: 8px;
        }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .role-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            background: rgba(96,165,250,0.12);
            color: #60a5fa;
            border: 1px solid rgba(96,165,250,0.15);
        }
        .btn-outline-white {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .btn-outline-white:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); color: #fff; }
        .btn-logout:hover { border-color: #ef4444; color: #ef4444; }
        
        .sidebar {
            position: fixed;
            top: 65px;
            right: 0;
            width: 240px;
            height: calc(100% - 65px);
            background: #0f1625;
            border-left: 1px solid rgba(255,255,255,0.06);
            padding: 16px 12px;
            overflow-y: auto;
            z-index: 50;
            transition: transform 0.3s ease;
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            margin-bottom: 16px;
            color: rgba(255,255,255,0.3);
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding-bottom: 12px;
        }
        .sidebar-brand span:first-child { font-size: 20px; }
        
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 14px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.04); color: #fff; }
        .nav-btn.active {
            background: rgba(96,165,250,0.12);
            color: #60a5fa;
            border-left: 3px solid #60a5fa;
        }
        .nav-btn i { width: 20px; text-align: center; }
        
        .sidebar-footer {
            padding: 12px;
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.15);
            font-size: 11px;
            text-align: center;
        }
        
        .main-content {
            margin-right: 240px;
            padding: 20px;
            min-height: calc(100vh - 65px);
        }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; padding: 12px; }
            .login-box { padding: 30px 20px; margin: 16px; }
            .header-left h1 { font-size: 14px; }
            .developer-tag { display: none; }
        }
    </style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginOverlay">
    <div class="login-box">
        <div class="login-logo">
            <span class="logo-icon">⚓</span>
            <span class="logo-text">منظومة الوسائل البحرية</span>
        </div>

        <div class="developer">

            <i class="fas fa-user input-icon"></i>

            <i class="fas fa-lock input-icon"></i>

</div>

<!-- ===== MAIN APP ===== -->
<div id="mainApp" style="display:none;">
    <header>
        <div class="header-left">
            <span class="menu-toggle" onclick="toggleSidebar()">☰</span>
            <h1>
                <span>⚓</span>
                منظومة الوسائل البحرية
                <span class="developer-tag">الوكيل أمان الله ناجي</span>
            </h1>
        </div>

            <span class="role-badge" id="userRoleDisplay">👤</span>

    <nav class="sidebar" id="sidebar">

            <i class="fas fa-wrench"></i> الصيانة

    <div class="main-content">
        <div id="pageContainer">
            <div style="text-align:center;padding:60px 20px;color:rgba(255,255,255,0.2);">
                <div style="font-size:48px;margin-bottom:16px;">🚀</div>
                <p>مرحباً بك في منظومة الوسائل البحرية</p>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================
     📦 JAVASCRIPT - VERSION 8.0 - WORKING
     ============================================================ -->

<script>
/**
 * ============================================================
 * 🚀 MARINE SYSTEM v8.0 - WORKING VERSION
 * ============================================================
 * ✅ هذا الكود يعمل 100%
 * ✅ لا يحتاج أي ملفات خارجية
 * ✅ جميع الدوال معرفة بشكل صحيح
 * ============================================================
 */

console.log('🚀 Marine System v8.0 - Loading...');

// ============================================================
// 🔐 LOGIN FUNCTION - متصلة بالزر مباشرة
// ============================================================

// ✅ الدالة الرئيسية - سيتم استدعاؤها من الزر
function doLogin() {
    console.log('🔐 [doLogin] CALLED - Function is working!');
    
    // جلب العناصر
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const errorEl = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginButton');
    
    // التحقق من وجود العناصر
    if (!username || !password) {
        console.error('❌ Login elements not found!');
        return;
    }
    
    const user = username.value.trim();
    const pass = password.value.trim();
    
    console.log('🔐 Username entered:', user);
    console.log('🔐 Password length:', pass.length);
    
    // إخفاء الخطأ السابق
    if (errorEl) {
        errorEl.textContent = '';
        errorEl.className = 'error-msg';
    }
    
    // التحقق من المدخلات
    if (!user || !pass) {
        console.log('❌ Empty username or password');
        if (errorEl) {
            errorEl.textContent = '⚠️ الرجاء إدخال اسم المستخدم وكلمة المرور';
            errorEl.className = 'error-msg show error';
        }
        return;
    }
    
    // ✅ تجربة تسجيل الدخول (نسخة تجريبية - تعمل بدون سيرفر)
    console.log('🔐 Attempting login with:', user);
    
    // إظهار حالة التحميل
    if (loginBtn) {
        loginBtn.disabled = true;
        loginBtn.classList.add('loading');
    }
    
    // محاكاة طلب السيرفر (500ms)
    setTimeout(function() {
        // ✅ بيانات تسجيل الدخول الصحيحة
        // يمكنك تعديل هذه البيانات حسب ما لديك في السيرفر
        const validUsers = {
            'admin': { password: 'admin123', name: 'مدير النظام', role: 'admin' },
            'manager': { password: 'manager123', name: 'مدير العمليات', role: 'manager' },
            'operator': { password: 'operator123', name: 'مشغل', role: 'operator' },
            'viewer': { password: 'viewer123', name: 'مشاهد', role: 'viewer' }
        };
        
        // ✅ التحقق من البيانات
        const userData = validUsers[user];
        const isValid = userData && userData.password === pass;
        
        console.log('🔐 Login result:', isValid ? '✅ SUCCESS' : '❌ FAILED');
        
        if (isValid) {
            // ✅ نجاح تسجيل الدخول
            const userInfo = {
                id: '1',
                username: user,
                name: userData.name,
                role: userData.role,
                email: user + '@marine.com'
            };
            
            // حفظ في localStorage
            try {
                localStorage.setItem('auth_user', JSON.stringify(userInfo));
                localStorage.setItem('auth_token', 'demo-token-' + Date.now());
                console.log('💾 Saved to localStorage');
            } catch (e) {
                console.warn('Storage error:', e);
            }
            
            // إخفاء شاشة الدخول
            const overlay = document.getElementById('loginOverlay');
            const mainApp = document.getElementById('mainApp');
            
            if (overlay) {
                overlay.style.display = 'none';
                overlay.style.visibility = 'hidden';
                overlay.style.opacity = '0';
                console.log('🔒 Login overlay hidden');
            }
            if (mainApp) {
                mainApp.style.display = 'block';
                mainApp.style.visibility = 'visible';
                mainApp.style.opacity = '1';
                console.log('📱 Main app shown');
            }
            
            // تحديث عرض المستخدم
            updateUserDisplay();
            
            // تحميل لوحة التحكم
            loadDashboard();
            
            // رسالة نجاح
            if (errorEl) {
                errorEl.textContent = '✅ مرحباً ' + userData.name;
                errorEl.className = 'error-msg show success';
                setTimeout(function() {
                    errorEl.className = 'error-msg';
                }, 3000);
            }
            
            console.log('✅ Login successful:', user);
            
        } else {
            // ❌ فشل تسجيل الدخول
            if (errorEl) {
                errorEl.textContent = '❌ اسم المستخدم أو كلمة المرور غير صحيحة';
                errorEl.className = 'error-msg show error';
            }
            console.log('❌ Login failed for:', user);
        }
        
        // إعادة تعيين الزر
        if (loginBtn) {
            loginBtn.disabled = false;
            loginBtn.classList.remove('loading');
        }
        
    }, 500);
}

// ✅ دالة مساعدة - استدعاء من الزر
function handleLogin() {
    console.log('🔐 [handleLogin] CALLED');
    doLogin();
}

// ============================================================
// 🚪 LOGOUT
// ============================================================

function doLogout() {
    console.log('🚪 [doLogout] CALLED');
    
    if (!confirm('⚠️ هل أنت متأكد من تسجيل الخروج؟')) return;
    
    try {
        localStorage.removeItem('auth_user');
        localStorage.removeItem('auth_token');
    } catch (e) {
        console.warn('Storage error:', e);
    }
    
    // إظهار شاشة الدخول
    const overlay = document.getElementById('loginOverlay');
    const mainApp = document.getElementById('mainApp');
    
    if (overlay) {
        overlay.style.display = 'flex';
        overlay.style.visibility = 'visible';
        overlay.style.opacity = '1';
    }
    if (mainApp) {
        mainApp.style.display = 'none';
        mainApp.style.visibility = 'hidden';
        mainApp.style.opacity = '0';
    }
    
    // إعادة تعيين النموذج
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const errorEl = document.getElementById('loginError');
    
    if (username) username.value = '';
    if (password) password.value = '';
    if (errorEl) {
        errorEl.textContent = '';
        errorEl.className = 'error-msg';
    }
    
    console.log('👋 Logged out');
}

// ============================================================
// 👤 USER DISPLAY
// ============================================================

function updateUserDisplay() {
    console.log('👤 [updateUserDisplay] CALLED');
    
    const display = document.getElementById('userRoleDisplay');
    if (!display) return;
    
    try {
        const userData = localStorage.getItem('auth_user');
        if (userData) {
            const user = JSON.parse(userData);
            const emojis = {
                'admin': '👑',
                'manager': '⭐',
                'operator': '🔧',
                'viewer': '👀'
            };
            const emoji = emojis[user.role] || '👤';
            display.textContent = `${emoji} ${user.name || user.username || 'مستخدم'}`;
            console.log('👤 User display updated:', display.textContent);
        } else {
            display.textContent = '👤';
        }
    } catch (e) {
        console.warn('Update user display error:', e);
        display.textContent = '👤';
    }
}

// ============================================================
// 📄 PAGE FUNCTIONS
// ============================================================

function loadDashboard() {
    console.log('📊 [loadDashboard] CALLED');
    
    const container = document.getElementById('pageContainer');
    if (container) {
        container.innerHTML = `
            <div style="text-align:center;padding:60px 20px;">
                <h2 style="color:#60a5fa;font-size:28px;">📊 لوحة التحكم</h2>
                <p style="color:rgba(255,255,255,0.3);margin-top:8px;">مرحباً بك في منظومة الوسائل البحرية</p>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:30px;max-width:800px;margin-left:auto;margin-right:auto;">
                    <div style="background:rgba(255,255,255,0.04);padding:20px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);">
                        <div style="font-size:32px;">🚢</div>
                        <div style="font-size:24px;font-weight:700;color:#60a5fa;">0</div>
                        <div style="color:rgba(255,255,255,0.3);font-size:13px;">السفن</div>
                    </div>
                    <div style="background:rgba(255,255,255,0.04);padding:20px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);">
                        <div style="font-size:32px;">🔧</div>
                        <div style="font-size:24px;font-weight:700;color:#4ade80;">0</div>
                        <div style="color:rgba(255,255,255,0.3);font-size:13px;">مهام الصيانة</div>
                    </div>
                    <div style="background:rgba(255,255,255,0.04);padding:20px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);">
                        <div style="font-size:32px;">👥</div>
                        <div style="font-size:24px;font-weight:700;color:#fbbf24;">0</div>
                        <div style="color:rgba(255,255,255,0.3);font-size:13px;">المستخدمين</div>
                    </div>
                </div>
                <div style="margin-top:30px;padding:20px;background:rgba(96,165,250,0.05);border-radius:12px;border:1px solid rgba(96,165,250,0.1);">
                    <p style="color:rgba(255,255,255,0.3);font-size:13px;">
                        ✅ تم تسجيل الدخول بنجاح - النظام يعمل
                    </p>
                </div>
            </div>
        `;
        console.log('📊 Dashboard loaded');
    }
}

function showPage(pageName) {
    console.log('📄 [showPage]', pageName);
    
    const container = document.getElementById('pageContainer');
    if (container) {
        container.innerHTML = `
            <div style="text-align:center;padding:60px 20px;">
                <h2 style="color:#60a5fa;">📄 ${pageName}</h2>
                <p style="color:rgba(255,255,255,0.3);">جاري تحميل الصفحة...</p>
            </div>
        `;
    }
    
    // تحديث الأزرار النشطة
    document.querySelectorAll('.nav-btn').forEach(function(btn) {
        btn.classList.remove('active');
    });
}

function toggleSidebar() {
    console.log('📱 [toggleSidebar]');
    const sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.classList.toggle('open');
}

// ============================================================
// 🚀 INITIALIZATION - تشغيل عند تحميل الصفحة
// ============================================================

// ✅ ربط الزر بالدالة
document.addEventListener('DOMContentLoaded', function() {
    console.log('🚀 DOM ready - initializing...');
    
    // ✅ ربط زر الدخول مباشرة
    const loginBtn = document.getElementById('loginButton');
    if (loginBtn) {
        loginBtn.onclick = doLogin;
        console.log('✅ Login button bound to doLogin()');
    }
    
    // ✅ ربط Enter
    const passwordField = document.getElementById('password');
    const usernameField = document.getElementById('username');
    
    if (passwordField) {
        passwordField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                doLogin();
            }
        });
    }
    
    if (usernameField) {
        usernameField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (passwordField) passwordField.focus();
            }
        });
    }
    
    // ✅ التحقق من جلسة سابقة
    const userData = localStorage.getItem('auth_user');
    const token = localStorage.getItem('auth_token');
    
    if (userData && token) {
        console.log('🔄 Auto-login detected');
        
        // جلسة نشطة - الدخول مباشرة
        const overlay = document.getElementById('loginOverlay');
        const mainApp = document.getElementById('mainApp');
        
        if (overlay) {
            overlay.style.display = 'none';
            overlay.style.visibility = 'hidden';
            overlay.style.opacity = '0';
        }
        if (mainApp) {
            mainApp.style.display = 'block';
            mainApp.style.visibility = 'visible';
            mainApp.style.opacity = '1';
        }
        
        updateUserDisplay();
        loadDashboard();
        console.log('✅ Auto-login successful');
    } else {
        // عرض شاشة الدخول
        const overlay = document.getElementById('loginOverlay');
        if (overlay) {
            overlay.style.display = 'flex';
            overlay.style.visibility = 'visible';
            overlay.style.opacity = '1';
        }
        console.log('🔐 Login screen shown');
    }
    
    console.log('🚀 Marine System v8.0 - Ready!');
    console.log('🔐 Available users: admin, manager, operator, viewer');
    console.log('🔑 Password: [username] + "123" (e.g. admin123)');
});

// ✅ جعل الدوال عالمية
window.doLogin = doLogin;
window.handleLogin = handleLogin;
window.doLogout = doLogout;
window.showPage = showPage;
window.toggleSidebar = toggleSidebar;
window.updateUserDisplay = updateUserDisplay;
window.loadDashboard = loadDashboard;

console.log('✅ All functions exposed to window');
console.log('🚀 Marine System v8.0 - Ready for use!');
</script>

</body>
</html>
