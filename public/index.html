<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الوسائل البحرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Tajawal','Segoe UI',sans-serif;background:#eef2f5;padding:20px;direction:rtl}
        :root{--primary:#2e7d32;--accent:#d9534f;--bg:#eef2f5}
        #loginOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1a5a1e,#2e7d32);display:flex;justify-content:center;align-items:center;z-index:9999}
        .login-box{background:#fff;padding:30px;border-radius:15px;width:350px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
        .login-box h2{color:#2e7d32;margin-bottom:20px}
        .login-box input{width:100%;padding:12px;margin-bottom:15px;border:1px solid #ccc;border-radius:8px;font-size:16px}
        .login-box button{width:100%;background:#2e7d32;color:#fff;border:none;padding:12px;border-radius:8px;font-size:16px;cursor:pointer}
        .login-box button:hover{background:#1a5a1e}
        .error-msg{color:red;margin-top:10px;display:none}
        .container{max-width:1550px;margin:auto;background:#fff;padding:25px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.1);border-top:6px solid var(--primary)}
        header{background:var(--primary);color:#fff;padding:15px;border-radius:10px;text-align:center;margin-bottom:20px}
        .developer-info{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#2e7d32;padding:6px 20px;border-radius:30px;font-weight:bold;display:inline-block}
        .role-badge{background:#ffd966;color:#2e7d32;padding:4px 12px;border-radius:20px;margin-right:10px}
        .nav{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
        .btn{padding:10px 20px;border:none;border-radius:5px;cursor:pointer;font-weight:bold;color:#fff;transition:0.3s}
        .btn-blue{background:#2e7d32}
        .btn-orange{background:#f39c12}
        .btn-green{background:#28a745}
        .btn-cyan{background:#17a2b8}
        .btn-purple{background:#6f42c1}
        .btn-red{background:#d9534f}
        .btn-sm{padding:5px 10px;font-size:0.85em;cursor:pointer;border:none;color:#fff;border-radius:3px}
        .btn-sm-cyan{background:#17a2b8}
        .btn-sm-blue{background:#2e7d32}
        .btn-sm-red{background:#d9534f}
        .file-input-label{background:#17a2b8;padding:5px 10px;border-radius:5px;cursor:pointer;color:#fff;display:inline-flex;align-items:center;gap:5px}
        #fileInput{display:none}
        .hidden{display:none !important}
        .toast{position:fixed;bottom:20px;right:20px;background:#2e7d32;color:#fff;padding:12px 24px;border-radius:8px;z-index:10001;animation:fadeOut 3s ease forwards}
        @keyframes fadeOut{0%{opacity:1;transform:translateY(0)}70%{opacity:1}100%{opacity:0;transform:translateY(20px);visibility:hidden}}
        .page-frame{background:#f8f9fa;border-radius:10px;padding:20px;border:1px solid #dee2e6;min-height:300px}
        .iframe-container{width:100%;height:600px;border:none;border-radius:8px}
        @media (max-width:768px){.iframe-container{height:800px}}
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>⚓ منظومة الوسائل البحرية</h2>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="doLogin()">دخول</button>
        <div id="loginError" class="error-msg"></div>
        <hr style="margin:15px 0">
        <small style="color:#666;">🔐 admin / 1234 | editor / 1234 | viewer / 1234</small>
    </div>
</div>

<div id="mainApp" class="container" style="display:none">
    <header>
        <h1>⚓ منظومة متابعة الوسائل البحرية</h1>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:0 20px;margin-top:10px;flex-wrap:wrap;gap:10px">
            <div class="developer-info">💻 Développeur: أمان الله ناجي 🚀</div>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                <span id="userRoleDisplay" class="role-badge"></span>
                <button class="btn-sm btn-sm-cyan" onclick="exportAllData()" id="exportBtn">📤 تصدير</button>
                <label class="file-input-label" id="importLabelBtn">📥 استيراد <input type="file" id="fileInput" accept=".json" onchange="importAllData(this)"></label>
                <button class="btn-sm btn-sm-blue" onclick="refreshAllPages()">🔄 تحديث الكل</button>
                <button class="btn-sm btn-sm-red" onclick="logout()">خروج</button>
            </div>
        </div>
    </header>

    <div class="nav">
        <button class="btn btn-blue" onclick="loadPage('fleet.html')">⚓ الأسطول البحري</button>
        <button class="btn btn-orange" onclick="loadPage('maintenance.html')">🛠️ سجل الصيانة</button>
        <button class="btn btn-green" onclick="loadPage('efficiency.html')">📈 جاهزية الأسطول</button>
        <button class="btn btn-cyan" onclick="loadPage('support.html')">📞 الدعم الفني</button>
        <button id="trackBtn" class="btn btn-purple" onclick="loadPage('tracking.html')">🗺️ تتبع المستخدمين</button>
        <button id="admBtn" class="btn btn-red" onclick="loadPage('users.html')">👥 المستخدمين</button>
        <button class="btn btn-blue" onclick="window.print()">🖨️ طباعة</button>
    </div>

    <div id="pageContainer" class="page-frame">
        <div style="text-align:center;padding:40px;color:#6c757d;">
            <h3>👈 اختر صفحة من القائمة أعلاه</h3>
            <p style="margin-top:10px;">سيتم عرض المحتوى هنا</p>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    let currentUser = null;

    function showToast(msg, isError = false) {
        let t = document.getElementById('toast');
        t.textContent = msg;
        t.style.background = isError ? '#d9534f' : '#2e7d32';
        t.style.animation = 'none';
        setTimeout(() => { t.style.animation = 'fadeOut 3s ease forwards'; }, 100);
        setTimeout(() => { t.style.display = 'block'; }, 0);
    }

    async function doLogin() {
        let u = document.getElementById('username').value.trim();
        let p = document.getElementById('password').value.trim();
        let err = document.getElementById('loginError');
        if (!u || !p) { err.innerHTML = "املأ الحقول"; err.style.display = "block"; return; }
        try {
            let r = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: u, pass: p })
            });
            if (!r.ok) { let e = await r.json(); throw new Error(e.error); }
            let user = await r.json();
            currentUser = { name: user.name, role: user.role, id: user.id };
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userRoleDisplay').innerHTML = `👤 ${currentUser.name} | 🔑 ${currentUser.role}`;
            let isAdmin = currentUser.role === "مسؤول";
            document.getElementById('trackBtn').classList.toggle('hidden', !isAdmin);
            document.getElementById('admBtn').classList.toggle('hidden', !isAdmin);
            document.getElementById('exportBtn').style.display = isAdmin ? "inline-flex" : "none";
            document.getElementById('importLabelBtn').style.display = isAdmin ? "inline-flex" : "none";
            showToast(`مرحباً ${u}`);
        } catch(e) { err.innerHTML = e.message; err.style.display = "block"; }
    }

    function loadPage(page) {
        const container = document.getElementById('pageContainer');
        container.innerHTML = `
            <div style="text-align:center;padding:20px;">
                <span style="display:inline-block;font-size:24px;">⏳</span>
                <p>جاري تحميل ${page}...</p>
            </div>
        `;
        fetch(page)
            .then(res => {
                if (!res.ok) throw new Error('الصفحة غير موجودة');
                return res.text();
            })
            .then(html => {
                container.innerHTML = html;
            })
            .catch(err => {
                container.innerHTML = `
                    <div style="text-align:center;padding:40px;color:#d9534f;">
                        <h3>❌ تعذر تحميل الصفحة</h3>
                        <p>${err.message}</p>
                        <button class="btn btn-blue" onclick="loadPage('${page}')" style="margin-top:10px;">🔄 إعادة المحاولة</button>
                    </div>
                `;
                showToast('خطأ في تحميل الصفحة: ' + err.message, true);
            });
    }

    async function logout() {
        await fetch('/api/logout', { method: 'POST' });
        currentUser = null;
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('mainApp').style.display = 'none';
    }

    async function exportAllData() {
        if (!currentUser || currentUser.role !== 'مسؤول') { showToast("غير مسموح", true); return; }
        try {
            let r = await fetch('/api/export-all');
            let data = await r.json();
            let blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `marine_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            showToast("✅ تم التصدير");
        } catch(e) { showToast("خطأ: " + e.message, true); }
    }

    async function importAllData(input) {
        if (!currentUser || currentUser.role !== 'مسؤول') { showToast("غير مسموح", true); return; }
        if (!input.files || !input.files[0]) return;
        let file = input.files[0];
        let reader = new FileReader();
        reader.onload = async function(e) {
            try {
                let data = JSON.parse(e.target.result);
                await fetch('/api/import-all', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                showToast("✅ تم الاستيراد");
                loadPage('fleet.html');
            } catch(err) { showToast("خطأ: " + err.message, true); }
        };
        reader.readAsText(file);
        input.value = "";
    }

    async function refreshAllPages() {
        showToast("✅ تم تحديث جميع الصفحات");
        loadPage('fleet.html');
    }

    window.doLogin = doLogin;
    window.logout = logout;
    window.loadPage = loadPage;
    window.exportAllData = exportAllData;
    window.importAllData = importAllData;
    window.refreshAllPages = refreshAllPages;
</script>
</body>
</html>
