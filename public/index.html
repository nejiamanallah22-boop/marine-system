<!-- public/index.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚓ منظومة الوسائل البحرية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- ===== شاشة الدخول ===== -->
<div id="loginOverlay">
    <div class="login-box">
        <div class="login-logo">
            <span class="logo-icon">⚓</span>
            <span class="logo-text">منظومة الوسائل البحرية</span>
        </div>
        <p class="subtitle">نظام متابعة وإدارة الأسطول البحري</p>
        <div class="developer">
            <span class="dev-label">الوكيل</span>
            <span class="dev-name">أمان الله ناجي</span>
        </div>
        <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="username" placeholder="اسم المستخدم">
        </div>
        <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="كلمة المرور">
        </div>
        <button class="login-btn" onclick="doLogin()">
            <span>🚀</span> دخول
        </button>
        <div id="loginError" class="error-msg"></div>
        <div class="login-footer">
            <span>نظام إدارة وإسناد الوحدات البحرية</span>
            <span class="version">v3.0</span>
        </div>
    </div>
</div>

<!-- ===== التطبيق الرئيسي ===== -->
<div id="mainApp" style="display:none;">
    
    <!-- ===== الهيدر ===== -->
    <header>
        <div class="header-left">
            <span class="menu-toggle" onclick="toggleSidebar()">☰</span>
            <h1>
                <span>⚓</span>
                منظومة الوسائل البحرية
                <span class="developer-tag">الوكيل أمان الله ناجي</span>
            </h1>
        </div>
        <div class="header-right">
            <span class="notification-icon" onclick="toggleNotifications()">
                🔔 <span class="notification-badge" id="notificationBadge">0</span>
            </span>
            <span class="role-badge" id="userRoleDisplay">👤</span>
            <button class="btn-outline-white" onclick="window.print()"><i class="fas fa-print"></i></button>
            <button class="btn-outline-white" onclick="refreshAllPages()"><i class="fas fa-sync-alt"></i></button>
            <button class="btn-outline-white btn-logout" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <!-- ===== الشريط الجانبي ===== -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span>⚓</span>
            <span>الأسطول البحري</span>
        </div>
        <button class="nav-btn active" onclick="showPage('dashboard')">
            <i class="fas fa-chart-pie"></i> لوحة التحكم
        </button>
        <button class="nav-btn" onclick="showPage('fleet')">
            <i class="fas fa-ship"></i> الأسطول
        </button>
        <button class="nav-btn" onclick="showPage('maintenance')">
            <i class="fas fa-wrench"></i> الصيانة
        </button>
        <button class="nav-btn" onclick="showPage('efficiency')">
            <i class="fas fa-chart-line"></i> الجاهزية
        </button>
        <button class="nav-btn" onclick="showPage('support')">
            <i class="fas fa-headset"></i> الدعم
        </button>
        <button class="nav-btn" onclick="showPage('tracking')">
            <i class="fas fa-map-marker-alt"></i> التتبع
        </button>
        <button class="nav-btn" onclick="showPage('map')">
            <i class="fas fa-map"></i> الخريطة
        </button>
        <button class="nav-btn" onclick="showPage('users')">
            <i class="fas fa-users"></i> المستخدمين
        </button>
        <button class="nav-btn" onclick="showPage('notes')">
            <i class="fas fa-sticky-note"></i> Note Verbale
        </button>
        <button class="nav-btn" onclick="showPage('sessions')">
            <i class="fas fa-users-cog"></i> المراقبة
        </button>
        <div class="sidebar-footer">
            <span>الوكيل أمان الله ناجي</span>
        </div>
    </nav>

    <!-- ===== المحتوى الرئيسي ===== -->
    <div class="main-content">
        <div id="pageContainer"></div>
    </div>
</div>

<!-- ===== أزرار التمرير ===== -->
<div class="scroll-buttons">
    <button class="scroll-btn" onclick="scrollToTop()"><i class="fas fa-chevron-up"></i></button>
    <button class="scroll-btn" onclick="scrollToBottom()"><i class="fas fa-chevron-down"></i></button>
</div>

<!-- ===== النوافذ المنبثقة ===== -->
<div id="passwordModal" class="modal-overlay">
    <div class="modal-box">
        <h3>🔑 تغيير كلمة المرور</h3>
        <p id="modalUserName"></p>
        <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة">
        <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور">
        <div class="modal-actions">
            <button class="btn-save" onclick="saveNewPassword()">حفظ</button>
            <button class="btn-cancel" onclick="closePasswordModal()">إلغاء</button>
        </div>
    </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
