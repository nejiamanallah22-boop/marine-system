</head>  <body>  <!-- ============================================================  
     LOGIN  
     ============================================================ -->  <div id="loginOverlay">  <div class="login-box">  

    <div class="login-logo">  

        <span class="logo-icon">  
            ⚓  
        </span>  

        <span class="logo-text">  
            منظومة الوسائل البحرية  
        </span>  

    </div>  

    <p class="subtitle">  
        نظام متابعة وإدارة الأسطول البحري  
    </p>  

    <div class="developer">  

        <span class="dev-label">  
            الوكيل  
        </span>  

        <span class="dev-name">  
            أمان الله ناجي  
        </span>  

    </div>  

    <!-- Username -->  

    <div class="input-group">  

        <i class="fas fa-user input-icon"></i>  

        <input  
            type="text"  
            id="username"  
            placeholder="اسم المستخدم"  
            autocomplete="username"  
            required  
        >  

    </div>  

    <!-- Password -->  

    <div class="input-group">  

        <i class="fas fa-lock input-icon"></i>  

        <input  
            type="password"  
            id="password"  
            placeholder="كلمة المرور"  
            autocomplete="current-password"  
            required  
        >  

    </div>  

    <!-- Login -->  

    <button  
        type="button"  
        class="login-btn"  
        id="loginButton"  
        onclick="handleLogin()"  
    >  

        <span id="loginButtonIcon">  
            🚀  
        </span>  

        <span id="loginButtonText">  
            دخول  
        </span>  

    </button>  

    <!-- Error -->  

    <div  
        id="loginError"  
        class="error-msg"  
        role="alert"  
    ></div>  

    <div class="login-footer">  

        <span>  
            نظام إدارة وإسناد الوحدات البحرية  
        </span>  

        <span class="version">  
            v5.0  
        </span>  

    </div>  

</div>

        <button

        <button

</header>
