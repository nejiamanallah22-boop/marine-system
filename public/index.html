<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منظومة الوسائل البحرية - أمان الله ناجي</title>

    <!-- ====== Font Awesome 6 ====== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- ====== Google Font ====== -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ==========================
               CSS Variables
            ========================== */
        :root {
            --primary: #0f3b5c;
            --primary-dark: #09263b;
            --primary-light: #1a5f7a;
            --primary-gradient: linear-gradient(145deg, #0f3b5c, #1a5f7a);
            --secondary: #f5b042;
            --secondary-light: #f7c66a;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --info: #3498db;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s ease;
            --font: 'Cairo', 'Segoe UI', system-ui, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f4f8 0%, #e8edf3 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ==========================
               شاشة تسجيل الدخول
            ========================== */
        .login-wrapper {
            width: 100%;
            max-width: 440px;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 48px 40px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            height: 5px;
            background: var(--primary-gradient);
        }

        /* الهيدر */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .logo {
            width: 80px;
            height: 80px;
            background: var(--primary-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 30px rgba(15, 59, 92, 0.3);
            position: relative;
        }

        .login-header .logo i {
            font-size: 2.4rem;
            color: #fff;
        }

        .login-header .logo .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(15, 59, 92, 0.15);
            animation: pulse 2s ease-out infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .login-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--gray-900);
        }

        .login-header h1 span {
            color: var(--secondary);
        }

        .login-header p {
            color: var(--gray-500);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .login-header .developer {
            margin-top: 12px;
            padding: 8px 16px;
            background: var(--gray-50);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            color: var(--gray-500);
        }

        .login-header .developer i {
            color: var(--secondary);
        }

        .login-header .developer strong {
            color: var(--primary);
        }

        /* الحقول */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: var(--font);
            background: var(--gray-50);
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(15, 59, 92, 0.08);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .form-options label {
            color: var(--gray-600);
            cursor: pointer;
        }

        .form-options label input {
            accent-color: var(--primary);
        }

        .form-options a {
            color: var(--primary);
            text-decoration: none;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        /* زر الدخول */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1.05rem;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(15, 59, 92, 0.35);
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        /* رسائل الخطأ */
        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
            text-align: center;
        }

        .error-msg.show {
            display: block;
        }

        /* بيانات تجريبية */
        .demo-info {
            margin-top: 16px;
            padding: 10px;
            background: var(--gray-50);
            border-radius: var(--radius-sm);
            text-align: center;
            font-size: 0.75rem;
            color: var(--gray-500);
        }

        .demo-info code {
            background: var(--gray-200);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }

        /* تذييل */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--gray-200);
            color: var(--gray-400);
            font-size: 0.75rem;
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
        }

        /* ==========================
               استجابة
            ========================== */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 20px 28px;
            }
            .login-header h1 {
                font-size: 1.3rem;
            }
            .login-header .logo {
                width: 64px;
                height: 64px;
            }
            .login-header .logo i {
                font-size: 1.8rem;
            }
            .form-options {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">

            <!-- ====== الهيدر ====== -->
            <div class="login-header">
                <div class="logo">
                    <span class="ring"></span>
                    <i class="fas fa-anchor"></i>
                </div>
                <h1>منظومة <span>البحرية</span></h1>
                <p>نظام إدارة الوسائل البحرية</p>
                <div class="developer">
                    <i class="fas fa-code"></i> المطور: <strong>أمان الله ناجي</strong>
                    <i class="fas fa-rocket" style="margin-right:6px;"></i>
                </div>
            </div>

            <!-- ====== نموذج الدخول ====== -->
            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <input type="text" id="username" placeholder="اسم المستخدم" required autofocus />
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="كلمة المرور" required />
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" id="rememberMe" /> تذكرني
                    </label>
                    <a href="#">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>

                <div class="error-msg" id="loginError">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>
            </form>

            <!-- ====== بيانات تجريبية ====== -->
            <div class="demo-info">
                <i class="fas fa-info-circle"></i> بيانات تجريبية:
                <code>admin</code> / <code>admin123</code>
                <span style="margin:0 6px;">·</span>
                <code>user</code> / <code>user123</code>
            </div>

            <!-- ====== تذييل ====== -->
            <div class="login-footer">
                <i class="fas fa-shield-alt"></i> نظام آمن © 2026
                <a href="#">منظومة الوسائل البحرية</a>
            </div>

        </div>
    </div>

    <!-- =============================================================== -->
    <!-- جافا سكريبت -->
    <!-- =============================================================== -->
    <script>
        /**
         * منظومة الوسائل البحرية
         * المطور: أمان الله ناجي
         * نظام إدارة المراكب والوسائل البحرية
         */

        // ==========================
        // بيانات المستخدمين (محاكاة)
        // ==========================
        const USERS = {
            'admin': { password: 'admin123', role: 'مسؤول', name: 'مدير النظام' },
            'editor': { password: 'editor123', role: 'محرر', name: 'محرر البيانات' },
            'user': { password: 'user123', role: 'مستخدم', name: 'مستخدم عادي' },
        };

        // ==========================
        // معالجة تسجيل الدخول
        // ==========================
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');

            // التحقق من الحقول
            if (!username || !password) {
                errorEl.textContent = '⚠️ يرجى تعبئة جميع الحقول';
                errorEl.classList.add('show');
                return false;
            }

            // التحقق من المستخدم
            const user = USERS[username];

            if (user && user.password === password) {
                // حفظ بيانات المستخدم في الجلسة
                const userData = {
                    username: username,
                    name: user.name,
                    role: user.role,
                    loggedIn: true,
                    loginTime: new Date().toISOString()
                };

                localStorage.setItem('currentUser', JSON.stringify(userData));
                localStorage.setItem('token', 'token-' + Date.now());

                // حفظ تذكرني
                if (document.getElementById('rememberMe').checked) {
                    localStorage.setItem('rememberMe', 'true');
                    localStorage.setItem('savedUsername', username);
                } else {
                    localStorage.removeItem('rememberMe');
                    localStorage.removeItem('savedUsername');
                }

                // توجيه إلى لوحة التحكم
                window.location.href = 'dashboard.html';

                return true;
            } else {
                errorEl.textContent = '❌ اسم المستخدم أو كلمة المرور غير صحيحة';
                errorEl.classList.add('show');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
                return false;
            }
        }

        // ==========================
        // استعادة بيانات الدخول المحفوظة
        // ==========================
        function loadSavedCredentials() {
            if (localStorage.getItem('rememberMe') === 'true') {
                const saved = localStorage.getItem('savedUsername');
                if (saved) {
                    document.getElementById('username').value = saved;
                    document.getElementById('rememberMe').checked = true;
                    document.getElementById('password').focus();
                }
            }
        }

        // ==========================
        // التحقق من جلسة نشطة
        // ==========================
        function checkActiveSession() {
            try {
                const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
                const token = localStorage.getItem('token');

                if (user && token && user.loggedIn) {
                    // إذا كانت الجلسة نشطة، انتقل إلى لوحة التحكم
                    window.location.href = 'dashboard.html';
                }
            } catch (e) {
                // تجاهل
            }
        }

        // ==========================
        // تهيئة الصفحة
        // ==========================
        document.addEventListener('DOMContentLoaded', function() {
            // التحقق من الجلسة النشطة
            checkActiveSession();

            // استعادة البيانات المحفوظة
            loadSavedCredentials();

            // إخفاء الخطأ عند الكتابة
            document.getElementById('username').addEventListener('input', function() {
                document.getElementById('loginError').classList.remove('show');
            });
            document.getElementById('password').addEventListener('input', function() {
                document.getElementById('loginError').classList.remove('show');
            });

            console.log('🔐 منظومة الوسائل البحرية - أمان الله ناجي');
            console.log('👤 المستخدمين المتاحين:', Object.keys(USERS).join(', '));
        });
    </script>

</body>
</html>
