<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚓ منظومة الوسائل البحرية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginOverlay">
    <div class="login-box">
        <div class="login-logo">
            <span class="logo-icon">⚓</span>
            <span class="logo-text">منظومة الوسائل البحرية</span>
        </div>
        <p class="subtitle">نظام متابعة وإدارة الأسطول البحري</p>
        <div class="developer">
            <span class="dev-label">الوكيل</span>
            <span class="dev-name">أمان الله ناجي</span>
        </div>
        <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="username" required>
        </div>
        <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password" required>
        </div>
        <button type="button" class="login-btn" id="loginButton" onclick="handleLogin()">
            <span id="loginButtonIcon">🚀</span>
            <span id="loginButtonText">دخول</span>
        </button>
        <div id="loginError" class="error-msg" role="alert"></div>
        <div class="login-footer">
            <span>نظام إدارة وإسناد الوحدات البحرية</span>
            <span class="version">v5.0</span>
        </div>
    </div>
</div>

<!-- ===== MAIN APPLICATION ===== -->
<div id="mainApp" style="display:none;">
    <!-- HEADER -->
    <header>
        <div class="header-left">
            <span class="menu-toggle" onclick="toggleSidebar()">☰</span>
            <h1>
                <span>⚓</span>
                منظومة الوسائل البحرية
                <span class="developer-tag">الوكيل أمان الله ناجي</span>
            </h1>
        </div>
        <div class="header-right">
            <span class="notification-icon" onclick="toggleNotifications()">
                🔔 <span class="notification-badge" id="notificationBadge">0</span>
            </span>
            <span class="role-badge" id="userRoleDisplay">👤</span>
            <button class="btn-outline-white" type="button" onclick="window.print()" title="طباعة">
                <i class="fas fa-print"></i>
            </button>
            <button class="btn-outline-white" type="button" onclick="refreshAllPages()" title="تحديث">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button class="btn-outline-white btn-logout" type="button" onclick="doLogout()" title="تسجيل الخروج">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span>⚓</span>
            <span>الأسطول البحري</span>
        </div>
        <button class="nav-btn active" onclick="showPage('dashboard')">
            <i class="fas fa-chart-pie"></i> لوحة التحكم
        </button>
        <button class="nav-btn" onclick="showPage('fleet')">
            <i class="fas fa-ship"></i> الأسطول
        </button>
        <button class="nav-btn" onclick="showPage('maintenance')">
            <i class="fas fa-wrench"></i> الصيانة
        </button>
        <button class="nav-btn" onclick="showPage('efficiency')">
            <i class="fas fa-chart-line"></i> الجاهزية
        </button>
        <button class="nav-btn" onclick="showPage('support')">
            <i class="fas fa-headset"></i> الدعم
        </button>
        <button class="nav-btn" onclick="showPage('users')">
            <i class="fas fa-users"></i> المستخدمين
        </button>
        <button class="nav-btn" onclick="showPage('notes')">
            <i class="fas fa-sticky-note"></i> Note Verbale
        </button>
        <button class="nav-btn" onclick="showPage('sessions')">
            <i class="fas fa-users-cog"></i> المراقبة
        </button>
        <button class="nav-btn" onclick="showPage('ai-assistant')">
            <i class="fas fa-robot"></i> 🤖 المساعد الذكي
        </button>
        <div class="sidebar-footer">
            <span>الوكيل أمان الله ناجي</span>
        </div>
    </nav>

    <!-- CONTENT -->
    <div class="main-content">
        <div id="pageContainer"></div>
    </div>
</div>

<!-- ===== SCROLL BUTTONS ===== -->
<div class="scroll-buttons">
    <button class="scroll-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <i class="fas fa-chevron-up"></i>
    </button>
    <button class="scroll-btn" onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">
        <i class="fas fa-chevron-down"></i>
    </button>
</div>

<!-- ===== JS ===== -->
<script src="/js/core/config.js"></script>
<script src="/js/core/helpers.js"></script>
<script src="/js/core/auth.js"></script>
<script src="/js/lib/charts.js"></script>
<script src="/js/lib/notifications.js"></script>
<script src="/js/lib/file-import.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/fleet.js"></script>
<script src="/js/pages/maintenance.js"></script>
<script src="/js/pages/efficiency.js"></script>
<script src="/js/pages/users.js"></script>
<script src="/js/pages/ai-assistant.js"></script>
<script src="/js/app.js"></script>

<!-- ===== FORCE LOGIN - منع أي إخفاء لشاشة الدخول ===== -->
<script>
(function() {
    // ✅ إجبار شاشة الدخول
    function forceLogin() {
        const overlay = document.getElementById('loginOverlay');
        const mainApp = document.getElementById('mainApp');
        
        if (overlay) {
            overlay.style.display = 'flex';
            overlay.style.visibility = 'visible';
            overlay.style.opacity = '1';
            overlay.style.position = 'fixed';
            overlay.style.top = '0';
            overlay.style.left = '0';
            overlay.style.width = '100%';
            overlay.style.height = '100%';
            overlay.style.zIndex = '999999';
            overlay.style.background = 'rgba(10,14,23,0.98)';
            overlay.style.backdropFilter = 'blur(10px)';
        }
        if (mainApp) {
            mainApp.style.display = 'none';
            mainApp.style.visibility = 'hidden';
            mainApp.style.opacity = '0';
        }
        
        console.log('🔐 Login screen forced');
    }

    // ✅ تنفيذ فوراً
    forceLogin();

    // ✅ مراقبة أي تغيير
    const observer = new MutationObserver(function() {
        const overlay = document.getElementById('loginOverlay');
        if (overlay && (overlay.style.display === 'none' || overlay.style.visibility === 'hidden' || overlay.style.opacity === '0')) {
            forceLogin();
        }
    });

    observer.observe(document.body, {
        attributes: true,
        attributeFilter: ['style'],
        subtree: true,
        childList: true
    });

    console.log('🚀 Login screen locked - v20.0');
})();
</script>

</body>
</html>
