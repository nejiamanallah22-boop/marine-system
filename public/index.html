<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚓ منظومة الوسائل البحرية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" />
    <link rel="stylesheet" href="/css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<!-- ===== شاشة الدخول ===== -->
<div id="loginOverlay">
    <div class="login-box">
        <span class="logo">⚓</span>
        <h2>منظومة الوسائل البحرية</h2>
        <p class="subtitle">نظام متابعة وإدارة الأسطول البحري</p>
        <input type="text" id="username" placeholder="👤 اسم المستخدم">
        <input type="password" id="password" placeholder="🔑 كلمة المرور">
        <button class="login-btn" onclick="doLogin()">🚀 دخول</button>
        <div id="loginError" class="error-msg"></div>
    </div>
</div>

<!-- ===== التطبيق الرئيسي ===== -->
<div id="mainApp" class="container">
    
    <!-- ===== الهيدر ===== -->
    <header>
        <h1>
            ⚓ منظومة متابعة الوسائل البحرية
            <span class="developer"><i class="fas fa-code"></i> المطور: أمان الله ناجي</span>
        </h1>
        <div class="header-content">
            <span class="notification-icon" onclick="toggleNotifications()">
                🔔 <span class="notification-badge" id="notificationBadge">0</span>
            </span>
            <span class="role-badge" id="userRoleDisplay">👤</span>
            <button class="btn btn-sm btn-outline-white" onclick="window.print()">🖨️ طباعة</button>
            <button class="btn btn-sm btn-outline-white" onclick="refreshAllPages()">🔄 تحديث</button>
            <button class="btn btn-sm btn-outline-white" onclick="doLogout()">🚪 خروج</button>
        </div>
    </header>

    <!-- ===== شريط التنقل ===== -->
    <div class="nav">
        <button class="btn btn-primary" onclick="showPage('fleet')">🚢 الأسطول</button>
        <button class="btn btn-warning" onclick="showPage('maintenance')">🔧 الصيانة</button>
        <button class="btn btn-success" onclick="showPage('efficiency')">📊 الجاهزية</button>
        <button class="btn btn-info" onclick="showPage('support')">🎫 الدعم</button>
        <button class="btn btn-secondary" onclick="showPage('tracking')">📍 التتبع</button>
        <button class="btn btn-secondary" onclick="showPage('map')">🗺️ الخريطة</button>
        <button class="btn btn-secondary" onclick="showPage('users')">👥 المستخدمين</button>
        <button class="btn btn-primary" onclick="showPage('notes')">📝 Note Verbale</button>
    </div>

    <!-- ===== حاوية الصفحات ===== -->
    <div id="pageContainer"></div>
</div>

<!-- ===== أزرار التمرير ===== -->
<div class="scroll-buttons">
    <button class="scroll-btn" onclick="scrollToTop()">↑</button>
    <button class="scroll-btn" onclick="scrollToBottom()">↓</button>
</div>

<!-- ===== النوافذ المنبثقة ===== -->
<div id="passwordModal" class="modal">
    <div class="modal-content">
        <h3>🔑 تغيير كلمة المرور</h3>
        <p id="modalUserName" style="margin-bottom:10px; color:#6c757d;"></p>
        <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة">
        <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور">
        <div class="modal-actions">
            <button class="btn btn-success" onclick="saveNewPassword()">حفظ</button>
            <button class="btn btn-danger" onclick="closePasswordModal()">إلغاء</button>
        </div>
    </div>
</div>

<!-- ===== ملفات الجافاسكريبت ===== -->
<script src="/js/app.js"></script>

</body>
</html>
