<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚓ منظومة الوسائل البحرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- ===== شاشة تسجيل الدخول ===== -->
    <div id="loginOverlay">
        <div class="login-box">
            <h1>⚓ منظومة الوسائل البحرية</h1>
            <p class="sub">نظام متابعة وإدارة الأسطول البحري</p>
            <div class="developer">الوكيل أمان الله ناجي</div>
            <div class="input-group">
                <input type="text" id="username" placeholder="اسم المستخدم">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="كلمة المرور">
            </div>
            <button class="login-btn" id="loginButton">🚀 دخول</button>
            <div id="loginError" class="error-msg"></div>
            <div class="version">v5.0</div>
        </div>
    </div>

    <!-- ===== التطبيق الرئيسي ===== -->
    <div id="mainApp" style="display:none;">
        <header>
            <div style="display:flex;align-items:center;gap:14px;">
                <span onclick="toggleSidebar()" style="cursor:pointer;font-size:22px;">☰</span>
                <h1>⚓ منظومة الوسائل البحرية</h1>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <span id="userRoleDisplay" style="color:#60a5fa;">👤</span>
                <button class="btn-logout" onclick="doLogout()">🚪 خروج</button>
            </div>
        </header>

        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand">⚓ الأسطول البحري</div>
            <button class="nav-btn active" onclick="showPage('dashboard')">📊 لوحة التحكم</button>
            <button class="nav-btn" onclick="showPage('fleet')">🚢 الأسطول</button>
            <button class="nav-btn" onclick="showPage('users')">👥 المستخدمين</button>
        </nav>

        <div class="main-content">
            <div id="pageContainer">
                <div style="text-align:center;padding:40px;color:#94a3b8;">🚀 جاري التحميل...</div>
            </div>
        </div>
    </div>

    <script>
        console.log('🚀 Marine System v5.0');

        // ============================================================
        // 🔐 تسجيل الدخول
        // ============================================================

        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 DOM ready');

            var loginBtn = document.getElementById('loginButton');

            if (loginBtn) {
                loginBtn.onclick = function() {
                    console.log('🖱️ زر الدخول تم الضغط عليه!');

                    var username = document.getElementById('username');
                    var password = document.getElementById('password');
                    var errorEl = document.getElementById('loginError');

                    var user = username.value.trim();
                    var pass = password.value;

                    errorEl.className = 'error-msg';
                    errorEl.textContent = '';

                    if (!user || !pass) {
                        errorEl.textContent = '⚠️ يرجى إدخال اسم المستخدم وكلمة المرور';
                        errorEl.classList.add('show');
                        return;
                    }

                    loginBtn.disabled = true;
                    loginBtn.textContent = '⏳ جاري...';

                    console.log('📡 إرسال طلب إلى: /api/auth/login');
                    console.log('👤 اسم المستخدم:', user);

                    fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ username: user, password: pass })
                    })
                    .then(function(response) {
                        console.log('📡 حالة الاستجابة:', response.status);
                        return response.json();
                    })
                    .then(function(data) {
                        console.log('📡 البيانات:', data);

                        loginBtn.disabled = false;
                        loginBtn.textContent = '🚀 دخول';

                        if (data.success) {
                            localStorage.setItem('auth_token', data.token);
                            localStorage.setItem('auth_user', JSON.stringify(data.user));

                            document.getElementById('loginOverlay').style.display = 'none';
                            document.getElementById('mainApp').style.display = 'block';

                            var display = document.getElementById('userRoleDisplay');
                            display.textContent = '👤 ' + (data.user.name || data.user.username);

                            errorEl.textContent = '✅ مرحباً ' + (data.user.name || user);
                            errorEl.classList.add('show');
                            errorEl.classList.add('success');

                            loadDashboard();

                            console.log('✅ تسجيل الدخول ناجح');

                        } else {
                            errorEl.textContent = '❌ ' + (data.error || 'بيانات الدخول غير صحيحة');
                            errorEl.classList.add('show');
                            console.log('❌ فشل تسجيل الدخول');
                        }
                    })
                    .catch(function(error) {
                        loginBtn.disabled = false;
                        loginBtn.textContent = '🚀 دخول';
                        errorEl.textContent = '❌ خطأ في الاتصال: ' + error.message;
                        errorEl.classList.add('show');
                        console.error('❌ خطأ:', error);
                    });
                };

                console.log('✅ زر الدخول مرتبط');
            }

            // ✅ التحقق من الجلسة
            var token = localStorage.getItem('auth_token');
            var user = JSON.parse(localStorage.getItem('auth_user') || 'null');

            if (token && user) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';

                var display = document.getElementById('userRoleDisplay');
                display.textContent = '👤 ' + (user.name || user.username);

                loadDashboard();
                console.log('✅ تم استعادة الجلسة');
            }
        });

        // ============================================================
        // 📊 لوحة التحكم
        // ============================================================

        function loadDashboard() {
            var container = document.getElementById('pageContainer');

            container.innerHTML = `
                <div style="text-align:center;padding:40px;">
                    <h2 style="color:#60a5fa;">📊 لوحة التحكم</h2>
                    <p style="color:#94a3b8;margin:16px 0;">مرحباً بك في منظومة الوسائل البحرية</p>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="number">0</div><div class="label">🚢 إجمالي المراكب</div></div>
                        <div class="stat-card"><div class="number">0</div><div class="label">✅ الصالح</div></div>
                        <div class="stat-card"><div class="number">0</div><div class="label">👥 المستخدمين</div></div>
                    </div>
                    <button onclick="showPage('fleet')" style="padding:10px 20px;background:#2563eb;border:none;border-radius:8px;color:white;cursor:pointer;font-size:14px;font-family:'Cairo',sans-serif;">
                        ⚓ إدارة الأسطول
                    </button>
                </div>
            `;
        }

        // ============================================================
        // 📄 الصفحات
        // ============================================================

        function showPage(pageName) {
            var container = document.getElementById('pageContainer');

            if (pageName === 'dashboard') {
                loadDashboard();
            } else if (pageName === 'fleet') {
                container.innerHTML = `
                    <div style="text-align:center;padding:40px;">
                        <h2 style="color:#60a5fa;">🚢 الأسطول</h2>
                        <p style="color:#94a3b8;margin:16px 0;">لا توجد مراكب</p>
                        <button onclick="showPage('dashboard')" style="padding:10px 20px;background:#60a5fa;border:none;border-radius:8px;color:#0a0e17;cursor:pointer;font-size:14px;font-family:'Cairo',sans-serif;">
                            📊 العودة
                        </button>
                    </div>
                `;
            } else if (pageName === 'users') {
                container.innerHTML = `
                    <div style="text-align:center;padding:40px;">
                        <h2 style="color:#60a5fa;">👥 المستخدمين</h2>
                        <p style="color:#94a3b8;margin:16px 0;">لا توجد مستخدمين</p>
                        <button onclick="showPage('dashboard')" style="padding:10px 20px;background:#60a5fa;border:none;border-radius:8px;color:#0a0e17;cursor:pointer;font-size:14px;font-family:'Cairo',sans-serif;">
                            📊 العودة
                        </button>
                    </div>
                `;
            }

            // ✅ تحديث الأزرار
            document.querySelectorAll('.nav-btn').forEach(function(btn) {
                btn.classList.remove('active');
                var pageMap = {
                    'dashboard': 'لوحة التحكم',
                    'fleet': 'الأسطول',
                    'users': 'المستخدمين'
                };
                if (btn.textContent.includes(pageMap[pageName] || pageName)) {
                    btn.classList.add('active');
                }
            });
        }

        // ============================================================
        // 🚪 تسجيل الخروج
        // ============================================================

        function doLogout() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('auth_user');

            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('loginOverlay').style.display = 'flex';

            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('loginError').className = 'error-msg';
        }

        // ============================================================
        // 📱 الوظائف الأخرى
        // ============================================================

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function refreshAllPages() {
            console.log('🔄 تحديث');
        }

        // ============================================================
        // 🌐 جعل الدوال عالمية
        // ============================================================

        window.showPage = showPage;
        window.toggleSidebar = toggleSidebar;
        window.doLogout = doLogout;
        window.refreshAllPages = refreshAllPages;

        console.log('✅ Marine System v5.0 ready');
        console.log('🔑 استخدم: admin / (كلمة المرور من Render)');
    </script>

</body>
</html>
