<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚓ منظومة الوسائل البحرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #0a4b3a;
            --primary-light: #1a7a5a;
            --primary-dark: #062f24;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --bg: #f0f4f8;
            --text: #333;
            --text-light: #7f8c8d;
            --border: #ddd;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            direction: rtl;
            display: flex;
        }
        #loginOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #062f24, #0a4b3a, #1a7a5a);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: rgba(255,255,255,0.98);
            padding: 45px 40px 35px;
            border-radius: 24px;
            width: 420px;
            max-width: 95%;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
        }
        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .login-logo .logo-icon { font-size: 42px; }
        .login-logo .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
        }
        .subtitle {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 18px;
        }
        .developer {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #ffd700, #f0c000);
            padding: 4px 18px 4px 14px;
            border-radius: 30px;
            margin-bottom: 22px;
            font-weight: 700;
            color: var(--primary-dark);
            font-size: 13px;
        }
        .dev-label {
            background: var(--primary);
            color: white;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 11px;
        }
        .input-group {
            position: relative;
            margin-bottom: 14px;
        }
        .input-group .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 16px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 45px 12px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            background: #f8fafc;
            font-family: 'Cairo', sans-serif;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(10,75,58,0.1);
            background: white;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Cairo', sans-serif;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(10,75,58,0.3);
        }
        .login-btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .login-btn.loading .spinner { display: inline-block; }
        .login-btn.loading #loginButtonIcon,
        .login-btn.loading #loginButtonText { display: none; }
        .error-msg {
            color: var(--danger);
            font-size: 14px;
            margin-top: 12px;
            display: none;
            padding: 8px 12px;
            background: #fde8e8;
            border-radius: 8px;
        }
        .error-msg.show { display: block; }
        .login-footer {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-light);
        }
        .login-footer .version {
            background: var(--bg);
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 600;
            color: var(--primary);
        }
        #mainApp {
            display: none;
            width: 100%;
            min-height: 100vh;
            flex-direction: column;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.15);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .menu-toggle {
            font-size: 22px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
        }
        header h1 {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .developer-tag {
            font-size: 11px;
            background: rgba(255,255,255,0.15);
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: 400;
            margin-right: 8px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .role-badge {
            background: rgba(255,255,255,0.12);
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
        }
        .btn-outline-white {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }
        .btn-outline-white:hover { background: rgba(255,255,255,0.15); }
        .btn-logout {
            color: #ffcdd2;
            border-color: rgba(255,205,210,0.2);
        }
        .btn-logout:hover {
            background: rgba(231,76,60,0.2);
            color: white;
        }
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 260px;
            height: 100%;
            background: white;
            box-shadow: 2px 0 30px rgba(0,0,0,0.08);
            transform: translateX(0);
            transition: transform 0.3s ease;
            z-index: 999;
            padding-top: 70px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar.closed { transform: translateX(100%); }
        .sidebar-brand {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            padding: 16px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            border: none;
            background: transparent;
            width: 100%;
            text-align: right;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
            border-right: 3px solid transparent;
        }
        .nav-btn:hover {
            background: #f0f4f8;
            color: var(--primary);
        }
        .nav-btn.active {
            background: #e8f5e9;
            color: var(--primary);
            border-right-color: var(--primary);
        }
        .sidebar-footer {
            margin-top: auto;
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
        }
        .main-content {
            margin-right: 260px;
            padding: 20px 24px 30px;
            flex: 1;
            min-height: 100vh;
            background: var(--bg);
            transition: margin-right 0.3s ease;
        }
        .sidebar.closed ~ .main-content { margin-right: 0; }
        .page {
            display: none;
            animation: fadePage 0.3s ease;
        }
        .page.active { display: block; }
        @keyframes fadePage {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            border-radius: var(--radius);
            padding: 18px 20px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
        }
        .stat-card .label {
            font-size: 13px;
            color: var(--text-light);
            display: block;
            margin-top: 4px;
        }
        .stat-card .icon {
            font-size: 24px;
            display: block;
            margin-bottom: 6px;
        }
        .table-wrapper {
            overflow-x: auto;
            background: white;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 600px;
        }
        thead {
            background: #f8fafc;
            border-bottom: 2px solid var(--border);
        }
        th {
            padding: 10px 12px;
            text-align: right;
            font-weight: 700;
            color: #334155;
            font-size: 12px;
        }
        td {
            padding: 8px 12px;
            border-bottom: 1px solid #f1f5f9;
        }
        tr:hover td { background: #fafcff; }
        .status-badge {
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.active {
            background: #dcfce7;
            color: #166534;
        }
        .status-badge.inactive {
            background: #fee2e2;
            color: #991b1b;
        }
        .status-badge.maintenance {
            background: #fef3c7;
            color: #92400e;
        }
        .form-card {
            background: white;
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }
        .form-card h3 {
            font-size: 17px;
            color: var(--primary);
            margin-bottom: 14px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #334155;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            background: white;
            font-family: 'Cairo', sans-serif;
            width: 100%;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(10,75,58,0.08);
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Cairo', sans-serif;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #1e8449; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #d68910; }
        .btn-sm { padding: 3px 10px; font-size: 12px; }
        .ticket-list { display: grid; gap: 10px; }
        .ticket-item {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .ticket-info {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }
        .ticket-title { font-weight: 600; }
        .ticket-date { color: var(--text-light); font-size: 12px; }
        .priority-high { color: var(--danger); font-weight: 600; }
        .priority-medium { color: var(--warning); font-weight: 600; }
        .priority-low { color: var(--success); font-weight: 600; }
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .chart-box {
            background: white;
            border-radius: var(--radius);
            padding: 18px 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .chart-box h4 {
            text-align: center;
            margin-bottom: 12px;
            color: var(--primary);
            font-size: 15px;
        }
        canvas { max-height: 280px; width: 100% !important; }
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 450px;
            margin: 0 auto;
            z-index: 9999;
        }
        .toast {
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            animation: slideUp 0.3s ease;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-warning { background: var(--warning); }
        .toast-info { background: var(--primary); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .scroll-buttons {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 999;
        }
        .scroll-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scroll-btn:hover {
            transform: scale(1.1);
            background: var(--primary-dark);
        }
        @media (max-width: 992px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; }
        }
        @media (max-width: 768px) {
            header h1 { font-size: 15px; flex-wrap: wrap; }
            .developer-tag { display: none; }
            .login-box { padding: 30px 20px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .form-grid { grid-template-columns: 1fr; }
        }
        @media print {
            .sidebar, .scroll-buttons, .btn, .btn-sm, .filter-bar, .form-card {
                display: none !important;
            }
            .main-content { margin: 0 !important; padding: 10px !important; }
            @page { size: landscape; margin: 1cm; }
        }
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .mb-16 { margin-bottom: 16px; }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- ===== شاشة تسجيل الدخول ===== -->
    <div id="loginOverlay">
        <div class="login-box">
            <div class="login-logo">
                <span class="logo-icon">⚓</span>
                <span class="logo-text">منظومة الوسائل البحرية</span>
            </div>
            <p class="subtitle">نظام متابعة وإدارة الأسطول البحري</p>
            <div class="developer">
                <span class="dev-label">الوكيل</span>
                <span class="dev-name">أمان الله ناجي</span>
            </div>
            <div class="input-group">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="username" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password" required>
            </div>
            <button type="button" class="login-btn" id="loginButton">
                <span id="loginButtonIcon">🚀</span>
                <span id="loginButtonText">دخول</span>
                <span class="spinner"></span>
            </button>
            <div id="loginError" class="error-msg" role="alert"></div>
            <div class="login-footer">
                <span>نظام إدارة وإسناد الوحدات البحرية</span>
                <span class="version">v5.1</span>
            </div>
        </div>
    </div>

    <!-- ===== التطبيق الرئيسي ===== -->
    <div id="mainApp" style="display:none;">
        <header>
            <div class="header-left">
                <span class="menu-toggle" onclick="toggleSidebar()">☰</span>
                <h1>
                    <span>⚓</span>
                    منظومة الوسائل البحرية
                    <span class="developer-tag">الوكيل أمان الله ناجي</span>
                </h1>
            </div>
            <div class="header-right">
                <span class="role-badge" id="userRoleDisplay">👤</span>
                <button class="btn-outline-white" onclick="window.print()" title="طباعة">
                    <i class="fas fa-print"></i>
                </button>
                <button class="btn-outline-white" onclick="refreshAllPages()" title="تحديث">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button class="btn-outline-white btn-logout" onclick="doLogout()" title="تسجيل الخروج">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <span>⚓</span>
                <span>الأسطول البحري</span>
            </div>
            <button class="nav-btn active" onclick="showPage('dashboard')">
                <i class="fas fa-chart-pie"></i> لوحة التحكم
            </button>
            <button class="nav-btn" onclick="showPage('fleet')">
                <i class="fas fa-ship"></i> الأسطول
            </button>
            <button class="nav-btn" onclick="showPage('maintenance')">
                <i class="fas fa-wrench"></i> الصيانة
            </button>
            <button class="nav-btn" onclick="showPage('efficiency')">
                <i class="fas fa-chart-line"></i> الجاهزية
            </button>
            <button class="nav-btn" onclick="showPage('support')">
                <i class="fas fa-headset"></i> الدعم
            </button>
            <button class="nav-btn" onclick="showPage('users')">
                <i class="fas fa-users"></i> المستخدمين
            </button>
            <button class="nav-btn" onclick="showPage('notes')">
                <i class="fas fa-sticky-note"></i> Note Verbale
            </button>
            <button class="nav-btn" onclick="showPage('sessions')">
                <i class="fas fa-users-cog"></i> المراقبة
            </button>
            <button class="nav-btn" onclick="showPage('ai-assistant')">
                <i class="fas fa-robot"></i> 🤖 المساعد الذكي
            </button>
            <button class="nav-btn" onclick="showPage('logs')">
                <i class="fas fa-history"></i> السجلات
            </button>
            <div class="sidebar-footer">
                <span>الوكيل أمان الله ناجي</span>
            </div>
        </nav>

        <div class="main-content">
            <div id="pageContainer">
                <div class="page active" id="page-dashboard">
                    <div class="text-center" style="padding:40px;">
                        <h2>🚀 جاري تحميل لوحة التحكم...</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== أزرار التمرير ===== -->
    <div class="scroll-buttons">
        <button class="scroll-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">
            <i class="fas fa-chevron-up"></i>
        </button>
        <button class="scroll-btn" onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">
            <i class="fas fa-chevron-down"></i>
        </button>
    </div>

    <!-- ===== الإشعارات ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    📝 JavaScript - جميع المنطق
    ============================================================ -->
    <script>
        /**
         * ============================================================

        async function login(username, password) {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: username.trim(),
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'اسم المستخدم أو كلمة المرور غير صحيحة');
                }

                if (data.token) {
                    localStorage.setItem('authToken', data.token);
                    authToken = data.token;
                }

                if (data.user) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    currentUser = data.user;
                }

                console.log('✅ Login successful:', data.user?.username || data.user?.name);

                return {
                    success: true,
                    user: data.user
                };

            } catch (error) {
                console.error('❌ Login failed:', error);
                return {
                    success: false,
                    error: error.message
                };
            }
        }

        async function handleLogin() {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();
            var errorEl = document.getElementById('loginError');
            var loginBtn = document.getElementById('loginButton');

            errorEl.classList.remove('show');
            errorEl.textContent = '';

            if (!username || !password) {
                errorEl.textContent = '⚠️ يرجى إدخال اسم المستخدم وكلمة المرور';
                errorEl.classList.add('show');
                return;
            }

            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                var result = await login(username, password);

                if (result.success) {
                    showToast('✅ تم تسجيل الدخول بنجاح', 'success');

                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('mainApp').style.display = 'flex';

                    document.getElementById('userRoleDisplay').textContent =
                        '👤 ' + (currentUser.name || currentUser.username) + ' | ' + (currentUser.role || 'مستخدم');

                    await loadAllData();
                    connectSocket();
                    showPage('dashboard');

                } else {
                    errorEl.textContent = '⚠️ ' + (result.error || 'اسم المستخدم أو كلمة المرور غير صحيحة');
                    errorEl.classList.add('show');
                }

            } catch (error) {
                errorEl.textContent = '⚠️ ' + error.message;
                errorEl.classList.add('show');
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        }

        function doLogout() {
            if (socket) {
                socket.disconnect();
                socket = null;
            }

            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            currentUser = null;
            authToken = null;

            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('loginOverlay').style.display = 'flex';

            showToast('👋 تم تسجيل الخروج', 'info');
        }

        // ============================================================
        // 🔌 Socket.IO
        // ============================================================

        function connectSocket() {
            if (socket && socket.connected) return;

            try {
                socket = io({
                    auth: { token: authToken },
                    transports: ['websocket', 'polling']
                });

                socket.on('connect', function() {
                    console.log('✅ متصل بـ Socket.IO');
                    if (currentUser) {
                        socket.emit('user-connected', { userName: currentUser.name || currentUser.username });
                    }
                });

                socket.on('online-users', function(data) {
                    onlineUsers = data.users || [];
                    updateOnlineUsers();
                });

                socket.on('receive-location', function(data) {
                    updateLocation(data);
                });

                socket.on('disconnect', function() {
                    console.log('❌ قطع اتصال Socket.IO');
                });

            } catch (error) {
                console.error('❌ خطأ في Socket.IO:', error);
            }
        }

                        label: 'عدد المراكب',

        function renderEfficiency() {

            document.getElementById('effOk').textContent = ok;
            document.getElementById('effMaint').textContent = maint;
            document.getElementById('effBroken').textContent = broken;
            document.getElementById('effPercent').textContent = percent + '%';

            var ctx = document.getElementById('efficiencyChart');

                if (efficiencyChart) efficiencyChart.destroy();
                efficiencyChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['صالح', 'صيانة', 'معطب'],
                        datasets: [{
                            data: [ok, maint, broken],
                            backgroundColor: ['#27ae60', '#f39c12', '#e74c3c'],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { position: 'bottom' } }
                    }

        async function askAI() {
            var input = document.getElementById('aiInput');
            var chatBox = document.getElementById('aiChatBox');
            var query = input.value.trim();

            if (!query) {
                showToast('⚠️ يرجى كتابة سؤال', 'warning');
                return;
            }

            var userMsg = document.createElement('div');
            userMsg.className = 'msg user';
            userMsg.style.cssText = 'padding:8px 14px;border-radius:12px;margin:6px 0;max-width:85%;background:#0a4b3a;color:white;margin-right:auto;';
            userMsg.innerHTML = '<strong>👤 أنت</strong><p>' + query + '</p><span class="time" style="font-size:10px;opacity:0.6;display:block;margin-top:4px;">' + new Date().toLocaleTimeString('ar') + '</span>';
            chatBox.appendChild(userMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            input.value = '';
            input.disabled = true;

            try {
                var response = await generateAIResponse(query);

                var aiMsg = document.createElement('div');
                aiMsg.className = 'msg ai';
                aiMsg.style.cssText = 'padding:8px 14px;border-radius:12px;margin:6px 0;max-width:85%;background:#f0f4f8;color:#333;margin-left:auto;';
                aiMsg.innerHTML = '<strong>🤖 المساعد الذكي</strong><p>' + response + '</p><span class="time" style="font-size:10px;opacity:0.6;display:block;margin-top:4px;">' + new Date().toLocaleTimeString('ar') + '</span>';
                chatBox.appendChild(aiMsg);
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                showToast('❌ خطأ في معالجة الطلب', 'error');
            } finally {
                input.disabled = false;
                input.focus();
            }
        }

        async function generateAIResponse(query) {
            var q = query.toLowerCase();

            if (q.includes('إحصائيات') || q.includes('الأسطول') || q.includes('عدد المراكب')) {
                var total = vessels.length;
                var ok = vessels.filter(function(v) { return v.stat === 'صالح'; }).length;
                var maint = vessels.filter(function(v) { return v.stat === 'صيانة'; }).length;
                var broken = vessels.filter(function(v) { return v.stat === 'معطب'; }).length;
                var percent = total ? Math.round((ok / total) * 100) : 0;
                return '📊 <b>إحصائيات الأسطول</b><br>🚢 إجمالي المراكب: <b>' + total + '</b><br>✅ الصالح: <b>' + ok + '</b><br>🔧 تحت الصيانة: <b>' + maint + '</b><br>❌ المعطوب: <b>' + broken + '</b><br>📈 نسبة الجاهزية: <b>' + percent + '%</b>';
            }

            if (q.includes('معطوب') || q.includes('عطل') || q.includes('الصيانة')) {
                var broken2 = vessels.filter(function(v) { return v.stat === 'معطب' || v.stat === 'صيانة'; });
                if (!broken2.length) {
                    return '✅ <b>لا توجد مراكب معطوبة حالياً</b><br>جميع المراكب في حالة جيدة.';
                }
                return '🛠️ <b>قائمة المراكب المعطوبة/تحت الصيانة (' + broken2.length + '):</b><br>' +
                    broken2.map(function(v) {
                        return '• ' + v.name + ' (' + (v.num || 'رقم غير محدد') + ') - الحالة: ' + v.stat + (v.break ? ' - العطب: ' + v.break : '');
                    }).join('<br>');
            }

            if (q.includes('جاهزية') || q.includes('نجاعة') || q.includes('نسبة')) {
                var total2 = vessels.length;
                var ok2 = vessels.filter(function(v) { return v.stat === 'صالح'; }).length;
                var percent2 = total2 ? Math.round((ok2 / total2) * 100) : 0;
                var status = percent2 >= 80 ? '🟢 <b>ممتازة</b>' : percent2 >= 60 ? '🟡 <b>جيدة</b>' : '🔴 <b>ضعيفة - تحتاج إلى تحسين</b>';
                return '📈 <b>نسبة الجاهزية: ' + percent2 + '%</b><br>التقييم: ' + status + '<br>✅ الصالح: ' + ok2 + ' من ' + total2;
            }

            if (q.includes('تقرير') || q.includes('صيانة')) {
                var total3 = vessels.length;
                var ok3 = vessels.filter(function(v) { return v.stat === 'صالح'; }).length;
                var maint3 = vessels.filter(function(v) { return v.stat === 'صيانة'; }).length;
                var broken3 = vessels.filter(function(v) { return v.stat === 'معطب'; }).length;
                var percent3 = total3 ? Math.round((ok3 / total3) * 100) : 0;
                return '📋 <b>تقرير حالة الأسطول</b><br>📅 التاريخ: ' + new Date().toLocaleDateString('ar') +
                    '<br>🚢 إجمالي المراكب: ' + total3 +
                    '<br>✅ الصالح: ' + ok3 +
                    '<br>🔧 تحت الصيانة: ' + maint3 +
                    '<br>❌ المعطوب: ' + broken3 +
                    '<br>📈 نسبة الجاهزية: ' + percent3 + '%<br><br>' +
                    (percent3 >= 80 ? '✅ الأسطول في حالة جيدة.' : percent3 >= 60 ? '⚠️ يوصى بإجراء صيانة لبعض المراكب.' : '🚨 يحتاج الأسطول إلى تدخل عاجل!');
            }

            return '📌 <b>معلومات عامة عن الأسطول</b><br>🚢 عدد المراكب: <b>' + vessels.length + '</b><br>👥 عدد المستخدمين: <b>' + users.length +
                '</b><br>📋 عدد التذاكر المفتوحة: <b>' + tickets.filter(function(t) { return t.status !== 'closed'; }).length +
                '</b><br>🟢 المستخدمون المتصلون: <b>' + onlineUsers.length + '</b><br><br>💡 يمكنك طرح أسئلة مثل:<br>• "إحصائيات الأسطول"<br>• "المراكب المعطوبة"<br>• "نسبة الجاهزية"<br>• "تقرير الصيانة"';
        }

            var tbody = document.getElementById('logsTableBody');
            if (!tbody) return;

            if (!logs.length) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#94a3b8;">لا توجد سجلات</td></tr>';
                return;
            }

            tbody.innerHTML = logs.slice(0, 50).map(function(l) {
                return '<tr>' +
                    '<td style="font-size:12px;">' + new Date(l.createdAt).toLocaleDateString('ar') + '</td>' +
                    '<td style="font-size:12px;">' + new Date(l.createdAt).toLocaleTimeString('ar') + '</td>' +
                    '<td>' + (l.user?.name || l.user?.username || l.userName || 'مجهول') + '</td>' +
                    '<td><span class="status-badge active">' + (l.action || 'حدث') + '</span></td>' +
                    '<td style="font-size:13px;text-align:right;">' + (l.details || '') + '</td></tr>';
            }).join('');
        }

        // ============================================================
        // 🛠️ دوال مساعدة
        // ============================================================

        function getCategory(len) {
            var n = parseFloat(len);
            if (n === 11) return "البروق";
            if (n >= 8 && n <= 12) return "صقور";
            if (n > 12 && n <= 25) return "خوافر";
            if (n >= 30) return "طوافات";
            return "زوارق مزدوجة";
        }

        function getPriorityLabel(priority) {
            var map = { 'high': '🔴 عالية', 'medium': '🟡 متوسطة', 'low': '🟢 منخفضة' };
            return map[priority] || '🟡 متوسطة';
        }

        // ============================================================
        // 📍 GPS
        // ============================================================

        function startTracking() {
            if (!navigator.geolocation) {
                showToast('❌ جهازك لا يدعم تحديد الموقع', 'error');
                return;
            }
            if (trackingActive) {
                showToast('⚠️ التتبع مفعل بالفعل', 'warning');
                return;
            }
            trackingActive = true;
            showToast('📍 بدء التتبع المباشر', 'success');

            watchId = navigator.geolocation.watchPosition(
                function(position) {
                    var latitude = position.coords.latitude;
                    var longitude = position.coords.longitude;
                    if (socket && socket.connected) {
                        socket.emit('send-location', {
                            lat: latitude,
                            lng: longitude,
                            userName: currentUser?.name || currentUser?.username || 'مستخدم'
                        });
                    }
                },
                function(error) {
                    console.error('خطأ في تحديد الموقع:', error);
                    showToast('❌ فشل تحديد الموقع: ' + error.message, 'error');
                    stopTracking();
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
            );
        }

        function stopTracking() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            trackingActive = false;
            showToast('⏹️ تم إيقاف التتبع', 'info');
        }

        async function handleAddVessel(e) {
            e.preventDefault();

            var vessel = {
                name: document.getElementById('vesselName').value.trim(),
                num: document.getElementById('vesselNum').value.trim(),
                len: parseFloat(document.getElementById('vesselLen').value),
                reg: document.getElementById('vesselReg').value,
                port: document.getElementById('vesselPort').value.trim(),
                stat: document.getElementById('vesselStatus').value,
                cat: getCategory(parseFloat(document.getElementById('vesselLen').value))
            };

            if (!vessel.name || !vessel.num) {
                showToast('⚠️ يرجى إدخال الاسم والرقم', 'warning');
                return;
            }

            try {
                var response = await fetch('/api/vessels', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + authToken
                    },
                    body: JSON.stringify(vessel)
                });

                if (response.ok) {
                    showToast('✅ تم إضافة المركب', 'success');
                    document.getElementById('vesselForm').reset();
                    await loadVessels();

                    updateDashboard();
                } else {
                    var data = await response.json();
                    showToast('❌ ' + (data.error || 'فشل الإضافة'), 'error');

        }

        // ============================================================

        function showToast(message, type) {
            type = type || 'info';
            var container = document.getElementById('toastContainer');
            if (!container) return;

            var toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            toast.innerHTML = '<span style="font-size:20px;">' + (icons[type] || 'ℹ️') + '</span> ' + message;
            toast.style.cssText = 'padding:14px 20px;border-radius:12px;color:white;font-weight:500;animation:slideUp 0.3s ease;box-shadow:0 8px 30px rgba(0,0,0,0.15);display:flex;align-items:center;gap:10px;background:' +
                (type === 'success' ? '#27ae60' : type === 'error' ? '#e74c3c' : type === 'warning' ? '#f39c12' : '#0a4b3a') + ';';
            container.appendChild(toast);

            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(function() { toast.remove(); }, 300);
            }, 4000);
        }
