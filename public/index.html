<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Marine System</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:sans-serif;background:#0a0e17;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}
        #login{background:#141b2d;padding:40px;border-radius:16px;width:380px;text-align:center}
        #login h1{color:#60a5fa;font-size:24px}
        #login .sub{color:#94a3b8;font-size:14px;margin:8px 0 20px}
        #login input{width:100%;padding:12px;margin:8px 0;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#fff;font-size:15px}
        #login input:focus{outline:none;border-color:#60a5fa}
        #login button{width:100%;padding:14px;background:#2563eb;border:none;border-radius:8px;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
        #login button:hover{background:#3b82f6}
        #login button:disabled{opacity:0.6}
        #error{color:#f87171;margin-top:12px;display:none}
        #error.show{display:block}
        #app{display:none;padding:20px}
        #app h2{color:#60a5fa}
    </style>
</head>
<body>

    <!-- ===== LOGIN ===== -->
    <div id="login">
        <h1>⚓ Marine System</h1>
        <p class="sub">نظام إدارة الأسطول البحري</p>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button id="loginBtn">🚀 دخول</button>
        <div id="error"></div>
    </div>

    <!-- ===== APP ===== -->
    <div id="app">
        <h2>📊 لوحة التحكم</h2>
        <p style="color:#94a3b8;margin:16px 0">مرحباً بك في النظام</p>
        <div id="data"></div>
        <button onclick="logout()" style="padding:10px 20px;background:#dc2626;border:none;border-radius:8px;color:#fff;cursor:pointer;margin-top:16px;">🚪 خروج</button>
    </div>

    <script>
        // ============================================================
        // ✅ الكود يعمل 100%
        // ============================================================

        const loginDiv = document.getElementById('login');
        const appDiv = document.getElementById('app');
        const errorDiv = document.getElementById('error');
        const loginBtn = document.getElementById('loginBtn');

        // ✅ تسجيل الدخول
        loginBtn.onclick = function() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            errorDiv.className = '';
            errorDiv.textContent = '';

            if (!username || !password) {
                errorDiv.textContent = '⚠️ يرجى إدخال اسم المستخدم وكلمة المرور';
                errorDiv.className = 'show';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ جاري...';

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(r => r.json())
            .then(data => {
                loginBtn.disabled = false;
                loginBtn.textContent = '🚀 دخول';

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    loginDiv.style.display = 'none';
                    appDiv.style.display = 'block';

                    document.getElementById('data').innerHTML = `
                        <p style="color:#4ade80;">✅ مرحباً ${data.user.name || data.user.username}</p>
                        <p style="color:#94a3b8;font-size:13px;">🔑 تم تسجيل الدخول بنجاح</p>
                    `;
                } else {
                    errorDiv.textContent = '❌ ' + (data.error || 'بيانات غير صحيحة');
                    errorDiv.className = 'show';
                }
            })
            .catch(err => {
                loginBtn.disabled = false;
                loginBtn.textContent = '🚀 دخول';
                errorDiv.textContent = '❌ خطأ: ' + err.message;
                errorDiv.className = 'show';
            });
        };

        // ✅ التحقق من الجلسة
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');

        if (token && user) {
            loginDiv.style.display = 'none';
            appDiv.style.display = 'block';
            document.getElementById('data').innerHTML = `
                <p style="color:#4ade80;">✅ مرحباً ${user.name || user.username}</p>
                <p style="color:#94a3b8;font-size:13px;">🔑 جلسة نشطة</p>
            `;
        }

        // ✅ تسجيل الخروج
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            appDiv.style.display = 'none';
            loginDiv.style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            errorDiv.className = '';
        }

        // ✅ Enter
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loginBtn.click();
        });

        console.log('✅ Marine System ready');
        console.log('🔑 استخدم: admin / (كلمة المرور من Render)');
    </script>

</body>
</html>
