<!-- ============================================================

     ============================================================ -->

<div id="loginOverlay">

    <div class="login-box">

        <div class="login-logo">

            <span class="logo-icon">⚓</span>

            <span class="logo-text">
                منظومة الوسائل البحرية

        </div>

        <p class="subtitle">
            نظام متابعة وإدارة الأسطول البحري

        <div class="developer">

            <span class="dev-label">
                الوكيل
            </span>

            <span class="dev-name">
                أمان الله ناجي
            </span>

        </div>

        <!-- ====================================================
             Username
             ==================================================== -->

        <div class="input-group">

            <i class="fas fa-user input-icon"></i>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="اسم المستخدم"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                maxlength="100"
            >

        </div>

        <!-- ====================================================
             Password
             ==================================================== -->

        <div class="input-group">

            <i class="fas fa-lock input-icon"></i>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="كلمة المرور"
                autocomplete="current-password"
                maxlength="200"
            >

        </div>

        <!-- ====================================================
             Login Button
             ==================================================== -->

        <button
            type="button"
            id="loginButton"
            class="login-btn"
            onclick="submitLogin()"
        >
            <span>🚀</span>
            دخول
        </button>

        <!-- ====================================================
             Login Error
             ==================================================== -->

        <div
            id="loginError"
            class="error-msg"
            role="alert"
            aria-live="polite"
        ></div>

        <!-- ====================================================
             Footer
             ==================================================== -->

        <div class="login-footer">

            <span>
                نظام إدارة وإسناد الوحدات البحرية
            </span>

            <span class="version">
                v3.0
            </span>

        </div>

    </div>

</div>

<!-- ============================================================
     Login Controller
     ============================================================ -->

<script>

(function () {

    'use strict';


    function getElement(id) {

        return document.getElementById(id);

    }


    function setLoginState(loading) {

        const button =
            getElement('loginButton');

        if (!button) return;


        button.disabled = loading;

        button.innerHTML = loading
            ? '<span>⏳</span> جاري تسجيل الدخول...'
            : '<span>🚀</span> دخول';

    }


    function showLoginError(message) {

        const error =
            getElement('loginError');

        if (!error) return;


        error.textContent =
            message || 'فشل تسجيل الدخول';

        error.style.display =
            'block';

    }


    function clearLoginError() {

        const error =
            getElement('loginError');

        if (!error) return;


        error.textContent = '';

        error.style.display =
            'none';

    }


    window.submitLogin = async function () {

        clearLoginError();


        const username =
            getElement('username')?.value.trim();

        const password =
            getElement('password')?.value;


        if (!username) {

            showLoginError(
                'يرجى إدخال اسم المستخدم'
            );

            getElement('username')?.focus();

            return;

        }


        if (!password) {

            showLoginError(
                'يرجى إدخال كلمة المرور'
            );

            getElement('password')?.focus();

            return;

        }


        if (
            typeof window.auth === 'undefined'
        ) {

            showLoginError(
                'خطأ: نظام المصادقة لم يتم تحميله'
            );

            console.error(
                '❌ window.auth غير موجود'
            );

            return;

        }


        if (
            typeof window.API === 'undefined'
        ) {

            showLoginError(
                'خطأ: API لم يتم تحميله'
            );

            console.error(
                '❌ window.API غير موجود'
            );

            return;

        }


        try {

            setLoginState(true);


            /*
             * لا نستعمل doLogin() هنا حتى لا يحدث
             * redirect إلى /dashboard.
             *
             * نستعمل AuthManager مباشرة.
             */

            const response =
                await window.auth.login(
                    username,
                    password
                );


            if (
                !response ||
                !response.token
            ) {

                throw new Error(
                    'الخادم لم يرجع رمز المصادقة'
                );

            }


            /*
             * إظهار التطبيق مباشرة
             */

            const overlay =
                getElement('loginOverlay');

            const mainApp =
                getElement('mainApp');


            if (overlay) {

                overlay.style.display =
                    'none';

            }


            if (mainApp) {

                mainApp.style.display =
                    'block';

            }


            /*
             * تحديث معلومات المستخدم
             */

            if (
                typeof window.auth.displayUserInfo ===
                'function'
            ) {

                window.auth.displayUserInfo();

            }


            /*
             * تحديث الدور في الهيدر
             */

            const roleDisplay =
                getElement(
                    'userRoleDisplay'
                );


            if (
                roleDisplay &&
                window.auth.user
            ) {

                const roleNames = {

                    admin: '👑 مدير النظام',

                    manager: '🛡️ مدير',

                    viewer: '👤 مشاهد'

                };


                roleDisplay.textContent =
                    roleNames[
                        window.auth.user.role
                    ] ||
                    '👤 ' +
                    (
                        window.auth.user.role ||
                        'مستخدم'
                    );

            }


            /*
             * تشغيل الصفحة الرئيسية
             */

            if (
                typeof window.showPage ===
                'function'
            ) {

                window.showPage(
                    'dashboard'
                );

            }


            console.log(
                '✅ تم الدخول بنجاح'
            );


        } catch (error) {

            console.error(
                '❌ Login failed:',
                error
            );


            showLoginError(
                error?.message ||
                'اسم المستخدم أو كلمة المرور غير صحيحة'
            );


        } finally {

            setLoginState(false);

        }

    };


    /*
     * الضغط على Enter
     */

    document.addEventListener(
        'keydown',
        function (event) {

            if (
                event.key === 'Enter' &&
                (
                    document.activeElement?.id ===
                    'username' ||
                    document.activeElement?.id ===
                    'password'
                )
            ) {

                event.preventDefault();

                window.submitLogin();

            }

        }
    );


})();

</script>


<!-- ============================================================
     Session Bootstrap
     ============================================================ -->

<script>

document.addEventListener(
    'DOMContentLoaded',
    function () {

        /*
         * إذا كانت هناك جلسة محفوظة،
         * لا نعرض شاشة الدخول.
         */

        if (
            window.auth &&
            window.auth.isAuthenticated
        ) {

            const overlay =
                document.getElementById(
                    'loginOverlay'
                );

            const mainApp =
                document.getElementById(
                    'mainApp'
                );


            if (overlay) {

                overlay.style.display =
                    'none';

            }


            if (mainApp) {

                mainApp.style.display =
                    'block';

            }


            if (
                typeof window.showPage ===
                'function'
            ) {

                window.showPage(
                    'dashboard'
                );

            }

        }

    }
);

</script>
