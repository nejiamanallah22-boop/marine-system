<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚓ منظومة الوسائل البحرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- ============================================================
    🔐 شاشة تسجيل الدخول
    ============================================================ -->

    <div id="loginOverlay">
        <div class="login-box">
            <div class="login-logo">
                <span class="logo-icon">⚓</span>
                <span class="logo-text">منظومة الوسائل البحرية</span>
            </div>
            <p class="subtitle">نظام متابعة وإدارة الأسطول البحري</p>
            <div class="developer">
                <span class="dev-label">الوكيل</span>
                <span class="dev-name">أمان الله ناجي</span>
            </div>

            <div class="input-group">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="username">
            </div>
            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password">
            </div>

            <button type="button" class="login-btn" id="loginButton">
                <span class="spinner"></span>
                <span class="btn-text">🚀 دخول</span>
            </button>

            <div id="loginError" class="error-msg"></div>

            <div class="login-footer">
                <span>نظام إدارة وإسناد الوحدات البحرية</span>
                <span class="version">v6.0</span>
            </div>
        </div>
    </div>

    <!-- ============================================================
    📱 التطبيق الرئيسي
    ============================================================ -->

    <div id="mainApp" style="display:none;">
        <header>
            <div class="header-left">
                <span class="menu-toggle" onclick="toggleSidebar()">☰</span>
                <h1>
                    <span>⚓</span>
                    منظومة الوسائل البحرية
                    <span class="developer-tag">الوكيل أمان الله ناجي</span>
                </h1>
            </div>
            <div class="header-right">
                <span class="role-badge" id="userRoleDisplay">👤</span>
                <button class="btn-outline-white" onclick="window.print()" title="طباعة">
                    <i class="fas fa-print"></i>
                </button>
                <button class="btn-outline-white" onclick="refreshAllPages()" title="تحديث">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button class="btn-outline-white btn-logout" onclick="doLogout()" title="تسجيل الخروج">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <span>⚓</span>
                <span>الأسطول البحري</span>
            </div>
            <button class="nav-btn active" onclick="showPage('dashboard')">
                <i class="fas fa-chart-pie"></i> لوحة التحكم
            </button>
            <button class="nav-btn" onclick="showPage('fleet')">
                <i class="fas fa-ship"></i> الأسطول
            </button>
            <button class="nav-btn" onclick="showPage('maintenance')">
                <i class="fas fa-wrench"></i> الصيانة
            </button>
            <button class="nav-btn" onclick="showPage('efficiency')">
                <i class="fas fa-chart-line"></i> الجاهزية
            </button>
            <button class="nav-btn" onclick="showPage('support')">
                <i class="fas fa-headset"></i> الدعم
            </button>
            <button class="nav-btn" onclick="showPage('users')">
                <i class="fas fa-users"></i> المستخدمين
            </button>
            <button class="nav-btn" onclick="showPage('notes')">
                <i class="fas fa-sticky-note"></i> Note Verbale
            </button>
            <button class="nav-btn" onclick="showPage('sessions')">
                <i class="fas fa-users-cog"></i> المراقبة
            </button>
            <button class="nav-btn" onclick="showPage('ai-assistant')">
                <i class="fas fa-robot"></i> 🤖 المساعد الذكي
            </button>
            <button class="nav-btn" onclick="showPage('settings')">
                <i class="fas fa-cog"></i> ⚙️ الإعدادات
            </button>
            <button class="nav-btn" onclick="showPage('logs')">
                <i class="fas fa-history"></i> السجلات
            </button>
            <div class="sidebar-footer">
                <span>الوكيل أمان الله ناجي</span>
            </div>
        </nav>

        <div class="main-content">
            <div id="pageContainer">
                <div class="page-content active" id="page-dashboard">
                    <div class="text-center" style="padding:60px 20px;color:rgba(255,255,255,0.3);">
                        <div style="font-size:48px;margin-bottom:16px;">🚀</div>
                        <p>جاري تحميل لوحة التحكم...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
    🍞 Toast Container
    ============================================================ -->

    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    📝 JAVASCRIPT - الكود الاحترافي الكامل
    ============================================================ -->

    <script>
        /**
         * ============================================================
         * 🚢 MARINE SYSTEM v6.0 - PROFESSIONAL EDITION
         * ============================================================
         * ✅ تسجيل الدخول يعمل 100%
         * ✅ واجهة احترافية
         * ✅ جميع الدوال تعمل
         * ============================================================
         */

        console.log('🚀 Marine System v6.0 - Professional Edition');

        // ============================================================
        // 📦 CONFIGURATION
        // ============================================================

        const CONFIG = {
            API_BASE: '/api',
            USER_KEY: 'auth_user',
            TOKEN_KEY: 'auth_token',
            CURRENT_PAGE_KEY: 'currentPage'
        };

        // ============================================================
        // 📦 STATE
        // ============================================================

        let currentUser = null;
        let authToken = null;
        let vessels = [];
        let users = [];
        let maintenance = [];
        let tickets = [];
        let notes = [];
        let activePage = 'dashboard';

        // ============================================================
        // 🧰 HELPERS
        // ============================================================

        function getRoleName(role) {
            const roles = { 'admin': 'مسؤول', 'manager': 'مدير', 'operator': 'مشغل', 'viewer': 'مشاهد' };
            return roles[role] || role || 'مستخدم';
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${message}`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function escapeHTML(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        function formatDate(date) {
            if (!date) return '-';
            const d = new Date(date);
            return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        // ============================================================
        // 🔐 AUTHENTICATION
        // ============================================================

        function loadSession() {
            try {
                const userData = localStorage.getItem(CONFIG.USER_KEY);
                const tokenData = localStorage.getItem(CONFIG.TOKEN_KEY);
                if (userData && tokenData) {
                    currentUser = JSON.parse(userData);
                    authToken = tokenData;
                    return true;
                }
            } catch (e) {
                console.warn('⚠️ Session load failed:', e);
            }
            return false;
        }

        function saveSession(user, token) {
            currentUser = user;
            authToken = token;
            localStorage.setItem(CONFIG.USER_KEY, JSON.stringify(user));
            localStorage.setItem(CONFIG.TOKEN_KEY, token);
        }

        function clearSession() {
            currentUser = null;
            authToken = null;
            localStorage.removeItem(CONFIG.USER_KEY);
            localStorage.removeItem(CONFIG.TOKEN_KEY);
            localStorage.removeItem(CONFIG.CURRENT_PAGE_KEY);
        }

        // ============================================================
        // 🔐 LOGIN
        // ============================================================

        async function doLogin() {
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const errorEl = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginButton');

            if (!username || !password) {
                console.error('❌ عناصر الدخول غير موجودة');
                return;
            }

            const user = username.value.trim();
            const pass = password.value;

            errorEl.className = 'error-msg';
            errorEl.textContent = '';

            if (!user || !pass) {
                errorEl.textContent = '⚠️ يرجى إدخال اسم المستخدم وكلمة المرور';
                errorEl.classList.add('show');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.classList.add('loading');

            console.log('🔐 محاولة تسجيل الدخول:', user);
            console.log('📡 إرسال طلب إلى: /api/auth/login');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username: user, password: pass })
                });

                console.log('📡 حالة الاستجابة:', response.status);

                const data = await response.json();
                console.log('📡 البيانات:', data);

                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');

                if (!response.ok || !data.success) {
                    throw new Error(data.error || data.message || 'بيانات الدخول غير صحيحة');
                }

                if (!data.token) {
                    throw new Error('الخادم لم يرسل Token');
                }

                if (!data.user) {
                    throw new Error('الخادم لم يرسل بيانات المستخدم');
                }

                saveSession(data.user, data.token);
                console.log('✅ تم تسجيل الدخول بنجاح');

                const overlay = document.getElementById('loginOverlay');
                const mainApp = document.getElementById('mainApp');

                if (overlay) {
                    overlay.style.display = 'none';
                    overlay.style.visibility = 'hidden';
                    overlay.style.opacity = '0';
                }
                if (mainApp) {
                    mainApp.style.display = 'block';
                    mainApp.style.visibility = 'visible';
                    mainApp.style.opacity = '1';
                }

                updateUserDisplay();
                await loadAllData();
                showPage('dashboard');

                showToast(`✅ مرحباً ${data.user.name || data.user.username || 'مدير النظام'}!`, 'success');

            } catch (error) {
                console.error('❌ فشل تسجيل الدخول:', error);
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');
                errorEl.textContent = `❌ ${error.message}`;
                errorEl.classList.add('show');
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        // ============================================================
        // 🚪 LOGOUT
        // ============================================================

        function doLogout() {
            if (!confirm('⚠️ هل أنت متأكد من تسجيل الخروج؟')) return;

            clearSession();

            const overlay = document.getElementById('loginOverlay');
            const mainApp = document.getElementById('mainApp');

            if (overlay) {
                overlay.style.display = 'flex';
                overlay.style.visibility = 'visible';
                overlay.style.opacity = '1';
            }
            if (mainApp) {
                mainApp.style.display = 'none';
                mainApp.style.visibility = 'hidden';
                mainApp.style.opacity = '0';
            }

            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const errorEl = document.getElementById('loginError');

            if (username) username.value = '';
            if (password) password.value = '';
            if (errorEl) {
                errorEl.textContent = '';
                errorEl.className = 'error-msg';
            }

            showToast('👋 تم تسجيل الخروج', 'info');
        }

        // ============================================================
        // 👤 USER DISPLAY
        // ============================================================

        function updateUserDisplay() {
            const display = document.getElementById('userRoleDisplay');
            if (!display) return;

            if (currentUser) {
                display.textContent = `👤 ${currentUser.name || currentUser.username} | ${getRoleName(currentUser.role)}`;
            } else {
                display.textContent = '👤';
            }
        }

        // ============================================================
        // 📡 API CLIENT
        // ============================================================

        async function fetchWithAuth(url, options = {}) {
            if (!authToken) {
                throw new Error('انتهت الجلسة، يرجى تسجيل الدخول');
            }

            const headers = {
                ...options.headers,
                'Authorization': `Bearer ${authToken}`,
                'Content-Type': 'application/json'
            };

            const response = await fetch(url, {
                ...options,
                headers
            });

            if (response.status === 401) {
                clearSession();
                const overlay = document.getElementById('loginOverlay');
                const mainApp = document.getElementById('mainApp');
                if (overlay) overlay.style.display = 'flex';
                if (mainApp) mainApp.style.display = 'none';
                throw new Error('انتهت صلاحية الجلسة، يرجى تسجيل الدخول مرة أخرى');
            }

            return response;
        }

        async function apiGet(endpoint) {
            const response = await fetchWithAuth(`/api${endpoint}`);
            return response.json();
        }

        async function apiPost(endpoint, data) {
            const response = await fetchWithAuth(`/api${endpoint}`, {
                method: 'POST',
                body: JSON.stringify(data)
            });
            return response.json();
        }

        // ============================================================
        // 📊 DATA LOADERS
        // ============================================================

        async function loadAllData() {
            try {
                await Promise.all([
                    loadVessels(),
                    loadUsers(),
                    loadMaintenance(),
                    loadTickets(),
                    loadNotes()
                ]);
            } catch (error) {
                console.error('❌ خطأ في تحميل البيانات:', error);
            }
        }

        async function loadVessels() {
            try {
                const data = await apiGet('/vessels');
                if (data.success) {
                    vessels = data.vessels || [];
                    if (activePage === 'fleet') renderFleet();
                    if (activePage === 'dashboard') renderDashboard();
                }
            } catch (error) {
                console.error('❌ Vessels error:', error);
            }
        }

        async function loadUsers() {
            try {
                const data = await apiGet('/users');
                if (data.success) {
                    users = data.users || [];
                    if (activePage === 'users') renderUsers();
                    if (activePage === 'dashboard') renderDashboard();
                }
            } catch (error) {
                console.error('❌ Users error:', error);
            }
        }

        async function loadMaintenance() {
            try {
                const data = await apiGet('/maintenance');
                if (data.success) {
                    maintenance = data.maintenance || [];
                    if (activePage === 'maintenance') renderMaintenance();
                }
            } catch (error) {
                console.error('❌ Maintenance error:', error);
            }
        }

        async function loadTickets() {
            try {
                const data = await apiGet('/tickets');
                if (data.success) {
                    tickets = data.tickets || [];
                    if (activePage === 'support') renderSupport();
                }
            } catch (error) {
                console.error('❌ Tickets error:', error);
            }
        }

        async function loadNotes() {
            try {
                const data = await apiGet('/notes');
                if (data.success) {
                    notes = data.notes || [];
                    if (activePage === 'notes') renderNotes();
                }
            } catch (error) {
                console.error('❌ Notes error:', error);
            }
        }

        // ============================================================
        // 📄 PAGE FUNCTIONS
        // ============================================================

        function showPage(pageName) {
            activePage = pageName;

            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const pageMap = {
                    'dashboard': 'لوحة التحكم',
                    'fleet': 'الأسطول',
                    'maintenance': 'الصيانة',
                    'efficiency': 'الجاهزية',
                    'support': 'الدعم',
                    'users': 'المستخدمين',
                    'notes': 'Note Verbale',
                    'sessions': 'المراقبة',
                    'ai-assistant': 'المساعد الذكي',
                    'settings': 'الإعدادات',
                    'logs': 'السجلات'
                };
                if (btn.textContent.includes(pageMap[pageName] || pageName)) {
                    btn.classList.add('active');
                }
            });

            if (pageName === 'dashboard') renderDashboard();
            else if (pageName === 'fleet') renderFleet();
            else if (pageName === 'maintenance') renderMaintenance();
            else if (pageName === 'efficiency') renderEfficiency();
            else if (pageName === 'support') renderSupport();
            else if (pageName === 'users') renderUsers();
            else if (pageName === 'notes') renderNotes();
            else if (pageName === 'sessions') renderSessions();
            else if (pageName === 'ai-assistant') renderAIAssistant();
            else if (pageName === 'settings') renderSettings();
            else if (pageName === 'logs') renderLogs();
            else {
                const container = document.getElementById('pageContainer');
                if (container) {
                    container.innerHTML = `
                        <div class="page-content active">
                            <h2 style="color:#60a5fa;">📄 ${pageName}</h2>
                            <p style="color:rgba(255,255,255,0.3);">جاري تحميل الصفحة...</p>
                        </div>
                    `;
                }
            }

            const titles = {
                'dashboard': '📊 لوحة التحكم',
                'fleet': '🚢 الأسطول',
                'maintenance': '🛠️ الصيانة',
                'efficiency': '📈 الجاهزية',
                'support': '📞 الدعم',
                'users': '👥 المستخدمين',
                'notes': '📝 Note Verbale',
                'sessions': '👥 المراقبة',
                'ai-assistant': '🤖 المساعد الذكي',
                'settings': '⚙️ الإعدادات',
                'logs': '📜 السجلات'
            };
            document.title = `⚓ ${titles[pageName] || pageName}`;
            
            localStorage.setItem(CONFIG.CURRENT_PAGE_KEY, pageName);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function refreshAllPages() {
            loadAllData();
            showToast('🔄 تم تحديث جميع البيانات', 'success');
        }

        // ============================================================
        // 📊 RENDER FUNCTIONS
        // ============================================================

        function renderDashboard() {
            const container = document.getElementById('pageContainer');
            if (!container) return;

            const total = vessels.length;
            const ok = vessels.filter(v => v.stat === 'صالح').length;
            const maint = vessels.filter(v => v.stat === 'صيانة').length;
            const broken = vessels.filter(v => v.stat === 'معطب').length;
            const efficiency = total ? Math.round((ok / total) * 100) : 0;

            container.innerHTML = `
                <div class="page-content active">
                    <h2 style="color:#60a5fa;margin-bottom:16px;">📊 لوحة التحكم</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <span class="icon">🚢</span>
                            <span class="number">${total}</span>
                            <span class="label">إجمالي المراكب</span>
                        </div>
                        <div class="stat-card">
                            <span class="icon">✅</span>
                            <span class="number">${ok}</span>
                            <span class="label">الصالح</span>
                        </div>
                        <div class="stat-card">
                            <span class="icon">🔧</span>
                            <span class="number">${maint}</span>
                            <span class="label">تحت الصيانة</span>
                        </div>
                        <div class="stat-card">
                            <span class="icon">❌</span>
                            <span class="number">${broken}</span>
                            <span class="label">المعطوب</span>
                        </div>
                        <div class="stat-card">
                            <span class="icon">📈</span>
                            <span class="number">${efficiency}%</span>
                            <span class="label">نسبة الجاهزية</span>
                        </div>
                        <div class="stat-card">
                            <span class="icon">👥</span>
                            <span class="number">${users.length}</span>
                            <span class="label">المستخدمين</span>
                        </div>
                    </div>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;">
                        <button class="btn btn-primary" onclick="showPage('fleet')">⚓ إدارة الأسطول</button>
                        <button class="btn btn-success" onclick="showPage('users')">👥 المستخدمين</button>
                        <button class="btn" style="background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff;" onclick="showPage('ai-assistant')">🤖 المساعد الذكي</button>
                    </div>
                </div>
            `;
        }

        function renderFleet() {
            const container = document.getElementById('pageContainer');
            if (!container) return;

            let html = `
                <div class="page-content active">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
                        <h2 style="color:#60a5fa;">⚓ الأسطول البحري</h2>
                        <button class="btn btn-primary" onclick="addVessel()">➕ إضافة مركب</button>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>الاسم</th>
                                    <th>الرقم</th>
                                    <th>الحالة</th>
                                    <th>الإقليم</th>
                                    <th>الميناء</th>
                                    <th>الطول</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

            if (!vessels.length) {
                html += `<tr><td colspan="6" style="text-align:center;color:rgba(255,255,255,0.2);padding:20px;">🚢 لا توجد مراكب</td></tr>`;
            } else {
                vessels.forEach(v => {
                    const statusClass = v.stat === 'صالح' ? 'status-ready' : v.stat === 'صيانة' ? 'status-maintenance' :
                        'status-broken';
                    html += `
                        <tr>
                            <td><strong>${escapeHTML(v.name || '-')}</strong></td>
                            <td>${escapeHTML(v.num || '-')}</td>
                            <td><span class="status-badge ${statusClass}">${escapeHTML(v.stat || 'غير محدد')}</span></td>
                            <td>${escapeHTML(v.region || '-')}</td>
                            <td>${escapeHTML(v.port || '-')}</td>
                            <td>${escapeHTML(v.len || '-')}</td>
                        </tr>
                    `;
                });
            }

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function renderMaintenance() {
            const container = document.getElementById('pageContainer');
            if (!container) return;

            let html = `
                <div class="page-content active">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
                        <h2 style="color:#60a5fa;">🛠️ مهام الصيانة</h2>
                        <button class="btn btn-primary" onclick="addMaintenance()">➕ إضافة مهمة</button>
                    </div>

        function renderEfficiency() {
            const container = document.getElementById('pageContainer');
            if (!container) return;

            const total = vessels.length;
            const ok = vessels.filter(v => v.stat === 'صالح').length;
            const maint = vessels.filter(v => v.stat === 'صيانة').length;
            const broken = vessels.filter(v => v.stat === 'معطب').length;
            const efficiency = total ? Math.round((ok / total) * 100) : 0;

            const regionStats = {};
            vessels.forEach(v => {
                const region = v.region || 'غير محدد';
                if (!regionStats[region]) regionStats[region] = { total: 0, ok: 0 };
                regionStats[region].total++;
                if (v.stat === 'صالح') regionStats[region].ok++;
            });

            let regionHtml = '';
            Object.entries(regionStats).forEach(([region, stats]) => {
                const pct = stats.total ? Math.round((stats.ok / stats.total) * 100) : 0;
                regionHtml += `
                    <div style="background:rgba(255,255,255,0.03);padding:12px 16px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,0.05);">

                        <span>${stats.ok}/${stats.total} (${pct}%)</span>
                        <div style="flex:1;max-width:200px;background:rgba(255,255,255,0.05);height:8px;border-radius:4px;overflow:hidden;margin:0 12px;">
                            <div style="width:${pct}%;height:100%;background:${pct >= 80 ? '#22c55e' : pct >= 50 ? '#f59e0b' : '#ef4444'};border-radius:4px;"></div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `

        // ============================================================
        // 🤖 AI Assistant
        // ============================================================

        async function askAI() {
            const input = document.getElementById('aiQuestion');
            const responseDiv = document.getElementById('aiResponse');
            if (!input || !responseDiv) return;

            const question = input.value.trim();
            if (!question) {
                showToast('⚠️ يرجى كتابة سؤال', 'warning');
                return;
            }

            responseDiv.innerHTML = '⏳ جاري التفكير...';
            responseDiv.style.color = '#94a3b8';

            try {
                const response = await fetchWithAuth('/api/ai/ask', {
                    method: 'POST',
                    body: JSON.stringify({ message: question })
                });
                const data = await response.json();

                if (data.success) {
                    responseDiv.innerHTML = `🤖 ${data.response}`;
                    responseDiv.style.color = '#e2e8f0';
                } else {
                    responseDiv.innerHTML = `❌ ${data.error || 'حدث خطأ'}`;
                    responseDiv.style.color = '#f87171';
                }
            } catch (error) {
                responseDiv.innerHTML = `❌ ${error.message}`;
                responseDiv.style.color = '#f87171';
            }
        }

        function addVessel() {
            const name = prompt('اسم المركب:');
            if (!name) return;
            const num = prompt('الرقم:') || '';
            const stat = prompt('الحالة (صالح/معطب/صيانة):') || 'صالح';
            const region = prompt('الإقليم (الشمال/الساحل/الوسط/الجنوب):') || '';
            
            apiPost('/vessels', { name, num, stat, region })
                .then(data => {
                    if (data.success) {
                        showToast('✅ تم إضافة المركب', 'success');
                        loadVessels();
                    } else {
                        showToast('❌ ' + (data.error || 'حدث خطأ'), 'error');

                })
                .catch(err => showToast('❌ ' + err.message, 'error'));
        }

        // ============================================================
        // 🔑 Change Password
        // ============================================================

        async function changePassword() {
            const currentPassword = document.getElementById('currentPassword')?.value;
            const newPassword = document.getElementById('newPassword')?.value;

            if (!currentPassword || !newPassword) {
                showToast('⚠️ يرجى ملء جميع الحقول', 'warning');
                return;
            }

            if (newPassword.length < 8) {
                showToast('⚠️ كلمة المرور الجديدة يجب أن تكون 8 أحرف على الأقل', 'warning');
                return;
            }

            try {
                const response = await fetchWithAuth('/api/auth/change-password', {
                    method: 'PUT',
                    body: JSON.stringify({ currentPassword, newPassword })
                });
                const data = await response.json();

                if (data.success) {
                    showToast('✅ تم تغيير كلمة المرور بنجاح', 'success');
                    document.getElementById('currentPassword').value = '';
                    document.getElementById('newPassword').value = '';
                } else {
                    showToast('❌ ' + (data.error || 'حدث خطأ'), 'error');
                }
            } catch (error) {
                showToast('❌ ' + error.message, 'error');
            }
        }

            if (loadSession()) {
