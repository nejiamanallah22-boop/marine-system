<!-- public/reset-password.html -->
<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔑 إعادة تعيين كلمة المرور - منظومة الوسائل البحرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0a1628;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            direction: rtl;
        }
        body::before {
            content: '';
            position: fixed;
            inset: -50%;
            background: radial-gradient(ellipse at 20% 50%, rgba(14,165,233,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(230,179,30,0.04) 0%, transparent 60%);
            animation: bgPulse 12s ease-in-out infinite;
            z-index: -1;
        }
        @keyframes bgPulse {
            0%, 100% { transform: scale(1) rotate(0); }
            50% { transform: scale(1.08) rotate(3deg); }
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 40px 35px;
            animation: slideUp 0.7s cubic-bezier(0.16,1,0.3,1);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header .icon { font-size: 48px; display: block; }
        .header h1 { font-size: 24px; font-weight: 700; color: #f5d76e; margin-top: 8px; }
        .header p { color: rgba(255,255,255,0.3); font-size: 14px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 4px; font-weight: 600; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #f5d76e;
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 4px rgba(245,215,110,0.06);
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.15); }
        .form-group input:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e6b31e, #f5d76e);
            color: #0a1628;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,179,30,0.25);
        }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 14px;
            display: none;
        }
        .message.show { display: block; }
        .message.success { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.1); }
        .message.error { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.1); }

        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(0,0,0,0.15);
            border-top-color: #0a1628;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .btn.loading .spinner { display: inline-block; }
        .btn.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer { text-align: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.04); }
        .footer a { color: rgba(255,255,255,0.3); text-decoration: none; font-size: 13px; }
        .footer a:hover { color: #f5d76e; }

        .info-box {
            background: rgba(230,179,30,0.05);
            border-right: 3px solid #f5d76e;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }
        .info-box strong { color: #f5d76e; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="icon">🔑</span>
            <h1>إعادة تعيين كلمة المرور</h1>
            <p>أدخل كلمة المرور الجديدة لحسابك</p>
        </div>

        <div id="resetForm">
            <div class="info-box">
                <i class="fas fa-info-circle"></i>
                <strong>ملاحظة:</strong> الرابط صالح لمدة <strong>ساعة واحدة</strong> فقط.
            </div>

            <div class="form-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="resetEmail" placeholder="البريد الإلكتروني" readonly>
            </div>
            <div class="form-group">
                <label>🔑 كلمة المرور الجديدة <span style="color:#f87171;">*</span></label>
                <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة (8 أحرف على الأقل)">
            </div>
            <div class="form-group">
                <label>✅ تأكيد كلمة المرور <span style="color:#f87171;">*</span></label>
                <input type="password" id="confirmPassword" placeholder="أعد كتابة كلمة المرور">
            </div>

            <div id="resetMessage" class="message"></div>

            <button class="btn btn-primary" id="resetBtn">
                <span class="btn-text">🔄 إعادة تعيين كلمة المرور</span>
                <span class="spinner"></span>
            </button>

            <div class="footer">
                <a href="/">← العودة إلى تسجيل الدخول</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            console.log('🔑 Reset password page loaded');

            // ✅ استخراج الـ token من الرابط
            function getQueryParams() {
                const params = new URLSearchParams(window.location.search);
                return {
                    token: params.get('token'),
                    email: params.get('email')
                };
            }

            const { token, email } = getQueryParams();

            console.log('📌 Token:', token ? '✅ موجود' : '❌ غير موجود');
            console.log('📌 Email:', email);

            const emailInput = document.getElementById('resetEmail');
            if (emailInput && email) {
                emailInput.value = decodeURIComponent(email);
            }

            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const resetBtn = document.getElementById('resetBtn');
            const messageDiv = document.getElementById('resetMessage');

            // ✅ التحقق من وجود التوكن
            if (!token) {
                messageDiv.className = 'message show error';
                messageDiv.textContent = '❌ رابط إعادة التعيين غير صالح أو منتهي الصلاحية';
                resetBtn.disabled = true;
                return;
            }

            // ✅ التحقق من صلاحية التوكن
            async function verifyToken() {
                try {
                    const csrfRes = await fetch('/api/csrf-token', {
                        credentials: 'include',
                        headers: { 'Accept': 'application/json' }
                    });
                    const csrfData = await csrfRes.json();
                    const csrfToken = csrfData.token || '';

                    const response = await fetch('/api/auth/verify-reset-token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-Token': csrfToken,
                            'Accept': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            email: decodeURIComponent(email),
                            token: token
                        })
                    });

                    const data = await response.json();

                    if (!data.success || !data.valid) {
                        messageDiv.className = 'message show error';
                        messageDiv.textContent = '❌ ' + (data.message || 'رابط إعادة التعيين غير صالح');
                        resetBtn.disabled = true;
                        return false;
                    }

                    console.log('✅ Token is valid');
                    return true;
                } catch (error) {
                    console.error('❌ Token verification error:', error);
                    messageDiv.className = 'message show error';
                    messageDiv.textContent = '❌ حدث خطأ في التحقق من الرابط';
                    resetBtn.disabled = true;
                    return false;
                }
            }

            // ✅ إعادة تعيين كلمة المرور
            async function resetPassword() {
                const newPassword = newPasswordInput.value.trim();
                const confirmPassword = confirmPasswordInput.value.trim();

                if (!newPassword || !confirmPassword) {
                    messageDiv.className = 'message show error';
                    messageDiv.textContent = '⚠️ الرجاء إدخال كلمة المرور وتأكيدها';
                    return;
                }

                if (newPassword.length < 8) {
                    messageDiv.className = 'message show error';
                    messageDiv.textContent = '⚠️ كلمة المرور يجب أن تكون 8 أحرف على الأقل';
                    return;
                }

                if (newPassword !== confirmPassword) {
                    messageDiv.className = 'message show error';
                    messageDiv.textContent = '⚠️ كلمة المرور وتأكيدها غير متطابقين';
                    return;
                }

                resetBtn.disabled = true;
                resetBtn.classList.add('loading');
                messageDiv.className = 'message';
                messageDiv.textContent = '';

                try {
                    const csrfRes = await fetch('/api/csrf-token', {
                        credentials: 'include',
                        headers: { 'Accept': 'application/json' }
                    });
                    const csrfData = await csrfRes.json();
                    const csrfToken = csrfData.token || '';

                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-Token': csrfToken,
                            'Accept': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            email: decodeURIComponent(email),
                            token: token,
                            newPassword: newPassword
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        messageDiv.className = 'message show success';
                        messageDiv.textContent = '✅ ' + (data.message || 'تم إعادة تعيين كلمة المرور بنجاح');
                        
                        setTimeout(function() {
                            window.location.href = '/';
                        }, 3000);
                    } else {
                        messageDiv.className = 'message show error';
                        messageDiv.textContent = '❌ ' + (data.error || data.message || 'حدث خطأ في إعادة التعيين');
                    }
                } catch (error) {
                    console.error('❌ Reset password error:', error);
                    messageDiv.className = 'message show error';
                    messageDiv.textContent = '❌ حدث خطأ في الاتصال بالخادم';
                } finally {
                    resetBtn.disabled = false;
                    resetBtn.classList.remove('loading');
                }
            }

            resetBtn.addEventListener('click', resetPassword);

            confirmPasswordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    resetBtn.click();
                }
            });
            newPasswordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    confirmPasswordInput.focus();
                }
            });

            // ✅ التحقق من صلاحية التوكن عند التحميل
            verifyToken();

            console.log('✅ Reset password page ready');

        })();
    </script>

</body>
</html>
