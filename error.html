<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ خطأ - منظومة الوسائل البحرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0a1a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
        }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #ef4444, #f87171);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .icon {
            font-size: 60px;
            margin: 16px 0 24px;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #f5d76e;
        }
        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 24px;
        }
        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e6b31e, #f5d76e);
            color: #0a0a1a;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230, 179, 30, 0.3);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code" id="errorCode">404</div>
        <div class="icon">🔍</div>
        <h1>الصفحة غير موجودة</h1>
        <p id="errorMessage">
            عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها.
        </p>
        <div class="buttons">
            <a href="/" class="btn btn-primary">🏠 العودة للرئيسية</a>
            <button class="btn btn-secondary" onclick="history.back()">↩️ العودة للخلف</button>
        </div>
    </div>
    <script>
        // تحديد رمز الخطأ من URL
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code') || '404';
        const messages = {
            400: 'طلب غير صحيح',
            401: 'غير مصرح بالدخول',
            403: 'ممنوع الوصول',
            404: 'الصفحة غير موجودة',
            500: 'خطأ في الخادم',
            503: 'الخدمة غير متاحة'
        };
        document.getElementById('errorCode').textContent = code;
        document.getElementById('errorMessage').textContent = messages[code] || 'حدث خطأ غير متوقع';
    </script>
</body>
</html>
