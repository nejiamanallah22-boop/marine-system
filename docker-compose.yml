version: '3.8'

services:
  # ============================================================
  # 🗄️ MongoDB
  # ============================================================
  mongodb:
    image: mongo:7.0
    container_name: marine_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: marine
    volumes:
      - mongodb_data:/data/db
      - mongodb_backup:/backup
    networks:
      - marine_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================
  # 🚀 Application
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marine_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/marine?authSource=admin
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./backups:/app/backups
    networks:
      - marine_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # 🔄 Backup Service
  # ============================================================
  backup:
    image: alpine:latest
    container_name: marine_backup
    restart: unless-stopped
    volumes:
      - mongodb_backup:/backup
      - ./backups:/app/backups
    networks:
      - marine_network
    command: |
      sh -c '
        apk add --no-cache mongodb-tools curl
        while true; do
          sleep 86400
          BACKUP_FILE="/backup/marine_$(date +%Y%m%d_%H%M%S).gz"
          mongodump --host mongodb --username admin --password ${MONGODB_PASSWORD} --authenticationDatabase admin --db marine --gzip --archive=${BACKUP_FILE}
          cp ${BACKUP_FILE} /app/backups/
          find /app/backups -name "*.gz" -mtime +7 -delete
        done
      '

volumes:
  mongodb_data:
    driver: local
  mongodb_backup:
    driver: local

networks:
  marine_network:
    driver: bridge
